examples:
  jargon_bad: An agentic LLM-native qual platform leveraging synthetic personas for scalable insight generation.
  jargon_good: A tool where an AI interviewer talks to hundreds of real buyers in a day and sums up what they said.
  jargon_why: the reader is not a researcher
  proof_rule: 'A pilot, a waitlist or a logo on a website is not proof that a product sells: say how many clients or interviews, who pays, the revenue or recurring revenue when public,
    and who reported it.'
  proof_bad: Company X works with leading Fortune 500 brands.
  proof_good: Company X ran 1 million AI interviews for 300 paying clients in 2026 and passed $20M in recurring revenue.
  proof_why: a logo is not a sale
  fresh_bad: Company X raised $30M in 2024
  fresh_good: Company X raised $69M in October 2026, three times its round of a year before
  fresh_est: Company X should reach about $40M of recurring revenue in 2026, against $15M in 2025
  fresh_method: latest company releases, filings, industry reports (ESOMAR, GreenBook), press reports as a cross-check
  not_proof: a pilot is not sales
