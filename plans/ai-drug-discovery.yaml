examples:
  jargon_bad: Equivariant diffusion models for structure-based de novo design against cryptic allosteric pockets.
  jargon_good: AI that draws new molecules shaped to fit a hidden pocket on a disease protein.
  jargon_why: the reader is not a chemist
  proof_rule: 'A partnership "worth up to" a big amount, a computer prediction or a mouse result is not proof that AI makes better drugs: say whether a molecule reached human trials, its phase and result,
    the upfront amount actually paid, and who reported it.'
  proof_bad: Company X signed a $3B deal with a big pharma.
  proof_good: Company X got $45M upfront from a big pharma, with up to $3B more if drugs hit milestones, and its first molecule entered phase 1 in 2026.
  proof_why: the « up to » amount is mostly never paid
  fresh_bad: Company X raised $200M in 2024
  fresh_good: Company X raised $600M in March 2026, its biggest round, two years after a $200M round
  fresh_est: Company X should have three molecules in phase 2 by the end of 2026, against one in 2025
  fresh_method: latest company releases, ClinicalTrials.gov and filings, press reports as a cross-check
  not_proof: an « up to » deal value is not money paid
