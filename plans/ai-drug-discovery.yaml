retarget:
  iv_pipeline:
    title: Which AI-designed drugs are being tested in people today?
    brief: 8 rows = 8 real clinical programs of AI drug discovery companies, whose molecule or target came from the company's AI platform. Rows read "drug or program" + "COMPANY · DISEASE" + stage (PHASE 1
      / PHASE 2 / PHASE 3). Only programs listed on ClinicalTrials.gov, in a filing or in a company release. Not a preclinical program.
  iv_deals:
    title: Which corporate deals shaped the market?
    brief: 6 dated deals between AI drug discovery companies and large groups (pharma discovery partnerships with upfront and milestone amounts, licensing of AI-designed molecules, acquisitions or
      mergers such as Recursion and Exscientia, large strategic investments, IPOs), newest first, with the upfront amount and the total "up to" amount when public.
  iv_fda:
    title: What does it take to turn an AI design into a drug?
    brief: 5 steps from an AI prediction to an approved medicine (for example choosing a target, designing and making the molecule, lab and animal tests, phase 1 safety in people, phase 2 and 3 efficacy
      and approval by the FDA or EMA). Each step in plain words with who decides and a typical duration, and where AI saves time or not.
  iv_safety:
    title: What could go wrong for AI drug discovery?
    brief: 5 risks, each "LABEL" + one sentence with a documented case or a measured figure (for example AI-designed drugs that failed in phase 2, pharma partnerships ended, cash running out before
      clinical data, open models such as AlphaFold 3 or Boltz making a platform less special, data quality and access). Real filings, reports or reported cases only.
extra:
  ed061: 'For AI in drug discovery: the pain points are split into {np} segments ({pains}). Fill the first {np} items with them and leave the others empty ("").'
  ed018: 'This market uses {nv} categories of companies (types of solution): {vals}. The model has 4 slots: answer with a `categories:` list of {nv} items instead (label in capitals on 2 lines, one-line
    description, one emoji each), keep the line "Here, we categorize by type of solution".'
  ed019: 'Here the second categorization is by type of buyer, with the pain-point segments: {pains}.'
signal_angles: AI-designed drugs reaching phase 2 and phase 3 (Insilico rentosertib, Iambic, Recursion, Schrödinger), funding records (Isomorphic Labs, Xaira, Chai Discovery, Pathos AI, Eikon, Enveda),
  pharma deals with upfront and milestone amounts (Eli Lilly, Novartis, Sanofi, AstraZeneca, Bristol Myers Squibb with Isomorphic, Generate, Chai, Iambic), the 2024 Nobel Prize for AlphaFold and protein
  design, open models (AlphaFold 3, Boltz, OpenFold), Nvidia and Lilly AI supercomputers and labs, FDA moves (AI guidance, phasing out animal tests), the number of AI-discovered molecules in clinical trials
  each year, IPOs and share prices (Insilico Hong Kong IPO, Recursion, Absci, Schrödinger), Google searches for AI drug discovery.
killers_brief: 'This file fills the "Startup killers" chapter. It shows SETBACKS, not only failures: shutdowns, bankruptcies, failed or stopped clinical trials, pharma partners that walked away, layoffs,
  mergers forced by cash needs, valuations or share prices that fell, programs cut. Scope: companies whose core product is AI drug discovery (target discovery, molecule and protein design, AI screening,
  repurposing, preclinical prediction), startups first.

  - ed192 and ed195: 12 dated events in all, 2023 to November 2026, oldest first in ed192, newest in ed195. Each text is one sentence of about 110 characters, ending with {1|Source name}. Dates as YYYY
  (MON).

  - ed199p: 6 companies x 5 warning signs. Pick the 5 signs that fit this market (for example: big layoffs, lost independence, CEO left, value fell, drug or trial cut). Each cell is two short lines
  separated by | or empty. Give the website domain of each company.

  - ed200: why AI drug discovery startups fail.

  If you cannot verify enough events for a slide, answer status: no_data for that slide instead of inventing.

  '
