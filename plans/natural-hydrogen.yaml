  and flow or purity results (Gold Hydrogen Ramsay project, HyTerra Kansas, Max Power Lonetree, Helios Aragón Monzón, Hydroma Bourakébougou), the number of exploration licences granted each year
  (South Australia, France, Spain, United States, Morocco), government programs (USGS prospectivity map, ARPA-E awards, US Air Force initiative, French mining code), big groups entering (Fortescue,
