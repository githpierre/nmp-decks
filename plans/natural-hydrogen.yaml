retarget:
  iv_pipeline:
    title: Which natural hydrogen wells have actually been drilled?
    brief: 8 rows = 8 real wells or drilling campaigns aimed at natural or stimulated hydrogen, with a named place (country, region, licence). Rows read "well or project at place" + "COMPANY · PROJECT"
      + stage (DRILLED / TESTING / PRODUCING). Only wells reported by the company, an exchange filing, a regulator or a geological survey. Not a permit alone, not a planned well.
  iv_deals:
    title: Which corporate deals shaped the market?
    brief: 6 dated deals between natural hydrogen companies and large groups (strategic investments by energy majors or miners such as Fortescue, BP, Chevron, Rio Tinto or JERA, takeovers, offtake or
      joint-venture agreements, government awards such as ARPA-E or the US Air Force, exchange listings), newest first, with the amount when public.
  iv_fda:
    title: What does it take to turn a hydrogen find into supply?
    brief: 5 steps from a hydrogen show in a well to gas sold to a customer (for example getting an exploration licence, mapping and soil gas surveys, drilling and flow tests, proving the reservoir
      refills and its size, production licence, separation and a buyer or pipeline). Each step in plain words with who decides and a typical duration, and how far the leading companies are.
  iv_safety:
    title: What could go wrong for natural hydrogen?
    brief: 5 risks, each "LABEL" + one sentence with a documented case or a measured figure (for example dry wells or low flow rates, reservoirs that do not refill fast enough, hydrogen eaten by
      microbes or leaking, rules that do not yet cover hydrogen wells, cheap gas or green hydrogen prices that make the economics weak). Real filings, reports or reported cases only.
