killers_brief: 'This file fills the "Startup killers" chapter. It shows SETBACKS, not only failures: shutdowns, dry or disappointing wells, licences given up or refused, drilling campaigns delayed,
  takeovers forced by cash needs, layoffs, share prices that fell, partners that walked away. Scope: companies whose core product is natural or stimulated geological hydrogen (explorers, field
  developers, subsurface mapping, stimulation), startups first.

  - ed192 and ed195: 12 dated events in all, 2023 to November 2026, oldest first in ed192, newest in ed195. Each text is one sentence of about 110 characters, ending with {1|Source name}. Dates as YYYY
  (MON).

  - ed199p: 6 companies x 5 warning signs. Pick the 5 signs that fit this market (for example: missed deadlines, lost independence, value fell, disappointing well, licence given up). Each cell is two
  short lines separated by | or empty. Give the website domain of each company.

  - ed200: why natural hydrogen startups fail.

  If you cannot verify enough events for a slide, answer status: no_data for that slide instead of inventing.

  '
