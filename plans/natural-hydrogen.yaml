examples:
  jargon_bad: Serpentinization of ultramafic rocks and radiolysis yield H2 trapped beneath evaporite seals.
  jargon_good: Some rocks react with water deep underground and make hydrogen, and salt layers can trap it like a lid.
  jargon_why: the reader is not a geologist
  proof_rule: 'A hydrogen show in a well, a soil gas reading or a resource estimate is not proof of a business: say whether a well flowed hydrogen, at what rate and purity, for how long, whether
    anyone buys it, and who reported it.'
  proof_bad: Company X found a giant hydrogen reservoir.
  proof_good: Company X measured 86 % hydrogen in gas samples from its 2023 wells, but has not yet reported a sustained flow rate.
  proof_why: a gas sample is not a producing well
  fresh_bad: Company X raised $91M in 2023
  fresh_good: Company X raised $36M in May 2026, ten times its seed round of February 2025
  fresh_est: Company X should drill four hydrogen wells in 2026, against one in 2025
  fresh_method: latest company releases and exchange filings, regulator licence lists, press reports as a cross-check
  not_proof: a hydrogen show in a well is not a producing field
