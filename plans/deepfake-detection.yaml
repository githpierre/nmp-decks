    plants, approvals, sales or use instead.'
  ed019: 'Here the second categorization is by type of buyer, with the pain-point segments: {pains}.'
signal_angles: deepfake fraud losses and attack counts (Deloitte, FBI IC3, Pindrop, Sumsub, Entrust), funding rounds of detection startups (Reality Defender, GetReal, Pindrop, Clarity,
  Resemble AI), revenue and client figures, acquisitions by security and identity groups, government contracts and laws (TAKE IT DOWN Act, EU AI Act transparency rules, state laws),
  banks and call centers deploying voice deepfake checks, platform and C2PA provenance adoption. Never Google searches (Google changed how it counts search terms in mid-2025, so recent
  search curves are not real interest).
killers_brief: 'This file fills the "Startup killers" chapter. It shows SETBACKS, not only failures: shutdowns, bankruptcies, failed product launches, data privacy fines, layoffs, sales
  of the company for little, valuations or share prices that fell, products pulled. Scope: companies whose core product detects deepfakes or proves that media is authentic (voice, video,
  images, live calls, identity checks, provenance), startups first.

  - ed192 and ed195: 12 dated events in all, 2022 to November 2026, oldest first in ed192, newest in ed195. Each text is one sentence of about 110 characters, ending with {1|Source name}.
  Dates as YYYY (MON).

  - ed199p: 6 companies x 5 warning signs. Pick the 5 signs that fit this market (for example: big layoffs, data or regulatory trouble, product pulled, value fell, shut down or sold).
  Each cell is two short lines separated by | or empty. Give the website domain of each company.

  - ed200: why deepfake detection startups fail.

  - survivors (for the S11-02 slide « What sets deepfake detection survivors apart from failures? »): 5 rows, each with a lesson (what survivors do, 6 words at most), a one-line explanation,
  one company of ed199p or ed192-ed195 that missed it, and why in 8 words at most, with a source.

  If you cannot verify enough events for a slide, answer status: no_data for that slide instead of inventing.

  '
