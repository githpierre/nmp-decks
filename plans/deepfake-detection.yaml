examples:
  jargon_bad: A multimodal liveness and injection-attack detection layer leveraging spectral artifacts.
  jargon_good: A tool that listens to a phone call and warns the agent when the caller's voice is made by AI.
  jargon_why: the reader is not a security engineer
  proof_rule: 'A demo, a benchmark score or a pilot is not proof that a product sells: say how many clients or calls checked, who pays, the revenue when public, and who reported it.'
  proof_bad: Company X detects deepfakes with 99% accuracy.
  proof_good: Company X screens 10 million calls a month for 8 of the 10 largest US banks.
  proof_why: a lab score is not a sale
  fresh_bad: Company X raised $15M in 2024
  fresh_good: Company X raised $33M in October 2026, its biggest round
  fresh_est: Company X should reach about $30M of revenue in 2026, against $12M in 2025
  fresh_method: latest company releases, filings, government and fraud reports, press reports as a cross-check
  not_proof: a benchmark is not sales
