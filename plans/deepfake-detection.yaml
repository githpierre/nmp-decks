retarget:
  iv_pipeline:
    title: Which deepfake detection products launched recently?
    brief: 8 rows = 8 real deepfake detection products of startups or young companies launched or expanded in the last 12 months (a voice deepfake detector for call centers, a meeting
      plug-in for Zoom or Teams, an identity check against injected video, a media forensics tool for newsrooms, a screening API for platforms, a content provenance service). Rows read
      "product" + "COMPANY · USE" + stage (BETA / LAUNCH / SCALE, 6 characters at most, BETA = in private or public beta, LAUNCH = generally available in the last 12 months, SCALE =
      used by a named large client or with a public usage figure). Only products named in a company release or reputable press.
  iv_deals:
    title: Which corporate deals shaped the market?
    brief: 6 dated deals around deepfake detection companies (acquisitions by security, identity or voice groups, large strategic investments, government contracts such as DARPA or defense,
      IPOs), newest first, with the amount when public.
  iv_fda:
    title: What does it take to win a big security buyer?
    brief: 5 steps from a working detector to one that a bank, a government or a platform buys and keeps (for example independent accuracy tests, security and privacy reviews, a pilot
      on live traffic, integration with call center, meeting or identity tools, then a yearly contract). Each step in plain words with who decides and a typical duration or cost.
  iv_safety:
    title: What could go wrong for deepfake detection?
    brief: 5 risks, each "LABEL" + one sentence with a documented case or a measured figure (for example detectors that fail on new generators, false alarms that block real customers,
      attackers testing against public detectors, AI labs and platforms adding free watermarks, laws that change who must check). Real studies, filings, reports or reported cases only.
extra:
  ed061: The pain points are split into {np} segments ({pains}). Fill the first {np} items with them and leave the others empty ("").
  ed018: 'This market uses {nv} categories of companies (types of solution): {vals}. The model has 4 slots: answer with a `categories:` list of {nv} items instead (label in capitals
    on 2 lines, one-line description, one emoji each), keep the line "Here, we categorize by type of solution".'
