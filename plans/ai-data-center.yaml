retarget:
  iv_pipeline:
    title: Which big AI data center campuses are being built right now?
    brief: 8 rows = 8 real AI data center campuses of companies in this market, with a named place (city or region, country). Rows read "campus, country" + "COMPANY · MAIN TENANT or SIZE (MW or GW)" + stage
      (PLAN / BUILD / LIVE, 6 characters at most). Only campuses with a signed tenant, construction reported on site or capacity already live, from the company, its tenant, a filing, the utility or the
      local authority. Not a memorandum of understanding or a land purchase alone.
  iv_deals:
    title: Which corporate deals shaped the market?
    brief: 6 dated deals between AI data center companies and large groups (multi-year leases with Microsoft, Meta, OpenAI, Google, Amazon, Oracle or Anthropic, acquisitions of data center platforms,
      project financing and joint ventures, power supply deals with utilities, IPOs), newest first, with the amount, the capacity in MW and the length when public.
  iv_fda:
    title: What does it take to turn land into a live AI data center?
    brief: 5 steps from an empty site to a hall full of running AI chips (for example securing land and a grid connection or own power, local permits and zoning, signing an anchor tenant, financing the build
      with project debt, building with liquid cooling and handing over the halls). Each step in plain words with who decides and a typical duration.
  iv_safety:
    title: What could go wrong for AI data center companies?
    brief: 5 risks, each "LABEL" + one sentence with a documented case or a measured figure (for example one tenant taking most of the capacity, tenants cancelling or delaying leases, years of wait for a
      grid connection, local opposition and moratoriums on new sites, heavy project debt, chips changing faster than buildings). Real filings, reports or reported cases only.
