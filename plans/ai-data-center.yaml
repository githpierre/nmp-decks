examples:
  jargon_bad: A 200 MW critical IT load campus with direct-to-chip liquid cooling at 130 kW per rack and N+1 redundancy.
  jargon_good: A site that draws as much power as a city of 150,000 homes, with water pipes running straight onto the chips to keep them cool.
  jargon_why: the reader is not a data center engineer
  proof_rule: 'A planned capacity in gigawatts, a land purchase or a « letter of intent » is not a business: say whether there is a signed lease, its tenant, value and length, how many megawatts are live
    today, and who reported it.'
  proof_bad: Company X plans a 5 GW AI campus in Texas.
  proof_good: Company X signed a 15-year lease with a hyperscaler for 200 MW, and its filing says the first 100 MW went live in 2026.
  proof_why: a planned capacity is not a signed lease
  fresh_bad: Company X had $500M of revenue in 2024
  fresh_good: Company X reported $310M of revenue for its third quarter of 2026, against $120M a year earlier
  fresh_est: Company X should end 2026 near $1.2B of revenue, against $450M in 2025
  fresh_method: latest reported quarter and company guidance, analyst estimates as a cross-check
  not_proof: a planned capacity is not a signed lease
