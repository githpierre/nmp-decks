signal_angles: gigawatt campuses signed or going live (Stargate in Abilene and its other sites, Crusoe, Lancium, Fermi America, Nscale, Fluidstack for Anthropic, Applied Digital), leases signed by
  hyperscalers and AI labs with their value and length, record funding and debt rounds (Crusoe, Nscale, Lambda, Firmus, Lancium, Fermi America IPO, AirTrunk sale), hyperscaler capital spending each quarter
  (Microsoft, Alphabet, Amazon, Meta, Oracle), data center vacancy and leasing records in North America and Europe (CBRE, JLL, datacenterHawk), power deals and gas turbines ordered for data centers, bitcoin
  miners turning sites into AI data centers (Galaxy, Core Scientific, IREN, Cipher, TeraWulf) with their lease values, CoreWeave revenue and backlog each quarter, rack power rising (kW per rack, liquid
  cooling).
killers_brief: 'This file fills the "Startup killers" chapter. It shows SETBACKS, not only failures: tenants lost or leases cancelled, campuses delayed or stopped, local projects rejected or blocked,
  bankruptcies and fire sales, debt in trouble, CEOs who left, layoffs, lawsuits and class actions, valuations or share prices that fell, short-seller reports, outages. Scope: companies whose core product
  is AI data center capacity (AI campuses, powered campuses, AI colocation, modular and edge AI data centers, AI cloud operators with their own campuses), startups first.

  - ed192 and ed195: 12 dated events in all, 2023 to November 2026, oldest first in ed192, newest in ed195. Each text is one sentence of about 110 characters, ending with {1|Source name}. Dates as YYYY
  (MON).

  - ed199p: 6 companies x 5 warning signs. Pick the 5 signs that fit this market (for example: lost a tenant, CEO left, lawsuit or court case, value fell, delays or outages). Each cell is two short lines
  separated by | or empty. Give the website domain of each company.

  - ed200: why AI data center startups fail.

  If you cannot verify enough events for a slide, answer status: no_data for that slide instead of inventing.

  '
