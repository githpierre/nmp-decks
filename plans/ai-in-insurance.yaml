examples:
  jargon_bad: Gradient-boosted GLM ensembles with SHAP-based explainability for loss-cost relativities.
  jargon_good: AI that prices each policy from hundreds of risk signals and can explain every price to the regulator.
  jargon_why: the reader is not an actuary
  proof_rule: 'A pilot, a « partnership » or a claimed speed-up is not proof that AI works in insurance: say whether the insurer uses it on real policies or claims, on what share of them, the measured
    result (loss ratio, claim time, fraud caught) and who reported it.'
  proof_bad: Company X partnered with a top-10 insurer.
  proof_good: Company X's AI now handles 30% of a top-10 insurer's motor claims, cutting the average claim time from 10 days to 3, according to the insurer's 2026 report.
  proof_why: most insurer pilots never reach real policies or claims
  fresh_bad: Company X raised $50M in 2024
  fresh_good: Company X raised $150M in March 2026, its biggest round, a year after a $50M round
  fresh_est: Company X should write $500M of premium in 2026, against $200M in 2025
  fresh_method: latest company releases, insurer annual reports and filings, press reports as a cross-check
  not_proof: a pilot or a partnership is not AI used on real policies or claims
