retarget:
  iv_pipeline:
    title: Which AI tools are big insurers already using for real?
    brief: 8 rows = 8 real AI deployments at named insurers or reinsurers, each built on a startup's product or the insurer's own AI. Rows read "tool or use" + "INSURER · STARTUP or IN HOUSE" + stage
      (PILOT / LIVE / SCALE, 5 characters at most). Only deployments reported by the insurer, the vendor with the insurer named, a filing or the press. LIVE means used on real policies or claims; SCALE
      means across a whole line of business or country. Not a memorandum of understanding.
  iv_deals:
    title: Which corporate deals shaped the market?
    brief: 6 dated deals involving AI in insurance companies and large groups (acquisitions such as CCC Intelligent Solutions buying EvolutionIQ, insurer or reinsurer investments, capacity deals for
      AI-native insurers and MGAs, IPOs, large carrier contracts), newest first, with the amount when public.
  iv_fda:
    title: What does it take to get AI into an insurer's daily work?
    brief: 5 steps from a first test to AI used on every policy or claim (for example testing on past claims or policies, passing the insurer's IT security and data review, model risk and regulator
      review under the NAIC AI bulletin or the EU AI Act, connecting to the core system such as Guidewire or Duck Creek, rolling out and measuring the loss ratio or claim time). Each step in plain words
      with who decides and a typical duration, and where projects usually stall.
  iv_safety:
    title: What could go wrong for AI in insurance?
    brief: 5 risks, each "LABEL" + one sentence with a documented case or a measured figure (for example lawsuits over AI claim denials, new state or EU rules on AI pricing, deepfake photos and
      documents fooling claims tools, a biased pricing model fined by a regulator, core-system vendors adding the same AI for free, AI-native insurers with high loss ratios). Real filings, reports or
      reported cases only.
