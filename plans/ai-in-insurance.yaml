signal_angles: funding records of AI-native insurers and MGAs (Corgi, Ledgebrook, Nirvana Insurance, Stand, Counterpart, Cover Whale) and of insurance AI software (Federato, Kalepa, Akur8, Reserv, Pace,
  Outmarket AI, Liberate), acquisitions (CCC Intelligent Solutions and EvolutionIQ, other insurer or software buyers), insurers putting AI in production with measured results (claims time, fraud caught,
  share of claims or quotes handled by AI, loss ratio), AI liability insurance for companies using AI (AIUC, Armilla AI, Lloyd's syndicates), regulators (NAIC AI model bulletin adoption by states,
  Colorado rules, EU AI Act high-risk rules for life and health pricing), lawsuits over AI claim denials (UnitedHealth, Cigna, Humana), deepfake claims fraud figures, share prices and results of listed
  AI-first insurers (Lemonade, Root). NOT Google searches, because since mid-2025 Google counts rare search terms differently, so no Google Trends signal.
killers_brief: 'This file fills the "Startup killers" chapter. It shows SETBACKS, not only failures: shutdowns, bankruptcies, sales for little, insurers that dropped an AI vendor, layoffs, down rounds,
  valuations or share prices that fell, regulator fines, lawsuits over AI decisions, AI-native insurers that lost their capacity or licence. Scope: companies whose core product is AI in insurance
  (AI-native insurers and MGAs, underwriting and pricing AI, claims AI, insurance AI agents, AI-led distribution, cyber risk models), startups first.

  - ed192 and ed195: 12 dated events in all, 2023 to November 2026, oldest first in ed192, newest in ed195. Each text is one sentence of about 110 characters, ending with {1|Source name}. Dates as YYYY
  (MON).

  - ed199p: 6 companies x 5 warning signs. Pick the 5 signs that fit this market (for example: big layoffs, lost independence, CEO left, value fell, lost carrier capacity). Each cell is two short lines
  separated by | or empty. Give the website domain of each company.

  - ed200: why AI in insurance startups fail.

  If you cannot verify enough events for a slide, answer status: no_data for that slide instead of inventing.

  '
