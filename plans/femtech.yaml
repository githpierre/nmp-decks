    on 2 lines, one-line description, one emoji each), keep the line "Here, we categorize by type of solution".'
  ed032: 'Do not use Google searches as a signal: Google changed how it counts search terms in mid-2025, so a recent rise in searches is not real interest. Use 7 signals of money, deals,
    plants, approvals, sales or use instead.'
  ed019: 'Here the second categorization is by type of buyer, with the pain-point segments: {pains}.'
signal_angles: menopause care money and demand (Midi Health, new non-hormonal menopause drugs, employers adding menopause benefits), fertility benefits (Progyny revenue and clients,
  Carrot, Maven Clinic), period and fertility apps at scale (Flo Health users and valuation, Natural Cycles), FDA clearances and new women's health tests (endometriosis, at-home hormone
  and fertility tests), government money for women's health research (US initiative, ARPA-H, NIH, UK), big acquisitions and contracts by medtech, pharma and health groups, large rounds
  of femtech startups. Never Google searches (Google changed how it counts search terms in mid-2025, so recent search curves are not real interest).
killers_brief: 'This file fills the "Startup killers" chapter. It shows SETBACKS, not only failures: shutdowns, bankruptcies, failed product launches, data privacy fines, layoffs, sales
  of the company for little, valuations or share prices that fell, products pulled. Scope: companies whose core product serves women''s health (fertility, pregnancy, menstrual and hormonal
  health, menopause, pelvic and sexual health, breast and gynecological tests), startups first.

  - ed192 and ed195: 12 dated events in all, 2022 to November 2026, oldest first in ed192, newest in ed195. Each text is one sentence of about 110 characters, ending with {1|Source name}.
  Dates as YYYY (MON).

  - ed199p: 6 companies x 5 warning signs. Pick the 5 signs that fit this market (for example: big layoffs, data or regulatory trouble, product pulled, value fell, shut down or sold).
  Each cell is two short lines separated by | or empty. Give the website domain of each company.

  - ed200: why femtech startups fail.

  - survivors (for the S11-02 slide « What sets femtech survivors apart from failures? »): 5 rows, each with a lesson (what survivors do, 6 words at most), a one-line explanation, one
  company of ed199p or ed192-ed195 that missed it, and why in 8 words at most, with a source.

  If you cannot verify enough events for a slide, answer status: no_data for that slide instead of inventing.

  '
