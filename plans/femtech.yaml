retarget:
  iv_pipeline:
    title: Which femtech products are closest to market?
    brief: 8 rows = 8 real products of femtech startups or young companies close to launch or just launched (an at-home fertility or hormone test, a menopause treatment or care program,
      a pelvic floor device, an endometriosis or cancer screening test, a contraceptive, a pregnancy monitor). Rows read "product" + "COMPANY · USE" + stage (TRIAL / FILED / CLEARED
      / SALE, 7 characters at most, TRIAL = clinical study under way, FILED = submitted to a regulator (FDA, EMA, MHRA), CLEARED = cleared or approved in the last 12 months, SALE = on
      sale in the last 12 months). Only products named in a company release, a regulator database or reputable press. Not a lab result.
  iv_deals:
    title: Which corporate deals shaped the market?
    brief: 6 dated deals between femtech startups or young companies and large groups (acquisitions by medtech, pharma or health groups, large strategic investments, employer or health
      plan contracts, IPOs), newest first, with the amount when public.
  iv_fda:
    title: What does it take to bring a femtech product to market?
    brief: 5 steps from a working product to one that women can use and someone pays for (for example clinical evidence, FDA clearance or CE mark for a device or test, a billing code
      or coverage by health plans, a contract with an employer or a clinic network, then scale). Each step in plain words with who decides and a typical duration and cost.
  iv_safety:
    title: What could go wrong with femtech?
    brief: 5 risks, each "LABEL" + one sentence with a documented case or a measured figure (for example health data shared without consent and fined by the FTC, period data and abortion
      laws, a device recall, claims not backed by trials, health plans that refuse to pay). Real filings, regulator records, reports or reported cases only.
extra:
  ed061: 'For synthetic biology: the pain points are split into {np} segments ({pains}). Fill the first {np} items with them and leave the others empty ("").'
