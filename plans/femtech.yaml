examples:
  jargon_bad: A digital therapeutic leveraging LH surge detection for ovulation prediction in a D2C model.
  jargon_good: An app that reads a home urine test to tell a woman her most fertile days, sold directly to her.
  jargon_why: the reader is not a doctor
  proof_rule: 'An FDA clearance, a pilot with one employer or a letter of intent is not proof that a product sells: say how many women use it, who pays (the woman, an employer, a health
    plan), the revenue when public, and who reported it.'
  proof_bad: Company X signed a partnership with a large employer.
  proof_good: Company X now covers 2 million employees through 300 employers and sold $80M in 2025.
  proof_why: a partnership is not a sale
  fresh_bad: Company X raised $150M in 2024
  fresh_good: Company X raised $250M in June 2026, its biggest round, two years after a $150M round
  fresh_est: Company X should sell about $300M in 2026, against $180M in 2025
  fresh_method: latest company releases, quarterly results and filings, regulator databases, press reports as a cross-check
  not_proof: an FDA clearance is not sales
