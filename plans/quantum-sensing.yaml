examples:
  jargon_bad: A cold-atom interferometric accelerometer with sub-micro-g bias stability.
  jargon_good: A sensor that lets a ship know where it is for days without GPS, by measuring its own motion with atoms.
  jargon_why: the reader is not a physicist
  proof_rule: 'A lab record, a prototype or a trial is not proof that a product sells: say how many units were ordered, who pays, the revenue when public, and who reported it.'
  proof_bad: Company X built the most precise quantum sensor in the world.
  proof_good: Company X delivered 12 navigation units to the Royal Navy under a $9M contract in 2026.
  proof_why: a lab record is not a sale
  fresh_bad: Company X raised $15M in 2024
  fresh_good: Company X raised $40M in October 2026, its biggest round
  fresh_est: Company X should reach about $30M of revenue in 2026, against $12M in 2025
  fresh_method: latest company releases, filings, defense and government contract notices, press reports as a cross-check
