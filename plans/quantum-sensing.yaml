retarget:
  iv_pipeline:
    title: Which quantum sensing products launched recently?
    brief: 8 rows = 8 real quantum sensing products of startups or young companies launched or expanded in the last 12 months (a portable optical clock, a quantum navigation system flown
      or sailed without GPS, an NV-diamond or atomic magnetometer, a wearable brain scanner, a Rydberg RF receiver, a single-photon detector or quantum LiDAR, a quantum gravimeter for
      surveys). Rows read "product" + "COMPANY · USE" + stage (BETA / LAUNCH / SCALE, 6 characters at most, BETA = field trial or prototype delivered, LAUNCH = sold in the last 12 months,
      SCALE = ordered by a named large client or in volume). Only products named in a company release or reputable press.
  iv_deals:
    title: Which corporate deals shaped the market?
    brief: 6 dated deals around quantum sensing companies (acquisitions by defense, photonics or instrument groups, large strategic investments, government contracts such as DARPA, DIU,
      UK MOD or NATO DIANA, SPAC listings and IPOs), newest first, with the amount when public.
  iv_fda:
    title: What does it take to win a big defense buyer?
    brief: 5 steps from a lab prototype to a quantum sensor that a navy, an air force or a grid operator buys and keeps (for example a field trial in real conditions, size, weight and
      power targets, qualification and security reviews, a funded program such as DIU or DARPA, then a production contract). Each step in plain words with who decides and a typical duration
      or cost.
  iv_safety:
    title: What could go wrong for quantum sensing?
    brief: 5 risks, each "LABEL" + one sentence with a documented case or a measured figure (for example sensors that work in the lab but fail on a ship or a plane, size and cost that
      stay too high, export controls on quantum tech, dependence on a few defense budgets, classical sensors and better GPS that close the gap). Real studies, filings, reports or reported
      cases only.
