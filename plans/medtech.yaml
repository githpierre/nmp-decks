examples:
  jargon_bad: Closed-loop spinal cord stimulation with ECAP-based dose control via a percutaneous lead.
  jargon_good: A small implant that calms back pain with tiny electric pulses and adjusts itself thousands of times a day.
  jargon_why: the reader is not a doctor or an engineer
  proof_rule: 'A CE mark, a "breakthrough device" label, a first patient or a positive small study is not proof that a device sells: say whether it is cleared or approved by the FDA, how many patients
    or hospitals use it, the revenue when public, and who reported it.'
  proof_bad: Company X's device got Breakthrough Device designation from the FDA.
  proof_good: Company X's device was cleared by the FDA in March 2026, and 40 US hospitals used it in its first six months.
  proof_why: a breakthrough label is not an approval
  fresh_bad: Company X raised $150M in 2024
  fresh_good: Company X raised $250M in June 2026, its biggest round, two years after a $150M round
  fresh_est: Company X should sell about $300M of devices in 2026, against $180M in 2025
  fresh_method: latest company releases, quarterly results and filings, FDA databases, press reports as a cross-check
  not_proof: a breakthrough label is not an FDA approval
