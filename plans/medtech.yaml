retarget:
  iv_pipeline:
    title: Which new medical devices are closest to patients?
    brief: 8 rows = 8 real new devices of medtech startups or young companies in the final steps before or just after reaching patients. Rows read "device" + "COMPANY · CONDITION" + stage (EARLY
      / PIVOT / FILED / FDA, 6 characters at most, EARLY = first-in-human or feasibility study, PIVOT = pivotal trial, FILED = submitted to the FDA, FDA = cleared or approved in the last 12 months).
      Only devices listed on ClinicalTrials.gov, in an FDA database or in a company release. Not a lab prototype.
  iv_deals:
    title: Which corporate deals shaped the market?
    brief: 6 dated deals between medtech startups or young medtech companies and large groups (acquisitions by Medtronic, Boston Scientific, Stryker, Abbott, Johnson & Johnson MedTech, Edwards or
      Zimmer Biomet, large strategic investments, distribution deals, IPOs), newest first, with the amount when public.
  iv_fda:
    title: What does it take to bring a new device to patients?
    brief: 5 steps from a working prototype to a device hospitals buy and insurers pay for (for example bench and animal tests, a first-in-human or feasibility study, a pivotal trial, the regulatory
      path such as FDA 510(k), De Novo or PMA and the CE mark in Europe, then a payment code and a yes from the hospital's value committee). Each step in plain words with who decides and a typical
      duration and cost.
  iv_safety:
    title: What could go wrong with new medical devices?
    brief: 5 risks, each "LABEL" + one sentence with a documented case or a measured figure (for example large recalls such as Philips breathing machines, implants that fail and need a second surgery,
      hacked connected devices, AI tools whose accuracy drops in new hospitals, a pivotal trial that misses its goal). Real filings, FDA records, reports or reported cases only.
