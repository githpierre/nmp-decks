signal_angles: robotic surgery growth (Intuitive da Vinci procedures and systems placed, CMR Surgical, Distalmotion, Medical Microinstruments), pulsed field ablation for atrial fibrillation (Boston
  Scientific Farapulse sales, Medtronic, Kardium), over-the-counter glucose sensors (Dexcom Stelo, Abbott Lingo), brain-computer interfaces in people (Neuralink, Synchron, Precision Neuroscience 510(k)),
  the number of AI-enabled devices on the FDA list each year, funding records (CMR Surgical, Neuralink, HistoSonics, Kardium, MiRus), large acquisitions of startups (Johnson & Johnson and Shockwave,
  Stryker and Inari, Boston Scientific and Axonics or Bolt Medical, the HistoSonics sale), medtech IPOs (HeartFlow, Kestra, Ceribell, Beta Bionics, Carlsmed), Medicare TCET coverage. Never Google searches
  (Google changed how it counts search terms in mid-2025, so recent search curves are not real interest).
killers_brief: 'This file fills the "Startup killers" chapter. It shows SETBACKS, not only failures: shutdowns, bankruptcies, pivotal trials that missed their goal, FDA rejections or warning letters,
  recalls, layoffs, sales of the company for little, valuations or share prices that fell, insurers refusing to pay. Scope: companies whose core product is a medical device, a diagnostic device or
  software with a direct clinical purpose (implants, therapeutic devices, diagnostic and imaging devices, surgical systems, medical software, patient monitoring), startups first.

  - ed192 and ed195: 12 dated events in all, 2023 to November 2026, oldest first in ed192, newest in ed195. Each text is one sentence of about 110 characters, ending with {1|Source name}. Dates as YYYY
  (MON).

  - ed199p: 6 companies x 5 warning signs. Pick the 5 signs that fit this market (for example: big layoffs, trial missed, FDA problem or recall, value fell, shut down or sold). Each cell is two short
  lines separated by | or empty. Give the website domain of each company.

  - ed200: why medtech startups fail.

  If you cannot verify enough events for a slide, answer status: no_data for that slide instead of inventing.

  '
