examples:
  jargon_bad: Atomic PvP settlement on an L2 rollup with ERC-20 permit flows and programmable compliance hooks.
  jargon_good: Digital dollars that move between two companies in seconds, any day of the week.
  jargon_why: the reader is not a crypto engineer
  proof_rule: 'Total stablecoin transfers on blockchains are not payments: most of them are trading, exchanges moving funds and bots. Say how much is real payments (business transfers, cards, remittances,
    payouts), who measured it and how.'
  proof_bad: Stablecoins moved trillions of dollars last year, more than Visa.
  proof_good: Company X processed $2B of stablecoin payments for businesses in 2026, according to its own release, against $600M in 2025.
  proof_why: most stablecoin volume is trading, not payments
  fresh_bad: Company X raised $40M in 2024
  fresh_good: Company X raised $250M in October 2026, its biggest round, a year after a $75M round
  fresh_est: Company X should process $10B of payments in 2026, against $3B in 2025
  fresh_method: latest company releases, on-chain dashboards with a named method (Artemis, Visa Onchain Analytics), press reports as a cross-check
  not_proof: raw on-chain transfer volume is not payment volume
trends_csv: assets/trends/stablecoin-payments/stablecoins.csv
