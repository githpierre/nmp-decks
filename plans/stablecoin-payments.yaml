retarget:
  iv_pipeline:
    title: Which banks and payment giants are launching stablecoin services?
    brief: 8 rows = 8 real stablecoin payment services of large banks, card networks or payment companies (for example a bank's own coin for client payments, a card network settling in stablecoins, a
      payment company letting merchants accept them). Rows read "service or coin name" + "COMPANY · USE" + stage (PLAN / PILOT / LIVE, 6 characters at most). Only services announced in a company release
      or a filing, with the date. Not a crypto exchange product, not a coin used only for trading.
  iv_deals:
    title: Which corporate deals shaped the market?
    brief: 6 dated deals around stablecoin payments companies (acquisitions such as Stripe buying Bridge, other acquisitions by payment groups, exchanges or banks, large strategic investments, IPOs or
      listings), newest first, with the amount when public.
  iv_fda:
    title: What does it take to launch a stablecoin payment service?
    brief: 5 steps from an idea to a payment service people can use (for example the licenses, a bank partner for dollars in and out, a coin issuer and its reserves, anti-money-laundering checks, a card
      network or local payout partners). Each step in plain words with who decides and a typical duration or cost, and what the new US and EU laws changed.
  iv_safety:
    title: What could go wrong for stablecoin payments?
    brief: 5 risks, each "LABEL" + one sentence with a documented case or a measured figure (for example a coin losing its dollar peg such as USDC in March 2023, a bank partner leaving, a regulator
      fine or license refused, fraud and sanctions cases, card networks and banks launching their own services). Real filings, reports or reported cases only.
extra:
  ed061: 'For stablecoin payments: the pain points are split into {np} segments ({pains}). Fill the first {np} items with them and leave the others empty ("").'
  ed018: 'This market uses {nv} categories of companies (types of solution): {vals}. The model has 4 slots: answer with a `categories:` list of {nv} items instead (label in capitals on 2 lines, one-line
    description, one emoji each), keep the line "Here, we categorize by type of solution".'
  ed019: 'Here the second categorization is by type of user, with the pain-point segments: {pains}.'
signal_angles: the US GENIUS Act (July 2025) and the EU MiCA rules, total stablecoin supply and its records (USDT, USDC), measured payment volumes as opposed to trading (Artemis, Visa Onchain Analytics,
  company figures such as BVNK, Rain or Bridge), funding records (Tempo, Rain, RedotPay, Mesh, Félix Pago, OpenFX, KAST), acquisitions of stablecoin startups by payment groups (Stripe and Bridge, others),
  banks and card networks launching stablecoin services (Visa, Mastercard, banks issuing their own coins), Circle's listing in June 2025 and its revenue, remittance and business corridors in Latin America,
  Africa and Asia, stablecoin cards spend. Google searches for stablecoins fell sharply after summer 2026, so they are never a signal of a hot market.
killers_brief: 'This file fills the "Startup killers" chapter. It shows SETBACKS, not only failures: shutdowns, bankruptcies, bank partners that pulled out, licenses refused or withdrawn, regulator fines
  and enforcement, coins that lost their dollar peg, hacks and frauds, layoffs, sales forced by cash needs, valuations that fell. Scope: companies whose core product is stablecoin payments (payment APIs,
  business and cross-border transfers, treasury settlement, cards, on and off ramps, remittance apps), startups first. Not trading exchanges and not coins used only for trading.

  - ed192 and ed195: 12 dated events in all, 2023 to November 2026, oldest first in ed192, newest in ed195. Each text is one sentence of about 110 characters, ending with {1|Source name}. Dates as YYYY
  (MON).

  - ed199p: 6 companies x 4 warning signs (this replaces the 5 companies x 3 signs of the model, to match our grid of failed startups). Pick the 4 signs that fit this market (for example: bank partner left, regulator action, big layoffs, value fell, sold for little). Each cell is two short lines
  separated by | or empty. Give the website domain of each company.

  - ed200: why stablecoin payments startups fail.

  If you cannot verify enough events for a slide, answer status: no_data for that slide instead of inventing.

  '
