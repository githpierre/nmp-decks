retarget:
  iv_pipeline:
    title: Which aging drugs are being tested in people today?
    brief: 8 rows = 8 real clinical programs of longevity companies (aging-biology drugs or drugs for a decline that comes with age). Rows read "drug or program" + "COMPANY · TARGET" + stage (PHASE 1 /
      PHASE 2 / PHASE 3 / APPROVED). Only programs listed on ClinicalTrials.gov, in a filing or in a company release. Not a preclinical program.
  iv_deals:
    title: Which corporate deals shaped the market?
    brief: 6 dated deals between longevity companies and large groups (pharma licensing and partnerships, acquisitions, large strategic investments, government or foundation awards such as Hevolution or
      ARPA-H, IPOs or SPACs), newest first, with the amount when public.
  iv_fda:
    title: What does it take to bring an aging drug to market?
    brief: 5 steps from an aging-biology discovery to a sold product (for example animal studies on lifespan and healthspan, choosing a first disease indication because regulators do not accept aging as
      one, phase 1 safety, phase 2 and 3 efficacy, approval and payer coverage, or the consumer path for tests and clinics). Each step in plain words with who decides and a typical duration.
  iv_safety:
    title: What could go wrong with longevity products?
    brief: 5 risks, each "LABEL" + one sentence with a documented case or a measured figure (for example failed trials like Unity Biotechnology, off-label use of rapamycin or metformin, unvalidated biological-age
      tests, regulator warnings on clinics or supplements, data and privacy issues of consumer testing). Real reports, regulator documents or reported cases only.
