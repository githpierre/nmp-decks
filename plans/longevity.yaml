signal_angles: funding records (Retro, NewLimit, Altos, Function Health, Superpower), Loyal and the first lifespan drug for dogs at FDA, TAME and metformin trials, GLP-1 drugs studied for aging, Bryan Johnson
  and consumer demand, longevity clinics opening (Fountain Life, Biograph, Prenuvo, Neko Health), biological-age tests and their sales, pharma deals on aging biology (Novo Nordisk, Eli Lilly, AbbVie-Calico),
  Hevolution and XPRIZE Healthspan money, Google searches for how to live longer, membership prices and subscriber counts, IPOs and SPACs, regulator moves (FDA, Montana right-to-try law).
killers_brief: 'This file fills the "Startup killers" chapter. It shows SETBACKS, not only failures: shutdowns, bankruptcies, failed or stopped clinical trials, regulator warnings or recalls, clinics closed,
  layoffs, customers or partners that walked away, valuations that fell, short-seller reports. Scope: companies whose core product is an longevity product (aging-biology drugs, longevity clinics, biological-age
  tests, consumer longevity brands), startups first.

  - ed192 and ed195: 12 dated events in all, 2023 to November 2026, oldest first in ed192, newest in ed195. Each text is one sentence of about 110 characters, ending with {1|Source name}. Dates as YYYY
  (MON).

  - ed199p: 6 companies x 5 warning signs. Pick the 5 signs that fit this market (for example: big layoffs, project cancelled, trial failed, value fell, shut down or sold). Each cell is two short lines
  separated by | or empty. Give the website domain of each company.

  - ed200: why longevity startups fail.

  If you cannot verify enough events for a slide, answer status: no_data for that slide instead of inventing.

  '
