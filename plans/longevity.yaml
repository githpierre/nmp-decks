examples:
  jargon_bad: Senolytic small molecules targeting p16-positive cells to reduce SASP.
  jargon_good: Pills that clear out old, worn-out cells that send harmful signals to the tissue around them.
  jargon_why: the reader is not a biologist
  proof_rule: 'A mouse study, a biological-age test result or a wellness claim is not proof that a product adds healthy years: say whether there is a human trial, its phase and its result, and who reported
    it.'
  proof_bad: Company X reverses aging by 10 years.
  proof_good: Company X lowered an epigenetic age score in a 60-person phase 1 study, with no data yet on health outcomes.
  proof_why: an age score is not a health outcome
  fresh_bad: Company X had 10,000 members in 2025
  fresh_good: Company X reported 200,000 paying members in October 2026, against 50,000 a year earlier
  fresh_est: Company X should end 2026 near $150M of revenue, against $60M in 2025
  fresh_method: latest reported members or revenue and company statements, press reports as a cross-check
  not_proof: an animal study is not a human result
