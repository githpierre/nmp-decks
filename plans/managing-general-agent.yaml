examples:
  jargon_bad: A binding authority agreement with a fronting carrier, backed by a quota-share reinsurance panel.
  jargon_good: The MGA prices and sells the policies, a big insurer lends its license, and reinsurers carry most of the risk.
  jargon_why: the reader does not work in insurance
  proof_rule: 'Premium written or a program "worth" a big amount is not proof that an MGA works: say its loss results (loss ratio), whether its insurer renewed the capacity and for how long, and who reported
    it.'
  proof_bad: MGA X wrote $500M of premium.
  proof_good: MGA X wrote $500M of premium in 2025 with a 52% loss ratio, and its insurer renewed its capacity for three years.
  proof_why: premium can grow while losses grow faster
  fresh_bad: MGA X raised $50M in 2024
  fresh_good: MGA X raised $150M in June 2026, its biggest round, a year after a $60M round
  fresh_est: MGA X should write about $600M of premium in 2026, against $400M in 2025
  fresh_method: latest company releases, carrier and reinsurer filings, AM Best and Conning reports, press as a cross-check
  not_proof: premium written is not profit
