retarget:
  iv_pipeline:
    title: Which new MGA programs got insurer backing lately?
    brief: 8 rows = 8 real MGA programs or launches from 2025 or 2026, each backed by a named insurer, reinsurer or Lloyd's syndicate. Rows read "program or line of cover" + "MGA · BACKER" + stage (PLAN / LAUNCH
      / LIVE / RENEW, 6 characters at most). Only programs announced by the MGA, its backer or the trade press with a date. Not a broker placement, not a software contract.
  iv_deals:
    title: Which corporate deals shaped the MGA market?
    brief: 6 dated deals between MGAs and large groups (acquisitions of MGAs by insurers, brokers or MGA platforms, multi-year capacity agreements with carriers, reinsurers or Lloyd's, strategic stakes, IPOs
      such as Accelerant or Neptune), newest first, with the price or amount when public.
  iv_fda:
    title: What does it take to launch an MGA program?
    brief: 5 steps from an idea for a new insurance product to policies sold under delegated authority (for example getting a license, finding an insurer that lends its paper, signing the binding authority
      agreement, getting reinsurance behind it, passing the first audits and renewing capacity on the loss results). Each step in plain words with who decides and a typical duration.
  iv_safety:
    title: What could go wrong for MGAs?
    brief: 5 risks, each "LABEL" + one sentence with a documented case or a measured figure (for example insurers pulling capacity after bad loss results, collateral fraud such as Vesttoo, a heavy catastrophe
      year, prices falling in a soft market, regulators and Lloyd's tightening delegated-authority rules). Real filings, reports or reported cases only.
extra:
  ed061: 'For MGA: the pain points are split into {np} segments ({pains}). Fill the first {np} items with them and leave the others empty ("").'
  ed018: 'This market uses {nv} categories of companies (types of solution): {vals}. The model has 4 slots: answer with a `categories:` list of {nv} items instead (label in capitals on 2 lines, one-line
    description, one emoji each), keep the line "Here, we categorize by type of solution".'
  ed019: 'Here the second categorization is by type of buyer, with the pain-point segments: {pains}.'
signal_angles: MGA premium growth against carriers (AM Best, Conning, Aon and Target Markets studies, the share of US commercial premium written through MGAs), the share of Lloyd's premium written under delegated
  authority, funding records (Ledgebrook, Nirvana Insurance and its valuation, Stand, Openly, Counterpart, Lassie, Shepherd, Ominimo, Comeryx), IPOs and their share prices (Accelerant, Neptune Insurance),
  acquisitions of MGAs (Travelers and Corvus, Ryan Specialty, Munich Re), multi-year capacity deals with reinsurers and Lloyd's, the growth of fronting carriers, E&S premium growth (WSIA), cyber MGAs' premium
  (Coalition, At-Bay, Cowbell), new AI-native MGAs launched, insurers pulling capacity or tightening audits.
killers_brief: 'This file fills the "Startup killers" chapter. It shows SETBACKS, not only failures: MGAs shut down or put in run-off, insurers or reinsurers that pulled capacity, collateral fraud (Vesttoo),
  layoffs, down rounds and valuations that fell, MGAs sold cheaply, loss ratios far above plan, regulators or Lloyd''s acting against an MGA. Scope: companies whose core business is underwriting insurance
  under delegated authority (MGAs, MGUs, program administrators, parametric and embedded MGAs), startups first.

  - ed192 and ed195: 12 dated events in all, 2023 to November 2026, oldest first in ed192, newest in ed195. Each text is one sentence of about 110 characters, ending with {1|Source name}. Dates as YYYY
  (MON).

  - ed199p: 6 companies x 5 warning signs. Pick the 5 signs that fit this market (for example: capacity pulled, big layoffs, lost independence, value fell, losses above plan). Each cell is two short lines
  separated by | or empty. Give the website domain of each company.

  - ed200: why MGA startups fail.

  If you cannot verify enough events for a slide, answer status: no_data for that slide instead of inventing.

  '
