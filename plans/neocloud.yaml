examples:
  jargon_bad: Bare-metal H100 SXM nodes on a 3.2 Tbps InfiniBand fabric for distributed pretraining.
  jargon_good: Whole servers of top Nvidia chips, wired with very fast links so thousands of them can train one AI model together.
  jargon_why: the reader is not a data-center engineer
  proof_rule: 'A letter of intent, a "strategic partnership" or a planned capacity in megawatts is not revenue: say whether there is a signed contract, its value and length, how much of it is live today, and who
    reported it.'
  proof_bad: Company X will deliver 1 GW of AI compute to a hyperscaler.
  proof_good: Company X signed a five-year $9B contract with a hyperscaler, and its filing says the first 200 MW go live in 2026.
  proof_why: a capacity plan is not a contract
  fresh_bad: Company X had $2B of revenue in 2024
  fresh_good: Company X reported $1.4B of revenue for its third quarter of 2026, against $580M a year earlier
  fresh_est: Company X should end 2026 near $5B of revenue, against $1.9B in 2025
  fresh_method: latest reported quarter and company guidance, analyst estimates as a cross-check
  not_proof: a planned capacity is not a signed contract
trends_csv: assets/trends/neocloud/gpu-cloud.csv
