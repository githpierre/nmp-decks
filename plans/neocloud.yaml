retarget:
  iv_pipeline:
    title: Which big AI clusters are neoclouds building right now?
    brief: 8 rows = 8 real AI clusters or GPU sites of neocloud companies, with a named place (city or region, country). Rows read "site, country" + "COMPANY · MAIN CUSTOMER or SIZE (GPUs or MW)" + stage (PLAN / BUILD / LIVE, 6 characters at most).
      Only sites with a signed customer, construction reported on site or capacity already rented out, from the company, its customer, a filing or the regulator. Not a memorandum of understanding.
  iv_deals:
    title: Which corporate deals shaped the market?
    brief: 6 dated deals between neocloud companies and large groups (multi-year capacity contracts with Microsoft, Meta, OpenAI, Google or Anthropic, Nvidia investments or capacity backstops, acquisitions, chip supply deals, IPOs),
      newest first, with the amount and length when public.
  iv_fda:
    title: What does it take to turn chips into a cloud people pay for?
    brief: 5 steps from buying GPUs to billing customers (for example securing a chip allocation from Nvidia or AMD, financing the fleet with GPU-backed debt, finding power and a site, building and stress-testing the cluster,
      signing take-or-pay contracts and keeping uptime high). Each step in plain words with who decides and a typical duration.
  iv_safety:
    title: What could go wrong for neocloud companies?
    brief: 5 risks, each "LABEL" + one sentence with a documented case or a measured figure (for example one customer making most of the revenue, heavy GPU-backed debt, chips that lose value in a few years, power and
      construction delays, rental prices per GPU-hour falling, hyperscalers cutting prices). Real filings, reports or reported cases only.
extra:
  ed061: 'For neocloud: the pain points are split into {np} segments ({pains}). Fill the first {np} items with them and leave the others empty ("").'
  ed018: 'This market uses {nv} categories of companies (types of solution): {vals}. The model has 4 slots: answer with a `categories:` list of {nv} items instead (label in capitals on 2 lines, one-line
    description, one emoji each), keep the line "Here, we categorize by type of solution".'
  ed019: 'Here the second categorization is by type of buyer, with the pain-point segments: {pains}.'
signal_angles: multi-billion capacity contracts (Microsoft with Nebius, Nscale, IREN, Lambda; Meta with CoreWeave and Nebius; OpenAI with CoreWeave and Cerebras; Anthropic with Fluidstack), funding records (Crusoe, Lambda,
  Nscale, Firmus, Baseten, fal), IPOs and listings (CoreWeave, Cerebras, Nebius) and their share prices against revenue, backlog and revenue growth reported each quarter, GPU-backed debt and its interest rate, rental
  prices per GPU-hour (H100, B200) and their fall, inference volumes in tokens (Fireworks, Together AI, Baseten, OpenRouter rankings), sovereign AI clouds in Europe, the Middle East and Asia, power secured in gigawatts,
  Nvidia investments and capacity backstops, Google searches for GPU cloud.
killers_brief: 'This file fills the "Startup killers" chapter. It shows SETBACKS, not only failures: shutdowns, fire sales, customers that walked away or cut their contracts, debt in trouble or covenants breached, data
  centers delayed, layoffs, valuations or share prices that fell, short-seller reports, crypto miners whose AI cloud pivot stalled. Scope: companies whose core product is renting AI compute (GPU clouds, inference
  clouds, compute marketplaces, dedicated clusters, sovereign AI clouds), startups first.

  - ed192 and ed195: 12 dated events in all, 2023 to November 2026, oldest first in ed192, newest in ed195. Each text is one sentence of about 110 characters, ending with {1|Source name}. Dates as YYYY
  (MON).

  - ed199p: 6 companies x 5 warning signs. Pick the 5 signs that fit this market (for example: big layoffs, customer lost, debt trouble, value fell, shut down or sold). Each cell is two short lines
  separated by | or empty. Give the website domain of each company.

  - ed200: why neocloud startups fail.

  If you cannot verify enough events for a slide, answer status: no_data for that slide instead of inventing.

  '
market_title: Neocloud
label: Neocloud
