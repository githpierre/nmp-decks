    users, contracts, sales or use instead.'
  ed019: 'Here the second categorization is by type of buyer, with the pain-point segments: {pains}.'
signal_angles: funding rounds of EdTech startups (AI tutors, teacher AI, language learning, workforce skills), revenue, paying users and subscriber figures of listed EdTech companies
  (Duolingo, Coursera, Chegg, Nerdy), district and university contracts, AI adoption by teachers and students in surveys, acquisitions, take-privates and mergers, IPOs, national programs
  funding digital learning. Never Google searches (Google changed how it counts search terms in mid-2025, so recent search curves are not real interest).
killers_brief: 'This file fills the "Startup killers" chapter. It shows SETBACKS, not only failures: shutdowns, bankruptcies, layoffs, collapses in value or share price after the Covid
  boom, sales of the company for little, products pulled, fines and lawsuits, users lost to general AI chatbots. Scope: companies whose core product is an EdTech product, startups first
  (for example Byju''s, 2U, Chegg, Unacademy, Vedantu).

  - ed192 and ed195: 12 dated events in all, 2022 to November 2026, oldest first in ed192, newest in ed195. Each text is one sentence of about 110 characters, ending with {1|Source name}.
  Dates as YYYY (MON).

  - ed199p: 6 companies x 5 warning signs. Pick the 5 signs that fit this market (for example: big layoffs, value fell, went bankrupt, users fell, legal fight). Each cell is two short
  lines separated by | or empty. Give the website domain of each company.

  - ed200: why EdTech startups fail.

  - survivors (for the S11-02 slide « What sets EdTech survivors apart from failures? »): 5 rows, each with a lesson (what survivors do, 6 words at most), a one-line explanation, one
  company of ed199p or ed192-ed195 that missed it, and why in 8 words at most, with a source.

  If you cannot verify enough events for a slide, answer status: no_data for that slide instead of inventing.

  '
