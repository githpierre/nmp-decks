retarget:
  iv_pipeline:
    title: Which EdTech products launched recently?
    brief: 8 rows = 8 real EdTech products of startups or young companies launched or expanded in the last 12 months (an AI tutor for homework, an AI assistant for teachers, a language
      learning app with AI conversation, an AI grading or feedback tool, a skills platform for employers, a test prep or exam product, a campus or admissions tool, a credential or skills
      verification product). Rows read "product" + "COMPANY · USE" + stage (BETA / LAUNCH / SCALE, 6 characters at most, BETA = pilot in a few schools or companies, LAUNCH = sold in the
      last 12 months, SCALE = adopted by a named large district, university or employer, or by millions of users). Only products named in a company release or reputable press.
  iv_deals:
    title: Which corporate deals shaped the market?
    brief: 6 dated deals around EdTech companies (acquisitions by private equity, publishers or software groups, take-privates, mergers such as Coursera and Udemy, large strategic investments,
      IPOs and SPAC listings), newest first, with the amount when public.
  iv_fda:
    title: What does it take to win a school district?
    brief: 5 steps from a free pilot to a tool a US school district (or a ministry, a university or an employer) buys and renews (for example a teacher-led pilot, a privacy review and
      data agreement, proof of learning gains such as ESSA evidence tiers, the procurement and budget cycle, then renewal on usage). Each step in plain words with who decides and a typical
      duration or cost.
  iv_safety:
    title: What could go wrong for EdTech?
    brief: 5 risks, each "LABEL" + one sentence with a documented case or a measured figure (for example student data breaches such as PowerSchool in 2024-2025, phone and screen-time
      bans in schools, students cheating with general AI chatbots, tools that show no learning gains, public budgets that shrink after federal relief money ends). Real studies, filings,
      reports or reported cases only.
extra:
  ed061: The pain points are split into {np} segments ({pains}). Fill the first {np} items with them and leave the others empty ("").
  ed018: 'This market uses {nv} categories of companies (types of solution): {vals}. The model has 4 slots: answer with a `categories:` list of {nv} items instead (label in capitals
    on 2 lines, one-line description, one emoji each), keep the line "Here, we categorize by type of solution".'
