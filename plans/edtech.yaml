examples:
  jargon_bad: An adaptive LXP with competency-based pathways and xAPI interoperability.
  jargon_good: An app that changes each lesson to what the student already knows, and tells the teacher who is falling behind.
  jargon_why: the reader is not an education specialist
  proof_rule: 'Downloads, sign-ups or a pilot are not proof that a product sells: say how many paying users, schools or companies, the revenue when public, and who reported it.'
  proof_bad: Company X is used by millions of students.
  proof_good: Company X had 1.2M paying subscribers and $90M of revenue in Q3 2026, per its results.
  proof_why: free users are not buyers
  fresh_bad: Company X raised $15M in 2024
  fresh_good: Company X raised $40M in October 2026, its biggest round
  fresh_est: Company X should reach about $30M of revenue in 2026, against $12M in 2025
  fresh_method: latest company releases, filings and quarterly results, district and government contract notices, press reports as a cross-check
  not_proof: downloads are not sales
