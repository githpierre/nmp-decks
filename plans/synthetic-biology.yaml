  Ansa, DNA Script), precision fermentation scale-up (Perfect Day, The EVERY Company, Onego Bio, Liberation Labs plant), bio-based chemicals and government money (Solugen DOE loan, US
  biomanufacturing awards, the NSCEB report and its $15B ask, China's bioeconomy plans, the EU Biotech Act), de-extinction and big rounds (Colossal Biosciences valuation), engineered microbes on
  farms (Pivot Bio acres), gene-circuit and programmable cell medicines reaching trials or approval, large acquisitions and offtake deals by chemical, food and pharma groups. Never Google
  searches (Google changed how it counts search terms in mid-2025, so recent search curves are not real interest).
killers_brief: 'This file fills the "Startup killers" chapter. It shows SETBACKS, not only failures: shutdowns, bankruptcies, failed scale-ups, plants closed or sold, layoffs, sales of the
  company for little, valuations or share prices that fell, products pulled. Scope: companies whose core product engineers biology (DNA tools, design software, biofoundries, industrial and
  food biomanufacturing, engineered materials, synthetic biology therapeutics, engineered crops), startups first.

  - ed192 and ed195: 12 dated events in all, 2022 to November 2026, oldest first in ed192, newest in ed195. Each text is one sentence of about 110 characters, ending with {1|Source name}.
  Dates as YYYY (MON).

  - ed199p: 6 companies x 5 warning signs. Pick the 5 signs that fit this market (for example: scale-up failed, big layoffs, plant closed or sold, value fell, shut down or sold). Each cell
  is two short lines separated by | or empty. Give the website domain of each company.

  - ed200: why synthetic biology startups fail.

  - survivors (for the S11-02 slide « What sets synthetic biology survivors apart from failures? »): 5 rows, each with a lesson (what survivors do, 6 words at most), a one-line explanation,
  one company of ed199p or ed192-ed195 that missed it, and why in 8 words at most, with a source.

  If you cannot verify enough events for a slide, answer status: no_data for that slide instead of inventing.

  '
