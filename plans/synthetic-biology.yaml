examples:
  jargon_bad: A chassis organism with a refactored metabolic pathway for de novo biosynthesis of a high-value terpene.
  jargon_good: Yeast reprogrammed to brew a rare flavor molecule in big tanks, instead of extracting it from plants.
  jargon_why: the reader is not a biologist
  proof_rule: 'A lab result, a pilot run or a letter of intent is not proof that a product sells: say whether it is made at commercial scale, who buys it, the volume or revenue when public,
    and who reported it.'
  proof_bad: Company X signed a memorandum of understanding with a food giant.
  proof_good: Company X started selling its fermented protein to a food giant in March 2026 and plans 2,000 tonnes a year.
  proof_why: a memorandum is not a sale
  fresh_bad: Company X raised $150M in 2024
  fresh_good: Company X raised $250M in June 2026, its biggest round, two years after a $150M round
  fresh_est: Company X should sell about $300M in 2026, against $180M in 2025
  fresh_method: latest company releases, quarterly results and filings, regulator databases, press reports as a cross-check
  not_proof: a pilot run is not commercial production
