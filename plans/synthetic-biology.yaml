retarget:
  iv_pipeline:
    title: Which engineered products are closest to market?
    brief: 8 rows = 8 real products of synthetic biology startups or young companies close to launch or just launched (an engineered enzyme, a precision-fermented ingredient, an engineered
      microbe for farms, a cell or gene-circuit medicine, a bio-based chemical or material). Rows read "product" + "COMPANY · USE" + stage (PILOT / DEMO / FILED / SALE, 6 characters at most,
      PILOT = pilot plant or field trial, DEMO = demonstration plant or pivotal trial, FILED = submitted to a regulator (FDA, EPA, USDA, EFSA), SALE = on sale in the last 12 months). Only products
      named in a company release, a regulator database or reputable press. Not a lab result.
  iv_deals:
    title: Which corporate deals shaped the market?
    brief: 6 dated deals between synthetic biology startups or young companies and large groups (acquisitions, large strategic investments, offtake or supply agreements with chemical, food,
      pharma or seed groups, government awards, IPOs), newest first, with the amount when public.
  iv_fda:
    title: What does it take to bring an engineered product to market?
    brief: 5 steps from a working strain or design in the lab to a product customers buy (for example scale-up from flask to pilot fermenter, a demonstration plant, the regulator's clearance
      such as FDA GRAS, EPA TSCA, USDA or EFSA, a supply contract with a buyer, then a commercial plant at a cost the buyer accepts). Each step in plain words with who decides and a typical
      duration and cost.
  iv_safety:
    title: What could go wrong with engineered biology?
    brief: 5 risks, each "LABEL" + one sentence with a documented case or a measured figure (for example scale-up that fails or costs far more than planned, a strain that drifts or gets
      contaminated in big tanks, biosecurity worries about DNA synthesis, rules that block a gene-edited crop or a new food, consumers who refuse lab-made food). Real filings, regulator records,
      reports or reported cases only.
