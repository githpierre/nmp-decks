rows:
- name: 'Meticulous Research,

    market report'
  why: The deepfake detection market report with its estimate for 2026 and a growth forecast
  how: We used it as the anchor of our $1B market size. It also gave one of the growth rates we compared.
  url: https://www.meticulousresearch.com/product/deepfake-detection-market-6944
- name: 'SNS Insider,

    market report'
  why: The market report that values deepfake detection in 2025, with a forecast to 2035
  how: We used it as one of the direct forecasts of market size. It also gave a growth rate of about 29.5% a year.
  url: https://www.snsinsider.com/reports/deepfake-detection-market-11090
- name: 'Astute Analytica,

    market report'
  why: The market report on detection software, APIs and services, with a forecast to 2035
  how: We used it to frame what market reports count in the market. It gave one of the growth rates we compared.
  url: https://www.astuteanalytica.com/industry-report/deepfake-detection-market
- name: 'Next Move Strategy,

    tool market report'
  why: The report on the wider market for AI deepfake detector tools, with its size in 2026
  how: We used it as the high reference for the wider tool market. It is broader than our own market definition.
  url: https://www.nextmsc.com/report/ai-deepfake-detector-tool-market-ic5131
- name: 'UK government, detection

    technology review'
  why: The UK government's review of deepfake detection technology and of the companies that sell it
  how: We used it to map where detection providers are based. It also framed the limits of today's detectors.
  url: https://gov.uk/government/publications/deepfake-detection-technology/deepfake-detection-technology
- name: 'Deepfake-Eval-2024,

    benchmark paper'
  why: The research paper that tested detectors on real deepfakes collected online in 2024
  how: We used it for the loss of about half of detectors' accuracy on new fakes. It framed the main tech risk.
  url: https://arxiv.org/pdf/2503.02857
- name: 'Biometric Update,

    Pindrop attack report'
  why: Biometric Update's report on Pindrop's data on AI-driven attacks against companies in 2026
  how: We used it for the 1,680% rise in AI-driven attacks. It also showed how few firms have a dedicated tool.
  url: https://www.biometricupdate.com/202609/deepfakes-are-overwhelming-businesses-unprepared-to-deal-with-ai-threat-pindrop
- name: 'KPMG, stake in

    Reality Defender'
  why: KPMG's announcement of its minority stake in Reality Defender, a deepfake detection startup
  how: We used it as a sign that large advisory firms want to sell deepfake defense. It placed Reality Defender among leaders.
  url: https://kpmg.com/us/en/media/news/kpmg-llp-takes-minority-stake-in-deepfake-detection-leader-reality-defender.html
- name: 'ID Tech Wire, Deel

    buys Clarity'
  why: The report on Deel's purchase of Clarity, which checks that job candidates are real people
  how: We used it for the move of detection into hiring tools. It showed that platforms buy detection startups.
  url: https://idtechwire.com/deel-acquires-clarity-to-add-deepfake-detection-across-hiring-and-workforce-identity
- name: 'SecurityWeek,

    GetReal funding'
  why: SecurityWeek's report on the $17.5M Series A of GetReal Security in March 2025
  how: We used it for GetReal's round and its founders. It also placed GetReal among the leaders of the market.
  url: https://www.securityweek.com/getreal-security-raises-17-5-million-to-tackle-gen-ai-threats/amp
- name: 'SiliconANGLE,

    imper.ai launch'
  why: SiliconANGLE's report on the public launch of imper.ai with $28M to stop impersonation
  how: We used it for imper.ai's funding and its focus on meetings. It showed demand for meeting protection.
  url: https://siliconangle.com/2025/12/04/imper-ai-launches-28m-stop-ai-powered-impersonation-attacks
- name: 'Biometric Update,

    Hive DoD contract'
  why: The report on the $2.4M contract the US Department of Defense gave Hive for deepfake detection
  how: We used it for the first large defense contract of the market. It showed that governments pay for detection.
  url: https://www.biometricupdate.com/202412/dod-awards-contract-for-deepfake-detection-to-hive
- name: 'BleepingComputer,

    Teams deepfake checks'
  why: BleepingComputer's report on Microsoft Teams adding certified third-party deepfake detection
  how: We used it for detection moving into meetings. It showed why a place in daily tools matters to buyers.
  url: https://bleepingcomputer.com/news/security/microsoft-teams-to-add-third-party-deepfake-detection-impersonation-protection
- name: 'Nasdaq, Pindrop

    and Zoom release'
  why: Pindrop's release on the Zoom integration that embeds live deepfake detection in contact centers
  how: We used it for live voice checks inside call platforms. It placed Pindrop among the leaders of voice detection.
  url: https://www.nasdaq.com/press-release/pindrop-zoom-integration-embeds-real-time-deepfake-detection-and-identity
- name: 'Reed Smith, TAKE

    IT DOWN Act'
  why: Reed Smith's guide to the duties the TAKE IT DOWN Act puts on online platforms in the US
  how: We used it for the 48-hour removal limit for fake intimate images. It framed the rules of the market.
  url: https://www.reedsmith.com/our-insights/blogs/viewpoints/102ms5e/covered-platforms-are-you-ready-to-take-it-down
- name: 'The Next Web,

    SynthID checker'
  why: The Next Web's report on Google's free SynthID checker for images made with its own AI
  how: We used it for free checkers that read only their own watermarks. It framed the threat of free tools.
  url: https://thenextweb.com/news/google-synthid-detector-public-ai-content-checker
- name: 'Biometric Update,

    Cyberette launch'
  why: The report on the launch of Cyberette's forensics platform that shows where media was changed
  how: We used it for new forensic tools in 2026. It showed that young startups still enter the market.
  url: https://www.biometricupdate.com/202610/cyberette-launches-deepfake-forensics-platform-to-show-where-media-was-manipulated
- name: 'Biometric Update,

    Scam.ai launch'
  why: The report on Scam.ai's on-device detection for video calls, running on Qualcomm chips
  how: We used it for detection moving onto phones and laptops. It showed a new way to check calls live.
  url: https://www.biometricupdate.com/202608/scam-ai-launches-on-device-deepfake-detection-for-video-calls
- name: 'International Accounting

    Bulletin, KPMG deal'
  why: The report on KPMG's stake in Reality Defender and other strategic moves in the market
  how: We used it with Deel's purchase of Clarity as signs of strategic backers. It framed the deals of 2026.
  url: https://www.internationalaccountingbulletin.com/news/kpmg-llp-acquires-stake-in-deepfake-detection-business-reality-defender
- name: 'Microsoft 365,

    Teams admin notice'
  why: Microsoft's notice to Teams admins on certified providers of deepfake detection in meetings
  how: We used it for the review admins must do of each provider. It showed how buyers check vendors.
  url: https://mc.merill.net/message/MC1509787
