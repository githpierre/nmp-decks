ed183:
  regions:
    apac:
      name: INDIA
      text: India now requires labels on AI content, and Samsung builds on-device checks in Singapore.
    au:
      name: AUSTRALIA
      text: Australia produced IDVerse, an AI fraud and deepfake checker bought by LexisNexis Risk Solutions in 2025, plus CSIRO's detector tests.
    eu:
      name: EUROPE
      text: Europe has Sensity in the Netherlands and IdentifAI in Italy, with EU grants and the AI Act's deepfake labeling rules adding pull.
    na:
      name: NORTH AMERICA
      text: 'North America is the deepest cluster: Reality Defender, Pindrop, GetReal, Hive, Modulate and imper.ai are all based there.'
