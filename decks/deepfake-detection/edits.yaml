ed109-s3:
  11: '🏢


    More teams turn it on each year'
ed108-s6:
  6: A real photo is shared online without any record and called a fake by people who dislike it. At the same time, an AI image looks just as real, and readers have no way to tell which one to trust.
iv_fda:
  7: 'BENCHMARK



    Buyers compare tools on outside tests, like Purdue''s 2025 study of 24 detectors on real fakes.'
  8: 'SECURITY



    The buyer''s security team checks audits such as SOC 2 and how call or meeting data is handled.'
  9: 'PILOT



    A bank first reviews recorded calls, then goes live. One top bank scanned 1.7 million calls this way.'
  10: 'CONTRACT



    Contracts run for years: the Pentagon gave Hive a two-year, $2.4M deepfake detection deal.'
  11: 'INTEGRATION



    The tool must plug into existing systems. Since November 2026, Teams lets admins add certified ones.'
iv_safety:
  6: 'NEW MODELS




    Open-source detectors lost about half their accuracy on real 2024 deepfakes compared with older academic test sets'
  7: 'FALSE ALARMS




    In a May 2026 NewsGuard audit, ZeroGPT labeled 20% of real news photos as fake, which can discredit genuine evidence'
  8: 'EASY BYPASS




    Researchers fooled two commercial detectors more than 95% of the time by subtly changing features such as an open mouth'
  9: 'FREE TOOLS




    Google made its SynthID Detector free for everyone in October 2026, and OpenAI and TikTok run their own free AI checkers'
  10: 'NEW RULES




    India''s deepfake rules gave platforms just 10 days in February 2026 to add labels and detection tools'
ed145:
  8: 'No analyst framework

    helped buyers compare vendors'
