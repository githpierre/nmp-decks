ed148p:
  title: 'What pushed the deepfake detection

    market forward, year after year?'
  events:
  - year: '2016'
    text: DARPA starts media forensics program
    impact: 2.5
  - year: '2017'
    text: Deepfake tools spread to consumers
    impact: 1.0
  - year: '2018'
    text: Fake video fears reach elections
    impact: 1.0
  - year: '2019'
    text: Facebook launches detection challenge
    impact: 2.5
  - year: '2019'
    text: DFDC releases massive video dataset
    impact: 2.0
  - year: '2020'
    text: DFDC exposes weak real world accuracy
    impact: 1.5
  - year: '2020'
    text: DARPA launches semantic forensics
    impact: 1.5
  - year: '2021'
    text: C2PA forms provenance coalition
    impact: 2.0
