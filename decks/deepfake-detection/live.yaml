ed007p:
  type: pp_radar
  title: 'Who Is in deepfake detection,

    and who stays outside?'
  TL:
    name: Persona
    src: ../../assets/logos/pp_live/deepfake-detection/s01-00.png
    text: verifies identity and liveness, but deepfake detection is a supporting control rather than the core product
  TR:
    name: Canva
    src: ../../assets/logos/pp_live/deepfake-detection/s01-02.png
    text: creates and edits media, including Al content, but does not sell a deepfake detection or authenticity platform
  BL:
    name: Adobe
    src: ../../assets/logos/pp_live/deepfake-detection/s01-09.png
    text: provides Content Credentials and provenance across creative tools, but detection is not its main business
  BR:
    name: ''
    src: ../../assets/logos/pp_live/deepfake-detection/s01-10.png
    text: iProov sells biometric liveness and face verification with deepfake defenses embedded in identity checks
