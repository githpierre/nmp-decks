    text: NIST benchmarks video deepfake detectors
    impact: 1.5
  - year: '2024'
    text: C2PA adoption reaches major platforms
    impact: 1.5
  - year: '2024'
    text: Election year expands verification demand
    impact: 1.5
  - year: '2024'
    text: Reality Defender expands commercial funding
    impact: 1.0
  - year: '2025'
    text: DARPA extends deepfake defense work
    impact: 1.5
  - year: '2025'
    text: Banks prioritize voice fraud protection
    impact: 1.5
  - year: '2025'
    text: Provenance complements detector scoring
    impact: 1.5
  - year: '2025'
    text: Deepfake startups target live meetings
    impact: 1.0
  - year: '2025'
    text: Government buyers test detection tools
    impact: 1.0
  - year: '2025'
    text: Multimodal models widen attack surface
    impact: 1.5
  - year: '2026'
    text: UK maps deepfake detection market
    impact: 2.0
  - year: '2026'
    text: EU deepfake transparency rules apply
    impact: 2.0
  - year: '2026'
    text: KPMG invests in Reality Defender
    impact: 2.0
  - year: '2026'
    text: OpenAI expands provenance verification
    impact: 1.5
  - year: '2026'
    text: Detection remains technically difficult
    impact: 1.0
  - year: '2026'
    text: Live fraud pushes multimodal screening
    impact: 1.5
  note:
  - We kept the events we believe pushed deepfake detection forward the most
  - Ratings are our estimates, with all the sources at the end of the report
