- id: ed024
  type: dated
  section: Market definition
  title: What has changed (very) recently?
  page: 1/2
  items:
  - d: SINCE 2024
    t: An Arup employee in Hong Kong sent about $26M in early 2024 after a video call with deepfakes of the CFO and colleagues, a warning heard by every corporate finance team.
  - d: SINCE 2024
    t: Entrust completed its purchase of Onfido in April 2024 for a reported $650M, bringing deepfake defense for selfie and document checks into a large security group.
  - d: SINCE 2024
    t: FinCEN issued an alert on deepfake fraud schemes on November 13, 2024, reminding US banks to report suspicious activity that involves fake media and identities.
  - d: SINCE 2025
    t: GetReal Security raised an $18M Series A in March 2025, co-founded by Hany Farid, to sell deepfake forensics and live checks to companies and governments.
  - d: SINCE 2025
    t: The TAKE IT DOWN Act became US law in May 2025, requiring platforms to remove fake intimate images within 48 hours, with FTC enforcement from May 2026.
  - d: SINCE 2025
    t: Doppel raised a $70M Series C in November 2025 at a valuation above $600M, three times its value six months earlier, to track impersonation across channels.
  note:
  - We kept the milestones that most changed the products, the money and the big players of the market
  - There is no official timeline, and another analyst could reasonably pick a few different milestones here
  src: 24
