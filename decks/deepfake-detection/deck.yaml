- id: ed133
  type: x/has_held_back_market_growth
  section: Market challenges
  title: What has held back market growth so far?
  note: We grouped the market into broad phases using research contests, fraud cases, studies and buyer surveys. The phases are our judgment but track the main technical and budget bottlenecks.
  src: 133
  t:
    6: '2018 - 2020


      Deepfakes were a curiosity and detection stayed in labs. In Facebook''s 2020 contest, the best model caught only 65% of unseen fakes.'
    7: '2021 - 2023


      Voice cloning got cheap, but detectors trained on old research datasets kept breaking on each new AI generator.'
    8: '2024 - 2025


      Fraud surged, like the $25M Arup video call scam, yet a CSIRO study found none of 16 leading detectors reliable on real-world deepfakes.'
    9: 'TODAY


      Detection is moving into Teams and call centers, but false alarms, free checkers and fast-changing generators still slow buying.'
    10: '2025 - 2026


      Budgets lag. In 2026, 74% of US security leaders suspected a deepfake attack but only 10% had dedicated tools.'
