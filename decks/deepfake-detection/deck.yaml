- id: ed210
  left: A REGULAR DEEPFAKE STARTUP
  logo: pindrop
  note:
  - We used Pindrop's releases and blog, its 2024 product launches and trade press on its funding
  - We treated "a regular deepfake startup" as a fictional baseline, shown here only for the contrast
  right: PINDROP
  rows:
  - - They build a lab detector before finding any paying buyer
    - They grew out of the founder's PhD thesis on phone audio
  - - They try to sell to everyone worried about fake media
    - They target banks and their call centers fighting fraud
  - - They launch a deepfake tool with no clients lined up
    - They signed 16 clients within months of launching Pulse
  - - They ask buyers to trust a lab accuracy score alone
    - They offered a warranty that pays for deepfakes they miss
  - - They ask clients to install a separate new system first first
    - They plug into contact center software like NICE CXone
  - - They raise small rounds and keep running short on cash
    - They added a $100M loan from Hercules Capital in 2024
  - - They report pilots instead of real recurring revenue
    - They passed $100M of annual recurring revenue in 2025
  - - They cannot show how much fraud they really stopped
    - They say clients avoided $283M of fraud losses in 2025
  section: Startup strategies
  src: 210
  title: How Pindrop turned call checks into $100M of yearly revenue
  type: contrast
  logo_src: ../../assets/logos/pindrop.png
- id: ed211
  left: A REGULAR DEEPFAKE STARTUP
  logo: realitydefender
  note:
  - We used Reality Defender's releases, its funding coverage and the KPMG and Gartner announcements
  - We treated "a regular deepfake startup" as a fictional baseline, shown here only for the contrast
  right: REALITY DEFENDER
  rows:
  - - They rely on one model trained on one kind of fake
    - They run a group of detection models side by side
  - - They focus on a single format such as video files only
    - They check calls, video and chat for impersonation risk
  - - They chase consumers who will not pay for detection
    - They put real-time checks into tier-one bank call centers
  - - They stay unknown to the big corporate security buyers
    - They won the RSA Innovation Sandbox startup contest
  - - They raise money only from generalist venture funds
    - They raised $33M with IBM, Accenture and Booz Allen
  - - They make clients leave their usual video meeting tools
    - They scan live meetings inside Zoom and Microsoft Teams
  - - They stay small and wait for big buyers to find them
    - BNY and Samsung Next invested as strategic partners
  - - They never get outside proof that they lead the field
    - Gartner named them a Market Shaper, KPMG invested
  section: Startup strategies
  src: 211
  title: How Reality Defender went from bank calls to a KPMG stake
  type: contrast
  logo_src: ../../assets/logos/reality-defender.png
- id: ed212
  left: A REGULAR DEEPFAKE STARTUP
  logo: getrealsecurity
  note:
  - We used GetReal's funding announcements, TechCrunch and SecurityWeek coverage and the WIRED report
  - We treated "a regular deepfake startup" as a fictional baseline, shown here only for the contrast
  right: GETREAL SECURITY
  rows:
  - - They are started by engineers new to media forensics
    - Hany Farid, a pioneer of deepfake forensics, co-founded it
  - - They rush a product out long before it really works
    - Ballistic Ventures incubated them for two years first
  - - They only check uploaded files, after the damage is done
    - They spot face swaps inside live video calls as they happen
  - - They give a raw score with no human expert behind it
    - They add an incident response team with forensic analysts
  - - They sell one tool that is hard to plug into systems
    - They offer a web app, an API and ready-made integrations
  - - They raise money without any strategic backers on board
    - In-Q-Tel, Cisco and Capital One backed their Series A
  - - They cannot name a single large customer in public
    - They named John Deere and Visa among their customers
  - - They run out of cash before they can prove demand
    - They raised an $18M Series A led by Forgepoint in 2025
  section: Startup strategies
  src: 212
  title: How GetReal Security turned forensic science into a business
  type: contrast
  logo_src: ../../assets/logos/getreal-security.png
- id: ed213
  left: A REGULAR DEEPFAKE STARTUP
  logo: clarity
  note:
  - We used Clarity's funding coverage, Deel's acquisition release and Israeli and fintech trade press
  - We treated "a regular deepfake startup" as a fictional baseline, shown here only for the contrast
  right: CLARITY
  rows:
  - - They see deepfakes as a one-time media problem to fix
    - They treat deepfakes like viruses that keep mutating
  - - They hire a big team before they find their market
    - They raised a $16M seed round with just 13 employees
  - - They chase newsrooms that have very small budgets
    - They aimed at fake job seekers, a fast-growing threat
  - - They check files only after they have been uploaded
    - They catch deepfakes live during remote job interviews
  - - They ignore the fake candidates buyers see coming
    - Gartner sees 1 in 4 job candidates being fake by 2028
  - - They keep a lab team with no fraud-fighting experience
    - A founder of fraud firm nSure.ai joined as CTO in 2025
  - - They look for a buyer only when the cash runs out
    - Deel bought them for an estimated $40M to $50M in 2026
  - - They end up as a minor feature that few people use
    - Deel puts their checks across hiring and IT access
  section: Startup strategies
  src: 213
  title: How Clarity turned deepfake checks into a sale to Deel
  type: contrast
  logo_src: ../../assets/logos/clarity.png
- id: ed214
  left: A REGULAR DEEPFAKE STARTUP
  logo: doppel
  note:
  - We used Doppel's funding releases and Fortune, SecurityWeek and Pulse 2.0 coverage of its rounds
  - We treated "a regular deepfake startup" as a fictional baseline, shown here only for the contrast
  right: DOPPEL
  rows:
  - - They wait for a deepfake attack to land before acting
    - They hunt fake sites, accounts and ads across the web
  - - They flag fakes but leave the cleanup to the client
    - They take down fake accounts and sites automatically
  - - They treat each fake account as a separate new case
    - They map every attacker in a real-time threat graph
  - - They train their staff with slides and old phishing tests
    - They train staff with realistic deepfake simulations
  - - They spend many years before raising a growth round
    - Founded in 2022, they raised a $35M Series B in 2025
  - - They grow their value slowly, one round after another
    - Their value rose from $205M to over $600M in six months
  - - They raise from small funds with no follow-on money
    - Bessemer led both their Series B and Series C rounds
  - - They stop at detection while attacks keep growing
    - They have raised $124M in total to grow the platform
  section: Startup strategies
  src: 214
  title: How Doppel tripled its value in six months
  type: contrast
  logo_src: ../../assets/logos/doppel.png
