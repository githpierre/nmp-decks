- id: ed017
  type: maturity
  section: Market definition
  title: How mature is deepfake detection as a market?
  score: 40
  text: The market is real because banks, call centers, platforms and the US Department of Defense pay for detection today. The score stays below the middle because only a small share of firms use it, detectors lose accuracy on new fakes, and buyers often get it as a feature of identity or security tools.
  note:
  - We rate market maturity with an internal score of products on sale, paying clients, big buyers and funding.
  - We set 40/100 because demand is real, but use stays thin and detectors must keep up with new fakes.
