- id: ed006
  type: definition
  section: Market definition
  title: What is deepfake detection, in simple terms?
  text: It is the market for software that checks whether a face, a voice, a video or a document was faked with AI, so banks, call centers and platforms can stop fraud in time
  note: We use a plain definition here because it makes the boundary with identity checks and content moderation, which use detection without being built around it, easier to see.
  src: 6
  icon_tl: 🔍
