ed160:
  6: Media forensics took about 53% of the capital raised since 2024, ahead of Meeting protection with about 28%
  7: 24 of the 28 rounds since 2024 disclosed an amount, and the median disclosed round was $6.1M
  8: US startups closed 16 of the 28 rounds and took $173M, about 76% of all the money raised since 2024
  9: No round reached $100M since 2024, so the market still grows through seed and Series A rounds
  10: The $28M round of Blackbird.AI is the biggest since 2024, ahead of the $25M round of Modulate
  11: Seed was the most common round, with 11 of the 28 rounds, ahead of Series A with 6 and Series B with 1
  note: We drew these insights from our tracker of 28 deepfake detection equity rounds announced since January 2024, worth about $226M
ed162:
  6: 'BEFORE



    Before 2024, detection was mostly research funded by DARPA and big tech, with a few early startups like Sensity.'
  7: 'AFTER



    Since 2024, 28 rounds raised $226M. Media forensics takes the biggest share, and meeting protection comes next.'
  note: We used our tracker of deepfake detection equity rounds, complete from January 2024, and company releases and the press
