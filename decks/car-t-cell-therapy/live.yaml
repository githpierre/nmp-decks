ed148p:
  title: 'What pushed the CAR-T cell therapy

    market forward, year after year?'
  events:
  - year: '1989'
    text: Engineered T cells gain synthetic receptors
    impact: 1.0
  - year: '1993'
    text: First generation CARs prove targeting
    impact: 1.0
  - year: '2002'
    text: Costimulation makes CAR T durable
    impact: 1.5
  - year: '2010'
    text: CD19 CAR T induces deep remissions
    impact: 2.0
  - year: '2012'
    text: Pediatric leukemia response drives attention
    impact: 2.0
  - year: '2013'
    text: Breakthrough status accelerates CAR T
    impact: 1.5
  - year: '2014'
    text: Industry partnerships scale manufacturing
    impact: 1.5
  - year: '2016'
    text: Pivotal trials confirm leukemia efficacy
    impact: 2.0
  - year: '2017'
    text: Kymriah becomes first FDA CAR T
    impact: 3.0
  - year: '2017'
    text: Yescarta validates lymphoma demand
    impact: 2.5
  - year: '2018'
    text: Centers build CAR T delivery programs
    impact: 1.5
  - year: '2019'
    text: Manufacturing capacity expands globally
    impact: 1.0
  - year: '2020'
    text: Tecartus reaches mantle cell lymphoma
    impact: 1.5
  - year: '2021'
    text: Abecma opens BCMA multiple myeloma
    impact: 2.0
  - year: '2021'
    text: Breyanzi widens lymphoma treatment choice
    impact: 1.0
  - year: '2022'
    text: Carvykti raises myeloma efficacy bar
    impact: 2.0
  - year: '2022'
    text: Earlier line use expands eligible patients
    impact: 1.5
  - year: '2023'
    text: China approvals intensify CAR T competition
    impact: 1.0
  - year: '2023'
    text: Autoimmune CAR T results open new demand
    impact: 1.5
  - year: '2024'
    text: Aucatzyl adds adult ALL option
    impact: 1.0
  - year: '2024'
    text: Earlier myeloma approvals lift referrals
    impact: 1.5
  - year: '2024'
    text: Labels standardize malignancy monitoring
    impact: 1.0
  - year: '2025'
    text: China adds more BCMA CAR T capacity
    impact: 1.0
  - year: '2025'
    text: In vivo CAR T enters clinical testing
    impact: 2.0
  - year: '2025'
    text: Autoimmune trials broaden CAR T demand
    impact: 1.5
  - year: '2026'
    text: Satri cel cracks solid tumors
    impact: 3.0
  - year: '2026'
    text: IASO206 proves in vivo BCMA responses
    impact: 2.0
  - year: '2026'
    text: MT 304 enters solid tumor trial
    impact: 1.5
  - year: '2026'
    text: In vivo pipelines target autoimmunity
    impact: 1.5
  - year: '2026'
    text: Allogeneic programs expand autoimmune testing
    impact: 1.0
  note:
  - We kept the events we believe pushed car t cell therapy forward the most
  - Ratings are our estimates, with all the sources at the end of the report
