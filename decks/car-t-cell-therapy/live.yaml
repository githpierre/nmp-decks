ed007p:
  type: pp_radar
  title: 'Who Is in CAR-T cell therapy,

    and who stays outside?'
  TL:
    name: Artiva
    src: ../../assets/logos/pp_live/car-t-cell-therapy/s01-00.png
    text: develops allogeneic NK cell therapies, which are immune cell therapies but are not CAR-T products
  TR:
    name: Illumina
    src: ../../assets/logos/pp_live/car-t-cell-therapy/s01-02.png
    text: provides sequencing technology used in cell therapy research but does not develop engineered CAR-T medicines
  BL:
    name: AstraZeneca
    src: ../../assets/logos/pp_live/car-t-cell-therapy/s01-09.png
    text: expanded into in vivo CAR-T through acquisitions, but its core business — remains conventional biopharma
  BR:
    name: Bristol Myers Squibb
    src: ../../assets/logos/pp_live/car-t-cell-therapy/s01-10.png
    text: sells multiple CAR-T products, while the company also has a much larger portfolio of non CAR-T medicines
  caption:
  - Distance to the center reflects how central each company is to CAR-T cell therapy
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
