- id: xh_unitree_A
  type: x/sig_key_trend
  section: Market opportunity
  pill: SIGNAL
  title: 'Unitree should sell about 12,000 humanoids

    in 2026, more than double its 2025 sales'
  t:
    9: 5,215
    10: '2025'
    12: 12,000
    13: 2026 (EST.)
    15: ×2.3
    16: WHY IT IS HOT
    17: 'Unitree shipped about 5,900 humanoids in the first half of 2026 alone, more than in all of 2025. At this pace it should sell about 12,000 this year.

      Its revenue grew 56% in the first nine months of 2026, and Morgan Stanley expects 14,000 units for the year.'
  vbars:
  - 5215
  - 12000
  note: &id002
  - We doubled the 5,900 humanoids that Smart Analytics Global estimates Unitree shipped in the first half of 2026
  - We took the 5,215 sold in 2025 from its prospectus, and Morgan Stanley forecasts 14,000 units for 2026
  fresh: &id001
    period: year
    end: 2026-12
