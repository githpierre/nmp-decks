ed007p:
  type: pp_radar
  title: 'Who Is in agentic commerce,

    and who stays outside?'
  TL:
    name: Perplexity AI
    src: ../../assets/logos/pp_live/agentic-commerce/s01-00.png
    text: search now supports shopping actions, but commerce is still one use case inside a general answer engine
  TR:
    name: Amazon
    src: ../../assets/logos/pp_live/agentic-commerce/s01-02.png
    text: operates a large online marketplace and its own assistants, not a neutral agentic commerce software platform
  BL:
    name: Stripe
    src: ../../assets/logos/pp_live/agentic-commerce/s01-09.png
    text: payments and agent commerce protocols enable transactions, but the company remains a broad payments platform
  BR:
    name: Shopify
    src: ../../assets/logos/pp_live/agentic-commerce/s01-10.png
    text: merchant platform is adding agentic interfaces and checkout, but most revenue still comes from standard commerce
  caption:
  - Distance to the center reflects how central each company is to agentic commerce
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
  - ../../assets/logos/pp_live/agentic-commerce/s01-01.png
