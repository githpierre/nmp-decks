ed007p:
  type: pp_radar
  title: 'Which companies really belong

    in robot foundation models?'
  TL:
    name: Figure AI
    src: ../../assets/logos/pp_live/robot-foundation-models/s01-00.png
    text: builds humanoid robots with AI models, but most value sits in integrated robot hardware and deployments
  TR:
    name: Agility Robotics
    src: ../../assets/logos/pp_live/robot-foundation-models/s01-02.png
    text: sells humanoid robot ~~ systems and operations rather than reusable foundation models for many robot bodies
  BL:
    name: Meta
    src: ../../assets/logos/pp_live/robot-foundation-models/s01-09.png
    text: publishes embodied AI models and research, but robotics is a small part of its much broader AI platform
  BR:
    name: NVIDIA
    src: ../../assets/logos/pp_live/robot-foundation-models/s01-10.png
    text: builds GROOT foundation models but also sells the compute, simulation and robotics stack around those models
  caption:
  - Distance to the center reflects how central each company is to robot foundation models
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
