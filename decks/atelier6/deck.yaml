      pct: 21
      text: Europe follows, slowed by language diversity and strict privacy rules that make every rollout longer.
    apac:
      pct: 17
      text: Asia-Pacific grows with India and the Philippines, where outsourced call centers start to use AI agents.
    latam:
      pct: 5
      text: Latin America tests voice agents in banks and telecom companies, mostly in Spanish and Portuguese.
    mea:
      pct: 5
      text: The Middle East buys AI agents for government services and airlines, often in Arabic and English.
