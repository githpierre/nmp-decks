market: Workshop 6
label: EdTech market
quarter: judge
year: 2026
slug: atelier6
chapters: []
slides:
- type: worldmap
  section: Market size
  title: 'Where in the world is

    EdTech money spent?'
  regions:
    na:
      pct: 36
      text: North America leads because US schools and employers buy the most learning software. Duolingo, Coursera, and PowerSchool are all based there.
      end: h
    eu:
      pct: 27
      text: Europe grows with Preply, Multiverse, and Knowunity, and its learning startups raised $1.85 billion in 2025. Schools buy country by country, which slows scale for most startups.
    apac:
      pct: 22
      text: Asia-Pacific grows fastest, led by India, where PhysicsWallah went public in 2025. China shrank after its 2021 ban on for-profit tutoring.
    latam:
      pct: 6
      text: Latin America is led by Brazil and Mexico, where startups like Teachy and Luca sell AI tools to teachers. Budgets are tight, so growth is slower.
    mea:
      pct: 9
      text: The Middle East invests heavily, and Saudi Arabia started teaching AI to 6 million students in 2025. Africa has many young learners but small budgets.
  note:
  - We combined the regional shares of Grand View, Fortune Business Insights, and IMARC, adjusted to our definition
  hl: na
