rows:
- name: 'Gold Hydrogen,

    Ramsay 3 flow test'
  why: Gold Hydrogen's release of November 2026 on hydrogen flowed and separated at Ramsay 3
  how: We used it for the first surface flow and the 100 kg a day model. It also showed what is still unproven.
  url: https://investorhub.goldhydrogen.com.au/announcements/Zo2Yxg-groundbreaking-natural-hydrogen-results-confirmed
- name: 'HyTerra, quarterly

    report October 2026'
  why: HyTerra's report on the 14-day McCoy-1 test in Kansas, with gas rates and purity
  how: We used it for the weak 0.4% hydrogen result. It also backed the risks of dry or weak wells.
  url: https://financialfilings.com/filings/hyterra-ltd/interim-quarterly-report/2026/74886393
- name: 'Mantle8,

    $36M Series A'
  why: Mantle8's release on its €31M round of May 2026, led by Sandwater
  how: We used it for the round, the backers and the drilling plan. It also set the size of recent checks.
  url: https://mantle8.com/mantle8-raises-e31m-in-series-a-funding-to-prove-commercial-viability-of-natural-hydrogen-production
- name: 'USGS, hydrogen

    prospectivity map'
  why: The first public map of where geologic hydrogen may collect in the lower 48 states
  how: We used it for the source, trap and seal criteria. It also showed which US regions draw explorers.
  url: https://www.usgs.gov/publications/prospectivity-mapping-geologic-hydrogen
- name: 'Koloma, third

    Philippine contract'
  why: Koloma's release of July 2026 on its third exploration contract in the Philippines
  how: We used it for the 4,100 square kilometers of search area. It also dated Koloma's move abroad.
  url: https://www.koloma.com/koloma-expands-natural-hydrogen-exploration-operations-in-the-philippines
- name: 'IEA, Global Hydrogen

    Review 2026'
  why: The IEA's answers on geologic hydrogen in its 2026 review, with venture and project counts
  how: We used it for the 15% of hydrogen VC and the one producing well. It also framed the timeline.
  url: https://www.iea.org/reports/global-hydrogen-review-2026/key-questions-about-hydrogen
- name: 'Hydroma, natural

    hydrogen in Mali'
  why: Hydroma's page on the Bourakébougou field and its village power pilot since 2012
  how: We used it for the only field that has produced hydrogen. It also dated the start of the market.
  url: https://hydroma.ca/en/natural-hydrogen.html
- name: 'H2Au, first

    Kansas well'
  why: H2Au's release of August 2026 on spudding its first operated well in Chase County
  how: We used it for the newest US wells. It also showed the joint venture with 45-8 ENERGY.
  url: https://www.h2au.co/news/h2au-spuds-its-first-natural-hydrogen-and-helium-wildcat-well-in-kansas
- name: 'HyTerra, Sue

    Duroche-3 results'
  why: HyTerra's release on up to 96.1% hydrogen in the mud gas of its Kansas well
  how: We used it for the purity readings. It also showed why a sample is not a flow test.
  url: https://hyterra.com/hyterra-lays-foundation-for-hydrogen-testing-at-the-nemaha-project-in-kansas
- name: 'S&P Global,

    Koloma funding'
  why: S&P Global's article of January 2025 on Koloma's $394M raised, from SEC filings
  how: We used it for Koloma's rounds of 2024. It also showed how quiet the leader stays on results.
  url: https://www.spglobal.com/energy/en/news-research/latest-news/energy-transition/012425-geologic-hydrogen-explorer-koloma-with-400-mil-in-funding-quiet-on-next-step
- name: 'Natural hydrogen

    cost study, 2025'
  why: A peer-reviewed model of 32,000 extraction cases and their cost per kilogram
  how: We used it for the $0.14 to $5.33 cost range. It also showed how purity changes payback.
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12485604
- name: 'Snowfox Discovery,

    $30M Series A'
  why: Snowfox Discovery's release on its $30M round led by bp Ventures with Rio Tinto Ventures
  how: We used it for the round and its backers. It also showed big groups entering the market.
  url: https://snowfoxdiscovery.com/latest/snowfox-discovery-ltd-announces-formal-close-of-oversubscribed-30m-usd-series-a-funding-round
- name: 'Mali hydrogen field,

    Scientific Reports'
  why: A peer-reviewed study of the Bourakébougou field, its 98% hydrogen gas and its wells
  how: We used it for the gas purity and the flow of the Mali well. It also backed the history slides.
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC10363119
- name: 'South Australia,

    Gold Hydrogen permits'
  why: The South Australian government page on Gold Hydrogen's licenses and drilling approvals
  how: We used it for the steps from license to drilling. It also backed the permit risks.
  url: https://www.energymining.sa.gov.au/industry/energy-resources/regulation/projects-of-public-interest/natural-hydrogen-exploration/gold-hydrogen-natural-hydrogen-exploration
- name: 'MAX Power,

    Lawson 5 well'
  why: MAX Power's release of October 2026 on its Lawson 5 well in Saskatchewan
  how: We used it for the 2026 drilling count. It also showed the size of its Canadian campaign.
  url: https://www.maxpowermining.com/max-power-expands-scale-of-saskatchewan-natural-hydrogen-system-with-lawson-5-commences-follow-up-well
- name: 'Eden GeoPower,

    stimulated hydrogen'
  why: Eden GeoPower's page on electrical stimulation of iron-rich rocks to make hydrogen
  how: We used it to explain stimulated hydrogen. It also backed the moonshot slides.
  url: https://www.edengeopower.com/stimulated-geologic-hydrogen
- name: 'Natural hydrogen

    resource study, 2026'
  why: A 2026 paper on why oil and gas methods do not transfer well to hydrogen fields
  how: We used it for the limits of resource estimates. It also backed the tech bottlenecks.
  url: https://www.sciencedirect.com/science/article/pii/S030626192600694X
- name: 'Refill study,

    January 2026'
  why: A 2026 peer-reviewed analysis of whether hydrogen fields can refill fast enough
  how: We used it for the doubts on self-refilling fields. It also backed the market challenges.
  url: https://pubmed.ncbi.nlm.nih.gov/41565986
- name: 'IEA, executive

    summary 2026'
  why: The executive summary of the IEA Global Hydrogen Review 2026
  how: We used it for the 20% of firm hydrogen deals. It also framed the buyer risk.
  url: https://www.iea.org/reports/global-hydrogen-review-2026/executive-summary
- name: 'Vema Hydrogen,

    Quebec pilot wells'
  why: Vema's release of February 2026 on the first two pilot wells that make hydrogen from rock
  how: We used it for the stimulated hydrogen pilots. It also dated the newest technology step.
  url: https://www.globenewswire.com/news-release/2026/02/03/3230886/0/en/Vema-Hydrogen-Drills-Pilot-Wells-in-Quebec-for-World-s-First-Engineered-Mineral-Hydrogen-Test-Project.html
