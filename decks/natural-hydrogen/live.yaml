ed007p:
  type: pp_radar
  title: 'Who is in natural hydrogen,

    and who stays outside?'
  TL:
    name: Electric Hydrogen
    src: ../../assets/logos/pp_live/natural-hydrogen/s01-00.png
    text: builds electrolyzers for manufactured green hydrogen, not exploration or production of naturally occurring hydrogen
  TR:
    name: Plug Power
    src: ../../assets/logos/pp_live/natural-hydrogen/s01-02.png
    text: sells electrolyzers and fuel-cell hydrogen systems, but does not develop underground natural-hydrogen resources
  BL:
    name: BP
    src: ../../assets/logos/pp_live/natural-hydrogen/s01-09.png
    text: has venture exposure to natural hydrogen, but its core business is oil, gas and broader low-carbon energy
  BR:
    name: Fortescue
    src: ../../assets/logos/pp_live/natural-hydrogen/s01-10.png
    text: invests in natural hydrogen exploration while its main hydrogen strategy centers on manufactured green hydrogen
  caption:
  - Distance to the center reflects how central each company is to natural hydrogen
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
