ed142p:
  title: 'What are the biggest threats

    to the natural hydrogen market?'
  events:
  - odds: 50
    impact: 2
    text: Geophysical tools fail to distinguish deep hydrogen from shallow artifacts, driving costly false-positive drilling
  - odds: 45
    impact: 3
    text: HyTerra, Gold Hydrogen or Koloma drills several dry wells, reducing investor confidence in geologic hydrogen prospectivity
  - odds: 45
    impact: 3
    text: USGS studies show replenishment is slower than promoters expect, weakening claims that natural hydrogen is renewable at scale
  - odds: 45
    impact: 2
    text: Explorers fail to secure industrial offtake near discoveries, forcing costly pipelines or on-site conversion projects
  - odds: 40
    impact: 2
    text: US and French regulators classify natural hydrogen wells like oil and gas, adding permits, bonding and methane-style controls
  - odds: 40
    impact: 2
    text: Venture funding shifts from frontier hydrogen after weak exits, leaving small explorers unable to finance appraisal wells
  - odds: 35
    impact: 2
    text: Low green-hydrogen prices weaken exploration economics before natural hydrogen proves repeatable commercial flow
  - odds: 25
    impact: 3
    text: A hydrogen leak triggers tighter safety rules for exploration drilling across Australia, France and the United States
  note:
  - We listed the events that could slow natural hydrogen down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and you will find all the sources we used at the end of the report
