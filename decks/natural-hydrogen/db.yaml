ed160:
  6: Hydrogen explorers took about 77% of the capital raised since 2024, ahead of subsurface mapping with about 18%
  7: 8 of the 11 rounds since 2024 disclosed an amount, and the median disclosed round was $22M
  8: US startups closed 5 of the 11 rounds and took $317M, mostly Koloma, while French startups closed 4
  9: Rounds of $100M or more, 1 in all, made up about 63% of the capital raised since 2024
  10: The $246M Series B round of Koloma is the biggest since 2024, ahead of the $50M round of Koloma
  11: Seed was the most common round, with 4 of the 11 rounds, ahead of Series A with 2 and Series B with 2
  note: We drew these insights from our tracker of 11 natural hydrogen equity rounds announced since January 2024, worth about $389M
ed162:
  6: 'BEFORE



    Before 2024, few startups chased natural hydrogen. Koloma led them with a $56M round in 2022, and only one well, in Mali, had ever produced hydrogen.'
  7: 'AFTER



    Since 2024, 11 rounds raised $389M. Hydrogen explorers take the biggest share, led by Koloma, and new wells in Australia and Canada find very pure hydrogen.'
  note: We used our tracker of natural hydrogen equity rounds, complete from January 2024, and company releases and the press
