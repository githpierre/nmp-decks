ed162:
  6: 'BEFORE



    Before 2024, few startups chased natural hydrogen. Koloma led them with a $56M round in 2022, and only one well, in Mali, had ever produced hydrogen.'
  7: 'AFTER



    Since 2024, {db.n} rounds raised {db.total}. Hydrogen explorers take the biggest share, led by Koloma, and new wells in Australia and Canada find very pure hydrogen.'
  note: We used our tracker of natural hydrogen equity rounds, complete from January 2024, and company releases and the press
