- id: ed091
  type: x/has_tech_infra_evolved_over
  section: Tech and infra
  title: How has tech and infra evolved over the years?
  note: We track field operations and public research milestones because a gas sample does not demonstrate steady, economic output.
  src: 91
  t:
    6: '2012 - 2020


      Hydroma used a natural hydrogen well to power a Mali village, then drilled more wells to study the local gas-bearing rock layers'
    7: '2021 - 2023


      The Hoarty NE3 well in Nebraska and Ramsay wells in Australia brought dedicated drilling and gas sampling to new regions'
    8: '2024 - 2025


      US research funded rock stimulation, USGS mapped likely traps, and Kansas and South Australia drilled new hydrogen prospects'
    9: 'TODAY


      Tests now report actual gas flow as well as purity, with mixed results at McCoy-1, Lawson and Ramsay and no broad commercial rollout'
    10: '?


      Next steps may pair better imaging with longer flow tests, safer well seals and small pilots that prove both output and buyer demand'
