  type: x/where_80_value_sit
  section: Tech and infra
  title: Where does 80% of natural hydrogen value sit?
  note: We use the 80% framing as a judgment about likely bottlenecks, not a measured share of market revenue.
  src: 90
  t:
    8: 'Most potential value sits in finding a sealed hydrogen pocket and proving that a well can deliver enough gas for long enough to sell. A high reading alone is not a business.


      The next layer is reliable imaging and drilling, which can reduce the number of expensive dry wells and show where underground gas can move.


      Rock stimulation and gas cleanup may become major businesses, but their share of value depends on field tests, sustained output and actual buyer demand.'
