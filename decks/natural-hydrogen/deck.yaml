- id: ed024
  type: dated
  section: Market definition
  title: What has changed (very) recently?
  page: 1/2
  items:
  - d: SINCE 2024
    t: Koloma raised $246M in February 2024 and about $50M more in October, bringing its funding near $400M, by far the most of any natural hydrogen startup.
  - d: SINCE 2024
    t: Fortescue bought about 40% of HyTerra, the first company listed in Australia with a focus on natural hydrogen, to fund a larger drilling campaign in Kansas.
  - d: SINCE 2024
    t: The USGS estimated that about 5.6 trillion tonnes of hydrogen may sit underground, and said a small share could cover net-zero needs for about 200 years.
  - d: SINCE 2025
    t: The USGS published the first map of where natural hydrogen may collect in the US, with the Midcontinent and central California among the best areas.
  - d: SINCE 2025
    t: Snowfox Discovery, a spinout of Oxford University, raised a $30M Series A backed by bp Ventures and Rio Tinto Ventures to build its hydrogen search platform.
  - d: SINCE 2025
    t: Gold Hydrogen drilled its Ramsay 3 and Ramsay 4 wells in South Australia, and first lab tests found hydrogen up to 97% pure, after Toyota invested.
  note:
  - We kept the milestones that most changed well results, funding or the rules for drilling natural
  - hydrogen. There is no official timeline, and another analyst could pick a few different milestones here
  src: 24
- id: ed025
  type: dated
  section: Market definition
  title: What has changed (very) recently?
  page: 2/2
  items:
  - d: SINCE 2026
    t: MAX Power confirmed the first natural hydrogen discovery in Canada in January, with readings up to 28.6% hydrogen in its Lawson well in Saskatchewan.
  - d: SINCE 2026
    t: FDE won the Trois Évêchés exploration permit in Lorraine in January, and a well more than 3,600 m deep then confirmed large amounts of natural hydrogen.
  - d: SINCE 2026
    t: Vema Hydrogen drilled the first pilot wells that make hydrogen from rocks rich in iron, in Quebec, after signing to supply hydrogen for data center power.
  - d: SINCE 2026
    t: Mantle8 raised a $36M Series A in May, backed by Breakthrough Energy Ventures, to run a two-year exploration and drilling campaign for natural hydrogen.
  - d: SINCE 2026
    t: Iowa lawmakers passed rules for drilling hydrogen, with royalties for landowners and a state tax, as Koloma and Snowfox lease land in the state.
  - d: SINCE 2026
    t: The US Air Force picked HyTerra and Helix Exploration to test whether natural hydrogen near its bases in Kansas and Montana could supply them with power.
  note:
  - We kept the milestones that most changed well results, funding or the rules for drilling natural
  - hydrogen. There is no official timeline, and another analyst could pick a few different milestones here
  src: 25
