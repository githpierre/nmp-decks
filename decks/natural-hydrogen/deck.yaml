    text: USGS studies show replenishment is slower than promoters expect, weakening claims that natural hydrogen is renewable at scale
  - odds: 45
    impact: 2
    text: Explorers fail to secure industrial offtake near discoveries, forcing costly pipelines or on-site conversion projects
  - odds: 40
    impact: 2
    text: US and French regulators classify natural hydrogen wells like oil and gas, adding permits, bonding and methane-style controls
  - odds: 40
    impact: 2
    text: Venture funding shifts from frontier hydrogen after weak exits, leaving small explorers unable to finance appraisal wells
  - odds: 35
    impact: 2
    text: Low green-hydrogen prices weaken exploration economics before natural hydrogen proves repeatable commercial flow
  - odds: 25
    impact: 3
