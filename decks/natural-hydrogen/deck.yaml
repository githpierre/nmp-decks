- id: ed006
  type: definition
  section: Market definition
  title: What is natural hydrogen, in simple terms?
  text: Natural hydrogen is the market for companies that find, test and produce hydrogen gas made by rocks deep underground, instead of making it in a factory
  note: We use a conversational definition here because it makes the boundary with hydrogen made in factories, from gas or with electricity, easier to understand.
  src: 6
  icon_tl: 💧
