- id: ed210
  left: A TYPICAL EARLY EXPLORER
  logo: mantle8
  note:
  - We used Mantle8 field releases, permit details and its funding announcement to describe the real strategy.
  - We treated the regular explorer as a fictional baseline. Its habits are a contrast, not measured averages.
  right: MANTLE8
  rows:
  - - They pick drill sites from gas readings at the surface
    - They trace rock sources and gas traps with HOREX imaging
  - - They make a flat map and guess where gas could gather
    - Their 4D work mapped a live hydrogen system in France
  - - They try to survey land before securing legal access
    - They received a Comminges permit in April 2026 to study it
  - - They plan one small tract without an area-wide survey
    - Their French permit covers more than 739 square km of land
  - - They rely on borrowed maps with little distinct method
    - They combine GeoLogix, HOREX and APoGeH in one tool set
  - - They raise only enough cash for the next field survey
    - They raised €31M in May 2026 for a global field campaign
  - - They rush to drill before finding which rock may seal gas
    - They run non-invasive surveys before picking drill sites
  - - They say a mapped reservoir must already produce gas
    - They still need wells to prove steady, commercial gas flow
  section: Startup strategies
  src: 210
  title: How Mantle8 turned rock maps into a funded exploration plan
  type: contrast
  logo_src: ../../assets/logos/mantle8.png
- id: ed211
  left: A TYPICAL EARLY EXPLORER
  logo: snowfox-discovery
  note:
  - We used Snowfox Discovery land records, field plans, scientific partnerships and Series A announcement.
  - We treated the regular explorer as a fictional baseline. Its habits are a contrast, not measured averages.
  right: SNOWFOX DISCOVERY
  rows:
  - - They lease any block where a surface gas seep is seen
    - They use rock studies and geologic models to rank sites
  - - They use one method to estimate buried hydrogen gas
    - They added 39Alpha models of water and rock chemistry
  - - They buy leases far from any possible industrial user
    - Their Audubon site sits near farms and ammonia plants
  - - They pitch a large region but lease no land in its core
    - They leased over 10,000 acres in Audubon County, Iowa
  - - They keep all their acreage in a single county only
    - They added 4,000 acres in Carroll County in late 2026
  - - They claim a global hunt without naming local projects
    - They named Audubon and Carroll as two Iowa projects
  - - They seek small checks from a narrow set of backers
    - Their $30M round brought backing from bp and Rio Tinto
  - - They call an untested lease a ready gas producing field
    - Their two Iowa sites have drilling plans, not gas sales
  section: Startup strategies
  src: 211
  title: How Snowfox Discovery secured land before drilling
  type: contrast
  logo_src: ../../assets/logos/snowfox-discovery.png
- id: ed212
  left: A TYPICAL EARLY EXPLORER
  logo: vema-hydrogen
  note:
  - We used the company pilot release, investor statements and interviews to separate tests from sales.
  - We treated the regular explorer as a fictional baseline. Its habits are a contrast, not measured averages.
  right: VEMA HYDROGEN
  rows:
  - - They search only for a gas trap that nature has filled
    - They aim to make hydrogen when iron-rich rock meets water
  - - They trust slow rock chemistry to make enough gas alone
    - They inject a brine mix to speed hydrogen-making reactions
  - - They wait for a full field plan before ever drilling wells
    - They drilled two Quebec pilot wells early in 2026 for data
  - - They claim a commercial yield from a first rock sample
    - They are still gathering data to model how wells perform
  - - They assume standard gas permits will cover new methods
    - They say new permits are a key barrier to scaling up
  - - They pick any site without regard for transport costs
    - They aim for nearby users that pay more for hydrogen
  - - They say a pilot well means product is on sale today
    - Their own plan says field tests continue through 2026
  - - They fund expansion before they prove the rock process
    - They raised $13M to fund the first pilot well program
  section: Startup strategies
  src: 212
  title: How Vema Hydrogen moved rock chemistry into pilot wells
  type: contrast
  logo_src: ../../assets/logos/vema-hydrogen.png
- id: ed213
  left: A TYPICAL EARLY EXPLORER
  logo: koloma
  note:
  - We used Koloma workflow disclosures, state drilling records and announcements on exploration rights.
  - We treated the regular explorer as a fictional baseline. Its habits are a contrast, not measured averages.
  right: KOLOMA
  rows:
  - - They choose a test spot based only on a surface gas seep
    - They check public cores and run their own data models
  - - They drill a deep well before taking a regional view
    - They use large aerial scans and then ground surveys
  - - They count a shallow test hole as a gas producing well
    - Their first wells gather data and are not sold as output
  - - They skip a lab check and call every sample a resource
    - They analyze field samples before drilling the next well
  - - They claim every new permit is proof of gas at depth
    - Their three Philippine contracts grant exploration rights
  - - They stay in one country even when promising plays move
    - They expanded exploration to Australia and Philippines
  - - They say a deep test well must be a commercial success
    - Their 11,445-foot Idaho test well was plugged in 2025
  - - They rely only on their seed funding for new regions
    - They gained a new strategic backer from JERA in 2026
  section: Startup strategies
  src: 213
  title: How Koloma built a repeatable search for underground hydrogen
  type: contrast
  logo_src: ../../assets/logos/koloma.png
- id: ed214
  left: A TYPICAL EARLY EXPLORER
  logo: georedox
  note:
  - We used GeoRedox technical claims and its Canada Nickel field announcement, with targets labeled as such.
  - We treated the regular explorer as a fictional baseline. Its habits are a contrast, not measured averages.
  right: GEOREDOX
  rows:
  - - They wait to find a sealed gas deposit under the land
    - They aim to make hydrogen faster in iron-rich rock beds
  - - They depend on new catalysts fed into each deep well
    - Their process aims to work without added catalysts
  - - They choose a site before anyone has logged the rocks
    - Their Ontario partner has many wells and rock records
  - - They try to run a field test without any site partner
    - They signed a field test pact with Canada Nickel in 2026
  - - They call a future project a field already selling gas
    - Their first test production is planned for 2027, not now
  - - They quote a firm gas price before running a real well
    - Their below $1/kg cost is a target, not a field result
  - - They make hydrogen from fossil gas shipped to the site
    - They aim to use natural water reactions with iron in rock
  - - They count the first plan as proof of repeat gas flows
    - Their 2026 work is about drilling and gathering site data
  section: Startup strategies
  src: 214
  title: How GeoRedox chose to make hydrogen inside rocks
  type: contrast
  logo_src: media/ini/georedox.png
