- id: ed042
  type: estimates
  section: Market size
  title: What are the market size estimates from different sources online?
  rows:
  - firm: 'BCC

      Research'
    value: $39M
    comment: BCC values the white hydrogen market at $39M in 2024. It is the lowest published benchmark here, but its underlying sales data are not public.
  - firm: 'Grand View

      Research'
    value: $4.6B
    comment: Its 2026 estimate includes exploration, processing and end uses. Its scale is hard to square with the tiny amount of gas actually being produced.
  - firm: 'IMARC

      Group'
    value: $4.5B
    comment: IMARC reports a broad white hydrogen market for 2025, with extraction technology and downstream users. It is not a count of verified upstream sales.
  - firm: 'Econ Market

      Research'
    value: $4.7B
    comment: Its 2026 estimate is close to Grand View, but is still a market model. No public field-by-field production and revenue ledger supports it.
  note:
  - We quote each publisher's own public figure for the year it gives, without calling a forecast verified sales
  - We do not average estimates that differ by over a hundredfold without comparable reported revenue data
