    13: '2023'
    14: HyTerra partner Natural Hydrogen Energy drilled Hoarty NE3 in Nebraska to 11,200 feet, then took gas samples for appraisal
    15: '2024'
    16: US energy research agency ARPA-E backed 16 projects with about $20M to test faster hydrogen generation from rocks
    17: '2025'
    18: USGS released its first lower-48 hydrogen prospect map, showing where gas sources, porous rock and tight seals may align
    19: '2025'
    20: HyTerra drilled Sue Duroche-3 in Kansas and measured up to 96.1% hydrogen in mud gas, then made it a monitoring well
    21: '2025'
    22: Gold Hydrogen drilled Ramsay 3 on South Australia’s Yorke Peninsula and logged up to 97% hydrogen, without a flow proof then
    23: '2025'
    24: Koloma secured two Philippine natural hydrogen exploration contracts, moving from geological screening toward field surveys
