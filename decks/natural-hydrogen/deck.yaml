- id: ed138
  type: x/regulation_evolving
  section: Market challenges
  title: How is regulation evolving?
  note: We compared published exploration rules and permit awards in Australia and France. A permit secures exploration rights but does not itself prove a resource or authorize sales.
  src: 138
