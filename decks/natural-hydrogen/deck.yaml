- id: ed014
  type: cards
  section: Market definition
  title: When and where is value created in the market?
  items:
  - e: 🔍
    t: When a survey points to rocks that make and trap hydrogen before any well is drilled
  - e: 🛢️
    t: When a well flows hydrogen steadily for weeks, not just traces in the mud
  - e: 💧
    t: When the gas comes out pure enough to sell with little costly cleaning at the well
  - e: 🎈
    t: When helium comes up with the hydrogen and its high price pays for the first wells
  - e: 🏭
    t: When a field sits next to ammonia, refining or steel plants that already buy hydrogen
  - e: 💲
    t: When hydrogen sells for under $1 per kilogram, below hydrogen made in plants
  - e: 📜
    t: When a government grants permits or passes a law to drill for hydrogen
  - e: 🔁
    t: When a field keeps refilling over time, so the same wells produce for many years
  src: 14
