- id: ed017
  type: maturity
  section: Market definition
  title: How mature is natural hydrogen as a market?
  score: 15
  text: The market is real because wells in Mali, Australia, Kansas and Canada found hydrogen, and bp, Fortescue and Toyota now invest. The score stays low because only one small field in Mali produces and no company has shown a steady commercial flow yet.
  note:
