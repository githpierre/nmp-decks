    7: '2021 - 2023


      South Australia opened a hydrogen permit route in 2021. Separate approvals were needed to drill.'
    8: '2024 - 2025


      France granted search rights, while a USGS map helped explorers screen likely ground.'
    9: '2026


      France issued a five-year Comminges permit. South Australia still requires work approval.'
    10: 'TODAY


      A right to explore is not a right to produce. Land access and drilling plans need further checks.'
    11: '?


      Rules may improve with more tests, but each new field must still prove safe, steady gas output.'
- id: iv_fda
  type: x/were_key_phases_market_acceleration
  section: Market challenges
  title: What does it take to turn a hydrogen find into supply?
  note: We used permit rules, exploration programs and operator flow reports to show the path from a gas reading to sales. Durations are broad illustrations, not fixed legal deadlines.
  src: 147
  t:
    7: 'GET RIGHTS


      A state grants exploration rights for years. France issued a five-year permit, not a right to sell.'
    8: 'MAP THE ROCKS


      Over months, explorers survey and pick a well. Koloma still ran seismic work in July 2026.'
    9: 'DRILL AND TEST


      The approved operator drills and tests for days or weeks. HyTerra ran a 14-day test at McCoy-1.'
    10: 'SELL THE GAS


      With approval, a firm cleans the gas and finds a buyer. New large fields remain unproved.'
    11: 'PROVE THE FIELD


      Over years, engineers must show reliable output and field size. Gold Hydrogen is still testing.'
- id: ed140
  type: x/where_schools_learners_vendors_clash
  section: Market challenges
  title: Where do explorers, buyers and regulators clash?
  src: 140
  t:
    0: Explorers want to test deep targets before each approval is issued
    7: Regulators want a safe plan for water, land access and drilling
    9: Explorers need room for surveys, wells and repeat tests
    10: Landowners want water use and site access controlled
    12: Developers hope rocks make new gas as wells draw hydrogen
    13: Researchers warn that replenishment may be too slow
    18: Investors want a rich gas sample to count as a discovery
    19: Buyers need a firm supply before switching fuel
    21: Developers want one permit to cover all future site work
    22: Regulators grant exploration rights, not automatic gas sales
    24: Startups cite low modeled costs before steady output is proven
    25: Buyers ask for delivered cost, pressure and gas purity
- id: iv_safety
  type: x/pain_points_yesterday_vs_today
  section: Market challenges
  title: What could go wrong for natural hydrogen?
  note: We used dated well results, academic production studies, government permit rules and hydrogen buying data. These are documented risks, not forecasts of project failure.
  src: 54
  t:
    6: 'WEAK WELLS



      HyTerra tested McCoy-1 for 14 days and reported about 0.1 thousand cubic feet of gas per day with only 0.4% hydrogen.'
    7: 'FALSE SIGNALS



      HyTerra found over 96% hydrogen in 2025 drill samples at Sue Duroche 3, but a sample alone does not prove saleable output.'
    8: 'FAST DECLINE



      A 2026 study found that commercially useful wells may need high gas output over two to three decades, not short-lived seepage.'
    9: 'PERMIT DELAYS



      In South Australia, an exploration license is not enough to drill. Environmental and site activity approvals still apply.'
    10: 'NO BUYERS



      IEA found only 20% of new low-emissions hydrogen deals were firm in 2025, exposing projects to buyer risk.'
