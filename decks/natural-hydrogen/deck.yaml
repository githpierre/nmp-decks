- id: ed132
  type: x/newcomers_often_miss_here
  section: Market challenges
  title: What do newcomers often miss here?
  note: We compared actual well tests with studies of reservoir behavior and projected costs. A strong gas reading is not the same as reliable, saleable output.
  src: 132
  t:
    17: A high hydrogen reading in a drill sample does not show usable gas flow over time
    21: A refill claim needs years of pressure and flow data, not one promising gas reading
    23: Low modeled costs assume strong wells, clean gas and cheap water handling
    25: Even a gas-rich well needs pressure, steady output and a buyer to earn revenue
    28: Hydrogen can move through rock or dissolve in water, hiding where it began
- id: ed133
  type: x/has_held_back_market_growth
  section: Market challenges
  title: What has held back market growth so far?
  note: We grouped the industry into broad phases using peer-reviewed research, government maps and operator filings. Exploration has advanced faster than proved commercial output.
  src: 133
  t:
    6: '2017 - 2020


      Mali showed underground hydrogen could power local use. But one unusual field did not prove explorers could repeat that result elsewhere.'
    7: '2021 - 2023


      South Australia opened permits for natural hydrogen. Gold Hydrogen drilled at Ramsay, but gas readings still needed flow tests.'
    8: '2024 - 2025


      USGS mapped promising US areas and researchers modeled global supply. Maps and huge estimates still could not prove how much gas wells would deliver.'
    9: 'TODAY


      Gold Hydrogen has separated gas in tests, but its target rate is modeled. Producers still need steady flow, permits and buyers.'
    10: '2025 - 2026


      Deep wells raised confidence, but HyTerra also reported weak flow. Most projects still lacked proved gas output.'
