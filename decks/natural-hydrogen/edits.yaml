  3: 'Natural hydrogen

    cost study, 2025'
  4: A peer-reviewed model of 32,000 extraction cases and their cost per kilogram
  5: We used it for the $0.14 to $5.33 cost range. It also showed how purity changes payback.
  7: 'Snowfox Discovery,

    $30M Series A'
  8: Snowfox Discovery's release on its $30M round led by bp Ventures with Rio Tinto Ventures
  9: We used it for the round and its backers. It also showed big groups entering the market.
  10: 'Mali hydrogen field,

    Scientific Reports'
  11: A peer-reviewed study of the Bourakébougou field, its 98% hydrogen gas and its wells
  12: We used it for the gas purity and the flow of the Mali well. It also backed the history slides.
  13: 'South Australia,

    Gold Hydrogen permits'
  14: The South Australian government page on Gold Hydrogen's licenses and drilling approvals
  15: We used it for the steps from license to drilling. It also backed the permit risks.
  16: 'MAX Power,

    Lawson 5 well'
  17: MAX Power's release of October 2026 on its Lawson 5 well in Saskatchewan
  18: We used it for the 2026 drilling count. It also showed the size of its Canadian campaign.
