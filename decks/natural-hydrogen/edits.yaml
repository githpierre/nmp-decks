  3: 'Gold Hydrogen,

    Ramsay 3 flow test'
  4: Gold Hydrogen's release of November 2026 on hydrogen flowed and separated at Ramsay 3
  5: We used it for the first surface flow and the 100 kg a day model. It also showed what is still unproven.
  7: 'HyTerra, quarterly

    report October 2026'
  8: HyTerra's report on the 14-day McCoy-1 test in Kansas, with gas rates and purity
  9: We used it for the weak 0.4% hydrogen result. It also backed the risks of dry or weak wells.
  10: 'Mantle8,

    $36M Series A'
  11: Mantle8's release on its €31M round of May 2026, led by Sandwater
  12: We used it for the round, the backers and the drilling plan. It also set the size of recent checks.
  13: 'USGS, hydrogen

    prospectivity map'
  14: The first public map of where geologic hydrogen may collect in the lower 48 states
  15: We used it for the source, trap and seal criteria. It also showed which US regions draw explorers.
  16: 'Koloma, third

    Philippine contract'
  17: Koloma's release of July 2026 on its third exploration contract in the Philippines
  18: We used it for the 4,100 square kilometers of search area. It also dated Koloma's move abroad.
