ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people ask how cheap

    drones kill and how to stop them'
  date: Recently.
  expl: Drones changed how wars are fought. Cheap drones now cause most losses in Ukraine, Israel and Iran used them at scale, and armies everywhere started
    buying them by the thousands. People watching the news wanted to understand how these drones kill and how to stop them.
  term: military drones
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/military-drones/military-drones.csv
ed052p:
  type: pp_cagr
  title: 'How much bigger can

    military drones get?'
  lead: ''
  condition: To get that big, armies must keep buying drones in bulk after the war in Ukraine, as standard kit for every unit, not as an emergency. The
    market must also fix its supply chains, with motors, magnets, and batteries made outside China at prices armies can afford.
  note:
  - We compared forecasts from Fortune Business Insights, MarketsandMarkets, Global Market Insights and Precedence
  - We adjusted each one to our market definition and built a realistic range, with all the sources at the end of the report
  size: 25
  cagr: 12
  y0: 2026
