ed142p:
  title: 'What could go wrong

    for military drones?'
  events:
  - odds: 45
    impact: 2
    text: Drone Dominance pushes one-way attack drone prices from $5,000 to $2,300 each, crushing margins for makers
  - odds: 40
    impact: 2
    text: AeroVironment, Rheinmetall and other primes copy or buy drone startups and win most large contracts
  - odds: 30
    impact: 2
    text: A lasting Ukraine ceasefire cuts urgent drone orders and removes the main battlefield testing ground
  - odds: 25
    impact: 3
    text: Congress cuts the $54.6 billion DAWG drone request by half or more, delaying large drone buys
  - odds: 25
    impact: 3
    text: China cuts off motors, magnets and batteries to Western drone makers, halting production for months
  - odds: 20
    impact: 2
    text: Investors pull back from defense tech after a few big failures, starving military drone startups of capital
  - odds: 10
    impact: 2
    text: A binding UN treaty bans autonomous weapons, forcing military drone makers to redesign their systems
  - odds: 10
    impact: 2
    text: New lasers and jamming systems knock down most attack drones, cutting demand for current military drone designs
  note:
  - We listed the events that could slow military drones down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
