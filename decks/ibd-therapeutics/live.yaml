ed148p:
  title: 'What pushed the IBD therapeutics

    market forward, year after year?'
  events:
  - year: '1955'
    text: Steroids prove inflammation can be controlled
    impact: 1.5
  - year: '1962'
    text: Azathioprine enables steroid-sparing care
    impact: 1.0
  - year: '1977'
    text: Mesalamine improves long-term UC control
    impact: 1.0
  - year: '1998'
    text: Infliximab validates targeted IBD biologics
    impact: 3.0
  - year: '2005'
    text: Infliximab expands biologics into UC
    impact: 2.0
  - year: '2007'
    text: Adalimumab brings self-injected anti-TNF
    impact: 1.5
  - year: '2008'
    text: Certolizumab broadens anti-TNF choice
    impact: 1.0
  - year: '2013'
    text: Golimumab adds monthly UC biologic
    impact: 1.0
  - year: '2013'
    text: Infliximab biosimilars lower biologic costs
    impact: 1.5
  - year: '2014'
    text: Vedolizumab makes gut-selective therapy real
    impact: 2.0
  - year: '2016'
    text: Ustekinumab opens IL-12/23 pathway
    impact: 2.0
  - year: '2018'
    text: Tofacitinib proves oral advanced UC therapy
    impact: 2.0
  - year: '2019'
    text: Ustekinumab reaches ulcerative colitis
    impact: 1.5
  - year: '2021'
    text: Ozanimod validates S1P modulation in UC
    impact: 2.0
  - year: '2021'
    text: JAK safety warning reshapes positioning
    impact: 0.5
  - year: '2022'
    text: Risankizumab validates selective IL-23
    impact: 2.5
  - year: '2022'
    text: Upadacitinib expands oral UC options
    impact: 1.5
  - year: '2023'
    text: Rinvoq becomes first oral Crohn therapy
    impact: 2.0
  - year: '2023'
    text: Mirikizumab expands IL-23 into UC
    impact: 1.5
  - year: '2023'
    text: Etrasimod deepens S1P competition
    impact: 1.5
  - year: '2023'
    text: Roche buys Telavant for TL1A
    impact: 2.0
  - year: '2023'
    text: Subcutaneous infliximab improves convenience
    impact: 1.0
  - year: '2024'
    text: Risankizumab expands into ulcerative colitis
    impact: 1.5
  - year: '2024'
    text: Guselkumab enters ulcerative colitis
    impact: 1.0
  - year: '2025'
    text: Guselkumab reaches Crohn disease
    impact: 1.5
  - year: '2025'
    text: Mirikizumab reaches Crohn disease
    impact: 1.0
  - year: '2025'
    text: Ustekinumab biosimilars cut prices
    impact: 1.0
  - year: '2026'
    text: Tulisokibart clears Phase 3 induction
    impact: 3.0
  - year: '2026'
    text: TL1A pipeline expands across modalities
    impact: 1.5
  - year: '2026'
    text: Treat-to-target raises efficacy expectations
    impact: 1.0
  note:
  - We kept the events we believe pushed ibd therapeutics forward the most
  - Ratings are our estimates, with all the sources at the end of the report
