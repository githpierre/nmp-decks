ed007p:
  type: pp_radar
  title: 'Who Is in IBD therapeutics,

    and who stays outside?'
  TL:
    name: Ironwood
    src: ../../assets/logos/pp_live/ibd-therapeutics/s01-00.png
    text: develops gastrointestinal drugs led by IBS and constipation, which fall outside inflammatory bowel disease
  TR:
    name: Exact Sciences
    src: ../../assets/logos/pp_live/ibd-therapeutics/s01-02.png
    text: sells cancer screening and diagnostic tests but does not develop therapies for Crohn disease or ulcerative colitis
  BL:
    name: Pfizer
    src: ../../assets/logos/pp_live/ibd-therapeutics/s01-09.png
    text: markets advanced IBD therapies, but inflammatory bowel disease is a small part of its global drug portfolio
  BR:
    name: Eli Lilly
    src: ../../assets/logos/pp_live/ibd-therapeutics/s01-10.png
    text: markets an IL-23 drug for ulcerative colitis, while most revenue comes from diabetes and other categories
  caption:
  - Distance to the center reflects how central each company is to IBD therapeutics
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
