ed142p:
  title: 'What are the biggest

    threats to defense ISR?'
  events:
  - odds: 25
    impact: 3
    text: The NRO cuts its commercial imagery contracts in tight budgets, hitting Vantor, Planet and BlackSky revenue
  - odds: 20
    impact: 3
    text: SpaceX wins most NRO satellite and space radar contracts, squeezing smaller defense ISR startups
  - odds: 20
    impact: 1
    text: Lockheed, L3Harris and Northrop buy ISR startups cheaply, as Lockheed did with Terran Orbital
  - odds: 15
    impact: 2
    text: Defense investors tire of ISR startups as satellite tracker rounds slow and valuations fall
  - odds: 12
    impact: 2
    text: New jamming and decoy tech blinds commercial satellite and drone sensors, cutting their military value
  - odds: 10
    impact: 1
    text: A launch failure destroys a batch of ISR satellites for BlackSky or Capella, delaying contracts
  - odds: 8
    impact: 2
    text: Governments ban commercial satellite images of war zones, closing a key market for Vantor and Planet
  - odds: 5
    impact: 2
    text: Wars in Ukraine and the Middle East end and NATO countries quietly cut ISR spending plans
  note:
  - We listed the events that could slow defense isr down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
