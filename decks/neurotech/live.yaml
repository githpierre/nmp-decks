ed142p:
  title: 'What are the biggest

    threats to neurotech?'
  events:
  - odds: 40
    impact: 2
    text: China approves more brain implants and scales them faster and cheaper than Neuralink and Western rivals
  - odds: 30
    impact: 2
    text: Neurotech investors pull back after Synchron and Neuralink keep missing timelines for approval and commercial launch
  - odds: 30
    impact: 3
    text: Medicare and US insurers refuse to pay for implanted brain devices, so few patients can afford them
  - odds: 25
    impact: 2
    text: GLP-1 drugs and gene therapies replace implants for sleep apnea and eye disease, shrinking neurotech markets
  - odds: 20
    impact: 1
    text: More states follow Colorado and California with strict neural data laws that block consumer neurotech business models
  - odds: 20
    impact: 2
    text: Another neurotech startup shuts down like Second Sight, leaving implanted patients without support and hurting trust
  - odds: 10
    impact: 2
    text: Hackers take control of a brain implant or neurostimulator, forcing Abbott or Medtronic into a broad recall
  - odds: 10
    impact: 3
    text: A patient dies in a Neuralink or Synchron implant trial, and the FDA pauses similar studies
  note:
  - We listed the events that could slow neurotech down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
