ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'The term neurotechnology is showing

    up more as Neuralink patients go viral'
  date: Over the past year.
  expl: Neuralink patients started playing video games and writing with their minds, and the videos went viral. Apple added brain-computer interface support,
    and new rules on “neural data” made headlines. Neurotechnology suddenly felt real, and people searched what it means.
  term: neurotech
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/neurotech/neurotech.csv
ed052p:
  type: pp_cagr
  title: 'How much room is left

    for neurotech to grow?'
  lead: 'To fill that room, '
  condition: nerve stimulation must win new uses, like arthritis, stroke, and depression, and keep being paid for by insurers. Brain- - computer interfaces
    must also win approvals in the US and Europe, and implants must reach thousands of patients each year.
  note:
  - We compared forecasts from Fortune Business Insights, Precedence, Mordor and The Business Research Company
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: 17
  cagr: 10
  y0: 2026
