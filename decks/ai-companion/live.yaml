ed007p:
  type: pp_radar
  title: 'Who Is in AI companion,

    and who stays outside?'
  TL:
    name: OpenAI
    src: ../../assets/logos/pp_live/ai-companion/s01-00.png
    text: chatGPT supports open conversation, but its primary roleisa ~~ general assistant for information and task completion
  TR:
    name: Slack
    src: ../../assets/logos/pp_live/ai-companion/s01-02.png
    text: connects human coworkers and ~~ teams, so social interaction comes from people rather than dedicated AI companions
  BL:
    name: Snap
    src: ../../assets/logos/pp_live/ai-companion/s01-09.png
    text: offers My AI inside a social network, so AI companionship is only one feature among human messaging and media
  BR:
    name: Grok
    src: ../../assets/logos/pp_live/ai-companion/s01-10.png
    text: includes companion characters, but most of the product is a general AI assistant integrated with the X ecosystem
  caption:
  - Distance to the center reflects how central each company is to AI companion
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
