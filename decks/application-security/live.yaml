ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'Application security searches grow

    as AI writes more and more code'
  date: Lately.
  expl: AI coding tools let teams ship far more code than before, and much of it is never reviewed line by line. Software supply chain attacks kept hitting
    the news, and teams went looking for ways to catch flaws before they reach users.
  term: application security
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/application-security/application-security.csv
ed052p:
  type: pp_cagr
  title: 'How much bigger can

    application security get?'
  lead: ''
  condition: To get that big, the market must find and fix flaws in code written by AI as fast as it is produced. It must also show developers fewer false
    alarms so security checks speed up releases instead of slowing them.
  note:
  - We compared forecasts from Grand View, Roots Analysis, Knowledge Sourcing Intelligence and ResearchAndMarkets
  - We adjusted each one to our market definition and built a realistic range, with all the sources at the end of the report
  size: 14
  cagr: 15
  y0: 2026
