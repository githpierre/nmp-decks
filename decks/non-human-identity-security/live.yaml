ed148p:
  title: 'What pushed the non-human identity

    market forward, year after year?'
  events:
  - year: '2012'
    text: OAuth scopes machine access
    impact: 2.5
  - year: '2014'
    text: AWS expands federated workload access
    impact: 1.5
  - year: '2015'
    text: Secrets management becomes cloud-native
    impact: 1.5
  - year: '2016'
    text: Kubernetes scales service-account identities
    impact: 2.0
  - year: '2017'
    text: SPIFFE formalizes workload identity
    impact: 1.5
  - year: '2018'
    text: Kubernetes adds projected service tokens
    impact: 1.5
  - year: '2019'
    text: EKS brings IAM to service accounts
    impact: 2.0
  - year: '2020'
    text: Cloud breaches expose credential sprawl
    impact: 1.5
  - year: '2020'
    text: Zero trust expands identity scope
    impact: 1.5
  - year: '2021'
    text: GitHub Actions adopts OIDC
    impact: 2.0
  - year: '2021'
    text: Secrets leakage becomes measurable
    impact: 1.5
  - year: '2022'
    text: Push protection blocks leaked secrets
    impact: 2.0
  - year: '2022'
    text: Machine identities outnumber humans
    impact: 1.5
  - year: '2023'
    text: AI agents multiply application identities
    impact: 1.5
  - year: '2023'
    text: Secret scanning expands across GitHub
    impact: 1.5
  - year: '2024'
    text: Push protection becomes default
    impact: 2.0
  - year: '2024'
    text: AI agents widen privilege risk
    impact: 2.0
  - year: '2025'
    text: OWASP ranks NHI risks
    impact: 2.5
  - year: '2025'
    text: Secrets continue rapid growth
    impact: 1.5
  - year: '2025'
    text: AI keys leak faster
    impact: 1.5
  - year: '2025'
    text: Workload federation replaces static keys
    impact: 2.0
  - year: '2025'
    text: NHI becomes a named market
    impact: 1.5
  - year: '2026'
    text: Cisco buys Astrix
    impact: 3.0
  - year: '2026'
    text: SailPoint buys Entro
    impact: 2.0
  - year: '2026'
    text: Cyera buys Oasis Security
    impact: 2.0
  - year: '2026'
    text: Secret leakage hits new highs
    impact: 2.0
  - year: '2026'
    text: Agent identities enter zero trust
    impact: 1.5
  - year: '2026'
    text: Identity governance absorbs NHI
    impact: 1.5
  - year: '2026'
    text: Data security merges with NHI
    impact: 1.5
  - year: '2026'
    text: NHI scale keeps accelerating
    impact: 2.0
  note:
  - We kept the events we believe pushed non human identity security forward the most
  - Ratings are our estimates, with all the sources at the end of the report
