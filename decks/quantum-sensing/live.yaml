ed007p:
  type: pp_radar
  title: 'Who is in quantum sensing,

    and who stays outside?'
  TL:
    name: Ion@Q
    src: ../../assets/logos/pp_live/quantum-sensing/s01-00.png
    text: is primarily a quantum computing company, even though acquisitions give it exposure to quantum sensing technology
  TR:
    name: IBM
    src: ../../assets/logos/pp_live/quantum-sensing/s01-02.png
    text: is a major quantum computing vendor, but it does not primarily sell quantum sensors for field measurements
  BL:
    name: Q.ANT
    src: ../../assets/logos/pp_live/quantum-sensing/s01-09.png
    text: develops quantum sensing technology, but it also builds photonic computing products outside the sensing market
  BR:
    name: Advanced Navigation
    src: ../../assets/logos/pp_live/quantum-sensing/s01-10.png
    text: develops quantum- enhanced navigation, but it also sells many classical inertial navigation products
  caption:
  - Distance to the center reflects how central each company is to quantum sensini
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
