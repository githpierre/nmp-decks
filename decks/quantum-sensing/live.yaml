ed148p:
  title: 'What pushed the quantum sensing

    market forward, year after year?'
  events:
  - year: '1949'
    text: Atomic clock proves quantum timing
    impact: 2.5
  - year: '1950'
    text: Atomic magnetometers detect tiny fields
    impact: 1.0
  - year: '1960'
    text: SQUID sensors expand magnetometry
    impact: 1.0
  - year: '1970'
    text: Quantum spin enables medical imaging
    impact: 1.0
  - year: '1980'
    text: Laser cooling improves atomic control
    impact: 1.0
  - year: '1991'
    text: Atom interferometry boosts inertial sensing
    impact: 1.5
  - year: '1995'
    text: GPS dependence raises timing demand
    impact: 1.0
  - year: '2000'
    text: Chip-scale atomic clocks accelerate
    impact: 1.0
  - year: '2004'
    text: NV diamond sensing gains momentum
    impact: 1.0
  - year: '2008'
    text: Cold-atom gravimeters reach field trials
    impact: 1.5
  - year: '2010'
    text: Quantum timing enters critical infrastructure
    impact: 1.0
  - year: '2012'
    text: Quantum sensing gains public funding
    impact: 1.0
