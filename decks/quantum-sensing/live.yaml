    impact: 1.0
  - year: '2016'
    text: NV sensors expand room-temperature use
    impact: 1.0
  - year: '2017'
    text: Rydberg atoms target RF sensing
    impact: 1.0
  - year: '2018'
    text: GNSS jamming raises navigation urgency
    impact: 1.5
  - year: '2019'
    text: Portable quantum sensors improve ruggedness
    impact: 1.0
  - year: '2020'
    text: Quantum startups move toward products
    impact: 1.0
  - year: '2021'
    text: Defense demand grows for GPS alternatives
    impact: 1.5
  - year: '2022'
    text: GPS disruptions highlight resilience gaps
    impact: 1.5
  - year: '2023'
    text: National quantum strategies expand funding
    impact: 1.0
  - year: '2024'
    text: Quantum sensing targets infrastructure
    impact: 1.0
  - year: '2025'
    text: Energy applications get clearer pathways
    impact: 1.5
  - year: '2025'
    text: Atom-based RF sensing matures
    impact: 1.0
  - year: '2026'
    text: UK funds quantum sensing adoption
    impact: 2.0
  - year: '2026'
    text: UK backs real-world quantum projects
    impact: 2.0
  - year: '2026'
    text: Space roadmap prioritizes quantum sensing
    impact: 3.0
  - year: '2026'
    text: Singapore develops GPS-free navigation
    impact: 1.5
  - year: '2026'
    text: Quantum sensing shifts to qualification
    impact: 1.5
  note:
  - We kept the events we believe pushed quantum sensing forward the most
  - Ratings are our estimates, with all the sources at the end of the report
