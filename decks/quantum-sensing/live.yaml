ed142p:
  title: 'What are the biggest threats



    to the quantum sensing market?'
  events:
  - impact: 3
    odds: 45
    text: Cold-atom sensors miss size, weight and power targets, keeping quantum inertial systems out of aircraft and smaller platforms
  - impact: 1
    odds: 45
    text: Field trials reveal calibration drift or vibration sensitivity, forcing longer qualification cycles for quantum sensors
  - impact: 2
    odds: 40
    text: Quantum hardware startups fail to raise follow-on capital, slowing product engineering between lab demos and field units
  - impact: 2
    odds: 40
    text: Classical sensors improve faster than expected, reducing the performance gap that justifies expensive quantum replacements
  - impact: 1
    odds: 40
    text: Standards for testing quantum sensor claims remain fragmented, making customers cautious about comparing vendor performance
  - impact: 2
    odds: 35
    text: Specialized laser, vacuum or photonics shortages raise costs and extend delivery times for clocks, gravimeters and magnetometers
  - impact: 2
    odds: 35
    text: Export controls on quantum technologies limit international sales and collaboration in navigation, defense and sensing
  - impact: 3
    odds: 30
    text: Defense budgets shift away from quantum sensing before field systems prove value, delaying orders for navigation sensors
  note:
  - We listed the events that could slow quantum sensing down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and you will find all the sources we used at the end of the report
