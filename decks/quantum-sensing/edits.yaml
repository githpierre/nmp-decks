  11: The quantum sensors market report with its 2026 estimate and the shares of large incumbents
  12: We used it to remove incumbents from the market size. It also gave the slowest growth rate we compared.
  13: 'Mordor Intelligence,

    market report'
  14: The quantum sensors market report with a wide scope that counts incumbents and every sensor
  15: We used it as the upper bound of our market size. It is broader than our own market definition.
  16: 'McKinsey, Quantum

    Technology Monitor'
  17: McKinsey's yearly monitor of quantum technology funding, published in 2026
  18: We used it for the 10% of quantum startup money that went to sensing. It framed the investor slides.
