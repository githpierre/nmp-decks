    interference report'
  4: IATA's safety risk assessment of GPS interference, built on data from millions of flights
  5: We used it for the rate of GPS loss per 1,000 flights. It framed the pain of airlines and armed forces.
  7: 'DARPA, Robust

    Quantum Sensors'
  8: DARPA's page on its program to make quantum sensors work on moving defense platforms
  9: We used it for the loss of accuracy outside the lab. It framed the main technical risk of the market.
  10: 'Defense Innovation

    Unit, TQS program'
  11: DIU's release on the field tests of quantum sensors it runs with the US armed forces
  12: We used it for the pace of defense trials. It showed why early tests do not yet meet final goals.
  13: 'ExecutiveGov,

    Farseer program'
  14: ExecutiveGov's report on DIU's Farseer program for quantum sensing and timing
  15: We used it for the up to $200M set aside for sensors. It framed the path from prototype to purchase.
  16: 'Troutman Pepper,

    legal analysis'
  17: The law firm's analysis of the June 2026 US order on fielding quantum sensors
  18: We used it for the 2028 deadline set by the order. It framed the regulation slides of the report.
