ed160:
  6: Magnetic sensing took about 41% of the capital raised since 2024, ahead of Quantum navigation with about 33%
  7: 29 of the 39 rounds since 2024 disclosed an amount, and the median disclosed round was $5.9M
  8: US startups closed 7 of the 39 rounds and took $570M, about 49% of all the money raised since 2024
  9: 4 rounds of $100M or more took 73% of the money, so a few big bets drive this market
  10: The $300M round of SandboxAQ is the biggest since 2024, ahead of the $290M round of Q-CTRL
  11: Seed was the most common round, with 13 of the 39 rounds, ahead of Series A with 9 and Series B with 5
  note: We drew these insights from our tracker of 39 quantum sensing equity rounds announced since January 2024, worth about $1.2B
ed162:
  6: 'BEFORE



    Before 2024, quantum sensing lived mostly on research grants and defense contracts, with a few rounds for firms like Q-CTRL.'
  7: 'AFTER



    Since 2024, 39 rounds raised $1.2B. Magnetic sensing takes the biggest share, and quantum navigation comes next, led by Q-CTRL.'
  note: We used our tracker of quantum sensing equity rounds, complete from January 2024, and company releases and the press
