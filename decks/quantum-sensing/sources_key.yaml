rows:
- name: 'QED-C,

    market forecast'
  why: The quantum sensing forecast of QED-C, based on a survey of 47 companies that sell sensors
  how: We used it as the anchor of our $625M market size. It also gave the 32% growth path we compared.
  url: https://quantumconsortium.org/publication/2026-market-forecast-quantum-sensing/
- name: 'Fortune Business

    Insights, market report'
  why: The quantum sensors market report with its estimate for 2026 and a forecast to 2034
  how: We used it as the low case of our market size. It also gave one of the growth rates we compared.
  url: https://fortunebusinessinsights.com/quantum-sensors-market-110331
- name: 'Global Market

    Insights, market report'
  why: The quantum sensors market report with its 2026 estimate and the shares of large incumbents
  how: We used it to remove incumbents from the market size. It also gave the slowest growth rate we compared.
  url: https://www.gminsights.com/industry-analysis/quantum-sensors-market
- name: 'Mordor Intelligence,

    market report'
  why: The quantum sensors market report with a wide scope that counts incumbents and every sensor
  how: We used it as the upper bound of our market size. It is broader than our own market definition.
  url: https://www.mordorintelligence.com/industry-reports/quantum-sensors-market
- name: 'McKinsey, Quantum

    Technology Monitor'
  why: McKinsey's yearly monitor of quantum technology funding, published in 2026
  how: We used it for the 10% of quantum startup money that went to sensing. It framed the investor slides.
  url: https://www.mckinsey.com/capabilities/mckinsey-technology/our-insights/mckinsey-quantum-technology-monitor-2026-a-commercial-tipping-point
- name: 'IATA, GNSS

    interference report'
  why: IATA's safety risk assessment of GPS interference, built on data from millions of flights
  how: We used it for the rate of GPS loss per 1,000 flights. It framed the pain of airlines and armed forces.
  url: https://ic.iata.org/sites/default/files/iata_sih_document_attachment/IATA%20Safety%20Risk%20Assessment%20-%20GNSS%20Interference%20V6.pdf
- name: 'DARPA, Robust

    Quantum Sensors'
  why: DARPA's page on its program to make quantum sensors work on moving defense platforms
  how: We used it for the loss of accuracy outside the lab. It framed the main technical risk of the market.
  url: https://www.darpa.mil/research/programs/roqs-robust-quantum-sensors
- name: 'Defense Innovation

    Unit, TQS program'
  why: DIU's release on the field tests of quantum sensors it runs with the US armed forces
  how: We used it for the pace of defense trials. It showed why early tests do not yet meet final goals.
  url: https://www.diu.mil/latest/dius-transition-of-quantum-sensing-tqs-field-testing-to-begin-across-five
- name: 'ExecutiveGov,

    Farseer program'
  why: ExecutiveGov's report on DIU's Farseer program for quantum sensing and timing
  how: We used it for the up to $200M set aside for sensors. It framed the path from prototype to purchase.
  url: https://www.executivegov.com/articles/dow-launched-200m-quantum-isr-initiative
- name: 'Troutman Pepper,

    legal analysis'
  why: The law firm's analysis of the June 2026 US order on fielding quantum sensors
  how: We used it for the 2028 deadline set by the order. It framed the regulation slides of the report.
  url: https://www.troutman.com/insights/navigating-the-opportunities-and-obstacles-facing-quantum-sensing-companies-a-three-part-series/
- name: 'Q-CTRL,

    DO-160 release'
  why: Q-CTRL's release on the first quantum navigator to pass DO-160 flight safety tests
  how: We used it for the first aviation safety approval. It showed how far quantum navigation has come.
  url: https://q-ctrl.com/blog/q-ctrl-to-showcase-worlds-first-airworthiness-qualified-quantum-navigation-gps-backup-at-the-farnborough-international-airshow
- name: 'The Quantum Insider,

    Q-CTRL round'
  why: The Quantum Insider's report on the $290M Series C of Q-CTRL in November 2026
  how: We used it for the largest recent round in the market. It also showed a value above $1B.
  url: https://thequantuminsider.com/2026/11/12/q-ctrl-secures-us290-million-series-c-funding-led-by-salesforce-ventures/
- name: 'Business Wire,

    Infleqtion listing'
  why: Infleqtion's release on its NYSE listing after the merger with Churchill Capital Corp X
  how: We used it for the $550M raised at the listing. It framed the investor and leader slides.
  url: https://www.businesswire.com/news/home/20260217738194/en/Infleqtion-Becomes-First-Neutral-Atom-Quantum-Company-to-Go-Public
- name: 'Paul Weiss,

    IonQ deal note'
  why: The law firm's note on IonQ's purchase of Vector Atomic, a maker of clocks and sensors
  how: We used it for the $200M+ of contracts Vector Atomic held. It framed the deal slides.
  url: https://www.paulweiss.com/insights/client-news/ionq-to-acquire-vector-atomic
- name: 'The Quantum Insider,

    Cerca Magnetics'
  why: The Quantum Insider's report on the Series A of Cerca Magnetics and its brain scanner sales
  how: We used it for the 19 systems sold in 12 countries. It framed the medical imaging slides.
  url: https://thequantuminsider.com/2026/04/21/cerca-magnetics-secures-38m-series-a-funding-scale-quantum-brain-scanner/
- name: 'The Quantum Insider,

    QuantumDiamonds'
  why: The Quantum Insider's report on the €91M raised by QuantumDiamonds with EU Chips Act aid
  how: We used it for the €76M of public aid in the round. It framed the chip inspection slides.
  url: https://thequantuminsider.com/2026/07/09/quantumdiamonds-raises-e91-million-to-set-the-global-standard-for-next-generation-chip-inspection/
- name: '36Kr,

    CIQTEK listing'
  why: 36Kr's report on the listing of CIQTEK, a Hefei maker of quantum instruments, in Shanghai
  how: We used it for CIQTEK's revenue and listing date. It framed the slides on China's leaders.
  url: https://eu.36kr.com/en/p/3937325292174466
- name: 'UK government,

    quantum missions'
  why: The UK national quantum strategy and its missions for navigation and health by 2030
  how: We used it for the goal of quantum navigation on aircraft by 2030. It framed the timeline slides.
  url: https://www.gov.uk/government/publications/national-quantum-strategy/national-quantum-strategy-missions
- name: 'Brookhaven Lab,

    export guidance'
  why: The US national lab's guidance on export controls for quantum technologies and sensors
  how: We used it for the precision levels that need an export license. It framed the export risk.
  url: https://www.bnl.gov/export/docs/technology-guidance/quantum-technologies.pdf
- name: 'Euronext,

    Thales and Exail'
  why: The release on Thales's offer for Exail, a maker of cold-atom gravimeters and navigation
  how: We used it for the €3.9B value of the deal. It showed that large groups now pay for sensing.
  url: https://live.euronext.com/en/financial-news/thales-expands-fast-growing-sea-drone-warfare-market-exail-deal
