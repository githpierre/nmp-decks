- id: ed210
  left: A REGULAR QUANTUM SENSING STARTUP
  logo: vector-atomic
  note:
  - We used Vector Atomic's Nature paper, its government contract record and IonQ's acquisition releases
  - We treated “a regular quantum sensing startup” as a fictional baseline, shown here only for contrast
  right: VECTOR ATOMIC
  rows:
  - - They build one fragile clock that only works in a lab
    - They packed an optical clock into a 35-liter rack unit
  - - They only ever test their sensors on quiet lab benches
    - They ran three of their clocks on a navy ship for 20 days
  - - They promise precision without any field numbers
    - Their clocks drifted less than 300 picoseconds a day at sea
  - - They need a room of gear to rival the best clocks
    - They matched hydrogen masers in one-tenth the volume
  - - They focus on a single sensor type and one use case
    - They built clocks, gravimeters and motion sensors
  - - They live on small research grants year after year
    - They won more than $200 million in US government contracts
  - - They stay far from the missions that need their tech
    - Their tech supports the X-37B orbital test vehicle program
  - - They sell out early, before anyone has used the tech
    - IonQ bought them for 6.3 million shares, about $400M
  section: Startup strategies
