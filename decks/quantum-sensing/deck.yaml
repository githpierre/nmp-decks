  - - They ship raw quantum sensors that falter on the move
    - Their AI software keeps quantum sensors steady in motion
  - - They pick either quantum computers or quantum sensors
    - They sell both quantum computer software and navigation
  - - They only test their sensor prototypes on the ground
    - They flew their Ironstone Opal trials at 19,000 feet
  - - They claim gains without any real-world benchmark
    - They beat a top GPS backup by up to 50 times in trials
  - - They wait many years for their first defense contract
    - DARPA gave them two contracts worth $24.4 million in 2025
  - - They try to sell to defense primes all on their own
    - Lockheed Martin joined their DARPA work as a subcontractor
  - - They prove one use case on one vehicle and stop there
    - They steered a ship within one nautical mile without GPS
  - - They stay small and raise modest rounds at low values
    - Their $290 million Series C in 2026 valued them over $1B
  section: Startup strategies
  src: 212
  title: How Q-CTRL turned quantum software into GPS-free navigation
  type: contrast
  logo_src: ../../assets/logos/q-ctrl.png
- id: ed213
  left: A REGULAR QUANTUM SENSING STARTUP
  logo: quantumdiamonds
  note:
  - We used the funding release of QuantumDiamonds and coverage by TechCrunch, Sifted and The Next Web
  - We treated “a regular quantum sensing startup” as a fictional baseline, shown here only for contrast
  right: QUANTUM DIAMONDS
  rows:
  - - They aim first at defense, a slow and closed buyer
    - They sell inspection tools to chipmakers to raise yields
  - - They build a sensor first and look for a use only later
    - Their diamond microscope sees current flow inside chips
  - - They promise speed with no customer to back it up
    - One US chip designer found a defect in under a minute
  - - They sell only in their home country for many years
    - They installed systems in Sunnyvale and in Hsinchu, Taiwan
  - - They chase lots of small buyers, one deal at a time
    - They work with 9 of the world's 10 largest chipmakers
  - - They rely only on venture money to fund their growth
    - €76M of their €91M round came from the EU Chips Act
  - - They hand production to outside contract makers
    - They are building a €152M factory for their tools in Munich
  - - They stay a small lab spinout for most of a decade
    - They grew from a 2022 TUM spinout to a €91M raise in 2026
  section: Startup strategies
  src: 213
  title: How Quantum Diamonds put quantum sensors into chip fabs
  type: contrast
  logo_src: ../../assets/logos/quantumdiamonds.png
- id: ed214
  left: A REGULAR QUANTUM SENSING STARTUP
  logo: cerca-magnetics
  note:
  - We used Cerca Magnetics' 2026 funding release and University of Nottingham and Birmingham announcements
  - We treated “a regular quantum sensing startup” as a fictional baseline, shown here only for contrast
  right: CERCA MAGNETICS
  rows:
  - - They build brain scanners that need liquid helium
    - They use quantum sensors that work at room temperature
  - - They make patients hold perfectly still in the scanner
    - Their wearable helmet lets patients move during a scan
  - - They make one adult-size scanner for every head
    - Their helmet can scan babies and young children too
  - - They take many years to land a first paying customer
    - They installed their first system 12 months after launch
  - - They try to build every single part of the system in-house
    - They build their scanners around QuSpin's quantum sensors
  - - They sell to a handful of labs in their own country
    - They have sold 19 systems to centers in 12 countries
  - - Their sales stall after the first few research buyers
    - Their sales grew over 100% a year for three years in a row
  - - They raise big rounds long before sales justify them
    - They raised £3.8M in 2026 at a £30M value to reach clinics
  section: Startup strategies
  src: 214
  title: How Cerca Magnetics sold quantum brain scanners in 12 countries
  type: contrast
  logo_src: ../../assets/logos/cerca-magnetics.png
