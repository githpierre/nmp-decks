- id: ed133
  type: x/has_held_back_market_growth
  section: Market challenges
  title: What has held back market growth so far?
  note: We grouped the market into broad phases using program documents, company filings and trial reports. The phases are subjective but track the main technical and commercial bottlenecks.
  src: 133
  t:
    6: '2007 - 2017


      Quantum sensors worked in labs but filled whole tables. Early firms such as ColdQuanta and QuSpin mostly sold parts to researchers.'
    7: '2018 - 2022


      First field units appeared, such as quantum gravimeters, but they weighed tens of kilos and cost far more than classical tools.'
    8: '2023 - 2024


      Flight and sea trials began in the UK and Australia. But vibration and interference on moving platforms still blurred readings, so buyers kept testing.'
    9: 'TODAY


      Sensors are proven in trials. Makers must still cut size and cost, pass flight safety tests and win long production contracts.'
    10: '2025 - 2026


      Defense money and listings arrived, but governments still pay most bills and few units are in full production.'
