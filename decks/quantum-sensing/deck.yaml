- id: iv_fda
  type: x/were_key_phases_market_acceleration
  section: Market challenges
  title: What does it take to win a big defense buyer?
  note: We used current DIU, DARPA and DoD program rules and company releases. Timelines and costs vary by platform, buyer and country.
  src: 147
  t:
    7: 'FIELD TRIAL


      A navy or air force tests a prototype on a real ship or plane. DIU''s first round ran about 12 months.'
    8: 'SIZE AND POWER


      Engineers shrink the unit to fit the platform. Nomad Atomics targets under 20 kg and 20 liters.'
    9: 'SAFETY TESTS


      Testers check shock, heat and interference. Q-CTRL''s navigator passed DO-160 flight tests in 2026.'
    10: 'FAST LANES


      DIU and DARPA fund prototypes. Farseer wants test units in 3 to 9 months, then use in 2 to 3 years.'
    11: 'BIG ORDERS


      The buyer orders units for real fleets. Infleqtion''s clocks won $22M from the DoD APFIT program.'
