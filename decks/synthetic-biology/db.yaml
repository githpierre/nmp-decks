ed160:
  6: Engineered medicines took about 43% of the capital raised since 2024, ahead of Design tools with about 26%
  7: 273 of the 316 rounds since 2024 disclosed an amount, and the median disclosed round was $14M
  8: US startups closed 115 of the 316 rounds and took $6.6B, about 70% of all the money raised since 2024
  9: 25 rounds of $100M or more made up about 48% of all the capital raised in the market since 2024
  10: The $465M Strategic round of Sail Biomedicines is the biggest since 2024, ahead of the $435M round of NewLimit
  11: Seed was the most common round, with 106 of the 316 rounds, ahead of Series A with 85 and Series B with 31
  note: We drew these insights from our tracker of 316 synthetic biology equity rounds announced since January 2024, worth about $9.5B
ed162:
  6: 'BEFORE



    Before 2024, money chased big foundries and factories, and Amyris and Zymergen showed the cost of scaling too early.'
  7: 'AFTER



    Since 2024, 316 rounds raised $9.5B. Engineered medicines takes the biggest share, and pharma pays for AI design.'
  note: We used our tracker of synthetic biology equity rounds, complete from January 2024, and company releases and the press
