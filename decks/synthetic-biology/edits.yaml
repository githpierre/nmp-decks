    3: https://www.sec.gov/Archives/edgar/data/1645842/000114036121013962/nt10018776x14_424b4.htm
    7: https://hfpappexternal.fda.gov/scripts/fdcc/index.cfm?id=863&set=GRASNotices
    10: https://food.ec.europa.eu/plants/new-genomic-techniques/legislation-plants_en
    13: https://ansabio.com/news-events/pr/series-c-press-release
    16: https://www.synbiobeta.com/read/4q-2021-synthetic-biology-venture-investment-report
  3: 'SEC, Zymergen

    IPO prospectus'
  4: Zymergen's 2021 prospectus, with its first product Hyaline and the long customer qualification ahead
  5: We used it for what newcomers miss. It also explained why Zymergen's sales never came.
  7: 'FDA, GRAS notice

    for Perfect Day'
  8: The FDA record of its no-questions letter for Perfect Day's whey protein made by fermentation in 2020
  9: We used it for the first US approvals of fermented food proteins. It also framed how food rules evolved.
  10: 'European Commission,

    new genomic techniques'
  11: The European Commission page on the new rules for gene-edited plants adopted in 2026
  12: We used it for how regulation is evolving. It also gave the date the rules apply, July 2028.
  13: 'Ansa Biotechnologies,

    Series C'
  14: Ansa's release on its $71.5M round to make more long and complex synthetic DNA
  15: We used it for the latest deals and the falling cost of long DNA. It also backed the Ansa comparison slide.
  16: 'SynBioBeta, 2021

    investment report'
  17: SynBioBeta's report on synthetic biology venture investment in 2021, the record year of the market
  18: We used it for when the market became hot. It also gave the size of the 2021 funding boom.
