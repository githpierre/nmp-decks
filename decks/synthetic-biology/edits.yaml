  links:
    3: https://www.sec.gov/Archives/edgar/data/1830214/000162828026071022/ex991earningspr.htm
    7: https://www.profluent.bio/media/profluent-announces-strategic-partnership-with-eli-lilly-to-develop-ai-designed-recombinases-for-genetic-medicine
    10: https://www.cradle.bio/blog/cradle-2025
    13: https://www.pivotbio.com/press-releases/pivot-bio-releases-2025-field-performance-data-demonstrating-consistent-yield-gains-and-synthetic-nitrogen-displacement-while-lowering-fertilizer-costs
    16: https://formo.bio/formo-receives-first-fda-no-questions-letter-for-enhanced-casein-made-through-precision-fermentation/
  3: 'Ginkgo Bioworks,

    third quarter 2026'
  4: Ginkgo's earnings release for the third quarter of 2026, with its revenue and its loss from operations
  5: We used it for the loss per dollar of revenue. It also showed how hard it is to make a foundry profitable.
  7: 'Profluent and Lilly,

    recombinase deal'
  8: Profluent's release on its partnership with Eli Lilly to design gene-editing enzymes with AI
  9: We used it for the deals pharma signs with AI design startups, worth up to $2.3B in milestones for Profluent.
  10: 'Cradle, 2025

    review'
  11: Cradle's review of 2025, with its projects for big pharma and its move from pilots to multiyear deals
  12: We used it for how AI protein design is sold to pharma. It also backed the Cradle comparison slide.
  13: 'Pivot Bio, 2025

    field data'
  14: Pivot Bio's release on its 2025 field trials, with the nitrogen its microbes replaced on corn farms
  15: We used it for the farm value of engineered microbes. It also backed the Pivot Bio comparison slide.
  16: 'Formo, FDA

    letter'
  17: Formo's release on the first FDA no-questions letter for casein made by precision fermentation
  18: We used it for the regulatory signals of the market. It also showed that animal-free cheese can reach US shelves.
