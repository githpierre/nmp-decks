  links:
    3: https://spiber.inc/en/news/SPIBER-BIOFOUNDRY-Spiber-BioJapan2026-BrewedProtein
    7: https://www.arzeda.com/news/arzeda-and-mane-join-forces-to-bring-a-better-stevia-at-scale
    10: https://www.nature.com/articles/s41586-026-10328-7
    13: https://pubmed.ncbi.nlm.nih.gov/42655176
    16: https://www.sciencedirect.com/science/article/pii/S1871678426001111
  3: 'Spiber,

    biofoundry launch'
  4: Spiber's release on opening its gene design and fermentation tanks of over 100,000 liters to partners
  5: We used it for the latest tech developments. It also showed how shared capacity may lower the cost of scaling.
  7: 'Arzeda and MANE,

    ViaLeaf Reb M'
  8: Arzeda's release on the stevia sweetener it makes without cells, with over 500 tons a year of capacity
  9: We used it for the products closest to market. It also showed how designed enzymes can replace plant extraction.
  10: 'Nature, AI protein

    design review'
  11: The 2026 Nature review on the shift from random selection to computational design of proteins
  12: We used it for the design layer of the tech chapter. It also framed what AI can and cannot do yet.
  13: 'PubMed, fermentation

    scale-up review'
  14: The 2026 review of the bottlenecks that stop lab results from reaching industrial fermentation
  15: We used it for the bottlenecks of the tech chapter. It also backed our timeline for solving them.
  16: 'ScienceDirect, industrial

    biotech study'
  17: The 2026 study of why industrial biotech startups fail to turn science into a business
  18: We used it for the reasons startups fail. It also framed what survivors do differently.
