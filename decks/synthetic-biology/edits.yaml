    3: https://www.gminsights.com/industry-analysis/synthetic-biology-market
    7: https://www.fortunebusinessinsights.com/synthetic-biology-market-107168
    10: https://www.biotech.senate.gov/final-report/chapters/chapter-2/section-3
    13: https://investors.vrtx.com/news-releases/news-release-details/vertex-reports-third-quarter-2026-financial-results
    16: https://www.sec.gov/Archives/edgar/data/1581280/000158128026000061/twst-20260930.htm
  3: 'Global Market Insights,

    market report'
  4: The November 2026 market report that splits synthetic biology revenue into core, enabling and enabled products
  5: We used it for the $20B base of 2025, the split by type of product and the high case of our market size.
  7: 'Fortune Business Insights,

    market report'
  8: The 2026 market report with a forecast to 2034 and a split of revenue by region of the world
  9: We used it for one of the four market size estimates and the share of each region in the spending.
  10: 'NSCEB, final

    report'
  11: The April 2025 report of the US National Security Commission on Emerging Biotechnology to Congress
  12: We used it for scale-up as the main roadblock of the market. It also framed the race between the US and China.
  13: 'Vertex, third quarter

    2026 results'
  14: Vertex's results for the third quarter of 2026, with the sales of Casgevy, the first CRISPR medicine
  15: We used it for the sales signal of Casgevy. It also showed that a gene-edited therapy can build real revenue.
  16: 'Twist Bioscience,

    annual report'
  17: Twist's annual report for fiscal 2026, with its DNA writing platform on silicon chips and its sales
  18: We used it for how synthetic DNA is made today. It also gave the revenue from AI drug discovery customers.
