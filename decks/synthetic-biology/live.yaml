ed007p:
  type: pp_radar
  title: 'What is actually included

    in synthetic biology?'
  TL:
    name: Thermo Fisher Scientific
    src: ../../assets/logos/thermo-fisher-scientific.png
    text: sells lab tools, reagents and contract manufacturing to everyone, but it does not engineer organisms as its own product
  TR:
    name: Danone
    src: ../../assets/logos/pp_live/synthetic-biology/s01-02.png
    text: has fermented yogurt with selected bacteria for a century, which is putting biology to work rather than engineering it
  BL:
    name: Beyond Meat
    src: ../../assets/logos/beyond-meat.png
    text: makes plant-based burgers from pea protein, with no engineered microbe or yeast behind its main ingredients
  BR:
    name: Moderna
    src: ../../assets/logos/pp_live/synthetic-biology/s01-11.png
    text: designs synthetic mRNA code for human cells, but it sells vaccines like any pharma company, which puts it on the edge
  caption:
  - Distance to the center reflects how central engineered DNA and organisms are to the product, rather than biology used as is
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
