ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'Searches for gene editing doubled

    from late 2021 to mid-2025'
  date: From late 2021 to mid-2025.
  expl: Interest jumped when the first CRISPR medicine was approved in late 2023, then kept rising as AI began to design new gene editors.
  term: gene editing
  note:
  - We tracked how often people worldwide googled this term from late 2021 to July 2025
  - Google changed how it counts small terms in mid-2025, so the curve stops in July 2025
  csv: assets/trends/synthetic-biology/gene-editing.csv
  cut: '2025-07-27'
  caption_period: November 2021 to July 2025
ed052p:
  type: pp_cagr
  title: 'How much bigger can

    synthetic biology get?'
  lead: ''
  condition: To get that big, the market must turn AI designs into products that scale, as pharma, food, and chemical firms buy more of what engineered cells make. It must also cut production costs, build enough factory capacity, keep public trust in engineered food, and avoid a biosecurity incident that brings strict rules.
  note:
  - We compared forecasts from Fortune Business Insights, Grand View, Mordor and Global Market Insights
  - We took their median as a broad proxy for our definition, with all the sources at the end of the report
  size: 23
  cagr: 19
  y0: 2026
