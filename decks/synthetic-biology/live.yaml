ed142p:
  title: 'What could go wrong

    for synthetic biology?'
  events:
  - odds: 45
    impact: 3
    text: Biomanufacturing stays too costly to compete with petrochemicals, so chemicals and materials startups cannot scale
  - odds: 40
    impact: 3
    text: More startups follow Ginkgo Bioworks and Amyris into deep cost cuts or bankruptcy as cash runs out
  - odds: 40
    impact: 2
    text: NIH and NSF budget cuts shrink university research that feeds new synthetic biology startups
  - odds: 35
    impact: 2
    text: The BIOSECURE Act and US-China tensions cut startups off from cheap WuXi contract manufacturing
  - odds: 30
    impact: 2
    text: Big buyers like Unilever and L'Oreal drop bio-based ingredient pledges when prices stay above petrochemical ones
  - odds: 30
    impact: 1
    text: AI protein design tools from Google DeepMind and others become free, erasing startup moats in enzyme design
  - odds: 25
    impact: 2
    text: The EPA and FDA slow approvals for engineered microbes in farming, delaying products like Pivot Bio
  - odds: 10
    impact: 3
    text: A lab leak or engineered pathogen scare leads Congress to tighten DNA synthesis and gene editing rules
  note:
  - We listed the events that could slow synthetic biology down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
