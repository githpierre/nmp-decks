- id: ed092
  type: x/were_latest_tech_infra_developments
  section: Tech and infra
  title: What were the latest tech and infra developments?
  page: 1/2
  note: We track documented advances in biological design, engineered crop products and commercial manufacturing. A milestone ceiling is not revenue.
  src: 92
  t:
    13: '2023'
    14: Casgevy became the first FDA-approved treatment using genome editing technology, demonstrating a route to regulated use.
    15: '2024'
    16: Profluent released OpenCRISPR-1, an AI-designed gene editor that made new protein design tools openly available.
    17: '2025'
    18: Latent Labs launched Latent-X, allowing researchers to generate candidate protein binders directly in a browser.
    19: '2025'
    20: Pivot Bio unveiled PROVEN G3, combining its gene-edited nitrogen-fixing technology with a new microbial blend for corn.
    21: '2026'
    22: Arzeda and MANE partnered to commercialize ViaLeaf Reb M, a sweetener made using a cell-free production process.
    23: '2026'
    24: Profluent partnered with Lilly to design enzymes that edit DNA, with up to $2.3B in contingent milestone payments.
