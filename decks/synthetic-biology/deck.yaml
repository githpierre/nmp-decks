- id: ed210
  left: A REGULAR DNA STARTUP
  logo: ansa-biotechnologies
  note:
  - We used Ansa’s product specifications, ordering partnership release and Series C financing announcement.
  - We use a fictional DNA supplier as the comparison baseline, not a claim about every competitor.
  right: ANSA
  rows:
  - - They focus on DNA strands that are easy to manufacture
    - They use an enzyme-based approach for difficult DNA
  - - They leave the assembly of long sequences to customers
    - They sell assembled DNA up to 50,000 genetic letters
  - - They charge more per letter for longer DNA sequences
    - They offer a declining cost per letter as length rises
  - - They leave final sequence checks to the research team
    - They verify the sequence of each long DNA construct
  - - They give scientists a rough estimate of shipping dates
    - They give customers a guaranteed shipping date instead
  - - They sell through their own ordering system alone
    - They expanded ordering through the IDT online platform
  - - They pursue more funding before growing production
    - They reported four times their prior production capacity
  - - They build their business around a narrow user base
    - Over 400 institutions in 33 countries ordered their DNA
  section: Startup strategies
  src: 210
  title: How Ansa Biotechnologies made long DNA easier to buy
  type: contrast
  logo_src: ../../assets/logos/ansa.png
- id: ed211
  left: A REGULAR SYNBIO STARTUP
  logo: asimov
  note:
  - We used Asimov’s cell engineering product materials and customer announcements for its development work.
  - We use a fictional startup as a comparison and do not assume that licensing implies product sales.
  right: ASIMOV
  rows:
  - - They offer genetic design as an isolated software tool
    - They combine design software with cells and DNA parts
  - - They rely on enzymes bought from outside suppliers
    - They engineered their own enzyme using butterfly DNA
  - - They optimize output without checking genetic stability
    - Their enzyme kept gene expression stable over 60 generations
  - - They keep their core technology inside a service model
    - They license their DNA integration enzyme as a separate tool
  - - They design DNA without a shared sequence workspace
    - Kernel keeps DNA sequences linked to their annotations
  - - They stop after providing the initial genetic designs
    - They can build and ship a custom research cell bank
  - - They validate a platform mainly with internal examples
    - They delivered an antibody cell line for Sidewinder
  - - They wait for customers to build their own workflows
    - LG Chem licensed their complete cell development system
  section: Startup strategies
  src: 211
  title: How Asimov turned genetic design into a cell line business
  type: contrast
  logo_src: ../../assets/logos/asimov.png
- id: ed212
  left: A REGULAR SYNBIO STARTUP
  logo: cradle
  note:
  - We used Cradle’s product pages, customer announcements and a company-reported peptide case study.
  - We use a fictional startup as a baseline, and the peptide result is not proof of an approved medicine.
  right: CRADLE
  rows:
  - - They optimize a single protein property at a time
    - They optimize several target protein traits in parallel
  - - They validate model improvements only on computer data
    - They test software improvements in their Amsterdam lab
  - - They pool customers’ sensitive experimental information
    - They keep each customer’s data and models isolated
  - - They sell research projects without repeat commitments
    - They turned several early pilots into multiyear deals
  - - They ask researchers to adapt to a separate workflow
    - Bayer is integrating the platform into existing R&D work
  - - They show success using only simple benchmark problems
    - They hit all peptide constraints in at least half of designs
  - - They focus on small teams with limited research budgets
    - They reported projects with six of the top 25 pharma firms
  - - They limit deployments to one lead discovery program
    - Hansa plans to use the platform across its discovery pipeline
  section: Startup strategies
  src: 212
  title: How Cradle put AI protein engineering inside pharma labs
  type: contrast
  logo_src: ../../assets/logos/cradle--symbol.png
- id: ed213
  left: A REGULAR SYNBIO STARTUP
  logo: pivot-bio
  note:
  - We used Pivot Bio’s field data, product releases and pricing program. Field figures are company-reported.
  - We use a fictional startup as the baseline. Field trial results do not guarantee savings on every farm.
  right: PIVOT BIO
  rows:
  - - They focus on a lab discovery without a clear end use
    - They engineer microbes that supply nitrogen to crops
  - - They depend on replacing the entire fertilizer program
    - They design their product to work with existing fertilizer
  - - They require farmers to add a new step late in the season
    - Their nitrogen product is applied at planting instead
  - - They prove their product only under ideal lab conditions
    - They tested performance in real fields alongside growers
  - - They promise fertilizer savings without measuring them
    - They reported 33 pounds of nitrogen saved per acre in trials
  - - They rely on one pilot farm to demonstrate adoption
    - Farmers used their products on millions of acres in 2025
  - - They leave customers exposed to volatile input prices
    - They offer farmers and retailers a multiyear price lock
  - - They build around a single crop and stop expanding
    - They are building new products for corn, cotton and sorghum
  section: Startup strategies
  src: 213
  title: How Pivot Bio sold engineered microbes to farmers
  type: contrast
  logo_src: ../../assets/logos/pivot-bio.png
- id: ed214
  left: A REGULAR SYNBIO STARTUP
  logo: tropic
  note:
  - We used Tropic’s crop launches, regulatory approvals, financing and plant propagation acquisition releases.
  - We use a fictional startup as the baseline. A commercial product launch does not establish profitability.
  right: TROPIC
  rows:
  - - They start with a novel crop that has no established demand
    - They focus on bananas, an existing global food staple
  - - They use genetic design without targeting a buyer problem
    - They switch off the gene for the fruit-browning enzyme
  - - They focus on one trait and neglect transport costs
    - They also developed a banana with a longer green life
  - - They keep new varieties in research without a product
    - They launched their first commercial banana in 2025
  - - They assume regulatory clearance in one market is enough
    - They secured approval in both Japan and Brazil in 2026
  - - They rely on other companies to multiply their plants
    - They acquired Rahan Meristem to expand plant production
  - - They build a sales network without grower relationships
    - They gained direct routes to growers through Rahan
  - - They raise money before establishing commercial demand
    - They raised $105M after demand exceeded banana supply
  section: Startup strategies
  src: 214
  title: How Tropic made gene-edited bananas into commercial products
  type: contrast
  logo_src: ../../assets/logos/tropic-biosciences.png
