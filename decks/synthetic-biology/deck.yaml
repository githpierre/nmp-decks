- id: ed023
  type: x/learning_truths_have_flipped
  section: Market definition
  title: Which synthetic biology truths have flipped?
  note: These are market shifts we see in recent deals, failures and company releases. They are not formal industry rules, but they come back across the evidence.
  src: 23
  t:
    6: Synthetic biology used to promise to replace oil chemicals
    8: Now most money goes to medicines, food proteins and farming microbes
    10: Biofoundries used to sell only their design work to clients
    12: Now Ginkgo also sells its robots and data as separate products
    14: Protein design was once slow, random trial and error
    16: Now AI models propose working designs before the lab tests them
    18: Startups used to build their own big factories from day one
    20: Now most startups rent tanks from contract makers before building
    22: Engineered cell medicines used to stop at the lab bench
    24: Now Casgevy sells gene-edited cells and more programs near approval
    26: The field used to be led by fast-growing listed platforms
    28: Now Ginkgo trades far below its 2021 peak and value moves to startups
- id: ed024
  type: dated
  section: Market definition
  title: What has changed (very) recently?
  page: 1/2
  items:
  - d: SINCE 2023
    t: Amyris filed for Chapter 11 in August 2023, the biggest failure of the field, after years of costly scale-up for its squalene, sweetener and beauty brands.
  - d: SINCE 2023
    t: The FDA approved Casgevy in December 2023, the first treatment using CRISPR gene editing, showing that programmed cells can reach patients as a sold product.
  - d: SINCE 2024
    t: Profluent released OpenCRISPR-1 in April 2024, a gene editor designed by AI and shared for free, proving that AI can write working gene-editing proteins.
  - d: SINCE 2024
    t: The 2024 Nobel Prize in Chemistry went to David Baker for designing new proteins by computer, shared with the AlphaFold team, putting protein design in the spotlight.
  - d: SINCE 2025
    t: The US National Security Commission on Emerging Biotechnology asked in April 2025 for $15B over five years to keep the US ahead of China in biotech.
  - d: SINCE 2025
    t: Colossal raised $200M in January 2025 at a valuation of about $10B, the highest for a synthetic biology startup, to engineer traits of extinct animals into living ones.
  note:
  - We kept the milestones that most changed the products, the money and the big players of the market
  - There is no official timeline, and another analyst could reasonably pick a few different milestones here
  src: 24
- id: ed025
  type: dated
  section: Market definition
  title: What has changed (very) recently?
  page: 2/2
  items:
  - d: SINCE 2025
    t: Benson Hill, a seed company built on gene editing and plant data, filed for Chapter 11 in March 2025, showing how hard engineered crops are to turn into profit.
  - d: SINCE 2025
    t: Latent Labs launched Latent-X in July 2025, letting any researcher design protein binders in a browser, a sign that design tools are becoming products.
  - d: SINCE 2026
    t: Profluent signed a deal with Lilly in April 2026 worth up to $2.3B in milestones, to design gene-editing enzymes with AI for genetic medicines.
  - d: SINCE 2026
    t: Tropic raised $105M in March 2026 after demand for its gene-edited non-browning bananas exceeded supply, then won approvals in Japan and Brazil.
  - d: SINCE 2026
    t: Spiber opened its biofoundry in October 2026, offering partners everything from gene design to fermentation in tanks of over 100,000 liters, as a contract service.
  - d: SINCE 2026
    t: Formo became the first company to get an FDA no-questions letter for casein made by precision fermentation in October 2026, opening US sales of animal-free cheese.
  note:
  - We kept the milestones that most changed the products, the money and the big players of the market
  - There is no official timeline, and another analyst could reasonably pick a few different milestones here
  src: 25
