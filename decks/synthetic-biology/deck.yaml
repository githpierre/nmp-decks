- id: ed017
  type: maturity
  section: Market definition
  title: How mature is synthetic biology as a market?
  score: 50
  text: The market is real because engineered enzymes, food proteins, farm microbes and a gene-edited medicine sell today, and big pharma pays for design platforms. The score stays in the middle because scale-up is costly, many flagship companies failed or shrank, and most products are still small next to the goods they replace.
  note:
  - We rate market maturity with an internal score of products on sale, scale-up proof, big buyers and funding.
  - We set 50/100 because real products sell, but scale-up remains hard and several flagships have failed.
  src: 17
