  section: Market definition
  title: What are some common myths about synthetic biology?
  page: 1/2
  note: We focused on myths that come back often in investor, founder and press debates. The counters describe what products, approvals and failures have shown so far.
  src: 15
  t:
    0: Engineered cells will never become real medicines
    7: Engineered yeast has made a malaria drug ingredient for Sanofi since 2013, and Pivot Bio sells nitrogen microbes used on millions of acres
    9: Synthetic biology is only a lab science project
    10: Impossible Foods sells burgers with heme made by engineered yeast, and Formo got an FDA no-questions letter for its fermented casein in 2026
    12: Engineered foods are not allowed on the market
    13: Novonesis sells billions of euros of enzymes a year for detergents, baking and animal feed, most of them made by engineered microbes
    15: Only medicines can pay for engineered biology
    16: Casgevy, a gene-edited cell therapy for sickle cell disease, won US approval in December 2023 and sold $99M in the third quarter of 2026
    20: 🤥
    21: 🤥
    22: 🤥
    23: 🤥
- id: ed016
  type: x/some_common_myths_about
  section: Market definition
  title: What are some common myths about synthetic biology?
  page: 2/2
  note: We focused on myths that come back often in investor, founder and press debates. The counters describe what products, approvals and failures have shown so far.
  src: 16
