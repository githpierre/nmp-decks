ed052p:
  type: pp_cagr
  title: 'Is the healthcare AI agent

    market still growing fast?'
  lead: ''
  condition: Yes, but agents must move from writing notes to doing work on their own, like placing orders, sending claims, and booking visits, with proof
    that they bring money back. It must also keep prices up while Epic and Microsoft bundle their own agents, and pass the new state rules on AI decisions.
  note:
  - We compared forecasts from MarketsandMarkets, Roots Analysis, Astute Analytica and Grand View
  - We allowed for price cuts from Epic and Microsoft, and all our sources are at the end of the report
  size: null
  cagr: 32
  y0: 2026
