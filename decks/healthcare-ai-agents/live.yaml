ed142p:
  title: 'What could go wrong for

    healthcare AI agents?'
  events:
  - odds: 25
    impact: 3
    text: Epic ships its own AI agents to most big hospitals and blocks outside vendors from its platform
  - odds: 15
    impact: 3
    text: Microsoft bundles Dragon Copilot agents for free, squeezing Abridge and other healthcare AI agent startups
  - odds: 15
    impact: 2
    text: Hospital unions win state limits on AI agents replacing nurses and coders in California and New York
  - odds: 12
    impact: 2
    text: More states ban AI-only claim denials and prior authorization, limiting healthcare AI agents for payers
  - odds: 12
    impact: 2
    text: Hospitals see only minutes saved per day and cancel AI agent contracts that show no clear return
  - odds: 10
    impact: 2
    text: OpenAI or Google start selling complete healthcare agents directly to hospitals and payers
  - odds: 8
    impact: 3
    text: An AI scribe or agent error seriously harms a patient and triggers lawsuits and FDA scrutiny
  - odds: 5
    impact: 2
    text: A healthcare AI agent leaks millions of patient records, and hospitals freeze new agent deployments
  note:
  - We listed the events that could slow healthcare ai agents down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
