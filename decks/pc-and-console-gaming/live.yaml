ed148p:
  title: 'What pushed the PC and console gaming

    market forward, year after year?'
  events:
  - year: '1972'
    text: Home consoles create game market
    impact: 2.5
  - year: '1983'
    text: Console crash forces quality reset
    impact: 1.0
  - year: '1985'
    text: NES revives console demand
    impact: 3.0
  - year: '1993'
    text: Doom popularizes PC shooters
    impact: 2.0
  - year: '1994'
    text: PlayStation expands adult gaming
    impact: 2.0
  - year: '1998'
    text: Online PC multiplayer scales
    impact: 1.5
  - year: '2000'
    text: PlayStation 2 grows installed base
    impact: 2.0
  - year: '2001'
    text: Xbox adds new platform competition
    impact: 1.5
  - year: '2003'
    text: Steam normalizes digital PC delivery
    impact: 2.5
  - year: '2005'
    text: Xbox Live mainstreams online console
    impact: 2.0
  - year: '2006'
    text: Digital stores enable indie publishing
    impact: 1.5
  - year: '2007'
    text: Achievements deepen player engagement
    impact: 1.0
  - year: '2009'
    text: Free-to-play reshapes PC monetization
    impact: 1.5
  - year: '2011'
    text: Minecraft validates sandbox demand
    impact: 2.0
  - year: '2012'
    text: Kickstarter funds independent games
    impact: 1.0
  - year: '2013'
    text: PS4 simplifies developer architecture
    impact: 1.5
  - year: '2014'
    text: Early access funds development
    impact: 1.5
  - year: '2015'
    text: Esports boosts PC game visibility
    impact: 1.5
  - year: '2017'
    text: Battle royale expands live service
    impact: 2.0
  - year: '2017'
    text: Switch merges home portable play
    impact: 2.0
  - year: '2018'
    text: Cross-play breaks platform barriers
    impact: 1.5
  - year: '2019'
    text: Subscriptions shift discovery economics
    impact: 1.5
  - year: '2020'
    text: Covid drives record playtime
    impact: 2.0
  - year: '2020'
    text: New consoles reset technical baseline
    impact: 2.0
  - year: '2021'
    text: Cloud saves expand cross-device play
    impact: 1.0
  - year: '2022'
    text: Steam Deck expands PC use cases
    impact: 1.5
  - year: '2023'
    text: Microsoft buys Activision Blizzard
    impact: 2.0
  - year: '2024'
    text: Publishers embrace multiplatform releases
    impact: 1.5
  - year: '2026'
    text: Switch 2 scales software demand
    impact: 2.0
  - year: '2026'
    text: Layoffs force leaner game production
    impact: 0.5
  note:
  - We kept the events we believe pushed pc and console gaming forward the most
  - Ratings are our estimates, with all the sources at the end of the report
