ed007p:
  type: pp_radar
  title: 'What counts as femtech,

    and what falls outside?'
  TL:
    name: Oura
    src: ../../assets/logos/pp_live/femtech/s01-00.png
    text: now has more women than men among its users and tracks cycles, but it remains a general health wearable
  TR:
    name: Thinx
    src: ../../assets/logos/pp_live/femtech/s01-02.png
    text: makes period underwear designed specifically for women, but beyond its absorbent fabric there is little technology in the product
  BL:
    name: Progyny
    src: ../../assets/logos/pp_live/femtech/s01-10.png
    text: manages fertility benefits for 7 5 employers, which makes it closer to health insurance infrastructure than to i - a women's health product
  BR:
    name: Hims & Hers
    src: ../../assets/logos/pp_live/femtech/s01-11.png
    text: offers telehealth services for women, but it is a mass-market brand that started out selling hair loss 5 treatments to men iS
  caption:
  - Distance to the center reflects how much a product is built around women's health needs, rather than simply marketed to women
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
  - ../../assets/logos/pp_live/femtech/s01-01.png
