ed142p:
  title: 'What could slow

    femtech down?'
  events:
  - odds: 45
    impact: 3
    text: Apple, Samsung and Oura bundle free cycle and menopause tracking, so paid femtech apps lose subscribers
  - odds: 40
    impact: 2
    text: Venture funding for women's health stays below 2% of digital health dollars, starving Series B rounds
  - odds: 35
    impact: 2
    text: Medicaid cuts from the 2025 budget law shrink reimbursement for maternal health and prenatal care startups
  - odds: 25
    impact: 3
    text: Employers cut fertility and menopause benefits to save costs, hurting Maven, Carrot and Progyny growth
  - odds: 20
    impact: 3
    text: A state attorney general subpoenas period tracker data in an abortion case, and users delete apps
  - odds: 20
    impact: 2
    text: The FTC fines another fertility app under the Health Breach Notification Rule for sharing data with Meta
  - odds: 12
    impact: 2
    text: The FDA tightens rules on app-based contraception claims after Natural Cycles style pregnancy complaints resurface
  - odds: 8
    impact: 1
    text: A widely used at-home hormone test gives false results and triggers an FDA recall and lawsuits
  note:
  - We listed the events that could slow femtech down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
