ed160:
  6: Pregnancy care took about 25% of the capital raised since 2024, ahead of Fertility care with about 22%
  7: 168 of the 184 rounds since 2024 disclosed an amount, and the median disclosed round was $5.8M
  8: US startups closed 94 of the 184 rounds and took $1.7B, about 66% of all the money raised since 2024
  9: 5 rounds of $100M or more made up about 26% of all the capital raised in the market since 2024
  10: The $200M Series C round of Flo Health is the biggest since 2024, ahead of the $130M round of BillionToOne
  11: Seed was the most common round, with 67 of the 184 rounds, ahead of Series A with 50 and Series B with 19
  note: We drew these insights from our tracker of 184 femtech equity rounds announced since January 2024, worth about $2.5B
ed162:
  6: 'BEFORE



    Before 2024, money chased period apps and fertility clinics, and Kindbody showed the cost of growing clinics too fast.'
  7: 'AFTER



    Since 2024, 184 rounds raised $2.5B. Pregnancy care takes the biggest share, and midlife care has gained share since 2025.'
  note: We used our tracker of femtech equity rounds, complete from January 2024, and company releases and the press
