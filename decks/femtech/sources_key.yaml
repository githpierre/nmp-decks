# 20 key sources (draft_sources_key.py, rewritten 26 Nov 2026)
rows:
- name: "Mordor Intelligence,\nmarket report"
  why: The femtech market report with the lowest published size, close to our own scope of female-specific products
  how: We used it with Fortune for our $10B market size. It also gave one of the four growth rates we compared.
  url: https://www.mordorintelligence.com/industry-reports/femtech-market
- name: "Fortune Business\nInsights, market report"
  why: The 2026 femtech market report with a forecast to 2034 and a split of revenue by type of product
  how: We used it with Mordor for our $10B market size. It also gave the highest of the growth rates we compared.
  url: https://www.fortunebusinessinsights.com/femtech-market-107413
- name: "Progyny, third quarter\n2026 results"
  why: Progyny's results for the third quarter of 2026, with its revenue and its outlook for the full year
  how: We used it for the size of employer fertility benefits. It also showed employers keep paying at scale.
  url: https://progyny.gcs-web.com/news-releases/news-release-details/progyny-inc-announces-third-quarter-2026-results
- name: "KFF, employer health\nbenefits survey"
  why: The 2026 survey of US employers by KFF, with the share of large firms that cover IVF for their staff
  how: We used it for the 27% of firms with 200 or more workers that cover IVF. It framed the coverage gap.
  url: https://www.kff.org/health-costs/2026-employer-health-benefits-survey/
- name: "Mercer, employer\nsurvey 2026"
  why: Mercer's 2026 survey of US employers, with the benefits that large employers added or kept this year
  how: We used it for the 54% of employers with 500 or more staff that cover IVF. It showed benefits still grow.
  url: https://www.mercer.com/en-us/insights/us-health-news/2026-survey-employers-doubled-down-on-health-benefit-cost-management/
- name: "Milken Institute,\ncoverage roadmap"
  why: The Milken Institute's roadmap on how insurers cover and pay for new women's health products
  how: We used it for payment as the main roadblock of the market. It also explained why startups wait for coverage.
  url: https://milkeninstitute.org/index.php/content-hub/research-and-reports/research-and-data-tools/coverage-and-reimbursement-roadmap-womens-health-innovation
- name: "World Economic Forum,\nwomen's health gap"
  why: The World Economic Forum's blueprint on the gap in research and care between women and men
  how: We used it for the lack of research on women's bodies. It also framed the pain points of the market.
  url: https://www.weforum.org/publications/blueprint-to-close-the-women-s-health-gap-how-to-improve-lives-and-economies-for-all
- name: "Midi Health,\nSeries D release"
  why: Midi Health's release on its Series D round, its valuation and the insurers that cover its visits
  how: We used it for Midi's $1B valuation. It also gave the 45 million women its insurance coverage reaches.
  url: https://www.joinmidi.com/press-release/series-d-announcement
- name: "Maven Clinic,\nin-network care"
  why: Maven Clinic's release on bringing its women's and family care into the networks of health plans
  how: We used it for the move of virtual care into insurance. It also showed how far Maven's reach has grown.
  url: https://www.prnewswire.com/news-releases/maven-clinic-brings-womens-and-family-health-care-in-network-302935960.html
- name: "Pomelo Care,\nSeries C release"
  why: Pomelo Care's release on its $92M Series C at a $1.7B valuation, in January 2026
  how: We used it for Pomelo's valuation and growth. It also gave its share of the births in the US.
  url: https://www.pomelocare.com/news/press-release-pomelo-care-raises-92-million-series-c-reaches-1-7-billion-valuation-to-expand-its-proven-model-beyond-maternity-set-a-new-national-standard-for-womens-and-childrens-healthcare
- name: "Flo Health,\nfunding release"
  why: Flo Health's release on its round of more than $200M led by General Atlantic, in July 2024
  how: We used it for the first cycle app valued above $1B. It also set the benchmark for consumer apps.
  url: https://flo.health/newsroom/flo-health-raises-over-200m
- name: "Flo Health and\nGoogle Health"
  why: The October 2026 release on the partnership of Flo and Google Health and Google's stake in Flo
  how: We used it for the backing of Flo by Google Health. It also showed big tech moving into cycle data.
  url: https://www.prnewswire.com/news-releases/flo-health-and-google-health-join-forces-to-put-womens-health-at-the-center-of-wearable-tracking-and-personalized-coaching-302905153.html
- name: "FTC,\nFlo Health case"
  why: The US Federal Trade Commission's case against Flo over the sharing of users' health data
  how: We used it for privacy as a core risk of the market. It also showed what regulators expect from apps.
  url: https://www.ftc.gov/legal-library/browse/cases-proceedings/192-3133-flo-health-inc
- name: "Teal Health,\nnational launch"
  why: Teal Health's release on bringing its at-home cervical screening device to all 50 US states
  how: We used it for the first FDA-authorized home cervical screening. It also dated the national rollout.
  url: https://www.getteal.com/news/teal-health-expands-nationwide-bringing-the-only-fda-authorized-device-for-at-home-cervical-cancer-screening-to-all-50-states
- name: "Gameto,\nFerring deal"
  why: Gameto's release on its proposed sale to Ferring for up to $1.4B, milestones included
  how: We used it for the largest deal of the market. It also showed drug makers buying IVF technology.
  url: https://www.gametogen.com/news/ferring-pharmaceuticals-and-gameto-sign-agreement-for-proposed-acquisition
- name: "Kindbody,\n2023 funding"
  why: Kindbody's release on its $100M round of 2023, which valued the fertility clinic group at $1.8B
  how: We used it for Kindbody's peak valuation. It framed its later fall and the sale of its clinics.
  url: https://kindbody.com/press-article/kindbody-announces-100-million-in-new-funding-to-further-accelerate-growth
- name: "Willow,\nElvie purchase"
  why: Willow's release on buying Elvie, the maker of wearable breast pumps, out of administration
  how: We used it for the failure of Elvie and the consolidation of pump makers. It also dated the deal.
  url: https://shop2.onewillow.com/blogs/press-release/willow-acquires-elvie
- name: "Allara Health,\nfunding release"
  why: Allara's release on its $30M round of 2026 for virtual care of hormonal conditions like PCOS
  how: We used it for the funding of hormonal health care. It also showed investors backing chronic care.
  url: https://www.allarahealth.com/blog/allara-raises-30m-to-transform-the-womens-healthcare-experience-with-ai
- name: "TechCrunch,\nEvvy funding"
  why: TechCrunch's article on Evvy's $40M round of September 2026 for vaginal microbiome tests
  how: We used it for the funding of women's health tests. It also showed the value of new health data.
  url: https://techcrunch.com/2026/09/15/evvy-raises-40m-as-it-seeks-to-further-womens-health-research-with-vaginal-microbiome-data
- name: "Alife Health,\nFDA clearance"
  why: Alife Health's page on the FDA clearance of Embryo Predict, which helps IVF teams choose embryos
  how: We used it for AI tools reaching IVF clinics. It also dated one of the products closest to market.
  url: https://www.alifehealth.com/press/fda
