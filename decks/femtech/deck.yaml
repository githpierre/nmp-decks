- id: ed210
  left: A REGULAR FEMTECH STARTUP
  logo: joinmidi
  note:
  - We used Midi’s financing release, clinician materials and reported coverage and care outcomes.
  - We used a fictional baseline for comparison, not a claim about how every other startup operates.
  right: MIDI HEALTH
  rows:
  - - They build a broad app with no dedicated clinical team
    - They connect women to menopause and midlife specialists
  - - They ask patients to find a clinician without guidance
    - They work with referring clinicians to supplement care
  - - They depend on a small local roster of care providers
    - Their clinical network spans all 50 states in the US
  - - They serve a small pool of women in their home market
    - They had served over 230,000 patients by February 2026
  - - They expect women to pay entirely out of their pocket
    - They expanded their network of major health insurance plans
  - - They manage appointments and clinical records manually
    - They use AI to support scheduling and documentation
  - - They report app usage rather than the cost of treatment
    - They reported up to 13% lower costs versus a matched group
  - - They struggle to fund the next phase of clinical expansion
    - They raised $100M at a valuation of more than $1B
  section: Startup strategies
  src: 210
  title: How Midi Health turned menopause care into a $1B business
  type: contrast
  logo_src: ../../assets/logos/midi-health.png
- id: ed211
  left: A REGULAR FEMTECH STARTUP
  logo: pomelocare
  logo_src: ../../assets/logos/pomelo-care.png
  note:
  - We used Pomelo’s financing, acquisition and clinical research releases and its Koch case study.
  - We used a fictional baseline for comparison, not a claim about how every other startup operates.
  right: POMELO CARE
  rows:
  - - They provide pregnancy information without medical care
    - They offer virtual pregnancy care to women around the clock
  - - They deliver virtual visits without any community support
    - They acquired The Doula Network to add in-person care
  - - They sell maternity advice directly to individual women
    - They sell through employers and health insurance plans
  - - They leave patients to coordinate their own medical care
    - They coordinate care with existing in-person providers
  - - They measure success by the number of downloads alone
    - They publish research on neonatal intensive care outcomes
  - - They try to replace every existing maternity care provider
    - They expand employer programs to add doula support
  - - They cover a narrow group of births in one local market
    - They reported supporting nearly 7% of US births in 2026
  - - They remain dependent on small early financing rounds
    - They raised $92M at a valuation of $1.7B in January 2026
  section: Startup strategies
  src: 211
  title: How Pomelo Care reached a $1.7B valuation in maternity care
  type: contrast
- id: ed212
  left: A REGULAR FEMTECH STARTUP
  logo: flo
  note:
  - We used Flo’s user disclosures, product documentation and the company’s class action statement.
  - We used a fictional baseline for comparison, not a claim about how every other startup operates.
  right: FLO HEALTH
  rows:
  - - They start with a broad wellness app for every audience
    - They began with a period tracker and expanded its scope
  - - They depend on a small number of monthly active users
    - They reported 80M monthly active users in May 2026
  - - They struggle to convert free downloads into revenue
    - They had nearly 5M paying subscribers by June 2024
  - - They focus only on users who are trying to get pregnant
    - They added a dedicated perimenopause feature in 2025
  - - They always link a user’s identity to her health logs
    - They offer an optional mode to separate identity from data
  - - They keep their data privacy technology closed to peers
    - They opened the code behind their Anonymous Mode feature
  - - They leave users to interpret midlife symptoms alone
    - They added doctor-backed guidance on midlife symptoms
  - - They fail to resolve legal exposure from personal data
    - They settled a privacy lawsuit without admitting wrongdoing
  section: Startup strategies
  src: 212
  title: How Flo Health scaled a cycle tracker into a global app
  type: contrast
  logo_src: ../../assets/logos/flo.png
- id: ed213
  left: A REGULAR FEMTECH STARTUP
  logo: mavenclinic
  logo_src: ../../assets/logos/maven-clinic.png
  note:
  - We used Maven’s employer materials, funding announcement and published maternity research findings.
  - We used a fictional baseline for comparison, not a claim about how every other startup operates.
  right: MAVEN CLINIC
  rows:
  - - They start by selling individual appointments to women
    - They made care a benefit paid by employers or insurers
  - - They build a narrow program without ongoing care access
    - They offer round-the-clock virtual reproductive care support
  - - They rely on a small number of distribution partners
    - They had over 2,000 employers and health plans in 2024
  - - They wait until women reach costly fertility treatment
    - They use integrated diagnostics to find underlying issues
  - - They track engagement but do not test maternity outcomes
    - They studied birth planning and intensive newborn care
  - - They aim for local reach without employer distribution
    - They reported that their platform reached 28M lives in 2026
  - - They offer fertility information without benefit coverage
    - They help employers cover family building beyond IVF
  - - They need repeated seed funding to reach commercial scale
    - They raised $125M at a $1.7B valuation in October 2024
  section: Startup strategies
  src: 213
  title: How Maven Clinic built a large employer-funded care platform
  type: contrast
- id: ed214
  left: A REGULAR FEMTECH STARTUP
  logo: getteal
  logo_src: ../../assets/logos/teal-health.png
  note:
  - We used Teal’s clinical study, authorization, commercial launch and financing announcements.
  - We used a fictional baseline for comparison, not a claim about how every other startup operates.
  right: TEAL HEALTH
  rows:
  - - They require a trip to a clinic just to collect a sample
    - They built a device for collecting vaginal samples at home
  - - They promote convenience without a clinical comparison
    - They compared home samples with samples from clinicians
  - - They validate their test in only one small clinical site
    - They enrolled 609 people at 16 US sites in their main study
  - - They sell wellness kits without seeking FDA authorization
    - They received FDA authorization for home screening in 2025
  - - They offer one way to pay with no insurance option
    - They offer insurance, card and health spending account pay
  - - They launch locally and remain limited to one state
    - They expanded screening to all 50 US states in January 2026
  - - They assume women will prefer a less invasive approach
    - They reported that 94% of study participants preferred home
  - - They scale before establishing any path to reimbursement
    - They raised $22M ahead of planned insurance coverage
  section: Startup strategies
  src: 214
  title: How Teal Health brought cervical screening into the home
  type: contrast
