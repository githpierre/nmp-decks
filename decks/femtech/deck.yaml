- id: ed024
  type: dated
  section: Market definition
  title: What has changed (very) recently?
  page: 1/2
  items:
  - d: SINCE 2023
    t: The FDA approved Veozah by Astellas in May 2023, the first drug without hormones for hot flashes, opening a new class of menopause medicines for women who avoid hormones.
  - d: SINCE 2023
    t: The FDA approved Opill in July 2023, the first daily birth control pill sold without a prescription in the US, which reached store shelves in early 2024.
  - d: SINCE 2024
    t: The US launched a White House initiative on women's health research, and ARPA-H committed $100M in February 2024 to fund new women's health tools.
  - d: SINCE 2024
    t: Flo raised $200M led by General Atlantic in July 2024, valuing the cycle app above $1B, a first for a consumer women's health app at that scale.
  - d: SINCE 2025
    t: Elvie, the maker of wearable breast pumps, entered administration and was sold to Willow in March 2025, showing how hard hardware is to fund in this market.
  - d: SINCE 2025
    t: Teal Health won the first FDA authorization for cervical cancer screening at home in May 2025, then made its device available in all 50 states by January 2026.
  note:
  - We kept the milestones that most changed the products, the money and the big players of the market
  - There is no official timeline, and another analyst could reasonably pick a few different milestones here
  src: 24
- id: ed025
  type: dated
  section: Market definition
  title: What has changed (very) recently?
  page: 2/2
  items:
  - d: SINCE 2025
    t: Flo agreed in July 2025 to settle a class action over sharing users' health data with other firms, a reminder that privacy is a core risk for every app in this market.
  - d: SINCE 2025
    t: Blackstone and TPG agreed in October 2025 to buy Hologic, a leader in breast and gynecological health, for up to $18B, and the deal closed in April 2026.
  - d: SINCE 2025
    t: The FDA said in November 2025 it would remove the boxed warning from menopause hormone therapy, and approved new labels for six products in February 2026.
  - d: SINCE 2026
    t: Midi Health said in February 2026 that insurance now covers its virtual menopause care for more than 45 million women across the US, a sign of payer support.
  - d: SINCE 2026
    t: Ferring agreed in October 2026 to buy Gameto, which matures eggs in the lab to cut IVF drug use, for up to $1.4B including milestones.
  - d: SINCE 2026
    t: Progyny said in November 2026 that it expects revenue of about $1.4B for the year, showing that employers keep paying for fertility benefits at scale.
  note:
  - We kept the milestones that most changed the products, the money and the big players of the market
  - There is no official timeline, and another analyst could reasonably pick a few different milestones here
  src: 25
