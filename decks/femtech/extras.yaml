- after: ed199p
  link: ed199p « Which femtech companies have shown warning signs? », followed by what the survivors do instead
  slide:
    id: xs_survivors
    type: pp_survivors
    section: Startup killers
    title: 'What sets femtech survivors

      apart from failures?'
    rows:
    - failed_company: FemTec Health
      ini: F
      src: ../../assets/logos/femtec-health.png
      why_it_failed: Ran out of cash and wound down in 2023
      explanation: Debt-funded buys of other firms left unpaid bills
      lesson: Grow by buying only with cash in hand
    - failed_company: Kindbody
      ini: K
      src: ../../assets/logos/kindbody.png
      why_it_failed: Sought money at $600M after a $1.8B price
      explanation: Owning clinics tied up cash in rent and staff
      lesson: Rent clinic capacity before owning it
    - failed_company: Elvie
      ini: E
      src: ../../assets/logos/elvie.png
      why_it_failed: Entered administration in March 2025
      explanation: Selling pumps meant costly stock and thin margins
      lesson: Get insurers to pay for devices early
    - failed_company: Apricity Fertility
      ini: A
      src: ../../assets/logos/apricity.png
      why_it_failed: Closed all its clinics in January 2025
      explanation: Running its own IVF clinics proved too costly
      lesson: Prove clinic economics before growing
    - failed_company: Premom
      ini: P
      src: ../../assets/logos/premom.png
      why_it_failed: Paid a $100K federal privacy penalty
      explanation: The FTC said it shared health data with ad firms
      lesson: Keep health data out of ad networks
    note:
    - We compared femtech companies that failed or hit a major setback with the ones that survived
    - We used company statements and the press, and all the sources we used are listed at the end of the report
