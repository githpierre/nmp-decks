ed148p:
  title: 'What pushed the protein degradation

    market forward, year after year?'
  events:
  - year: '2001'
    text: First PROTAC proves induced degradation
    impact: 3.0
  - year: '2003'
    text: PROTACs degrade steroid receptors
    impact: 1.0
  - year: '2004'
    text: VHL recruitment broadens ligase options
    impact: 1.0
  - year: '2008'
    text: MDM2 degraders validate new machinery
    impact: 0.5
  - year: '2010'
    text: SNIPER chemistry adds IAP recruitment
    impact: 1.0
  - year: '2013'
    text: IMiD biology clarifies molecular glues
    impact: 1.5
  - year: '2015'
    text: Potent small molecule PROTACs emerge
    impact: 2.0
  - year: '2016'
    text: Catalytic degradation sharpens value case
    impact: 1.0
  - year: '2017'
    text: Arvinas builds clinical degrader pipeline
    impact: 1.0
  - year: '2018'
    text: Oral degraders show preclinical viability
    impact: 1.5
  - year: '2019'
    text: ARV 110 enters first PROTAC trial
    impact: 2.5
  - year: '2019'
    text: ARV 471 follows into the clinic
    impact: 1.5
  - year: '2020'
    text: Patient degradation validates pharmacology
    impact: 2.0
  - year: '2020'
    text: Glue investment accelerates discovery
    impact: 1.0
  - year: '2021'
    text: More E3 ligases enter degrader design
    impact: 1.0
  - year: '2021'
    text: Protein degradation partnerships multiply
    impact: 1.5
  - year: '2022'
    text: Glue degraders reach broader oncology targets
    impact: 1.0
  - year: '2022'
    text: Extracellular degraders widen target range
    impact: 1.0
  - year: '2023'
    text: Phase 2 programs test clinical durability
    impact: 1.5
  - year: '2023'
    text: Neuro degraders target brain disease
    impact: 1.0
  - year: '2024'
    text: VERITAC 2 moves PROTAC to phase 3
    impact: 2.0
  - year: '2024'
    text: BCL6 degrader enters lymphoma testing
    impact: 1.0
  - year: '2024'
    text: LRRK2 degrader advances into humans
    impact: 1.0
  - year: '2025'
    text: VERITAC 2 reports positive phase 3
    impact: 2.0
  - year: '2025'
    text: Regulators review first PROTAC filing
    impact: 2.0
  - year: '2025'
    text: Degrader pipelines diversify beyond oncology
    impact: 1.0
  - year: '2026'
    text: FDA approves first PROTAC drug
    impact: 3.0
  - year: '2026'
    text: HPK1 PROTAC starts human testing
    impact: 1.0
  - year: '2026'
    text: Parkinson degrader shows biomarker movement
    impact: 1.5
  - year: '2026'
    text: BCL6 degrader reaches clinical readout
    impact: 1.0
  note:
  - We kept the events we believe pushed targeted protein degradation forward the most
  - Ratings are our estimates, with all the sources at the end of the report
