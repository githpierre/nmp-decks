ed007p:
  type: pp_radar
  title: 'Which companies really belong

    in targeted protein degradation?'
  TL:
    name: Schrodinger
    src: ../../assets/logos/pp_live/targeted-protein-degradation/s01-00.png
    text: provides drug discovery software and develops inhibitors, but — degradation is not the core therapeutic mechanism
  TR:
    name: Thermo Fisher
    src: ../../assets/logos/pp_live/targeted-protein-degradation/s01-02.png
    text: sells research instruments ~~ and reagents used in degrader discovery but does not develop degrader medicines
  BL:
    name: Astellas
    src: ../../assets/logos/pp_live/targeted-protein-degradation/s01-09.png
    text: runs clinical degrader programs including KRAS G12D, but degradation is one part of a broad pharma portfolio
  BR:
    name: Bristol Myers Squibb
    src: ../../assets/logos/pp_live/targeted-protein-degradation/s01-10.png
    text: has major molecular glue and PROTAC assets, while most revenue comes from conventional medicines
  caption:
  - Distance to the center reflects how central each company is to targeted protein degradation
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
