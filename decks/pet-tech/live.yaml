  title: 'What counts as pet tech,

    and what falls outside?'
  TL:
    name: Rover
    src: ../../assets/logos/pp_live/pet-tech/s01-00.png
    text: connects owners with walkers and sitters through its app, but the care it books is classic pet sitting done by people
  TR:
    name: Chewy
    src: ../../assets/logos/pp_live/pet-tech/s01-02.png
    text: runs a slick app and offers vet video calls, but about 70% of its sales still come from food, litter and other consumables
  BL:
