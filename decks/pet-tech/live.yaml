ed142p:
  title: 'What could slow

    pet tech down?'
  events:
  - odds: 45
    impact: 3
    text: Chewy and Petco bundle vet care, insurance and smart devices, squeezing independent pet tech startups
  - odds: 40
    impact: 2
    text: State veterinary boards keep blocking telehealth without an in-person exam, limiting virtual vet startups
  - odds: 35
    impact: 2
    text: Household budgets tighten and owners cut spending on GPS collars, smart feeders and subscription apps
  - odds: 30
    impact: 2
    text: Tariffs on Chinese electronics raise the cost of smart litter boxes and pet cameras by 25%
  - odds: 25
    impact: 2
    text: Apple, Amazon and Google launch cheap pet trackers using AirTag style networks, undercutting Tractive and Fi
  - odds: 25
    impact: 1
    text: Pet adoption keeps falling as shelters report fewer adoptions, shrinking the pool of new device buyers
  - odds: 15
    impact: 1
    text: A hack exposes home camera feeds from a popular pet camera brand, and buyers return devices
  - odds: 12
    impact: 3
    text: A smart feeder or litter box malfunction kills pets, triggering a CPSC recall and viral backlash
  note:
  - We listed the events that could slow pet tech down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
