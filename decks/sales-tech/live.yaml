ed148p:
  title: 'What pushed the sales tech

    market forward, year after year?'
  events:
  - year: '1993'
    text: Siebel packages sales force automation
    impact: 2.0
  - year: '1995'
    text: CRM becomes a defined category
    impact: 1.5
  - year: '1999'
    text: Salesforce moves CRM to cloud
    impact: 3.0
  - year: '2005'
    text: AppExchange turns CRM into platform
    impact: 2.0
  - year: '2006'
    text: HubSpot popularizes inbound workflows
    impact: 1.5
  - year: '2007'
    text: Smartphones mobilize CRM access
    impact: 1.0
  - year: '2011'
    text: Sales engagement cadences emerge
    impact: 2.5
  - year: '2013'
    text: Scheduling software reduces meeting friction
    impact: 1.0
  - year: '2015'
    text: Gong brings AI to sales calls
    impact: 2.5
  - year: '2016'
    text: Salesforce Einstein embeds prediction
    impact: 2.0
  - year: '2017'
    text: Revenue operations gains adoption
    impact: 1.5
  - year: '2018'
    text: Sales stacks add intent signals
    impact: 1.5
  - year: '2019'
    text: Parallel dialing boosts connect rates
    impact: 1.0
  - year: '2020'
    text: Remote selling becomes default
    impact: 2.0
  - year: '2020'
    text: AI meeting notes scale remotely
    impact: 1.5
  - year: '2021'
    text: Salesforce buys Slack
    impact: 1.5
  - year: '2022'
    text: Data Cloud unifies customer context
    impact: 1.5
  - year: '2022'
    text: Generative AI rewrites seller workflows
    impact: 2.0
  - year: '2023'
    text: Microsoft adds sales copilots
    impact: 2.0
  - year: '2023'
    text: CRM vendors race into generative AI
    impact: 2.0
  - year: '2024'
    text: Salesforce launches Agentforce
    impact: 2.0
  - year: '2024'
    text: AI becomes core sales stack rubric
    impact: 1.5
  - year: '2024'
    text: Revenue intelligence meets CRM data
    impact: 1.5
  - year: '2025'
    text: Agent marketplaces broaden sales automation
    impact: 1.5
  - year: '2025'
    text: AI CRM revenue validates demand
    impact: 2.0
  - year: '2025'
    text: GTM platforms consolidate point tools
    impact: 1.5
  - year: '2026'
    text: Salesforce passes one million customers
    impact: 1.5
  - year: '2026'
    text: Sales agents move across Microsoft apps
    impact: 2.0
  - year: '2026'
    text: CRM agents automate routine pipeline work
    impact: 2.0
  - year: '2026'
    text: Sales stacks standardize around agents
    impact: 1.5
  note:
  - We kept the events we believe pushed sales tech forward the most
  - Ratings are our estimates, with all the sources at the end of the report
