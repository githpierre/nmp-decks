ed007p:
  type: pp_radar
  title: 'Who Is in sales tech,

    and who stays outside?'
  TL:
    name: ZoomInfo
    src: ../../assets/logos/pp_live/sales-tech/s01-00.png
    text: primarily sales intelligence and data, not a full sales execution stack despite workflow features
  TR:
    name: Slack
    src: ../../assets/logos/pp_live/sales-tech/s01-02.png
    text: workplace messaging used by sales teams but it is not built to manage or improve the selling process itself
  BL:
    name: HubSpot CRM
    src: ../../assets/logos/pp_live/sales-tech/s01-09.png
    text: and sales tools sit beside marketing and service products, so only part of the suite is sales technology
  BR:
    name: Salesforce
    src: ../../assets/logos/pp_live/sales-tech/s01-10.png
    text: leading CRM with broad enterprise software revenue beyond sales technology and many non sales clouds
  caption:
  - Distance to the center reflects how central each company is to sales tech
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
  - ../../assets/logos/pp_live/sales-tech/s01-01.png
