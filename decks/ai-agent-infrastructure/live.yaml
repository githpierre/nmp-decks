ed007p:
  type: pp_radar
  title: 'Which companies really belong

    in AI agent infrastructure?'
  TL:
    name: Braintrust
    src: ../../assets/logos/pp_live/ai-agent-infrastructure/s01-00.png
    text: evaluates and observes agents but does not provide the core runtime, memory or execution environment
  TR:
    name: OpenAI
    src: ../../assets/logos/pp_live/ai-agent-infrastructure/s01-02.png
    text: builds foundation models and end-user agents, while agent infrastructure is not its primary standalone market
  BL:
    name: Pipedream
    src: ../../assets/logos/pp_live/ai-agent-infrastructure/s01-09.png
    text: provides connectors and workflows useful to agents, but also serves conventional automation and integration
  BR:
    name: Temporal
    src: ../../assets/logos/pp_live/ai-agent-infrastructure/s01-10.png
    text: durable workflows can run agents, but most usage remains general application orchestration outside AI
  caption:
  - Distance to the center reflects how central each company is to AI agent infrastructure
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
