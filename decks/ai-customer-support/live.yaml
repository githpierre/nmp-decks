ed142p:
  title: 'What are the biggest threats

    to AI customer support?'
  events:
  - odds: 40
    impact: 2
    text: Sierra and Decagon valuations reset sharply as revenue multiples near 100 times fall back to earth
  - odds: 35
    impact: 3
    text: Salesforce Agentforce and Zendesk bundle AI support into their suites and win most large customers
  - odds: 30
    impact: 2
    text: More companies reverse AI support cuts like Klarna did after service quality drops and customers complain
  - odds: 30
    impact: 3
    text: Resolution prices fall from about $1 toward 20 cents as vendors compete, crushing startup margins
  - odds: 25
    impact: 2
    text: A breach at a leading AI support vendor leaks millions of customer records and chats
  - odds: 20
    impact: 2
    text: Teleperformance and Concentrix build their own AI agents and keep large support contracts away from startups
  - odds: 20
    impact: 2
    text: OpenAI and Google sell support agents directly to T-Mobile, Zillow and other large brands
  - odds: 15
    impact: 2
    text: EU regulators fine a company up to 3% of turnover for AI support that misleads customers
  note:
  - We listed the events that could slow ai customer support down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
