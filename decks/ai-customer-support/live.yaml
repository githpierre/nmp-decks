ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'The query AI customer service

    keeps hitting new highs on Google'
  date: Recently.
  expl: Companies started letting AI answer customers instead of agents, and every support team wanted to know if that was safe. Searches come in waves,
    and the latest wave was the biggest yet.
  term: ai customer support
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/ai-customer-support/ai-customer-support.csv
ed052p:
  type: pp_cagr
  title: 'Is the AI customer support

    market still growing fast?'
  lead: ''
  condition: Yes, but agents must resolve most common issues by 2029 as Gartner expects, voice agents must answer in under a second, and a resolution must
    mean the same thing to every buyer. It must also keep a human one click away, so that no Klarna-style reversal makes boards cap automation at half of
    the volume.
  note:
  - We compared forecasts from Grand View Research, Polaris, Technavio and MarketsandMarkets
  - We lowered them for falling prices per resolution, and all our sources are at the end of the report
  size: 19
  cagr: 20
  y0: 2026
