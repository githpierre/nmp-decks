ed148p:
  title: 'What pushed the sustainable packaging

    market forward, year after year?'
  events:
  - year: '1994'
    text: EU creates packaging waste framework
    impact: 2.0
  - year: '2000'
    text: Lightweighting becomes cost-saving priority
    impact: 1.0
  - year: '2004'
    text: Recycled paper gains brand adoption
    impact: 1.0
  - year: '2008'
    text: Oil spike raises plastic cost risk
    impact: 1.0
  - year: '2010'
    text: E-commerce expands right-sized packaging
    impact: 1.0
  - year: '2011'
    text: Deposit systems prove high collection
    impact: 1.0
  - year: '2013'
    text: Brands set public packaging targets
    impact: 1.5
  - year: '2015'
    text: Circular economy enters EU policy
    impact: 2.0
  - year: '2016'
    text: Ocean plastic drives consumer pressure
    impact: 1.5
  - year: '2017'
    text: Mono-material films improve recyclability
    impact: 1.0
  - year: '2018'
    text: Global Commitment targets plastic packaging
    impact: 2.0
  - year: '2019'
    text: EU Single-Use Plastics rules tighten
    impact: 3.0
  - year: '2019'
    text: Molded fiber replaces plastic formats
    impact: 1.0
  - year: '2020'
    text: Pandemic exposes packaging waste surge
    impact: 1.0
  - year: '2020'
    text: Brands accelerate recycled-content pledges
    impact: 1.5
  - year: '2021'
    text: EPR laws spread producer costs
    impact: 1.5
  - year: '2021'
    text: Refill pilots move into retail
    impact: 1.0
  - year: '2022'
    text: UN launches global plastics treaty talks
    impact: 2.5
  - year: '2022'
    text: Resin volatility favors material efficiency
    impact: 1.0
  - year: '2023'
    text: EU advances PPWR negotiations
    impact: 2.0
  - year: '2023'
    text: Paper barriers replace more fossil layers
    impact: 1.0
  - year: '2024'
    text: Treaty talks keep global pressure high
    impact: 1.0
  - year: '2024'
    text: Brands simplify packs for recycling
    impact: 1.5
  - year: '2025'
    text: EU PPWR enters force
    impact: 3.0
  - year: '2025'
    text: Paper barrier reaches juice cartons
    impact: 1.5
  - year: '2025'
    text: Deposit targets support recyclable containers
    impact: 1.5
  - year: '2026'
    text: PPWR starts applying across Europe
    impact: 2.0
  - year: '2026'
    text: Tetra Pak scales paper barriers
    impact: 2.0
  - year: '2026'
    text: EU harmonizes packaging labels
    impact: 1.5
  - year: '2026'
    text: PFAS limits reshape food packaging
    impact: 2.0
  note:
  - We kept the events we believe pushed sustainable packaging forward the most
  - Ratings are our estimates, with all the sources at the end of the report
ed168p:
  handle: sustainable-packaging
  title: 'Where did sustainable packaging

    investors put their money this past year?'
  note:
  - We added up every equity round of sustainable packaging startups in our tracker over the last twelve months
  - by category of our market definition, and rounds with no public amount count as zero here
