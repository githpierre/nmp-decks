ed007p:
  type: pp_radar
  title: 'Which companies really belong

    in sustainable packaging?'
  TL:
    name: TOMRA
    src: ../../assets/logos/pp_live/sustainable-packaging/s01-00.png
    text: provides collection and recycling systems for packaging waste, but does not primarily make sustainable packaging product
  TR:
    name: Waste Management
    src: ../../assets/logos/pp_live/sustainable-packaging/s01-02.png
    text: collects and processes waste, including packaging, but does not design or manufacture lower- impact packaging formats
  BL:
    name: Mondi
    src: ../../assets/logos/pp_live/sustainable-packaging/s01-09.png
    text: offers paper and recyclable packaging at scale, while also serving — broad conventional paper and packaging markets
  BR:
    name: Amcor
    src: ../../assets/logos/pp_live/sustainable-packaging/s01-10.png
    text: sells recyclable and lightweight packaging alongside a large conventional plastics and flexible-packaging portfolio
  caption:
  - Distance to the center reflects how central each company is to sustainable packagin
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
