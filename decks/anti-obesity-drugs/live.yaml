ed148p:
  title: 'What pushed the anti-obesity drugs

    market forward, year after year?'
  events:
  - year: '1959'
    text: Phentermine creates early prescription demand
    impact: 1.5
  - year: '1973'
    text: Fenfluramine broadens drug treatment
    impact: 1.0
  - year: '1992'
    text: Fen phen results raise treatment interest
    impact: 1.0
  - year: '1996'
    text: Dexfenfluramine heightens treatment adoption
    impact: 1.0
  - year: '1997'
    text: Heart-valve crisis resets obesity drug safety
    impact: 1.5
  - year: '1997'
    text: Sibutramine offers non-amphetamine route
    impact: 1.0
  - year: '1999'
    text: Orlistat validates long-term treatment
    impact: 2.0
  - year: '2006'
    text: Rimonabant exposes psychiatric safety risks
    impact: 0.5
  - year: '2007'
    text: OTC orlistat widens pharmacy access
    impact: 1.0
  - year: '2008'
    text: Psychiatric risks end rimonabant sales
    impact: 1.0
  - year: '2010'
    text: Sibutramine withdrawal raises cardiac bar
    impact: 1.0
  - year: '2012'
    text: Qsymia brings stronger combination therapy
    impact: 1.5
  - year: '2012'
    text: Belviq adds another appetite-targeted option
    impact: 0.5
  - year: '2014'
    text: Contrave validates brain-pathway combinations
    impact: 1.5
  - year: '2014'
    text: Saxenda brings GLP-1 into obesity
    impact: 2.5
  - year: '2020'
    text: Lorcaserin cancer signal tightens oversight
    impact: 0.5
  - year: '2020'
    text: Setmelanotide serves genetic obesity patients
    impact: 1.0
  - year: '2021'
    text: Wegovy resets expectations for weight loss
    impact: 3.0
  - year: '2022'
    text: Teen Wegovy approval widens access
    impact: 1.5
  - year: '2023'
    text: Zepbound validates dual incretin medicines
    impact: 3.0
  - year: '2023'
    text: Triple agonist data intensifies pipeline race
    impact: 1.5
  - year: '2023'
    text: Oral orforglipron trials open pill route
    impact: 1.5
  - year: '2024'
    text: Heart-risk approval expands Wegovy value
    impact: 2.0
  - year: '2024'
    text: Sleep apnea approval widens obesity use
    impact: 1.5
  - year: '2025'
    text: MASH approval adds metabolic disease demand
    impact: 1.5
  - year: '2025'
    text: Oral Wegovy removes injection barrier
    impact: 2.0
  - year: '2026'
    text: Higher-dose Wegovy raises efficacy ceiling
    impact: 1.5
  - year: '2026'
    text: Foundayo opens unrestricted oral GLP-1 dosing
    impact: 2.5
  - year: '2026'
    text: Medicare bridge widens GLP-1 access
    impact: 2.0
  - year: '2026'
    text: Retatrutide Phase 3 validates triple agonists
    impact: 2.0
  note:
  - We kept the events we believe pushed anti obesity drugs forward the most
  - Ratings are our estimates, with all the sources at the end of the report
