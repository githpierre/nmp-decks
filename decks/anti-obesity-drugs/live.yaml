ed052p:
  type: pp_cagr
  title: 'How much bigger can

    anti-obesity drugs get?'
  lead: ''
  condition: To get that big, the market must win broad insurance coverage and much lower prices so that far more patients can stay on treatment. It must
    also prove that pills and newer drugs keep weight off for years.
  note:
  - We compared forecasts from Eli Lilly, Novo Nordisk filings, ResearchAndMarkets and IMARC
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: 35
  cagr: 13
  y0: 2026
