ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people ask how Claude

    Code lets them build apps without coding'
  date: Lately.
  expl: Typing a request and letting AI write the whole app went from joke to habit. Tools like Claude Code let people with no coding skills build software,
    and developers and founders started searching for how it works.
  term: vibe coding
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/vibe-coding/vibe-coding.csv
ed052p:
  type: pp_cagr
  title: 'How much room is left

    for this market to grow?'
  lead: 'To fill that room, '
  condition: the tools must earn real margins on cheaper or in-house models, and agents must prove they make teams faster, not only busier. Apps built by
    non-coders must also stay secure enough that companies let them run real business data, and app stores must keep letting them in.
  note:
  - We compared growth paths from SaaStr, Roots Analysis, SNS Insider and Gartner, and aligned their timelines
  - We allowed for slower growth as the base gets larger, and all the sources are included at the end of the report
  size: 14
  cagr: 25
  y0: 2026
