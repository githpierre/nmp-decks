ed142p:
  title: 'What could slow

    vibe coding down?'
  events:
  - odds: 40
    impact: 3
    text: Anthropic and OpenAI push Claude Code and Codex, squeezing Cursor and other tools built on their models
  - odds: 35
    impact: 3
    text: Google and Microsoft keep Antigravity and Copilot free or cheap, squeezing paid vibe coding startups
  - odds: 20
    impact: 3
    text: Investors stop funding vibe coding startups like Cursor that lose more money than they earn
  - odds: 15
    impact: 2
    text: Open models like Kimi and DeepSeek match top models, so cheap tools undercut Cursor and Lovable
  - odds: 12
    impact: 2
    text: A major data leak from a vibe-coded app exposes millions of users and scares business buyers away
  - odds: 10
    impact: 2
    text: Companies cut AI coding budgets after studies show little real productivity gain for experienced developers
  - odds: 8
    impact: 2
    text: Apple and Google block apps built with vibe coding tools like Replit from their app stores
  - odds: 5
    impact: 2
    text: A court holds an AI coding tool liable for a data leak in an app it generated
  note:
  - We listed the events that could slow vibe coding down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
