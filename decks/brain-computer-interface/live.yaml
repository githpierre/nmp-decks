ed142p:
  title: 'What are the biggest threats

    to brain-computer interfaces?'
  events:
  - odds: 45
    impact: 3
    text: FDA approvals slip again for Neuralink Blindsight and Synchron, pushing first sales back by several years
  - odds: 35
    impact: 3
    text: CMS and US insurers refuse to cover brain implants, so few patients can afford them after approval
  - odds: 30
    impact: 3
    text: Serious adverse events in Neuralink or BrainGate trials scare patients and push the FDA to slow approvals
  - odds: 25
    impact: 2
    text: Brain-computer interface funding crashes as Neuracle and other IPO candidates fail to list or trade poorly
  - odds: 25
    impact: 2
    text: China approves more implants and scales faster, winning the market ahead of Neuralink, Synchron and Precision
  - odds: 20
    impact: 1
    text: Consumers ignore EEG headphones and headbands, and consumer brain-computer interface startups like Neurable fade away
  - odds: 15
    impact: 1
    text: New neural data laws in US states and the EU add costly rules for brain-computer interface companies
  - odds: 10
    impact: 2
    text: Apple, Meta or Google launch their own implant program and push brain implant startups to the margins
  note:
  - We listed the events that could slow brain computer interface down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
