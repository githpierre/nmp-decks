ed007p:
  type: pp_radar
  title: 'What makes a company

    part of vibe coding?'
  TL:
    name: Bubble
    src: ../../assets/logos/pp_live/brain-computer-interface/s01-00.png
    text: now offers an AI app generator, but its users still build mostly in a visual drag and drop editor, so it stays outside
  TR:
    name: Supabase
    src: ../../assets/logos/pp_live/brain-computer-interface/s01-02.png
    text: runs the database behind countless Lovable and Bolt apps, but it is infrastructure that never writes the software itself
  BL:
    name: Wix
    src: ../../assets/logos/pp_live/brain-computer-interface/s01-09.png
    text: bought Base44 to sell prompt to app building, but most of its revenue still comes from classic website builder subscriptions
  BR:
    name: Vercel
    src: ../../assets/logos/pp_live/brain-computer-interface/s01-10.png
    text: turns prompts into apps with vO, but most of its revenue still comes from hosting web apps, so it sits on the edge
  caption:
  - Distance to the center reflects how fully a product turns a plain language request into working software
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
