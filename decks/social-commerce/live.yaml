ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people want fo sell

    straight from their social feed'
  date: 0 Lately.
  expl: People now buy what they see in their feed. TikTok Shop grew fast in the US and Europe, Instagram and YouTube added more shopping features, and
    creators turned into salespeople. Brands and sellers went looking for how social commerce works.
  term: social commerce
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/social-commerce/social-commerce.csv
ed052p:
  type: pp_cagr
  title: 'How much bigger can

    social commerce get?'
  lead: ''
  condition: To get that big, the market must win the West the way it won China, with people buying through videos, livestreams, and creators every week.
    It must also build trust, with fewer fakes and clearer ads, and keep fees low enough for small sellers to make money.
  note:
  - We compared forecasts from Grand View, Precedence, Fortune Business Insights and The Business Research Company
  - We adjusted each one to our market definition to build a realistic range, and all our sources are at the end of the report
  size: null
  cagr: 15
  y0: 2026
