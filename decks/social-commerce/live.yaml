ed142p:
  title: 'What could go wrong

    for social commerce?'
  events:
  - odds: 45
    impact: 3
    text: Higher tariffs and the end of de minimis keep cheap Chinese goods off TikTok Shop and Temu
  - odds: 40
    impact: 2
    text: TikTok Shop under its new US joint venture raises seller fees and cuts creator commissions
  - odds: 35
    impact: 2
    text: The FTC fines creators and brands for hidden paid endorsements under its fake reviews rule
  - odds: 30
    impact: 1
    text: Amazon expands creator storefronts and Inspire style feeds, pulling sellers and influencers away from social apps
  - odds: 30
    impact: 2
    text: State teen social media laws cut reach to Gen Z, the core social shopping audience
  - odds: 25
    impact: 2
    text: Meta and YouTube shrink in-app checkout again, pushing shoppers back to Amazon and brand websites
  - odds: 25
    impact: 2
    text: Counterfeit and unsafe products sold through livestreams spark a CPSC crackdown and consumer distrust
  - odds: 10
    impact: 3
    text: A new Congress moves to ban the TikTok joint venture over Chinese algorithm ties
  note:
  - We listed the events that could slow social commerce down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
