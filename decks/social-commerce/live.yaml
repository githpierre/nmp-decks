ed007p:
  type: pp_radar
  title: 'What makes a company

    part of social commerce?'
  TL:
    name: Instagram
    src: ../../assets/logos/pp_live/social-commerce/s01-00.png
    text: starts countless purchases through shoppable posts and ads, but like the rest of Meta it earns about 97% from ads
  TR:
    name: Gymshark
    src: ../../assets/logos/pp_live/social-commerce/s01-02.png
    text: grew through fitness influencers on social media, but it is a sportswear brand that sells through its own online stores
  BL:
    name: RedNofe
    src: ../../assets/logos/pp_live/social-commerce/s01-10.png
    text: runs an in-app shop and shapes what young Chinese shoppers buy, but its revenue still relies heavily on brand advertising
  BR:
    name: Meesho
    src: ../../assets/logos/pp_live/social-commerce/s01-11.png
    text: grew through homemakers reselling its products on WhatsApp, but since 2021 most of its buyers order directly in its app
  caption:
  - Distance to the center reflects how much of a company’s revenue comes from purchases started on social platforms or by creators
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
