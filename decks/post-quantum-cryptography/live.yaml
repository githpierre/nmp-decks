ed007p:
  type: pp_radar
  title: 'Which companies really belong

    in generative engine optimization (GEO)?'
  TL:
    name: Moz
    src: ../../assets/logos/pp_live/post-quantum-cryptography/s01-00.png
    text: classic SEO suite without AI answer tracking as its core product, so buyers may confuse the categories
  TR:
    name: OpenAI
    src: ../../assets/logos/pp_live/post-quantum-cryptography/s01-02.png
    text: runs AI assistants and search experiences but does not sell brand GEO measurement or optimization software
  BL:
    name: Semrush
    src: ../../assets/logos/pp_live/post-quantum-cryptography/s01-09.png
    text: broad marketing and SEO suite now adding AI visibility, while GEO is only one part of a much larger platform
  BR:
    name: Ahrefs SEO
    src: ../../assets/logos/pp_live/post-quantum-cryptography/s01-10.png
    text: platform with newer AI visibility features, but most of its product and revenue remain classic search SEO
