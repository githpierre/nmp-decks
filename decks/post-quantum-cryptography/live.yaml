ed148p:
  title: 'What pushed the post-quantum crypto

    market forward, year after year?'
  events:
  - year: '2015'
    text: NIST frames the post-quantum threat
    impact: 1.5
  - year: '2016'
    text: NIST publishes post-quantum risk report
    impact: 2.0
  - year: '2016'
    text: NIST opens global algorithm competition
    impact: 3.0
  - year: '2017'
    text: NIST accepts 69 candidate algorithms
    impact: 1.5
  - year: '2018'
    text: First PQC conference builds consensus
    impact: 1.0
  - year: '2019'
    text: NIST narrows to second round
    impact: 1.5
  - year: '2020'
    text: NIST names third-round finalists
    impact: 2.0
  - year: '2021'
    text: Hybrid deployments test real networks
    impact: 1.5
  - year: '2022'
    text: NIST selects first standard algorithms
    impact: 3.0
  - year: '2022'
    text: Harvest-now-decrypt-later risk spreads
    impact: 2.0
  - year: '2023'
    text: NIST releases draft FIPS standards
    impact: 2.0
  - year: '2023'
    text: Signal deploys PQXDH messaging
    impact: 2.0
  - year: '2023'
    text: Chrome tests post-quantum TLS
    impact: 1.5
  - year: '2024'
    text: NIST publishes FIPS 203 204 205
    impact: 3.0
  - year: '2024'
    text: Apple ships PQ3 in iMessage
    impact: 2.0
  - year: '2024'
    text: NIST publishes transition draft guidance
    impact: 1.5
  - year: '2024'
    text: PQC inventory tools gain urgency
    impact: 1.5
  - year: '2025'
    text: NIST selects HQC backup KEM
    impact: 1.5
  - year: '2025'
    text: Migration shifts from pilots to programs
    impact: 2.0
  - year: '2025'
    text: Cloud products add standardized ML-KEM
    impact: 1.5
  - year: '2025'
    text: Regulators emphasize long migration timelines
    impact: 1.5
  - year: '2025'
    text: Hybrid TLS becomes operational practice
    impact: 1.5
  - year: '2026'
    text: Chromium publishes PQ authentication roadmap
    impact: 2.0
  - year: '2026'
    text: US government renews migration mandates
    impact: 2.0
  - year: '2026'
    text: NIST finalizes transition guidance
    impact: 2.0
  - year: '2026'
    text: IETF advances ML-KEM for TLS
    impact: 2.0
  - year: '2026'
    text: Federal crypto inventories become actionable
    impact: 1.5
  - year: '2026'
    text: PQC moves into web authentication
    impact: 1.5
  - year: '2026'
    text: Standards reduce implementation uncertainty
    impact: 1.5
  - year: '2026'
    text: Migration deadlines pull spending forward
    impact: 2.0
  note:
  - We kept the events we believe pushed post quantum cryptography forward the most
  - Ratings are our estimates, with all the sources at the end of the report
