ed142p:
  title: 'What could slow

    cybersecurity down?'
  events:
  - odds: 50
    impact: 3
    text: Microsoft, CrowdStrike and Palo Alto Networks bundle AI security features and squeeze point solution startups
  - odds: 40
    impact: 2
    text: Startups fail to sell AI security tools because buyers wait for big vendors to add them
  - odds: 35
    impact: 2
    text: CISA budget cuts and lapsed threat sharing laws weaken US cyber defense and slow federal deals
  - odds: 30
    impact: 2
    text: AI agents from OpenAI and Google find and patch bugs for free, cutting demand for scanning tools
  - odds: 30
    impact: 1
    text: SEC and EU NIS2 breach rules raise liability for vendors whose products are linked to hacks
  - odds: 30
    impact: 2
    text: Valuations drop after the Wiz deal hype fades, and late-stage cyber startups struggle to raise or exit
  - odds: 20
    impact: 1
    text: Cyber insurance premiums fall and insurers stop requiring tools, slowing sales to mid-size companies
  - odds: 15
    impact: 3
    text: A CrowdStrike-style faulty update crashes millions of computers and buyers question cloud security vendors
  note:
  - We listed the events that could slow cybersecurity down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
