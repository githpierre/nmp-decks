ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more companies look

    for a cybersecurity firm after big hacks'
  date: Lately.
  expl: Cyberattacks stopped being a tech story. Hackers shut down retailers like Marks & Spencer, airlines and carmakers, and AI made scams and phishing
    much more convincing. Businesses and people started searching for cybersecurity firms that can actually help.
  term: cybersecurity
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/cybersecurity/cybersecurity.csv
ed052p:
  type: pp_cagr
  title: 'How much room is left

    for this market to grow?'
  lead: 'To fill that room, '
  condition: the market must turn AI from a weapon for attackers into a shield, with agents that find and fix flaws before criminals do. It must also keep
    budgets growing while buyers cut tools, and protect the huge number of machine identities that AI agents create.
  note:
  - We compared forecasts from Gartner, IDC, Grand View and Fortune Business Insights and adjusted each one to our market
  - We then built a realistic range from these forecasts, and you will find all the sources we used at the end of the report
  size: 275
  cagr: 12
  y0: 2026
