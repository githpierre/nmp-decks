ed007p:
  type: pp_radar
  title: 'What is actually included

    in the cybersecurity market?'
  TL:
    name: Microsoft
    src: ../../assets/logos/pp_live/cybersecurity/s01-00.png
    text: runs a security business of over $20 billion a year, but that is a small part of a company built on cloud and software
  TR:
    name: ADT
    src: ../../assets/logos/pp_live/cybersecurity/s01-02.png
    text: is one of the best-known names in security, but its alarms and cameras protect homes and offices, not networks or data
  BL:
    name: Veeam
    src: ../../assets/logos/pp_live/cybersecurity/s01-10.png
    text: is known for backup, which we exclude, but now sells ransomware recovery and bought Securiti AI to move into data security
  BR:
    name: Cloudflare
    src: ../../assets/logos/pp_live/cybersecurity/s01-11.png
    text: began as a network that speeds up websites and now sells firewalls and Zero Trust access on top, so it sits on the line
  caption:
  - Distance to the center reflects how much protecting systems, data and users from cyber threats is the product's main purpose
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
