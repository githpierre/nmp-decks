ed142p:
  title: 'What are the biggest

    threats to AI chips?'
  events:
  - odds: 50
    impact: 3
    text: Nvidia keeps over 80 percent of AI accelerator sales and startups like Etched and Tenstorrent stall
  - odds: 45
    impact: 3
    text: Google TPUs, Amazon Trainium and Meta MTIA chips cut hyperscaler demand for third party startup chips
  - odds: 35
    impact: 2
    text: TSMC advanced packaging capacity stays sold out, so small chip firms wait a year for supply
  - odds: 35
    impact: 2
    text: New US export controls block AI chip sales to China and the Gulf, shrinking startup markets
  - odds: 25
    impact: 2
    text: Cerebras or another newly listed AI chip firm misses forecasts and its stock falls by half
  - odds: 20
    impact: 2
    text: A single customer like OpenAI or G42 cancels orders and wipes out most of a startup backlog
  - odds: 10
    impact: 1
    text: New model types shift away from transformers and make fixed inference chips designed today obsolete
  - odds: 4
    impact: 3
    text: A Taiwan Strait blockade or conflict halts TSMC output and freezes the whole AI chip supply chain
  note:
  - We listed the events that could slow ai chip down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
