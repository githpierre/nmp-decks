ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people look up AI chips

    because there are never enough'
  date: Over the past year.
  expl: Every AI company needs chips, and there are never enough. Nvidia’s sales exploded, Google, Amazon and OpenAI built their own chips, and the US and
    China fought over who can buy them. AI chips became a topic for investors and the general public.
  term: ai chip
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/ai-chip/ai-chip.csv
ed052p:
  type: pp_cagr
  title: 'Where could the AI chip

    market be in ten years?'
  lead: 'To get there, '
  condition: AI must keep spreading into every product and service, with demand for inference growing faster than chips get cheaper. Chip makers must also
    find enough power, memory, and packaging capacity to build all the data centers that buyers already plan.
  note:
  - We compared forecasts from Precedence, Fortune Business Insights, Grand View and IDC
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: null
  cagr: 15
  y0: 2026
