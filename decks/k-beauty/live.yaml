ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'K-beauty searches keep growing as

    Korean skincare goes global'
  date: C Lately.
  expl: Korean skincare brands won fans on TikTok with gentle formulas, light sunscreens and low prices. US and European shoppers piled in, Korea's cosmetics
    exports hit a record, and more people went searching for K-beauty.
  term: k beauty
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/k-beauty/k-beauty.csv
