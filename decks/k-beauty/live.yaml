ed148p:
  title: 'What pushed K-beauty

    forward, year after year?'
  events:
  - year: '1954'
    text: Amorepacific lab upgrades Korean skincare
    impact: 1.5
  - year: '1964'
    text: Korean cosmetics reach first export customers
    impact: 1.5
  - year: '1966'
    text: Ginseng cream creates local ingredient edge
    impact: 1.5
  - year: '1994'
    text: Laneige expands modern Korean skincare
    impact: 1.0
  - year: '1995'
    text: Etude makes makeup playful and accessible
    impact: 1.0
  - year: '1997'
    text: Sulwhasoo makes heritage premium skincare
    impact: 1.5
  - year: '2000'
    text: Innisfree makes Jeju ingredients marketable
    impact: 1.0
  - year: '2002'
    text: Road shops undercut premium cosmetics
    impact: 1.5
  - year: '2003'
    text: Korean dramas carry beauty trends abroad
    impact: 2.0
  - year: '2006'
    text: Hanskin BB creams simplify daily makeup
    impact: 2.0
  - year: '2007'
    text: Missha makes affordable BB cream mainstream
    impact: 2.0
  - year: '2008'
    text: IOPE cushion makes foundation portable
    impact: 2.5
  - year: '2011'
    text: Sephora introduces Dr Jart to Americans
    impact: 2.5
  - year: '2012'
    text: US BB cream sales validate demand
    impact: 1.5
  - year: '2014'
    text: Target brings Laneige to mass retail
    impact: 2.0
  - year: '2015'
    text: Amazon gives K-beauty its own aisle
    impact: 2.0
  - year: '2016'
    text: Multistep skincare drives repeat product use
    impact: 1.5
  - year: '2017'
    text: Cosmetic exports near five billion dollars
    impact: 1.5
  - year: '2019'
    text: Estée Lauder buys Dr Jart parent
    impact: 2.0
  - year: '2020'
    text: Pandemic ecommerce widens K-beauty reach
    impact: 1.5
  - year: '2021'
    text: Korean beauty exports set new record
    impact: 2.0
  - year: '2022'
    text: China slowdown forces wider export search
    impact: 1.5
  - year: '2023'
    text: Exports rebound as markets diversify
    impact: 1.5
  - year: '2024'
    text: Exports exceed ten billion dollars
    impact: 2.5
  - year: '2024'
    text: Korea tops US cosmetics import sources
    impact: 2.5
  - year: '2025'
    text: US overtakes China as export market
    impact: 2.0
  - year: '2026'
    text: Sephora deal expands Korean brand access
    impact: 2.0
  - year: '2026'
    text: Olive Young opens first US storefront
    impact: 2.0
  - year: '2026'
    text: Olive Young opens second California store
    impact: 1.5
  - year: '2026'
    text: Sephora stocks nineteen Korean brands
    impact: 2.0
  note:
  - We kept the events we believe pushed k beauty forward the most
  - Ratings are our estimates, with all the sources at the end of the report
