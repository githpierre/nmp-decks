- label: LOW-CARBON CEMENT
  type: pp_risks
  section: Market challenges
  title: What could go wrong for low-carbon cement?
  events:
  - text: EU lawmakers weaken CBAM cement charges, keeping imported high-clinker cement cheaper than cleaner domestic alternatives
    odds: 35
    impact: 3
  - text: Holcim and Heidelberg slow low-carbon plant spending as construction demand weakens across Europe and North America
    odds: 35
    impact: 3
  - text: Calcined-clay projects face local permit delays, limiting LC3 capacity additions in India, Africa and Southeast Asia
    odds: 30
    impact: 2
  - text: Cheap clinker from low-carbon-price countries undercuts premium cement, making builders resist switching on cost grounds
    odds: 45
    impact: 2
  - text: A major alternative-cement startup cancels a commercial plant after financing gaps, making lenders price the sector riskier
    odds: 30
    impact: 3
  - text: Standards bodies delay approvals for novel binders, preventing engineers from specifying them in structural concrete projects
    odds: 40
    impact: 2
  - text: Carbon-capture cement projects miss cost and uptime targets, pushing buyers back toward cheaper clinker-substitution options
    odds: 40
    impact: 2
  - text: Fly ash and slag supplies tighten faster than calcined clay scales, raising blended-cement costs and slowing substitution
    odds: 50
    impact: 2
  note:
  - We listed the events that could slow low-carbon cement down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and you will find all the sources we used at the end of the report
