  events:
  - text: Another Synapse-style middleware failure freezes customer funds, making banks and platforms retreat from embedded banking
    odds: 35
    impact: 3
  - text: FDIC recordkeeping rules force sponsor banks to reconcile end-user balances daily, raising BaaS compliance costs
    odds: 60
    impact: 2
  - text: Federal bank regulators cap or restrict high-risk fintech partnerships after more Evolve or Blue Ridge compliance failures
    odds: 45
    impact: 3
  - text: Platforms bring payments and lending infrastructure in-house, reducing demand for independent embedded-finance middleware
    odds: 40
    impact: 2
  - text: Consumers distrust embedded accounts after fund-access failures, pushing deposits back toward direct bank relationships
    odds: 40
    impact: 2
  - text: Sponsor banks demand higher reserves, audits and minimum volumes, making smaller embedded-finance programs uneconomic
    odds: 55
    impact: 2
  - text: Stablecoin wallets bypass bank-account and card programs for some platforms, weakening traditional BaaS revenue pools
    odds: 35
    impact: 2
  - text: A recession increases losses on embedded credit products, causing platforms to pause lending and tighten approval criteria
    odds: 45
    impact: 2
  note:
  - We listed the events that could slow embedded finance down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and you will find all the sources we used at the end of the report
