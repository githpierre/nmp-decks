ed052p:
  type: pp_cagr
  title: 'How much bigger can

    battery recycling get?'
  lead: ''
  condition: To get that big, collection volumes must rise with EV retirements and regulation must support closed-loop recovery economics for lithium, nickel,
    cobalt and lead.
  note:
  - We compared forecasts from Grand View Research, Fortune Business Insights and The Business Research Company
  - We adjusted each one to our definition of the market, and all the sources we used are listed at the end of the report
  size: 24
  cagr: 14
  y0: null
