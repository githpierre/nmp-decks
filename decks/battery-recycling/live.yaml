ed148p:
  title: 'What pushed the battery recycling

    market forward, year after year?'
  events:
  - year: '2006'
    text: EU battery rules formalize recycling
    impact: 1.5
  - year: '2017'
    text: Redwood targets closed-loop materials
    impact: 1.0
  - year: '2019'
    text: Redwood scales beyond startup mode
    impact: 1.0
  - year: '2020'
    text: Panasonic validates Redwood recycling
    impact: 1.5
  - year: '2020'
    text: EU proposes lifecycle battery regulation
    impact: 2.0
  - year: '2021'
    text: Redwood raises capital for scale
    impact: 1.5
  - year: '2021'
    text: Ford links recycling to battery supply
    impact: 1.5
  - year: '2021'
    text: Redwood adds cathode manufacturing plan
    impact: 2.0
  - year: '2022'
    text: Redwood expands into Europe
    impact: 1.0
  - year: '2022'
    text: Toyota commits end-of-life batteries
    impact: 1.5
  - year: '2022'
    text: Volkswagen builds US recycling pathway
    impact: 1.5
  - year: '2022'
    text: Dealer recycling reaches consumers
    impact: 1.0
  - year: '2022'
    text: Panasonic buys recycled cathode material
    impact: 2.0
  - year: '2022'
    text: Argonne validates recycled cathode quality
    impact: 2.0
  - year: '2023'
    text: DOE backs Redwood with $2B
    impact: 2.0
  - year: '2023'
    text: EU adopts new Batteries Regulation
    impact: 3.0
  - year: '2023'
    text: Redwood acquires German recycler Redux
    impact: 1.5
  - year: '2023'
    text: Redwood raises another billion
    impact: 1.5
  - year: '2024'
    text: DOE funds battery collection networks
    impact: 2.0
  - year: '2024'
    text: Ultium sends batteries to Redwood
    impact: 1.5
  - year: '2024'
    text: BMW closes recycling loop in US
    impact: 1.5
  - year: '2024'
    text: IEA elevates recycling for security
    impact: 2.0
  - year: '2025'
    text: EU recycling calculation rules take effect
    impact: 1.5
  - year: '2025'
    text: Redwood starts South Carolina recovery
    impact: 2.0
  - year: '2025'
    text: Redwood standardizes safer collection bins
    impact: 1.0
  - year: '2025'
    text: EV battery deployment keeps surging
    impact: 2.0
  - year: '2026'
    text: IEA documents patent boom in recycling
    impact: 2.5
  - year: '2026'
    text: EU keeps recovery targets unchanged
    impact: 2.0
  - year: '2026'
    text: US adds $500M supply-chain funding
    impact: 2.0
  - year: '2026'
    text: GM signs full-lifecycle Redwood partnership
    impact: 3.0
  note:
  - We kept the events we believe pushed battery recycling forward the most
  - Ratings are our estimates, with all the sources at the end of the report
