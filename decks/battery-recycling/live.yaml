ed007p:
  type: pp_radar
  title: 'Which companies really

    belong in battery recycling?'
  TL:
    name: RePurpose Energy
    src: ../../assets/logos/pp_live/battery-recycling/s01-00.png
    text: repurposes used EV batteries for stationary storage, extending life without materially recycling battery materials
  TR:
    name: CATL
    src: ../../assets/logos/pp_live/battery-recycling/s01-02.png
    text: primarily manufactures batteries and cells, even though affiliates and partners participate in recycling activities
  BL:
    name: Glencore
    src: ../../assets/logos/pp_live/battery-recycling/s01-09.png
    text: processes recycled battery materials within a much broader global mining, metals trading and smelting portfolio
  BR:
    name: Umicore
    src: ../../assets/logos/pp_live/battery-recycling/s01-10.png
    text: operates battery recycling and refining, but also has large catalyst and specialty-material businesses outside recycling
  caption:
  - Distance to the center reflects how central each company is to battery recycling
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
