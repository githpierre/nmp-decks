ed148p:
  title: 'What pushed the sales intelligence

    market forward, year after year?'
  events:
  - year: '1990'
    text: Digital contact databases replace Rolodexes
    impact: 1.5
  - year: '1995'
    text: CRM creates structured prospect records
    impact: 1.5
  - year: '2000'
    text: Web data expands company research
    impact: 1.0
  - year: '2003'
    text: LinkedIn centralizes professional identity
    impact: 3.0
  - year: '2007'
    text: APIs make enrichment programmable
    impact: 1.5
  - year: '2010'
    text: Cloud CRM drives enrichment demand
    impact: 1.5
  - year: '2012'
    text: Intent data enters B2B sales
    impact: 2.0
  - year: '2014'
    text: Clearbit modernizes API enrichment
    impact: 2.0
  - year: '2015'
    text: Apollo combines contacts and outreach
    impact: 1.5
  - year: '2016'
    text: Technographic data improves targeting
    impact: 1.5
  - year: '2017'
    text: Account based selling accelerates
    impact: 2.0
  - year: '2018'
    text: Anonymous intent gains adoption
    impact: 1.5
  - year: '2019'
    text: Relationship graphs guide warm outreach
    impact: 1.0
  - year: '2020'
    text: Remote selling raises data dependence
    impact: 2.0
  - year: '2021'
    text: Privacy changes force data quality focus
    impact: 1.5
  - year: '2022'
    text: Generative AI automates account research
    impact: 2.0
  - year: '2023'
    text: HubSpot buys Clearbit
    impact: 2.5
  - year: '2023'
    text: Sales teams demand unified signals
    impact: 1.5
  - year: '2024'
    text: ZoomInfo launches Copilot intelligence
    impact: 2.5
  - year: '2024'
    text: LinkedIn adds AI lead research
    impact: 2.0
  - year: '2024'
    text: 6sense passes major revenue milestone
    impact: 1.5
  - year: '2025'
    text: Apollo AI usage grows fivefold
    impact: 2.0
  - year: '2025'
    text: Clearbit free tools are retired
    impact: 1.0
  - year: '2025'
    text: Agentic GTM combines data and action
    impact: 2.0
  - year: '2026'
    text: Apollo launches end to end AI assistant
    impact: 2.0
  - year: '2026'
    text: Apollo acquires Pocus
    impact: 1.5
  - year: '2026'
    text: Apollo plugs data into sales agents
    impact: 2.0
  - year: '2026'
    text: AI native intelligence wins buyer mindshare
    impact: 1.5
  - year: '2026'
    text: Data quality becomes AI bottleneck
    impact: 1.5
  - year: '2026'
    text: Intent feeds become orchestration inputs
    impact: 1.5
  note:
  - We kept the events we believe pushed sales intelligence forward the most
  - Ratings are our estimates, with all the sources at the end of the report
