ed007p:
  type: pp_radar
  title: 'Who Is in sales intelligence,

    and who stays outside?'
  TL:
    name: Outreach
    src: ../../assets/logos/pp_live/sales-intelligence/s01-00.png
    text: executes outbound sequences and sales workflows, but prospect data is not the main product buyers purchase it for
  TR:
    name: LinkedIn
    src: ../../assets/logos/pp_live/sales-intelligence/s01-02.png
    text: professional network supplies useful profiles, but the core business is not a dedicated sales intelligence database
  BL:
    name: HubSpot
    src: ../../assets/logos/pp_live/sales-intelligence/s01-09.png
    text: provides prospecting and enrichment inside a broad CRM suite, while most of the platform serves other workflows
  BR:
    name: Clay
    src: ../../assets/logos/pp_live/sales-intelligence/s01-10.png
    text: combines enrichment data with workflow automation, so only part of its value proposition is sales intelligence
  caption:
  - Distance to the center reflects how central each company is to sales intelligence
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
  - ../../assets/logos/pp_live/sales-intelligence/s01-01.png
