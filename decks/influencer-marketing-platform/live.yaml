ed148p:
  title: 'What pushed the influencer marketing

    market forward, year after year?'
  events:
  - year: '2005'
    text: YouTube scales independent creator audiences
    impact: 2.0
  - year: '2007'
    text: Facebook pages organize brand communities
    impact: 1.5
  - year: '2009'
    text: FTC formalizes social endorsement disclosure
    impact: 2.5
  - year: '2010'
    text: Instagram makes visual creators discoverable
    impact: 2.0
  - year: '2012'
    text: Brands scale sponsored social posts
    impact: 1.5
  - year: '2013'
    text: Agencies professionalize influencer campaigns
    impact: 1.5
  - year: '2014'
    text: Instagram analytics improve measurement
    impact: 1.5
  - year: '2015'
    text: Ad blockers push native creator ads
    impact: 2.0
  - year: '2016'
    text: Stories increase sponsored content frequency
    impact: 1.5
  - year: '2017'
    text: FTC warns influencers on disclosures
    impact: 2.0
  - year: '2018'
    text: Micro-influencers widen creator supply
    impact: 1.5
  - year: '2019'
    text: FTC issues influencer disclosure guide
    impact: 2.0
  - year: '2019'
    text: TikTok accelerates short-video creator growth
    impact: 2.0
  - year: '2020'
    text: Covid shifts brand spend online
    impact: 2.5
  - year: '2020'
    text: Livestream commerce links creators to sales
    impact: 2.0
  - year: '2021'
    text: Creator funds legitimize full-time influence
    impact: 1.5
  - year: '2021'
    text: Affiliate tools connect content to purchases
    impact: 2.0
  - year: '2022'
    text: Instagram launches creator marketplace tests
    impact: 2.0
  - year: '2022'
    text: Brands adopt always-on creator programs
    impact: 1.5
  - year: '2023'
    text: FTC updates endorsement guides
    impact: 3.0
  - year: '2023'
    text: TikTok Shop expands creator affiliates
    impact: 2.0
  - year: '2024'
    text: Instagram expands creator marketplace
    impact: 2.0
  - year: '2024'
    text: Meta tests creator matching with ML
    impact: 1.5
  - year: '2024'
    text: Partnership ads scale creator amplification
    impact: 1.5
  - year: '2025'
    text: Creator commerce becomes budget line
    impact: 1.5
  - year: '2025'
    text: AI improves creator discovery workflows
    impact: 1.5
  - year: '2026'
    text: TikTok lowers some creator entry barriers
    impact: 1.5
  - year: '2026'
    text: TikTok standardizes creator eligibility
    impact: 1.5
  - year: '2026'
    text: Creator Center unifies affiliate workflows
    impact: 2.0
  - year: '2026'
    text: Creator marketplaces deepen commerce
    impact: 2.0
  note:
  - We kept the events we believe pushed influencer marketing platform forward the most
  - Ratings are our estimates, with all the sources at the end of the report
