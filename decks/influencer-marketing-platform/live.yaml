ed007p:
  type: pp_radar
  title: 'Which companies really belong

    in influencer marketing?'
  TL:
    name: Hootsuite
    src: ../../assets/logos/pp_live/influencer-marketing-platform/s01-00.png
    text: social media management covers publishing and analytics, not end to end influencer relationship workflows
  TR:
    name: Meta
    src: ../../assets/logos/pp_live/influencer-marketing-platform/s01-02.png
    text: owns social networks where creators operate, but it is not primarily a brand influencer campaign platform
  BL:
    name: LTK
    src: ../../assets/logos/pp_live/influencer-marketing-platform/s01-09.png
    text: runs creator commerce and brand campaigns, while a large part of the business is consumer shopping and creator monetization
  BR:
    name: ''
    src: ../../assets/logos/pp_live/influencer-marketing-platform/s01-10.png
    text: impact.com creator partnerships sit inside a broader partnership and affiliate management suite with other revenue lines
  caption:
  - 'Distance to the center reflects how central each company is to influencer marketin:'
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
