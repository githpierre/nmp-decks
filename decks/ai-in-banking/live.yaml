ed148p:
  title: 'What pushed AI in banking

    forward, year after year?'
  events:
  - year: '1992'
    text: Falcon neural networks catch card fraud
    impact: 2.5
  - year: '2006'
    text: SHAZAM adopts neural-network fraud screening
    impact: 1.5
  - year: '2018'
    text: Bank of America launches AI assistant
    impact: 2.5
  - year: '2018'
    text: Erica adds proactive financial alerts
    impact: 1.5
  - year: '2019'
    text: Erica processes fifty million requests
    impact: 1.5
  - year: '2019'
    text: Erica reaches ten million users
    impact: 1.5
  - year: '2020'
    text: Erica adapts to pandemic banking questions
    impact: 1.0
  - year: '2020'
    text: Erica extends into wealth management
    impact: 1.5
  - year: '2020'
    text: BankerAssist brings AI to bankers
    impact: 1.5
  - year: '2021'
    text: Erica exceeds 430 million interactions
    impact: 1.5
  - year: '2022'
    text: Erica passes one billion interactions
    impact: 2.0
  - year: '2022'
    text: Erica integrates bank servicing chat
    impact: 1.0
  - year: '2022'
    text: UK finance firms report majority AI use
    impact: 1.5
  - year: '2023'
    text: Erica crosses 1.5 billion interactions
    impact: 1.5
  - year: '2023'
    text: Erica enters corporate treasury chat
    impact: 1.5
  - year: '2024'
    text: Mastercard launches next-generation fraud AI
    impact: 2.5
  - year: '2024'
    text: EU classifies credit scoring AI high-risk
    impact: 2.5
  - year: '2024'
    text: Erica helps bank customers discover products
    impact: 1.0
  - year: '2024'
    text: Erica exceeds two billion interactions
    impact: 2.0
  - year: '2024'
    text: Three-quarters of UK finance uses AI
    impact: 1.5
  - year: '2025'
    text: Erica surpasses three billion interactions
    impact: 2.0
  - year: '2025'
    text: US watchdog flags AI lending bias
    impact: 1.5
  - year: '2025'
    text: EBA maps EU banking AI obligations
    impact: 1.5
  - year: '2026'
    text: Citi launches platform for internal agents
    impact: 2.5
  - year: '2026'
    text: Fed describes generative AI fraud defense
    impact: 1.5
  - year: '2026'
    text: EBA assesses bank AI governance exposures
    impact: 1.0
  - year: '2026'
    text: FCA reviews AI in consumer finance
    impact: 1.5
  - year: '2026'
    text: UK finance AI adoption reaches 86%
    impact: 2.0
  - year: '2026'
    text: Starling trains sovereign banking AI model
    impact: 1.5
  - year: '2026'
    text: Banks embrace decision-support AI agents
    impact: 2.0
  note:
  - We kept the events we believe pushed ai in banking forward the most
  - Ratings are our estimates, with all the sources at the end of the report
