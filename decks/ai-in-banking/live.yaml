ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More people look up AI banking

    as banks put AI In every app'
  date: Lately.
  expl: Banks rolled out AI assistants for customers and AI tools for their own staff. JPMorgan gave its AI suite to most of its employees, and people went
    looking for what AI banking means for their money.
  term: ai in banking
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/ai-in-banking/ai-in-banking.csv
ed052p:
  type: pp_cagr
  title: 'How much room is left

    for AI in banking to grow?'
  lead: 'To fill that room, '
  condition: the market must get bank AI past model risk and regulator review into lending, fraud and service at scale, and prove that it cuts costs at
    mid-size banks and credit unions, not only at the top ten.
  note:
  - We compared forecasts from The Business Research Company, MRER, Straits and Grand View
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: 31
  cagr: 19
  y0: 2026
