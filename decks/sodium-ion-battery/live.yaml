ed148p:
  title: 'What pushed the sodium-ion battery

    market forward, year after year?'
  events:
  - year: '1980'
    text: Sodium research establishes rechargeable chem
    impact: 1.5
  - year: '2009'
    text: Aquion launches aqueous sodium battery
    impact: 1.0
  - year: '2011'
    text: Faradion starts commercial sodium-ion push
    impact: 1.0
  - year: '2012'
    text: Natron develops Prussian-blue chemistry
    impact: 3.0
  - year: '2015'
    text: First 18650 sodium cell demonstrated
    impact: 1.0
  - year: '2015'
    text: Faradion tests sodium electric bicycle
    impact: 1.0
  - year: '2016'
    text: Pilot cells prove larger formats
    impact: 1.5
  - year: '2017'
    text: HiNa enters sodium-ion commercialization
    impact: 1.0
  - year: '2017'
    text: Tiamat advances polyanion sodium cells
    impact: 1.0
  - year: '2018'
    text: More Chinese firms enter sodium-ion
    impact: 1.5
  - year: '2019'
    text: China launches sodium storage pilot
    impact: 2.0
  - year: '2020'
    text: Lithium price volatility renews interest
    impact: 1.0
  - year: '2021'
    text: CATL unveils first sodium-ion generation
    impact: 1.5
  - year: '2021'
    text: Megawatt sodium microgrid proves scale
    impact: 1.0
  - year: '2022'
    text: Reliance acquires Faradion
    impact: 1.0
  - year: '2022'
    text: Stationary sodium storage reaches Australia
    impact: 2.0
  - year: '2023'
    text: HiNa powers first sodium EV
    impact: 1.0
  - year: '2023'
    text: JAC commercializes sodium-ion vehicle
    impact: 1.0
  - year: '2024'
    text: BYD starts sodium-ion plant construction
    impact: 1.5
  - year: '2024'
    text: Natron opens US production capacity
    impact: 3.0
  - year: '2024'
    text: Grid storage interest broadens demand
    impact: 1.0
  - year: '2025'
    text: HiNa targets commercial vehicle batteries
    impact: 1.5
  - year: '2025'
    text: Lithium supply concerns support alternatives
    impact: 2.0
  - year: '2025'
    text: Hard-carbon supply chain expands
    impact: 1.0
  - year: '2026'
    text: CATL begins broader sodium deployment
    impact: 1.5
  - year: '2026'
    text: Sodium targets storage and mobility
    impact: 2.0
  - year: '2026'
    text: Second-generation cells improve competitivene
    impact: 1.0
  - year: '2026'
    text: IEA highlights commercialization momentum
    impact: 3.0
  - year: '2026'
    text: Manufacturing scale starts accelerating
    impact: 1.0
  - year: '2026'
    text: Low-cost materials support diversification
    impact: 1.0
  note:
  - We kept the events we believe pushed sodium ion battery forward the most
  - Ratings are our estimates, with all the sources at the end of the report
ed168p:
  handle: sodium-ion-battery
  title: 'Where did sodium-ion battery investors

    put their money this past year?'
  note:
  - We added up every equity round of sodium ion battery startups in our tracker over the last twelve months
  - by category of our market definition, and rounds with no public amount count as zero here
