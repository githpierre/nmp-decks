ed148p:
  title: 'What pushed the maritime decarbonization

    market forward, year after year?'
  events:
  - year: '1997'
    text: IMO gets formal shipping CO2 mandate
    impact: 1.0
  - year: '2003'
    text: IMO formalizes greenhouse gas policy
    impact: 1.0
  - year: '2008'
    text: IMO sets emissions baseline year
    impact: 1.0
  - year: '2011'
    text: IMO mandates EEDI and SEEMP
    impact: 3.0
  - year: '2013'
    text: EEDI enters force worldwide
    impact: 2.0
  - year: '2015'
    text: Paris deal intensifies shipping scrutiny
    impact: 1.0
  - year: '2016'
    text: IMO requires fuel-use data reporting
    impact: 1.5
  - year: '2017'
    text: Battery ferries prove electric operation
    impact: 1.0
  - year: '2018'
    text: IMO adopts first GHG strategy
    impact: 3.0
  - year: '2019'
    text: Poseidon-style finance links emissions
    impact: 1.5
  - year: '2019'
    text: Fuel data becomes globally comparable
    impact: 1.0
  - year: '2020'
    text: Sulfur cap accelerates fleet upgrades
    impact: 1.0
  - year: '2020'
    text: EEDI phase two tightens design
    impact: 1.5
  - year: '2021'
    text: IMO adopts EEXI and CII
    impact: 2.0
  - year: '2021'
    text: Maersk orders methanol feeder
    impact: 2.0
  - year: '2022'
    text: EEXI preparations drive retrofit demand
    impact: 1.5
  - year: '2022'
    text: Wind-assist returns to commercial shipping
    impact: 1.0
  - year: '2023'
    text: EEXI and CII start applying
    impact: 2.0
  - year: '2023'
    text: IMO raises ambition to net zero
    impact: 3.0
  - year: '2023'
    text: Laura Maersk proves green methanol
    impact: 2.0
  - year: '2024'
    text: EU ETS starts charging ship carbon
    impact: 2.0
  - year: '2024'
    text: Methanol orderbook expands rapidly
    impact: 1.5
  - year: '2024'
    text: Onboard carbon capture trials expand
    impact: 1.0
  - year: '2025'
    text: FuelEU Maritime starts penalties
    impact: 2.0
  - year: '2025'
    text: IMO approves Net-Zero Framework
    impact: 2.0
  - year: '2025'
    text: Green methanol enters larger fleets
    impact: 1.5
  - year: '2026'
    text: EU ETS adds methane and nitrous oxide
    impact: 2.0
  - year: '2026'
    text: IMO resumes net-zero framework talks
    impact: 2.0
  - year: '2026'
    text: India drafts green shipping policy
    impact: 1.5
  - year: '2026'
    text: Efficiency data shows zero-rated fuel gains
    impact: 1.5
  note:
  - We kept the events we believe pushed maritime decarbonization forward the most
  - Ratings are our estimates, with all the sources at the end of the report
ed168p:
  handle: maritime-decarbonization
  title: 'Where did maritime decarbonization

    investors put their money this past year?'
  note:
  - We added up every equity round of maritime decarbonization startups in our tracker over the last twelve months
  - by category of our market definition, and rounds with no public amount count as zero here
