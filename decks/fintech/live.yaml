ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people look

    for ways to pay less in bank fees'
  date: Lately.
  expl: With prices still high, people started checking every fee on their bank statement. Neobanks like Revolut, Nubank and Chime advertised zero fees,
    and switching banks became as easy as downloading an app. More and more people searched how to pay less to their bank.
  term: fintech
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/fintech/fintech.csv
ed052p:
  type: pp_cagr
  title: 'How much room is left

    for this market to grow?'
  lead: 'To fill that room, '
  condition: fintechs must win more of the profit pool of banks, with people and companies moving their main accounts, loans, and savings to apps. They
    must also keep fraud and credit losses low and stay profitable as rates fall and new rules on data and stablecoins arrive.
  note:
  - We compared forecasts from Fortune Business Insights, Mordor, IMARC and McKinsey and adjusted each one to our market
  - We then built a realistic range from these forecasts, and you will find all the sources we used at the end of the report
  size: 575
  cagr: 16
  y0: 2026
