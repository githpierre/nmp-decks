ed142p:
  title: 'What are the biggest

    threats to fintech?'
  events:
  - odds: 45
    impact: 2
    text: Deepfakes and fake identities fuel a wave of instant payment fraud that hits fintech balance sheets
  - odds: 40
    impact: 2
    text: Falling interest rates cut the deposit income that Robinhood, Nubank and neobanks rely on for profit
  - odds: 35
    impact: 2
    text: JPMorgan and other banks copy instant transfers, slick apps and free accounts, slowing neobank growth
  - odds: 25
    impact: 3
    text: A recession drives credit losses up fast at Affirm, Klarna and SoFi, cutting fintech lending revenue
  - odds: 25
    impact: 2
    text: Regulators force fintechs to meet bank-like capital and compliance rules, raising costs for smaller players
  - odds: 15
    impact: 2
    text: AI agents from OpenAI and Google choose financial products for users, so fintech brands lose direct customers
  - odds: 10
    impact: 3
    text: A major hack at a leading fintech like Revolut or Chime drains accounts and destroys customer trust
  - odds: 10
    impact: 2
    text: Partner banks exit after another Synapse-style collapse, freezing customer funds at smaller fintech apps
  note:
  - We listed the events that could slow fintech down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
