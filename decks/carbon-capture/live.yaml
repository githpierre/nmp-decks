ed142p:
  title: 'What could go wrong

    for carbon capture?'
  events:
  - odds: 50
    impact: 2
    text: Direct air capture costs stay above $500 per ton, far from the $100 target buyers want
  - odds: 40
    impact: 3
    text: Microsoft extends its 80% cut in carbon removal purchases, leaving direct air capture startups without offtake
  - odds: 40
    impact: 2
    text: The DOE formally cancels the stalled Project Cypress and South Texas DAC hubs, stranding Climeworks and Heirloom
  - odds: 35
    impact: 1
    text: Oil majors like ExxonMobil and Occidental dominate capture hubs, squeezing out independent startups
  - odds: 30
    impact: 2
    text: The EU delays counting removals in its ETS, so European demand for credits grows slower than hoped
  - odds: 12
    impact: 3
    text: A CO2 pipeline rupture like Satartia sickens residents and states block new pipelines from Summit Carbon
  - odds: 10
    impact: 3
    text: Congress cuts or narrows the 45Q tax credit, wrecking the economics of US capture projects
  - odds: 8
    impact: 2
    text: An investigation shows a stored CO2 site leaking, and buyers question permanence of geologic storage
  note:
  - We listed the events that could slow carbon capture down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
