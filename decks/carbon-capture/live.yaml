ed007p:
  type: pp_radar
  title: 'What is actually included

    in the carbon capture market?'
  TL:
    name: Frontier
    src: ../../assets/logos/pp_live/carbon-capture/s01-00.png
    text: pools buyers like Stripe and Google to fund permanent carbon removal, but as a buyer it captures and stores no CO? itself
  TR:
    name: Sweep
    src: ../../assets/logos/pp_live/carbon-capture/s01-01.png
    text: helps companies measure and report their emissions with carbon accounting software, but it never captures or stores CO2
  BL:
    name: Heidelberg Materials
    src: ../../assets/logos/pp_live/carbon-capture/s01-09.png
    text: opened the first full-scale carbon capture plant at a cement works, but cement is still its core business
  BR:
    name: Linde
    src: ../../assets/logos/pp_live/carbon-capture/s01-10.png
    text: builds capture, purification and liquefaction units for CO2, but they are a small part of a giant industrial gases business
  caption:
  - Distance to the center reflects how directly a company captures, transports, uses or permanently stores CO2 as its main business
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
  - ../../assets/logos/pp_live/carbon-capture/s01-02.png
