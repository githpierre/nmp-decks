ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people look up carbon

    credits, as new rules clean up the market'
  date: In recent months.
  expl: Carbon credits had a bad reputation after scandals over fake forest projects. Then new rules cleaned up the market, big tech companies like Microsoft
    bought record amounts of carbon removal, and countries started trading credits under the Paris deal. People came back to understand how it works.
  term: carbon capture
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/carbon-capture/carbon-capture.csv
