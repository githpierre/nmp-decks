    text: Diagnostics software enters maintenance
    impact: 1.0
  - year: '1995'
    text: Databases connect failures with history
    impact: 1.0
  - year: '2000'
    text: CMMS links work orders to assets
    impact: 1.0
  - year: '2003'
    text: Wireless sensors reduce monitoring cost
    impact: 1.0
  - year: '2006'
    text: Industrial Ethernet expands data access
    impact: 1.0
