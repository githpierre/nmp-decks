    text: Digital twins connect models to assets
    impact: 1.5
  - year: '2018'
    text: Edge analytics cuts alert latency
    impact: 1.0
  - year: '2019'
    text: Industrial AI enters reliability workflows
    impact: 1.5
  - year: '2020'
    text: Covid exposes maintenance staffing risk
    impact: 1.5
  - year: '2021'
    text: Remote monitoring becomes normal practice
    impact: 1.0
  - year: '2022'
    text: Siemens acquires Senseye
    impact: 2.5
  - year: '2023'
    text: Generative AI enters maintenance support
    impact: 1.0
  - year: '2024'
    text: Prescriptive maintenance gains attention
    impact: 1.0
  - year: '2025'
    text: Industrial AI shifts from pilots to scale
    impact: 1.5
  - year: '2025'
    text: Connected reliability links alerts and CMMS
    impact: 1.5
  - year: '2026'
    text: Predictive maintenance leads industrial AI
    impact: 3.0
  - year: '2026'
    text: Rockwell and Augury connect action
    impact: 2.0
  - year: '2026'
    text: IBM reframes maintenance around trusted AI
    impact: 1.5
  - year: '2026'
    text: AI investment rises across manufacturers
    impact: 1.0
  note:
  - We kept the events we believe pushed predictive maintenance forward the most
  - Ratings are our estimates, with all the sources at the end of the report
