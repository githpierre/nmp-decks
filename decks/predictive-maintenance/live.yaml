ed007p:
  type: pp_radar
  title: 'Which companies really belong

    in predictive maintenance?'
  TL:
    name: MaintainX
    src: ../../assets/logos/pp_live/predictive-maintenance/s01-00.png
    text: manages maintenance work and schedules, but predictive failure sensing is not the core of its product
  TR:
    name: ServiceNow
    src: ../../assets/logos/pp_live/predictive-maintenance/s01-02.png
    text: manages enterprise ~~ workflows and assets, but it does not primarily assess machine condition or failure risk
  BL:
    name: ABB
    src: ../../assets/logos/pp_live/predictive-maintenance/s01-09.png
    text: offers predictive maintenance tools, but most revenue comes from broader electrification and automation
  BR:
    name: ''
    src: ../../assets/logos/pp_live/predictive-maintenance/s01-10.png
    text: ': a . Siemens sells predictive maintenance tools, but they are one part of a much broader automation and software portfolio'
  caption:
  - Distance to the center reflects how central each company is to predictive maintenance
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
