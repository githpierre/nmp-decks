- label: PREDICTION MARKETS
  type: pp_risks
  section: Market challenges
  title: What are the biggest threats to the prediction markets industry?
  events:
  - text: More US states win court orders treating sports event contracts as gambling, forcing Kalshi and Polymarket to geofence
    odds: 50
    impact: 3
  - text: The Supreme Court limits federal preemption for prediction markets, exposing national platforms to many state gaming rules
    odds: 35
    impact: 3
  - text: The CFTC adopts tighter event contract rules that restrict sports or election markets, cutting the largest volume categories
    odds: 35
    impact: 3
  - text: A manipulation scandal in a thin political market triggers congressional scrutiny and tighter surveillance requirements
    odds: 30
    impact: 2
  - text: Sports leagues secure stronger rights over event data and trademarks, raising costs for exchanges listing game contracts
    odds: 35
    impact: 2
  - text: A large payout dispute or platform outage during a major event weakens retail trust in Kalshi or Polymarket settlement
    odds: 25
    impact: 2
  - text: Traditional sportsbooks copy exchange style contracts and promotions, pulling casual sports traders from prediction markets
    odds: 45
    impact: 1
  - text: Election interest falls after 2026 and sports rules tighten, leaving platforms dependent on smaller economic niche contracts
    odds: 40
    impact: 2
  note:
  - We listed the events that could slow prediction markets down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and you will find all the sources we used at the end of the report
