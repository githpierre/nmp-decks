ed007p:
  type: pp_radar
  title: 'Who Is in AI medical scribe,

    and who stays outside?'
  TL:
    name: Fathom
    src: ../../assets/logos/pp_live/ai-medical-scribe/s01-00.png
    text: it uses AI to code completed clinical records, but it does not primarily turn live patient conversations into clinician
  TR:
    name: Otter.ai
    src: ../../assets/logos/pp_live/ai-medical-scribe/s01-02.png
    text: it transcribes meetings and conversations in general, but it lacks healthcare specific medical documentation and EHR
  BL:
    name: Commure
    src: ../../assets/logos/pp_live/ai-medical-scribe/s01-09.png
    text: its ambient scribe sits within a broader healthcare operations platform that also spans workflow, safety and revenue
  BR:
    name: Corti
    src: ../../assets/logos/pp_live/ai-medical-scribe/s01-10.png
    text: it combines documentation with real time clinical intelligence, so scribing is one function inside a wider assistant
  caption:
  - Distance to the center reflects how central each company is to AI medical scribe
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
