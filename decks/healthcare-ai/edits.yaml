  3: 'JAMA, OpenEvidence

    use study'
  4: An independent study of account logs, not a company claim, on how many clinicians use the tool
  5: We used it for the 703,265 monthly users and the 39.5 questions per clinician. It anchors our view of real use.
  7: 'AMA, physician

    AI survey'
  8: The yearly survey of US physicians by their main professional body, released in March 2026
  9: We used it for the 81% of physicians who use AI. It also gave us what doctors ask for before they trust a tool.
  10: 'FDA, list of

    AI devices'
  11: The regulator’s own list of the AI-enabled medical devices it has authorized in the United States
  12: We used it for the count of more than 1,600 devices. It also frames what is regulated and what is not.
  13: 'FDA, decision

    support guidance'
  14: The January 2026 guidance that says when clinical software counts as a medical device
  15: We used it for the regulation timeline. It also explains the path of a tool into a hospital.
  16: 'KLAS, healthcare

    AI update'
  17: Buyer research on which AI use cases health systems adopt first, from interviews with their leaders
  18: We used it for what buyers ask before scaling. It also backed our view that low-risk tasks come first.
