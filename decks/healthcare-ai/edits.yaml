  5: We used it for the $1.4B spent in 2025. It also dated the moment when the market became hot.
  7: 'JAMA Network Open,

    ambient AI study'
  8: A peer-reviewed study of 1,547 clinicians who use AI scribes in daily practice
  9: We used it for the measured time saved on notes. It keeps vendor claims and measured results apart.
  10: 'JAMA Network Open,

    burnout study'
  11: A study of 263 clinicians in six health systems, before and after 30 days with an AI scribe
  12: We used it for the fall in burnout from 51.9% to 38.8%. It supports our growth drivers.
  13: 'UPMC and KLAS,

    AI governance'
  14: A 2026 survey of health systems on how they test, govern and measure AI tools
  15: We used it for the gaps in testing and governance. It also showed that 90% of systems already use outside AI.
  16: 'BMC, AI scribe

    trial'
  17: A hospital trial in Australia where staff reported how often AI notes contained made-up facts
  18: We used it for the 47% of staff who saw invented facts. It anchors our slide on patient risks.
