# myths: answers 20-25% fuller
ed015:
  7: "The AMA's 2026 survey found 81% of US physicians use AI at work. Permanente doctors alone logged 2.5M AI-aided visits."
  10: "A five-center study found modest cuts in note time, not hours saved every day. Gains depend on the specialty and on daily use."
  13: "FDA rules cover AI that acts like a medical device, such as scan readers. Its list is not a directory of all clinical software."
  16: "Payer AI can approve simple requests on its own, but Cohere Health sends every other case to a clinician for the final call."
ed016:
  7: "AI answers doctors' questions, writes clinical notes, codes bills and helps design drugs. Imaging is only one of six segments."
  10: "The JAMA study measured how often doctors use OpenEvidence, not whether each answer was right or patients did better after."
  13: "AI-designed drugs such as Insilico's rentosertib have reached human trials, but a 2026 review found no approved one yet."
  16: "A 2026 NEJM AI paper found vendors keep patient data in different ways. Hospitals still need privacy rules and human review."
# truths that flipped: right boxes 10-15% fuller
ed023:
  8: Now it also supports evidence search, visit notes, coding and hospital billing
  12: Now more AI tools feed patient records and daily care workflows
  16: Now verified clinicians use it at scale for real patient care questions
  20: Now the FDA lists more than 1,600 authorized AI-enabled medical devices
  24: Now Permanente alone has measured millions of AI-assisted patient visits
  28: Now payer automation and drug discovery are core parts of the market
# dated rows 30-40% longer (one more concrete fact each)
ed092:
  14: Hospitals began linking ambient AI to patient records, so a recorded visit could become a draft note for the doctor to check.
  16: The FDA drafted lifecycle guidance asking AI device makers to track safety, bias and performance before and after launch.
  18: John Muir Health reported that more than 65% of its clinicians in 15 specialties were actively using Ambience, so the tool stuck.
  20: Cleveland Clinic rolled out AKASA's coding AI at all of its US sites, where it now handles medical coding for thousands of visits.
  22: UPMC took Abridge beyond its first pilot to thousands of clinicians across its hospitals, and plans wider access across the system.
  24: The FDA finalized guidance letting device makers plan AI model updates in advance, so tools can improve without a new review.
ed093:
  14: Cleveland Clinic reported more than 4,800 clinicians using Ambience across 3.5 million patient encounters, one of the largest rollouts.
  16: Aidoc reported one CARE-based triage workflow covering 11 new and three earlier FDA-cleared findings, instead of one tool per finding.
  18: Cohere Health said its clinical AI now supports 15 million care decisions a year for health plans reviewing prior authorization requests.
  20: Insilico Medicine dosed the first patient in a Phase 3 trial of rentosertib, a lung fibrosis drug found and designed with its AI.
  22: Recursion said Sanofi selected the first AI-assisted drug candidate from their joint research, a first step toward clinical testing.
  24: Abridge added local hospital care pathways to its assistant, so answers given during a visit link the patient's context to guidance.
