    na:
      name: NORTH AMERICA
      text: The US hosts Abridge, OpenEvidence, Hippocratic AI and Ambience, alongside hospital AI developers in imaging and billing.
    eu:
      name: EUROPE
      text: Europe has Corti in Denmark, which builds AI models for clinical work, and imaging AI firms such as Gleamer in France.
    apac:
      name: INDIA
      text: India is led by Qure.ai, whose imaging AI supports public lung screening.
    au:
      name: AUSTRALIA
      text: Australia produced Harrison.ai for clinical imaging and Heidi for AI notes, with Heidi now reporting global use.
