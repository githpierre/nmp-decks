iv_fda:
  7: 'FDA CHECK


    The vendor and the hospital legal team check whether the tool needs FDA authorization as a device.'
  8: 'SECURITY REVIEW


    Hospital security leaders review data access, vendor controls and patient privacy terms.'
  9: 'RECORD LINK


    IT teams test the link to Epic or Oracle Health and check that the tool fits daily work.'
  11: 'CLINICIAN PILOT


    Doctors and quality leaders test real notes, safety, time savings and user acceptance.'
  10: 'FULL CONTRACT


    Executives approve pricing and a system-wide rollout when pilot results justify it.'
iv_safety:
  7: 'BIASED RESULTS



    A review found skin-lesion AI scored 0.82 out of 1 on darker skin versus 0.89 on lighter skin, a gap that risks unequal care.'
  8: 'MISSED ALERTS



    An independent study found that a widely used sepsis score missed 67% of the patients who went on to develop sepsis.'
  9: 'OVERTRUST



    In a trial, doctors who were given false AI advice averaged 73.3% diagnostic accuracy, versus 84.9% for doctors without it.'
