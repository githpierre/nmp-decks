ed049:
  note:
  - We use the 2025 regional shares of Fortune Business Insights as a proxy, since they cover a wider scope
  - We round its five published shares to whole percentages and do not claim more precision than the source
  regions:
    na:
      pct: 45
      text: North America leads with about 45% of spending. The US has the biggest buyers, the main vendors and most of the funding.
    eu:
      pct: 28
      text: Europe comes second with about 28% of spending in 2025. Hospital AI and drug research both help to build demand across the region.
    apac:
      pct: 21
      text: Asia-Pacific holds about 21%, led by China, Japan and India, and should grow the fastest of all regions.
    latam:
      pct: 4
      text: Latin America holds about 4% of spending in 2025, about $1.6 billion. Brazil and Mexico are the two largest markets in the region.
    mea:
      pct: 2
      text: The Middle East and Africa account for about 2% of spending in 2025. Investments by Gulf states support interest in the region.
