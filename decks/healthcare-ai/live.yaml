ed142p:
  title: 'What could go wrong

    for healthcare AI?'
  events:
  - odds: 25
    impact: 3
    text: Epic and Microsoft bundle AI charting and scribes into their suites, squeezing independent healthcare AI startups
  - odds: 20
    impact: 2
    text: Seed and Series A funding for healthcare AI startups dries up as investors back a few leaders
  - odds: 20
    impact: 2
    text: Medicaid cuts force US hospitals to freeze software budgets, delaying AI purchases by a year
  - odds: 15
    impact: 3
    text: A chatbot gives a patient a seriously harmful medical answer and the case dominates national news coverage
  - odds: 12
    impact: 2
    text: Pharma partners cut AI drug discovery deals after several AI-designed drugs fail in Phase 2 trials
  - odds: 10
    impact: 3
    text: A US court holds an AI vendor fully liable for a misdiagnosis, raising insurance costs for startups
  - odds: 8
    impact: 2
    text: The FDA and HHS reverse course and require full premarket review for AI clinical decision support tools
  - odds: 5
    impact: 2
    text: A massive hospital data breach traced to an AI vendor makes health systems freeze new AI contracts
  note:
  - We listed the events that could slow healthcare AI down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
