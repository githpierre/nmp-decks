  link: 'ed132 « A demo is not clinical proof: hospitals must test accuracy on their own patients »'
  slide:
    id: xa_funnel
    type: sx_stat_strip
    section: Market challenges
    title: 'Only 9 of 161 published AI projects

      reached routine use in a health system'
    headline: How far 161 published AI projects for health systems got
    stats:
    - v: '161'
      l: Published studies of predictive AI for health-system planning
    - v: '22'
      l: Reached validation, a pilot or routine use
    - v: '9'
      l: Reported routine use, about one in eighteen
    story: 'Building a model is the easy part: most published projects stop before anyone tests them in real care. A startup that gets into daily use has done what few teams manage.'
    note:
    - We used a scoping review of 161 studies published in September 2026, which counts as the
    - most advanced stage 139 at development, 10 at validation, 3 at pilot and 9 in operation
