ed160:
  6: Life science AI took about 48% of the capital raised since 2024, far ahead of care workflow AI with about 17%
  7: 861 of the 901 rounds since 2024 disclosed an amount, and the median disclosed round was only $12M
  8: US startups closed 553 of the 901 rounds and took $22.2B, about 72% of the money, far ahead of the United Kingdom
  9: 68 rounds of $100M or more made up about 54% of all the capital raised in the market since 2024
  10: The $2.1B Series B of Isomorphic Labs is the biggest round since 2024, ahead of the $1B raised by Xaira Therapeutics in 2024
  11: Seed was the most common round, with 343 of the 901 rounds, ahead of Series A with 242 and Series B with 104
  note: We drew these insights from our tracker of 901 healthcare AI equity rounds announced since January 2024, worth about $30.8B
ed162:
  6: 'BEFORE



    Before 2024, the largest checks we track went to broad data and biology platforms such as Verily, Caris Life Sciences, insitro and XtalPi, most of them between 2019 and 2022.'
  7: 'AFTER



    Since 2024, 901 rounds raised $30.8B. Life science AI still takes the biggest checks, while tools for doctors such as Abridge and OpenEvidence raise round after round.'
  note: We used our tracker of healthcare AI equity rounds, complete from January 2024, and company releases and the press
