ed160:
  6: Life science AI took about 54% of the capital raised since 2024, far ahead of care workflow AI with about 19%
  7: 828 of the 847 rounds since 2024 disclosed an amount, and the median disclosed round was only $12M
  8: US startups closed 506 of the 847 rounds and took $20.4B, about 60% of the money, far ahead of the United Kingdom
  9: 66 rounds of $100M or more made up about 60% of all the capital raised in the market since 2024
  10: The $5B Series C of Isomorphic Labs is the biggest round since 2024, ahead of the $2.1B raised by Isomorphic Labs in 2026
  11: Seed was the most common round, with 324 of the 847 rounds, ahead of Series A with 240 and Series B with 102
  note: We drew these insights from our tracker of 847 healthcare AI equity rounds announced since January 2024, worth about $34.2B
ed162:
  6: 'BEFORE



    Before 2024, the largest checks we track went to broad data and biology platforms such as Verily, Caris Life Sciences, insitro and XtalPi, most of them between 2019 and 2022.'
  7: 'AFTER



    Since 2024, 847 rounds raised $34.2B. Life science AI still takes the biggest checks, while tools for doctors such as Abridge and OpenEvidence raise round after round.'
  note: We used our tracker of healthcare AI equity rounds, complete from January 2024, and company releases and the press
