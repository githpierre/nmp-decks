- id: ed023
  type: x/learning_truths_have_flipped
  section: Market definition
  title: Which healthcare AI truths have flipped?
  note: These are directional market shifts identified from recent clinical reports, company disclosures, and transactions. They are not formal industry rules, but they recur across the evidence.
  src: 23
  t:
    6: Healthcare AI used to be mostly a preclinical delivery concept
    8: Now several Phase 1 trials have made CAR cells inside patients
    10: Viral vectors used to dominate serious in vivo CAR discussions
    12: Now mRNA-LNP and circular RNA programs reach trials and buyouts
    14: CAR-T used to be framed mainly as a cancer treatment
    16: Now immune reset is a main goal for Capstan, Orna and Orbital
    18: Cell therapy once needed custom manufacturing per patient
    20: Now developers want CAR-T to be an off-the-shelf injection
    22: Early value used to sit in preclinical platform claims
    24: Now early human data moves fast, and buyouts follow it
    26: The market used to be led mainly by small independent biotechs
    28: Now big pharma owns or partners with the leading platforms
- id: ed024
  type: dated
  section: Market definition
  title: What has changed (very) recently?
  page: 1/2
  items:
  - d: SINCE 2024
    t: Umoja won FDA clearance for UB-VV111, a CD19 in situ CAR-T, moving its VivoVec platform from preclinical development into a human Phase 1 program.
  - d: SINCE 2024
    t: The first clinical evidence of lentiviral healthcare AI antitumor activity appeared, showing that direct CAR generation inside patients was no longer only a lab concept.
  - d: SINCE 2025
    t: AstraZeneca bought EsoBiotec for up to $1 billion after early clinical activity from its targeted lentiviral ENaBL platform put healthcare AI on big pharma radar screens.
  - d: SINCE 2025
    t: AbbVie agreed to buy Capstan for up to $2.1 billion, validating targeted RNA-LNP delivery as a strategic route for autoimmune healthcare AI.
  - d: SINCE 2025
    t: Kite agreed to buy Interius for $350 million, adding an integrating platform that creates CAR-T cells directly inside patients with one IV infusion.
  - d: SINCE 2025
    t: BMS agreed to buy Orbital for $1.5 billion, bringing circular RNA and targeted LNP delivery into the center of the healthcare AI race.
  note:
  - We kept the milestones that most changed clinical credibility, platform competition or ownership of the market
  - There is no official timeline, and another analyst could reasonably pick a few different milestones here
  src: 24
- id: ed025
  type: dated
  section: Market definition
  title: What has changed (very) recently?
  page: 2/2
  items:
  - d: SINCE 2025
    t: Early KLN-1010 data showed MRD-negative responses in multiple myeloma while generating CAR-T cells in vivo without preparative chemotherapy, strengthening the case for durable viral delivery.
  - d: SINCE 2025
    t: HN2301 early lupus data showed rapid CAR-T generation, B-cell depletion, and lower disease activity, giving targeted RNA-LNP healthcare AI its first autoimmune human proof point.
  - d: SINCE 2025
    t: CREATE Medicines reported first-in-human MT-302 data in solid tumors, extending in vivo CAR engineering beyond conventional T-cell blood-cancer programs.
  - d: SINCE 2026
    t: Lilly agreed to acquire Orna, bringing circular RNA plus LNP delivery and the ORN-252 autoimmune CAR-T program into a major pharmaceutical company.
  - d: SINCE 2026
    t: Lilly also agreed to acquire Kelonia after early KLN-1010 clinical data, adding an integrating lentiviral in vivo CAR platform to its genetic-medicine strategy.
  - d: SINCE 2026
    t: 'Longer ESO-T01 follow-up showed both the promise and the limits of the first wave: responses occurred, but persistence was limited and clinical data remain scarce.'
  note:
  - We kept the milestones that most changed clinical credibility, platform competition or ownership of the market
  - There is no official timeline, and another analyst could reasonably pick a few different milestones here
  src: 25
