  note: We used clinical milestones rather than discovery dates because they show when the enabling technology became usable in people.
  src: 91
  t:
    6: '2017 - 2020


      Academic teams showed that targeted viral particles could program CAR T cells directly in animals, establishing the core in vivo concept'
    7: '2021 - 2023


      Startups refined lentiviral, LNP, and fusosome delivery, while MT-302 reached patients as an RNA CAR for myeloid cells'
    8: '2024 - 2025


      Interius dosed INT2104, Umoja entered Phase 1, Capstan started CPTX2309, and large pharma began acquiring leading platforms'
    9: 'TODAY


      Multiple Phase 1 programs span cancer and autoimmunity, with early human responses reported for ESO-T01, KLN-1010, and HN2301'
    10: '?


      Next platforms may combine precise targeting, redosable RNA, durable gene placement, dual-target CARs and outpatient dosing'
