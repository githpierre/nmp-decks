- id: ed132
  type: x/newcomers_often_miss_here
  section: Market challenges
  title: What do newcomers often miss here?
  note: We compared independent clinical studies, FDA rules and health-system adoption reports. A useful demo alone does not establish safe, valuable routine care.
  src: 132
  t:
    17: 'A demo is not clinical proof: hospitals must test accuracy on their own patients'
    21: Most AI use tackles low-risk tasks, while diagnosis needs trials and oversight
    23: FDA clearance covers medical devices, not every AI tool used by hospitals
    25: AI notes need human review because fluent text may invent a drug or symptom
    28: Rollouts need patient-record links, security reviews and proof of financial gains
- id: xa_funnel
  type: sx_stat_strip
  section: Market challenges
  title: 'Only 9 of 161 published AI projects

    reached routine use in a health system'
  headline: How far 161 published AI projects for health systems got
  stats:
  - v: '161'
    l: Published studies of predictive AI for health-system planning
  - v: '22'
    l: Reached validation, a pilot or routine use
  - v: '9'
    l: Reported routine use, about one in eighteen
  story: 'Building a model is the easy part: most published projects stop before anyone tests them in real care. A startup that gets into daily use has done what few teams manage.'
  note:
  - We used a scoping review of 161 studies published in September 2026, which counts as the
  - most advanced stage 139 at development, 10 at validation, 3 at pilot and 9 in operation
- id: ed133
  type: x/has_held_back_market_growth
  section: Market challenges
  title: What has held back market growth so far?
  note: We grouped adoption into phases using published validation studies, KLAS buyer research, FDA policy and physician surveys. Phase boundaries are analytical.
  src: 133
