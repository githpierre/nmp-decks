- id: ed101
  type: x/s_commoditized_today_market
  section: Value creation
  title: What’s commoditized today in the market?
  note: We identified elements that are now broadly available or repeatedly used across CAR and gene-therapy development. They remain necessary, but differentiation is shifting toward targeting precision, safety, durability, manufacturability and clinical performance.
  src: 101
  t:
    6: CD19 and BCMA CAR designs, now validated across many CAR-T products and trials
    7: COMMON CAR TARGETS
    8: Standard lentiviral vector backbones, long used to insert CAR genes into T cells
    9: BASIC LVV DESIGN
    10: Generic LNP recipes and know-how, now widespread after years of RNA drugs
    11: GENERIC LNPs
    12: Routine mouse tumor models, used to show that engineered cells kill their targets
    13: MOUSE MODELS
    14: Standard Phase 1 dose escalation, now the default first step for in vivo programs
    15: PHASE 1 DESIGN
    16: Basic potency assays that measure cell killing before a program reaches patients
    17: KILLING ASSAYS
    18: Single-antigen CAR concepts against known B-cell targets, no longer enough to stand out
    19: SINGLE TARGETS
    20: Simple IV dosing claims, now common across the leading in vivo CAR programs
    21: IV DELIVERY
