- id: ed006
  type: definition
  section: Market definition
  title: What is the healthcare AI market, in simple terms?
  text: Healthcare AI is the market for medicines that deliver genetic instructions into a patient so their own immune cells become CAR cells inside the body
  note: We use a conversational definition here because it makes the boundary with conventional ex vivo CAR-T easier to understand.
  src: 6
  icon_tl: 🧬
