- id: ed015
  type: x/some_common_myths_about
  section: Market definition
  title: What are some common myths about healthcare AI?
  page: 1/2
  note: We compare common beliefs with physician surveys, measured deployment studies and FDA records. AI use does not establish clinical accuracy.
  src: 15
  t:
    0: AI already makes medical decisions by itself
    7: The AMA reports 81% physician awareness or use in 2026. Permanente doctors logged 2.5M AI-aided visits.
    9: Doctors do not really use AI in patient care
    10: A five-center study found modest reductions in documentation time, not universal hours a day. Results depend on use.
    12: AI scribes always save hours every day
    13: FDA rules apply to some medical AI tools. Its device list is not a directory of all clinical and billing software.
    15: Every healthcare AI product needs FDA clearance
    16: Payer AI can automate simple approvals, but Cohere says the other cases go to clinicians for final review.
    20: 🤥
    21: 🤥
    22: 🤥
    23: 🤥
- id: ed016
  type: x/some_common_myths_about_2
  section: Market definition
  title: What are some common myths about healthcare AI?
  page: 2/2
  note: We separate commercial usage, device authorization and clinical outcomes. Our examples do not imply that every AI model is equally reliable.
  src: 16
  t:
    0: Hospitals can skip privacy and oversight rules
    7: AI answers doctors’ questions, writes clinical notes and handles billing. Imaging is only one segment.
    9: Healthcare AI is only about scans
    10: The study measured medical AI usage, not the accuracy of each answer or improved patient outcomes.
    12: Fast answers guarantee better care
    13: AI drugs have entered clinical studies, but a 2026 review found no approved medicine discovered with AI.
    15: AI drugs are already approved
    16: A 2026 NEJM AI paper said vendors retain data differently. Hospitals still need privacy safeguards.
    20: 🤥
    21: 🤥
    22: 🤥
    23: 🤥
- id: ed017
  type: maturity
  section: Market definition
  title: How mature is healthcare AI as a market?
  score: 67
  text: The market has real buyers and widespread use in clinical notes, imaging and medical search. Maturity is not higher because results vary by task, and privacy, integration and oversight remain hard.
