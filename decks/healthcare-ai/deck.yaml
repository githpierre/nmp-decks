- id: ed024
  type: dated
  section: Market definition
  title: What has changed (very) recently?
  page: 1/2
  items:
  - d: SINCE 2023
    t: Abridge partnered with Epic to put AI-generated visit summaries inside clinicians’ existing patient-record workflows instead of keeping notes in a separate tool.
  - d: SINCE 2024
    t: The Permanente Medical Group began a large AI scribe rollout. A follow-up analysis counted more than 2.5 million assisted visits by December 2024.
  - d: SINCE 2025
    t: Menlo Ventures estimated $1.4B in US healthcare-specific generative AI spending for 2025, nearly triple the prior year, signaling enterprise purchasing.
  - d: SINCE 2025
    t: Abridge announced a $300M financing round and said it partnered with more than 150 health systems, making AI documentation a major enterprise software category.
  - d: SINCE 2025
    t: Ambience Healthcare raised $243M to expand clinical documentation and coding AI, reflecting investor interest beyond basic transcription of doctor visits.
  - d: SINCE 2025
    t: Rock Health analysis found AI-touting companies captured 54% of US digital health venture funding in 2025, compared with 37% the year before.
  note:
  - We selected recent milestones that changed health-system adoption, investor attention or practical clinical use.
  - We separate observed deployments from fundraises, which show financing rather than proven patient outcomes.
  src: 24
- id: ed025
  type: dated
  section: Market definition
  title: What has changed (very) recently?
  page: 2/2
  items:
  - d: SINCE 2026
    t: Aidoc announced FDA clearance for a combined image-triage workflow covering eleven new indications and three existing ones, extending diagnostic AI beyond single findings.
  - d: SINCE 2026
    t: The AMA survey reported awareness or use of AI among 81% of physicians, up from earlier waves, making clinician AI a mainstream purchasing question.
  - d: SINCE 2026
    t: Viz.ai reported deployment across 2,000 hospitals and approximately 230 million lives reached, showing that disease-alert workflows can extend widely.
  - d: SINCE 2026
    t: Twelve US health systems launched a diagnostic AI consortium with Aidoc to share evaluation and governance experience across enterprise deployments.
  - d: SINCE 2026
    t: A JAMA study counted 703,265 monthly active clinician users on OpenEvidence in June, demonstrating rapid use of AI for medical information retrieval.
  - d: SINCE 2026
    t: AstraZeneca agreed to collaborate with insitro on AI-led drug targets, committing $40M upfront with up to $1.46B in possible milestones.
  note:
  - We selected public, dated events with clinical, regulatory or strategic weight across the six categories
  - We report company deployment figures as claims unless an independent usage study backs them
  src: 25
