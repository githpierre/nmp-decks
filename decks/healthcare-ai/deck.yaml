- id: iv_safety
  type: x/pain_points_yesterday_vs_today
  section: Market challenges
  title: How can AI put patients at risk?
  note: We selected documented cases and measured studies rather than hypothetical harms. Study settings and tools differ, so rates are not market-wide averages.
  src: 54
  t:
    6: 'MADE-UP NOTES



      In an Australian hospital scribe trial, 47% of surveyed staff reported invented or incorrect facts in AI-generated notes.'
    7: 'BIASED RESULTS



      A review found skin-lesion AI scored 0.82 out of 1 on darker skin versus 0.89 on lighter skin, a gap that risks unequal care.'
    8: 'MISSED ALERTS



      An independent study found that a widely used sepsis score missed 67% of the patients who went on to develop sepsis.'
    9: 'OVERTRUST



      In a trial, doctors who were given false AI advice averaged 73.3% diagnostic accuracy, versus 84.9% for doctors without it.'
    10: 'DATA EXPOSURE



      Johns Hopkins notified about 3,182 patients after a worker sent a patient spreadsheet to an unapproved AI tool.'
