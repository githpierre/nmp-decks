- id: ed210
  left: A REGULAR HEALTHCARE AI STARTUP
  logo: abridge
  note:
  - We used company releases and customer disclosures to describe each named platform
  - We treated “a regular startup” as a fictional baseline, shown here only for contrast
  right: ABRIDGE
  rows:
  - - They sell a generic note app that stays separate from records
    - Abridge writes visit notes inside existing medical records
  - - They work only in one clinical specialty or visit type
    - Abridge supports conversations across 55 clinical specialties
  - - They ask doctors to redo the note after the patient leaves
    - Abridge drafts structured notes while the visit is happening
  - - They chase individual doctors with one-at-a-time licenses
    - Abridge grew to over 150 enterprise health-system partners
  - - They leave billing teams to fix codes after the encounter
    - Abridge brings billing context into visit documentation
  - - They have no links between a note and supporting evidence
    - Abridge builds a reasoning layer around medical dialogue
  - - They sell only a tool without hospital-wide integrations
    - Abridge works with major medical record systems and teams
  - - They raise modest rounds without a clear enterprise rollout
    - Abridge raised $300M in 2025 after reaching 150 systems
  section: Startup strategies
  src: 210
  title: How Abridge turned medical notes into care intelligence
  type: contrast
  logo_src: ../../assets/logos/lib/abridge.png
- id: ed211
  left: A REGULAR HEALTHCARE AI STARTUP
  logo: openevidence
  note:
  - We used company releases and customer disclosures to describe each named platform
  - We treated “a regular startup” as a fictional baseline, shown here only for contrast
  right: OPENEVIDENCE
  rows:
  - - They use general chat tools without healthcare evidence
    - OpenEvidence searches medical journals and care guidelines
  - - They charge each doctor before proving daily usefulness
    - OpenEvidence made its search tool free for US clinicians
  - - They answer without showing the medical source behind it
    - OpenEvidence grounds answers in peer-reviewed research
  - - They rely on broad consumer traffic to reach clinicians
    - OpenEvidence verifies physicians to build a doctor audience
  - - They remain outside the record during clinical decisions
    - OpenEvidence integrated with Epic at major health systems
  - - They ship a static reference tool that cannot evolve
    - OpenEvidence added cancer content through a hospital deal
  - - They raise capital without visible repeat clinical demand
    - OpenEvidence reached large physician usage before its raise
  - - They focus on one local market without scaling access
    - OpenEvidence partnered to bring clinical AI to more countries
  section: Startup strategies
  src: 211
  title: How OpenEvidence made evidence search a $15B platform
  type: contrast
  logo_src: ../../assets/logos/openevidence.png
- id: ed212
  left: A REGULAR HEALTHCARE AI STARTUP
  logo: hippocratic-ai
  logo_src: ../../assets/logos/lib/hippocratic-ai.png
  note:
  - We used company releases and customer disclosures to describe each named platform
  - We treated “a regular startup” as a fictional baseline, shown here only for contrast
  right: HIPPOCRATIC AI
  rows:
  - - They use a generic chatbot to give medical diagnoses
    - Hippocratic AI focuses on non-diagnostic patient tasks
  - - They launch chatbots without any clinical risk checks first
    - Hippocratic AI emphasizes safety-focused healthcare agents
  - - They stop after a demo of one question-answer bot
    - Hippocratic AI built a library of clinical use cases
  - - They wait for inbound questions instead of reaching patients
    - Hippocratic AI uses agents for proactive patient outreach
  - - They sell to consumers outside health-system workflows
    - Hippocratic AI works with health plans and care providers
  - - They measure app signups rather than patient interactions
    - Hippocratic AI reported 115M patient interactions
  - - They stay limited to one narrow healthcare buyer
    - Hippocratic AI signed clients across health and pharma
  - - They stay at seed size while expanding the product
