- id: ed008
  type: x/markets_often_confused
  section: Market definition
  title: What markets are often confused with healthcare AI?
  src: 8
  t:
    7: Healthcare AI differs from both because the drug reprograms immune cells inside the patient, rather than shipping finished cells
    10: Ex vivo CAR-T removes immune cells, engineers them outside the body, then reinfuses the manufactured cells into the patient
    11: Gene delivery moves DNA or RNA into cells, while healthcare AI uses that delivery specifically to create CAR immune cells
    12: EX VIVO CAR-T
    13: HEALTHCARE AI
    14: GENE DELIVERY
