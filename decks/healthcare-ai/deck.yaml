- id: ed006
  type: definition
  section: Market definition
  title: What is the healthcare AI market, in simple terms?
  text: Healthcare AI is software built for medical work. It helps doctors diagnose illness, document care, manage payment or develop medicines.
  note: We include AI built for health care, from diagnosis and clinical notes to claims and drug research, rather than general AI.
  src: 6
  icon_tl: 🩺
