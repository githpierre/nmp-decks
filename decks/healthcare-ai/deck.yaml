- id: ed017
  type: maturity
  section: Market definition
  title: How mature is healthcare AI as a market?
  score: 28
  text: The market is real because several programs are in Phase 1 and early patients have generated CAR cells and clinical responses. The score stays low because cohorts are tiny, durability is uncertain, and no healthcare AI product is commercially approved yet.
  note:
  - We rate market maturity with a simple internal score based on clinical proof, platform breadth, strategic investment, and commercial readiness.
  - We set 28/100 because human proof exists, but the field remains early Phase 1 with sparse long-term data and no commercial product.
