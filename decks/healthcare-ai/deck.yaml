- id: ed138
  type: x/regulation_evolving
  section: Market challenges
  title: How is regulation evolving?
  note: We mapped the main FDA changes that affect healthcare AI. The market benefits from a clearer cell-and-gene-therapy framework, while targeted delivery creates additional biodistribution and off-target obligations.
  src: 138
  t:
    7: '2017 - 2023


      CAR-T approvals set a path, while gene-therapy rules focused on vector safety and long follow-up.'
    8: '2024 - 2025


      The FDA issued CAR-T and editing guidance, warned on T-cell cancers, then dropped CAR-T REMS.'
    9: '2026


      The FDA added flexible manufacturing rules, off-target editing guidance and a potency framework.'
    10: 'TODAY


      Sponsors must pair CAR-T clinical data with proof of targeting, spread in the body and safety.'
    11: '?


      Rules may adapt to platforms, but lasting in-body gene delivery will still need strong safety data.'
- id: iv_fda
  type: x/were_key_phases_market_acceleration
  section: Market challenges
  title: What does the road to FDA approval look like?
  note: We used current FDA rules for IND review and cell-and-gene-therapy development. Exact trial sizes and whether Phase 3 is required depend on indication, effect size and the regulatory pathway.
  src: 147
  t:
    7: 'IND FILING


      The sponsor files preclinical, manufacturing and trial plans. The FDA then has 30 days to review them.'
    8: 'PHASE 1 TRIALS


      Small groups test dose, delivery and CAR expansion, with close attention to off-target effects.'
    9: 'PHASE 2 TRIALS


      More patients test response and durability while the sponsor locks potency, process and dose.'
    10: 'FAST LANES


      Fast Track, Breakthrough and RMAT bring more contact with the FDA, but not less evidence.'
    11: 'PHASE 3 AND BLA


      Confirmatory data and proven manufacturing support approval, then long safety follow-up.'
- id: ed140
  type: x/where_schools_learners_vendors_clash
  section: Market challenges
  title: Where do developers, doctors and regulators clash?
  src: 140
  t:
    0: Developers want one off-the-shelf drip with no cell manufacturing
    7: Regulators want data showing exactly which cells get the gene
    9: Patients want CAR-T without weeks of manufacturing and travel
    10: Centers still need systems for CRS and long follow-up
    12: Developers want lasting CAR expression from a single dose
    13: Safety teams fear lasting genes make errors permanent
    18: Investors want fast proof that delivery works in people
    19: Doctors need slow dose steps in first human trials
    21: Pharma buyers value platforms across cancer and autoimmunity
    22: Regulators review each product's payload, target and vector
    24: Sponsors want to scale it like a standard drug, not a cell
    25: The FDA still demands tight potency and batch controls
- id: iv_safety
  type: x/pain_points_yesterday_vs_today
  section: Market challenges
  title: Which safety risks worry doctors the most?
  note: We separated established CAR-T class risks from in vivo-specific delivery risks. Human in vivo datasets remain small, so the relative incidence of each risk is not yet known.
  src: 54
  t:
    6: 'CYTOKINE STORM



      CAR-T expansion can still trigger CRS with fever and low blood pressure, even when the cells are made inside the body'
    7: 'NERVE EFFECTS



      Neurological toxicity remains a class concern, so early in vivo trials need close observation and rapid intervention'
    8: 'SECOND CANCERS



      FDA requires lifelong vigilance for secondary malignancies after genetically modified CAR-T treatment'
    9: 'DELIVERY ERRORS



      In vivo vectors must show that CAR genes avoid unintended tissues, because a misdirected durable edit may persist'
    10: 'GENE CONTROL



      The key promise is precise cell targeting, but regulators still need potency, biodistribution and long-term safety proof'
