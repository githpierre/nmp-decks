- id: ed102
  type: x/why_has_become_commoditized
  section: Value creation
  title: Why has it become commoditized?
  note: We see commoditization where the field can reuse validated CAR biology, common vector methods and standard development workflows. New value therefore comes from solving selective delivery, safety, persistence, access and real clinical outcomes.
  src: 102
  t:
    6: Because approved CAR-T products already validate CD19 and BCMA as useful targets
    7: COMMON CAR TARGETS
    8: Because lentiviral engineering has decades of tooling, suppliers and CAR-T use
    9: BASIC LVV DESIGN
    10: Because RNA medicines made lipid particles and their testing widely available
    11: GENERIC LNPs
    12: Because mouse tumor studies are now a routine gate before human trials
    13: MOUSE MODELS
    14: Because regulators and developers already use safety-first dose-escalation trials
    15: PHASE 1 DESIGN
    16: Because cell-killing and gene-delivery assays are now standard lab measures
    17: KILLING ASSAYS
    18: Because most programs reuse proven B-cell targets instead of new ones
    19: SINGLE TARGETS
    20: Because leading programs already position treatment as an off-the-shelf drip
    21: IV DELIVERY
