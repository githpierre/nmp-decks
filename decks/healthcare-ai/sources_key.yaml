rows:
- name: 'JAMA, OpenEvidence

    use study'
  why: An independent study of account logs, not a company claim, on how many clinicians use the tool
  how: We used it for the 703,265 monthly users and the 39.5 questions per clinician. It anchors our view of real use.
  url: https://jamanetwork.com/journals/jama/fullarticle/2855491
- name: 'AMA, physician

    AI survey'
  why: The yearly survey of US physicians by their main professional body, released in March 2026
  how: We used it for the 81% of physicians who use AI. It also gave us what doctors ask for before they trust a tool.
  url: https://www.ama-assn.org/press-center/ama-press-releases/ama-ai-usage-among-doctors-doubles-confidence-technology-grows
- name: 'FDA, list of

    AI devices'
  why: The regulator’s own list of the AI-enabled medical devices it has authorized in the United States
  how: We used it for the count of more than 1,600 devices. It also frames what is regulated and what is not.
  url: https://www.fda.gov/medical-devices/digital-health-center-excellence/artificial-intelligence-enabled-medical-devices
- name: 'FDA, decision

    support guidance'
  why: The January 2026 guidance that says when clinical software counts as a medical device
  how: We used it for the regulation timeline. It also explains the path of a tool into a hospital.
  url: https://www.fda.gov/regulatory-information/search-fda-guidance-documents/clinical-decision-support-software
- name: 'KLAS, healthcare

    AI update'
  why: Buyer research on which AI use cases health systems adopt first, from interviews with their leaders
  how: We used it for what buyers ask before scaling. It also backed our view that low-risk tasks come first.
  url: https://klasresearch.com/report/healthcare-ai-update-2025-what-use-cases-are-adopted-the-most/3912
- name: 'Menlo Ventures,

    AI in healthcare'
  why: A venture firm’s yearly count of what providers and payers spend on generative AI
  how: We used it for the $1.4B spent in 2025. It also dated the moment when the market became hot.
  url: https://menlovc.com/perspective/2025-the-state-of-ai-in-healthcare/
- name: 'JAMA Network Open,

    ambient AI study'
  why: A peer-reviewed study of 1,547 clinicians who use AI scribes in daily practice
  how: We used it for the measured time saved on notes. It keeps vendor claims and measured results apart.
  url: https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2849634
- name: 'JAMA Network Open,

    burnout study'
  why: A study of 263 clinicians in six health systems, before and after 30 days with an AI scribe
  how: We used it for the fall in burnout from 51.9% to 38.8%. It supports our growth drivers.
  url: https://doi.org/10.1001/jamanetworkopen.2025.34976
- name: 'UPMC and KLAS,

    AI governance'
  why: A 2026 survey of health systems on how they test, govern and measure AI tools
  how: We used it for the gaps in testing and governance. It also showed that 90% of systems already use outside AI.
  url: https://enterprises.upmc.com/resources/insights/governance-of-ai-solutions-at-health-systems/
- name: 'BMC, AI scribe

    trial'
  why: A hospital trial in Australia where staff reported how often AI notes contained made-up facts
  how: We used it for the 47% of staff who saw invented facts. It anchors our slide on patient risks.
  url: https://link.springer.com/article/10.1186/s12913-025-13954-5
- name: 'JAMA Internal

    Medicine, sepsis'
  why: An independent test of a widely used sepsis alert on real patients, published in 2021
  how: We used it for the 67% of sepsis cases the tool missed. It shows why outside validation matters.
  url: https://jamanetwork.com/journals/jamainternalmedicine/fullarticle/2781307
- name: 'Scoping review

    of 161 studies'
  why: A 2026 review of published predictive AI projects for health systems, by stage reached
  how: We used it for the 9 projects out of 161 in routine use. It supports our chapter on market challenges.
  url: https://www.sciencedirect.com/science/article/pii/S1386505626004181
- name: 'Insilico Medicine,

    interim results'
  why: The half-year accounts of a listed AI drug discovery company, to June 30, 2026
  how: We used it for the $106.3M of revenue, up almost four times. It shows drugmakers now pay for AI discovery.
  url: https://insilico.com/news/s11n46hx31-commercialization-roadmap-validated-with
- name: 'Recursion,

    Q3 2026 results'
  why: The quarterly accounts of the largest listed AI drug discovery company
  how: We used it for the $6.42 lost per dollar of revenue. It shows how milestone-based revenue arrives late.
  url: https://recursion.gcs-web.com/news-releases/news-release-details/recursion-reports-third-quarter-2026-financial-results-and
- name: 'AstraZeneca,

    insitro deal'
  why: The drugmaker’s own release on its October 2026 AI discovery partnership with insitro
  how: We used it for the $40M upfront and the $1.46B of possible milestones. It illustrates pharma demand.
  url: https://www.astrazeneca.com/media-centre/press-releases/2026/astrazeneca-announces-new-strategic-collaboration-with-insitro-to-use-advanced-ai-systems-to-develop-transformative-therapeutics.html
- name: 'Abridge,

    Series E'
  why: The company’s own release on its $300M round and its health-system customers
  how: We used it for the 150 health systems and the round size. It also fed our contrast slide on Abridge.
  url: https://www.abridge.com/blog/series-e
- name: 'Becker’s, OpenEvidence

    funding'
  why: Trade press report on the $250M round that valued OpenEvidence at $15B in September 2026
  how: We used it for the $15B valuation. It anchors our slides on the fastest-growing startups.
  url: https://www.beckershospitalreview.com/healthcare-information-technology/ai/openevidence-raises-250m-at-15b-valuation/
- name: 'KFF, AI in prior

    authorization'
  why: A policy review of how insurers use AI for coverage decisions, and of the rules that apply
  how: We used it for the risks of automated denials. It shaped the pain points of health insurers.
  url: https://www.kff.org/patient-consumer-protections/regulation-of-ai-in-prior-authorization-and-claims-review-a-look-at-federal-and-state-consumer-protections/
- name: 'Fortune Business

    Insights'
  why: A market study with a 2026 size, a growth rate and a split of spending by region
  how: We used it for the regional shares. Its total is wider than our scope, so we treat it as an upper bound.
  url: https://www.fortunebusinessinsights.com/industry-reports/artificial-intelligence-in-healthcare-market-100534
- name: 'Grand View

    Research'
  why: A market study that splits its healthcare AI total between software, hardware and services
  how: We used its 46% software share to explain our $29B estimate. Its total covers a wider scope than ours.
  url: https://www.grandviewresearch.com/industry-analysis/artificial-intelligence-ai-healthcare-market
