- type: maturity
  section: Market definition
  title: 'How mature are AI voice agents

    as a market?'
  score: 38
  text: The market is real because many companies already let AI answer simple calls, and the cost per call drops every year. The score is not higher because most deployments are still pilots, voices still make mistakes, and buyers worry about trust and privacy.
  note:
  - We rate market maturity with a simple internal score based on tech progress and disruptions
  - The score is directional and not exact, but it stays clearer than vague labels like early
- type: dated
  section: Market definition
  title: 'What has changed

    (very) recently?'
  page: 1/1
  items:
  - d: SINCE 2022
    t: Large language models made it possible to hold a natural conversation on the phone, not just follow a fixed menu of options.
  - d: SINCE 2023
    t: Synthetic voices became hard to tell apart from human ones, and the delay before each answer fell below one second.
  - d: SINCE 2024
    t: Startups began to sell ready-made voice agents that a small business can set up in an afternoon, without any developers.
  - d: SINCE 2024
    t: Large call center firms started to test AI agents on their simplest calls, like booking, tracking, and password resets.
  - d: SINCE 2025
    t: Regulators began to ask that callers be told when they speak to an AI, and some states banned AI voices in robocalls.
  - d: SINCE 2026
    t: Buyers now compare voice agents on the share of calls they fully solve, not on how human the voice sounds to the caller.
  note:
  - 'This is an example layout: the dates and changes are broad trends, not a researched timeline'
  - A real deck would date each change from sources and keep the moments that matter most
