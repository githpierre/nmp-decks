ed007p:
  type: pp_radar
  title: 'Which companies really

    belong in edge AI chips?'
  TL:
    name: Arm
    src: ../../assets/logos/pp_live/edge-ai-chips/s01-00.png
    text: supplies processor IP used in edge AI chips, but it usually licenses designs rather than selling edge AI processors
  TR:
    name: OpenAI
    src: ../../assets/logos/pp_live/edge-ai-chips/s01-02.png
    text: develops AI models and software services, not processors designed for local edge inference in devices or vehicles
  BL:
    name: NXP Semiconductors
    src: ../../assets/logos/pp_live/edge-ai-chips/s01-09.png
    text: sells edge AI capable processors, but most of its business covers broader automotive and embedded semiconductors
  BR:
    name: Qualcomm
    src: ../../assets/logos/pp_live/edge-ai-chips/s01-10.png
    text: ships edge AI processors, but its portfolio also spans connectivity, mobile and other chip markets
  caption:
  - Distance to the center reflects how central each company is to edge AI chips
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
  - ../../assets/logos/pp_live/edge-ai-chips/s01-01.png
