ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people want

    to open a delivery-only kitchen'
  date: In recent months.
  expl: After their first hype and crash, ghost kitchens are back for simpler reasons. Rents and staff costs keep rising, delivery apps keep growing, and
    a kitchen with no dining room is a cheaper way to start a food business. So more people search how to launch one.
  term: ghost kitchen
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/ghost-kitchen/ghost-kitchen.csv
ed052p:
  type: pp_cagr
  title: 'How much room is left

    for this market to grow?'
  lead: 'To fill that room, '
  condition: the market must keep turning delivery into a daily habit, as more meals move from dining rooms to kitchens built for delivery. It must also
    cut its losses, win diners who prefer real restaurants, and resist delivery apps that charge up to 30% of every order.
  note:
  - We compared forecasts from Mordor, Grand View, Fortune Business Insights and 360iResearch
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: 70
  cagr: 11
  y0: 2028
