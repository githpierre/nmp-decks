ed142p:
  title: 'What could go wrong

    for ghost kitchens?'
  events:
  - odds: 45
    impact: 3
    text: More operators follow CloudKitchens closures as rent and staff costs exceed delivery order margins
  - odds: 40
    impact: 2
    text: More cities copy New York's minimum pay for delivery workers, raising fees and cutting order volumes
  - odds: 35
    impact: 3
    text: DoorDash and Uber Eats raise commissions or add fees, leaving virtual brands without any profit
  - odds: 30
    impact: 2
    text: Shoppers cut takeout spending as prices rise and delivery orders drop at ghost kitchens
  - odds: 30
    impact: 2
    text: Chains like Chipotle and Wingstop open their own pickup kitchens and stop renting from CloudKitchens
  - odds: 30
    impact: 1
    text: Delivery apps ban or delist duplicate virtual brands like MrBeast Burger to clean up search results
  - odds: 25
    impact: 2
    text: Health inspectors find unsafe conditions at a ghost kitchen and cities tighten zoning and permits
  - odds: 25
    impact: 2
    text: Robot kitchens and drones fail to cut costs fast enough, and investors stop funding automation startups
  note:
  - We listed the events that could slow ghost kitchen down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
