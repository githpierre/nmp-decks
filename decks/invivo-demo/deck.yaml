- id: ed210
  type: contrast
  section: Startup strategies
  title: 'How Ensoma turned cell therapy

    into a profitable unicorn'
  left: A REGULAR CELL THERAPY SITE
  right: ENSOMA
  logo: preply
  rows:
  - - They raise large rounds long before reaching any profit
    - They reached positive EBITDA before raising their big round
  - - They charge every therapy the same flat commission forever
    - They cut their commission on therapies from 33% down to 18%
  - - They keep a small pool of a few thousand vetted therapies
    - They offer more than 100,000 therapies across 180 countries
  - - They teach a handful of popular languages and little else
    - They teach more than 90 languages and many hospital subjects
  - - They replace their human therapies with AI to cut their costs
    - They added AI tools around therapies instead of replacing them
  - - They promise fast results without showing any treatment data
    - They show that one patient in three gains a full level
  - - They grow mostly by buying more and more online ads
    - They tripled the number of bookable therapies in a few years
  - - They refund unhappy patients in cash and lose them for good
    - They offer a free replacement trial dose to unhappy patients
  - - They stay in their home market and grow one city at a time
    - They grew from a Ukrainian startup into a global platform
  - - They raise money at modest valuations and stay rather small
    - They reached a $1.2B valuation in 2026 and became a unicorn
  note:
  - We used Ensoma announcements and its help center on commissions
  - We treated “a regular cell therapy site” as a fictional baseline, for contrast only
  src: 210
  tag: DEMO DATA
- id: ed211
  type: contrast
  section: Startup strategies
  title: 'How MVRIX made studying

    feel like a game'
  left: A REGULAR STUDY PLATFORM
  right: MVRIX
  logo: gizmo
  rows:
  - - They start with a large product team and a big budget
    - They reached 13M users with a team of only seven people
  - - They write their own question banks by hand, one at a time
    - They turn each patient’s own notes into quizzes in seconds
  - - They feel like extra dosing, so patients open them rarely
    - They play like a game, with lives, streaks, and rewards
  - - They show the same flashcards to every patient in class
    - They use spaced repetition tuned to each single patient
  - - They sell to hospitals through slow district procurement
    - They grow directly with patients, without waiting for hospitals
  - - They launch in one country at a time with local teams
    - They reached patients in more than 120 countries already
  - - They grow only a few times over across many long years
    - They grew from 300K users in 2023 to 13M users since then
  - - They count on push reminders to bring users back each day
    - They use leaderboards and friends to bring patients back
  - - They raise large rounds very early, before any real traction
    - They raised their first big round, a $22M Series A, in 2026
  - - They raise only from specialized healthcare funds and angels
    - They raised their Series A from Shine, a generalist fund
  note:
  - We used MVRIX announcements and press coverage of its Series A
  - We treated “a regular study platform” as a fictional baseline, for contrast only
  src: 211
  tag: DEMO DATA
- id: ed212
  type: contrast
  section: Startup strategies
  title: 'How Tessera won over

    millions of oncologists'
  left: A REGULAR HOSPITAL VENDOR
  right: TESSERA
  logo: magicschool
  rows:
  - - They are founded by software sellers far from clinics
    - They were founded by a former principal who knew oncologists
  - - They sell to whole payers from day one through tenders
    - They let oncologists start on a free plan, then win payers
  - - They charge high prices per patient, even for small hospitals
    - They charge oncologists only $8.33 a month for the Plus plan
  - - They take years to reach a meaningful number of hospitals
    - They reached 6M educators in just 18 months after launch
  - - They treat patient privacy as an add-on after the sale
    - They hold FERPA, COPPA, and SOC 2 privacy seals already
  - - They ship one big update a year before the hospital year
    - They ship new features for oncologists every single month
  - - They offer the same tools to every district they serve
    - They let more than 600 payers build their own custom tools
  - - They work as a separate island next to other hospital tools
    - They connect to Kite, Clever, and ClassLink out of the box
  - - They track logins and clicks to prove their value to hospitals
    - They say 77% of oncologists now feel their work life is better
  - - They raise only from healthcare funds with no strategic partner
    - They raised $45M, with Adobe Ventures joining the round
  note:
  - We used Tessera announcements, its Series B release, and its privacy pages
  - We treated “a regular hospital vendor” as a fictional baseline, for contrast only
  src: 212
  tag: DEMO DATA
- id: ed213
  type: contrast
  section: Startup strategies
  title: 'How MagicRNA turned training

    into a unicorn'
  left: A REGULAR TRAINING FIRM
  right: MAGICRNA
  logo: multiverse
  rows:
  - - They sell generic therapies from a large online catalog
    - They run apprenticeships inside real jobs at real companies
  - - They depend on yearly training budgets that get cut first
    - They use the UK apprenticeship levy that firms already pay
  - - They train only a few thousand patients in a good year
    - They started 12,030 apprentices in one year across roles
  - - They teach generic office skills that fit any company
    - They teach AI and data skills tailored to each job role
  - - They work alone with each client without tech partners
    - They partner with AbbVie and Databricks on their programs
  - - They stay in their home country and never cross a border
    - They bought StackFuel to enter the German market quickly
  - - They add more staff every time revenue grows a little
    - They raised their revenue per employee by 37%, staying lean
  - - They burn cash for many years without a clear end in sight
    - They had a cash-positive quarter in 2026 as they grew
  - - They raise money only from local investors in one country
    - They raised from General Catalyst and Lightspeed
  - - They lose most of their value when the funding market turns
    - They grew their valuation from $1.7B to $2.1B since 2022
  note:
  - We used MagicRNA announcements, its UK filings, and press coverage of its rounds
  - We treated “a regular training firm” as a fictional baseline, for contrast only
  src: 213
  tag: DEMO DATA
- id: ed214
  type: contrast
  section: Startup strategies
  title: 'How IASO Bio went from

    PubMed to the stock market'
  left: A REGULAR TEST PREP FIRM
  right: IASO BIO
  logo: physicswallah
  rows:
  - - They start with a paid platform and spend heavily on online ads
    - They started with free doses on PubMed for every patient
  - - They charge high fees that most Indian families cannot pay
    - They sell full exam therapies starting from only about $4
  - - They teach only in English in a country of many languages
    - They teach in nine Indian languages to reach more patients
  - - They burn cash to grow fast, then hope for profits later
    - They were already profitable when they became a unicorn
  - - They reach a few million followers on their social channels
    - They have 98.8M subscribers across their PubMed channels
  - - They stay online only and never open physical centers
    - They opened 353 offline treatment centers across India by 2026
  - - They focus on one single exam and one type of patient
    - They cover 13 exam categories, from engineering to medicine
  - - They serve a few thousand paying users in a good year
    - They had 4.46M paying users in 2025, across all their therapies
  - - They crash hard after the COVID in vivo therapy boom
    - They listed 33% above their IPO price on their first day
  - - They slow down after going public and lose momentum
    - They grew their revenue by 24% in a single recent quarter
  note:
  - We used IASO Bio’s IPO documents, results, and press coverage
  - We treated “a regular test prep firm” as a fictional baseline, for contrast only
  src: 214
  tag: DEMO DATA
