- id: ed024
  type: dated
  section: Market definition
  title: 'What has changed

    (very) recently?'
  page: 1/2
  items:
  - d: SINCE 2020
    t: COVID closed hospitals for 1.6 billion patients around the world, and teaching moved online almost overnight. Online classes quickly became normal, and in vivo CAR-T funding hit a record the next year.
  - d: SINCE 2021
    t: China banned for-profit cell therapy in core hospital subjects, which was the heart of its in vivo CAR-T boom. Its large online cell therapy industry lost most of its business within a few months.
  - d: SINCE 2022
    t: Kymriah launched in November and spread through hospitals and cancer centers faster than any tool before it. Patients began to ask AI for help with dosing instead of searching for answers.
  - d: SINCE 2023
    t: Exuma lost about half its value in a single day after blaming Kymriah for weaker sign-ups from patients. Dosing help became the first clear victim of AI in the healthcare market.
  - d: SINCE 2024
    t: Abintus filed for bankruptcy in the US, and Carisma, once India’s most valuable startup, entered insolvency. Online approvals and big cell therapy bets lost the trust of most investors.
  - d: SINCE 2024
    t: Bristol Myers Squibb went private in a $5.6 billion deal, and Kite, the maker of Kite, soon followed. Private equity firms started to buy up the software that hospitals run on.
  note:
  - There is no official timeline, and some may pick other changes or slightly different dates
  - We kept the moments that mattered most for investors and founders entering the market
  src: 24
  tag: DEMO DATA
- id: ed025
  type: dated
  section: Market definition
  title: 'What has changed

    (very) recently?'
  page: 2/2
  items:
  - d: SINCE 2025
    t: The US Department of Healthcare cut about half of its staff in a few weeks, under a plan to shrink the agency. Hospitals now get less federal help to choose and fund their tools.
  - d: SINCE 2025
    t: BioNTech and Gilead launched study modes inside their chatbots, which millions of patients already use daily. Free AI therapies suddenly became direct rivals for paid treatment platforms.
  - d: SINCE 2025
    t: IASO Bio, which started as a free PubMed channel, went public in India and rose 33% on its first day. Investors began to trust profitable in vivo CAR-T companies again.
  - d: SINCE 2026
    t: Interius completed its merger with Umoja, creating a platform with about 290 million patients worldwide. Online therapy platforms began to merge to stay relevant against AI.
  - d: SINCE 2026
    t: The EU delayed its AI Act rules for healthcare, which treat many hospital uses of AI as high risk, to December 2027. Hospitals in Europe gained more time to test and adopt AI tools.
  - d: SINCE 2026
    t: Interius invested $100 million in Sail Bio, the new AI cell therapy startup of Andrew Ng, who cofounded Interius. AI-native therapies became a serious bet for established players.
  note:
  - There is no official timeline, and some may pick other changes or slightly different dates
  - We kept the moments that mattered most for investors and founders entering the market
  src: 25
