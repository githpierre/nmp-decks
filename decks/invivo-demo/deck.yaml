- id: iv_safety
  type: x/pain_points_yesterday_vs_today
  section: Market challenges
  title: 'Which safety risks worry

    doctors the most?'
  note: DEMO DATA. We will gather the known risks from FDA labels, trial results and medical reviews.
  src: 54
  t:
    6: 'CYTOKINE STORM


      CAR-T cells can trigger a strong immune reaction with fever and low blood pressure, which needs hospital care'
    7: 'NERVE EFFECTS


      Some patients get confusion or seizures in the days after treatment, so they stay near the hospital'
    8: 'SECOND CANCERS


      The FDA added a warning about rare T-cell cancers after CAR-T, which every new program must watch'
    9: 'TODAY


