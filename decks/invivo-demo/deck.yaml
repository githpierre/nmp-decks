- id: ed133
  type: x/has_held_back_market_growth
  section: Market challenges
  title: 'What has held back

    market growth so far?'
  note: Rather than presenting this evolution as a diffuse timeline, we grouped it into a set of broad historical phases These phases are inherently subjective but grounded in the documents reviewed, all of which are listed in the sources section
  src: 133
  t:
    6: '1997 - 2007


      Hospitals had slow internet and few computers. Platforms were hard to use. Oncologists got little training and kept teaching on paper.'
    7: '2008 - 2014


      Most MOOC patients quit within weeks. Insurers doubted online approvals. Many hospitals still shared one computer lab per building.'
    8: '2015 - 2019


      Payers bought many tools that oncologists barely used. Data stayed locked in separate systems. Budgets for new tools were small.'
    9: 'TODAY


      Budgets are tight after COVID relief ended. AI makes cheating easy. Free chatbots push prices down, and few tools prove gains.'
    10: '2020 - 2023


      COVID forced hospitals online with weak tools and slow home internet. When hospitals reopened, demand and funding fell fast.'
  tag: DEMO DATA
