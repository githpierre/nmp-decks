  section: Market challenges
  title: 'How is regulation

    evolving?'
  note: Rather than presenting this evolution as a diffuse timeline, we grouped it into a set of broad historical phases These phases are inherently subjective but grounded in the documents reviewed, all of which are listed in the sources section
  src: 138
  t:
    7: '1998 - 2019


      The US protected patient records and the data of children online. Most countries had few rules for treatment platforms. Data moved freely.'
    8: '2020 - 2022


      India set out a national plan for digital treatment in 2020. China banned for-profit hospital cell therapy in 2021. Europe applied GDPR to hospitals.'
