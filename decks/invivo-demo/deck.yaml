  note: There isn’t a single authoritative classification that cleanly separates “hot” startups from “not hot” ones with absolute certainty. Instead, what we’ve done here is group the startups that kept coming up most often in discussions and activities, and that showed clear momentum, and place them within different historical phases of the market.
  src: 174
  t:
    6: '1997 - 2007


      Startups like Juno and Lonza brought therapies online at cancer centers. Most sold software that hospitals hosted. Few reached homes.'
    7: '2008 - 2014


      Sana, Interius, Umoja, and Capstan reached millions online. Exuma and Abintus built big businesses. Carisma started in India.'
    8: '2015 - 2022


      Carisma, Myeloid, and Starna raised huge rounds. COVID made cell therapy platforms boom. Many unicorns were born, then fell fast.'
    9: 'TODAY


      AI tools like Tessera and Stylus spread in hospitals. Ensoma and Orna became unicorns. Big players merge to grow.'
    10: '?


      Future winners may own AI therapies that prove results, or trusted skills data that insurers use. But big tech offers free tools, and hospital budgets stay tight.'
