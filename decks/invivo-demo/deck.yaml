- id: iv_fda
  type: x/were_key_phases_market_acceleration
  section: Market challenges
  title: 'What does the road

    to FDA approval look like?'
  note: DEMO DATA. We will describe each step from FDA guidance, with the usual time per step for cell and gene therapies.
  src: 147
  t:
    7: 'IND


      The company files a request to start trials in people. The FDA has 30 days to say no.'
    8: 'PHASE 1


      A few dozen patients get the drug. The goal is safety and the right dose, not proof it works.'
    9: 'PHASE 2


      A larger group tests whether the drug works. Strong results can earn faster review.'
    10: 'FAST LANES


      RMAT and Breakthrough labels shorten reviews. Most in vivo programs are still in phase 1.'
    11: 'PHASE 3 AND BLA


      Hundreds of patients compare the drug with standard care, then the company files for approval.'
  tag: DEMO DATA
