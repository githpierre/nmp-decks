ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More people google passkeys as logins

    finally move beyond passwords'
  date: Lately.
  expl: Apple, Google and Microsoft pushed passkeys as the default way to sign in, and big apps followed. People ran into the new login screens and went
    looking for what a passkey is and whether it is safer than a password.
  term: identity security
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/identity-security/identity-security.csv
ed052p:
  type: pp_cagr
  title: 'How much bigger can

    identity security get?'
  lead: ''
  condition: To get that big, the market must secure machine identities and AI agents as well as people, since they now far outnumber employees. It must
    also stop attackers who log in with stolen credentials instead of breaking in.
  note:
  - We compared forecasts from 360iResearch, ResearchAndMarkets, Technavio and Start with Identity
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: 25
  cagr: 13
  y0: 2026
