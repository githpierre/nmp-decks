ed148p:
  title: 'What pushed identity security

    forward, year after year?'
  events:
  - year: '2002'
    text: SAML standard unlocks web single signon
    impact: 2.0
  - year: '2003'
    text: SAML improves login interoperability
    impact: 1.0
  - year: '2005'
    text: SAML 2 standardizes enterprise federation
    impact: 2.5
  - year: '2010'
    text: AWS previews fine grained identity control
    impact: 1.5
  - year: '2011'
    text: AWS makes cloud IAM broadly available
    impact: 2.0
  - year: '2011'
    text: Federation reduces duplicate credentials
    impact: 1.5
  - year: '2012'
    text: Cloud roles replace embedded credentials
    impact: 2.0
  - year: '2012'
    text: OAuth standardizes delegated access
    impact: 2.0
  - year: '2014'
    text: OpenID Connect unifies authentication
    impact: 2.5
  - year: '2015'
    text: Managed IAM policies simplify updates
    impact: 1.5
  - year: '2015'
    text: Certification improves federation trust
    impact: 1.0
  - year: '2016'
    text: WebAuthn draft advances secure login
    impact: 1.5
  - year: '2017'
    text: AWS Organizations scales access guardrails
    impact: 1.5
  - year: '2017'
    text: NIST refreshes identity guidance
    impact: 1.5
  - year: '2018'
    text: WebAuthn reaches candidate standard maturity
    impact: 1.5
  - year: '2019'
    text: WebAuthn secures browser authentication
    impact: 2.5
  - year: '2020'
    text: SolarWinds exposes federation trust risks
    impact: 2.0
  - year: '2021'
    text: Microsoft buys CloudKnox for privileges
    impact: 1.5
  - year: '2021'
    text: WebAuthn Level 2 advances passwordless
    impact: 1.0
  - year: '2022'
    text: Tech giants align to scale passkeys
    impact: 3.0
  - year: '2023'
    text: Google makes passkeys default for accounts
    impact: 2.0
  - year: '2023'
    text: Okta breach exposes identity hub risks
    impact: 2.0
  - year: '2024'
    text: Snowflake attacks expose missing MFA controls
    impact: 2.0
  - year: '2024'
    text: ISO recognizes OpenID Connect
    impact: 1.0
  - year: '2025'
    text: NIST modernizes digital identity requirements
    impact: 2.0
  - year: '2026'
    text: Google strengthens permissions for AI agents
    impact: 1.5
  - year: '2026'
    text: Microsoft makes passkeys default in Entra
    impact: 2.5
  - year: '2026'
    text: WebAuthn Level 3 standard advances passkeys
    impact: 1.5
  - year: '2026'
    text: Passkey themed phishing exposes bypasses
    impact: 1.5
  - year: '2026'
    text: NIST guidance targets stolen session tokens
    impact: 1.5
  note:
  - We kept the events we believe pushed identity security forward the most
  - Ratings are our estimates, with all the sources at the end of the report
