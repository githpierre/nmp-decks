ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people look up

    AI infrastructure as billions pour in'
  date: Recently.
  expl: AI is no longer just software. OpenAlI, Microsoft and Meta announced hundreds of billions for data centers, chips and power plants, and Nvidia became
    the most valuable company in the world. People wanted to understand the pipes and plumbing behind AT.
  term: ai infrastructure
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/ai-infrastructure/ai-infrastructure.csv
ed052p:
  type: pp_cagr
  title: 'Is AI infrastructure

    still growing fast?'
  lead: ''
  condition: Yes, but the market must keep turning AI usage into paid demand, while labs and clouds keep raising money to buy new chips every year. It must
    also find enough power, memory, and chip factories, and avoid a crash if AI revenue grows slower than the spending behind it.
  note:
  - We compared forecasts from IDC, Gartner, Dell'Oro and Precedence and adjusted each one to our market definition
  - We then built a realistic range from these forecasts, and you will find all the sources we used at the end of the report
  size: null
  cagr: 20
  y0: 2026
