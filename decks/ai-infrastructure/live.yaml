ed142p:
  title: 'What could go wrong

    for AI infrastructure?'
  events:
  - odds: 45
    impact: 2
    text: Grid connection waits of five years or more delay new AI data centers in Virginia and Texas
  - odds: 40
    impact: 2
    text: Nvidia Blackwell and Rubin price drops cut the resale value of older H100 clusters by half
  - odds: 35
    impact: 2
    text: New US export rules and tariffs on servers raise costs and close Chinese and Gulf markets
  - odds: 35
    impact: 1
    text: Local opposition over water and power bills blocks data center permits in several US states
  - odds: 30
    impact: 2
    text: Algorithmic gains like DeepSeek cut compute needs per task and slow demand for new clusters
  - odds: 25
    impact: 3
    text: Microsoft, Meta and Alphabet cut capex plans after AI revenue lags, leaving GPU clouds with empty capacity
  - odds: 20
    impact: 3
    text: CoreWeave or another neocloud struggles to refinance tens of billions in GPU backed debt
  - odds: 20
    impact: 3
    text: OpenAI fails to fund its Stargate commitments and Oracle and partners pause big projects
  note:
  - We listed the events that could slow ai infrastructure down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
