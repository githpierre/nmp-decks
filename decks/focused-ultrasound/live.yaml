ed148p:
  title: 'What pushed the focused ultrasound

    market forward, year after year?'
  events:
  - year: '1942'
    text: Focused ultrasound lesions are demonstrated
    impact: 1.0
  - year: '1950'
    text: Brain ultrasound lesioning reaches patients
    impact: 1.0
  - year: '1990'
    text: MRI guidance improves ultrasound targeting
    impact: 1.5
  - year: '1998'
    text: MR thermometry enables real-time control
    impact: 1.5
  - year: '2004'
    text: ExAblate wins uterine fibroid approval
    impact: 2.0
  - year: '2009'
    text: Bone metastasis trials show pain relief
    impact: 1.5
  - year: '2012'
    text: MRgFUS research expands neurologic targeting
    impact: 1.5
  - year: '2013'
    text: Essential tremor trial shows feasibility
    impact: 2.0
  - year: '2015'
    text: FDA reviews ExAblate Neuro evidence
    impact: 1.5
  - year: '2016'
    text: FDA approves essential tremor MRgFUS
    impact: 3.0
  - year: '2017'
    text: Medicare coding supports movement treatment
    impact: 1.5
  - year: '2018'
    text: FDA expands into Parkinson tremor
    impact: 2.0
  - year: '2019'
    text: Centers build focused ultrasound programs
    impact: 1.5
  - year: '2020'
    text: FDA clears osteoid osteoma treatment
    impact: 1.5
  - year: '2021'
    text: FDA expands Parkinson lesioning use
    impact: 2.0
  - year: '2021'
    text: BBB opening trials gain momentum
    impact: 1.5
  - year: '2022'
    text: Bilateral essential tremor path advances
    impact: 1.5
  - year: '2022'
    text: Ultrasound neuromodulation accelerates
    impact: 1.0
  - year: '2023'
    text: FDA clears liver histotripsy
    impact: 3.0
  - year: '2023'
    text: Histotripsy proves nonthermal ablation path
    impact: 2.0
  - year: '2024'
    text: Ultrasound indications keep widening
    impact: 1.5
  - year: '2024'
    text: Global regulatory approvals keep accumulating
    impact: 1.5
  - year: '2025'
    text: Staged bilateral tremor adoption grows
    impact: 1.5
  - year: '2025'
    text: Histotripsy hospital installations expand
    impact: 1.5
  - year: '2025'
    text: Neuromodulation enters larger human studies
    impact: 1.0
  - year: '2026'
    text: Kidney stone system wins FDA clearance
    impact: 2.5
  - year: '2026'
    text: Prenatal focused ultrasound shows feasibility
    impact: 1.5
  - year: '2026'
    text: International clinical society launches
    impact: 1.0
  - year: '2026'
    text: New centers of excellence open
    impact: 1.0
  - year: '2026'
    text: Neurologic evidence supports durable benefit
    impact: 2.0
  note:
  - We kept the events we believe pushed focused ultrasound forward the most
  - Ratings are our estimates, with all the sources at the end of the report
ed168p:
  handle: focused-ultrasound
  title: 'Where did focused ultrasound investors

    put their money this past year?'
  note:
  - We added up every equity round of focused ultrasound startups in our tracker over the last twelve months
  - by category of our market definition, and rounds with no public amount count as zero here
