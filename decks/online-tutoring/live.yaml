ed148p:
  title: 'What pushed the online tutoring

    market forward, year after year?'
  events:
  - year: '1990'
    text: Internet enables remote tutoring
    impact: 2.5
  - year: '1998'
    text: Tutor.com brings tutoring online
    impact: 2.0
  - year: '2005'
    text: Broadband improves live instruction
    impact: 1.5
  - year: '2005'
    text: Wyzant scales tutor marketplace model
    impact: 1.5
  - year: '2007'
    text: Smartphones widen after-school access
    impact: 1.0
  - year: '2010'
    text: Video calling improves remote lessons
    impact: 1.5
  - year: '2011'
    text: Tablets simplify digital whiteboards
    impact: 1.0
  - year: '2012'
    text: Cloud tools improve tutor collaboration
    impact: 1.0
  - year: '2013'
    text: Varsity Tutors expands online matching
    impact: 1.5
  - year: '2014'
    text: Test prep shifts online faster
    impact: 1.0
  - year: '2015'
    text: On-demand tutoring cuts wait times
    impact: 1.5
  - year: '2016'
    text: Adaptive tools personalize tutor sessions
    impact: 1.0
  - year: '2017'
    text: Gig marketplaces expand tutor supply
    impact: 1.0
  - year: '2018'
    text: School devices normalize digital learning
    impact: 1.0
  - year: '2019'
    text: Video tutoring gains parent trust
    impact: 1.0
  - year: '2020'
    text: Covid forces tutoring online
    impact: 3.0
  - year: '2020'
    text: Relief funds finance tutoring programs
    impact: 2.0
  - year: '2021'
    text: Districts buy virtual tutoring at scale
    impact: 2.0
  - year: '2021'
    text: Remote tutoring adds group formats
    impact: 1.0
  - year: '2022'
    text: Learning loss sustains tutoring demand
    impact: 2.0
  - year: '2022'
    text: AI tools assist tutor preparation
    impact: 1.0
  - year: '2023'
    text: AI tutors pressure human services
    impact: 1.5
  - year: '2023'
    text: Schools demand tutoring evidence
    impact: 1.0
  - year: '2024'
    text: Hybrid tutoring becomes standard option
    impact: 1.0
  - year: '2024'
    text: AI coaching improves human tutors
    impact: 1.5
  - year: '2025'
    text: Pandemic aid cliff reshapes market
    impact: 0.5
  - year: '2025'
    text: FEV exit raises quality bar
    impact: 0.5
  - year: '2026'
    text: Varsity Schools shutdown resets sector
    impact: 2.0
  - year: '2026'
    text: Gemini upgrades peer tutor coaching
    impact: 2.5
  - year: '2026'
    text: Khanmigo trials sharpen evidence standards
    impact: 1.5
  note:
  - We kept the events we believe pushed online tutoring forward the most
  - Ratings are our estimates, with all the sources at the end of the report
