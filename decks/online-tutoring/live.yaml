ed007p:
  type: pp_radar
  title: 'Who is in online tutoring,

    and who stays outside?'
  TL:
    name: Coursera
    src: ../../assets/logos/pp_live/online-tutoring/s01-00.png
    text: offers online courses and coaching tools, but most learning is course-based rather than personalized tutoring
  TR:
    name: Instructure
    src: ../../assets/logos/pp_live/online-tutoring/s01-02.png
    text: provides learning- management software, not direct personalized instruction between tutors and learners
  BL:
    name: Duolingo
    src: ../../assets/logos/pp_live/online-tutoring/s01-09.png
    text: adds AI conversation and tutoring features, but most usage remains self-study language learning
  BR:
    name: Varsity Tutors
    src: ../../assets/logos/pp_live/online-tutoring/s01-10.png
    text: offers direct tutoring plus broader classes and school programs, so only part is pure one-to-one tutoring
  caption:
  - Distance to the center reflects how central each company is to online tutoring
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
  - ../../assets/logos/pp_live/online-tutoring/s01-01.png
