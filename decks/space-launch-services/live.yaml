ed142p:
  title: 'What could slow

    space launch down?'
  events:
  - odds: 40
    impact: 2
    text: Small launch startups like Isar Aerospace and RFA struggle to raise money as satellites shift to rideshare
  - odds: 35
    impact: 2
    text: Rocket Lab Neutron or Relativity Terran R suffers a failure on early flights and loses customers
  - odds: 35
    impact: 2
    text: NASA budget cuts cancel science and moon missions that small launch firms counted on
  - odds: 30
    impact: 3
    text: SpaceX Starship reaches full reuse and cuts launch prices so far that rivals cannot compete
  - odds: 30
    impact: 2
    text: Blue Origin New Glenn and ULA Vulcan delays leave Amazon Leo and the Pentagon short of rockets
  - odds: 25
    impact: 2
    text: The FAA slows launch licenses after an accident, stalling flight rates across the US industry
  - odds: 15
    impact: 1
    text: Starlink and Amazon Leo finish deployment and demand for dedicated launches falls off sharply
  - odds: 12
    impact: 3
    text: A Starship explosion damages a launch pad or causes injuries and grounds the program for a year
  note:
  - We listed the events that could slow space launch services down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
