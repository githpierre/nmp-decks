ed007p:
  type: pp_radar
  title: 'What counts as space launch,

    and what only looks like it?'
  TL:
    name: Exolaunch
    src: ../../assets/logos/pp_live/space-launch-services/s01-00.png
    text: books satellites onto SpaceX rideshare flights and builds the deployers that release them, but it has no rocket
  TR:
    name: L3Harris
    src: ../../assets/logos/pp_live/space-launch-services/s01-02.png
    text: makes the RS-25 engines of NASA's SLS moon rocket, but it supplies parts rather than launches and earns most from defense
  BL:
    name: SpaceX
    src: ../../assets/logos/pp_live/space-launch-services/s01-10.png
    text: is by far the busiest launcher on the planet, but Starlink brought in about 61% of its 2025 revenue, against 22% for launch
  BR:
    name: Rocket Lab
    src: ../../assets/logos/pp_live/space-launch-services/s01-11.png
    text: is best known for its Electron rocket, but about two thirds of its 2025 revenue came from satellites and their parts
  caption:
  - Distance to the center reflects how much revenue comes from flying payloads to space on a company’s own rockets
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
