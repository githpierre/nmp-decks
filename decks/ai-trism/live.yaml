ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more companies look up

    AI security, as AI-made attacks grow'
  date: Recently.
  expl: Companies rushed to put AI in everything, then realized chatbots and agents open new doors for attackers. Security teams went looking for ways to
    protect AI models, data and agents.
  term: ai trism
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/ai-trism/ai-trism.csv
ed052p:
  type: pp_cagr
  title: 'How much bigger can

    the AI TRiSM market get?'
  lead: ''
  condition: To get that big, AI security must become a_x000B_standard line in every security budget, and agents_x000B_must move from pilots to daily work
    in most companies. Startups must also stay independent long enough to build_x000B_platforms, and rules in the EU, the US states, and Asia_x000B_must
    keep asking companies to prove their AI is safe.
  note:
  - We compared forecasts from MarketsandMarkets, Gartner, Market Intelo and Meticulous Research
  - We allowed for slower growth as the base gets larger, with all the sources at the end of the report
  size: 3.5
