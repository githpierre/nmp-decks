ed007p:
  type: pp_radar
  title: 'What counts as AI TRISM,

    and what falls outside?'
  TL:
    name: OneTrust
    src: ../../assets/logos/pp_live/ai-trism/s01-00.png
    text: now sells AI governance software, but it was built for privacy and consent, which still drive most of its sales
  TR:
    name: Hugging Face
    src: ../../assets/logos/pp_live/ai-trism/s01-02.png
    text: hosts millions of AI models, but it is a place to build and share them rather than to control their risks
  BL:
    name: Braintrust
    src: ../../assets/logos/pp_live/ai-trism/s01-10.png
    text: tests model outputs, which looks like risk control, but its buyers are AI engineers improving products, not risk teams
  BR:
    name: Datadog
    src: ../../assets/logos/pp_live/ai-trism/s01-11.png
    text: tracks how AI apps behave with LLM Observability, but most of its revenue comes from classic cloud monitoring
  caption:
  - Distance to the center reflects how much a product exists to govern, secure or monitor AI, rather than to build it
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
  - ../../assets/logos/pp_live/ai-trism/s01-01.png
