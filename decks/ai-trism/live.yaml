ed142p:
  title: 'What are the biggest

    threats to AI security?'
  events:
  - odds: 40
    impact: 1
    text: Palo Alto, Cisco and CrowdStrike buy most AI security startups before they reach scale
  - odds: 35
    impact: 3
    text: Microsoft and AWS bundle agent controls and guardrails into their clouds, crushing AI security startups
  - odds: 18
    impact: 3
    text: OpenAI and Anthropic build safety and guardrails into their models, making separate AI security tools redundant
  - odds: 15
    impact: 2
    text: Funding for AI security startups dries up as buyers delay purchases, and many shut down
  - odds: 12
    impact: 2
    text: AI agent pilots stall in large companies, so few buyers need AI security and governance tools yet
  - odds: 10
    impact: 2
    text: Free open-source tools like NeMo Guardrails and Garak replace paid AI security products for most buyers
  - odds: 8
    impact: 2
    text: The EU and US states delay or drop AI rules, so companies spend less on AI governance
  - odds: 5
    impact: 2
    text: A breach at an AI security vendor exposes sensitive prompts and data from its enterprise customers
  note:
  - We listed the events that could slow ai trism down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
