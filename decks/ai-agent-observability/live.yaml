ed007p:
  type: pp_radar
  title: 'Which companies really belong

    in AI agent observability?'
  TL:
    name: Datadog
    src: ../../assets/logos/pp_live/ai-agent-observability/s01-00.png
    text: offers agent observability, but most revenue remains general application and infrastructure monitoring
  TR:
    name: LangChain
    src: ../../assets/logos/pp_live/ai-agent-observability/s01-02.png
    text: builds agent runtimes and orchestration, while observability is only one supporting product in the stack
  BL:
    name: Traceloop
    src: ../../assets/logos/pp_live/ai-agent-observability/s01-09.png
    text: provides agent tracing via OpenLLMetry, but now sits inside a broader ServiceNow AI governance platform
  BR:
    name: Helicone
    src: ../../assets/logos/pp_live/ai-agent-observability/s01-10.png
    text: tracks LLM and agent traffic but also operates as an AI gateway and moved into maintenance mode in 2026
  caption:
  - Distance to the center reflects how central each company is to AI agent observability
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
