ed148p:
  title: 'What pushed B2B payments

    forward, year after year?'
  events:
  - year: '2015'
    text: Federal Reserve prioritizes faster payments
    impact: 1.5
  - year: '2015'
    text: Checks push electronic supplier payments
    impact: 1.0
  - year: '2016'
    text: Same Day ACH speeds vendor credits
    impact: 2.0
  - year: '2017'
    text: Same Day ACH adds debits
    impact: 1.5
  - year: '2017'
    text: RTP launches nonstop instant payment rails
    impact: 2.5
  - year: '2018'
    text: Same Day ACH expands funds availability
    impact: 1.0
  - year: '2019'
    text: Visa launches international B2B network
    impact: 2.0
  - year: '2019'
    text: Visa doubles B2B Connect corridor reach
    impact: 1.0
  - year: '2019'
    text: ACH accelerates credit availability again
    impact: 1.0
  - year: '2020'
    text: Same Day ACH raises payment cap
    impact: 1.5
  - year: '2020'
    text: ACH overtakes checks in payment count
    impact: 2.0
  - year: '2021'
    text: ACH extends same-day processing hours
    impact: 1.5
  - year: '2021'
    text: Same Day ACH reaches billion-payment scale
    impact: 1.0
  - year: '2022'
    text: ACH lifts same-day cap to million
    impact: 2.0
  - year: '2022'
    text: RTP increases instant transfer cap
    impact: 1.5
  - year: '2023'
    text: FedNow adds competing instant payment rails
    impact: 2.5
  - year: '2023'
    text: Same Day ACH exceeds 850 million payments
    impact: 1.0
  - year: '2024'
    text: Same Day ACH crosses billion annually
    impact: 1.5
  - year: '2024'
    text: RTP commits to ten-million-dollar transfers
    impact: 1.5
  - year: '2024'
    text: Checks lose majority of former business share
    impact: 1.5
  - year: '2025'
    text: RTP processes first $10 million payment
    impact: 2.0
  - year: '2025'
    text: FedNow enables million-dollar payments
    impact: 1.5
  - year: '2025'
    text: FedNow raises limit for large businesses
    impact: 2.0
  - year: '2025'
    text: Fedwire switches to richer payment messaging
    impact: 1.5
  - year: '2025'
    text: B2B ACH reaches eight billion payments
    impact: 2.0
  - year: '2026'
    text: ACH business payment volume keeps rising
    impact: 1.0
  - year: '2026'
    text: Same-day ACH volume jumps thirty percent
    impact: 1.5
  - year: '2026'
    text: B2B ACH approaches 2.3 billion quarterly
    impact: 1.5
  - year: '2026'
    text: Visa pilots agent-completed supplier payments
    impact: 2.5
  - year: '2026'
    text: Visa adds commercial payment fraud safeguards
    impact: 1.5
  note:
  - We kept the events we believe pushed b2b payments forward the most
  - Ratings are our estimates, with all the sources at the end of the report
