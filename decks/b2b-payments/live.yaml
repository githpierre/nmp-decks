ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More finance teams google how

    to automate the bills they pay'
  date: Lately.
  expl: AI tools can now read invoices, match them to orders and pay suppliers with little human work. Finance teams under pressure to do more with fewer
    people started searching for accounts payable automation.
  term: b2b payments
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/b2b-payments/b2b-payments.csv
ed052p:
  type: pp_cagr
  title: 'How much room is left

    for B2B payments to grow?'
  lead: 'To fill that room, '
  condition: the market must move the huge share of business payments still made by check and manual bank transfer onto automated platforms. It must also
    make cross-border supplier payments instant and cheap.
  note:
  - We compared forecasts from IMARC, Straits, Mordor and Fortune Business Insights and adjusted each one to our market definition
  - We then built a realistic range from these forecasts, and you will find all the sources we used at the end of the report
  size: null
  cagr: 9
  y0: 2026
