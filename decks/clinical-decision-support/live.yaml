ed007p:
  type: pp_radar
  title: 'What is actually included

    in clinical decision support?'
  TL:
    name: UpToDate
    src: ../../assets/logos/pp_live/clinical-decision-support/s01-00.png
    text: now answers clinical questions with generative AI, but it draws on reference articles, not ona specific patient
  TR:
    name: WebMD
    src: ../../assets/logos/pp_live/clinical-decision-support/s01-02.png
    text: is the best known name in health information, but it writes for consumers checking symptoms, not for clinicians
  BL:
    name: Navina
    src: ../../assets/logos/pp_live/clinical-decision-support/s01-09.png
    text: runs a copilot for primary care doctors, but much of its pitch is finding missed codes that raise risk adjustment pay
  BR:
    name: Epic
    src: ../../assets/logos/pp_live/clinical-decision-support/s01-10.png
    text: builds sepsis and deterioration alerts into its health record, but most of what hospitals pay it for is the record itself
  caption:
  - Distance to the center reflects how directly the software guides care for a specific patient, rather than general advice
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
  - ../../assets/logos/pp_live/clinical-decision-support/s01-01.png
