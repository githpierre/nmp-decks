ed142p:
  title: 'What are the biggest threats

    to clinical decision support?'
  events:
  - odds: 30
    impact: 2
    text: OpenAI and Google offer free clinical answers to doctors, undercutting paid decision support tools
  - odds: 25
    impact: 3
    text: Epic ships its own predictive AI models to most hospitals and blocks outside decision support vendors
  - odds: 20
    impact: 3
    text: UpToDate and OpenEvidence take most doctors, leaving little room for other decision support startups
  - odds: 12
    impact: 2
    text: Medicare refuses to pay for AI decision support tools, so hospitals stop adopting them
  - odds: 12
    impact: 2
    text: Trials show AI decision support does not improve patient outcomes, and hospitals cancel contracts
  - odds: 8
    impact: 2
    text: AI decision support advice harms patients and drives FDA recalls, as JAMA already tied devices to recalls
  - odds: 6
    impact: 2
    text: A data leak at a decision support vendor exposes patient records and hospitals cut vendor links
  - odds: 5
    impact: 3
    text: A US court holds an AI decision support vendor liable for a doctor's harmful decision
  note:
  - We listed the events that could slow clinical decision support down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
