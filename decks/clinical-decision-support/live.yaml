ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people ask if

    AI can really diagnose them'
  date: Lately.
  expl: Chatbots can now explain symptoms in plain words, and doctors began using AI to suggest possible diagnoses. People started searching whether AI
    can really diagnose them.
  term: clinical decision support
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/clinical-decision-support/clinical-decision-support.csv
ed052p:
  type: pp_cagr
  title: 'How much room is left

    for this market to grow?'
  lead: 'To fill that room, '
  condition: AI tools must prove that patients do better, not just that they read scans well, and win more paid codes from Medicare and insurers. It must
    also keep prices up while Epic bundles its own models, and pass the EU AI Act rules due in 2028.
  note:
  - We compared forecasts from Grand View, MarketsandMarkets and Global Insight Services to build a realistic range
  - We weighted classic tools and AI tools by their share of revenue, and all our sources are listed at the end of the report
  size: 6
  cagr: 14
  y0: 2026
