ed007p:
  type: pp_radar
  title: 'Which companies really belong

    in dietary supplements?'
  TL:
    name: Huel
    src: ../../assets/logos/pp_live/dietary-supplements/s01-00.png
    text: provides added nutrients, but it is sold mainly as food and meal replacement rather than dietary supplements
  TR:
    name: Pfizer
    src: ../../assets/logos/pp_live/dietary-supplements/s01-02.png
    text: primarily develops prescription medicines and vaccines, which fall outside consumer dietary supplements
  BL:
    name: Sakara
    src: ../../assets/logos/pp_live/dietary-supplements/s01-09.png
    text: sells supplements alongside prepared meals and wellness programs, so supplements are only one part of the model
  BR:
    name: Bloom
    src: ../../assets/logos/pp_live/dietary-supplements/s01-10.png
    text: sells supplement powders and functional drinks, so part of its business sits in supplements and part in beverages
  caption:
  - Distance to the center reflects how central each company is to dietary supplements
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
