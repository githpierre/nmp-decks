    text: CBD drives botanical experimentation
    impact: 1.0
  - year: '2019'
    text: Microbiome products diversify
    impact: 1.5
  - year: '2020'
    text: Pandemic lifts immunity supplements
    impact: 2.0
  - year: '2021'
    text: Digital subscriptions improve retention
    impact: 1.0
  - year: '2022'
    text: FTC updates health-claim guidance
    impact: 1.5
  - year: '2023'
    text: Creatine broadens beyond bodybuilding
    impact: 2.0
  - year: '2023'
    text: Magnesium becomes daily wellness staple
    impact: 1.5
  - year: '2024'
    text: GLP-1 creates companion nutrition
    impact: 2.0
  - year: '2025'
    text: Sports nutrition keeps strong growth
    impact: 2.0
  - year: '2026'
    text: Protein demand spans life stages
    impact: 2.5
  - year: '2026'
    text: Beauty claims spread through supplements
    impact: 2.0
  - year: '2026'
    text: Fiber becomes foundational wellness
    impact: 1.5
  - year: '2026'
    text: Mandatory listing bill raises transparency
    impact: 1.0
  - year: '2026'
    text: Quality testing becomes purchase signal
    impact: 1.5
  note:
  - We kept the events we believe pushed dietary supplements forward the most
  - Ratings are our estimates, with all the sources at the end of the report
