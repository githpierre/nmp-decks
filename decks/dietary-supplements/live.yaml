    text: Ephedra ban sharpens safety focus
    impact: 1.5
  - year: '2006'
    text: Adverse-event reporting strengthens trust
    impact: 1.5
  - year: '2007'
    text: FDA issues supplement GMP rule
    impact: 2.5
