  title: 'Who Is in payment processing,

    and who stays outside?'
  TL:
    name: Wise
    src: ../../assets/logos/pp_live/foundation-model/s01-00.png
    text: moves money cross-border for consumers and businesses, but merchant payment processing is not its core
  TR:
    name: QuickBooks
    src: ../../assets/logos/pp_live/foundation-model/s01-01.png
    text: records accounting activity and can accept payments, but accounting software is outside processing
  BL:
    name: PayPal
    src: ../../assets/logos/pp_live/foundation-model/s01-10.png
    text: processes merchant payments, while a large share of the business is a consumer wallet and checkout brand
  BR:
    name: Block
    src: ../../assets/logos/pp_live/foundation-model/s01-11.png
    text: square processes merchant payments, while Block also owns Cash App and other consumer financial products
