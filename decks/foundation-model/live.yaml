ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'The term foundation model is more and

    more popular as companies build on them'
  date: In recent months.
  expl: Foundation models are the big AI models that power chatbots, coding tools and agents. As every company started building on them, and governments
    wrote rules about them, the term moved from research papers to business news. Searches jumped and stayed high.
  term: foundation model
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/foundation-model/foundation-model.csv
ed052p:
  type: pp_cagr
  title: 'Is the foundation model

    market still growing fast?'
  lead: ''
  condition: Yes, but model makers must turn coding, voice, and work agents into daily tools for most firms, and keep consumers paying for chat plans. They
    must also cut the cost of compute, settle the copyright fights, avoid a safety scandal that brings strict rules, and reach a profit before investors
    lose patience.
  note:
  - We compared forecasts from Grand View, Precedence, Mordor and Next Move and adjusted each one to our market definition
  - We then built a realistic range from these forecasts, and you will find all the sources we used at the end of the report
  size: null
  cagr: 22
  y0: 2026
