ed142p:
  title: 'What could go wrong

    for foundation models?'
  events:
  - odds: 45
    impact: 3
    text: Open weight models from DeepSeek, Qwen and Mistral close the gap and crush API prices for everyone
  - odds: 40
    impact: 3
    text: Training costs for top models pass 10 billion dollars and only three or four labs compete
  - odds: 40
    impact: 2
    text: The EU AI Act general purpose model rules force audits and disclosures that delay European launches
  - odds: 35
    impact: 2
    text: Big tech like Google and Microsoft bundle models for free in cloud and office suites
  - odds: 30
    impact: 1
    text: GPU and power shortages delay training runs at smaller labs like Cohere and Reflection AI
  - odds: 25
    impact: 2
    text: Scaling returns flatten and new models bring small gains, so enterprise buyers stop upgrading
  - odds: 20
    impact: 3
    text: US courts rule that training on copyrighted books and news needs licenses, adding billions in costs
  - odds: 6
    impact: 3
    text: A model is used in a major bioweapon or cyber incident and governments impose licensing
  note:
  - We listed the events that could slow foundation model down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
