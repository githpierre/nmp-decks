    text: Cross River supports Coinbase ACH
    impact: 1.0
  - year: '2016'
    text: Shopify Capital embeds merchant lending
    impact: 2.0
  - year: '2016'
    text: Cross River launches API bank core
    impact: 2.0
  - year: '2018'
    text: Stripe launches card issuing
    impact: 2.0
  - year: '2018'
    text: Cross River processes Stripe cards
    impact: 1.5
  - year: '2019'
    text: Apple Card validates embedded finance
    impact: 2.0
  - year: '2019'
    text: Adyen launches issuing capabilities
    impact: 1.5
  - year: '2020'
    text: Stripe launches Treasury for platforms
    impact: 2.0
  - year: '2020'
    text: Shopify scales merchant finance
