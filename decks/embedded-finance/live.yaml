    text: AI agents get virtual cards
    impact: 1.5
  - year: '2026'
    text: Stripe launches Treasury for agents
    impact: 2.5
  - year: '2026'
    text: Stripe expands Treasury internationally
    impact: 2.0
  - year: '2026'
    text: Stablecoins enter embedded business stacks
    impact: 2.0
  note:
  - We kept the events we believe pushed embedded finance forward the most
  - Ratings are our estimates, with all the sources at the end of the report
