  - year: '2020'
    text: Pandemic accelerates digital platforms
    impact: 2.0
  - year: '2021'
    text: Stripe Issuing expands in Europe
    impact: 1.5
  - year: '2021'
    text: Embedded finance attracts banks
    impact: 1.5
  - year: '2022'
    text: Platforms bundle more financial services
    impact: 1.5
  - year: '2023'
    text: FedNow improves embedded money movement
    impact: 1.5
  - year: '2023'
    text: Cross River adds FedNow interoperability
    impact: 2.0
  - year: '2024'
    text: Synapse collapse exposes middleware risk
    impact: 2.5
  - year: '2024'
    text: Fed targets Evolve fintech controls
    impact: 2.0
  - year: '2024'
    text: FDIC proposes daily reconciliation
    impact: 2.0
  - year: '2024'
    text: Blue Ridge faces OCC enforcement
    impact: 1.5
  - year: '2025'
    text: CFPB acts against Synapse
    impact: 1.5
  - year: '2025'
    text: Cross River powers X Money
    impact: 2.0
