ed007p:
  type: pp_radar
  title: 'Who is In embedded finance,

    and who stays outside?'
  TL:
    name: Plaid
    src: ../../assets/logos/pp_live/embedded-finance/s01-00.png
    text: connects financial data and accounts, but generally does not itself deliver the embedded financial service
  TR:
    name: Salesforce
    src: ../../assets/logos/pp_live/embedded-finance/s01-02.png
    text: can host fintech workflows, but it is enterprise CRM software rather than embedded finance infrastructure
  BL:
    name: Margeta
    src: ../../assets/logos/pp_live/embedded-finance/s01-09.png
    text: enables embedded cards and credit, while its core identity remains card issuing and processing infrastructure
  BR:
    name: Stripe
    src: ../../assets/logos/pp_live/embedded-finance/s01-10.png
    text: powers embedded payments and finance features, while most revenue also comes from standalone payment services
  caption:
  - Distance to the center reflects how central each company is to embedded finance
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
  - ../../assets/logos/pp_live/embedded-finance/s01-01.png
