ed142p:
  title: 'What are the biggest

    threats to AI safety?'
  events:
  - odds: 45
    impact: 3
    text: OpenAI, Google and Anthropic build evals in house, leaving little room for outside testing startups
  - odds: 40
    impact: 2
    text: The EU delays and softens AI Act general purpose model obligations, cutting demand for compliance audits
  - odds: 40
    impact: 2
    text: Enterprises treat AI safety tools as optional and buy them only when regulators or insurers demand
  - odds: 30
    impact: 2
    text: The White House cuts the budget and staff of the Center for AI Standards and Innovation further
  - odds: 25
    impact: 2
    text: Interpretability and red teaming methods fail to catch deceptive behavior in frontier models, hurting credibility
  - odds: 20
    impact: 3
    text: Congress passes federal AI preemption, wiping out California SB 53 and New York RAISE Act safety rules
  - odds: 15
    impact: 1
    text: Safety research nonprofits lose funding as Coefficient Giving and other donors shift grants toward other causes
  - odds: 10
    impact: 3
    text: A major AI-enabled cyberattack or bioweapon scare triggers rushed laws that favor big labs over startups
  note:
  - We listed the events that could slow ai safety down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
