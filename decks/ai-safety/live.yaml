ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more parents search

    for AI safety, as chatbot worries grow'
  date: Recently.
  expl: AI got powerful fast, and so did the worries. Lawsuits about chatbots and teen suicides, deepfake scams and warnings from AI leaders hit the headlines,
    and governments rushed to write rules. AI safety became a question for parents, not only researchers.
  term: ai safety
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/ai-safety/ai-safety.csv
ed052p:
  type: pp_cagr
  title: 'How much room is left

    for AI safety to grow?'
  lead: 'To fill that room, '
  condition: the market must make AI agents safe enough to run real work, and turn new laws and insurance rules into steady budgets. It must also prove
    that safety tools cut real losses, and keep startups alive as large platforms bundle the same features.
  note:
  - We compared forecasts from Gartner, MarketsandMarkets, Grand View and Fortune Business Insights
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: null
  cagr: 30
  y0: 2028
