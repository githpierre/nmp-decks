ed148p:
  title: 'What pushed the cloud infrastructure

    market forward, year after year?'
  events:
  - year: '1999'
    text: VMware virtualization makes servers shareable
    impact: 1.5
  - year: '2004'
    text: Amazon SQS makes infrastructure programmable
    impact: 1.5
  - year: '2006'
    text: AWS S3 makes storage pay per use
    impact: 3.0
  - year: '2006'
    text: AWS EC2 makes computing rentable on demand
    impact: 3.0
  - year: '2008'
    text: Google App Engine broadens cloud competition
    impact: 2.0
  - year: '2009'
    text: Alibaba Cloud brings competition to China
    impact: 1.5
  - year: '2010'
    text: Azure brings Microsoft's customers into cloud
    impact: 2.5
  - year: '2010'
    text: OpenStack makes private clouds accessible
    impact: 2.0
  - year: '2011'
    text: NIST defines cloud to reduce confusion
    impact: 1.0
  - year: '2011'
    text: US cloud-first policy legitimizes migration
    impact: 1.5
  - year: '2012'
    text: DynamoDB makes databases easier to scale
    impact: 1.0
  - year: '2013'
    text: Docker makes applications easier to move
    impact: 2.0
  - year: '2014'
    text: Kubernetes simplifies container orchestration
    impact: 2.5
  - year: '2014'
    text: AWS Lambda removes routine server management
    impact: 2.5
  - year: '2015'
    text: Cloud price wars pressure hosting costs
    impact: 2.0
  - year: '2016'
    text: Netflix proves global cloud scalability
    impact: 2.0
  - year: '2017'
    text: Fargate removes container server management
    impact: 1.5
  - year: '2018'
    text: EKS lowers Kubernetes adoption friction
    impact: 1.5
  - year: '2019'
    text: AWS CDK makes infrastructure programmable
    impact: 1.0
  - year: '2020'
    text: Pandemic boosts cloud capacity demand
    impact: 2.0
  - year: '2021'
    text: Cloud bills increase cost scrutiny
    impact: 1.0
  - year: '2023'
    text: Azure OpenAI makes model hosting mainstream
    impact: 2.0
  - year: '2023'
    text: Bedrock boosts cloud AI compute demand
    impact: 2.0
  - year: '2024'
    text: Aurora DSQL preview pushes managed databases
    impact: 1.0
  - year: '2025'
    text: Stargate validates massive AI infrastructure
    impact: 2.0
  - year: '2025'
    text: Oracle agreement expands planned AI capacity
    impact: 1.5
  - year: '2026'
    text: Ironwood gives cloud AI more choices
    impact: 1.5
  - year: '2026'
    text: Virgo targets AI network bottlenecks
    impact: 2.0
  - year: '2026'
    text: Distributed Cloud eases sovereignty limits
    impact: 1.5
  - year: '2026'
    text: Google Oracle pact widens TPU access
    impact: 1.5
  note:
  - We kept the events we believe pushed cloud infrastructure forward the most
  - Ratings are our estimates, with all the sources at the end of the report
