ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More people look up cloud GPUs

    as AI eats up computing power'
  date: Lately.
  expl: Training and running AI models needs powerful GPUs that few companies can buy. Startups and developers started renting them by the hour from cloud
    providers and new GPU clouds like CoreWeave, and searches kept climbing.
  term: cloud infrastructure
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/cloud-infrastructure/cloud-infrastructure.csv
ed052p:
  type: pp_cagr
  title: 'How much bigger can

    cloud infrastructure get?'
  lead: ''
  condition: To get that big, the market must turn record AI spending on data centers and chips into rented capacity that customers keep paying for. It
    must also find enough power and sites to build it without long delays.
  note:
  - We compared forecasts from Synergy Research Group, Gartner, IDC and MarketsandMarkets
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: 530
  cagr: 15
  y0: 2026
