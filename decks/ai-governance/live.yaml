ed007p:
  type: pp_radar
  title: 'What makes a company

    part of AI governance?'
  TL:
    name: OneTrust
    src: ../../assets/logos/pp_live/ai-governance/s01-00.png
    text: is in Gartner's first Magic Quadrant for AI governance, but it built its business on privacy and cookie consent software
  TR:
    name: Datadog
    src: ../../assets/logos/pp_live/ai-governance/s01-02.png
    text: tracks the latency, cost and errors of LLM apps, but monitoring a model's performance is not enforcing AI policy
  BL:
    name: ServiceNow
    src: ../../assets/logos/pp_live/ai-governance/s01-10.png
    text: launched AI Control Tower to govern a company’s AI agents, but it remains a workflow platform known for IT tickets
  BR:
    name: Vanta
    src: ../../assets/logos/pp_live/ai-governance/s01-11.png
    text: added the ISO 42001 standard for AI management, but it is mainly software to pass security audits like SOC 2 and ISO 27001
  caption:
  - Distance to the center reflects how much a product exists to prove and enforce control over AI, rather than general security
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
