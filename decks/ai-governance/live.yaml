ed052p:
  type: pp_cagr
  title: 'Is AI governance

    still growing fast?'
  lead: ''
  condition: Yes, but the market must turn new AI laws and agent risks into yearly budgets, as firms move governance from documents to software. It must
    also stay independent from big platforms that bundle governance for free, and prove that its controls really prevent AI incidents.
  note:
  - We compared forecasts from Mordor, Straits, Fortune Business Insights and The Business Research Company
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: null
  cagr: 28
  y0: 2026
