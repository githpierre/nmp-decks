ed142p:
  title: 'What are the biggest

    threats to AI governance?'
  events:
  - odds: 50
    impact: 3
    text: ServiceNow, IBM and Microsoft bundle AI governance into existing platforms, squeezing Credo AI and similar startups
  - odds: 40
    impact: 2
    text: More states copy Colorado in dropping AI bias duties, leaving few laws that require governance tools
  - odds: 35
    impact: 2
    text: Buyers treat AI governance as a checklist feature and refuse to pay more than $20,000 a year
  - odds: 30
    impact: 1
    text: ISO 42001 certification becomes cheap and standardized, so audit firms like Deloitte capture most spending
  - odds: 25
    impact: 3
    text: Federal preemption and DOJ lawsuits wipe out Colorado and California AI laws, so fewer buyers need governance
  - odds: 25
    impact: 2
    text: Venture investors cool on compliance software after slow sales cycles, so governance startups struggle to raise
  - odds: 20
    impact: 3
    text: The EU delays AI Act high risk rules beyond December 2027, pushing back compliance budgets again
  - odds: 10
    impact: 2
    text: A governance platform certifies a model that later causes a scandal, and customers question these tools
  note:
  - We listed the events that could slow ai governance down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
