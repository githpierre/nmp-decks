ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'Procurement software searches exploded

    as AI starts buying for companies'
  date: Lately.
  expl: Tariffs and supply shocks pushed companies to watch every purchase more closely. New AI tools promise to compare suppliers, negotiate and handle
    purchase orders, and finance and operations teams went searching for procurement software.
  term: procurement software
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/procurement-software/procurement-software.csv
ed052p:
  type: pp_cagr
  title: 'Is the procurement software

    market still growing fast?'
  lead: ''
  condition: Yes, but the market must win mid-size companies, not just the Fortune 500, and prove that AI intake and supplier tools cut real spend every
    quarter instead of adding another layer on top of the ERP.
  note:
  - We compared forecasts from Grand View, Polaris Market Research, IMARC and Global Market Insights
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: 10
  cagr: 9
  y0: 2026
