ed148p:
  title: 'What pushed the procurement software

    market forward, year after year?'
  events:
  - year: '1996'
    text: Ariba pioneers internet based purchasing
    impact: 2.5
  - year: '1997'
    text: Ariba Buyer digitizes purchase requests
    impact: 2.0
  - year: '1999'
    text: Ariba Network connects corporate suppliers
    impact: 2.5
  - year: '1999'
    text: SAP enters internet procurement race
    impact: 2.0
  - year: '2001'
    text: Ariba Sourcing moves bids online
    impact: 1.5
  - year: '2004'
    text: Ariba adds FreeMarkets sourcing tools
    impact: 2.0
  - year: '2006'
    text: Coupa brings spend controls to cloud
    impact: 2.0
  - year: '2007'
    text: Ariba buys Procuri to expand SaaS
    impact: 1.5
  - year: '2010'
    text: Ariba targets larger global supplier networks
    impact: 1.5
  - year: '2011'
    text: Quadrem deal expands supplier network
    impact: 2.0
  - year: '2011'
    text: Ariba cloud connects 700000 businesses
    impact: 1.5
  - year: '2012'
    text: SAP buys Ariba validating cloud procurement
    impact: 3.0
  - year: '2014'
    text: EU requires public sector electronic invoices
    impact: 1.5
  - year: '2015'
    text: Amazon Business introduces purchase approvals
    impact: 1.5
  - year: '2016'
    text: Coupa IPO legitimizes cloud spend control
    impact: 2.5
  - year: '2017'
    text: Coupa buys AI spend classification
    impact: 1.5
  - year: '2018'
    text: Coupa brings services procurement into cloud
    impact: 1.5
  - year: '2020'
    text: Supplier diversity enters spend software
    impact: 1.5
  - year: '2020'
    text: Pandemic reinforces remote buying controls
    impact: 2.0
  - year: '2021'
    text: Chip crisis forces supplier risk tracking
    impact: 2.0
  - year: '2022'
    text: War forces firms to diversify sourcing
    impact: 2.0
  - year: '2022'
    text: Coupa buyout values spend software highly
    impact: 1.5
  - year: '2023'
    text: Coupa takeover brings private capital
    impact: 1.5
  - year: '2024'
    text: EU passes supply chain due diligence
    impact: 1.5
  - year: '2025'
    text: DORA mandates ICT supplier registers
    impact: 1.5
  - year: '2025'
    text: Coupa adds AI category strategy capabilities
    impact: 1.5
  - year: '2025'
    text: Coupa integrates automated supplier discovery
    impact: 1.5
  - year: '2026'
    text: SAP launches rebuilt Ariba platform
    impact: 2.5
  - year: '2026'
    text: Coupa buys Rossum to automate invoices
    impact: 2.0
  - year: '2026'
    text: SAP releases unified spend analytics
    impact: 2.0
  note:
  - We kept the events we believe pushed procurement software forward the most
  - Ratings are our estimates, with all the sources at the end of the report
