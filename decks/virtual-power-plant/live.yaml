    text: Texas outages boost resilience demand
    impact: 1.0
  - year: '2022'
    text: Battery costs improve VPP economics
    impact: 1.0
  - year: '2022'
    text: California launches emergency flexibility pro
    impact: 2.0
  - year: '2023'
    text: DOE sets VPP commercialization targets
    impact: 1.0
  - year: '2023'
    text: Utilities expand bring-your-own-device progra
    impact: 1.0
  - year: '2024'
    text: CAISO completes Order 2222 implementation
    impact: 1.5
  - year: '2024'
    text: Sunrun expands utility VPP contracts
    impact: 3.0
  - year: '2025'
    text: DOE publishes VPP liftoff update
    impact: 1.0
  - year: '2025'
    text: Interoperability becomes scaling priority
    impact: 1.5
  - year: '2025'
    text: More utilities pay battery owners
    impact: 2.0
  - year: '2026'
    text: ISO-NE opens DER aggregation markets
    impact: 1.0
  - year: '2026'
    text: NYISO targets full Order 2222 implementation
    impact: 1.5
  - year: '2026'
    text: Thailand tests automated VPP dispatch
    impact: 2.0
  - year: '2026'
    text: Con Edison launches battery program
    impact: 1.0
  - year: '2026'
    text: Tesla expands utility VPP coverage
    impact: 3.0
  - year: '2026'
    text: VPPs coordinate more mixed assets
    impact: 1.0
  - year: '2026'
    text: Grid stress raises flexibility value
    impact: 1.0
  note:
  - We kept the events we believe pushed virtual power plant forward the most
  - Ratings are our estimates, with all the sources at the end of the report
