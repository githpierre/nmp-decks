ed148p:
  title: 'What pushed the virtual power plant

    market forward, year after year?'
  events:
  - year: '2000'
    text: Demand response proves flexible load value
    impact: 1.5
  - year: '2005'
    text: Smart meters enable remote dispatch
    impact: 1.0
  - year: '2008'
    text: Rooftop solar expands distributed resources
    impact: 1.0
