    text: Utility pilots aggregate mixed devices
    impact: 1.5
  - year: '2019'
    text: EV charging joins flexible load programs
    impact: 2.0
  - year: '2020'
    text: FERC 2222 opens wholesale markets
    impact: 1.0
  - year: '2021'
    text: Order 2222 updates implementation rules
    impact: 1.5
