- type: maturity
  section: Market definition
  title: 'How mature is EdTech

    as a market?'
  score: 62
  text: The market is real because schools, companies, and learners spend about $192 billion a year, and leaders like Duolingo earn over $1 billion. The score is not higher because AI changes products every year, school budgets are tight, and many startups still struggle to sell.
  note:
  - We compare market maturity with a simple internal score, based on tech progress and disruptions
  - The score is directional, not exact to the point, but it stays clearer than vague labels
