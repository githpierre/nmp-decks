  title: 'Where in the world is

    nuclear fusion money spent?'
  regions:
    na:
      pct: 48
      text: North America leads, with most private fusion startups and the largest rounds raised so far.
    eu:
      pct: 24
      text: Europe relies on public programs and a few startups, with ITER in France as its anchor.
    apac:
      pct: 21
      text: Asia-Pacific grows with China and Japan, where the state funds large test reactors.
    latam:
      pct: 2
      text: Latin America has almost no fusion spending yet, outside of research labs.
    mea:
      pct: 5
      text: The Middle East funds a few partnerships, mostly to diversify away from oil.
  note: 'Workshop case: the shares and texts are illustrative, only the shape of the lines matters here'
  curve: s
