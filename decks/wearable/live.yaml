ed142p:
  title: 'What could slow

    wearables down?'
  events:
  - odds: 45
    impact: 3
    text: Apple and Samsung keep adding free health features like blood pressure alerts, squeezing Oura and Whoop subscriptions
  - odds: 35
    impact: 2
    text: More patent fights like Oura's ITC win against Ultrahuman block US sales of rings and smartwatches
  - odds: 35
    impact: 2
    text: Tariffs on Chinese electronics raise wearable prices by 20% and slow sales for Fitbit, Garmin and startups
  - odds: 30
    impact: 2
    text: Meta and Google ship cheap AI glasses that pull buyers away from rings, bands and pins
  - odds: 30
    impact: 2
    text: Humane-style flops make investors wary, and AI wearable startups fail to raise their next round
  - odds: 30
    impact: 1
    text: Users drop devices after a few months and subscription models from Oura and Whoop see churn rise
  - odds: 20
    impact: 3
    text: A data breach exposes health data from millions of fitness trackers and states pass strict privacy laws
  - odds: 10
    impact: 2
    text: The FDA warns Whoop and others again over blood pressure features sold without medical device clearance
  note:
  - We listed the events that could slow wearable down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
