ed052p:
  type: pp_cagr
  title: 'How much room is left

    for this market to grow?'
  lead: 'To fill that room, '
  condition: the market must turn glasses into a daily habit for hundreds of millions of people, the way earbuds did after 2016. It 7 must also prove health
    value, so that insurers, employers, and Medicare pay for the devices and memberships people keep using.
  note:
  - We compared forecasts from Grand View, Fortune Business Insights, MarketsandMarkets and Market.us with IDC unit data
  - We adjusted each one to our market definition to build a realistic range, and all our sources are listed at the end of the report
  size: 100
  cagr: 9
  y0: 2026
