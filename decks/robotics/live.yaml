ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More people ask how much a robot

    costs, now that preorders are open'
  date: Over the past year.
  expl: 'Robots started to look like products you can buy. Unitree showed a humanoid under $6,000, 1X opened preorders for a home robot at $20,000, and
    Tesla kept promising Optimus. Once robots had a price, the next question was obvious: how much?'
  term: robotics
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/robotics/robotics.csv
