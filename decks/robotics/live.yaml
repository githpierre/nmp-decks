ed142p:
  title: 'What are the biggest

    threats to robotics?'
  events:
  - odds: 50
    impact: 2
    text: Tesla Optimus misses production targets again, and investors pull back from humanoid robot funding rounds
  - odds: 45
    impact: 3
    text: Unitree and Chinese makers ship humanoids at scale for under $10,000, crushing US and European startup margins
  - odds: 35
    impact: 2
    text: US tariffs on Chinese motors, sensors and rare earth magnets raise robot hardware costs by 30%
  - odds: 30
    impact: 2
    text: Robot foundation models from Google DeepMind and Nvidia fail to generalize, so pilots stay stuck in demos
  - odds: 30
    impact: 1
    text: More big buyers copy Amazon and build robots in house, closing large warehouse accounts to startups
  - odds: 25
    impact: 3
    text: China restricts rare earth magnet exports again, halting actuator supply for Figure, Agility and Apptronik
  - odds: 20
    impact: 1
    text: High interest rates keep customers leasing instead of buying, stretching robotics startups' cash runways
  - odds: 15
    impact: 3
    text: A humanoid robot injures a worker in a warehouse, prompting OSHA rules that slow deployments
  note:
  - We listed the events that could slow robotics down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
