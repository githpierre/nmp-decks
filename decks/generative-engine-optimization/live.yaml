ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'Brands started googling how

    to show up in AI answers'
  date: x 7 than in a typical week before Lately.
  expl: Google AI Overviews, ChatGPT and Perplexity started answering questions directly. Brands saw fewer clicks from search, and a wave of startups launched
    tools that track and raise how often AI answers mention them.
  term: generative engine optimization
  note:
  - We tracked how often people around the world googled this term on Google Trends
  - We used the last five years of searches, and all the sources are included at the end of the report
  csv: assets/trends/generative-engine-optimization/generative-engine-optimization.csv
