ed142p:
  title: 'What could go wrong

    for digital health?'
  events:
  - odds: 45
    impact: 3
    text: Epic bundles AI agents and native AI notes for free, crushing standalone digital health tools inside hospitals
  - odds: 35
    impact: 3
    text: UnitedHealth, CVS, Amazon and Epic build their own care and AI tools and cut startups out
  - odds: 30
    impact: 3
    text: Employers and insurers cancel diabetes and blood pressure app contracts after Peterson studies find higher costs
  - odds: 25
    impact: 2
    text: Free ChatGPT and Gemini health answers replace paid symptom checker and coaching apps for most consumers
  - odds: 20
    impact: 2
    text: Another breach on the scale of Change Healthcare exposes millions of records and freezes digital health deals
  - odds: 15
    impact: 2
    text: Digital health funding dries up for everyone except a few AI leaders, and many startups shut down
  - odds: 15
    impact: 2
    text: An AI scribe or health chatbot seriously harms a patient and triggers lawsuits and new FDA scrutiny
  - odds: 10
    impact: 3
    text: Congress lets Medicare telehealth flexibilities expire, cutting virtual care visits and revenue for digital health firms
  note:
  - We listed the events that could slow digital health down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
