ed052p:
  type: pp_cagr
  title: 'How much room is left

    for this market to grow?'
  lead: 'To fill that room, '
  condition: AI must move from writing notes to doing real clinical and admin work in most hospitals, and patients must keep using care at home. Payers
    must also make telehealth and monitoring payments permanent and reward the tools that prove they lower costs.
  note:
  - We compared forecasts from Grand View, Fortune Business Insights, Mordor and Precedence
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: 420
  cagr: 13
  y0: 2026
