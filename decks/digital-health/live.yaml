  title: 'What makes a company

    part of digital health?'
  TL:
    name: Philips
    src: ../../assets/logos/pp_live/digital-health/s01-00.png
    text: builds connected monitors and telehealth tools for hospitals, but it is a hardware group that also sells shavers
  TR:
    name: Strava
    src: ../../assets/logos/pp_live/digital-health/s01-02.png
    text: tracks the workouts of over 190 million registered athletes, but fitness with no medical use case is not digital health
  BL:
    name: Noom
    src: ../../assets/logos/pp_live/digital-health/s01-10.png
    text: started as a diet app, but its clinicians now prescribe GLP-1 weight loss drugs through the app, so it sits on the line
  BR:
    name: Alan
    src: ../../assets/logos/pp_live/digital-health/s01-11.png
    text: is a health insurer at heart, but its app bundles doctor chat and prevention tools, which puts it right on tins GleIsJe
