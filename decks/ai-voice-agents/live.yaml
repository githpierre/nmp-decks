ed142p:
  title: 'What could go wrong

    for AI voice agents?'
  events:
  - odds: 25
    impact: 1
    text: Large buyers acquire the best voice agent startups early, as with Cognigy and PlayAI, at modest prices
  - odds: 20
    impact: 3
    text: NICE, Five9, Microsoft and Salesforce bundle voice agents free in their contact center suites
  - odds: 18
    impact: 2
    text: Model prices keep falling and buyers compare price per minute, so voice agent margins disappear
  - odds: 15
    impact: 3
    text: OpenAI, Google and ElevenLabs sell complete voice agents directly, cutting out voice agent startups
  - odds: 12
    impact: 2
    text: AI voice agents fail to resolve most calls, and companies send customers back to human agents
  - odds: 10
    impact: 2
    text: The FCC and EU pass strict consent and disclosure rules that sharply limit AI outbound calling
  - odds: 8
    impact: 2
    text: An AI voice agent gives harmful advice on a recorded call that goes viral and scares buyers
  - odds: 5
    impact: 2
    text: A voice cloning fraud scandal makes callers refuse AI agents and pushes banks to ban them
  note:
  - We listed the events that could slow ai voice agents down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
