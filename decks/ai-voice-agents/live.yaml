ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people look up AI

    phone agents that answer calls for them'
  date: Lately.
  expl: AI that answers the phone and holds a real conversation went from demo to product. Startups began selling it to restaurants, clinics and call centers,
    and businesses started searching for how to put one on their own phone line.
  term: ai voice agents
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/ai-voice-agents/ai-voice-agents.csv
ed052p:
  type: pp_cagr
  title: 'How fast can voice

    AI really grow?'
  lead: ''
  condition: To grow this fast, voice agents must keep moving from pilots to whole contact centers, and drive-thrus, hospitals, and small businesses must
    keep adopting them. They must also stay reliable with real callers and keep their share of revenue as incumbents bundle voice into their suites.
  note:
  - We compared forecasts from Grand View Research, NICE and Twilio with the leaders’ growth
  - We allowed for consolidation and pricing pressure, with all the sources at the end of the report
  size: 2.6
  cagr: 33
  y0: 2026
