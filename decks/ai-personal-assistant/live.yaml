ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'Searches for AI personal assistants

    climb as AI starts doing tasks'
  date: Lately.
  expl: 'Chatbots learned to act, not only answer: booking, sending emails and filling in forms. New agents from OpenAI and others, plus AI built into phones,
    made people search for an assistant that can handle their daily tasks.'
  term: ai personal assistant
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/ai-personal-assistant/ai-personal-assistant.csv
ed052p:
  type: pp_cagr
  title: 'At what pace will

    AI assistants grow?'
  lead: ''
  condition: To keep that pace, the market must get people to pay for an assistant that safely acts across their email, calendar and apps, and turn free
    chatbot use into paid habits beyond the few percent who pay today.
  note:
  - We compared forecasts from The Business Research Company, Technavio, Grand View and Menlo Ventures
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: 5
  cagr: 25
  y0: 2026
