    text: Retail media improves delivery economics
    impact: 1.0
  - year: '2024'
    text: Robots move from campuses to streets
    impact: 1.5
  - year: '2024'
    text: AI improves dispatch and batching
    impact: 3.0
  - year: '2025'
    text: Merchant integrations reduce order errors
    impact: 1.0
  - year: '2025'
    text: Autonomous fleets expand city testing
    impact: 1.5
  - year: '2025'
    text: Retailers seek faster local fulfillment
    impact: 2.0
  - year: '2026'
    text: DoorDash unveils purpose-built delivery drone
    impact: 1.0
  - year: '2026'
    text: DoorDash expands autonomous robot pilots
    impact: 1.5
  - year: '2026'
    text: Weather testing targets year-round autonomy
    impact: 2.0
  - year: '2026'
    text: Local businesses gain drone delivery option
    impact: 1.0
  - year: '2026'
    text: Autonomous systems handle complex handoffs
    impact: 3.0
  - year: '2026'
    text: Delivery platforms digitize physical operatio
    impact: 1.0
  - year: '2026'
    text: Robot fleets build real-world training data
    impact: 1.0
  note:
  - We kept the events we believe pushed last mile delivery forward the most
  - Ratings are our estimates, with all the sources at the end of the report
