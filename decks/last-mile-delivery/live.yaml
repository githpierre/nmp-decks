    text: Uber launches app-based delivery
    impact: 1.0
  - year: '2015'
    text: Amazon Flex expands gig delivery
    impact: 1.0
  - year: '2016'
    text: Retailers add ship-from-store fulfillment
    impact: 1.5
  - year: '2017'
    text: Micro-fulfillment shortens delivery distances
    impact: 2.0
