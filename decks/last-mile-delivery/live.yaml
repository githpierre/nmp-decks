ed148p:
  title: 'What pushed the last-mile delivery

    market forward, year after year?'
  events:
  - year: '1999'
    text: Ecommerce raises home delivery demand
    impact: 1.5
  - year: '2005'
    text: Route software improves courier density
    impact: 1.0
  - year: '2007'
    text: Smartphones enable app-based dispatch
    impact: 1.0
