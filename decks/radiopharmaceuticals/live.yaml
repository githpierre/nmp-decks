ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'Radioligand therapy searches surge

    as big pharma bets billions on it'
  date: Lately.
  expl: Novartis showed with Pluvicto that radioactive drugs can find and kill cancer cells. Big pharma then bought radiopharma startups for billions, and
    patients and investors went looking for how radioligand therapy works.
  term: radiopharmaceuticals
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/radiopharmaceuticals/radiopharmaceuticals.csv
ed052p:
  type: pp_cagr
  title: 'How much bigger can

    radiopharmaceuticals get?'
  lead: ''
  condition: To get that big, the market must secure enough isotopes like lutetium and actinium to treat patients at scale. It must also build the hospital
    teams and delivery networks to give these short-lived drugs on time.
  note:
  - We compared forecasts from MarketsandMarkets, Polaris Market Research, IMARC and Market.us
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: 12
  cagr: 12
  y0: 2026
