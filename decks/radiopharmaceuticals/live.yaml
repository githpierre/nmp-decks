ed148p:
  title: 'What pushed the radiopharmaceuticals

    market forward, year after year?'
  events:
  - year: '1936'
    text: Radioactive tracers enter human testing
    impact: 1.0
  - year: '1940'
    text: Reactors expand medical isotope supply
    impact: 1.5
  - year: '1948'
    text: Abbott distributes isotopes to hospitals
    impact: 1.0
  - year: '1950'
    text: Commercial tracers enable cardiac imaging
    impact: 1.5
  - year: '1951'
    text: FDA approval legitimizes radioactive medicine
    impact: 2.0
  - year: '1957'
    text: Technetium generators widen isotope access
    impact: 3.0
  - year: '1964'
    text: Technetium tracers broaden clinical demand
    impact: 1.5
  - year: '1969'
    text: Gallium tumor uptake enables cancer scans
    impact: 1.0
  - year: '1970'
    text: Instant kits speed isotope preparation
    impact: 2.0
  - year: '1970'
    text: FDA drug rules professionalize radioagents
    impact: 1.5
  - year: '1993'
    text: Strontium therapy addresses bone pain
    impact: 1.0
  - year: '1997'
    text: Samarium extends bone-metastasis treatment
    impact: 1.0
  - year: '2002'
    text: Zevalin validates radioactive antibodies
    impact: 2.0
  - year: '2013'
    text: Xofigo validates alpha cancer therapy
    impact: 2.5
  - year: '2017'
    text: Novartis buys radioligand production know-how
    impact: 1.5
  - year: '2018'
    text: Lutathera proves radioligands work
    impact: 3.0
  - year: '2018'
    text: Azedra expands rare-cancer isotope therapy
    impact: 1.0
  - year: '2018'
    text: Novartis buys PSMA therapy pipeline
    impact: 1.5
  - year: '2022'
    text: Pluvicto unlocks prostate radioligand demand
    impact: 3.0
  - year: '2023'
    text: Posluma adds prostate cancer scan choice
    impact: 1.0
  - year: '2023'
    text: Lilly buys POINT, validating radio oncology
    impact: 2.0
  - year: '2023'
    text: BMS buys RayzeBio, backing alpha platforms
    impact: 2.0
  - year: '2024'
    text: AstraZeneca buys Fusion radiopharma
    impact: 2.0
  - year: '2024'
    text: Lutathera approval extends to children
    impact: 1.5
  - year: '2024'
    text: Flyrcado improves cardiac PET tracer access
    impact: 1.0
  - year: '2025'
    text: Earlier Pluvicto widens patient access
    impact: 2.0
  - year: '2026'
    text: Pluvicto moves into hormone-sensitive disease
    impact: 2.5
  - year: '2026'
    text: Curium Lantheus merger consolidates supply
    impact: 1.5
  - year: '2026'
    text: Tauklarify opens new brain tau PET use
    impact: 1.0
  - year: '2026'
    text: Pixclara advances glioma PET differentiation
    impact: 1.5
  note:
  - We kept the events we believe pushed radiopharmaceuticals forward the most
  - Ratings are our estimates, with all the sources at the end of the report
