ed148p:
  title: 'What pushed the metal 3D printing

    market forward, year after year?'
  events:
  - year: '1989'
    text: EOS starts industrial metal laser work
    impact: 1.0
  - year: '1994'
    text: Metal laser sintering reaches factories
    impact: 1.0
  - year: '1997'
    text: Arcam advances electron beam melting
    impact: 1.0
  - year: '2002'
    text: Medical implants validate printed titanium
    impact: 1.5
  - year: '2004'
    text: Aerospace tests complex printed components
    impact: 1.0
  - year: '2006'
    text: Metal powders become more consistent
    impact: 1.0
  - year: '2008'
    text: Laser systems gain larger build volumes
    impact: 1.0
  - year: '2010'
    text: Aerospace qualification work accelerates
    impact: 1.5
  - year: '2012'
    text: GE commits to printed fuel nozzles
    impact: 3.0
  - year: '2013'
    text: Metal printing attracts mainstream capital
    impact: 1.0
  - year: '2014'
    text: Factories add dedicated additive teams
    impact: 1.0
  - year: '2015'
    text: GE opens nozzle production plant
    impact: 3.0
  - year: '2016'
    text: GE buys Arcam and Concept Laser
    impact: 2.5
  - year: '2017'
    text: Binder jetting targets mass production
    impact: 1.5
  - year: '2018'
    text: Office metal printing broadens access
    impact: 1.0
  - year: '2019'
    text: Single-pass jetting raises throughput ceiling
    impact: 1.5
  - year: '2020'
    text: Supply shocks reward local production
    impact: 1.5
  - year: '2021'
    text: Aerospace recovery revives qualification
    impact: 1.0
  - year: '2022'
    text: Multi-laser systems scale output
    impact: 1.5
  - year: '2023'
    text: Defense demand favors rapid part replacement
    impact: 1.0
  - year: '2024'
    text: GE Additive becomes Colibrium
    impact: 1.0
  - year: '2024'
    text: Legacy Arcam and Concept brands retire
    impact: 0.5
  - year: '2025'
    text: Industrial users focus on repeatability
    impact: 1.0
  - year: '2025'
    text: Large metal systems target serial production
    impact: 1.0
  - year: '2026'
    text: EOS adds adaptive laser control
    impact: 2.0
  - year: '2026'
    text: Nikon SLM expands North American production
    impact: 1.5
  - year: '2026'
    text: EOS expands metal powder ownership
    impact: 1.0
  - year: '2026'
    text: Beehive invests over $50M in EOS
    impact: 2.0
  - year: '2026'
    text: Kratos adds large hypersonics printer
    impact: 1.5
  - year: '2026'
    text: Latin America gains industrial metal access
    impact: 1.0
  note:
  - We kept the events we believe pushed metal additive manufacturing forward the most
  - Ratings are our estimates, with all the sources at the end of the report
ed168p:
  handle: metal-additive-manufacturing
  title: 'Where did metal additive manufacturing

    investors put their money this past year?'
  note:
  - We added up every equity round of metal additive manufacturing startups in our tracker over the last twelve months
  - by category of our market definition, and rounds with no public amount count as zero here
