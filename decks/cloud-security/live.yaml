ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'Cloud security searches keep climbing

    as more data moves fo the cloud'
  date: 0 Lately.
  expl: Companies moved more of their apps and data to the cloud, and AI workloads added even more. Breaches through badly set up accounts kept making headlines,
    and Google's deal to buy Wiz showed how much the market is worth.
  term: cloud security
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/cloud-security/cloud-security.csv
ed052p:
  type: pp_cagr
  title: 'How much bigger can

    cloud security get?'
  lead: ''
  condition: To get that big, the market must merge posture, workload, identity, and detection tools into one platform that works across every cloud. It
    must also cut alert noise enough that small security teams can act on it.
  note:
  - We compared forecasts from Grand View, 360iResearch, Polaris Market Research and IMARC
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: 44
  cagr: 12
  y0: 2026
