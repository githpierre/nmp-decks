ed148p:
  title: 'What pushed cloud security

    forward, year after year?'
  events:
  - year: '2006'
    text: AWS cloud launch creates new attack surfaces
    impact: 2.5
  - year: '2009'
    text: Private clouds isolate customer workloads
    impact: 1.5
  - year: '2010'
    text: AWS IAM preview limits shared credentials
    impact: 1.5
  - year: '2011'
    text: AWS IAM makes least privilege practical
    impact: 2.0
  - year: '2012'
    text: Cloud roles replace embedded secrets
    impact: 1.5
  - year: '2013'
    text: CloudTrail enables cloud access audits
    impact: 2.0
  - year: '2014'
    text: AWS Config tracks risky resource changes
    impact: 2.0
  - year: '2015'
    text: Cloud complexity drives security spending
    impact: 1.5
  - year: '2016'
    text: Enterprise migration drives cloud protection
    impact: 2.0
  - year: '2017'
    text: Organizations scales cloud access controls
    impact: 1.5
  - year: '2017'
    text: Macie finds sensitive cloud data
    impact: 1.5
  - year: '2017'
    text: GuardDuty automates cloud threat detection
    impact: 2.0
  - year: '2018'
    text: Platforms unify cloud posture checks
    impact: 1.0
  - year: '2019'
    text: Capital One breach exposes configuration risk
    impact: 2.5
  - year: '2019'
    text: Google centralizes cloud threat visibility
    impact: 1.5
  - year: '2019'
    text: Security Hub aggregates cloud alerts
    impact: 2.0
  - year: '2020'
    text: Cheaper Macie expands data security coverage
    impact: 1.5
  - year: '2020'
    text: Pandemic raises cloud security urgency
    impact: 2.0
  - year: '2021'
    text: CNAPP era combines siloed protection tools
    impact: 2.0
  - year: '2021'
    text: Microsoft buys CloudKnox for cloud access
    impact: 1.5
  - year: '2021'
    text: Log4Shell exposes gaps beyond cloud posture
    impact: 2.0
  - year: '2022'
    text: Serverless scanning covers cloud gaps
    impact: 1.5
  - year: '2023'
    text: Tenable buys Ermetic for consolidated CNAPP
    impact: 1.5
  - year: '2024'
    text: CrowdStrike adds cloud data protection
    impact: 1.5
  - year: '2024'
    text: Fortinet absorbs Lacework cloud protection
    impact: 2.0
  - year: '2025'
    text: Google Wiz deal validates multicloud
    impact: 2.5
  - year: '2026'
    text: Google buys Wiz to expand cloud defense
    impact: 2.5
  - year: '2026'
    text: Cloud security baselines become default
    impact: 1.5
  - year: '2026'
    text: Microsoft expands multicloud posture coverage
    impact: 2.0
  - year: '2026'
    text: AI threats drive automated cloud defense
    impact: 2.0
  note:
  - We kept the events we believe pushed cloud security forward the most
  - Ratings are our estimates, with all the sources at the end of the report
