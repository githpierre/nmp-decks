ed142p:
  title: 'What are the biggest threats

    to AI materials discovery?'
  events:
  - odds: 30
    impact: 3
    text: Microsoft Discovery and Google DeepMind's robot lab take the biggest AI materials discovery customers
  - odds: 25
    impact: 2
    text: Funding for AI materials startups crashes as revenue stays far below the money raised
  - odds: 20
    impact: 2
    text: OpenAI and Google general models match Periodic Labs on materials work, erasing the edge of startups
  - odds: 20
    impact: 2
    text: China pulls ahead as Deep Principle and DP Technology win state funding and industrial customers
  - odds: 15
    impact: 1
    text: US cuts to NSF and national labs shrink the public data that AI materials startups rely on
  - odds: 15
    impact: 3
    text: AI-discovered materials fail when scaled to factory production, so customers stop paying for discovery platforms
  - odds: 15
    impact: 2
    text: Large chemical and battery clients keep the IP from joint projects, leaving AI materials startups little value
  - odds: 10
    impact: 2
    text: A big false discovery claim like the A-Lab correction damages trust in AI materials discovery
  note:
  - We listed the events that could slow ai materials discovery down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
