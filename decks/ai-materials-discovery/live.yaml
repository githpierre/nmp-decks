ed052p:
  type: pp_cagr
  title: 'What growth can the AI materials

    discovery market realistically expect?'
  lead: ''
  condition: To hit this growth, AI-found materials must reach real products, like Orbital’s GPU coolant in 2027, and clients must move from pilot projects
    to yearly contracts as robot labs prove their results. It must also keep public funding flowing, with Genesis Mission grants and open data that new
    models can train on.
  note:
  - We compared forecasts from SNS Insider, Market.us, Research and Markets and MarketsandMarkets to build a realistic range
  - We added our funding tracker and allowed for slow lab testing, and all the sources we used are listed at the end of the report
  size: null
  cagr: 25
  y0: 2026
