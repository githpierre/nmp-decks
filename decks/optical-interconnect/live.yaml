ed148p:
  title: 'What pushed the optical interconnect

    market forward, year after year?'
  events:
  - year: '2010'
    text: Silicon photonics reaches CMOS fabs
    impact: 1.0
  - year: '2012'
    text: Cloud traffic strains electrical links
    impact: 1.0
  - year: '2013'
    text: 100G Ethernet drives optical demand
    impact: 1.0
  - year: '2014'
    text: Hyperscale networks need lower power
    impact: 1.0
  - year: '2015'
    text: Optical engines move closer to chips
    impact: 1.0
  - year: '2016'
    text: Silicon photonics enters volume products
    impact: 1.5
  - year: '2017'
    text: Intel ships 100G silicon photonics
    impact: 2.0
  - year: '2018'
    text: AI clusters increase east-west traffic
    impact: 1.0
  - year: '2019'
    text: 400G adoption raises optical density
    impact: 1.5
  - year: '2020'
    text: Co-packaged optics gains industry backing
    impact: 1.5
  - year: '2021'
    text: Ayar demonstrates 1T optical link
    impact: 2.0
  - year: '2021'
    text: AI models magnify data movement costs
    impact: 1.0
  - year: '2022'
    text: Ayar begins volume shipments
    impact: 2.0
  - year: '2022'
    text: Google proves optical circuit switching
    impact: 2.5
  - year: '2022'
    text: 800G roadmaps raise power pressure
    impact: 1.5
  - year: '2023'
    text: Ayar shows 4T optical solution
    impact: 2.0
  - year: '2023'
    text: Google details Apollo OCS deployment
    impact: 2.0
  - year: '2023'
    text: Generative AI accelerates GPU clusters
    impact: 2.5
  - year: '2024'
    text: Broadcom ships 51.2T CPO switch
    impact: 2.5
  - year: '2024'
    text: AI chipmakers fund Ayar Labs
    impact: 2.0
  - year: '2024'
    text: Ayar valuation passes one billion
    impact: 1.0
  - year: '2025'
    text: NVIDIA unveils photonic switches
    impact: 2.0
  - year: '2025'
    text: NVIDIA builds photonics supply chain
    impact: 2.0
  - year: '2025'
    text: Ayar unveils 8T UCIe chiplet
    impact: 1.5
  - year: '2025'
    text: Marvell agrees Celestial AI deal
    impact: 2.0
  - year: '2026'
    text: Marvell completes Celestial AI buy
    impact: 2.0
  - year: '2026'
    text: Ayar raises $500M for production
    impact: 2.0
  - year: '2026'
    text: GlobalFoundries launches OCI CPO platform
    impact: 1.5
  - year: '2026'
    text: Ayar joins NVLink Fusion
    impact: 2.0
  - year: '2026'
    text: CPO planning shifts toward 2028
    impact: 1.5
  note:
  - We kept the events we believe pushed optical interconnect forward the most
  - Ratings are our estimates, with all the sources at the end of the report
