ed052p:
  type: pp_cagr
  title: 'How much bigger can

    optical interconnect get?'
  lead: ''
  condition: To get that big, AI clusters must keep raising bandwidth density faster than copper can support, while photonics packaging reaches acceptable
    yield and cost.
  note:
  - We compared forecasts from Grand View Research, Fortune Business Insights and Mordor Intelligence
  - We adjusted each one to our market definition, and all the sources are included at the end of the report
