ed007p:
  type: pp_radar
  title: 'Who Is in optical interconnect,

    and who stays outside?'
  TL:
    name: Broadcom
    src: ../../assets/logos/pp_live/optical-interconnect/s01-00.png
    text: sells networking and optical components, but its business extends beyond dedicated optical interconnects
  TR:
    name: Dell Technologies
    src: ../../assets/logos/pp_live/optical-interconnect/s01-02.png
    text: builds systems that use optical links, but it does not primarily develop optical interconnect technology
  BL:
    name: Intel
    src: ../../assets/logos/pp_live/optical-interconnect/s01-09.png
    text: develops silicon photonics and optical 1/0, but most of its business remains general computing chips
  BR:
    name: Lumentum
    src: ../../assets/logos/pp_live/optical-interconnect/s01-10.png
    text: supplies lasers and optical components for interconnects, but also serves telecom and industrial laser markets
  caption:
  - Distance to the center reflects how central each company is to optical interconnect
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
