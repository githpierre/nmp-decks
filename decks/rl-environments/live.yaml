ed007p:
  type: pp_radar
  title: 'Which companies really

    belong in RL environments?'
  TL:
    name: Braintrust
    src: ../../assets/logos/pp_live/rl-environments/s01-00.png
    text: provides evaluations and traces but does not primarily supply interactive training environments.
  TR:
    name: Hugging Face
    src: ../../assets/logos/pp_live/rl-environments/s01-02.png
    text: hosts models and datasets broadly, while RL environment creation is not the core commercial product
  BL:
    name: Weights & Biases
    src: ../../assets/logos/pp_live/rl-environments/s01-09.png
    text: tracks experiments and models and can support RL workflows, but does not primarily sell training environments
  BR:
    name: Mercor
    src: ../../assets/logos/pp_live/rl-environments/s01-10.png
    text: supplies expert data and training work that can support RL, but also serves broader talent and data workflows
  caption:
  - Distance to the center reflects how central each company is to RL environments
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
