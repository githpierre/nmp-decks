ed148p:
  title: 'What pushed the RL environments

    market forward, year after year?'
  events:
  - year: '2010'
    text: Atari standardizes interactive RL tasks
    impact: 1.5
  - year: '2013'
    text: Deep RL proves pixels train
    impact: 2.0
  - year: '2015'
    text: Deep RL becomes reproducible
    impact: 1.5
  - year: '2016'
    text: OpenAI Gym standardizes APIs
    impact: 3.0
  - year: '2016'
    text: Universe turns apps into environments
    impact: 2.0
  - year: '2017'
    text: Unity opens realistic game worlds
    impact: 2.0
  - year: '2017'
    text: Dota self-play proves scale
    impact: 2.0
  - year: '2018'
    text: OpenAI Five scales self-play
    impact: 2.5
  - year: '2019'
    text: AlphaStar validates multi-agent training
    impact: 2.0
  - year: '2019'
    text: Habitat accelerates embodied training
    impact: 2.0
  - year: '2019'
    text: Dota reaches world champions
    impact: 2.0
  - year: '2020'
    text: Simulation throughput becomes a moat
    impact: 1.5
  - year: '2021'
    text: GPU physics speeds robot learning
    impact: 2.0
  - year: '2021'
    text: MuJoCo becomes freely available
    impact: 2.0
  - year: '2022'
    text: MuJoCo becomes open source
    impact: 2.0
  - year: '2022'
    text: Gym transitions to Gymnasium
    impact: 1.5
  - year: '2023'
    text: WebArena brings realistic websites
    impact: 2.0
  - year: '2023'
    text: Agent benchmarks expose low success
    impact: 1.5
  - year: '2024'
    text: OSWorld brings real desktops
    impact: 2.0
  - year: '2024'
    text: Parallel browser testing matures
    impact: 1.5
  - year: '2024'
    text: Environment fidelity becomes differentiator
    impact: 1.5
  - year: '2025'
    text: Gymnasium formalizes the standard
    impact: 1.5
  - year: '2025'
    text: Agent training shifts toward tools
    impact: 2.0
  - year: '2025'
    text: Security tasks gain RL interest
    impact: 1.5
  - year: '2025'
    text: Enterprise workflows become training worlds
    impact: 1.5
  - year: '2026'
    text: Centific launches RLEaaS
    impact: 2.0
  - year: '2026'
    text: Bugcrowd launches security environments
    impact: 2.0
  - year: '2026'
    text: Scale open-sources AgentEnv
    impact: 2.5
  - year: '2026'
    text: Safety hardens training sandboxes
    impact: 1.5
  - year: '2026'
    text: Offline worlds support frontier RL
    impact: 2.0
  note:
  - We kept the events we believe pushed rl environments forward the most
  - Ratings are our estimates, with all the sources at the end of the report
ed168p:
  handle: rl-environments
  title: 'Where did RL environment investors

    put their money this past year?'
  note:
  - We added up every equity round of rl environments startups in our tracker over the last twelve months
  - by category of our market definition, and rounds with no public amount count as zero here
