ed007p:
  type: pp_radar
  title: 'Which companies really belong

    in data security posture management?'
  TL:
    name: Rubrik
    src: ../../assets/logos/pp_live/data-security-posture-management/s01-00.png
    text: protects and recovers data, but backup and cyber recovery are outside posture discovery and classification
  TR:
    name: CrowdStrike
    src: ../../assets/logos/pp_live/data-security-posture-management/s01-02.png
    text: protects endpoints and cloud workloads but does not center on sensitive data discovery and posture assessment
  BL:
    name: Tenable
    src: ../../assets/logos/pp_live/data-security-posture-management/s01-09.png
    text: adds data security posture capabilities, while its core business remains exposure and vulnerability management
  BR:
    name: Palo Alto Networks
    src: ../../assets/logos/pp_live/data-security-posture-management/s01-10.png
    text: includes DSPM through acquired technology, but the company spans a much broader cybersecurity portfolio
  caption:
  - Distance to the center reflects how central each company is to data security posture management
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
