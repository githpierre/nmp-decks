    impact: 3
  - text: A federal law preempts state EWA rules but adds national disclosures and fee limits that compress provider economics
    odds: 30
    impact: 2
  - text: Employers resist worker fees and demand free transfers, reducing revenue per user for DailyPay, Payactiv and payroll partners
    odds: 45
    impact: 2
  - text: Consumer lawsuits challenge tips and fast fees as hidden interest, increasing legal costs for direct-to-consumer EWA apps
    odds: 40
    impact: 3
  - text: Payroll platforms add native early-pay tools, reducing the need for standalone EWA vendors and weakening distribution deals
    odds: 50
    impact: 2
  - text: A labor downturn reduces hours worked and earned balances, shrinking the wage pool available for early access transactions
    odds: 35
    impact: 2
  - text: State regulators expand examinations and subpoenas, forcing EWA apps to slow launches in New York, Maryland and Connecticut
    odds: 45
    impact: 2
  - text: Bank partners tighten risk controls after fraud losses, making instant wage transfers slower and more expensive for providers
    odds: 30
    impact: 3
