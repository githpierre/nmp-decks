  events:
  - text: Robot foundation models fail outside demos, making manufacturers keep task-specific controllers in production systems
    odds: 45
    impact: 3
  - text: A serious humanoid safety incident triggers stricter workplace certification, delaying deployment of general robot models
    odds: 25
    impact: 3
  - text: High-quality robot data stays scarce and expensive, slowing models that need diverse real-world demonstrations to improve
    odds: 55
    impact: 2
  - text: NVIDIA, Google and major robot makers keep frontier models closed, shrinking the market for independent model vendors
    odds: 50
    impact: 2
  - text: Humanoid hardware shipments grow slower than expected, leaving model companies with too few deployed robots to monetize
    odds: 40
    impact: 3
  - text: Customers reject cloud-dependent robot intelligence over latency, privacy or uptime concerns, limiting hosted model revenue
    odds: 35
    impact: 2
  - text: Licensing disputes over human video and training data raise costs or restrict datasets used for generalist robot policies
    odds: 30
    impact: 1
  - text: Open models improve enough to meet most robot needs, compressing prices for proprietary foundation models and commercial APIs
    odds: 45
    impact: 2
  note:
  - We listed the events that could slow robot foundation models down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and you will find all the sources we used at the end of the report
