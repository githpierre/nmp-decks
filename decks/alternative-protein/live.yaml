ed142p:
  title: 'What could go wrong for

    alternative protein?'
  events:
  - odds: 45
    impact: 3
    text: More US states join Florida and Alabama in banning cultivated meat sales, closing large markets
  - odds: 45
    impact: 2
    text: Cultivated meat startups fail to cut production costs below $10 a pound and run out of cash
  - odds: 40
    impact: 2
    text: Venture funding for alternative protein stays under $1 billion a year and many startups shut down
  - odds: 35
    impact: 2
    text: A health study or media campaign brands plant-based meat as ultra-processed food and shoppers turn away
  - odds: 30
    impact: 3
    text: Beyond Meat files for bankruptcy as plant-based meat sales keep falling despite its 2025 debt swap
  - odds: 30
    impact: 2
    text: Meat giants Tyson and JBS cut beef and chicken prices, widening the gap with plant-based products
  - odds: 20
    impact: 1
    text: The EU adds burger to its 31 banned meat names for plant foods and US states follow
  - odds: 8
    impact: 3
    text: A food safety recall at a precision fermentation plant hurts trust in lab-grown proteins
  note:
  - We listed the events that could slow alternative protein down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
