    name: Roquette
    src: ../../assets/logos/pp_live/alternative-protein/s01-00.png
    text: supplies the pea protein found in many plant-based meats, but it is an ingredients group, not an alternative itself
  TR:
    name: Tyson Foods
    src: ../../assets/logos/pp_live/alternative-protein/s01-01.png
    text: launched its own plant- based brand, Raised & Rooted, but it remains one of the largest meat processors in the world
