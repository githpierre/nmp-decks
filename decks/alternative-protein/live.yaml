ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people look for pea

    protein, as protein goes viral'
  date: Lately.
  expl: Protein is everywhere now, from coffee to cereal. Weight-loss drugs pushed people to eat more of it to keep muscle, and more and more shoppers want
    it without dairy. Pea protein sits right in the middle, so searches climbed to a five-year high.
  term: alternative protein
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/alternative-protein/alternative-protein.csv
