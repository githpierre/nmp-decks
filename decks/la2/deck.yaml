- label: EDGE AI CHIPS
  type: pp_risks
  section: Market challenges
  title: What are the biggest threats to the edge AI chips market?
  events:
  - text: Cloud inference prices fall fast enough that device makers postpone adding larger NPUs to phones, PCs and gateways
    odds: 35
    impact: 3
  - text: Apple, Qualcomm and PC vendors ship NPUs faster than software adopts them, leaving expensive silicon underused by buyers
    odds: 45
    impact: 3
  - text: US export controls tighten on advanced AI processors and restrict edge accelerator sales into major Chinese markets
    odds: 40
    impact: 2
  - text: Memory bandwidth and thermal limits stop larger generative AI models from running reliably on compact edge devices
    odds: 45
    impact: 2
  - text: Automakers slow autonomous features after safety incidents, cutting demand for high-end automotive AI processors
    odds: 30
    impact: 2
  - text: PC buyers resist higher AI PC prices, forcing OEMs to reduce NPU content in mainstream notebooks and desktops amid weaker dem
    odds: 40
    impact: 2
  - text: Fragmented NPU software stacks make developers target CPUs and GPUs instead of optimizing models for each edge chip
    odds: 50
    impact: 2
  - text: Industrial customers delay edge AI projects because cybersecurity and model-update risks outweigh latency benefits
    odds: 35
    impact: 2
  note:
  - We listed the events that could slow edge AI chips down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
