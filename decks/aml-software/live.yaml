ed052p:
  type: pp_cagr
  title: 'How much bigger can

    AML software get?'
  lead: ''
  condition: To get that big, banks and fintechs must keep replacing rules- only AML stacks with real-time data, better screening and explainable AI while
    regulation continues to tighten.
  note:
  - We compared forecasts from The Business Research Company, Fortune Business Insights and Grand View Research
  - We adjusted each one to our definition of the market, and all the sources we used are listed at the end of the report
  size: 2.8
  cagr: 16
  y0: null
