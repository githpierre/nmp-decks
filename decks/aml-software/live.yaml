ed007p:
  type: pp_radar
  title: 'Which companies really

    belong in AML software?'
  TL:
    name: Sift
    src: ../../assets/logos/pp_live/aml-software/s01-00.png
    text: focuses on digital fraud decisions, not AML compliance workflows or suspicious activity reporting
  TR:
    name: Okta
    src: ../../assets/logos/pp_live/aml-software/s01-02.png
    text: manages authentication and access, not money laundering detection, sanctions screening, or AML reporting
  BL:
    name: Socure
    src: ../../assets/logos/pp_live/aml-software/s01-09.png
    text: is mainly identity verification and fraud risk, with compliance products that ~ touch AML onboarding
  BR:
    name: Sardine
    src: ../../assets/logos/pp_live/aml-software/s01-10.png
    text: combines fraud prevention, KYC and AML monitoring for fintech and crypto customers while most revenue sits in ad
  caption:
  - Distance to the center reflects how central each company is to AML software
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
