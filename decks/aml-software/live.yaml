ed148p:
  title: 'What pushed the AML software

    market forward, year after year?'
  events:
  - year: '1970'
    text: Bank Secrecy Act creates reporting demand
    impact: 2.5
  - year: '1986'
    text: Money laundering becomes federal crime
    impact: 1.5
  - year: '1989'
    text: FATF creates global AML standards
    impact: 2.5
  - year: '1990'
    text: FATF issues Forty Recommendations
    impact: 1.5
  - year: '1992'
    text: US requires suspicious transaction reports
    impact: 2.0
  - year: '1996'
    text: SAR rules broaden bank reporting
    impact: 1.5
  - year: '2001'
    text: Patriot Act mandates AML programs
    impact: 3.0
  - year: '2001'
    text: FATF adds terrorist financing rules
    impact: 1.5
  - year: '2003'
    text: FATF updates recommendations
    impact: 1.0
  - year: '2004'
    text: FATF adds ninth special recommendation
    impact: 1.0
  - year: '2008'
    text: Financial crisis lifts compliance scrutiny
    impact: 1.5
  - year: '2012'
    text: FATF consolidates forty standards
    impact: 1.5
  - year: '2015'
    text: EU fourth AML directive expands checks
    impact: 2.0
  - year: '2016'
    text: Panama Papers expose hidden ownership
    impact: 1.5
  - year: '2018'
    text: EU fifth AML directive widens scope
    impact: 1.5
  - year: '2019'
    text: FATF regulates virtual asset providers
    impact: 2.0
  - year: '2020'
    text: AML Act modernizes US framework
    impact: 2.0
  - year: '2020'
    text: Nasdaq agrees to buy Verafin
    impact: 1.5
  - year: '2021'
    text: Nasdaq completes Verafin acquisition
    impact: 1.5
  - year: '2021'
    text: FATF sharpens crypto compliance guidance
    impact: 1.5
  - year: '2022'
    text: FATF strengthens beneficial ownership rules
    impact: 1.5
  - year: '2023'
    text: EU updates crypto transfer rules
    impact: 1.5
  - year: '2024'
    text: EU adopts single AML rulebook
    impact: 2.0
  - year: '2024'
    text: EU creates AMLA supervisor
    impact: 2.0
  - year: '2025'
    text: AMLA builds Frankfurt operations
    impact: 1.0
  - year: '2025'
    text: Banks shift AML AI toward production
    impact: 1.5
  - year: '2026'
    text: AMLA takes over EU AML duties
    impact: 2.0
  - year: '2026'
    text: FinCEN proposes new AML program rule
    impact: 2.0
  - year: '2026'
    text: FATF updates payment transparency rules
    impact: 1.0
  - year: '2026'
    text: Sanctions risk lifts AML tech priority
    impact: 1.5
  note:
  - We kept the events we believe pushed aml software forward the most
  - Ratings are our estimates, with all the sources at the end of the report
