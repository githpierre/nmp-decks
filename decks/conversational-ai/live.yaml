ed007p:
  type: pp_radar
  title: 'Which companies really

    belong in conversational AI?'
  TL:
    name: Twilio
    src: ../../assets/logos/pp_live/conversational-ai/s01-00.png
    text: carries the calls and texts behind many AI assistants, but it sells that plumbing by the minute, not the assistant itself
  TR:
    name: WhatsApp
    src: ../../assets/logos/pp_live/conversational-ai/s01-02.png
    text: has over 3 billion users and now hosts Meta AI, but it is a messaging app between people rather than an AT assistant
  BL:
    name: Perplexity
    src: ../../assets/logos/pp_live/conversational-ai/s01-10.png
    text: answers questions in a chat window, but it is built as an answer engine to rival Google, so it sits on the line
  BR:
    name: Mistral AI
    src: ../../assets/logos/pp_live/conversational-ai/s01-11.png
    text: has a consumer assistant in Le Chat, but most of its revenue comes from models sold to businesses, so it is on the edge
  caption:
  - Distance to the center reflects how much a product is built around natural conversation, rather than models or plumbing
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
