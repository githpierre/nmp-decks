ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'People search for conversational AI

    as AI voices stop sounding like robots'
  date: Over the past year.
  expl: AI voices stopped sounding like robots. ChatGPT’s voice mode, Gemini Live and new voice agents could talk, laugh and interrupt like a person, and
    companies started putting them on customer service lines. People searched what conversational AI is and how to use it.
  term: conversational ai
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/conversational-ai/conversational-ai.csv
ed052p:
  type: pp_cagr
  title: 'Can conversational AI

    keep growing this fast?'
  lead: ''
  condition: Yes, but the market must turn AI agents into trusted daily workers, as companies move budgets from people and old phone systems to software.
    It must also keep bots from making costly errors, follow new rules on AI disclosure, and resist falling prices as models get cheaper every year.
  note:
  - We compared forecasts from IMARC, Grand View, Fortune Business Insights and MarketsandMarkets
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: 18
  cagr: 20
  y0: 2026
