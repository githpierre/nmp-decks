ed142p:
  title: 'What could go wrong

    for conversational AI?'
  events:
  - odds: 45
    impact: 3
    text: OpenAI, Google and Microsoft bundle voice and chat agents into their platforms, so startups lose deals
  - odds: 40
    impact: 3
    text: Salesforce, Zendesk and ServiceNow ship native AI agents inside their help desks at no extra cost
  - odds: 40
    impact: 2
    text: Model price cuts turn per conversation pricing into a race to the bottom for agent vendors
  - odds: 35
    impact: 1
    text: EU AI Act transparency rules and national fines raise compliance costs for chatbot vendors selling in Europe
  - odds: 30
    impact: 2
    text: Voice cloning fraud leads the FCC and state laws to restrict AI phone calls to consumers
  - odds: 30
    impact: 2
    text: Investors stop funding thin wrapper startups after Sierra and Decagon raise most of the category money
  - odds: 25
    impact: 2
    text: A bank or airline chatbot gives false refund promises at scale and courts hold the company liable
  - odds: 12
    impact: 3
    text: A major data leak through a customer service agent triggers a class action and enterprise freezes
  note:
  - We listed the events that could slow conversational ai down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
