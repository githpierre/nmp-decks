ed142p:
  title: 'What could slow

    digital twins down?'
  events:
  - odds: 20
    impact: 3
    text: NVIDIA, Microsoft and AWS give away digital twin tools to sell compute, undercutting paid startup products
  - odds: 20
    impact: 3
    text: Siemens, Dassault and Bentley bundle digital twins into their software suites, so startups lose most big deals
  - odds: 15
    impact: 2
    text: Industrial buyers stop funding digital twin projects that stall after the pilot and never reach plant scale
  - odds: 12
    impact: 2
    text: AI world models from Nvidia or Google replace physics-based digital twins for many simulation tasks
  - odds: 12
    impact: 2
    text: Fewer digital twin startups raise new money as investors back only a handful of large platforms
  - odds: 10
    impact: 1
    text: High GPU costs make large physics simulations too expensive for most industrial digital twin customers
  - odds: 8
    impact: 3
    text: Hackers use a digital twin connection to break into a power grid or factory control system
  - odds: 4
    impact: 2
    text: A digital twin gives wrong guidance and causes a serious plant accident, damaging trust in the category
  note:
  - We listed the events that could slow digital twin down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
