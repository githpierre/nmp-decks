ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'People ask what a digital twin

    is, after Nvidia’s big keynotes'
  date: C Recently.
  expl: Nvidia made digital twins a keynote star, showing virtual copies of factories, cities and even the whole planet’s weather. Carmakers and hospitals
    followed with their own. Suddenly a term from engineering showed up in the news, and people searched what it means.
  term: digital twin
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/digital-twin/digital-twin.csv
ed052p:
  type: pp_cagr
  title: 'What growth can the digital twin

    market realistically expect?'
  lead: ''
  condition: To hit this growth, the market must turn pilots into live twins that run every day, as grids, plants, and buildings move their daily operations
    onto them. It must also prove its savings in hard numbers, connect old systems, and resist cheaper tools from cloud giants that do part of the job.
  note:
  - We compared forecasts from Mordor, Fortune Business Insights, Grand View and IMARC and adjusted each one to our market
  - We then built a realistic range from these forecasts, and you will find all the sources we used at the end of the report
  size: 40
  cagr: 25
  y0: 2026
