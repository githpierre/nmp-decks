ed007p:
  type: pp_radar
  title: 'What counts as a digital twin,

    and what only looks like it?'
  TL:
    name: Dassault Systémes
    src: ../../assets/logos/pp_live/digital-twin/s01-00.png
    text: builds around virtual twins, but most of its revenue still comes from design software like CATIA and SOLIDWORKS
  TR:
    name: Unity
    src: ../../assets/logos/pp_live/digital-twin/s01-02.png
    text: renders real-time 3D used in some industrial twins, but about two thirds of its revenue comes from mobile game ads
  BL:
    name: Cognite
    src: ../../assets/logos/pp_live/digital-twin/s01-10.png
    text: organizes the data that industrial twins run on, which makes it a data platform that powers twins more than a twin itself nA
  BR:
    name: Twin Health
    src: ../../assets/logos/pp_live/digital-twin/s01-11.png
    text: models each patient's metabolism as a twin, but it sells a diabetes program to employers, closer oe to digital health
  caption:
  - Distance to the center reflects how much a product is a live copy of a real asset, kept in sync with its operating data
