  - - They make clients source a separate card issuing partner
    - Bridge links stablecoin balances to cards through Stripe
  - - They need to build their own fiat conversion controls
    - Bridge handles stablecoin conversions and payment checks
  - - They have no clear plan to earn a major payments exit
    - Stripe closed the Bridge acquisition in February 2025
  - - They build payment code without a distribution partner
    - Stripe paid $1.1B for the platform and its payment APIs
  section: Startup strategies
  src: 210
  title: How Bridge turned stablecoin transfers into a $1.1B deal
  type: contrast
  logo_src: ../../assets/logos/bridge.png
- id: ed211
  left: A TYPICAL PAYMENT PROVIDER
  logo: bvnk
  note:
  - We used Bvnk product documents and dated partner or funding releases for the facts on the right
  - We show a simple baseline provider on the left to explain the difference, not a measured industry average
  right: BVNK
  rows:
  - - They treat bank transfers and stablecoins as separate tools
    - BVNK connects fiat bank rails and stablecoin payments
  - - They ask firms to manage each currency conversion alone
    - BVNK converts accepted stablecoins to USD, EUR or GBP
  - - They offer payments without any treasury link inside
    - BVNK combines moving, holding and converting funds
  - - They lack a unified system for global company payouts
    - BVNK supports cross-border business payments and payouts
  - - They build compliance and partner connections one by one
    - BVNK scaled regulated links to banks and payment firms
  - - They cannot connect stablecoin payments with card reach
    - Mastercard added BVNK to its global payments network
  - - They stay private while scaling payment links by market
    - Mastercard completed its purchase of BVNK in August 2026
  - - They lack a disclosed strategic outcome at major scale
    - The deal used $1.4B cash, with up to $300M more possible
  section: Startup strategies
  src: 211
  title: How BVNK became a Mastercard stablecoin payments platform
  type: contrast
  logo_src: ../../assets/logos/bvnk.png
- id: ed212
  left: A TYPICAL PAYMENT PROVIDER
  logo: rain
  note:
  - We used Rain product documents and dated partner or funding releases for the facts on the right
  - We show a simple baseline provider on the left to explain the difference, not a measured industry average
  right: RAIN
  rows:
  - - They offer cards only for money held in a bank account
    - Rain helps partners issue cards funded by stablecoin money
  - - They need one provider for cards and another for wallets
    - Rain offers card, wallet and payout tools to its partners
  - - They develop a single card program for one local niche
    - Rain enables many firms to launch their own card programs
  - - They cannot use existing global card acceptance easily
    - Rain cards can be used at places that accept Visa cards
  - - They have no clear evidence of broad partner adoption
    - Rain said more than 200 partners used its platform in 2026
  - - They scale without reporting any real payment activity
    - Rain reported over $3B in annualized transactions in 2026
  - - They raise capital while the business model stays small
    - Rain raised a $250M Series C to extend its payment rails
  - - They have not proved demand from private equity backers
    - Its January 2026 financing valued the company at nearly $2B
  section: Startup strategies
  src: 212
  title: How Rain made stablecoin cards a nearly $2B business
  type: contrast
  logo_src: ../../assets/logos/rain.png
- id: ed213
  left: A TYPICAL PAYMENT PROVIDER
  logo: redotpay
  note:
  - We used Redotpay product documents and dated partner or funding releases for the facts on the right
  - We show a simple baseline provider on the left to explain the difference, not a measured industry average
  right: REDOTPAY
  rows:
  - - They build a wallet mainly for holding tokens or trading
    - RedotPay focuses on spending stablecoins in daily life
  - - They ask users to sell tokens before they can buy goods
    - RedotPay links stablecoin balances to everyday card spend
  - - They work only at shops that accept crypto directly
    - Its card works at ordinary merchants on card networks
  - - They offer a digital wallet but no normal plastic card
    - RedotPay sells both physical and virtual payment cards
  - - They limit payment use to a small set of local markets
    - RedotPay reported users in 100 countries in August 2026
  - - They have no disclosed scale beyond wallet downloads
    - RedotPay said more than 8.5M people used its product
  - - They discuss trading flows rather than merchant payments
    - RedotPay reported roughly $14B annual payment volume
  - - They grow user accounts before testing real card spending
    - RedotPay raised $107M after reporting high card volume
  section: Startup strategies
  src: 213
  title: How RedotPay made stablecoins spendable by millions
  type: contrast
  logo_src: ../../assets/logos/redotpay.png
- id: ed214
  left: A TYPICAL PAYMENT PROVIDER
  logo: mesh
  logo_src: ../../assets/logos/mesh-2.png
  note:
  - We used Mesh product documents and dated partner or funding releases for the facts on the right
  - We show a simple baseline provider on the left to explain the difference, not a measured industry average
  right: MESH
  rows:
  - - They integrate each wallet and exchange one at a time
    - Mesh joins many wallets and exchanges through one API
  - - They ask customers to move funds into a new wallet first
    - Mesh lets people fund a payment from wallets they hold
  - - They leave the merchant to accept each payment token
    - Mesh lets merchants settle in their preferred currency
  - - They connect to a few apps and have limited wallet reach
    - Mesh reported more than 300 wallet and exchange links
  - - They work only online where a crypto pay button exists
    - Mesh and Visa bring spending to regular card locations
  - - They cannot offer one simple experience across chains
    - Mesh joins separate payment sources through one network
  - - They rely on isolated deals to grow each merchant link
    - Mesh has built integrations across payment and wallet firms
  - - They lack a public outcome confirming investor interest
    - Mesh raised $75M at a $1B valuation in January 2026
  section: Startup strategies
  src: 214
  title: How Mesh joined wallets into a $1B payment network
  type: contrast
