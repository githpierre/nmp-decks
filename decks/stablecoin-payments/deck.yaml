- id: ed017
  type: maturity
  section: Market definition
  title: How mature is stablecoin payments as a market?
  score: 45
  text: The market is real because laws now exist in the US, EU and Hong Kong, Stripe and Visa use stablecoins in live products, and startups move billions a year. The score stays below the middle because payments are a small share of stablecoin volume, cashing out is costly in many countries, and US rules are still being detailed.
  note:
  - We rate market maturity with an internal score of laws in force, real payment volume, big buyers and funding.
  - We set 45/100 because laws and live products exist, but real payments are still a small part of the volume.
