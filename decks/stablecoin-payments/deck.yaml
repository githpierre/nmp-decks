- id: ed006
  type: definition
  section: Market definition
  title: What is the stablecoin payments market, in simple terms?
  text: Stablecoin payments is the market for services that use digital dollars on a blockchain to send, receive, settle or spend money, for people and for businesses
  note: We use a conversational definition here because it makes the boundary with crypto trading, where most stablecoins are still used, easier to understand.
  src: 6
  icon_tl: 💸
