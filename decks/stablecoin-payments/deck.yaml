- id: ed052p
  type: pp_cagr
  section: Market size
  title: 'How much bigger can

    stablecoin payments get?'
  lead: ''
  condition: To get that big, real payments must keep growing about 50% a year as banks, card networks, and payroll platforms move flows on-chain, while fees fall more slowly than volume grows. It must also keep the fiat edges open, with sponsor banks, licensed ramps, and the GENIUS rules in force by January 2027.
  note:
  - We compared forecasts from Astute Analytica, Mordor, Bloomberg Intelligence and JPMorgan for a realistic range
  - We added our funding tracker and allowed for falling take rates, and all the sources are at the end of the report
