- id: ed024
  type: dated
  section: Market definition
  title: What has changed (very) recently?
  page: 1/2
  items:
  - d: SINCE 2024
    t: The EU MiCA rules for stablecoins took effect in June 2024, so a coin sold to Europeans now needs a licensed issuer, and several exchanges limited USDT for EU users.
  - d: SINCE 2024
    t: Stripe brought back crypto payments in October 2024, letting merchants accept USDC stablecoins at checkout and get the money in their local currency.
  - d: SINCE 2025
    t: Stripe closed its $1.1B purchase of Bridge in February 2025, its largest deal ever, to give its merchants APIs to hold, send and accept stablecoins.
  - d: SINCE 2025
    t: Stripe launched stablecoin accounts for businesses in 101 countries in May 2025, so a firm outside the US can hold and receive digital dollars without a US bank.
  - d: SINCE 2025
    t: Circle, the issuer of USDC, listed on the New York Stock Exchange in June 2025, raising about $1.1B, the first big listing of a stablecoin company.
  - d: SINCE 2025
    t: The US GENIUS Act became law in July 2025, the first federal law for payment stablecoins, requiring full reserves in cash or short-term Treasury bills.
  note:
  - We kept the milestones that most changed the rules, the big players and the money flowing into the market
  - There is no official timeline, and another analyst could reasonably pick a few different milestones here
  src: 24
- id: ed025
  type: dated
  section: Market definition
  title: What has changed (very) recently?
  page: 2/2
  items:
  - d: SINCE 2025
    t: Hong Kong's stablecoin law took effect in August 2025, so issuing a stablecoin in the city now needs a license from its central bank, the HKMA.
  - d: SINCE 2025
    t: Tempo, a payments blockchain started by Stripe and Paradigm, raised $500M in October 2025, one of the largest first rounds of any payments startup.
  - d: SINCE 2025
    t: RedotPay raised $47M from Coinbase Ventures in September 2025 at a value of over $1B, then $107M more in December as its stablecoin card spread in Asia.
  - d: SINCE 2026
    t: Rain, which issues Visa cards linked to stablecoins for fintechs, raised a $250M Series C led by ICONIQ in January 2026, five months after a $58M round.
  - d: SINCE 2026
    t: OpenFX raised $94M in March 2026 and KAST $80M the same month, as investors backed stablecoin currency exchange and dollar accounts for people abroad.
  - d: SINCE 2026
    t: Félix Pago raised an $87M Series C led by a16z crypto in September 2026, with $113M of debt on top, to grow its WhatsApp money transfers to Latin America.
  note:
  - We kept the milestones that most changed the rules, the big players and the money flowing into the market
  - There is no official timeline, and another analyst could reasonably pick a few different milestones here
