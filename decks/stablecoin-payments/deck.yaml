- id: ed091
  type: x/has_tech_infra_evolved_over
  section: Tech and infra
  title: How has tech and infra evolved over the years?
  note: We track launches of real payment services and network integrations rather than the date a token first traded.
  src: 91
  t:
    6: '2018 - 2022


      Stablecoins gained practical wallet uses, but merchants still needed banks, cash-out partners, and separate crypto tools to get paid.'
    7: '2023


      PayPal introduced PYUSD for payments, while Visa expanded live USDC settlement pilots to Solana and merchant acquirers.'
    8: '2024 - 2025


      Stripe bought Bridge, Circle launched CPN, Mastercard added merchant settlement options, and Visa grew card services.'
    9: '2026


      Circle added managed settlement, Visa expanded its supported chains, and payment firms shipped bank-funded bills and local-currency payouts.'
    10: 'NEXT


      Services may hide blockchain steps from payers, offer cards at scale, and route cash-outs and compliance in more markets.'
