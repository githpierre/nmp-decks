- id: ed210
  left: A TYPICAL PAYMENT PROVIDER
  logo: bridge
  note:
  - We used Bridge product documents and dated partner or funding releases for the facts on the right
  - We show a simple baseline provider on the left to explain the difference, not a measured industry average
  right: BRIDGE
  rows:
