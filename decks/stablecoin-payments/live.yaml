ed142p:
  title: 'What could go wrong for

    stablecoin payments?'
  events:
  - odds: 30
    impact: 3
    text: Stripe, Mastercard and Visa own the stablecoin rails and leave little room for payment startups
  - odds: 20
    impact: 2
    text: JPMorgan and Swift bank tokens win business payments, leaving stablecoins mostly for retail and crypto
  - odds: 20
    impact: 2
    text: The CLARITY Act passes with its ban on interest-like rewards, so stablecoins lose their yield edge
  - odds: 15
    impact: 2
    text: Brazil, India and other countries cap stablecoin payments as foreign exchange, shrinking cross-border volumes
  - odds: 12
    impact: 2
    text: JPMorgan and other banks close accounts of stablecoin payment startups, cutting their access to dollars
  - odds: 10
    impact: 2
    text: A major hack drains a stablecoin payment provider like Infini, and merchants lose trust in crypto rails
  - odds: 5
    impact: 2
    text: Congress or regulators weaken the GENIUS Act, leaving stablecoin payment firms without clear US rules
  - odds: 5
    impact: 3
    text: USDT or USDC loses its dollar peg after a reserve scare, and businesses abandon stablecoin payments
  note:
  - We listed the events that could slow stablecoin payments down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
