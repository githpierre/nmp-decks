ed039p:
  signal: google-trends
  window: 5y
  title: 'Searches for stablecoins fell after 2022,

    then climbed to the US law in 2025'
  date: From late 2021 to mid-2025.
  expl: Searches dropped after the Terra crash in 2022, then climbed again as PayPal launched its own stablecoin and the US moved toward a stablecoin law, signed in July 2025.
  term: stablecoins
  note:
  - We tracked how often people worldwide googled this term from late 2021 to July 2025
  - Google changed how it counts small terms in mid-2025, so the curve stops in July 2025
  csv: assets/trends/stablecoin-payments/stablecoins.csv
  cut: '2025-07-27'
  caption_period: November 2021 to July 2025
  stat_text: more searches in mid-2025<br>than in a typical week before
ed052p:
  type: pp_cagr
  title: 'How much bigger can

    stablecoin payments get?'
  lead: ''
  condition: To get that big, real payments must keep growing about 50% a year as banks, card networks, and payroll platforms move flows on-chain, while fees fall more slowly than volume grows. It must also keep the fiat edges open, with sponsor banks, licensed ramps, and the GENIUS rules in force by January 2027.
  note:
  - We compared forecasts from Astute Analytica, Mordor, Bloomberg Intelligence and JPMorgan for a realistic range
  - We added our funding tracker and allowed for falling take rates, and all the sources are at the end of the report
  size: 5
  cagr: 28
  y0: 2026
