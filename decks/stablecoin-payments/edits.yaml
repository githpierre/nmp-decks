ed045:
  6: $5B
  8: We estimate about $5B of revenue in 2026. Payments run at about $643B a year at Allium's pace, and we assume firms keep about 0.8% of that in fees, spreads and card income.
  note: We annualize Allium's nine months of 2026 payments and apply a 0.8% average take rate, our own assumption, not a published figure.
ed051:
  17: '~28%

    through 2036'
  19: Payment volume grew 39% in 2025 and 45% through September 2026. Revenue should grow slower, about 28% a year, as the fee kept on each payment keeps falling.
  note: We set a 28% base case for revenue, below the 39% to 45% growth of payment volume, with 15% and 45% bounds. These are not published forecasts.
