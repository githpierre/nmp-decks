ed160:
  6: Treasury settlement took about 28% of the capital raised since 2024, ahead of Payment APIs with about 21%
  7: 176 of the 187 rounds since 2024 disclosed an amount, and the median disclosed round was $8.8M
  8: US startups closed 94 of the 187 rounds and took $2.4B, about 65% of all the money raised since 2024
  9: 5 rounds of $100M or more made up about 28% of all the capital raised in the market since 2024
  10: The $500M Series A round of Tempo is the biggest since 2024, ahead of the $250M round of Rain
  11: Seed was the most common round, with 97 of the 187 rounds, ahead of Series A with 46 and Series B with 13
  note: We drew these insights from our tracker of 187 stablecoin payments equity rounds announced since January 2024, worth about $3.7B
ed162:
  6: 'BEFORE



    Before 2024, stablecoin startups mostly served crypto traders, and few banks or payment firms used them.'
  7: 'AFTER



    Since 2024, 187 rounds raised $3.7B. Treasury settlement takes the biggest share, and Stripe and Mastercard bought leaders.'
  note: We used our tracker of stablecoin payments equity rounds, complete from January 2024, and company releases and the press
