ed160:
  6: Treasury settlement took about 31% of the capital raised since 2024, ahead of Payment APIs with about 22%
  7: 164 of the 170 rounds since 2024 disclosed an amount, and the median disclosed round was $8.5M
  8: US startups closed 85 of the 170 rounds and took $2.2B, about 64% of all the money raised since 2024
  9: 4 rounds of $100M or more made up about 28% of all the capital raised in the market since 2024
  10: The $500M Series A round of Tempo is the biggest since 2024, ahead of the $250M round of Rain
  11: Seed was the most common round, with 74 of the 170 rounds, ahead of Series A with 44 and Series B with 11
  note: We drew these insights from our tracker of 170 stablecoin payments equity rounds announced since January 2024, worth about $3.4B
ed162:
  6: 'BEFORE



    Before 2024, stablecoin startups mostly served crypto traders, and few banks or payment firms used them.'
  7: 'AFTER



    Since 2024, 170 rounds raised $3.4B. Treasury settlement takes the biggest share, and Stripe and Mastercard bought leaders.'
  note: We used our tracker of stablecoin payments equity rounds, complete from January 2024, and company releases and the press
