ed142p:
  title: 'What could go wrong

    for semiconductors?'
  events:
  - odds: 45
    impact: 2
    text: Memory prices crash after the 2026 boom, hitting Samsung, SK hynix, Micron and their equipment suppliers hard
  - odds: 40
    impact: 3
    text: Nvidia CUDA keeps developers locked in, so new AI chip startups cannot win enough customers to survive
  - odds: 35
    impact: 2
    text: Google, Amazon, Meta and Microsoft use their own AI chips and buy far fewer chips from startups
  - odds: 30
    impact: 2
    text: US chip tariffs and export limits split the market while China builds its own full supply chain
  - odds: 20
    impact: 2
    text: China reimposes its gallium and germanium export ban, cutting key materials for US chipmakers and startups
  - odds: 20
    impact: 1
    text: Chip startups struggle to raise seed and Series A rounds as capital goes only to mega rounds
  - odds: 10
    impact: 3
    text: Cloud giants sharply cut AI spending and Nvidia data center sales fall, dragging down the chip industry
  - odds: 5
    impact: 3
    text: China blockades Taiwan and TSMC output stops, cutting off most of the world's advanced chip supply
  note:
  - We listed the events that could slow semiconductor down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
