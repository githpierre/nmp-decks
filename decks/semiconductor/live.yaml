ed007p:
  type: pp_radar
  title: 'What is actually included

    in the semiconductor market?'
  TL:
    name: ASML
    src: ../../assets/logos/pp_live/semiconductor/s01-00.png
    text: builds the lithography machines that every advanced chip fab depends on, but it sells equipment to chipmakers, not chips
  TR:
    name: Foxconn
    src: ../../assets/logos/pp_live/semiconductor/s01-02.png
    text: assembles iPhones and Nvidia AI servers, but it is a contract manufacturer that buys chips rather than selling them
  BL:
    name: Arm
    src: ../../assets/logos/pp_live/semiconductor/s01-10.png
    text: has always earned its money licensing chip designs to others, but in 2026 it began selling its own data center CPU to Meta
  BR:
    name: Broadcom
    src: ../../assets/logos/pp_live/semiconductor/s01-11.png
    text: sells networking and custom AI chips, but since buying VMware, infrastructure software brings in about 42% of its revenue
  caption:
  - Distance to the center reflects how much of a company's revenue comes from selling chips or making wafers, not tools or devices
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
