ed160:
  6: AI-native insurers took about 41% of the capital raised since 2024, ahead of AI underwriting with about 20%
  7: 139 of the 149 rounds since 2024 disclosed an amount, and the median disclosed round was $13M
  8: US startups closed 112 of the 149 rounds and took $3.1B, about 85% of all the money raised
  9: 9 rounds of $100M or more made up about 33% of all the capital raised in the market since 2024
  10: The $200M round of Ledgebrook in 2026 is the biggest since 2024, ahead of the $180M round of CyberCube
  11: Seed was the most common round, with 52 of the 149 rounds, ahead of Series A with 34 and Series B with 28
  note: We drew these insights from our tracker of 149 AI in insurance equity rounds announced since January 2024, worth about $3.7B
ed162:
  6: 'BEFORE



    Before 2024, AI-first insurers such as Lemonade raised money on growth promises, and most insurers only tested AI in small pilots.'
  7: 'AFTER



    Since 2024, 149 rounds raised $3.7B. AI-native insurers take the biggest share, led by Corgi and Ledgebrook, and insurers now use AI on real claims.'
  note: We used our tracker of AI in insurance equity rounds, complete from January 2024, and company releases and the press
