# Claude's fit rewrites for AI in insurance (22 Nov 2026), same facts as the research
iv_fda:
  7: 'DATA TEST


    A claims lead tests old files for 2 to 4 weeks. Weak lift or messy records can end the trial.'
  8: 'SECURITY CHECK


    IT and privacy teams check data access and vendor terms over weeks. Gaps may block approval.'
  9: 'MODEL REVIEW


    Risk and legal teams test bias and logs over weeks. Unclear decisions stop live policy use.'
  11: 'SYSTEM LINKS


    Engineers link claims and policy systems over 6 to 20 weeks. Failed handoffs can derail launch.'
  10: 'LIVE ROLLOUT


    Ops leaders scale across claims over 8 to 24 months, tracking errors, time and paid losses.'
iv_safety:
  6: 'DENIAL LAWSUITS


    A court ordered 2026 discovery over claims UnitedHealth used AI in care denials. The accusations remain disputed.'
  7: 'FAKE DAMAGE


    Aviva detected £233M in suspected claims fraud in 2025 and separately warned that AI-made images can invent crashes and damage.'
  8: 'BIASED RATES


    New York holds insurers liable for unfair prices even when vendors build the AI, making audits a purchase hurdle.'
  9: 'CORE VENDORS


    Duck Creek launched its own insurance AI platform in April 2026, competing with specialist tools for claims work.'
  10: 'LOSS RATIOS


    Lemonade reported a 65% gross loss ratio for Q3 2026. AI-driven pricing does not remove the basic danger of costly claims.'
ed210:
  rows:
  - - They set prices mainly from broad driver age and ZIP groups
    - Root prices drivers with phone sensors and car data
  - - They wait for yearly rate cycles to update risk prices
    - Root tests its own AI-based pricing models as data grows
  - - They rely on a thin sample of real driving behavior
    - Root has analyzed over 38B miles of driving on its app
  - - They handle each new online sales channel as a new project
    - Root puts car insurance inside partner checkout flows
  - - They buy new data without much past claim-level context
    - Root has data from more than 900,000 claims filed
  - - They rarely put a quote at the point of buying a car
    - Carvana wrote over 250,000 Root policies by August 2026
  - - They scale slowly when entering new state insurance markets
    - Root reached 38 states and about 82% of the US market
  - - They grow premiums but struggle to return a profit
    - Root earned $14M of net income in Q3 2026 on $381M sales
  note:
  - We used Root's SEC shareholder letters to compare live insurance operations, pricing and capital returns.
  - We compare it with a typical car insurer, a made-up baseline and not a real rival that Root named itself.
ed211:
  rows:
  - - They fit pricing models by hand in slow spreadsheets
    - Akur8 uses clear machine learning for insurance rates
  - - They sell pricing tools that are hard to audit later
    - Akur8 makes its risk models open to human review
  - - They read public rate filings one document at a time
    - Akur8 Discover searches filings with AI via Matrisk
  - - They keep model versions scattered across local files
    - Rate Repo puts all insurance rates in one audit trail
  - - They stop after building a model for actuaries to see
    - Deploy moves approved pricing models into live use
  - - They treat claims reserves as a separate software task
    - Akur8 connects pricing and reserve work in one suite
  - - They stay focused on one kind of insurance market
    - Akur8 bought Slope in 2026 to add life insurance pricing
  - - They stay small with a few teams testing the product
    - Akur8 now has over 330 insurer clients in 40+ countries
ed213:
  rows:
  - - They mainly price cyber risk once when a policy starts
    - Coalition uses AI and fresh web data to price cyber risk
  - - They depend on a static form about a company network
    - Coalition scans 4.5B IP addresses every month for risks
  - - They wait until a breach occurs before warning a client
    - Coalition sends AI-based alerts for exposed systems
  - - They use claims records only after an incident is paid
    - Coalition learns from threat feeds and past claim data
  - - They offer general tips without fixing a weak system
    - CoalitionAI gives clients steps to fix critical security flaws
  - - They pay losses but offer little help to recover funds
    - Coalition recovered $22M of clients’ stolen funds in 2025
  - - They negotiate ransom costs without much cyber insight
    - Its response teams cut ransom payments by 65% on average
  - - They only insure old cyber risks with standard cover
    - Coalition also covers cyber losses linked to AI use
ed214:
  rows:
  - - They often take weeks to price one difficult business risk
    - Blackbird can help quote specialty risks within hours
  - - They read complex broker submissions line by line
    - Blackbird reads and classifies each risk submission
  - - They set a price without built-in data-based support
    - Blackbird computes a technical price for each risk
  - - They replace human judgment with a rigid price rule
    - Ledgebrook keeps expert underwriters making final calls
  - - They rely on the same standard cover for most firms
    - Ledgebrook writes custom risk cover for midsize firms
  - - They sell policies directly to firms and households
    - Ledgebrook works only through wholesale brokers
  - - They need a partner carrier to issue all the policies
    - Ledgebrook earned an A- rating for its own carrier
  - - They look for outside capital before scaling the book
    - Ledgebrook raised $200M and is on track for $1B in premiums
ed042:
  note:
  - We compare published insurance AI market estimates, which count incumbent and specialist vendors alike.
  - We round each figure for display and use the exact published values to build our central demand estimate.
