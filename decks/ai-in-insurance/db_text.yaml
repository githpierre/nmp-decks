# Sentences on base figures (ed160, ed162): every figure is a {db.key} of db_facts.yaml, so a base update re-flows them
ed160:
  6: '{db.cat1} took about {db.cat1_pct}% of the capital raised since 2024, ahead of {db.cat2} with about {db.cat2_pct}%'
  7: '{db.disclosed} of the {db.n} rounds since 2024 disclosed an amount, and the median disclosed round was {db.median}'
  8: US startups closed {db.us_n} of the {db.n} rounds and took {db.us_money}, about {db.us_money_pct}% of all the money raised
  9: '{db.big_n} rounds of $100M or more made up about {db.big_pct}% of all the capital raised in the market since 2024'
  10: 'The {db.big1_amt} round of {db.big1_name} in {db.big1_year} is the biggest since 2024, ahead of the {db.big2_amt} round of {db.big2_name}'
  11: Seed was the most common round, with {db.seed} of the {db.n} rounds, ahead of Series A with {db.series_a} and Series B with {db.series_b}
  note: We drew these insights from our tracker of {db.n} AI in insurance equity rounds announced since January 2024, worth about {db.total}
ed162:
  6: 'BEFORE



    Before 2024, AI-first insurers such as Lemonade raised money on growth promises, and most insurers only tested AI in small pilots.'
  7: 'AFTER



    Since 2024, {db.n} rounds raised {db.total}. AI-native insurers take the biggest share, led by Corgi and Ledgebrook, and insurers now use AI on real claims.'
  note: We used our tracker of AI in insurance equity rounds, complete from January 2024, and company releases and the press
