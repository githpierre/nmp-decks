rows:
- name: 'Reserv, $125M

    Series C'
  why: KKR's release on Reserv's $125M Series C, with $100M of yearly recurring revenue
  how: We used it for Reserv's round, revenue and client count. It also showed how AI claims services scale.
  url: https://media.kkr.com/news-details?linkId=938690604&news_id=7616091e-dca4-455d-aedc-bcc70d512bf5
- name: 'Outmarket,

    $34.5M Series B'
  why: Outmarket's post on its Series B and its use by over 300 agencies and 10,000 users
  how: We used it for broker AI adoption. It also dated the fast pace of rounds in insurance AI agents.
  url: https://outmarket.ai/blog/outmarket-raises-34.5-million-series-b-four-months-after-our-series-a
- name: 'NAIC, AI in

    insurance'
  why: The NAIC page on its model AI bulletin and the AI tool piloted by 12 states
  how: We used it for the US rules on insurer AI. It also backed the need for human review and audits.
  url: https://content.naic.org/insurance-topics/artificial-intelligence
- name: 'EIOPA, survey

    on generative AI'
  why: EIOPA's survey of European insurers on how they use generative AI
  how: We used it for the share of projects still in pilots. It also gave the main barriers to adoption.
  url: https://www.eiopa.europa.eu/eiopa-survey-generative-ai-shows-swift-cautious-adoption-among-europes-insurers-2026-02-02_en
- name: 'J.D. Power, 2026

    auto insurance study'
  why: J.D. Power's 2026 US auto insurance study on what customers understand and expect
  how: We used it for policyholder pain points. It also showed how many shoppers now use AI tools.
  url: https://jdpower.com/business/press-releases/2026-us-auto-insurance-study
- name: 'EIOPA, opinion on

    AI governance'
  why: EIOPA's 2025 opinion on how insurers should govern and control their AI systems
  how: We used it for European rules and high-risk pricing in life and health. It also backed the regulation timeline.
  url: https://www.eiopa.europa.eu/eiopa-publishes-opinion-ai-governance-and-risk-management-2025-08-06_en
- name: 'Armilla, AI

    liability cover'
  why: Armilla's release on its standalone AI liability policy backed by Lloyd's underwriters
  how: We used it for the birth of insurance for AI failures. It also dated the AI risk cover segment.
  url: https://www.armilla.ai/resources/armilla-launches-affirmative-ai-liability-insurance-with-lloyds-underwriter-chaucer
- name: 'Lemonade,

    2025 annual report'
  why: Lemonade's 2025 annual report filed with the SEC, with its claims automation figures
  how: We used it for the 55% of claims automated and AI Jim. It also gave the yardstick of an AI-first insurer.
  url: https://www.sec.gov/Archives/edgar/data/1691421/000169142126000016/lmnd-20251231.htm
- name: 'Pace, $46M

    Series B'
  why: Pace's release on its Series B and the 250,000 insurance tasks its agents completed
  how: We used it for AI agents in live service work at Palomar and Prudential. It also dated the agents boom.
  url: https://withpace.com/news/next-century
- name: 'Shift Technology,

    fraud case'
  why: Shift Technology's case study of a US insurer running 15,000 claims a month through its tool
  how: We used it for fraud detection in live claims. It also gave the 73% more fraud flagged than rules.
  url: https://www.shift-technology.com/resources/case-studies/customer-stories/going-beyond-business-rules-to-improve-accuracy
- name: 'New York DFS,

    AI circular letter'
  why: New York DFS circular letter on insurers' use of AI and outside data in pricing
  how: We used it for bias testing and insurer liability for vendor models. It also backed the fairness risks.
  url: https://www.dfs.ny.gov/industry-guidance/circular-letters/cl2024-07
- name: 'Tractable,

    $60M Series D'
  why: Tractable's release on its $60M Series D that made it a unicorn in 2021
  how: We used it for the growth of photo-based car damage AI. It also dated the 2020 to 2022 phase.
  url: https://tractable.ai/tractable-becomes-worlds-first-computer-vision-unicorn-for-financial-services
- name: 'Ledgebrook,

    $200M round'
  why: Ledgebrook's release on its $200M round co-led by Allianz X
  how: We used it for the largest round since 2024 and its Blackbird pricing AI. It also backed the Ledgebrook case.
  url: https://www.ledgebrook.com/press-release/ledgebrook-raises-usd-200-million
- name: 'Corgi, $108M

    and carrier license'
  why: Corgi's release on its $108M raise and approval to run its own insurance carrier
  how: We used it for the rise of AI-native insurers. It also dated Corgi before its later rounds.
  url: https://www.prnewswire.com/news-releases/corgi-insurance-raises-108-million-receives-regulatory-approval-to-launch-the-first-full-stack-insurance-carrier-for-startups-302657727.html
- name: 'Kalepa,

    $75M Series B'
  why: Kalepa's release on its $75M Series B, with revenue and clients tripled in a year
  how: We used it for underwriting AI growth and insurer results. It also backed a market signal.
  url: https://kalepa.com/news-posts/kalepa-raises-75-million-series-b
- name: 'Federato,

    $100M Series D'
  why: Federato's release on its $100M Series D led by Goldman Sachs Alternatives
  how: We used it for investor demand for AI underwriting. It also dated the market getting hot in 2025.
  url: https://www.federato.ai/articles/federato-raises-100-million-series-d-led-by-goldman-sachs
- name: 'Insurance Journal,

    agency AI survey'
  why: Insurance Journal's report on the 2026 agency technology survey
  how: We used it for AI use by agencies, up from 15% to 46%. It also gave brokers' main barriers.
  url: https://www.insurancejournal.com/news/national/2026/09/24/886639.htm
- name: 'Sixfold,

    about us'
  why: Sixfold's company page with its 1.5M submissions and 50 lines of business
  how: We used it for underwriting AI in production. It also backed the myths and the truths that flipped.
  url: https://www.sixfold.ai/about-us
- name: 'Fortune Business

    Insights, AI market'
  why: Fortune Business Insights' AI in insurance market report, with 2025 regional values
  how: We used it for the market size, the growth rate and the split by region. It is one of our four forecasts.
  url: https://www.fortunebusinessinsights.com/ai-in-insurance-market-114760
- name: 'Coalition,

    $250M Series F'
  why: Coalition's release on its $250M Series F that valued it at $5B in 2022
  how: We used it for the growth of cyber insurers built on AI. It also gave Coalition's line on the growth chart.
  url: https://www.coalitioninc.com/en-us/announcements/coalition-closes-250-million-in-series-f-funding
