ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  cut: '2025-07-27'
  title: 'Searches for AI insurance were tiny

    in 2021 and grew until mid-2025'
  date: From late 2021 to mid-2025.
  expl: Searches for AI insurance were too rare to measure in 2021 and 2022, then grew from 2023 as insurers began using AI to price policies, read claims and spot fraud.
  stat_text: more searches in mid-2025<br>than in a typical week before
  caption_period: November 2021 to July 2025
  term: ai insurance
  note:
  - We tracked how often people worldwide googled this term from late 2021 to July 2025
  - Google changed how it counts small terms in mid-2025, so the curve stops in July 2025
  csv: assets/trends/ai-in-insurance/ai-insurance.csv
ed052p:
  type: pp_cagr
  title: 'What will the AI in insurance

    market be worth by 2036?'
  lead: ''
  condition: To be worth that much, the market must move AI from pilots to core underwriting and claims decisions that regulators accept, and prove lower loss ratios, not just faster service, for carriers of every size.
  note:
  - We compared forecasts from Fortune Business Insights, SNS Insider, Emergen and Precedence Research
  - We kept the middle of their 2026 range and a 32% yearly growth, with all the sources at the end of the report
  size: 13
  cagr: 32
  y0: 2026
