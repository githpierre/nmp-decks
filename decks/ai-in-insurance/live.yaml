ed142p:
  title: 'What are the biggest threats

    to the AI in insurance market?'
  events:
  - odds: 45
    impact: 2
    text: More states adopt the NAIC AI bulletin and Colorado style rules, adding audits that slow AI adoption
  - odds: 40
    impact: 3
    text: Guidewire, Duck Creek and Salesforce add AI agents to core systems, crowding out insurtech startups
  - odds: 30
    impact: 2
    text: Allianz and AXA build AI in house with OpenAI and Microsoft instead of buying from startups
  - odds: 30
    impact: 1
    text: EU AI Act high risk rules on life and health pricing raise costs for European AI vendors
  - odds: 25
    impact: 3
    text: Courts rule against UnitedHealth or Cigna in AI claim denial lawsuits, and insurers pause automated decisions
  - odds: 20
    impact: 2
    text: Deepfake photos and documents fool AI claims tools, and insurers return to human adjusters for large claims
  - odds: 15
    impact: 2
    text: A biased AI pricing model leads to a regulator fine and headlines, making insurers cautious buyers
  - odds: 15
    impact: 1
    text: Lemonade and other AI first insurers post losses again, and investors doubt the whole AI insurance story
  note:
  - We listed the events that could slow AI in insurance down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
