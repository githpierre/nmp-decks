- id: ed132
  type: x/newcomers_often_miss_here
  section: Market challenges
  title: What do newcomers often miss here?
  note: We drew these pitfalls from insurer adoption surveys, U.S. supervisory guidance and recent core-platform launches. A working demo is not the same as safe use on live policies.
  src: 132
  t:
    17: AI demos can fail once live claims, insurer audits and old systems enter daily work
    21: Fake claim photos and weak source data can make a fast model confidently wrong
