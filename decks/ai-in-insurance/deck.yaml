- id: iv_fda
  type: x/were_key_phases_market_acceleration
  section: Market challenges
  title: What does it take to get AI into an insurer's daily work?
  note: We combined regulatory control requirements with a published practitioner deployment framework. Durations are illustrative vendor planning ranges, not verified industry averages.
  src: 147
  t:
    7: 'DATA TEST


      A claims lead tests old files for 2 to 4 weeks. Weak lift or messy records can end the trial.'
    8: 'SECURITY CHECK


      IT and privacy teams check data access and vendor terms over weeks. Gaps may block approval.'
    9: 'MODEL REVIEW


      Risk and legal teams test bias and logs over weeks. Unclear decisions stop live policy use.'
    10: 'LIVE ROLLOUT


      Ops leaders scale across claims over 8 to 24 months, tracking errors, time and paid losses.'
    11: 'SYSTEM LINKS


      Engineers link claims and policy systems over 6 to 20 weeks. Failed handoffs can derail launch.'
- id: ed140
  type: x/where_schools_learners_vendors_clash
  section: Market challenges
  title: Where do vendors, insurers and regulators clash?
  src: 140
  t:
    0: Vendors want to launch new price signals without long review cycles
    7: Regulators want proof that AI pricing does not harm protected groups
    9: Brokers want AI answers inside the tools they already use
    10: IT needs secure access and reliable links to core systems
    12: Claimants want clean losses paid in minutes, not days
    13: Fraud teams fear fake photos that pass as real damage
    18: Investors want proof that automation cuts claims cost
    19: Claims teams need people to catch wrong AI decisions
    21: Vendors want to protect their source code and customer data
    22: Supervisors hold insurers liable for outside AI decisions
    24: Startups need an edge that a core vendor cannot copy fast
    25: Core vendors want to put AI agents inside their own systems
- id: iv_safety
  type: x/pain_points_yesterday_vs_today
  section: Market challenges
  title: What could go wrong for AI in insurance?
  note: We separated disputed litigation from confirmed financial and operational disclosures. These examples show plausible failure modes, not a finding that all insurance AI is unsafe.
  src: 54
  t:
    6: 'DENIAL LAWSUITS



      A court ordered 2026 discovery over claims UnitedHealth used AI in care denials. The accusations remain disputed.'
    7: 'FAKE DAMAGE



      Aviva detected £233M in suspected claims fraud in 2025 and separately warned that AI-made images can invent crashes and damage.'
    8: 'BIASED RATES



      New York holds insurers liable for unfair prices even when vendors build the AI, making audits a purchase hurdle.'
    9: 'CORE VENDORS



      Duck Creek launched its own insurance AI platform in April 2026, competing with specialist tools for claims work.'
    10: 'LOSS RATIOS



      Lemonade reported a 65% gross loss ratio for Q3 2026. AI-driven pricing does not remove the basic danger of costly claims.'
