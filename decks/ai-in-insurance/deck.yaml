    25: Insurers still own each price decision, even when a third-party AI built the model
    28: Most insurer AI still helps staff. Letting it deny claims needs much stronger proof
- id: ed133
  type: x/has_held_back_market_growth
  section: Market challenges
  title: What has held back market growth so far?
  note: We divided market growth into broad phases using regulatory milestones, insurer surveys and transaction disclosures. The phases are editorial groupings, not measured adoption waves.
  src: 133
  t:
    6: '2017 - 2020


      Predictive pricing and digital claims grew, but insurers needed clean loss data, human checks and links to old policy systems.'
    7: '2021 - 2023


      New AI tools spread in claims and underwriting, yet mixed insurer systems and weak vendor oversight slowed adoption.'
    8: '2024 - 2025


      New York issued AI underwriting guidance and Europe refined its rules. More insurance AI vendors emerged, but many buyers stayed in trial mode.'
    9: 'TODAY


      Insurers have many AI tools to try, but still need to prove fair prices, safe claims, clean data and a real gain after rollout.'
    10: '2025 - 2026


      Big acquisitions and funding backed claims AI, while EIOPA found that most generative AI uses remained pilots.'
