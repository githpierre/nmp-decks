  type: x/have_been_different_waves_hot
  section: Top players
  title: What have been the different waves of ‘hot’ startups over time?
  note: We use public launches, funding milestones and acquisitions to mark broad waves. These periods overlap and are not an exhaustive history.
  src: 174
  t:
    6: '2014 - 2017


      Shift and Tractable built AI for fraud and photo claims. Coalition and At-Bay added digital risk models to cyber cover.'
    7: '2018 - 2021


      Shift and Tractable each passed $1B in value in 2021. The first wave showed investors would fund specialist insurance AI at scale.'
    8: '2022 - 2024


      Coalition hit $5B in 2022. New firms such as Sixfold and Corgi began rebuilding insurance around AI-first workflows and carriers.'
    9: '2025 - 2026


      Applied bought Cytora, CCC bought EvolutionIQ, and Corgi was reported at $5B. Big groups bought AI outright.'
    10: '?


      The next test is whether AI improves actual insurer loss ratios, claim costs, or premium per employee. Deals alone do not prove lasting gains.'
