- id: ed024
  type: dated
  section: Market definition
  title: What has changed (very) recently?
  page: 1/2
  items:
  - d: IN 2024
    t: Akur8 bought Arius, moving beyond machine-learning insurance pricing into reserves, the money set aside to pay claims. It showed AI vendors building wider actuarial software stacks.
  - d: IN 2025
    t: Cytora introduced a platform using AI agents to digitize complex commercial insurance risk files. It made automated intake a core insurance AI product, not just data entry.
  - d: IN 2025
    t: Armilla launched standalone AI liability insurance backed by Lloyd's underwriters including Chaucer. It gave buyers a named policy for certain model errors and AI system failures.
  - d: IN 2025
    t: Federato raised a $100M Series D led by Goldman Sachs Alternatives to expand its AI-native insurance platform. The round showed investor demand for replacing dated underwriting systems.
  - d: IN 2025
    t: Akur8 launched Rate Repo and Deploy, connecting pricing model work to rate records and production use. The move aimed to shorten the handoff from actuarial models to live policy prices.
  - d: IN 2025
    t: Nirvana raised $100M in a Series D to expand AI-driven commercial trucking insurance. The company uses fleet data and modern claims tools rather than only standard application forms.
  note:
  - We chose changes backed by product launches, signed financing or reported business activity.
  - We separate completed milestones from plans, and do not treat funding as proof of profit.
  src: 24
- id: ed025
  type: dated
  section: Market definition
  title: What has changed (very) recently?
  page: 2/2
  items:
  - d: IN 2026
    t: Corgi announced a $160M Series B at a $1.3B valuation after receiving approval to operate as a carrier. Its plan combines startup insurance with AI-based underwriting and claims systems.
  - d: IN 2026
    t: Reserv raised $125M in a Series C led by KKR and said its AI-native claims business served nearly 200 insurers and brokers. That showed demand for outsourced claims work built around AI.
  - d: IN 2026
    t: Pace raised $46M in a Series B and said its AI agents had completed over 250,000 insurance workflows. It cited live use at Prudential and Palomar rather than only future pilot projects.
  - d: IN 2026
    t: Outmarket raised a $35M Series B after saying its broker workflow platform had reached over 300 agencies and 10,000 users. The round followed its Series A by only a few months.
  - d: IN 2026
    t: Cowbell launched AI liability insurance on November 10, covering failures of autonomous agents. Its underwriting assesses AI observability, autonomy and governance to help price that risk.
  - d: IN 2026
    t: Guidewire agreed to buy AI underwriting startup hyperexponential for $1.7B in cash plus a possible earnout. The deal was announced in October and had not yet closed.
  note:
  - We selected financed or deployed milestones with clear public dates and named firms.
  - We treat the Guidewire deal as pending, not complete, and cite company reports for scale.
  src: 25
