- id: ed015
  type: x/some_common_myths_about
  section: Market definition
  title: What are some common myths about AI in insurance?
  page: 1/2
  note: We separate live deployments and insurer-reported outcomes from product claims. A model can flag risk without making the final decision.
  src: 15
  t:
    0: Fraud AI can reject any claim on its own
    7: Lemonade says it automated roughly 55% of claims in 2025, not all of them. Its bot sends cases it cannot settle or finds concerning to claims experts.
    9: AI already pays every claim without a person
    10: Sixfold reports more than 1.5 million real submissions across 50-plus insurance lines. Generali also reports requiring AI input on each cyber quote.
    12: Insurance AI is still just a series of pilots
    13: Insurers use AI in risk pricing, fraud reviews and damage checks too. EIOPA places it across underwriting, claims and customer service.
    15: Using AI in insurance means adding a chatbot
    16: Tokio Marine says Shift AI flags unusual claim images for review. Claims staff still decide outcomes rather than letting the model deny claims.
    20: 🤥
    21: 🤥
    22: 🤥
    23: 🤥
- id: ed016
  type: x/some_common_myths_about
  section: Market definition
  title: What are some common myths about AI in insurance?
  page: 2/2
  note: We use regulator texts, live deployments and signed transactions. A contract announcement alone does not prove better losses.
  src: 16
  t:
    0: Insurers have no real AI rules to follow yet
    7: Generali reports that Sixfold now helps with most cyber submissions. Its case study shows 90% underwriter adoption and turnaround times cut in half.
    9: Big insurers will never trust AI in core work
    10: Guidewire agreed to buy hyperexponential for $1.7B plus extra payments. It said the target already backed decisions on $75B in annual premium.
    12: AI startup tools have no room next to big firms
    13: Armilla launched standalone liability cover for AI failures at Lloyd's in 2025. Its policy targets model errors and other losses tied to AI systems.
    15: AI risk cannot get its own insurance cover
    16: US regulators adopted a model AI bulletin in 2023, and EIOPA issued an AI governance opinion in 2025. Firms must still meet insurance rules.
    20: 🤥
    21: 🤥
    22: 🤥
    23: 🤥
- id: ed017
  type: maturity
  section: Market definition
  title: How mature is AI in insurance as a market?
  score: 62
  text: 'The market is past the pilot stage in some areas: live AI now reads claims, helps underwriters and completes insurance service work. Adoption is uneven, however. Model errors, insurer approval, regulation and weak public data on loss results still limit how fully these systems can replace manual work.'
  note:
  - We use an internal score based on production use, measurable insurer results, product breadth and buyer demand.
  - We set 62/100 because scaled uses are real, but proof of better loss ratios and safe autonomy remains uneven.
  src: 17
