- id: ed006
  type: definition
  section: Market definition
  title: What is the AI in insurance market, in simple terms?
  text: AI in insurance covers startups using data models to price risk, review claims, find fraud or handle insurance work in ways that traditional software cannot.
  note: We include companies whose core insurance product or business model depends on AI, not every insurer that installs a chatbot.
  src: 6
  icon_tl: 🛡️
