ed148p:
  title: 'What pushed the carbon credit

    market forward, year after year?'
  events:
  - year: '1997'
    text: Kyoto creates tradable carbon mechanisms
    impact: 3.0
  - year: '2005'
    text: EU ETS makes carbon tradable at scale
    impact: 2.5
  - year: '2005'
    text: Kyoto takes effect globally
    impact: 2.0
  - year: '2007'
    text: VCS standardizes voluntary carbon credits
    impact: 2.0
  - year: '2008'
    text: Kyoto period boosts project credits
    impact: 1.5
  - year: '2009'
    text: EU allowance trading volume doubles
    impact: 1.5
  - year: '2010'
    text: REDD+ expands forest credit opportunity
    impact: 1.5
  - year: '2011'
    text: Carbon trading reaches daily scale
    impact: 1.5
  - year: '2012'
    text: EU ETS dominates global carbon value
    impact: 2.0
  - year: '2015'
    text: Paris Agreement anchors global climate action
    impact: 2.0
  - year: '2016'
    text: Corporate net zero targets lift offsets
    impact: 1.5
  - year: '2017'
    text: Aviation offset rules create future demand
    impact: 1.5
  - year: '2018'
    text: Nature credits attract corporate procurement
    impact: 1.5
  - year: '2019'
    text: Net zero commitments accelerate credit buying
    impact: 2.0
  - year: '2020'
    text: Corporate climate pledges boost VCM activity
    impact: 2.0
  - year: '2021'
    text: COP26 advances Article 6 rules
    impact: 2.0
  - year: '2021'
    text: Carbon prices raise market attention
    impact: 1.5
  - year: '2022'
    text: Integrity backlash forces quality upgrades
    impact: 1.5
  - year: '2022'
    text: Removal credits command quality premiums
    impact: 1.5
  - year: '2023'
    text: Core Carbon Principles set benchmark
    impact: 2.5
  - year: '2023'
    text: Claims rules tighten corporate credit use
    impact: 1.5
  - year: '2024'
    text: COP29 completes Article 6 building blocks
    impact: 2.0
  - year: '2024'
    text: UN adopts carbon removal standards
    impact: 1.5
  - year: '2025'
    text: Buyers sort credits by quality
    impact: 2.0
  - year: '2025'
    text: CCP labels reshape eligible supply
    impact: 1.5
  - year: '2025'
    text: Article 6 implementation enters practice
    impact: 1.5
  - year: '2026'
    text: Verra updates Article 6 labels
    impact: 2.0
  - year: '2026'
    text: CORSIA guidance clarifies eligible credits
    impact: 2.0
  - year: '2026'
    text: Quality sorting stabilizes buyer demand
    impact: 1.5
  - year: '2026'
    text: Compliance links widen carbon demand
    impact: 2.0
  note:
  - We kept the events we believe pushed carbon credit forward the most
  - Ratings are our estimates, with all the sources at the end of the report
