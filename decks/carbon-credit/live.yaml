ed007p:
  type: pp_radar
  title: 'Which companies really

    belong in carbon credit?'
  TL:
    name: Watershed
    src: ../../assets/logos/pp_live/carbon-credit/s01-00.png
    text: is mainly emissions accounting and decarbonization software, not a carbon credit creation or trading platform
  TR:
    name: Tesla
    src: ../../assets/logos/pp_live/carbon-credit/s01-02.png
    text: sells electric vehicles and energy products, not carbon credit project development, verification or marketplaces
  BL:
    name: Pachama
    src: ../../assets/logos/pp_live/carbon-credit/s01-09.png
    text: combines forest carbon projects, monitoring and credit sales, spanning development, MRV and marketplace roles
  BR:
    name: Climeworks
    src: ../../assets/logos/pp_live/carbon-credit/s01-10.png
    text: removes carbon and sells removal credits, but its core business is operating direct air capture plants
  caption:
  - Distance to the center reflects how central each company is to carbon credit
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
  - ../../assets/logos/pp_live/carbon-credit/s01-01.png
