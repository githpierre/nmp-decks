ed052p:
  type: pp_cagr
  title: 'How much room is left

    for carbon credit to grow?'
  lead: 'To fill that room, '
  condition: growth requires credible additionality, better MRYV, trusted registries, transparent pricing and policy that lets buyers use high-quality credits
    with confidence.
  note:
  - We compared forecasts from Grand View Research, Fortune Business Insights and Mordor Intelligence
  - We adjusted each one to our market definition, and all the sources are included at the end of the report
  size: 7.2
  cagr: 29
  y0: null
