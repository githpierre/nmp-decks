ed142p:
  title: 'What could slow

    proptech down?'
  events:
  - odds: 25
    impact: 3
    text: A long real estate downturn keeps home sales weak and cuts transaction revenue for brokers and proptech
  - odds: 20
    impact: 3
    text: High interest rates last for years and proptech venture funding keeps falling, starving startups of capital
  - odds: 20
    impact: 3
    text: AppFolio, Entrata and RealPage bundle AI agents free inside their platforms, crowding out proptech startups
  - odds: 15
    impact: 2
    text: Office owners slash tech spending as loan delinquencies rise, cutting demand for commercial proptech software
  - odds: 12
    impact: 2
    text: Landlords and brokers lose faith in AI tools after failed pilots and cut proptech AI budgets sharply
  - odds: 10
    impact: 2
    text: A breach at a property platform exposes millions of renter records and triggers lawsuits and new rules
  - odds: 8
    impact: 3
    text: Congress bans algorithmic rent pricing nationwide, hitting RealPage, Yardi and startups that sell pricing software
  - odds: 5
    impact: 1
    text: A rent payment platform outage blocks payments for millions of tenants and landlords lose trust in proptech
  note:
  - We listed the events that could slow proptech down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
