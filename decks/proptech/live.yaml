ed007p:
  type: pp_radar
  title: 'What Is actually included

    in the proptech market?'
  TL:
    name: Procore
    src: ../../assets/logos/pp_live/proptech/s01-00.png
    text: sells software to run construction projects, so it helps build property rather than operate, lease or sell it
  TR:
    name: Lemonade
    src: ../../assets/logos/pp_live/proptech/s01-02.png
    text: sells renters and homeowners insurance using AI, but insurance not tied to running a property belongs to insurtech
  BL:
    name: Opendoor
    src: ../../assets/logos/pp_live/proptech/s01-09.png
    text: uses algorithms to price and buy homes, but it earns its revenue mainly by reselling those homes, so it sits on the line
  BR:
    name: Zillow
    src: ../../assets/logos/pp_live/proptech/s01-10.png
    text: draws over 200 million users a month to browse homes, but most of its revenue comes from agents and builders buying leads
  caption:
  - Distance to the center reflects how directly a product helps operate, lease or sell real estate, rather than build or insure it
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
  - ../../assets/logos/pp_live/proptech/s01-01.png
