ed052p:
  type: pp_cagr
  title: 'How much room is left

    for PropTech to grow?'
  lead: 'To fill that room, '
  condition: the market must keep moving landlords, agents, and owners from spreadsheets to software, and turn AI agents into paid products. It must also
    get through real estate downturns and rules on pricing tools, while owners keep paying for software when rates stay high.
  note:
  - We compared forecasts from Grand View, Fortune, Mordor and Precedence and adjusted each one to our market definition
  - We then built a realistic range from these forecasts, and you will find all the sources we used at the end of the report
  size: 45
  cagr: 12
  y0: 2029
