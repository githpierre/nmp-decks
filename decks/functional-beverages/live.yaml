ed007p:
  type: pp_radar
  title: 'Which companies really belong

    in functional beverages?'
  TL:
    name: Liquid LV.
    src: ../../assets/logos/pp_live/functional-beverages/s01-00.png
    text: is mainly sold as hydration powder, so it supports beverage occasions without being a ready-to-drink company
  TR:
    name: Coca-Cola
    src: ../../assets/logos/pp_live/functional-beverages/s01-02.png
    text: mainly sells conventional soft drinks, so most revenue lacks a specific health or performance benefit claim
  BL:
    name: Huel
    src: ../../assets/logos/pp_live/functional-beverages/s01-09.png
    text: sells ready-to-drink nutrition products, but much of its range is powders and meals rather than functional beverage
  BR:
    name: Chobani
    src: ../../assets/logos/pp_live/functional-beverages/s01-10.png
    text: sells probiotic and protein drinks, but most of its business is yogurt and other conventional refrigerated foods
  caption:
  - Distance to the center reflects how central each company is to functional beverages
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
