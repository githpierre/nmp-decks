ed052p:
  type: pp_cagr
  title: 'Is the medical imaging AI

    market still growing fast?'
  lead: ''
  condition: Yes, but imaging AI must move from single findings to models that read whole exams, and win more payment codes like the one for heart plaque.
    It must also prove a clear return to hospitals and keep its prices up while device makers and Big Tech offer AI for free or bundled.
  note:
  - We compared forecasts from Grand View, Global Market Insights, Meticulous and MarketsandMarkets
  - We allowed for free models from Big Tech, and all the sources we used are listed at the end of the report
  size: 2.6
  cagr: 24
  y0: 2026
