ed007p:
  type: pp_radar
  title: 'What is actually included

    in the AI tutoring market?'
  TL:
    name: OpenAI
    src: ../../assets/logos/pp_live/ai-tutoring/s01-00.png
    text: chatGPT can explain schoolwork, but OpenAT is a general AI platform rather than a dedicated tutoring company
  TR:
    name: Instructure
    src: ../../assets/logos/pp_live/ai-tutoring/s01-02.png
    text: manages courses and schools, but it does not primarily provide direct AI tutoring to learners
  BL:
    name: Quizlet
    src: ../../assets/logos/pp_live/ai-tutoring/s01-09.png
    text: includes AI learning help, but flashcards, practice tests and study tools remain a large part of the product
  BR:
    name: Duolingo
    src: ../../assets/logos/pp_live/ai-tutoring/s01-10.png
    text: uses AI tutoring and conversation inside a broader language- learning product with many self-study modes
  caption:
  - Distance to the center reflects how central each company is to AI tutoring
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
