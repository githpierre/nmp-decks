ed007p:
  type: pp_radar
  title: 'Where does AI protein design

    start, and where does it stop?'
  TL:
    name: Adaptyv
    src: ../../assets/logos/pp_live/ai-protein-design/s01-00.png
    text: runs an automated lab that tests AI-designed proteins for clients like Roche, but the designs come from its customers
  TR:
    name: Samsung Biologics
    src: ../../assets/logos/pp_live/ai-protein-design/s01-02.png
    text: makes antibodies for drug makers at huge scale, but it produces proteins that others designed for it
  BL:
    name: Absci
    src: ../../assets/logos/pp_live/ai-protein-design/s01-09.png
    text: designs antibodies with generative AI, but its focus is now testing its own hair loss drug, like a classic biotech
  BR:
    name: AbCellera
    src: ../../assets/logos/pp_live/ai-protein-design/s01-10.png
    text: found an early COVID antibody by screening a recovered patient's immune cells, which is discovery more than design
  caption:
  - Distance to the center reflects how much a company creates new protein sequences, rather than finding, testing or making them
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
