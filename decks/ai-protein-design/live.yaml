ed142p:
  title: 'What could go wrong

    for AI protein design?'
  events:
  - odds: 25
    impact: 2
    text: Wet lab testing stays slow and costly, so AI protein design startups cannot speed up drug discovery
  - odds: 20
    impact: 2
    text: Generate Biomedicines shares keep sliding from the $16 IPO price, closing public markets to AI protein startups
  - odds: 20
    impact: 3
    text: Free models like RFdiffusion3, Boltz-2 and OpenFold3 match paid tools, wiping out software revenue for startups
  - odds: 15
    impact: 2
    text: New biosecurity rules restrict AI protein design tools after Microsoft showed they can redesign toxins
  - odds: 15
    impact: 2
    text: Lilly, Novartis and other pharma giants build their own protein design models and stop licensing startups
  - odds: 15
    impact: 2
    text: Funding for AI protein design startups stops as revenue stays under $100 million for the leaders
  - odds: 15
    impact: 3
    text: The first AI-designed protein drugs fail in Phase 2 or Phase 3 trials, and investors pull back
  - odds: 5
    impact: 2
    text: The USPTO or courts deny patents on AI-designed proteins, cutting the value of AI drug pipelines
  note:
  - We listed the events that could slow ai protein design down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
