ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people look up protein

    design, as AI starts to design proteins'
  date: Lately.
  expl: AlphaFold showed that AI can predict how proteins fold, and its creators won a Nobel Prize. Now startups use AI to design brand-new proteins for
    medicines and enzymes, and people went looking for how protein design works.
  term: ai protein design
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/ai-protein-design/ai-protein-design.csv
ed052p:
  type: pp_cagr
  title: 'How much bigger can

    AI protein design get?'
  lead: ''
  condition: To get that big, the first AI-engineered antibodies must succeed in Phase 3, and pharma must pay more upfront instead of only when drugs succeed.
    Designs must also pass the stability and safety tests that decide whether a protein can become a drug, so labs test fewer of them for each target.
  note:
  - We compared forecasts from Grand View, Spherical Insights, MarketsandMarkets and Astute Analytica
  - We allowed for slower growth as the base gets larger, and all our sources are at the end of the report
  size: 1.6
  cagr: 25
  y0: 2027
