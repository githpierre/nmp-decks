ed007p:
  type: pp_radar
  title: 'Which companies really

    belong in dental AI?'
  TL:
    name: 3Shape
    src: ../../assets/logos/pp_live/dental-ai/s01-00.png
    text: digital scanning and CAD lead its business while AI diagnosis is an added module rather than the company core
  TR:
    name: Colgate-Palmolive
    src: ../../assets/logos/pp_live/dental-ai/s01-02.png
    text: it sells oral care products worldwide and may use AI in R&D, but it does not sell dental AI software to clinics
  BL:
    name: Relu
    src: ../../assets/logos/pp_live/dental-ai/s01-09.png
    text: its AI converts dental CBCT into anatomy and planning data, sitting between dental AI and broader digital planning
  BR:
    name: Dandy
    src: ../../assets/logos/pp_live/dental-ai/s01-10.png
    text: its digital lab workflow now includes AI scan review, but most revenue still comes from lab services and prosthetics
  caption:
  - Distance to the center reflects how central each company is to dental AI
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
