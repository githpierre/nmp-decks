ed148p:
  title: 'What pushed the immuno-oncology

    market forward, year after year?'
  events:
  - year: '1891'
    text: Coley toxins reveal immune antitumor effects
    impact: 1.0
  - year: '1957'
    text: Immune surveillance theory reframes cancer
    impact: 1.0
  - year: '1975'
    text: Hybridomas scale monoclonal antibodies
    impact: 1.5
  - year: '1976'
    text: BCG proves immune therapy can work
    impact: 2.0
  - year: '1984'
    text: Interleukin-2 produces durable remissions
    impact: 2.0
  - year: '1992'
    text: FDA approves IL-2 immunotherapy
    impact: 1.5
  - year: '1992'
    text: PD-1 discovery exposes immune braking
    impact: 1.5
  - year: '1995'
    text: CTLA-4 blockade unlocks T cells
    impact: 2.0
  - year: '1997'
    text: Rituximab validates therapeutic antibodies
    impact: 1.5
  - year: '2010'
    text: Sipuleucel-T validates cancer vaccination
    impact: 2.0
  - year: '2011'
    text: Ipilimumab launches checkpoint blockade
    impact: 3.0
  - year: '2013'
    text: Science names immunotherapy breakthrough
    impact: 1.0
  - year: '2014'
    text: Pembrolizumab validates PD-1 blockade
    impact: 3.0
  - year: '2014'
    text: Nivolumab deepens PD-1 competition
    impact: 2.0
  - year: '2014'
    text: Blinatumomab validates T-cell engagers
    impact: 2.0
  - year: '2016'
    text: Atezolizumab establishes PD-L1 blockade
    impact: 1.5
  - year: '2017'
    text: First CAR-T approval transforms blood cancer
    impact: 3.0
  - year: '2017'
    text: Yescarta broadens CAR-T into lymphoma
    impact: 2.0
  - year: '2018'
    text: Checkpoint pioneers win Nobel Prize
    impact: 1.0
  - year: '2020'
    text: Tecartus expands autologous CAR-T reach
    impact: 1.0
  - year: '2021'
    text: BCMA CAR-T reaches multiple myeloma
    impact: 2.0
  - year: '2022'
    text: LAG-3 adds a new checkpoint
    impact: 1.5
  - year: '2023'
    text: CAR-T secondary cancer risk investigated
    impact: 0.5
  - year: '2024'
    text: Lifileucel validates TIL therapy
    impact: 2.0
  - year: '2024'
    text: CAR-T boxed warnings sharpen monitoring
    impact: 0.5
  - year: '2025'
    text: FDA removes CAR-T REMS burden
    impact: 1.5
  - year: '2026'
    text: Tregzi validates regulatory T-cell therapy
    impact: 2.0
  - year: '2026'
    text: Oncolytic virus wins melanoma approval
    impact: 2.0
  - year: '2026'
    text: Keytruda biosimilars near FDA review
    impact: 1.0
  - year: '2026'
    text: Checkpoint use moves into earlier disease
    impact: 1.5
  note:
  - We kept the events we believe pushed immuno oncology forward the most
  - Ratings are our estimates, with all the sources at the end of the report
