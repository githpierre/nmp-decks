ed007p:
  type: pp_radar
  title: 'Who Is In immuno-oncology,

    and who stays outside?'
  TL:
    name: Seagen
    src: ../../assets/logos/pp_live/immuno-oncology/s01-00.png
    text: built antibody drug conjugates that kill tumors directly, rather than primarily activating anti tumor immunity
  TR:
    name: Guardant Health
    src: ../../assets/logos/pp_live/immuno-oncology/s01-02.png
    text: provides liquid biopsy diagnostics for cancer care but does not develop immune directed oncology medicines
  BL:
    name: AstraZeneca
    src: ../../assets/logos/pp_live/immuno-oncology/s01-09.png
    text: has major checkpoint and immune oncology programs, while oncology also includes many non immune mechanisms
  BR:
    name: Roche
    src: ../../assets/logos/pp_live/immuno-oncology/s01-10.png
    text: markets checkpoint immunotherapy and develops immune oncology drugs, alongside a broad non immune portfolio
  caption:
  - Distance to the center reflects how central each company is to immuno-oncology
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
