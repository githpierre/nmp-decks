ed142p:
  title: 'What could go wrong

    for frontier AI labs?'
  events:
  - odds: 45
    impact: 2
    text: Chinese labs like DeepSeek and Qwen release open models that match GPT level quality for free
  - odds: 40
    impact: 2
    text: The EU AI Act forces frontier labs to file safety reports and delay launches in Europe
  - odds: 40
    impact: 1
    text: Top researchers leave for Meta and new startups, slowing model releases at smaller labs
  - odds: 25
    impact: 3
    text: Scaling gains slow sharply and new models fail to beat prior versions on key benchmarks
  - odds: 20
    impact: 3
    text: Courts rule against OpenAI in New York Times and author copyright suits and order large damages
  - odds: 20
    impact: 2
    text: Microsoft, Google and Amazon cut cloud credits and compute deals as AI revenue disappoints investors
  - odds: 15
    impact: 3
    text: OpenAI, Anthropic or Mistral fails to raise its next round and slashes compute and staff plans
  - odds: 8
    impact: 3
    text: A frontier model enables a serious cyberattack and Congress passes strict licensing rules for labs
  note:
  - We listed the events that could slow frontier ai labs down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
