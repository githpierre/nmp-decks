ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'People keep searching for LLM

    as a new model drops every few weeks'
  date: In recent months.
  expl: 'New models kept coming every few weeks: GPT-5, Gemini 3, Claude and a wave of Chinese open models. Each launch brought new people to the topic,
    and companies everywhere started choosing which LLM to use. The term never left the top of the searches.'
  term: frontier ai labs
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/frontier-ai-labs/frontier-ai-labs.csv
ed052p:
  type: pp_cagr
  title: 'How much bigger can

    frontier AI labs get?'
  lead: ''
  condition: To get that big, labs must keep turning usage into paid demand from businesses, while raising the huge sums needed to buy computing every year.
    They must also keep prices above their serving costs, win against free open models, and avoid a crash if AI revenue grows slower than the spending behind
    it.
  note:
  - We compared forecasts from Grand View, Precedence, MarketsandMarkets and OpenAI's own plan
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: 15
  cagr: 22
  y0: 2026
