ed142p:
  title: 'What could go wrong

    for medical imaging AI?'
  events:
  - odds: 30
    impact: 3
    text: Medicare contractors refuse to pay for most imaging AI, so hospitals stop buying it
  - odds: 25
    impact: 3
    text: GE HealthCare and Siemens Healthineers bundle AI into their scanners and win most imaging AI deals
  - odds: 20
    impact: 2
    text: Google's free MedGemma and other open models make many paid imaging AI tools look overpriced
  - odds: 20
    impact: 2
    text: Hospitals cannot measure a return on imaging AI and cancel contracts with startups
  - odds: 12
    impact: 3
    text: Microsoft bundles AI reports into PowerScribe, squeezing standalone imaging AI startups like Aidoc
  - odds: 10
    impact: 1
    text: Patent suits between incumbents and startups block key imaging AI features from US sales for years
  - odds: 8
    impact: 2
    text: An AI tool misses a cancer on a scan, and the lawsuit makes radiologists distrust AI
  - odds: 5
    impact: 2
    text: A cloud imaging AI vendor leaks millions of patient scans, and hospitals pull back from cloud tools
  note:
  - We listed the events that could slow medical imaging ai down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
