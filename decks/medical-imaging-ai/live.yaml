ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people ask

    what AI radiology can really do'
  date: Lately.
  expl: AI that reads X-rays and scans spots things in seconds. After many tools won regulatory approval, hospitals and radiologists began asking what AI
    radiology can really do.
  term: medical imaging ai
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/medical-imaging-ai/medical-imaging-ai.csv
ed052p:
  type: pp_cagr
  title: 'Is the medical imaging AI

    market still growing fast?'
  lead: ''
  condition: Yes, but imaging AI must move from single findings to models that read whole exams, and win more payment codes like the one for heart plaque.
    It must also prove a clear return to hospitals and keep its prices up while device makers and Big Tech offer AI for free or bundled.
  note:
  - We compared forecasts from Grand View, Global Market Insights, Meticulous and MarketsandMarkets
  - We allowed for free models from Big Tech, and all the sources we used are listed at the end of the report
  size: 2.6
  cagr: 24
  y0: 2026
