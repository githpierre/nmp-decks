ed007p:
  type: pp_radar
  title: 'What Is In medical imaging ATI,

    and what stays outside of it?'
  TL:
    name: GE HealthCare
    src: ../../assets/logos/pp_live/medical-imaging-ai/s01-00.png
    text: leads the FDA list with 100 AlI-enabled device clearances, but most of that AI ships inside the scanners it sells
  TR:
    name: Grail
    src: ../../assets/logos/pp_live/medical-imaging-ai/s01-01.png
    text: looks for over 50 cancer types in a single blood test, but it reads blood samples, not scans, so it is not imaging AI
  BL:
    name: Rad AT
    src: ../../assets/logos/pp_live/medical-imaging-ai/s01-10.png
    text: sells to radiologists, but its main product drafts report impressions from dictated findings without looking at images
  BR:
    name: Butterfly Network
    src: ../../assets/logos/pp_live/medical-imaging-ai/s01-11.png
    text: adds AI guidance to its handheld ultrasound, but its probes still make up about half of its total revenue
  caption:
  - Distance to the center reflects how much the AI itself reads or improves medical images, rather than devices or other tests
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
