    impact: 3.0
  - year: '2024'
    text: Computer vision improves amateur analysis
    impact: 1.0
  - year: '2024'
    text: Wearables integrate recovery and sleep
    impact: 1.5
  - year: '2025'
    text: Automated scouting expands talent coverage
    impact: 2.0
  - year: '2025'
    text: Leagues monetize richer tracking datasets
    impact: 1.0
  - year: '2025'
    text: AI summaries reduce analyst workload
    impact: 1.5
  - year: '2026'
    text: Hudl launches AI match insights
    impact: 2.0
