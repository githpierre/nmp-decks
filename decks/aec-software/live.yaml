ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More builders google BIM software

    as 3D models become the norm'
  date: Lately.
  expl: More governments and large clients now ask for 3D building models instead of flat drawings. Architects and contractors went looking for BIM software,
    and new AI features made these tools easier to use.
  term: aec software
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/aec-software/aec-software.csv
ed052p:
  type: pp_cagr
  title: 'Can the AEC software

    market still grow?'
  lead: ''
  condition: Yes, but the market must move small architecture and engineering firms to cloud subscriptions and make BIM data flow from design to the job
    site, so contractors pay for one model instead of five tools.
  note:
  - We compared forecasts from Grand View, Credence Research, The Business Research Company and Technavio
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: 13
  cagr: 10
  y0: 2026
