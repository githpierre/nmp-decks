ed148p:
  title: 'What pushed AEC software

    forward, year after year?'
  events:
  - year: '1982'
    text: AutoCAD brings drafting onto PCs
    impact: 3.0
  - year: '1984'
    text: Archicad introduces model based architecture
    impact: 2.0
  - year: '1986'
    text: MicroStation expands PC engineering CAD
    impact: 2.0
  - year: '1993'
    text: Archicad reaches Windows design teams
    impact: 1.5
  - year: '1995'
    text: Open IFC effort tackles model silos
    impact: 2.0
  - year: '1997'
    text: Archicad enables shared team models
    impact: 2.0
  - year: '1999'
    text: ProjectWise connects engineering files
    impact: 1.5
  - year: '2000'
    text: SketchUp simplifies early 3D design
    impact: 2.0
  - year: '2002'
    text: Autodesk buys Revit to scale BIM
    impact: 3.0
  - year: '2003'
    text: Civil Series links survey and infrastructure
    impact: 1.5
  - year: '2005'
    text: buildingSMART advances open BIM collaboration
    impact: 1.5
  - year: '2007'
    text: Autodesk buys clash detection tools
    impact: 2.0
  - year: '2009'
    text: Graphisoft BIM Server enables teamwork
    impact: 1.5
  - year: '2011'
    text: UK announces mandatory collaborative BIM
    impact: 3.0
  - year: '2012'
    text: BIM 360 moves coordination to cloud
    impact: 2.0
  - year: '2013'
    text: IFC4 improves cross vendor model exchange
    impact: 2.0
  - year: '2014'
    text: BIMcloud connects remote design teams
    impact: 1.5
  - year: '2016'
    text: UK BIM mandate creates buying requirements
    impact: 3.0
  - year: '2018'
    text: ISO 19650 standardizes BIM workflows
    impact: 2.0
  - year: '2019'
    text: Bentley iTwin links digital twins
    impact: 2.0
  - year: '2019'
    text: Autodesk cloud unifies project workflows
    impact: 2.0
  - year: '2020'
    text: Autodesk adds AI generative site design
    impact: 2.0
  - year: '2021'
    text: Autodesk buys water modeling leader
    impact: 1.5
  - year: '2021'
    text: Autodesk Build connects site management
    impact: 1.5
  - year: '2023'
    text: Forma puts early design in cloud
    impact: 2.0
  - year: '2024'
    text: IFC 4.3 supports road and rail models
    impact: 2.0
  - year: '2024'
    text: EU building efficiency rules tighten modeling
    impact: 2.0
  - year: '2024'
    text: Bentley buys Cesium for geospatial twins
    impact: 1.5
  - year: '2026'
    text: Revit adds contextual AI modeling assistant
    impact: 2.5
  - year: '2026'
    text: Revit upgrades automated MEP sizing
    impact: 1.5
  note:
  - We kept the events we believe pushed aec software forward the most
  - Ratings are our estimates, with all the sources at the end of the report
