ed142p:
  title: 'What are the biggest

    threats to agritech?'
  events:
  - odds: 45
    impact: 3
    text: The farm downturn deepens as Deere sales and US farm income keep falling and farmers stop buying
  - odds: 40
    impact: 3
    text: Deere, AGCO and CNH copy or buy precision ag tech, leaving startups with little room to sell
  - odds: 30
    impact: 2
    text: Agrifoodtech venture funding keeps falling below 2025 levels, leaving many startups unable to raise their next round
  - odds: 25
    impact: 2
    text: More farm robot makers collapse like Monarch Tractor, whose assets Caterpillar bought, as hardware costs eat cash
  - odds: 20
    impact: 2
    text: Biological products from Pivot Bio and peers fail to deliver yield gains, and farmers stop buying them
  - odds: 20
    impact: 2
    text: New US tariffs raise steel and input costs and China cuts soybean purchases, squeezing farm budgets
  - odds: 15
    impact: 1
    text: EU gene-edited crop rules and FAA drone rules turn out stricter than expected and delay product launches
  - odds: 10
    impact: 2
    text: Deere and AGCO dealers refuse to sell or service third-party retrofit kits, blocking agritech startups from farmers
  note:
  - We listed the events that could slow agritech down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
