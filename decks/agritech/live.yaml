ed007p:
  type: pp_radar
  title: 'What is actually included

    in the agritech market?'
  TL:
    name: Planet Labs
    src: ../../assets/logos/pp_live/agritech/s01-00.png
    text: photographs the world’s farmland every day, but most of its revenue comes from defense agencies and civil governments
  TR:
    name: HelloFresh
    src: ../../assets/logos/pp_live/agritech/s01-01.png
    text: buys its ingredients from farms, but it sells meal kits to households, far past the farm gate where agritech stops
  BL:
    name: Oishii
    src: ../../assets/logos/pp_live/agritech/s01-10.png
    text: grows strawberries in robotic indoor farms, but it sells them under its own brand, so it is a farm more than a supplier
  BR:
    name: John Deere
    src: ../../assets/logos/pp_live/agritech/s01-11.png
    text: puts See & Spray ona third of new sprayers in North America, but it is a machinery giant that also sells bulldozers
  caption:
  - Distance to the center reflects how much a product improves farm production itself, rather than what happens after harvest
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
