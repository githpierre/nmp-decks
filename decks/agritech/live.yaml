ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people look at indoor

    farming, as food prices and heat hit crops'
  date: In recent months.
  expl: After big vertical farm startups went bankrupt, indoor farming came back in a smaller, smarter way. Food prices, crop failures from heatwaves and
    viral videos of home grow boxes pushed people to look at growing food indoors again.
  term: agritech
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/agritech/agritech.csv
ed052p:
  type: pp_cagr
  title: 'Is the agritech market

    still growing fast?'
  lead: ''
  condition: Yes, but the market must bring robots, drones, and smart sprayers to mid-size farms, not just to the largest ones. It must also prove a clear
    return every season and work across machines from every brand.
  note:
  - We compared forecasts from The Business Research Company, Ken Research, Grand View and 6Wresearch
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: 35
  cagr: 11
  y0: 2026
