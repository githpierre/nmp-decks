ed007p:
  type: pp_radar
  title: 'Which companies really

    belong in crypto wallet?'
  TL:
    name: Coinbase
    src: ../../assets/logos/pp_live/crypto-wallet/s01-00.png
    text: is mainly a centralized exchange, although it also offers a distinct self custody wallet product
  TR:
    name: Chainalysis
    src: ../../assets/logos/pp_live/crypto-wallet/s01-02.png
    text: analyzes blockchain activity and risk, but it does not provide users with asset access or wallet custody
  BL:
    name: Crypto.com
    src: ../../assets/logos/pp_live/crypto-wallet/s01-09.png
    text: offers wallet products, but its core business also includes exchange, payments, cards and brokerage
  BR:
    name: Robinhood
    src: ../../assets/logos/pp_live/crypto-wallet/s01-10.png
    text: offers a crypto wallet alongside a much larger brokerage and trading business across other assets
  caption:
  - Distance to the center reflects how central each company is to crypto wallet
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
