ed148p:
  title: 'What pushed the crypto wallet

    market forward, year after year?'
  events:
  - year: '2009'
    text: Bitcoin creates native digital wallets
    impact: 2.5
  - year: '2012'
    text: HD wallets simplify key management
    impact: 1.5
  - year: '2013'
    text: BIP39 makes backups human readable
    impact: 2.0
  - year: '2014'
    text: Trezor launches first hardware wallet
    impact: 2.5
  - year: '2014'
    text: BIP44 standardizes multichain accounts
    impact: 1.5
  - year: '2016'
    text: MetaMask brings Ethereum into browsers
    impact: 3.0
  - year: '2016'
    text: Ledger Nano S secures multiple assets
    impact: 2.0
  - year: '2017'
    text: Token boom expands wallet demand
    impact: 1.5
  - year: '2018'
    text: WalletConnect links wallets to dapps
    impact: 2.0
  - year: '2018'
    text: Ledger Live unifies asset management
    impact: 1.5
  - year: '2018'
    text: Smart contract wallets gain traction
    impact: 1.5
  - year: '2019'
    text: Mobile hardware wallets improve access
    impact: 1.0
  - year: '2020'
    text: DeFi drives MetaMask past one million
    impact: 2.0
  - year: '2021'
    text: MetaMask passes ten million users
    impact: 2.0
  - year: '2021'
    text: NFT boom expands wallet use cases
    impact: 1.5
  - year: '2022'
    text: MetaMask reaches thirty million users
    impact: 2.0
  - year: '2022'
    text: Crypto failures renew self custody demand
    impact: 1.5
  - year: '2023'
    text: ERC 4337 enables account abstraction
    impact: 2.0
  - year: '2023'
    text: Ledger adds optional recovery service
    impact: 1.0
  - year: '2023'
    text: Smart wallets reduce seed phrase friction
    impact: 1.5
  - year: '2024'
    text: WalletConnect scales across wallet ecosystem
    impact: 1.5
  - year: '2024'
    text: Hardware wallets add secure touchscreens
    impact: 1.5
  - year: '2024'
    text: Account abstraction adoption accelerates
    impact: 1.5
  - year: '2025'
    text: Ethereum adds EIP 7702 support
    impact: 2.0
  - year: '2025'
    text: Wallet infrastructure becomes more embedded
    impact: 1.5
  - year: '2025'
    text: Passkeys improve wallet onboarding
    impact: 1.5
  - year: '2026'
    text: MetaMask marks ten years at scale
    impact: 2.0
  - year: '2026'
    text: Fake wallet apps expose security gap
    impact: 1.5
  - year: '2026'
    text: Ledger implant attack lifts vigilance
    impact: 1.5
  - year: '2026'
    text: Account abstraction reaches massive usage
    impact: 2.0
  note:
  - We kept the events we believe pushed crypto wallet forward the most
  - Ratings are our estimates, with all the sources at the end of the report
