    odds: 35
    impact: 2
  - text: Cloud providers bundle blockchain nodes and APIs into existing contracts, squeezing specialist Web3 infrastructure margins
    odds: 40
    impact: 2
  - text: Security flaws in account abstraction tooling cause wallet loss, slowing adoption of bundlers, paymasters and smart accounts
    odds: 30
    impact: 2
