- label: RNA THERAPEUTICS
  type: pp_risks
  section: Market challenges
  title: What are the biggest threats to the RNA therapeutics market?
  events:
  - text: FDA adds tougher liver and platelet monitoring after safety signals in oligonucleotide trials, increasing development costs
    odds: 35
    impact: 3
  - text: Vaccine demand falls further as COVID risk perception fades, reducing market scale advantages for mRNA manufacturing networks
    odds: 60
    impact: 2
  - text: Extrahepatic delivery programs fail to match liver success, delaying RNA drugs for muscle brain lung and solid tumors
    odds: 50
    impact: 3
  - text: Payers push back on high launch prices for rare disease RNA drugs, slowing uptake even when dosing becomes less frequent
    odds: 45
    impact: 2
  - text: A major antisense phase 3 failure revives concerns about target validation and weakens financing for small RNA developers
    odds: 40
    impact: 2
  - text: Patent battles over ionizable lipids and delivery chemistry raise licensing costs for newer mRNA and siRNA developers
    odds: 35
    impact: 1
  - text: Manufacturing quality problems in lipid nanoparticles cause batch delays and stricter release testing for RNA products
    odds: 30
    impact: 3
  - text: Gene editing and small molecules beat RNA drugs in key targets, reducing demand where chronic injections remain necessary
    odds: 45
    impact: 2
  note:
  - We listed the events that could slow RNA therapeutics down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and you will find all the sources we used at the end of the report
