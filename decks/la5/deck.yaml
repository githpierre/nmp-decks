    odds: 50
    impact: 2
  - text: Regulators treat more hosted node or transaction services as financial intermediaries, adding licensing and KYC costs
    odds: 30
    impact: 3
  - text: Open source RPC, indexing and rollup stacks improve enough that large teams bring more infrastructure back in house
    odds: 40
    impact: 1
