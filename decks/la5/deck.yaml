    impact: 3
  - text: Safety pauses on high-risk RL environments become common, delaying cyber and computer-use training projects across major labs
    odds: 35
    impact: 3
  - text: Open-source frameworks like AgentEnv cut environment-building costs, weakening pricing power for proprietary infrastructure v
    odds: 55
    impact: 2
  - text: Model gains from pretraining and synthetic data reduce the marginal value of expensive interactive RL for some enterprise tas
    odds: 30
    impact: 2
  - text: Customers reject brittle environments whose rewards can be gamed, forcing expensive redesigns before training results are tru
    odds: 50
    impact: 2
  - text: Sandbox escapes trigger tighter isolation rules, raising compute and engineering costs for realistic browser and coding envir
    odds: 40
    impact: 2
  - text: Demand concentrates at a few frontier labs, leaving smaller RL-environment vendors exposed to long procurement cycles and chu
    odds: 45
    impact: 1
  - text: Enterprise buyers use evaluation benchmarks without training loops, limiting adoption of full reinforcement-learning environm
    odds: 35
    impact: 1
  note:
  - We listed the events that could slow RL environments down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and you will find all the sources we used at the end of the report
