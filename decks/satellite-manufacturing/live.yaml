  title: 'Which companies really belong

    in satellite manufacturing?'
  TL:
    name: Exotrail
    src: ../../assets/logos/pp_live/satellite-manufacturing/s01-00.png
    text: sells electric thrusters for other firms’ satellites and offers in- orbit services, but it does not build spacecraft
  TR:
    name: Iridium
    src: ../../assets/logos/pp_live/satellite-manufacturing/s01-02.png
    text: runs a constellation of 66 satellites, but Thales Alenia Space built them and it makes its money selling connectivity
  BL:
    name: Loft Orbital
    src: ../../assets/logos/pp_live/satellite-manufacturing/s01-10.png
    text: flies customer payloads on satellite buses it buys from Airbus and Apex, which makes it half builder, half operator
  BR:
    name: Planet
    src: ../../assets/logos/pp_live/satellite-manufacturing/s01-11.png
    text: builds Pelican satellites for Japan's SKY Perfect JSAT in a $230 million deal, but its main business is selling imagery
