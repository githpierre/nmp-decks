ed142p:
  title: 'What are the biggest threats

    to satellite manufacturing?'
  events:
  - odds: 25
    impact: 3
    text: The Space Development Agency cuts or changes satellite orders, hitting York, Terran Orbital and peers
  - odds: 20
    impact: 2
    text: Vulcan delays and SpaceX rideshare limits leave satellite makers waiting years for launch slots
  - odds: 18
    impact: 2
    text: Satellite prices collapse as launches rise much faster than manufacturing revenue for every builder
  - odds: 15
    impact: 2
    text: Funding for satellite manufacturing startups stops after record rounds, leaving many short of cash
  - odds: 12
    impact: 2
    text: The EU Space Act and national rules favor home builders and close export markets to US startups
  - odds: 10
    impact: 1
    text: Lockheed and Northrop buy the best satellite startups like K2 and Apex before they reach scale
  - odds: 8
    impact: 2
    text: A full batch of new satellites fails in orbit and buyers lose trust in a startup manufacturer
  - odds: 5
    impact: 3
    text: SpaceX starts selling its Starlink satellite buses to others and undercuts every satellite manufacturer
  note:
  - We listed the events that could slow satellite manufacturing down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
