ed052p:
  type: pp_cagr
  title: 'How much room is left

    for satellite makers to grow?'
  lead: 'To fill that room, '
  condition: armies must keep buying satellites in lots, and Golden Dome, IRIS?, and China’s constellations must move from plans to orders. It must also
    find enough launches, laser terminals, and cleared engineers, so that factories can turn orders into satellites in orbit.
