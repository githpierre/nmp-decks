ed108-s1:
  7: The LNP programs only the intended T cells inside the body. CAR expression is controlled, B cells are deeply depleted, no chemotherapy is needed first, and the treatment feels like an ordinary off-the-shelf drug that any clinic can give.
  6: The LNP reaches too few T cells or builds up in the wrong organs. CAR expression is weak or uneven, B cells come back quickly, the patient still needs another therapy, and doctors lose confidence in the whole approach.
ed108-s3:
  7: The vector reaches the intended immune cells and inserts the CAR payload at an effective level. One infusion gives durable activity, while safety monitoring stays manageable and predictable for doctors, patients and regulators over the following years.
  6: The edit lands in too few target cells or raises off-target and long-term safety concerns. Dosing stays very cautious, monitoring keeps growing, regulators ask for more follow-up, and the durability advantage of a permanent edit quickly disappears.
ed108-s4:
  7: The delivery system programs the intended macrophages or monocytes inside the body. The engineered cells enter diseased tissue, express the CAR at useful levels, and add a new way to attack solid tumors without any cell manufacturing step.
  6: The payload reaches the wrong myeloid cells or fades too quickly inside the tumor. CAR expression stays weak, tissue activity is limited, and the program adds cost and complexity without improving results for patients with solid tumors.
