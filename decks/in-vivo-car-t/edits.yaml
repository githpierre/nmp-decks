iv_fda:
  10: 'FAST LANES


    Fast Track, Breakthrough and RMAT bring more contact with the FDA, but not less evidence.'
  11: 'PHASE 3 AND BLA


    Confirmatory data and proven manufacturing support approval, then long safety follow-up.'
  7: 'IND FILING


    The sponsor files preclinical, manufacturing and trial plans. The FDA then has 30 days to review them.'
  8: 'PHASE 1 TRIALS


    Small groups test dose, delivery and CAR expansion, with close attention to off-target effects.'
  9: 'PHASE 2 TRIALS


    More patients test response and durability while the sponsor locks potency, process and dose.'
ed024:
  note: &id001
  - We kept the milestones that most changed clinical credibility, platform competition or ownership of the market
  - There is no official timeline, and another analyst could reasonably pick a few different milestones here
ed042:
  note:
  - We take each estimate from the firm's website and adjust it when its definition is broader or narrower than ours
  - We prefer current 2026 estimates and keep therapy revenue apart from financing, buyouts and other deals
  rows:
  - firm: Precedence\nResearch
    value: $ 861 M
    comment: Their 2026 figure uses a broad in vivo CAR-T market definition across development stages. We treat it as the high end of our range.
  - firm: Future Market\nInsights
    value: $ 180 M
    comment: Their scope is narrow and revenue-based, centered on administered vectors, nanocarriers, and clinical supply. We use it as the low case.
  - firm: Grand View\nResearch
    value: $ 341 M
    comment: Their figure covers the broader in vivo cell-therapy market, not only CAR-T. We use it as a cross-check, then adjust for T-cell share.
