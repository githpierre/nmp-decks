ed147:
  7: '2018 - 2022

    Mouse studies showed CAR-T cells can be made inside the body. Startups formed around targeted delivery.'
  8: '2023 - 2024

    Umoja validated VivoVec in primates and Interius dosed a first patient. The field reached humans.'
  9: '2025

    Trials multiplied. Immorna dosed an mRNA therapy, and AbbVie, AstraZeneca and Kite bought platforms.'
  10: 'TODAY

    Big pharma is consolidating. Lilly bought Orna and Kelonia, and CREATE raised $122 million.'
  11: '2025 - 2026

    Autoimmunity joined cancer as a target. Fast Track tags, data and big deals pulled money in.'
