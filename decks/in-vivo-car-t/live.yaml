ed039p:
  pill: SIGNAL
  title: 'Searches for in vivo CAR-T soar as

    cell therapy moves inside the body'
  csv: assets/trends/in-vivo-car-t/in-vivo-car-t.csv
  term: in vivo car t
  date: Lately.
  expl: Classic CAR-T means taking a patient’s cells out, changing them in a lab and putting them back. New therapies do it inside the body with one injection, and big deals by AstraZeneca and AbbVie for in vivo startups drew attention.
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources at the end of the report
  signal: google-trends
