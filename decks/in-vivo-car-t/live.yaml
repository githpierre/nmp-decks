ed142p:
  title: 'What are the biggest

    threats to in vivo CAR-T?'
  events:
  - text: AbbVie with Capstan, Gilead with Interius and Lilly with Orna control the field, leaving few independent startups
    odds: 40
    impact: 2
  - text: Chinese biotechs post faster in vivo CAR-T data and license their assets cheaply to big pharma
    odds: 35
    impact: 1
  - text: Bispecific antibodies and T cell engagers win autoimmune disease before in vivo CAR-T reaches the market
    odds: 30
    impact: 2
  - text: Early responses in lupus and lymphoma fade within a year, so doctors stay with existing CAR-T
    odds: 25
    impact: 2
  - text: A patient dies from immune toxicity in an in vivo CAR-T trial and the FDA halts programs
    odds: 20
    impact: 3
  - text: Lipid nanoparticles reach the liver more than T cells, which limits doses and weakens efficacy
    odds: 20
    impact: 1
  - text: Biotech funding falls, and in vivo CAR-T startups cannot finance the large trials the FDA requires
    odds: 18
    impact: 2
  - text: Viral vectors insert genes into the wrong cells, raising cancer fears and triggering long FDA safety reviews
    odds: 12
    impact: 3
  note:
  - We listed the events that could slow in vivo CAR-T down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
