# 20 key sources of the deck, in the validated design (Source / Why we trust it / How we used it). Written by hand, 12 Nov 2026.
rows:
- name: "Lilly, Kelonia\nacquisition release"
  why: Eli Lilly’s own announcement, with the deal terms it must disclose to its shareholders
  how: We used it for the $7 billion deal. It also anchored our view of who leads the market.
  url: https://lilly.gcs-web.com/news-releases/news-release-details/lilly-acquire-kelonia-therapeutics-advance-vivo-car-t-cell
- name: "Lilly, Orna\nacquisition release"
  why: Eli Lilly’s own announcement, with the price and the circular RNA platform it bought
  how: We used it for the $2.4 billion deal. It also helped us describe circular RNA CAR-T.
  url: https://investor.lilly.com/news-releases/news-release-details/lilly-acquire-orna-therapeutics-advance-cell-therapies
- name: "AbbVie, Capstan\nacquisition release"
  why: AbbVie’s own announcement, with the deal terms and the status of CPTX2309 at signing
  how: We used it for the $2.1 billion deal. It also helped us explain targeted LNP delivery.
  url: https://news.abbvie.com/2025-06-30-AbbVie-to-Acquire-Capstan-Therapeutics%2C-Further-Strengthening-Commitment-to-Transforming-Patient-Care-i
- name: "Gilead, Interius\nacquisition release"
  why: Gilead’s own announcement for Kite, with the price paid and the platform it bought
  how: We used it for the $350 million deal. It also shaped our contrast slide on Interius.
  url: https://investors.gilead.com/news/news-details/2025/Kite-to-Acquire-Interius-BioTherapeutics-to-Advance-In-Vivo-Platform/default.aspx
- name: "AstraZeneca,\nEsoBiotec deal"
  why: AstraZeneca’s own release on closing the deal, with the upfront and total value paid
  how: We used it for the $1 billion deal. It also showed how early big pharma bought in.
  url: https://www.astrazeneca.com/media-centre/press-releases/2025/acquisition-of-esobiotec-completed.html
- name: "BMS, Orbital\nacquisition release"
  why: Bristol Myers Squibb’s own release, with the cash price and the program it acquired
  how: We used it for the $1.5 billion deal. It also helped us show that pharma buys early.
  url: https://investors.bms.com/iframes/press-releases/press-release-details/2025/Bristol-Myers-Squibb-Strengthens-and-Diversifies-Cell-Therapy-Po
- name: "Fierce Biotech,\nJ&J and Sail deal"
  why: Fierce Biotech is a leading biotech trade outlet that reports deal terms from the filings
  how: We used it for the $785 million J&J deal. It also gave us the option to buy Sail.
  url: https://www.fiercebiotech.com/biotech/jj-pays-sail-785m-charting-course-possible-vivo-car-t-buyout
- name: "Blood (ASH 2025),\nKLN-1010 results"
  why: Peer-reviewed abstract in Blood, the journal of the American Society of Hematology
  how: We used it for the first Kelonia patient data. It also backed our signal on results.
  url: https://ashpublications.org/blood/article/146/Supplement%202/LBA-1/556929
- name: "Nature Medicine,\nESO-T01 follow-up"
  why: Peer-reviewed paper in Nature Medicine, with the long follow-up of every patient
  how: We used it for the 15-month remission data. It also tempered our maturity score.
  url: https://www.nature.com/articles/s41591-026-04704-z
- name: "FDA, end of REMS\nfor CAR-T"
  why: Official FDA announcement, the agency that approves every CAR-T therapy in the US
  how: We used it for the regulation slides. It also showed which old constraints are gone.
  url: https://www.fda.gov/news-events/press-announcements/fda-eliminates-risk-evaluation-and-mitigation-strategies-rems-autologous-chimeric-antige
- name: "FDA, potency\nassurance guidance"
  why: Official FDA guidance that sponsors of cell and gene therapies must follow to file
  how: We used it for the road to approval. It also helped us rank the regulatory risks.
  url: https://www.fda.gov/regulatory-information/search-fda-guidance-documents/guidance-industry-potency-assurance-cellular-and-gene-therapy-products
- name: "Umoja, UB-VV111\nFast Track release"
  why: Umoja’s own release on the FDA designation, confirmed by the agency’s public criteria
  how: We used it for the Fast Track milestone. It also placed Umoja among the leaders.
  url: https://www.umoja-biopharma.com/news/umoja-biopharma-announces-that-ub-vv111-receives-fda-fast-track-designation-for-relapsed-refractory-b-c
- name: "CREATE, MT-302\nfirst human results"
  why: CREATE’s own release on its first patients, presented at a scientific congress
  how: We used it for in vivo CAR beyond T cells. It also helped us map solid tumor work.
  url: https://createmedicines.com/news/create-medicines-announces-positive-first-in-human-results-for-mt-302
- name: "Interius, first\npatient dosed"
  why: Interius’s own release on the first in vivo CAR patient, later confirmed by Gilead
  how: We used it for the first human dosing date. It also anchored our market timeline.
  url: https://www.globenewswire.com/news-release/2024/10/23/2967445/0/en/Interius-BioTherapeutics-Doses-First-Patien
- name: "Review of in vivo\nCAR-T therapies"
  why: Peer-reviewed 2026 review in PubMed Central, covering every clinical-stage program
  how: We used it for our market definition. It also gave us the list of in vivo pipelines.
  url: https://pmc.ncbi.nlm.nih.gov/articles/PMC12857126
- name: "MedComm review,\ndelivery platforms"
  why: Peer-reviewed 2026 review in MedComm comparing viral and lipid delivery in people
  how: We used it for the categories of the market. It also helped us see what has flipped.
  url: https://onlinelibrary.wiley.com/doi/full/10.1002/mco2.71030
- name: "Precedence Research\nmarket report"
  why: Market research firm with a dedicated in vivo CAR-T report, updated in September 2026
  how: We used it as the high end of the market size. It also gave us the regional split.
  url: https://www.precedenceresearch.com/in-vivo-car-t-therapy-market
- name: "Grand View in vivo\ncell therapy report"
  why: Market research firm with a yearly report on the wider in vivo cell therapy market
  how: We used it as the base of our own estimate. It also checked our growth rate range.
  url: https://www.grandviewresearch.com/industry-analysis/in-vivo-cell-therapy-market-report
- name: "Future Market\nInsights report"
  why: Market research firm with a narrow in vivo CAR-T scope, close to our own definition
  how: We used it as the low end of the market size. It also gave us a direct growth rate.
  url: https://www.futuremarketinsights.com/reports/in-vivo-car-t-cell-therapy-market
- name: "Our in vivo CAR-T\nfunding tracker"
  why: Our own database of every equity round since January 2024, each with its source link
  how: We used it for all the funding slides. It also counted rounds by stage and country.
  url: ''
