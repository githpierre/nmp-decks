  src: 54
  t:
    6: "CYTOKINE STORM\n\n\n    CAR-T expansion can still trigger CRS with fever and low blood pressure, even when the cells are made inside the body"
    7: "NERVE EFFECTS\n\n\n    Neurological toxicity remains a class concern, so early in vivo trials need close observation and rapid intervention"
    8: "SECOND CANCERS\n\n\n    FDA requires lifelong vigilance for secondary malignancies after genetically modified CAR-T treatment"
    9: "DELIVERY ERRORS\n\n\n    In vivo vectors must show that CAR genes avoid unintended tissues, because a misdirected durable edit may persist"
    10: "GENE CONTROL\n\n\n    The key promise is precise cell targeting, but regulators still need potency, biodistribution and long-term safety proof"
