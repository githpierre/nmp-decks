    8: '2025


      The field broke into pharma M&A. AstraZeneca, AbbVie, Gilead, and BMS bought EsoBiotec, Capstan, Interius, and Orbital.'
    9: 'TODAY


      Lilly bought Orna and agreed to buy Kelonia. Umoja, MagicRNA and CREATE are pushing their trials forward.'
    10: '?


      Future winners may combine precise targeting, repeat dosing, strong safety, and durable immune reset. Clinical proof will decide which platform scales.'
