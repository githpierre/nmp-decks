- id: ed210
  left: A REGULAR CAR-T STARTUP
  logo: kelonia
  note:
  - We used Kelonia's trial materials, its ASH 2025 clinical disclosure and Lilly's acquisition release
  - We treated “a regular CAR-T startup” as a fictional baseline, shown here only for the contrast
  right: KELONIA
  rows:
  - - They collect a patient’s cells before making the therapy
    - They make anti-BCMA CAR-T cells inside the patient
  - - They need chemotherapy before cells are infused
    - They designed KLN-1010 to work without chemo first
  - - They wait for a custom cell product made off site
    - They deliver KLN-1010 as a single off-the-shelf IV infusion
  - - They stay in animal studies while competitors enter the clinic
    - They opened a first-in-human trial in multiple myeloma
  - - They rely on early markers without deep responses
    - Their first four patients all reached MRD-negative
  - - They need very high doses to prove the platform can work
    - A low-dose fourth patient was MRD-negative at one month
  - - They make CAR cells that fade after the first weeks
    - They found memory CAR-T cells three months later
  - - They build around one isolated asset with little platform value
    - Their iGPS platform targets T cells with a lentivirus
  - - They stay independent after early clinical proof of concept
    - Lilly agreed to acquire Kelonia after the first clinical data
  - - They sell at a modest price before the platform is validated
    - The Lilly deal carries potential payments of up to $7 billion
  section: Startup strategies
  src: 210
  title: How Kelonia turned one infusion into a $7B deal
  type: contrast
- id: ed211
  left: A REGULAR CAR-T STARTUP
  logo: capstan
  note:
  - We used Capstan's scientific materials and AbbVie's acquisition releases
  - We treated “a regular CAR-T startup” as a fictional baseline, for contrast only
  right: CAPSTAN
  rows:
  - - They manufacture CAR-T cells outside the patient's body
    - They deliver CAR mRNA straight to CD8 T cells in the body
  - - They use viral integration to keep the CAR gene permanently
    - They use non-integrating mRNA for transient CAR expression
  - - They target immune cells with a broad untargeted formulation
    - They use antibody-guided particles aimed at CD8
  - - They focus first on cancer where CAR-T already has approvals
    - They made autoimmunity the lead use of CPTX2309
  - - They require lymphodepleting chemotherapy before treatment
    - They designed the program to avoid chemo before dosing
  - - They rely only on mouse efficacy before entering development
    - They showed deep B-cell depletion in non-human primates
  - - They test only healthy donor cells before moving to patients
    - They engineered T cells from autoimmune patients
  - - They keep the lead program in preclinical testing for years
    - They moved CPTX2309 into a phase 1 trial in 2025
  - - They build a single drug without a reusable delivery engine
    - They built the CellSeeker targeted LNP-mRNA platform
  - - They stay private while financing each clinical step separately
    - AbbVie acquired Capstan for up to $2.1 billion in cash
  section: Startup strategies
  src: 211
  title: How Capstan made CAR-T into an RNA medicine
  type: contrast
- id: ed212
  left: A REGULAR CAR-T STARTUP
  logo: interius
  note:
  - We used the clinical releases of Interius, its peer-reviewed platform paper and Gilead's acquisition release
  - We treated “a regular CAR-T startup” as a fictional baseline, shown here only to make the contrast clear
  right: INTERIUS
  rows:
  - - They collect and engineer T cells in an external factory
    - They deliver a CAR gene to immune cells in the body
  - - They engineer only T cells and ignore other immune effectors
    - INT2104 is designed to generate both CAR-T and CAR-NK cells
  - - They use a broad viral vector without an immune-cell address
    - They target CD7 T and NK cells with an engineered fusogen
  - - They need conditioning chemo before the CAR-T infusion
    - They designed INT2104 to skip conditioning chemo
  - - They need repeated administrations to build enough CAR cells
    - Their platform is built around one intravenous dose
  - - They chase an unproven target with no track record
    - INT2104 targets the CD20 marker on cancerous B cells
  - - They wait for US expansion before testing in other regions
    - Their Phase 1 trial expanded from Australia into Germany
  - - They remain preclinical while refining the vector platform
    - They dosed the first INVISE Phase 1 participant in 2024
  - - They use a system whose CAR effect fades quickly
    - Their lentivirus writes the CAR gene into the genome
  - - They stay independent after entering first-in-human testing
    - Kite agreed to acquire Interius for $350 million in 2025
  section: Startup strategies
  src: 212
  title: How Interius took in vivo CAR into human testing
  type: contrast
- id: ed213
  left: A REGULAR CAR-T STARTUP
  logo: esobiotec
  note:
  - We used EsoBiotec's clinical disclosures, its Phase 1 paper in Nature Medicine and AstraZeneca's releases
  - We treated “a regular CAR-T startup” as a fictional baseline, shown here only to make the contrast clear
  right: ESOBIOTEC
  rows:
  - - They manufacture patient cells for weeks before treatment
    - They give the therapy as one IV infusion in minutes
  - - They use leukapheresis before any CAR-T treatment can begin
    - ESO-T01 needed no cell collection or factory step
  - - They use chemo to make room for the infused cells
    - ESO-T01 was given with no conditioning chemo first
  - - They wait for late trials before showing human feasibility
    - They dosed their first multiple myeloma patient in late 2024
  - - They report only CAR-cell expansion in their first patients
    - Four of five patients achieved objective responses in Phase 1
  - - They show responses without deep molecular remission data
    - Three of five patients achieved stringent complete remissions
  - - They rely on repeat infusions to keep tumors in check
    - ESO-T01 used a single IV dose in the published Phase 1 study
  - - They build a viral vector without shielding it from immunity
    - ESO-T01 uses an immune-shielded lentiviral vector
  - - They stay independent after first-in-human validation
    - AstraZeneca closed its EsoBiotec deal in May 2025
  - - They exit before attracting a strategic premium from pharma
    - The AstraZeneca deal was worth up to $1 billion in all
  section: Startup strategies
  src: 213
  title: How EsoBiotec proved in vivo CAR-T could work in people
  type: contrast
- id: ed214
  left: A REGULAR CAR-T STARTUP
  logo: orbital
  note:
  - We used Orbital's 2025 preclinical release and the acquisition announcement of Bristol Myers Squibb
  - We treated “a regular CAR-T startup” as a fictional baseline, shown here only to make the contrast clear
  right: ORBITAL
  rows:
  - - They build CAR-T around a permanent DNA insert
    - They encode the CD19 CAR in optimized circular RNA
  - - They use a generic nanoparticle that mostly reaches the liver
    - They pair the RNA cargo with targeted lipid nanoparticles
  - - They depend on CAR-T cells made outside the body
    - They aim to reprogram the patient's own immune cells in vivo
  - - They focus on cancer because that is where CAR-T began
    - They lead with B-cell-driven autoimmune disease
  - - They enter trials before proving deep B-cell clearance
    - They cleared B cells in blood, spleen and lymph nodes
  - - They treat the lead drug as separate from the core platform
    - They built one platform for circular and linear RNA
  - - They hand-design RNA with no optimization engine
    - Their platform pairs RNA engineering with AI design
  - - They stay independent through all of their pre-trial work
    - BMS agreed to acquire Orbital while OTX-201 was preclinical
  - - They sell only the lead asset and leave the platform behind
    - BMS agreed to acquire OTX-201 plus Orbital's RNA platform
  - - They need clinical revenue before creating strategic value
    - BMS agreed to pay $1.5 billion in cash to buy them
  section: Startup strategies
  src: 214
  title: How Orbital sold a preclinical in vivo CAR-T platform
  type: contrast
