- id: ed133
  type: x/has_held_back_market_growth
  section: Market challenges
  title: What has held back market growth so far?
  note: We grouped the market into broad phases using FDA milestones, first-in-human programs and recent clinical readouts. The phases are subjective but track the main technical and regulatory bottlenecks.
  src: 133
  t:
    6: '2017 - 2020


      CAR-T proved engineered T cells could work, but treatment still depended on bespoke cell collection, manufacturing and hospital delivery.'
    7: '2021 - 2023


      In vivo ideas advanced in animals, but selective delivery into T cells and control of vector spread stayed the main hurdle.'
    8: '2024 - 2025


      First in vivo programs entered human trials. Evidence was still limited to early dose escalation, making durability and safety hard to judge.'
    9: 'TODAY


      Human proof is emerging, but developers must still show precise targeting, steady potency, scalable vectors and long-term safety.'
    10: '2025 - 2026


      Big pharma deals validated the field, but most programs are in phase 1 or earlier and no product is approved yet.'
