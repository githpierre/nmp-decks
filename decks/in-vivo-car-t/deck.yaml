  src: 162
  t:
    6: 'BEFORE


      From 2020 to 2022, investors wrote very large checks to broad platforms like Sana, Tessera, Orna and Umoja. Startups in this market raised about $2.7 billion in three years, before any human data.'
    7: 'AFTER


      Now, money follows clinical data and pharma partners. Big rounds are rare: Sail took $465M from J&J and CREATE raised $122M in 2026, while Chinese startups close most of the rounds.'
