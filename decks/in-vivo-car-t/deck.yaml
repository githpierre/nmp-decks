- id: ed160
  type: x/stands_out_funding
  section: Investor bets
  title: 'What stands out in

    in vivo CAR-T funding?'
  note: Insights come from our tracker of 32 in vivo CAR-T equity rounds announced since January 2024, worth about $1.41 billion
  src: 160
  t:
    6: LNP-mRNA CAR-T took about 64% of the capital raised since 2024, far more than any other category
    7: Only 17 of the 32 rounds since 2024 disclosed an amount, and the median disclosed round was $45M
    8: US startups took about 89% of the capital, even though Chinese startups closed more rounds, 19 against 12
    9: Five rounds of $100M or more made up about 72% of all the capital raised in the market since 2024
    10: Sail’s $465M from Johnson & Johnson alone is about a third of all the capital raised since 2024
    11: Series B was the most common round, with 12 of the 32 rounds, ahead of Series A and seed with 6 each
