- id: iv_fda
  type: x/were_key_phases_market_acceleration
  section: Market challenges
  title: What does the road to FDA approval look like?
  note: We used current FDA rules for IND review and cell-and-gene-therapy development. Exact trial sizes and whether Phase 3 is required depend on indication, effect size and the regulatory pathway.
  src: 147
  t:
    7: "IND\n\n\n    The sponsor submits preclinical, manufacturing and trial plans. FDA review normally lasts 30 days."
    8: "PHASE 1\n\n\n    Small cohorts test dose, delivery, CAR expansion and acute safety, with special attention to off-target effects."
    9: "PHASE 2\n\n\n    More patients test response and durability while the sponsor locks down potency, process controls and dose."
    10: 'FAST LANES



      Fast Track, Breakthrough and RMAT bring more FDA contact, but not less evidence.'
    11: 'PHASE 3 AND BLA



      Confirmatory data and proven manufacturing support approval, then long safety follow-up.'
