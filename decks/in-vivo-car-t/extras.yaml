- after: ed039p
  slide:
    id: xs_2a
    type: kpis
    section: Market opportunity
    title: 'Kelonia’s one-time infusion worked

      in all 18 myeloma patients treated'
    items:
    - label: Myeloma patients treated with KLN-1010, one infusion each, with no cell harvest
      value: '18'
    - label: Of them responded, with no cancer found in their bone marrow a month later
      value: 100%
    - label: Of the 6 patients followed 4 months or more reached a stringent complete response
      value: 67%
    why: This is a strong signal because it is the cleanest first readout of any in vivo CAR-T so far, and it came weeks before Lilly agreed to buy Kelonia for up to $7 billion.
    note:
    - Data comes from Kelonia’s ASCO 2026 interim results (cutoff April 21, 2026), reported by Fierce Biotech and pharmaphorum
