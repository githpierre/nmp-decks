    type: x/student_use_ai_homework_jumped
    section: Market opportunity
    title: 'The biggest in vivo CAR-T deal

      jumped from $1.44B to $7B'
    vbars:
    - 1.44
    - 7
    t:
      8: SIGNAL
      12: $7B
      13: $1.44B
      11: Prices for in vivo CAR-T platforms keep climbing, a classic sign of a hot market. In January 2024, AbbVie’s deal with Umoja was worth up to $1.44 billion, then the record. In April 2026, Lilly agreed to pay up to $7 billion for Kelonia, almost five times more, after AbbVie paid up to $2.1 billion for Capstan. Pharma now pays platform prices before late-stage data.
    note: Values are the maximum announced in each deal, milestones included. Data comes from AbbVie and Lilly press releases
  link: ed028 says 2025 is when the market became hot because of strategic acquisitions; the deal-size jump is the proof
