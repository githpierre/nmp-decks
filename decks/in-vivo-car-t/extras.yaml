- after: iv_safety
  slide:
    id: xs_4c
    type: x/sig_announced_vs_built
    section: Market challenges
    vbars:
    - 4
    - 1
    title: 'All 4 ESO-T01 patients responded,

      but only 1 was in remission 15 months later'
    t:
      8: '4'
      9: 'Responded

        after one infusion'
      11: '1'
      12: 'Still in remission

        after 15 months'
      15: 1 of 4
      16: WHAT IS GOING ON
      17: 'ESO-T01 makes BCMA CAR-T cells inside the body with one infusion, with no cell harvest and no chemotherapy first.


        All four myeloma patients of the first study responded. In the follow-up published in Nature Medicine, only one was still in stringent complete response after 15 months.'
    note: Data comes from the extended follow-up of the four ESO-T01 patients, published in Nature Medicine in October 2026
  link: 'iv_safety, GENE CONTROL card: regulators still need proof that responses last'
- after: ed099p
  slide:
    id: xs_5a
    type: sx_stat_strip
    section: Tech and infra
    title: 'ESO-T01 hit its target: under 1%

      of the CAR went to the wrong cells'
    note:
    - Data comes from the ESO-T01 Phase 1 data published in Nature Medicine in 2026
    headline: The first human data on where an in vivo CAR actually lands
    stats:
    - v: <1%
      l: Of non-T immune cells carried the CAR at most, and most samples showed none
    - v: '4'
      l: Myeloma patients in the study, followed for up to 15 months
    story: It matters because delivery to the right cells is the core technical bottleneck of in vivo CAR-T, and this is early human proof that it can be engineered.
  link: the slide before is about delivery tech; off-target delivery is the core test
