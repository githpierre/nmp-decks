- after: ed152
  slide:
    id: xs_2b
    type: x/student_use_ai_homework_jumped
    section: Growth drivers
    title: 'Kelonia’s trial grew from 4

      to 18 treated patients in 5 months'
    vbars:
    - 4
    - 18
    t:
      8: ''
      12: '18'
      13: '4'
      11: Kelonia first showed KLN-1010 data on 4 myeloma patients at ASH in December 2025. By the ASCO 2026 data cutoff in April, 18 patients had been treated, and all of them had responded. A larger cohort with the same result makes it much less likely that the first signal was luck, and it gives buyers and doctors a dataset they can start to trust.
    note: Data comes from Kelonia’s ASH 2025 and ASCO 2026 presentations, reported by Fierce Biotech
