    type: x/student_use_ai_homework_jumped
    section: Market opportunity
    title: 'The biggest in vivo CAR-T deal

      jumped from $1.44B to $7B'
    vbars:
    - 1.44
    - 7
    t:
      8: SIGNAL
      12: $7B
      13: $1.44B
      11: In January 2024, AbbVie’s deal with Umoja was worth up to $1.44 billion, the most anyone had put on an in vivo CAR-T platform. In April 2026, Lilly agreed to pay up to $7 billion for Kelonia, almost five times more. In between, AbbVie paid up to $2.1 billion for Capstan. Pharma now pays platform prices before late-stage data, so a startup with early human results can sell for billions.
    note: Values are the maximum announced in each deal, milestones included. Data comes from AbbVie and Lilly press releases
