    title: 'In vivo CAR-T cleared harmful B cells

      in all 16 patients with nerve diseases'
    items:
    - label: Patients with refractory neurologic autoimmune diseases, such as myasthenia gravis
      value: '16'
    - label: Of them reached complete B-cell depletion, the effect behind the immune reset
