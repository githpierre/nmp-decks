- after: ed039p
  slide:
    id: xs_2a
    type: kpis
    section: Market opportunity
    title: 'Kelonia’s one-time infusion worked

      in all 18 myeloma patients treated'
    items:
    - label: Myeloma patients treated with KLN-1010, one infusion each, with no cell harvest
      value: '18'
    - label: Of them responded, with no cancer found in their bone marrow a month later
      value: 100%
    - label: Of the 6 patients followed 4 months or more reached a stringent complete response
      value: 67%
    why: This is a strong signal because it is the cleanest first readout of any in vivo CAR-T so far, and it came weeks before Lilly agreed to buy Kelonia for up to $7 billion.
    note:
    - Data comes from Kelonia’s ASCO 2026 interim results (cutoff April 21, 2026), reported by Fierce Biotech and pharmaphorum
    pill: SIGNAL
  link: 'the market-opportunity signals: first clean human readout, weeks before the Lilly deal'
- after: ed152
  slide:
    id: xs_2b
    type: x/student_use_ai_homework_jumped
    section: Growth drivers
    title: 'Kelonia’s trial grew from 4

      to 18 treated patients in 5 months'
    vbars:
    - 4
    - 18
    t:
      8: ''
      12: '18'
      13: '4'
      11: 'This is the first driver at work: larger human studies. Kelonia first showed KLN-1010 data on 4 myeloma patients at ASH in December 2025. By the ASCO 2026 cutoff in April, 18 patients had been treated, and all of them had responded. A larger cohort with the same result makes luck much less likely and gives buyers and doctors a dataset they can trust.'
    note: Data comes from Kelonia’s ASH 2025 and ASCO 2026 presentations, reported by Fierce Biotech
  link: 'ed152, first driver: durable responses from larger human studies'
- after: ed153
  slide:
    id: xs_3a
    type: kpis
    section: Growth drivers
    title: 'In vivo CAR-T cleared harmful B cells

      in all 16 patients with nerve diseases'
    items:
    - label: Patients with refractory neurologic autoimmune diseases, such as myasthenia gravis
      value: '16'
    - label: Of them reached complete B-cell depletion, the effect behind the immune reset
      value: 100%
    why: 'Each new indication adds learning across the same platform: this first neurologic cohort takes in vivo CAR-T beyond blood cancers, to chronic autoimmune diseases with far more patients.'
    note:
    - Data comes from a report of 16 patients published in the New England Journal of Medicine in September 2026
  link: ed153, card « Each new indication adds learning that can transfer across the same platform »
