ed160:
  6: LNP-mRNA CAR-T took about 64% of the capital raised since 2024, far more than any other category
  7: Only 17 of the 30 rounds since 2024 disclosed an amount, and the median disclosed round was $45M
  8: US startups took about 89% of the capital, even though Chinese startups closed more rounds, 17 against 12
  9: Five rounds of $100M or more made up about 72% of all the capital raised in the market since 2024
  10: Sail’s $465M from Johnson & Johnson alone is about a third of all the capital raised since 2024
  11: Series B was the most common round, with 11 of the 30 rounds, ahead of seed with 6 and Series A with 5
  note: Insights come from our tracker of 30 in vivo CAR-T equity rounds announced since January 2024, worth about $1.41 billion
ed162:
  6: 'BEFORE


    From 2020 to 2022, investors wrote very large checks to broad platforms like Sana, Tessera, Orna and Umoja. Startups in this market raised about $2.7 billion in three years, before any human data.'
  7: 'AFTER


    Now, money follows clinical data and pharma partners. Big rounds are rare: Sail took $465M from J&J and CREATE raised $122M in 2026, while Chinese startups close most of the rounds.'
  note: Insights come from our tracker of in vivo CAR-T equity rounds since 2020, from company releases and the press
