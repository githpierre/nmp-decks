ed160:
  6: LNP-mRNA CAR-T took about 60% of the capital raised since 2024, far more than any other category
  7: Only 20 of the 31 rounds since 2024 disclosed an amount, and the median disclosed round was $47M
  8: US startups took about 83% of the capital, even though Chinese startups closed more rounds, 18 against 12
  9: 4 rounds of $100M or more made up about 61% of all the capital raised in the market since 2024
  10: The $465M of Sail Biomedicines with Johnson & Johnson is the biggest round since 2024, ahead of the $175M raised by Capstan Therapeutics in 2024
  11: Series B was the most common round, with 8 of the 31 rounds, ahead of seed with 8 and Series A with 7
  note: Insights come from our tracker of 31 in vivo CAR-T equity rounds announced since January 2024, worth about $1.4B
ed162:
  6: 'BEFORE


    From 2020 to 2022, investors wrote very large checks to broad platforms like Sana, Tessera, Orna and Umoja. The money came before any human data, on the promise of the technology alone.'
  7: 'AFTER


    Now, money follows clinical data and pharma partners. Since 2024, 31 rounds raised $1.4B, and Chinese startups close most of them.'
  note: Insights come from our tracker of in vivo CAR-T equity rounds, complete from January 2024, and from company releases and the press
