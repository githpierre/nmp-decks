ed142p:
  title: 'What could slow

    defense AI down?'
  events:
  - odds: 25
    impact: 3
    text: Congress fails to pass the bill behind $54.6 billion of the drone request, delaying defense AI contracts
  - odds: 20
    impact: 2
    text: China widens its battery and magnet bans beyond Skydio to most US defense AI and drone makers
  - odds: 20
    impact: 2
    text: A down round at Anduril or Shield AI scares investors away from defense AI startups
  - odds: 15
    impact: 2
    text: Peace in Ukraine cuts urgency, and European governments slow defense AI spending despite the NATO pledge
  - odds: 15
    impact: 2
    text: Lockheed, RTX and Northrop copy startup features and win most new defense AI contracts
  - odds: 10
    impact: 2
    text: New jamming and spoofing tools defeat AI navigation, making many autonomous drones useless in combat
  - odds: 10
    impact: 3
    text: An AI weapon misfires and kills civilians or friendly troops, and the Pentagon pauses autonomy programs
  - odds: 5
    impact: 2
    text: A binding UN treaty limits autonomous weapons and forces defense AI firms to keep humans in control
  note:
  - We listed the events that could slow defense ai down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
