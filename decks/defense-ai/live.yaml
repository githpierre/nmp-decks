ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people ask about military

    AI, as drones choose their own targets'
  date: In recent months.
  expl: The Pentagon signed contracts worth up to $200 million each with OpenAl, Anthropic, Google and xAI, and drones in Ukraine started choosing targets
    on their own. Then debates over whether AI labs should let armies use their models made headlines worldwide, and searches hit a record.
  term: defense ai
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/defense-ai/defense-ai.csv
