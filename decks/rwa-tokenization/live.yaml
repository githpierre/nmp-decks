ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'Searches for tokenized stocks soar as

    crypto apps start selling shares'
  date: Lately.
  expl: Crypto platforms like Robinhood and Kraken began offering tokens that track real stocks and trade around the clock. BlackRock's tokenized fund had
    already shown big finance was serious, and people went looking for what tokenized stocks are.
  term: rwa tokenization
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/rwa-tokenization/rwa-tokenization.csv
ed052p:
  type: pp_cagr
  title: 'What will the RWA tokenization

    market be worth by 2036?'
  lead: ''
  condition: To be worth that much, the market must get big banks and asset managers to issue and settle funds, bonds, and credit on chain as a normal practice.
    It must also gain clear rules and enough buyers to trade these tokens.
  note:
  - We compared forecasts from RWA.xyz, DeFiLlama, McKinsey and 360iResearch and adjusted each one to our market definition
  - We then built a realistic range from these forecasts, and you will find all the sources we used at the end of the report
  size: 40
  cagr: 35
  y0: 2026
