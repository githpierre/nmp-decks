ed007p:
  type: pp_radar
  title: 'What is in the biotech

    market, and what is out?'
  TL:
    name: Teva
    src: ../../assets/logos/pp_live/biotech/s01-00.png
    text: is one of the world's largest drug makers, but most of its sales come from generic copies of chemical drugs, not biotech
  TR:
    name: L'Oréal
    src: ../../assets/logos/pp_live/biotech/s01-02.png
    text: grows reconstructed human EAL skin in its labs to test products, but it sells shampoo and makeup, which is beauty, not biotech
  BL:
    name: Lonza
    src: ../../assets/logos/pp_live/biotech/s01-10.png
    text: makes biologics and cell therapies for other drug developers but it owns none of the drugs it naciicenn so it sits on the line
  BR:
    name: Amgen
    src: ../../assets/logos/pp_live/biotech/s01-11.png
    text: was one of the first biotechs and still sells mostly biologics, but at its size it now runs much like a classic big pharma
