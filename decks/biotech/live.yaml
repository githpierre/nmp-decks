ed052p:
  type: pp_cagr
  title: 'How much bigger can

    synthetic biology get?'
  lead: ''
  condition: To get that big, the market must turn AI designs into products that scale, as pharma, food, and chemical firms buy more of what engineered
    cells make. It must also cut production costs, build enough factory capacity, keep public trust in engineered food, and avoid a biosecurity incident
    that brings strict rules.
  note:
  - We compared forecasts from Precedence, Fortune Business Insights, Mordor and Grand View
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: null
  cagr: 19
  y0: 2026
