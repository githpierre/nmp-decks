ed142p:
  title: 'What are the biggest

    threats to biotech?'
  events:
  - odds: 50
    impact: 2
    text: Chinese biotechs keep licensing cheap drug candidates to Pfizer and Merck, undercutting US startup valuations
  - odds: 45
    impact: 3
    text: FDA staff cuts and leadership turnover delay reviews and approvals for small biotech drug candidates
  - odds: 40
    impact: 3
    text: Most favored nation drug pricing deals cut US prices, so pharma pays less to license biotech assets
  - odds: 40
    impact: 2
    text: NIH grant cuts and indirect cost caps shrink university research that feeds new biotech spinouts
  - odds: 35
    impact: 2
    text: The biotech IPO window stays shut, leaving venture backed startups to sell early or shut down
  - odds: 35
    impact: 1
    text: Medicare drug price negotiation under the IRA expands to more small molecules, cutting returns on pills
  - odds: 30
    impact: 2
    text: The BIOSECURE Act forces startups to drop WuXi AppTec and other Chinese contract manufacturers at high cost
  - odds: 20
    impact: 2
    text: A gene therapy trial death prompts an FDA clinical hold across similar programs and spooks investors
  note:
  - We listed the events that could slow biotech down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
