ed142p:
  title: 'What are the biggest

    threats to AI video?'
  events:
  - odds: 35
    impact: 2
    text: Kling, Seedance and Vidu win global users at lower prices than Runway and other Western rivals
  - odds: 22
    impact: 3
    text: Google expands free Veo video in YouTube Shorts and Gemini until paid AI video apps look pointless
  - odds: 15
    impact: 2
    text: GPU costs stay too high for AI video, and more players quit like OpenAI did with Sora
  - odds: 15
    impact: 3
    text: A court rules AI video training on films and shows is infringement, forcing costly licensing deals
  - odds: 12
    impact: 2
    text: Funding for AI video startups dries up after one giant deal, leaving most players short of cash
  - odds: 10
    impact: 2
    text: YouTube, TikTok and Meta bury AI-made videos in their feeds and cut creator pay for them
  - odds: 7
    impact: 2
    text: New deepfake laws in the US and EU ban many uses of realistic AI video generation
  - odds: 5
    impact: 1
    text: The novelty of AI video fades and users stop paying for Higgsfield, Pika and similar apps
  note:
  - We listed the events that could slow ai video generation down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
