ed007p:
  type: pp_radar
  title: 'Who is in the AI video

    market, and who is not?'
  TL:
    name: Descript
    src: ../../assets/logos/pp_live/ai-video-generation/s01-00.png
    text: lets you edit video by editing its transcript and adds AI voices, but it mostly reshapes footage you have already shot
  TR:
    name: YouTube
    src: ../../assets/logos/pp_live/ai-video-generation/s01-02.png
    text: lets creators generate Shorts clips with Google's Veo model, but it is a distribution platform, not a video generator
  BL:
    name: Midjourney
    src: ../../assets/logos/pp_live/ai-video-generation/s01-10.png
    text: launched its first video model in 2025, but it is still used mostly as an image generator, so it sits on the line
  BR:
    name: Higgsfield
    src: ../../assets/logos/pp_live/ai-video-generation/s01-11.png
    text: packages models such as Veo and Kling into creative presets, which makes it more an app layer than a generator
  caption:
  - Distance to the center reflects how much a product creates new footage from prompts, rather than editing existing video
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
