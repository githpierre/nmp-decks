  6: {text: "Blackboard and Moodle brought courses online at universities. Schools bought their first learning platforms. Most classroom teaching still used paper and chalk.", lines: 10}
  8: {text: "Khan Academy put free video lessons on YouTube. Smartphones spread fast. Schools began to buy laptops, tablets, and online homework tools.", lines: 10}
  10: {text: "Coursera, edX, and Duolingo launched in 2012. MOOCs reached millions of learners worldwide. Byju’s and other tutoring apps grew fast in India.", lines: 10}
  12: {text: "COVID moved school online overnight. Video classes, tutoring apps, and homework tools boomed. EdTech funding reached a record $16.7 billion in 2021.", lines: 10}

30:
  6: {text: "Schools reopened, and demand for many tools fell. ChatGPT arrived and hit homework help sites like Chegg. Funding dropped by more than half, and startups cut staff.", lines: 10}
  8: {text: "2U went bankrupt, and Byju’s entered insolvency. Private equity bought PowerSchool and Instructure. AI tools for teachers spread fast in many schools.", lines: 10}
  10: {text: "Most US teachers tried AI, and OpenAI and Google launched study modes. PhysicsWallah went public in India. Funding rose 11% to $2.6 billion.", lines: 10}
  12: {text: "The market is worth about $192 billion. AI tutors and teacher tools grow fast, while old models shrink. Big players merge to compete. The race is still open.", lines: 10}

