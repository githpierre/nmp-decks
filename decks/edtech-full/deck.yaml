  type: x/pain_points_yesterday_vs_today
  section: Pain points
  title: 'What are the pain points

    of yesterday vs. today?'
  note: As technological, social, and regulatory conditions evolve, some market pain points get solved while new ones emerge. Rather than describing this as a vague continuous curve, we grouped these shifts into distinct historical phases to make the evolution easier to understand. All documents used for this analysis are referenced in the Sources section at the end of this deck.
  src: 54
  t:
    6: '1997 - 2007


      Learning platforms solved how to put courses online, but they were clunky, built for administrators, and most teachers still taught with paper and photocopies'
    7: '2008 - 2014


      Free video lessons and MOOCs solved access to good teaching, but most learners quit within weeks, and few courses led to a credential that employers knew'
    8: '2015 - 2022


      Cloud platforms and cheap laptops solved access at school, but COVID exposed weak internet at home, tired teachers, and many tools that did not connect'
    9: 'TODAY


      AI tools now solve much of the planning and explaining, but schools struggle with cheating, privacy, tight budgets, and proof of learning'
    10: '?


      Personal AI tutors may finally give every learner one-to-one help, but they could also widen gaps if only rich families can afford the best ones'
