    have flipped?'
  note: There are a lot of things in this market that used to be true and are less so today. This selection of the most important ones is ours and yes, it’s subjective. It’s not based on precise metrics, but on what (very) often emerged from our reading (found in the sources part at the end) as well as conversations with founders and investors.
