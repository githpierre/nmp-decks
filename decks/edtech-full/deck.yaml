    24: Now that money is gone, and school districts cut the tools their teachers rarely use
    26: EdTech startups used to raise huge rounds on user growth
    28: Now investors want profits first, and very few rounds pass $100 million
- id: ed024
  type: dated
  section: Market definition
  title: 'What has changed

    (very) recently?'
  page: 1/2
  items:
  - d: SINCE 2020
    t: COVID closed schools for 1.6 billion students around the world, and teaching moved online almost overnight. Online classes quickly became normal, and EdTech funding hit a record the next year.
  - d: SINCE 2021
    t: China banned for-profit tutoring in core school subjects, which was the heart of its EdTech boom. Its large online tutoring industry lost most of its business within a few months.
  - d: SINCE 2022
    t: ChatGPT launched in November and spread through schools and universities faster than any tool before it. Students began to ask AI for help with homework instead of searching for answers.
  - d: SINCE 2023
    t: Chegg lost about half its value in a single day after blaming ChatGPT for weaker sign-ups from students. Homework help became the first clear victim of AI in the education market.
  - d: SINCE 2024
    t: 2U filed for bankruptcy in the US, and Byju’s, once India’s most valuable startup, entered insolvency. Online degrees and big tutoring bets lost the trust of most investors.
  - d: SINCE 2024
    t: PowerSchool went private in a $5.6 billion deal, and Instructure, the maker of Canvas, soon followed. Private equity firms started to buy up the software that schools run on.
  note: &id001
  - There is no official timeline, and some may pick other changes or slightly different dates
  - We kept the moments that mattered most for investors and founders entering the market
  src: 24
- id: ed025
  type: dated
  section: Market definition
  title: 'What has changed

    (very) recently?'
  page: 2/2
  items:
  - d: SINCE 2025
    t: The US Department of Education cut about half of its staff in a few weeks, under a plan to shrink the agency. Schools now get less federal help to choose and fund their tools.
  - d: SINCE 2025
    t: OpenAI and Google launched study modes inside their chatbots, which millions of students already use daily. Free AI tutors suddenly became direct rivals for paid learning apps.
  - d: SINCE 2025
    t: PhysicsWallah, which started as a free YouTube channel, went public in India and rose 33% on its first day. Investors began to trust profitable EdTech companies again.
  - d: SINCE 2026
    t: Coursera completed its merger with Udemy, creating a platform with about 290 million learners worldwide. Online course platforms began to merge to stay relevant against AI.
  - d: SINCE 2026
    t: The EU delayed its AI Act rules for education, which treat many school uses of AI as high risk, to December 2027. Schools in Europe gained more time to test and adopt AI tools.
  - d: SINCE 2026
    t: Coursera invested $100 million in LearnVector, the new AI tutoring startup of Andrew Ng, who cofounded Coursera. AI-native tutors became a serious bet for established players.
  note: *id001
  src: 25
