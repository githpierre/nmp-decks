- id: ed006
  type: definition
  section: Market definition
  title: 'What is the EdTech market,

    in simple terms?'
  text: The EdTech market is the software, apps, and online services that schools, companies, and learners pay for to teach, learn, test, and certify new skills
  note:
  - We often use a conversational tone, which may sometimes sound a bit informal
  - We do it on purpose, because it reduces cognitive load and makes slides easier
  src: 6
