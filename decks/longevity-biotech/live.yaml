ed142p:
  title: 'What could go wrong

    for longevity biotech?'
  events:
  - odds: 25
    impact: 2
    text: Longevity funding keeps falling and rounds concentrate in Altos and Retro, starving smaller startups
  - odds: 25
    impact: 3
    text: More aging drugs fail Phase 2 trials like BioAge did, and investors exit the longevity sector
  - odds: 20
    impact: 3
    text: The FDA formally rejects aging as an endpoint, so longevity drugs must win approval disease by disease
  - odds: 15
    impact: 2
    text: Cheap rapamycin, metformin and GLP-1 drugs capture the aging market before new longevity drugs reach patients
  - odds: 12
    impact: 1
    text: Free open AI models give away target discovery, so AI longevity startups lose their main selling point
  - odds: 10
    impact: 2
    text: Loyal's dog lifespan drug fails or gets rejected by the FDA, hurting the case for aging drugs
  - odds: 8
    impact: 2
    text: Hyped longevity trials show weak results, and the public and investors lose trust in the field
  - odds: 5
    impact: 3
    text: A serious side effect in Life Biosciences' partial reprogramming trial halts the whole epigenetic reset field
  note:
  - We listed the events that could slow longevity biotech down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
