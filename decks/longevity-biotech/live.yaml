ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people ask how fo live

    longer, as longevity goes mainstream'
  date: Recently.
  expl: Living longer used to be a question for scientists. Now it is a daily topic on podcasts, TikTok and in gyms, with blood tests, supplements and longevity
    clinics everywhere. Each new viral routine sends a new wave of people searching how to add healthy years.
  term: longevity biotech
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/longevity-biotech/longevity-biotech.csv
