ed148p:
  title: 'What pushed the lab automation

    market forward, year after year?'
  events:
  - year: '1940'
    text: Catalyst rigs prove automated screening
    impact: 1.0
  - year: '1957'
    text: AutoAnalyzer scales routine lab chemistry
    impact: 1.5
  - year: '1980'
    text: Fully automated labs become practical
    impact: 2.0
  - year: '1985'
    text: Robotics enter pharmaceutical screening labs
    impact: 2.0
  - year: '1990'
    text: 96-well plates standardize parallel assays
    impact: 2.0
  - year: '1993'
    text: Lab automation management systems emerge
    impact: 1.5
  - year: '1995'
    text: Tecan scales programmable liquid handling
    impact: 1.5
  - year: '1998'
    text: Chemspeed automates synthetic workflows
    impact: 1.5
  - year: '2000'
    text: Integrated workcells connect instruments
    impact: 2.0
  - year: '2004'
    text: Robot Scientist Adam closes experiment loop
    impact: 2.5
  - year: '2007'
    text: Closed-loop chemistry optimizes nanoparticles
    impact: 2.0
  - year: '2009'
    text: Adam reports autonomous discoveries
    impact: 2.5
  - year: '2012'
    text: Cloud labs separate experiments from location
    impact: 1.5
  - year: '2013'
    text: Strateos model pushes remote automation
    impact: 1.5
  - year: '2014'
    text: Opentrons lowers robot entry cost
    impact: 2.0
  - year: '2015'
    text: Robot Scientist Eve accelerates screening
    impact: 2.0
  - year: '2016'
    text: Biofoundries scale DBTL cycles
    impact: 1.5
  - year: '2017'
    text: Machine learning guides experiment selection
    impact: 1.5
  - year: '2018'
    text: Modular robots make workcells more flexible
    impact: 1.0
  - year: '2019'
    text: Self-driving labs expand materials discovery
    impact: 2.0
  - year: '2020'
    text: Covid creates urgent automation demand
    impact: 2.5
  - year: '2021'
    text: Cloud labs gain remote-work relevance
    impact: 1.5
  - year: '2022'
    text: AI models accelerate experiment planning
    impact: 1.5
  - year: '2023'
    text: Lab orchestration software becomes strategic
    impact: 1.5
  - year: '2024'
    text: Self-driving labs broaden scientific domains
    impact: 2.0
  - year: '2024'
    text: LLMs simplify automation programming
    impact: 1.5
  - year: '2025'
    text: Policy attention legitimizes autonomous labs
    impact: 1.0
  - year: '2025'
    text: Core facilities explore shared automation
    impact: 1.0
  - year: '2026'
    text: Opentrons links AI agents to robotics
    impact: 2.0
  - year: '2026'
    text: Hamilton automates nanoparticle formulation
    impact: 2.0
  note:
  - We kept the events we believe pushed lab automation forward the most
  - Ratings are our estimates, with all the sources at the end of the report
