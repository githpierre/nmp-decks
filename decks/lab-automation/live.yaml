ed007p:
  type: pp_radar
  title: 'Which companies really

    belong in lab automation?'
  TL:
    name: Benchling
    src: ../../assets/logos/pp_live/lab-automation/s01-00.png
    text: it manages biotech R&D data and workflows, but it does not itself execute experiments through robots or automated
  TR:
    name: OpenAT
    src: ../../assets/logos/pp_live/lab-automation/s01-02.png
    text: its models can design or analyze experiments, but it does not sell laboratory robots, instruments or automated lab
  BL:
    name: Periodic Labs
    src: ../../assets/logos/pp_live/lab-automation/s01-09.png
    text: it is building autonomous physical science labs, but its early focus is materials discovery rather than life science
  BR:
    name: Ginkgo Bioworks
    src: ../../assets/logos/pp_live/lab-automation/s01-10.png
    text: its foundries are heavily automated, but automation mainly supports its own cell programming and contract research
  caption:
  - Distance to the center reflects how central each company is to lab automation
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
  - ../../assets/logos/pp_live/lab-automation/s01-01.png
