ed148p:
  title: 'What pushed the EV charging infrastructure

    market forward, year after year?'
  events:
  - year: '2012'
    text: Tesla proves fast charging can scale
    impact: 1.5
  - year: '2014'
    text: EU mandates alternative-fuel infrastructure
    impact: 1.5
  - year: '2017'
    text: European fast-charging networks accelerate
    impact: 1.5
  - year: '2019'
    text: Public charging becomes core EV policy
    impact: 1.0
  - year: '2020'
    text: EV growth lifts charger utilization
    impact: 1.5
  - year: '2021'
    text: US allocates $7.5B for charging
    impact: 3.0
  - year: '2021'
    text: Joint Office coordinates federal rollout
    impact: 1.5
  - year: '2022'
    text: NEVI guidance standardizes highway buildout
    impact: 2.0
  - year: '2022'
    text: All states submit charging plans
    impact: 1.5
  - year: '2022'
    text: All state NEVI plans approved
    impact: 2.0
  - year: '2023'
    text: Federal charger standards improve reliability
    impact: 2.0
  - year: '2023'
    text: NACS adoption simplifies US connectors
    impact: 2.0
  - year: '2023'
    text: AFIR locks in EU corridor targets
    impact: 2.5
  - year: '2024'
    text: First NEVI stations open
    impact: 2.0
  - year: '2024'
    text: CFI awards fund community charging
    impact: 2.0
  - year: '2024'
    text: Reliability funding upgrades broken chargers
    impact: 1.5
  - year: '2024'
    text: US public charging network doubles
    impact: 2.0
  - year: '2024'
    text: J3400 becomes recommended practice
    impact: 1.5
  - year: '2025'
    text: Global public chargers pass seven million
    impact: 2.0
  - year: '2025'
    text: US adds record public charging points
    impact: 1.5
  - year: '2025'
    text: Europe accelerates ultra-fast deployment
    impact: 2.0
  - year: '2025'
    text: China expands fast charging sharply
    impact: 2.0
  - year: '2025'
    text: NEVI guidance gives states flexibility
    impact: 1.5
  - year: '2025'
    text: Truck charging wins major EU funding
    impact: 2.0
  - year: '2026'
    text: NEVI obligations resume
    impact: 2.0
  - year: '2026'
    text: Forty-two states win plan approval
    impact: 2.0
  - year: '2026'
    text: BYD unveils megawatt car charging
    impact: 2.0
  - year: '2026'
    text: Indonesia opens first ultra-fast site
    impact: 1.0
  - year: '2026'
    text: EU truck charging network takes shape
    impact: 2.0
  - year: '2026'
    text: IEA forecasts massive charger buildout
    impact: 3.0
  note:
  - We kept the events we believe pushed ev charging infrastructure forward the most
  - Ratings are our estimates, with all the sources at the end of the report
