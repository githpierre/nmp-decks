ed007p:
  type: pp_radar
  title: 'Which companies really belong

    in EV charging infrastructure?'
  TL:
    name: Gogoro
    src: ../../assets/logos/pp_live/ev-charging-infrastructure/s01-00.png
    text: runs battery swapping for electric scooters, which supplies mobility energy but is not plug-in EV charging infrastructur
  TR:
    name: Rivian
    src: ../../assets/logos/pp_live/ev-charging-infrastructure/s01-02.png
    text: makes electric vehicles and owns some chargers, but vehicle manufacturing is its primary business rather than charging
  BL:
    name: Shell
    src: ../../assets/logos/pp_live/ev-charging-infrastructure/s01-09.png
    text: owns and operates EV charging assets through a broad energy business still dominated by fuels and convenience retail
  BR:
    name: Tesla
    src: ../../assets/logos/pp_live/ev-charging-infrastructure/s01-10.png
    text: operates a major fast-charging network, while most company revenue comes from vehicles, storage and related products
  caption:
  - Distance to the center reflects how central each company is to EV charging infrastructure
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
