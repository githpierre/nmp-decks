ed007p:
  type: pp_radar
  title: 'Who Is In earned wage access,

    and who stays outside?'
  TL:
    name: Chime
    src: ../../assets/logos/pp_live/earned-wage-access/s01-00.png
    text: offers early direct deposit and workplace pay access, but consumer — banking is the broader core business
  TR:
    name: Payday.com
    src: ../../assets/logos/pp_live/earned-wage-access/s01-02.png
    text: traditional payday lending advances unearned credit and falls outside earned wage access by definition
  BL:
    name: Gusto Cashout
    src: ../../assets/logos/pp_live/earned-wage-access/s01-09.png
    text: gives workers early access to pay, while payroll and HR software remain the main business
  BR:
    name: Dayforce Wallet
    src: ../../assets/logos/pp_live/earned-wage-access/s01-10.png
    text: provides on-demand pay, while the company primarily sells enterprise payroll and HCM software
  caption:
  - Distance to the center reflects how central each company is to earned wage access
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
  - ../../assets/logos/pp_live/earned-wage-access/s01-01.png
