ed148p:
  title: 'What pushed the earned wage access

    market forward, year after year?'
  events:
  - year: '2012'
    text: Payactiv builds employer-linked wage access
    impact: 2.0
  - year: '2015'
    text: DailyPay scales on-demand pay model
    impact: 1.5
  - year: '2017'
    text: Walmart validates early wage access
    impact: 2.5
  - year: '2018'
    text: Payroll integrations reduce employer workload
    impact: 1.5
  - year: '2019'
    text: Financial wellness bundles widen adoption
    impact: 1.0
  - year: '2020'
    text: Pandemic increases paycheck timing stress
    impact: 2.0
  - year: '2020'
    text: CFPB gives Payactiv regulatory safe harbor
    impact: 2.5
  - year: '2020'
    text: Remote work accelerates digital payroll tools
    impact: 1.0
  - year: '2021'
    text: Employers compete harder on hourly benefits
    impact: 1.5
  - year: '2021'
    text: EWA expands beyond hospitality and retail
    impact: 1.0
  - year: '2022'
    text: Ten million workers use EWA
    impact: 2.0
  - year: '2022'
    text: CFPB ends Payactiv sandbox order
    impact: 1.0
  - year: '2022'
    text: Instant payments improve transfer experience
    impact: 1.5
  - year: '2023'
    text: Nevada creates EWA-specific framework
    impact: 1.5
  - year: '2023'
    text: State frameworks begin to multiply
    impact: 1.0
  - year: '2024'
    text: CFPB proposes treating EWA as credit
    impact: 1.0
  - year: '2024'
    text: Direct-to-consumer models draw scrutiny
    impact: 1.0
  - year: '2024'
    text: Employer APIs make EWA easier to deploy
    impact: 1.5
  - year: '2025'
    text: Six states add new EWA regimes
    impact: 2.0
  - year: '2025'
    text: CFPB reverses toward noncredit treatment
    impact: 2.5
  - year: '2025'
    text: Fee disclosure rules become common
    impact: 1.5
  - year: '2025'
    text: No-cost access becomes policy norm
    impact: 1.5
  - year: '2025'
    text: State licensing creates defensible category
    impact: 1.0
  - year: '2025'
    text: EWA avoids traditional collections model
    impact: 1.5
  - year: '2026'
    text: Twelve states have EWA-specific rules
    impact: 2.0
  - year: '2026'
    text: Congress advances national EWA framework
    impact: 2.0
  - year: '2026'
    text: ADP integration supports real-time access
    impact: 1.5
  - year: '2026'
    text: Regulators clarify state-by-state differences
    impact: 1.0
  - year: '2026'
    text: States scrutinize direct-to-consumer apps
    impact: 1.5
  - year: '2026'
    text: Federal debate validates EWA scale
    impact: 1.5
  note:
  - We kept the events we believe pushed earned wage access forward the most
  - Ratings are our estimates, with all the sources at the end of the report
ed168p:
  handle: earned-wage-access
  title: 'Where did earned wage access investors

    put their money this past year?'
  note:
  - We added up every equity round of earned wage access startups in our tracker over the last twelve months
  - by category of our market definition, and rounds with no public amount count as zero here
