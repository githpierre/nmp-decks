  - We use a fictional typical GPU cloud for contrast, not as an assertion about any named competitor.
  right: FIREWORKS AI
  rows:
  - - They rent GPUs and make customers set up model servers
    - They run customer models on managed cloud endpoints
  - - They chase generic AI apps instead of repeat compute
    - They focus on serving and tuning each client AI model
  - - They wait for growth before raising enough cloud funds
    - They raised $250M at a $4B valuation back in 2025
  - - They charge only fixed servers even when demand varies
    - They sell hosted inference for live customer model calls
  - - They treat open models as a threat to their own tools
    - They use open models to serve tailored company needs
  - - They offer a few small tests without live enterprise use
    - They now serve more than 40 trillion AI tokens every day
  - - They grow their cloud alone without major chip backing
    - They took Nvidia money in a $1.5B Series D in July 2026
  - - They sell the idea of future income instead of demand
    - They reported a $1B annualized revenue run rate
  section: Startup strategies
  src: 213
  title: How Fireworks grew a $1B model-serving cloud
  type: contrast
  logo_src: ../../assets/logos/fireworks-ai.png
- id: ed214
  left: A TYPICAL GPU CLOUD STARTUP
  logo: baseten
  note:
  - We used company releases and filings for its products and disclosed contracts, finance, or operations.
  - We use a fictional typical GPU cloud for contrast, not as an assertion about any named competitor.
  right: BASETEN
  rows:
  - - They host each customer on one fixed GPU cloud region
    - They pool servers from more than ten cloud operators
  - - They ask app teams to deploy and patch model servers
    - They run customer inference through managed endpoints
  - - They keep idle hardware around to cover each peak load
    - They shift model demand across a shared GPU cloud pool
  - - They win by selling raw chips at the lowest hourly cost
    - They compete on fast, reliable model execution in apps
  - - They build one bespoke hosting setup for every customer
    - They provide one serving layer across many cloud hosts
  - - They remain small while AI traffic grows much faster
    - They reported model inference volume up 40x in a year
  - - They raise only enough cash for the next hardware batch
    - They raised $1.5B at a $13B valuation in June 2026
  - - They serve just a few demos rather than live AI products
    - They power model inference for major customer AI apps
  section: Startup strategies
  src: 214
  title: How Baseten made many GPU clouds feel like one
  type: contrast
  logo_src: ../../assets/logos/baseten--symbol.png
