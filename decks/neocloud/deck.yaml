- id: ed154
  type: x/drivers_feed_each_other
  section: Growth drivers
  title: Which neocloud drivers feed each other?
  src: 154
  t:
    6: More GPU usage attracts chip supply, which helps the same cloud add new capacity
    7: More local data centers cut delays, drawing clients who need nearby AI compute
    8: Better fault checks lift uptime, attracting larger jobs and more cloud demand
    9: More prepaid contracts finance new racks, helping meet demand from the next buyer
    10: More contracts draw lender capital, letting fleets expand without only new equity
    11: More users produce traffic signals, which help teams size and tune inference fleets
    12: More workload types fill unused slots, making existing GPU fleets earn more revenue
    13: Bigger fleets improve chip buying terms and make regional cloud sales easier
