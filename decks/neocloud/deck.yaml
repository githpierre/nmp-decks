- id: iv_fda
  type: x/were_key_phases_market_acceleration
  section: Market challenges
  title: What does it take to turn chips into a cloud people pay for?
  note: We mapped a representative build-to-bill sequence from reported hardware procurement, lending terms, power schedules and customer acceptance.
  src: 147
  t:
    7: 'CHIP SUPPLY


      The cloud orders Nvidia or AMD GPUs. Allocation and terms can decide shipments months ahead.'
    8: 'FUND FLEET


      A lender checks signed buyers and chip value. Debt can close weeks or months before delivery.'
    9: 'POWER AND SITE


      The builder secures land, cooling, permits and a grid tie. Delivery can take many months or years.'
    10: 'SELL AND BILL


      Clients sign reserved or hourly deals. Billing starts when usable capacity is accepted.'
    11: 'BUILD AND TEST


      Engineers wire racks and links, then test them. This can take weeks or months.'
