  type: x/have_been_different_waves_hot
  section: Top players
  title: What have been the different waves of 'hot' startups over time?
  note: We grouped companies by when they became visible through contracts, listings or large rounds. It is a directional history, not a formal taxonomy.
  src: 174
  t:
    6: '2017 - 2021


      CoreWeave and Crusoe started close to crypto mining while Lambda sold AI servers. GPU rental was a niche next to the big clouds.'
    7: '2022 - 2023


      ChatGPT set off a rush for Nvidia chips. CoreWeave won Microsoft as a client and borrowed $2.3B against contracts it had signed.'
    8: '2024 - 2025


      CoreWeave listed in 2025 as inference clouds took off. Fireworks AI, Baseten, Modal and fal all passed $1B in value.'
    9: 'TODAY


      Nscale signed $45B with Anthropic, Crusoe is worth $31B and Fireworks AI $18B. Giant contracts now drive the market.'
    10: '?


      The next winners may be those that serve many apps at a profit, not those with the most GPUs. Power, debt costs and chip prices will decide.'
