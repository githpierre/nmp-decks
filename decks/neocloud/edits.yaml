  3: 'CoreWeave, third

    quarter 2026 results'
  4: CoreWeave's release on its third quarter of 2026, with revenue, order backlog and power under contract
  5: We used it for the $3.7B quarter and the $133B backlog. It also set the scale of the largest neocloud.
  7: 'CoreWeave, 10-Q

    third quarter 2026'
  8: CoreWeave's quarterly filing with the SEC, with its sales growth, client share and interest costs
  9: We used it for the 168% growth and the rise in interest costs. It also backed the debt and client risks.
  10: 'CoreWeave, 2025

    annual report'
  11: CoreWeave's annual filing with the SEC, with its history, its IPO and the book life of its chips
  12: We used it for the 2020 cloud launch, the 2025 IPO and the six-year chip life. It also framed the early years.
  13: 'CoreWeave and Meta,

    $21B agreement'
  14: CoreWeave's release on its expanded AI cloud deal with Meta running through December 2032
  15: We used it for the $21B contract. It also showed how big tech rents capacity from neoclouds.
  16: 'Nebius, third quarter

    2026 shareholder letter'
  17: Nebius's letter on its third quarter of 2026, with AI cloud growth, prepayments and site delays
  18: We used it for the 7.4x growth, the 90% prepaid deals and the New Jersey delay. It also backed the power risks.
