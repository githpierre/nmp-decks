    neocloud forecast'
  4: Synergy Research Group's study of neocloud revenue in 2025 and its forecast to 2031
  5: We used it for the $25B of 2025 revenue and the 58% growth path. It anchored our market size.
  7: 'ABI Research,

    neocloud GPU rental'
  8: ABI Research's chart on GPU-as-a-service revenue of neoclouds and its split between training and inference
  9: We used it for the $42B 2025 base and the 43% growth. It also showed inference growing faster than training.
  10: 'Gartner, neocloud

    share by 2030'
  11: Gartner's prediction of the share of the AI cloud market that neoclouds will take by 2030
  12: We used it for the 20% of a $267B market. It also showed that analysts now treat neocloud as a market.
  13: 'IEA, data center

    power in 2025'
  14: The International Energy Agency's review of data center power use and grid bottlenecks in 2025
  15: We used it for the 17% rise in power use and the grid delays. It also backed the power bottleneck.
  16: 'SemiAnalysis,

    ClusterMAX'
  17: SemiAnalysis's rating of GPU clouds on uptime, networks, storage and support
  18: We used it for the 84 neoclouds rated. It also framed what buyers check beyond price.
