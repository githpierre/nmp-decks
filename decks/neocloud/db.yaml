ed160:
  6: Inference clouds took about 40% of the capital raised since 2024, ahead of GPU clouds with about 31%
  7: 131 of the 142 rounds since 2024 disclosed an amount, and the median disclosed round was $52M
  8: US startups closed 91 of the 142 rounds and took $29B, about 79% of the money, far ahead of the United Kingdom
  9: 56 rounds of $100M or more made up about 95% of all the capital raised in the market since 2024
  10: The $3.9B late-stage round of Crusoe is the biggest since 2024, ahead of the $2B raised by Nscale in 2026
  11: Seed was the most common round, with 36 of the 142 rounds, ahead of Series A with 33 and Series B with 18
  note: We drew these insights from our tracker of 142 neocloud equity rounds announced since January 2024, worth about $36.9B
ed162:
  6: 'BEFORE



    Before 2024, GPU clouds were few and small, and several of them, such as CoreWeave and Crusoe, were born close to crypto mining.'
  7: 'AFTER



    Since 2024, 142 rounds raised $36.9B. Inference clouds such as Fireworks AI, Baseten and fal take the biggest share, next to giant cluster builders.'
  note: We used our tracker of neocloud equity rounds, complete from January 2024, and company releases and the press
