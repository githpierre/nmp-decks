ed142p:
  title: 'What are the biggest

    threats to neocloud?'
  events:
  - odds: 25
    impact: 3
    text: AI demand slows after a cheap model shock, and neocloud stocks and contracts collapse together
  - odds: 20
    impact: 3
    text: Lenders refuse to refinance CoreWeave or peers, and a heavily indebted neocloud defaults on its loans
  - odds: 20
    impact: 2
    text: H100 and Blackwell rental prices crash again as supply floods in, wiping out neocloud margins
  - odds: 15
    impact: 3
    text: OpenAI or another AI lab fails to pay its huge compute contracts, leaving neoclouds with idle GPUs
  - odds: 15
    impact: 3
    text: Microsoft, Google and Meta stop signing neocloud deals and use only their own data centers
  - odds: 12
    impact: 2
    text: Nvidia favors hyperscalers in Rubin GPU allocation, leaving neoclouds behind on the newest chips
  - odds: 10
    impact: 2
    text: New US export rules block Nvidia GPUs for neocloud sites abroad, stranding planned capacity
  - odds: 5
    impact: 1
    text: A large rack or cooling failure takes a CoreWeave or Nebius cluster down and breaks customer contracts
  note:
  - We listed the events that could slow neocloud down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
