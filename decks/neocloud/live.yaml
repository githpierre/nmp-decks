ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'Searches for GPU cloud more than
  
    tripled from 2021 to mid-2025'
  date: From late 2021 to mid-2025.
  expl: Neoclouds are cloud companies that rent GPUs for AI. ChatGPT set off a race for GPUs, CoreWeave signed an $11.9B deal with OpenAI and went public in March 2025, and AI teams started to look for GPUs outside the big clouds.
  term: GPU cloud
  note:
  - We tracked how often people around the world googled this term from late 2021 to July 2025
  - Google changed how it counts small search terms in mid-2025, so the curve stops in July 2025
  csv: assets/trends/neocloud/gpu-cloud.csv
  cut: '2025-07-27'
  caption_period: November 2021 to July 2025
  stat_text: more searches in mid-2025<br>than in a typical week before
ed052p:
  type: pp_cagr
  title: 'How much room is left

    for neocloud to grow?'
  lead: 'To fill that room, '
  condition: neoclouds must keep getting new chips before hyperscalers, fill every new cluster with long contracts, and keep lenders willing to
    fund GPU fleets. They must also keep serving inference cheaper than big tech, as token prices keep falling every year.
  note:
  - We compared growth paths from Synergy, Gartner, McKinsey and the IEA, and aligned their timelines into a realistic range
  - We allowed for falling token prices and hyperscaler competition, and all our sources are listed at the end of the report
  size: 40
  cagr: 30
  y0: 2026
