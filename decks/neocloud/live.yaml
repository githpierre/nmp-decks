ed007p:
  type: pp_radar
  title: 'What counts as a neocloud,

    and what falls outside?'
  TL:
    name: Oracle
    src: ../../assets/logos/pp_live/neocloud/s01-00.png
    text: has a $638 billion backlog driven by AI cloud deals, but its OCI cloud is still one part of a database and software group
  TR:
    name: AMD
    src: ../../assets/logos/pp_live/neocloud/s01-02.png
    text: co-led a $350 million round in TensorWave, a cloud built on its Instinct GPUs, but it sells chips rather than renting compute
  BL:
    name: Modal
    src: ../../assets/logos/pp_live/neocloud/s01-10.png
    text: sells serverless GPU compute to AI developers, but much of it runs on capacity rented from AWS, Google Cloud and Oracle
  BR:
    name: IREN
    src: ../../assets/logos/pp_live/neocloud/s01-11.png
    text: plans to wind down bitcoin mining by year end to run AI clouds, but mining still made over 80% of its fiscal 2026 revenue
  caption:
  - Distance to the center reflects how much of a company’s business is renting out its own GPU capacity for AI as a cloud
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
