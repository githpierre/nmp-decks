rows:
- name: "CoreWeave, third\nquarter 2026 results"
  why: CoreWeave's release on its third quarter of 2026, with revenue, order backlog and power under contract
  how: We used it for the $3.7B quarter and the $133B backlog. It also set the scale of the largest neocloud.
  url: https://investors.coreweave.com/news/news-details/2026/CoreWeave-Reports-Strong-Third-Quarter-2026-Results/default.aspx
- name: "CoreWeave, 10-Q\nthird quarter 2026"
  why: CoreWeave's quarterly filing with the SEC, with its sales growth, client share and interest costs
  how: We used it for the 168% growth and the rise in interest costs. It also backed the debt and client risks.
  url: https://www.sec.gov/Archives/edgar/data/1769628/000176962826000465/crwv-20260930.htm
- name: "CoreWeave, 2025\nannual report"
  why: CoreWeave's annual filing with the SEC, with its history, its IPO and the book life of its chips
  how: We used it for the 2020 cloud launch, the 2025 IPO and the six-year chip life. It also framed the early years.
  url: https://www.sec.gov/Archives/edgar/data/1769628/000176962826000104/crwv-20251231.htm
- name: "CoreWeave and Meta,\n$21B agreement"
  why: CoreWeave's release on its expanded AI cloud deal with Meta running through December 2032
  how: We used it for the $21B contract. It also showed how big tech rents capacity from neoclouds.
  url: https://www.coreweave.com/news/coreweave-and-meta-announce-21-billion-expanded-ai-infrastructure-agreement
- name: "Nebius, third quarter\n2026 shareholder letter"
  why: Nebius's letter on its third quarter of 2026, with AI cloud growth, prepayments and site delays
  how: We used it for the 7.4x growth, the 90% prepaid deals and the New Jersey delay. It also backed the power risks.
  url: https://www.sec.gov/Archives/edgar/data/1513845/000110465926126008/tm2629571d1_ex99-2.htm
- name: "Nebius and Meta,\nup to $27B"
  why: Nebius's release on its five-year deal with Meta for $12B of dedicated capacity, up to $27B in total
  how: We used it for the Meta contract. It also showed the size of the deals signed in 2026.
  url: https://nebius.com/newsroom/nebius-signs-new-ai-infrastructure-agreement-with-meta
- name: "Nscale, IPO\nfiling"
  why: Nscale's filing with the SEC for its New York listing, with its backlog, losses and Anthropic deal
  how: We used it for the $103B booked against $2.6B active and the 52% client share. It also backed its risks.
  url: https://www.sec.gov/Archives/edgar/data/2110365/000119312526395475/ck0002110365-20260918.htm
- name: "Nscale, November\n2026 filing"
  why: Nscale's updated filing with the SEC on the funding it still needs for its Anthropic contracts
  how: We used it for the missing binding funding. It also framed how far signed deals are from cash.
  url: https://www.sec.gov/Archives/edgar/data/2110365/000119312526458722/ck0002110365-20261112.htm
- name: "IREN, first quarter\nfiscal 2027 results"
  why: IREN's release on its AI cloud sales, backlog and revenue goal for the quarter to September 2026
  how: We used it for the $200M of quarterly AI cloud sales and the $20.3B backlog. It also showed a delay in its goal.
  url: https://iren.gcs-web.com/news-releases/news-release-details/iren-reports-q1-fy27-results
- name: "IREN and Microsoft,\n$9.7B contract"
  why: IREN's release on its five-year contract to give Microsoft access to Nvidia GB300 GPUs
  how: We used it for the $9.7B deal. It also showed how a former bitcoin miner became an AI cloud.
  url: https://iren.gcs-web.com/news-releases/news-release-details/iren-secures-97bn-ai-cloud-contract-microsoft
- name: "Synergy Research,\nneocloud forecast"
  why: Synergy Research Group's study of neocloud revenue in 2025 and its forecast to 2031
  how: We used it for the $25B of 2025 revenue and the 58% growth path. It anchored our market size.
  url: https://www.srgresearch.com/articles/neocloud-market-forecast-to-approach-400b-by-2031-driven-by-surging-ai-infrastructure-demand
- name: "ABI Research,\nneocloud GPU rental"
  why: ABI Research's chart on GPU-as-a-service revenue of neoclouds and its split between training and inference
  how: We used it for the $42B 2025 base and the 43% growth. It also showed inference growing faster than training.
  url: https://www.abiresearch.com/news-resources/chart-data/gpu-as-a-service-revenue-for-neoclouds
- name: "Gartner, neocloud\nshare by 2030"
  why: Gartner's prediction of the share of the AI cloud market that neoclouds will take by 2030
  how: We used it for the 20% of a $267B market. It also showed that analysts now treat neocloud as a market.
  url: https://www.gartner.com/en/newsroom/press-releases/2026-06-23-gartner-predicts-neocloud-providers-will-capture-20-percent-of-the-267-billion-dollar-ai-cloud-market-by-2030
- name: "IEA, data center\npower in 2025"
  why: The International Energy Agency's review of data center power use and grid bottlenecks in 2025
  how: We used it for the 17% rise in power use and the grid delays. It also backed the power bottleneck.
  url: https://www.iea.org/news/data-centre-electricity-use-surged-in-2025-even-with-tightening-bottlenecks-driving-a-scramble-for-solutions
- name: "SemiAnalysis,\nClusterMAX"
  why: SemiAnalysis's rating of GPU clouds on uptime, networks, storage and support
  how: We used it for the 84 neoclouds rated. It also framed what buyers check beyond price.
  url: https://clustermax.semianalysis.com/v2
- name: "Lambda, $1B\ncontract-backed debt"
  why: Lambda's release on its fixed-rate loan backed by contracts with two hyperscale clients
  how: We used it for the $1B loan. It also showed how neoclouds fund GPUs with signed contracts.
  url: https://lambda.com/blog/lambda-closes-1-billion-senior-secured-fixed-rate-financing
- name: "US Commerce, rule on\nremote chip access"
  why: The US Bureau of Industry and Security's rule on remote access to advanced AI chips through clouds abroad
  how: We used it for the new export check on clouds. It also backed the regulation and export risks.
  url: https://www.bis.gov/press-release/bis-issues-rule-addressing-remote-access-american-super-intelligence-technology
- name: "Fireworks AI,\n$1.5B Series D"
  why: Fireworks AI's post on its Series D, its $1B revenue run rate and its daily token volume
  how: We used it for the $18B value and the 40 trillion tokens a day. It also showed the rise of inference clouds.
  url: https://fireworks.ai/blog/fireworks-series-d-funding
- name: "Baseten,\n$1.5B Series F"
  why: Baseten's post on its Series F at a $13B valuation and its growth in revenue and inference volume
  how: We used it for the 20x revenue and 40x volume. It also backed the inference story.
  url: https://www.baseten.co/blog/announcing-our-series-f/
- name: "Microsoft and Nscale,\nUK site exit"
  why: Reuters' report on Microsoft pulling out of Nscale's flagship UK data center after a grid delay
  how: We used it for the lost UK site. It also showed how power delays can cost a neocloud its anchor client.
  url: https://www.investing.com/news/stock-market-news/microsoft-pulls-out-of-uk-nscale-data-centre-deal-over-power-delay-4960690
