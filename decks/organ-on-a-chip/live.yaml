ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More scientists search for organoids

    as labs move away from animal tests'
  date: Lately.
  expl: In 2025 the FDA said it would phase out animal testing for some drugs and accept data from human cell models. Labs turned to organoids and organ
    chips that copy real human tissue, and searches for organoids jumped.
  term: organ on a chip
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/organ-on-a-chip/organ-on-a-chip.csv
ed052p:
  type: pp_cagr
  title: 'What will the organ-on-a-chip

    market be worth by 2036?'
  lead: ''
  condition: To be worth that much, the market must get regulators and drug makers to accept chip results in place of some animal tests, as the FDA now
    encourages. It must also make chips cheap and standard enough for routine use.
  note:
  - We compared forecasts from Fortune Business Insights, Polaris Market Research, Global Market Insights and IMARC
  - We adjusted each one to our market definition and built a realistic range, with all the sources at the end of the report
  size: null
  cagr: 24
  y0: 2026
