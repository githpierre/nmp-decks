ed148p:
  title: 'What pushed organ-on-a-chip

    forward, year after year?'
  events:
  - year: '2010'
    text: Breathing lung chip proves organ mimicry
    impact: 3.0
  - year: '2012'
    text: Gut chips add microbial interactions
    impact: 2.0
  - year: '2012'
    text: NIH funds standardized tissue chip research
    impact: 2.0
  - year: '2012'
    text: DARPA backs linked human tissue chips
    impact: 2.0
  - year: '2013'
    text: FDA explores radiation countermeasure chips
    impact: 1.0
  - year: '2013'
    text: Kidney chips expand disease model range
    impact: 1.0
  - year: '2014'
    text: Emulate commercializes academic chip platform
    impact: 2.0
  - year: '2015'
    text: Pharma partnerships test chip reproducibility
    impact: 1.5
  - year: '2015'
    text: Linked chips model organ interactions
    impact: 1.5
  - year: '2016'
    text: Covance brings chips into contract testing
    impact: 1.5
  - year: '2016'
    text: Automation makes organ chips easier
    impact: 1.5
  - year: '2017'
    text: FDA trials liver chips for safety
    impact: 2.0
  - year: '2017'
    text: Space grants widen tissue chip uses
    impact: 1.0
  - year: '2018'
    text: AstraZeneca tests chips in drug R&D
    impact: 1.5
  - year: '2018'
    text: First space launch tests tissue chips
    impact: 1.5
  - year: '2019'
    text: Space missions multiply organ chip models
    impact: 1.0
  - year: '2019'
    text: Liver chip identifies drug injury pathways
    impact: 1.5
  - year: '2020'
    text: Pandemic drives human lung infection models
    impact: 1.5
  - year: '2020'
    text: Heart and intestine chips reach space
    impact: 1.0
  - year: '2021'
    text: Repeated space flights test chip stability
    impact: 1.0
  - year: '2022'
    text: Blinded liver tests show predictive power
    impact: 2.5
  - year: '2022'
    text: US law broadens nonanimal test acceptance
    impact: 3.0
  - year: '2023'
    text: Liver research clarifies chip uses
    impact: 1.0
  - year: '2024'
    text: Intestine chip standard boosts reliability
    impact: 1.0
  - year: '2024'
    text: FDA accepts organ chip ISTAND proposal
    impact: 2.5
  - year: '2025'
    text: FDA plans animal testing phaseout
    impact: 2.5
  - year: '2025'
    text: Merck imec partnership targets scalable chips
    impact: 1.5
  - year: '2026'
    text: FDA guidance clarifies chip validation
    impact: 2.0
  - year: '2026'
    text: FDA publishes regulatory use case database
    impact: 1.5
  - year: '2026'
    text: FDA rule explicitly recognizes organ chips
    impact: 2.0
  note:
  - We kept the events we believe pushed organ on a chip forward the most
  - Ratings are our estimates, with all the sources at the end of the report
