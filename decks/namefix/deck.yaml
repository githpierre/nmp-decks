- label: INFLUENCER MARKETING
  type: pp_risks
  section: Market challenges
  title: What are the biggest threats to the influencer marketing market?
  events:
  - text: The FTC tightens influencer disclosure enforcement, raising compliance costs and making some brands reduce creator campaigns
    odds: 50
    impact: 3
  - text: Meta and TikTok expand native creator marketplaces, displacing independent influencer platforms with first-party campaign too
    odds: 60
    impact: 3
  - text: TikTok faces new US restrictions or a forced restructuring, disrupting creator discovery and campaign measurement for brands
    odds: 35
    impact: 2
  - text: Creator fraud and fake engagement rise faster than detection, reducing advertiser trust in influencer performance metrics
    odds: 45
    impact: 2
  - text: Brands shift budgets toward retail media and paid social automation, leaving less spend for managed influencer software seats
    odds: 40
    impact: 2
  - text: Privacy changes limit cross-platform attribution, making influencer ROI harder to prove and weakening software renewal rates
    odds: 45
    impact: 2
  - text: Large creators move to direct brand deals and agencies, reducing platform transaction volume and creator marketplace liquidit
    odds: 35
    impact: 1
  - text: AI-generated influencers trigger disclosure rules and consumer backlash, delaying brand adoption of synthetic creator workflo
    odds: 30
    impact: 2
  note:
  - We listed the events that could slow influencer marketing down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and you will find all the sources we used at the end of the report
