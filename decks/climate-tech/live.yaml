ed142p:
  title: 'What could go wrong

    for climate tech?'
  events:
  - odds: 45
    impact: 3
    text: Treasury tightens foreign sourcing rules and more solar, wind and hydrogen projects lose federal tax credits
  - odds: 45
    impact: 3
    text: The DOE cancels billions more in grants and loans, stranding more hydrogen hub and carbon capture projects
  - odds: 45
    impact: 2
    text: Chinese solar, battery and EV makers cut prices so low that Western startups cannot compete
  - odds: 40
    impact: 2
    text: Climate tech venture funding stays below 2021 levels and Series B startups fail to find investors
  - odds: 40
    impact: 2
    text: Utilities delay grid connections for years, so new solar, storage and data center projects stall
  - odds: 35
    impact: 2
    text: Northvolt-style collapses hit more battery and green steel startups that cannot fund first factories
  - odds: 30
    impact: 2
    text: High interest rates raise financing costs and first-of-a-kind plants miss the returns lenders expected
  - odds: 25
    impact: 2
    text: Carbon credit scandals collapse demand for removal credits from Climeworks and similar companies
  note:
  - We listed the events that could slow climate tech down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
