ed052p:
  type: pp_cagr
  title: 'Can the climate tech

    market still grow?'
  lead: ''
  condition: Yes, but the market must keep clean power cheaper than fossil fuels, build grids and storage fast, and win buyers in industry and transport
    every year. It must also survive policy swings, raise capital for first plants, and turn early technologies like clean steel, fusion, and carbon removal
    into real businesses.
  note:
  - We compared forecasts from BloombergNEF, the IEA, IRENA and research firms and adjusted each one to our market definition
  - We then built a realistic range from these forecasts, and you will find all the sources we used at the end of the report
  size: null
  cagr: 7
  y0: 2026
