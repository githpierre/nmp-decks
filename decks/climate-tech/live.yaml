    text: did more than anyone to make electric cars mainstream, but it is valued and run as a carmaker and AI company rather than a climate one
  TR:
    name: ExxonMobil
    src: ../../assets/logos/pp_live/climate-tech/s01-02.png
    text: runs carbon capture J projects, but they remain small next to an oil and gas business it plans to keep expanding
  BL:
    name: Octopus Energy
    src: ../../assets/logos/pp_live/climate-tech/s01-10.png
    text: sells electricity like any other utility, but its focus on renewables and its software roots put it right on the boundary
  BR:
    name: Beyond Meat
    src: ../../assets/logos/pp_live/climate-tech/s01-11.png
    text: markets a much lower footprint than beef, but it is a food brand first and fits more naturally in the alternative protein market
