ed007p:
  type: pp_radar
  title: 'Which companies truly belong

    in the creator economy?'
  TL:
    name: Kling AI
    src: ../../assets/logos/pp_live/creator-economy/s01-00.png
    text: generates video for millions of creators, but enterprise clients like ad agencies are the main driver of its growth
  TR:
    name: Etsy
    src: ../../assets/logos/pp_live/creator-economy/s01-02.png
    text: hosts millions of independent makers, but they earn money by selling the goods they make, not content for an audience
  BL:
    name: Shopify
    src: ../../assets/logos/pp_live/creator-economy/s01-10.png
    text: powers the merch stores of creators like MrBeast, but most of its merchants are ordinary businesses selling products
  BR:
    name: Spotify
    src: ../../assets/logos/pp_live/creator-economy/s01-11.png
    text: now pays video podcasters through its Partner Program, but most of its payouts still go to music rights holders
  caption:
