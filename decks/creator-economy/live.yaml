ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people search

    for a UGC creator platform online'
  date: Recently.
  expl: Brands now pay everyday people to film product videos that look real, and they need somewhere to find those people. Creator marketplaces and AI
    tools for UGC started spreading, and more people searched for a platform to join or to hire from.
  term: creator economy
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/creator-economy/creator-economy.csv
ed052p:
  type: pp_cagr
  title: 'How much room is left

    for this market to grow?'
  lead: 'To fill that room, '
  condition: brands must keep shifting budgets to creators, and fans must keep paying for content, products, and access every year. The market must also
    stop AI copies of faces and voices, keep platforms stable, and turn more creators from hobbyists into real businesses.
  note:
  - We compared forecasts from Grand View, Fortune Business Insights, Precedence and Market.us
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: 350
  cagr: 20
  y0: 2026
