ed142p:
  title: 'What could go wrong for

    the creator economy?'
  events:
  - odds: 45
    impact: 2
    text: Instagram and YouTube build free storefronts, courses and memberships, making paid creator tools less needed
  - odds: 40
    impact: 3
    text: YouTube, Instagram and TikTok add AI-generated content so cheap that human creators lose brand deals
  - odds: 35
    impact: 3
    text: The new US TikTok joint venture changes the algorithm and creators lose reach and income overnight
  - odds: 35
    impact: 2
    text: Venture funding for creator startups stays low after the 2022 crash and many Series A companies close
  - odds: 30
    impact: 1
    text: The FTC fines creators and agencies over undisclosed sponsorships under its new fake review rules
  - odds: 25
    impact: 2
    text: Brands cut influencer budgets in an ad recession and creator tool startups like Linktree see revenue fall
  - odds: 25
    impact: 2
    text: Australia-style social media bans for teens spread to the EU and US states, shrinking young audiences
  - odds: 20
    impact: 2
    text: Visa and Mastercard pressure Patreon and Substack to drop adult content, and many creators leave
  note:
  - We listed the events that could slow creator economy down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
