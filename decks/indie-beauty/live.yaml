ed007p:
  type: pp_radar
  title: 'Who is in indie beauty,

    and who stays outside?'
  TL:
    name: Sephora
    src: ../../assets/logos/pp_live/indie-beauty/s01-00.png
    text: sells many indie brands, but retailing other companies products is its core business rather than brand ownership
  TR:
    name: Estee Lauder
    src: ../../assets/logos/pp_live/indie-beauty/s01-02.png
    text: owns a global beauty ~~ conglomerate, so its portfolio is the opposite of independently controlled indie brand
  BL:
    name: Honest
    src: ../../assets/logos/pp_live/indie-beauty/s01-09.png
    text: the Honest Company sells skincare and body care, but a large share of its ~ range is baby, household and personal care
  BR:
    name: Goop
    src: ../../assets/logos/pp_live/indie-beauty/s01-10.png
    text: sells its own beauty products, but much of the company is media, wellness commerce and products outside beauty
  caption:
  - Distance to the center reflects how central each company is to indie beauty
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
