ed148p:
  title: 'What pushed the indie beauty

    market forward, year after year?'
  events:
  - year: '1994'
    text: MAC sale validates creator-led beauty
    impact: 2.5
  - year: '1999'
    text: NARS deal rewards niche prestige
    impact: 1.5
  - year: '2005'
    text: YouTube makes beauty discovery social
    impact: 2.0
  - year: '2010'
    text: Instagram turns founders into channels
    impact: 2.0
  - year: '2011'
    text: Ipsy scales influencer sampling
    impact: 1.5
  - year: '2012'
    text: Direct beauty commerce gets cheaper
    impact: 1.5
  - year: '2014'
    text: Glossier proves community-led launches
    impact: 3.0
  - year: '2014'
    text: NYX exit highlights indie value
    impact: 1.5
  - year: '2015'
    text: Clean beauty becomes retail language
    impact: 1.5
  - year: '2016'
    text: Sephora Accelerate opens retail path
    impact: 2.0
  - year: '2016'
    text: IT Cosmetics exit proves scale
    impact: 1.5
  - year: '2017'
    text: Fenty resets shade expectations
    impact: 2.5
  - year: '2018'
    text: Instagram beauty boom peaks
    impact: 1.5
  - year: '2019'
    text: Drunk Elephant exit rewards indie
    impact: 2.0
  - year: '2020'
    text: Pandemic accelerates beauty ecommerce
    impact: 2.0
  - year: '2020'
    text: TikTok makes products go viral
    impact: 2.0
  - year: '2021'
    text: Youth To The People exits
    impact: 1.5
  - year: '2021'
    text: Sephora refocuses founder support
    impact: 1.5
  - year: '2022'
    text: MoCRA modernizes cosmetic oversight
    impact: 1.0
  - year: '2023'
    text: Aesop sale sets premium benchmark
    impact: 1.5
  - year: '2023'
    text: TikTok Shop links content sales
    impact: 1.5
  - year: '2024'
    text: Retail incubators widen brand access
    impact: 1.5
  - year: '2024'
    text: Profit replaces growth-at-all-costs
    impact: 1.0
  - year: '2025'
    text: Beauty failures sharpen discipline
    impact: 1.0
  - year: '2025'
    text: Accelerate alumni gain wider doors
    impact: 1.5
  - year: '2026'
    text: Sephora marks decade of incubation
    impact: 2.0
  - year: '2026'
    text: Beauty closures reward stronger operators
    impact: 1.0
  - year: '2026'
    text: Retail mentorship gets more selective
    impact: 1.0
  - year: '2026'
    text: MoCRA compliance becomes operating norm
    impact: 1.5
  - year: '2026'
    text: Clinical efficacy beats clean claims
    impact: 2.0
  note:
  - We kept the events we believe pushed indie beauty forward the most
  - Ratings are our estimates, with all the sources at the end of the report
