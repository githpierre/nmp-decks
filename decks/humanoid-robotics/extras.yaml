- after: iv_safety
  link: iv_safety « How fast is the price of a humanoid falling? » leads to Unitree’s real prices
  slide:
    id: xh_asp
    type: sx_stat_strip
    section: Market challenges
    title: 'Unitree’s average humanoid price

      fell 36% in one year'
    headline: What Unitree really earned per humanoid sold
    stats:
    - v: $36K
      l: Average revenue per humanoid in 2024, about RMB 260,000
    - v: $23K
      l: Average revenue per humanoid in 2025, about RMB 166,000
    - v: -36%
      l: In one year, as cheaper models such as the G1 took most of the sales
    story: It matters because cheaper robots widen the market from labs to factories and homes, and it is a real average price, not a list price or a target.
    note:
    - We divided Unitree’s humanoid revenue by its units sold, from its prospectus;
    - the mix of models changed, so this is an average, not a like-for-like price
- after: ed143
  link: ed143 « PILOTS STALL AT SCALE » leads to a maker’s idle capacity
  slide:
    id: xh_capacity
    type: sx_faceoff
    section: Market challenges
    title: 'UBTECH sold at only 31% of its

      factory capacity in early 2026'
    cards:
    - name: CAPACITY
      stats:
      - v: 6,000+
        l: full-size humanoids a year, as stated by UBTECH
      - v: 100%
        l: of what its lines can build
    - name: SALES PACE
      hl: true
      stats:
      - v: 1,842
        l: robots a year, at its first-half 2026 pace
      - v: 31%
        l: of its capacity, so about 69% is idle
    story: Factories are being built faster than customers buy. Makers must turn pilots into fleets quickly, or their new lines will stay idle and burn cash.
    note:
    - We doubled the 921 humanoids UBTECH sold in the first half of 2026,
    - and compared it with the yearly capacity UBTECH states in its filings
