ed102:
  6: Because many vendors now handle parts and totes in live operations
  8: Because remote help and task teaching cover gaps in robot autonomy
  10: Because cameras, LiDAR, force sensors and compute modules are easy to buy
  12: Because many robots already walk reliably on flat indoor floors
  14: Because customers start with narrow pilots before adding robot duties
  16: Because picking and moving objects is now a basic test for any humanoid
  18: Because single-task videos say little about real, sustained performance
  20: Because many vendors offer human-shaped robots, so shape adds little value
