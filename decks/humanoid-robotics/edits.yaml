  7: Humanoids combine legs or wheels, sensing and human-like arms in one robot for varied physical work
  10: Industrial arms are fixed machines built for repeated motions inside a set workstation or guarded cell
  11: Mobile robots move goods around sites, while humanoids add arms for tasks designed around human bodies
