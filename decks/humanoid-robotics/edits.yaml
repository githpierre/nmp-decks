ed108-s3:
  7: A developer buys the robot, opens its software interfaces and starts experiments quickly. Documentation works, parts and updates are easy to get, and teams spend their time on applications rather than on rebuilding hardware.
ed108-s4:
  7: The robot holds natural conversations, reacts with believable timing and stays engaging in noisy public places. Staff set its knowledge and personality, and visitors understand its limits. Its physical presence does what a screen cannot.
ed108-s5:
  6: The robot lifts a dramatic demo load but is slow, hard to service and unsafe near normal operations. Noise, heat and upkeep pile up and precision drops under load, so the customer still needs cranes, fixtures and people.
