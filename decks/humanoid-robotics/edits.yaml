ed087:
  10: Frames, joints and actuators turn motor commands into stable whole-body motion
  11: Cameras, touch and joint sensors tell the robot what is around it and how it moves
  14: Onboard computers run perception, planning and control fast enough for motion
  15: Dexterous hands and grippers decide how well robots grasp and handle objects
ed101:
  6: Moving totes and parts is now repeated in many warehouse and factory pilots
  8: Teleoperation and scripted teaching are common ways to add new robot tasks
  10: Depth cameras, LiDAR and force sensors now come with most humanoids
  12: Stable walking on flat floors is routine in vendors’ controlled demos
  14: Narrow pilots at one workstation are now the usual first step
  16: Basic pick, carry and place moves are now expected, not special
  18: A polished demo of one task no longer proves broad, lasting autonomy
  20: A human-like body alone no longer sets a robot apart
ed102:
  6: Because many vendors now handle parts and totes in live operations
  8: Because remote help and task teaching cover gaps in robot autonomy
  10: Because cameras, LiDAR, force sensors and compute modules are easy to buy
  12: Because many robots already walk reliably on flat indoor floors
  14: Because customers start with narrow pilots before adding robot duties
  16: Because picking and moving objects is now a basic test for any humanoid
  18: Because single-task videos say little about real, sustained performance
  20: Because many vendors offer human-shaped robots, so shape adds little value
