iv_safety:
  6: 'WHOLE ROBOT



    A humanoid could cost $50K-$250K to build in 2023. Unitree now lists a complete G1 from $13.5K.'
  7: 'ACTUATORS



    Earlier estimates put actuators above $20K per robot. Morgan Stanley now models $22K with a China supply chain.'
  8: 'HANDS



    Dexterous hands can exceed $70K a pair at low volume. Morgan Stanley models about $15K for an Optimus-style pair.'
  9: 'BATTERY



    Older prototype models put battery systems near $5K. Recent component estimates put a humanoid pack near $275-$417.'
  10: 'COMPUTE



    Prototype AI compute was often modeled around $5K. Recent Optimus-style estimates put compute near $2.1K.'
ed055:
  7: Commercial robots now work inside active car factories and warehouses, on real shifts with paying customers behind them
  10: BMW logged 1,250 hours of Figure 02 work on a live production line, loading more than 90,000 parts over ten months
  13: New designs such as Digit 5 are built for cooperative work near people, with safety systems that replace fixed barriers
  16: New systems swap batteries or charge themselves in minutes, so one robot can now cover most of a working day
  19: Vendors now report paid orders worth hundreds of millions of dollars, and factories built to make thousands of robots
  22: Formal standards for humanoids are now being drafted and issued, including ISO 25785-1 for robots that balance on legs
ed103:
  7: Robots that keep working through long shifts, with few stops, resets or human rescues along the way
  15: Robots that work safely near people, with validated safety functions and predictable behavior on site
ed104:
  7: Less teleoperation, fewer resets and less specialist attention needed on site during every working shift
  10: Robots that connect with the existing lines, conveyors and plant software, with no need to rebuild the site
  15: Hardware and service models that lower the cost of each useful hour worked, such as leasing by the month
