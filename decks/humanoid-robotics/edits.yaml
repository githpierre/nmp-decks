  - There is no official timeline, and another analyst could reasonably pick a few different milestones
ed025:
  note:
  - We kept the milestones that most changed credibility, customer adoption, funding or the rules of the market
  - There is no official timeline, and another analyst could reasonably pick a few different milestones
ed042:
  note:
  - We take each estimate from the firm's current website and compare its scope with our own definition
  - We keep complete humanoid revenue apart from components, software, services, funding and orders
ed052p:
  note:
  - We start from our $1.9B estimate for 2026 and apply a 40% base-case CAGR, about $55B by 2036
  - We anchor that rate in current forecasts of 28.1% to 50.6%, and it needs sales to spread beyond China
