ed142p:
  title: 'What could go wrong

    for humanoid robots?'
  events:
  - odds: 50
    impact: 1
    text: Battery life stays under four hours per charge, limiting humanoids to short shifts and narrow jobs
  - odds: 45
    impact: 3
    text: Unitree and UBTech flood the market with cheap Chinese humanoids that set prices far below Western rivals
  - odds: 40
    impact: 2
    text: US tariffs and export controls on Chinese motors and actuators raise humanoid build costs over 20 percent
  - odds: 35
    impact: 2
    text: Robot foundation models from Google DeepMind and Nvidia stall on dexterity, delaying useful general tasks for years
  - odds: 30
    impact: 3
    text: Pilots at BMW, Mercedes and Amazon fail to show payback, so factories return to fixed industrial arms
  - odds: 25
    impact: 2
    text: Venture funding dries up after several humanoid startups miss delivery targets and cut staff
  - odds: 20
    impact: 3
    text: Tesla Optimus reaches volume production below 30,000 dollars and undercuts startups like Figure and Apptronik
  - odds: 15
    impact: 2
    text: A humanoid injures a worker in a warehouse and OSHA forces new safety rules on deployments
  note:
  - We listed the events that could slow humanoid robots down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and you will find all the sources we used at the end of the report
