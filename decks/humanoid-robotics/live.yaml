ed039p:
  pill: SIGNAL
  signal: google-trends
  raw: true
  window: 5y
  csv: assets/trends/humanoid-robotics/where-to-buy-robots.csv
  term: where to buy robots
  title: 'More and more people look for where to

    buy a robot, now that preorders are open'
  date: Lately.
  expl: Humanoid robots stopped sounding like science fiction. 1X opened preorders for Neo, a home robot at $20,000, Chinese makers like Unitree showed humanoids under $6,000, and robot videos went viral on every feed. For the first time, buying one felt possible, so people started looking for where.
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  y_top: 222
