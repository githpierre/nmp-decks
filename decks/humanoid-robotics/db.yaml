ed160:
  6: General-purpose bipedal humanoids took about 53% of the capital raised since 2024, far ahead of any other type of robot
  7: Only 158 of the 301 rounds since 2024 disclosed an amount, and the median disclosed round was $42M
  8: Chinese startups closed 237 of the 301 rounds and took about 64% of the money, against $4.6B for US startups
  9: 54 rounds of $100M or more made up about 82% of all the capital raised in the market since 2024
  10: Figure’s $1B Series C is the biggest round since 2024, ahead of the $900M raised by XPENG Robotics in 2026
  11: Seed was the most common round, with 136 of the 301 rounds, ahead of Series A with 74 and Series B with 31
  note: We drew these insights from our tracker of 301 humanoid robotics equity rounds announced since January 2024, worth about $16.3B
ed162:
  6: 'BEFORE



    Until 2023, only a handful of startups such as Agility, Figure and 1X raised large rounds, on the promise of robots shown in labs and demo videos.'
  7: 'AFTER



    Since 2024, 301 rounds raised $16.3B. Chinese startups close three rounds in four, while US leaders Figure and Apptronik raise the biggest checks.'
  note: We used our tracker of humanoid robotics equity rounds, complete from January 2024, and company releases and the press
