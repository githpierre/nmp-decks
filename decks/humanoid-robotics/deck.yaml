    28: Battery life, heat and joint wear make continuous multi-shift operation difficult
- id: ed133
  type: x/has_held_back_market_growth
  section: Market challenges
  title: What has held back market growth so far?
  note: We grouped the market into broad phases using commercial deployments, safety standards and recent operating evidence. The phases are subjective but track the shift from research hardware to measured factory work.
  src: 133
  t:
    6: '2017 - 2020


      Humanoids were mostly research machines. High hardware costs, fragile walking and scripted control kept them far from factory economics.'
    7: '2021 - 2023


      Better actuators and AI revived the category, but robots still lacked reliable dexterity, uptime and a clear commercial workflow.'
    8: '2024 - 2025


      Paid pilots reached warehouses and car plants. The bottleneck shifted from basic mobility toward safe integration, reliability and repeatable task performance.'
    9: 'TODAY


      Buyers now ask for uptime, throughput and payback. Safety, batteries, hands and integration still decide whether a pilot scales.'
    10: '2025 - 2026


      Prices fell and deployments expanded, but most sites still used small fleets on narrow material-handling tasks.'
