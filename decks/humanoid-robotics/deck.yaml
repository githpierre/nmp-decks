- id: ed138
  type: x/regulation_evolving
  section: Market challenges
  title: How is regulation evolving?
  note: We mapped the industrial and mobile robot standards most relevant to humanoids. Humanoid-specific safety work is advancing, but site integration and risk assessment still remain operator responsibilities.
  src: 138
  t:
    7: '2011 - 2024


      Factories relied on general industrial-robot and mobile-robot safety standards, not humanoid-specific rules.'
    8: '2025


      ISO 10218 was revised for industrial robots and applications, tightening design and integration duties.'
    9: '2026


      US mobile-robot rules were reaffirmed as ISO advanced draft 25785-1 for stable mobile robots.'
    10: 'TODAY


      Integrators still need site risk reviews, safe limits and proof that the full application is controlled.'
    11: '?


      Humanoid-specific rules will mature, but robots near people will still need site-level safety evidence.'
- id: iv_fda
  type: x/were_key_phases_market_acceleration
  section: Market challenges
  title: What does it take to put a humanoid on a factory floor?
  note: We translated current industrial robot and mobile robot safety practice into five practical deployment gates. Exact approval steps differ by site, country, task and whether people share the workspace.
  src: 147
  t:
    7: 'LAB TESTS


      The maker tests falls, stops and failures. Engineering and safety decide if it can leave the lab.'
    8: 'SITE RISK REVIEW


      The integrator maps hazards against robot safety rules. The plant safety owner approves the controls.'
    9: 'FENCED PILOT


      The robot runs one narrow task with separation. Operations decides if uptime and quality are credible.'
    10: 'OPEN FLEET


      Robots work beside people with validated safeguards. The operator remains responsible for safe use.'
    11: 'PAID PILOT


      The customer measures throughput, interventions and safety. Plant leadership decides whether to scale.'
- id: ed140
  type: x/where_schools_learners_vendors_clash
  section: Market challenges
  title: Where do developers, operators and regulators clash?
  src: 140
  t:
    0: Developers want one robot platform that can learn many factory tasks
    7: Safety teams want proven stops, separation and safe failure behavior
    9: Buyers want payback without rebuilding the whole production line
    10: Workers need safe paths, training and clear robot behavior
    12: Developers want more speed and force to improve productivity
    13: Insurers fear falls, collisions and unclear liability
    18: Investors want pilots to convert quickly into fleet orders
    19: Operators need predictable uptime across long shifts
    21: Customers want flexible robots, but only if throughput stays reliable
    22: Standards bodies want hazards controlled at robot and site level
    24: Vendors want recurring fleet revenue before volumes are proven
    25: Plant teams want maintenance, spare parts and fast recovery
- id: iv_safety
  type: x/pain_points_yesterday_vs_today
  section: Market challenges
  title: How fast is the price of a humanoid falling?
  note: We compared published maker prices and analyst hardware estimates. Figures are not directly identical configurations, but they show how supply chains and design choices are compressing hardware cost.
  src: 54
  t:
    6: 'WHOLE ROBOT



      A humanoid could cost $50K-$250K to build in 2023. Unitree now lists a complete G1 from $13.5K.'
    7: 'ACTUATORS



      Earlier estimates put actuators above $20K per robot. Morgan Stanley now models $22K with a China supply chain.'
    8: 'HANDS



      Dexterous hands can exceed $70K a pair at low volume. Morgan Stanley models about $15K for an Optimus-style pair.'
    9: 'BATTERY



      Older prototype models put battery systems near $5K. Recent component estimates put a humanoid pack near $275-$417.'
    10: 'COMPUTE



      Prototype AI compute was often modeled around $5K. Recent Optimus-style estimates put compute near $2.1K.'
