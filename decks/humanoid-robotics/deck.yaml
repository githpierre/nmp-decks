  src: 174
  t:
    6: '2015 - 2022


      Agility, Apptronik, Unitree and 1X formed the first durable startup cohort. Early robots proved human-form machines could leave the lab.'
    7: '2023 - 2024


      Figure surged, while AgiBot and Galbot emerged in China. BMW, Mercedes-Benz and Amazon-backed tests made factory work the main proving ground.'
    8: '2025


      Capital accelerated sharply. Figure reached $39B, Apptronik raised $415M, and Chinese makers pushed from pilots toward scaled production.'
    9: 'TODAY


      Unitree is public, Apptronik nears $1B raised, and Figure, Agility, UBTECH and Galbot are expanding named deployments.'
    10: '?


      Future winners may pair reliable autonomy with low-cost hardware, high uptime, useful hands and repeatable customer economics across many sites.'
