- id: ed002
  type: x/divider
  src: 2
  t:
    0: 'In this deck, you’ll find numbers, charts, estimates and forecasts. Wherever possible, we’ve included source indications and short notes at the bottom of each slide as well as at the end of this document.


      We want to be upfront about our approach. Markets are rarely perfectly measurable, and any attempt to describe them involves assumptions, judgment calls, and points that can be debated. We’re fully aware of that, and we don’t believe in pulling figures out of thin air.


      Our goal is to do serious, thoughtful work as close to reality as possible, while being transparent about how we get there. That’s why you’ll frequently see footnotes explaining our reasoning, pointing to sources, or clarifying how a number or conclusion was constructed. We aim to give enough detail to make our thinking clear, without drowning you in unnecessary complexity.


      Practically, our process starts with selecting sources we consider credible and authoritative. We rarely rely on a single reference. Instead, we compare multiple independent sources, often linking directly to them, and look for patterns and points of convergence. When several credible sources consistently point in the same direction, that’s where we start to form stronger convictions.'
    1: INTRO
- id: ed003
  type: x/divider_2
  src: 3
  t:
    0: 'Based on those convergences, we sometimes make the effort to quantify what would otherwise remain vague, through percentages, scores, or relative rankings. We’re fully aware that this introduces an element of subjectivity, and we openly acknowledge it. Absolute objectivity doesn’t exist in market analysis, and pretending otherwise would be misleading.


      What matters to us is being honest about the nature of the data we present. When something is directional or indicative rather than precise, we clearly state it. We rely on recent sources, update this deck on a quarterly basis, and continuously revisit our assumptions as new information becomes available.

      If anything feels unclear, debatable, or simply doesn’t make sense to you, we genuinely encourage you to reach out. We’re always happy to explain our reasoning in more detail. Ultimately, our goal is that you come away from this presentation feeling informed, confident in the data you’ve seen, and having learned something useful.

      If you have constructive feedback for us, we’d love to hear it. We also make similar decks about other markets, which you can find {1|on our homepage}. And if you want another one, you can always use the code {2|NEWMARKET} to get 20% off (or {2|NEWMARKETMAX} for 30% off if you get 5+ of them).'
