    odds: 25
    impact: 2
  - text: A patient dies from immune toxicity in an humanoid robotics trial and the FDA halts programs
    odds: 20
    impact: 3
  - text: Lipid nanoparticles reach the liver more than T cells, which limits doses and weakens efficacy
    odds: 20
    impact: 1
