- id: ed210
  left: A REGULAR HUMANOID STARTUP
  logo: figure
  note:
  - We used Figure's BMW deployment, Helix 02, manufacturing and financing disclosures
  - We treated “a regular humanoid startup” as a fictional baseline, shown here only for the contrast
  right: FIGURE
  rows:
  - - They stay in lab demos while customers keep waiting
    - Figure 02 worked daily on an active BMW assembly line
  - - They show short tasks with resets between each step
    - Helix 02 ran a four-minute kitchen task with no reset
  - - They collect little evidence from real production lines
    - Figure 02 logged more than 1,250 working hours at BMW
  - - They build their prototypes by hand, one unit at a time
    - BotQ took Figure 03 output from one a day to one an hour
  - - They wait years before manufacturing at volume
    - Figure delivered over 350 Figure 03 robots by April 2026
  - - They depend on one narrow, repeated factory movement
    - Figure 03 moved from sheet loading to parts sequencing
  - - They train only on carefully staged robot lab data
    - Figure added human video and multimodal data collection
  - - They stay valued like an early robotics experiment
    - Figure raised over $1 billion at a $39 billion valuation
  section: Startup strategies
  src: 210
  title: How Figure turned factory proof into a $39B valuation
  type: contrast
  logo_src: ../../assets/logos/lib/figure-ai.png
- id: ed211
  left: A REGULAR HUMANOID STARTUP
  logo: apptronik
  note:
  - We used Apptronik's financing disclosures and its industrial agreements with Mercedes-Benz and Jabil
  - We treated “a regular humanoid startup” as a fictional baseline, shown here only for the contrast
  right: APPTRONIK
  rows:
  - - They design a robot before finding where it will work
    - Apptronik built Apollo around warehouse and factory tasks
  - - They test their robots only inside their own robotics lab
    - Mercedes-Benz brought Apollo into its car factories
  - - They outsource manufacturing with no feedback loop
    - Jabil agreed to build Apollo and use it in its own plants
  - - They depend on a single customer to prove the product
    - Apptronik also works with Mercedes-Benz and GXO
  - - They raise small rounds between hardware versions
    - Apptronik's Series A grew to more than $935 million
  - - They rely only on purely financial venture investors
    - Google, Mercedes-Benz and John Deere joined its rounds
  - - They plan scale before securing factory know-how
    - Jabil brought engineering, production and supply chains
  - - They keep their sales separate from robot production
    - Apptronik uses its factory sites as deployment sites
  section: Startup strategies
  src: 211
  title: How Apptronik tied Apollo to industrial partners
  type: contrast
  logo_src: ../../assets/logos/lib/apptronik.png
- id: ed212
  left: A REGULAR HUMANOID STARTUP
  logo: agility
  note:
  - We used Agility's own news on its GXO deployment, Digit 5 orders and Nasdaq listing
  - We treated “a regular humanoid startup” as a fictional baseline, for the contrast only
  right: AGILITY ROBOTICS
  rows:
  - - They optimize for flashy video demonstrations first
    - Agility built Digit around repetitive material handling
  - - They leave customer pilots after only a few weeks
    - Digit logged more than 65,000 hours at customer sites
  - - They need long charging stops between short shifts
    - Digit 5 works 90 minutes after a nine-minute charge
  - - They keep payloads too low for common industrial loads
    - Digit 5 is designed to lift loads of up to 50 pounds
  - - They isolate robots behind permanent safety barriers
    - Digit 5 is designed for cooperative work near people
  - - They build their robots without a dedicated factory
    - RoboFab is designed to build up to 10,000 robots a year
  - - They rely on pilots with no contracted follow-on demand
    - Agility disclosed more than $300 million in Digit 5 orders
  - - They stay private while scaling factory infrastructure
    - Agility began trading on Nasdaq as AGLT in November 2026
  section: Startup strategies
  src: 212
  title: How Agility turned warehouse work into public-market scale
  type: contrast
  logo_src: ../../assets/logos/lib/agility-robotics.png
- id: ed213
  left: A REGULAR HUMANOID STARTUP
  logo: unitree
  note:
  - We used Unitree's product pages, its 2025 shipment figure and its IPO filings
  - We treated “a regular humanoid startup” as a fictional baseline, for the contrast only
  right: UNITREE
  rows:
  - - They price a research humanoid like special machinery
    - Unitree lists its full G1 humanoid from just $13,500
  - - They make buyers request a quote before any trial
    - The standard G1 can be bought in Unitree's online store
  - - They build only a handful of robots for demonstrations
    - Unitree says it delivered over 5,500 humanoids in 2025
  - - They depend on one single premium full-size platform
    - Unitree sells several humanoid models at different prices
  - - They hide basic hardware specifications from developers
    - G1 publishes its sensors, battery life and joint setup
  - - They need a large body to offer a developer platform
    - G1 packs a full humanoid body into about 35 kilograms
  - - They stay private while funding scale from venture rounds
    - Unitree raised capital through a Shanghai public listing
  - - They burn cash while waiting for humanoids to mature
    - Unitree reported a profit in its 2025 prospectus period
  section: Startup strategies
  src: 213
  title: How Unitree made humanoids cheap enough to ship by the thousands
  type: contrast
  logo_src: ../../assets/logos/unitree-robotics.png
- id: ed214
  left: A REGULAR HUMANOID STARTUP
  logo: 1x
  note:
  - We used 1X's NEO launch, its order page, its factory update and product pages
  - We treated “a regular humanoid startup” as a fictional baseline, for the contrast only
  right: 1X
  rows:
  - - They start in factories because homes are too messy
    - 1X designed NEO specifically for everyday work at home
  - - They expose hard metal surfaces around the people
    - NEO uses a soft body over its mechanical structure
  - - They make a heavy robot that is hard to move safely
    - NEO weighs about 66 pounds, light enough for a home
  - - They wait for full autonomy before selling anything
    - 1X sells early access while its autonomy keeps improving
  - - They hide human assistance behind an autonomy claim
    - 1X openly offers scheduled remote supervision by experts
  - - They sell only through long enterprise pilot contracts
    - Consumers can reserve NEO directly on the 1X website
  - - They require a six-figure budget to own one robot
    - NEO early access ownership is listed at only $20,000
  - - They build production before testing consumer demand
    - 1X booked 10,000 units of production in only five days
  section: Startup strategies
  src: 214
  title: How 1X turned home humanoids into a 10,000-unit preorder book
  type: contrast
  logo_src: ../../assets/logos/lib/1x.png
