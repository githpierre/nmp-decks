- id: ed055
  type: x/old_problems_now_behind_us
  section: Pain points
  title: Which old problems are now behind us?
  note: We treat these as barriers that have materially improved, not as fully solved problems. The remaining challenge is dependable performance across more tasks and sites.
  src: 55
  t:
    5: Humanoids were mostly research machines with little evidence of useful live work
    7: Commercial robots now work inside active car factories and warehouses, on real shifts with paying customers behind them
    8: Buyers had little proof that humanoids could repeat one job for long periods
    10: BMW logged 1,250 hours of Figure 02 work on a live production line, loading more than 90,000 parts over ten months
    11: Early robots often needed fenced cells or close supervision to stay safe
    13: New designs such as Digit 5 are built for cooperative work near people, with safety systems that replace fixed barriers
    14: Battery charging made sustained multi-shift operation difficult to justify
    16: New systems swap batteries or charge themselves in minutes, so one robot can now cover most of a working day
    17: Commercial humanoid orders and production capacity were mostly theoretical
    19: Vendors now report paid orders worth hundreds of millions of dollars, and factories built to make thousands of robots
    20: Humanoids had few standardized ways to prove capability and safety
    22: Formal standards for humanoids are now being drafted and issued, including ISO 25785-1 for robots that balance on legs
