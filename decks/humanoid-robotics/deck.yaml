  src: 108
  t:
    5: HEAVY-DUTY INDUSTRIAL SUPERHUMANOIDS
    6: The robot lifts a dramatic demo load but is slow, hard to service and unsafe near normal operations. Noise, heat and upkeep pile up and precision drops under load, so the customer still needs cranes, fixtures and people.
    7: The robot handles heavy loads for hours, stays stable under force and works in areas that are tiring or risky for people. Payload, useful reach and safe control let customers remove strenuous manual steps without installing a custom machine for every task.
