rows:
- name: 'BMW, Figure 02

    in Leipzig'
  why: BMW’s own report on its humanoid pilot, with hours and parts counted on a live line
  how: We used it for the 1,250 hours and 90,000 parts. It also anchored our view of real deployments.
  url: https://www.bmwgroup.com/en/news/general/2026/humanoid-robot-in-leipzig.html
- name: 'Figure, production

    at BMW'
  why: Figure’s own account of its 11 months on BMW’s assembly line
  how: We used it for the shift length and runtime. It also backed our contrast slide on Figure.
  url: https://www.figure.ai/news/production-at-bmw
- name: 'Agility,

    Digit 5 launch'
  why: Agility’s own launch note, written after three years of customer use
  how: We used it for payload, charging and safety. It also gave us the 65,000 hours of work.
  url: https://www.agilityrobotics.com/content/agility-unveils-digit-5-humanoid-robot-built-for-cooperatively-safe-work-at-scale
- name: 'GXO, Digit

    expansion'
  why: GXO’s own release, as the customer that pays for the robots
  how: We used it for the 100,000 totes and the two new sites. It also dated the first paid deal.
  url: https://investors.gxo.com/news-releases/news-release-details/gxo-and-agility-robotics-expand-partnership-accelerate
- name: 'Apptronik,

    Series A'
  why: Apptronik’s own announcement of its round and its partners
  how: We used it for the $935M Series A. It also named Mercedes-Benz, GXO and Jabil.
  url: https://apptronik.com/news-collection/apptronik-closes-over-935-million-series-a
- name: 'Figure,

    Series C'
  why: Figure’s own announcement, with the amount and the valuation
  how: We used it for the $39B valuation. It also showed how fast money moved into the market.
  url: https://www.figure.ai/news/series-c
- name: 'Figure 03

    at BMW'
  why: Figure’s own note on its second BMW use case
  how: We used it for parts sequencing. It also showed how tasks are getting harder.
  url: https://www.figure.ai/news/f-03-at-bmw
- name: 'Figure,

    Helix 02'
  why: Figure’s own technical note on its robot AI model
  how: We used it for whole-body control. It also helped us explain robot brains.
  url: https://www.figure.ai/news/helix-02
- name: 'Figure, Figure 03

    production ramp'
  why: Figure’s own update on its BotQ factory output
  how: We used it for one robot an hour and 350 robots delivered. It also shaped our scale slides.
  url: https://www.figure.ai/news/ramping-figure-03-production
- name: 'Unitree,

    G1 product page'
  why: Unitree’s own price list, the cheapest full humanoid on sale
  how: We used it for the $13,500 price. It also anchored our price ranges.
  url: https://www.unitree.com/g1
- name: '1X, NEO

    home robot launch'
  why: 1X’s own launch note for the first home humanoid on preorder
  how: We used it for the $20,000 price and the home use case.
  url: https://www.1x.tech/discover/neo-home-robot
- name: 'Boston Dynamics,

    production Atlas'
  why: Boston Dynamics’ own launch of its production robot
  how: We used it for the Hyundai and DeepMind fleets. It also dated the move to production.
  url: https://bostondynamics.com/blog/boston-dynamics-unveils-new-atlas-robot-to-revolutionize-industry
- name: 'AGIBOT,

    10,000th robot'
  why: AGIBOT’s own milestone release, from China’s largest maker by volume
  how: We used it for China’s production scale. It also backed our leader slides.
  url: https://www.agibot.com/article/231/detail/53.html
- name: 'SAG, humanoid

    shipments Q3 2026'
  why: An industry tracker that counts shipments by maker every quarter
  how: We used it for the 54,000 robots expected in 2026. It is the base of our market size.
  url: https://smartanalyticsglobal.com/global-humanoid-robot-shipments-q3-2026-agibot-ubtech-unitree
- name: 'Agility,

    S-1 filing'
  why: Agility’s filing with the SEC, written under legal liability
  how: We used it for its losses and risks. It also gave us the Digit 5 timing.
  url: https://www.sec.gov/Archives/edgar/data/2074973/000121390026118025/ea0311220-s1_agility.htm
- name: 'ISO 25785-1,

    mobile robot safety'
  why: The draft standard for robots that balance, such as bipeds
  how: We used it for the regulation slides. It also showed what is still missing.
  url: https://www.iso.org/standard/91469.html
- name: 'Capgemini, Physical

    AI report'
  why: A survey of large buyers on what holds back robots
  how: We used it for adoption barriers. It also shaped the risks we rated.
  url: https://www.capgemini.com/wp-content/uploads/2026/05/CRI_Physical-AI-Report-Final-web-version-2.pdf
- name: 'Bank of America,

    Physical AI part 2'
  why: A bank research note on humanoid reliability and costs
  how: We used it for uptime and upkeep limits. It also checked our structural constraints.
  url: https://institute.bankofamerica.com/content/dam/transformation/physical-ai-part-2.pdf
- name: 'Grand View,

    humanoid market'
  why: A market research firm with a yearly humanoid report
  how: We used it for one of the size estimates. It also framed the regional split.
  url: https://www.grandviewresearch.com/industry-analysis/humanoid-robot-market-report
- name: 'Our humanoid

    funding tracker'
  why: Our own database of every equity round since January 2024, each with its source
  how: We used it for all the funding slides. It also counted rounds by country and stage.
  url: ''
