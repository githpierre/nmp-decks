ed148p:
  title: 'What pushed the bispecific antibody

    market forward, year after year?'
  events:
  - year: '1960'
    text: Two target antibodies become feasible
    impact: 0.5
  - year: '1975'
    text: Hybridomas scale antibody discovery
    impact: 1.0
  - year: '1983'
    text: Quadroma methods create bispecific antibodies
    impact: 1.0
  - year: '1990'
    text: Recombinant formats improve antibody control
    impact: 1.0
  - year: '1996'
    text: Knobs into holes improves pairing
    impact: 1.0
  - year: '2005'
    text: BiTE design sharpens T cell redirection
    impact: 1.5
  - year: '2009'
    text: Catumaxomab proves regulatory path
    impact: 2.5
  - year: '2013'
    text: Catumaxomab withdrawal exposes design limits
    impact: 1.0
  - year: '2014'
    text: Blincyto validates CD3 T cell engagers
    impact: 3.0
  - year: '2017'
    text: Hemlibra expands bispecifics beyond cancer
    impact: 2.0
  - year: '2018'
    text: CrossMab engineering broadens format choices
    impact: 1.0
  - year: '2019'
    text: Large pharma expands bispecific pipelines
    impact: 1.0
  - year: '2020'
    text: More trials accelerate bispecific learning
    impact: 1.0
  - year: '2021'
    text: Rybrevant validates dual tumor targeting
    impact: 2.0
  - year: '2022'
    text: Vabysmo proves chronic disease utility
    impact: 1.5
  - year: '2022'
    text: Teclistamab opens BCMA bispecific demand
    impact: 2.5
  - year: '2022'
    text: Mosunetuzumab expands lymphoma competition
    impact: 1.5
  - year: '2022'
    text: Cadonilimab validates China innovation
    impact: 1.0
  - year: '2023'
    text: Epcoritamab enables subcutaneous delivery
    impact: 1.5
  - year: '2023'
    text: Glofitamab deepens lymphoma adoption
    impact: 1.5
  - year: '2023'
    text: Elranatamab expands BCMA treatment choice
    impact: 1.0
  - year: '2023'
    text: Talquetamab validates a new myeloma target
    impact: 1.5
  - year: '2024'
    text: Tarlatamab reaches small cell lung cancer
    impact: 2.0
  - year: '2024'
    text: Zanidatamab validates biparatopic HER2
    impact: 1.5
  - year: '2024'
    text: Zenocutuzumab targets rare fusion cancers
    impact: 1.0
  - year: '2025'
    text: Linvoseltamab extends BCMA competition
    impact: 1.0
  - year: '2025'
    text: China approvals broaden global competition
    impact: 1.0
  - year: '2026'
    text: Silevimig opens infectious disease use
    impact: 1.5
  - year: '2026'
    text: Masked HER2 engager enters China clinic
    impact: 1.0
  - year: '2026'
    text: 4 1BB bispecific reaches NDA review
    impact: 2.0
  note:
  - We kept the events we believe pushed bispecific antibody forward the most
  - Ratings are our estimates, with all the sources at the end of the report
