ed007p:
  type: pp_radar
  title: 'Who Is in bispecific antibody,

    and who stays outside?'
  TL:
    name: Legend Biotech
    src: ../../assets/logos/pp_live/bispecific-antibody/s01-00.png
    text: builds CAR-T cell therapies rather than soluble bispecific antibodies, despite targeting similar cancer antigens
  TR:
    name: Illumina
    src: ../../assets/logos/pp_live/bispecific-antibody/s01-02.png
    text: supplies sequencing systems to drug developers but does not develop therapeutic bispecific antibody medicines
  BL:
    name: Roche
    src: ../../assets/logos/pp_live/bispecific-antibody/s01-09.png
    text: markets bispecific antibodies in oncology and hematology, but its broader business spans many drug modalities
  BR:
    name: Regeneron
    src: ../../assets/logos/pp_live/bispecific-antibody/s01-10.png
    text: large pharma with a major bispecific pipeline, while most revenue still comes from other antibody franchises
  caption:
  - Distance to the center reflects how central each company is to bispecific antibody
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
