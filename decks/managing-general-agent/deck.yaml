  type: x/have_been_different_waves_hot
  section: Top players
  title: What have been the different waves of ‘hot’ startups over time?
  note: We use company funding, launches and insurer deals to date the shifts. The stages are a simplified history, not fixed generations.
  src: 174
  t:
    6: '2016 - 2020


      Coalition, At-Bay and Zego took cyber and motor insurance online. Investors funded risk data and policy tools instead of simple web quotes.'
    7: '2021 - 2022


      Coalition and At-Bay crossed $1B in private value. New specialty MGAs used data to select risks while insurers still carried them.'
    8: '2023 - 2024


      Ominimo began motor pricing and Stand entered home cover. New MGAs targeted hard risks, not only faster online quotes.'
    9: '2025 - 2026


      Munich Re agreed to buy At-Bay. Allianz backed Coalition. Stand and Ominimo each reached a value of $1B or more.'
    10: '?


      Next, MGAs must show that their risk scores cut claims, not just quote times. Loss data and renewed carrier deals will test which models scale.'
