- id: ed027
  type: x/when_did_market_become_real
  section: Market opportunity
  title: When did the MGA market become real?
  note: We use the 1989 adoption of a US model law as a clear marker of formal recognition. Delegated underwriting existed long before it.
  src: 27
  t:
    8: Before that, delegated underwriters could already bind policies for insurers. The model had long been used at Lloyd's.
    12: In 1989, US insurance regulators adopted a model law for managing general agents, giving the role formal rules.
    13: '1989'
- id: ed028
  type: x/when_did_become_hot
  section: Market opportunity
  title: When did it become hot?
  note: We picked 2025 for the combination of verified market scale and Neptune’s stock market debut, not premium growth alone.
  src: 28
  t:
    6: In 2025, Conning reported $114B of US MGA premium for 2024, and flood MGA Neptune went public.
    7: '2025'
    12: Before that, MGA premium was rising fast, but the channel had few public pure-play examples for investors.
- id: ed029
  type: x/happened_between
  section: Market opportunity
  title: What happened in-between?
  src: 29
  t:
    5: 1989 - 2011
    6: US regulators set an MGA model law in 1989. It gave states a template for oversight of firms that price and bind policies using an insurer's authority.
    7: 2012 - 2019
    8: Conning tracked $25B of US MGA premium in 2012 and $44B in 2019 in insurer filings. More carriers used specialist teams for tough risks.
    9: 2020 - 2022
    10: Reported US MGA premium rose from $46B in 2020 to $71B in 2022. With Lloyd's-backed business added, Conning put the 2022 market above $85B.
    11: 2023 - 2024
    12: By 2024, Conning put the wider US MGA channel at $114B, 16% above 2023. Independent firms had passed carrier-owned MGAs in market share.
    13: 🏛️
    14: 💰
    15: 📈
    16: 🛡️
- id: ed030
  type: x/happened_since_then
  section: Market opportunity
  title: And what happened since then?
  src: 30
  t:
    5: Early 2025
    6: Ryan Specialty bought Velocity Risk Underwriters in February and added USQRisk and 360° Underwriting in May, showing demand for niche risk skills.
    7: '2025'
