- id: ed132
  type: x/newcomers_often_miss_here
  section: Market challenges
  title: What do newcomers often miss here?
  note: We used insurer reporting, carrier rules and recent MGA market studies to isolate risks that new entrants often underestimate.
  src: 132
  t:
    17: MGAs set prices and sell coverage, but insurers carry claims and control the paper
    21: Insurers may pull binding power after poor losses, even as sales keep growing
    23: Storm exposure, weak data and reinsurance gaps can ruin a popular product
    25: Fast premium growth says little about claim losses or whether capacity will renew
    28: A binding deal allows sales but sets strict limits, data duties and audit rights
- id: ed133
  type: x/has_held_back_market_growth
  section: Market challenges
  title: What has held back market growth so far?
  note: We grouped the market into broad phases using Conning, AM Best, Lloyd’s and market disclosures. The phase boundaries are editorial judgments.
  src: 133
  t:
    6: '2017 - 2020


      Specialist MGAs existed, but getting insurer backing, broker reach and usable policy systems made new programs hard to launch at scale.'
    7: '2021 - 2023


      Specialty demand opened new doors, but costly reinsurance and the Vesttoo collateral scandal exposed hidden fragility.'
    8: '2024 - 2025


      MGA premiums expanded quickly, but insurers began asking for clearer loss results, cleaner data and proof that new lines could make money.'
    9: 'TODAY


      Capacity exists for solid programs, but soft rates, higher costs and stricter audits favor steady profit over volume.'
    10: '2025 - 2026


      Carriers added programs but grew more selective. Pricing discipline and clear claims data became vital.'
