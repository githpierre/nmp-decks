- id: ed017
  type: maturity
  section: Market definition
  title: How mature is the MGA market?
  score: 70
  text: The market is real because US MGAs wrote over $100B of premium in 2025, insurers rely on them for specialty risks and two of them listed in 2025. The score stays below 80 because capacity can be pulled after one bad year and soft prices now squeeze margins.
  note:
  - We rate market maturity with an internal score of premium size, growth, listed players and access to capacity.
  - We set 70/100 because the model is decades old, but most tech-led MGAs have under five years of loss results.
  src: 17
