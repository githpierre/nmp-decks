  - d: SINCE 2026
    t: Stand raised $70M at a $1B value in October, after the value of homes it insures in wildfire and storm zones grew from $1B to more than $10B in a year.
  note:
  - We kept the milestones that most changed premium, capacity or funding for MGAs. There is
