  note: We grouped the market into phases, from niche agents working for Lloyd's to listed tech-led MGAs. We used rating agency studies, Lloyd's statements and company releases.
  src: 54
  t:
    6: '1990 - 2010


      MGAs grew as niche agents for odd risks and Lloyd''s, but insurers saw them as hard to control and far from the data'
    7: '2011 - 2019


      Cyber and tech MGAs appeared with their own software, but capacity was short and insurers doubted results with no history'
    8: '2020 - 2023


      High prices and insurtech money made MGAs grow fast, but the Vesttoo fraud of 2023 showed how fragile their capacity backing was'
    9: 'TODAY


      US MGAs write over $100B a year and two are listed, but prices are softening and insurers check every loss ratio more closely'
    10: '?


      AI underwriting could let small teams price many more risks well, but only years of loss results will prove that it works'
