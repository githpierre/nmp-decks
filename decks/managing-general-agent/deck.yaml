- id: ed023
  type: x/learning_truths_have_flipped
  section: Market definition
  title: Which MGA truths have flipped?
  note: These are market shifts we see in rating agency studies, company releases and deals. They are not formal industry rules, but they come back across the evidence.
  src: 23
  t:
    6: MGAs used to be seen as small agents on the side of insurers
    8: Now US MGAs wrote $103B of filed premium in 2025, up 12% in one year
    10: Insurers used to keep most underwriting in-house
    12: Now 45% of Lloyd's premium is written under delegated authority
    14: Insurtech MGAs used to stay small and in one state
    16: Now Ledgebrook, Nirvana and Stand are each valued at $1B or more
    18: MGAs used to rely mostly on Lloyd's and big insurers
    20: Now fronting carriers wrote over $22B of premium in 2025, up 17%
    22: MGA owners used to sell only to brokers or insurers
    24: Now Accelerant and Neptune listed on the New York Stock Exchange
    26: MGAs used to be built only by veteran underwriters
    28: Now Ledgebrook has 50 engineers next to 80 underwriters, out of 300 staff
- id: ed024
  type: dated
  section: Market definition
  title: What has changed (very) recently?
  page: 1/2
  items:
  - d: SINCE 2024
    t: Travelers closed its purchase of the cyber MGA Corvus, one of the first big buys of a tech-led MGA by a large insurer, and kept the Corvus brand for small firms.
  - d: SINCE 2025
    t: Lloyd's said delegated authority made up just under 40% of its business and warned that coverholders who are not managed well would lose their freedom to write.
  - d: SINCE 2025
    t: Conning found that US MGA premium grew 16% in 2024 to $114B, against about 10% for the whole property and casualty market, a sixth year of fast growth.
  - d: SINCE 2025
    t: Accelerant, a risk exchange that links specialty underwriters with insurers and reinsurers, raised $724M in its New York Stock Exchange listing in July.
  - d: SINCE 2025
    t: Neptune, a flood insurance MGA from Florida, listed on the New York Stock Exchange in October, and its shares jumped 24% on the first day of trading.
  - d: SINCE 2025
    t: Nirvana Insurance raised $100M in December at a $1.5B value, nearly double its previous one, to insure trucking fleets from the data of their vehicles.
  note:
  - We kept the milestones that most changed premium, capacity or funding for MGAs. There is
  - no official timeline, and another analyst could pick a few different milestones here
  src: 24
- id: ed025
  type: dated
  section: Market definition
  title: What has changed (very) recently?
  page: 2/2
  items:
  - d: SINCE 2026
    t: AM Best counted $109B of premium written by MGAs in 2025, up 17.8% and a fifth year in a row of double-digit growth, but it warned that capacity checks are tightening.
  - d: SINCE 2026
    t: Six Lloyd's syndicates took a combined 15% share of Ryan Specialty's delegated book in July, as Lloyd's pushes group deals to back MGAs at scale.
  - d: SINCE 2026
    t: Conning put total US MGA premium near $128B for 2025, with filed premium up 12%, more than twice the growth of the property and casualty market.
  - d: SINCE 2026
