- id: ed014
  type: cards
  section: Market definition
  title: When and where is value created in the market?
  items:
  - e: 🎯
    t: When an MGA prices a risk that big insurers find too small or too odd to study
  - e: ⏱️
    t: When a broker gets a firm price in minutes instead of waiting days for an insurer
  - e: 📊
    t: When better data keeps the loss ratio low, year after year, through the cycle
  - e: 🤝
    t: When an insurer renews its capacity for several years on good loss results
  - e: 🛡️
    t: When cyber or home cover comes with prevention that cuts the number of claims
  - e: 💰
    t: When the MGA earns a profit share on top of its commission on each policy
  - e: 🌍
    t: When one program is copied to new states or countries with the same backer
  - e: 🔁
    t: When claims data flows back into prices before the next renewal season starts
  src: 14
