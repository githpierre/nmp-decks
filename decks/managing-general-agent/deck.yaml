- id: ed138
  type: x/regulation_evolving
  section: Market challenges
  title: How is regulation evolving?
  note: We used state MGA law and Lloyd’s guidance. Requirements vary by location and by whether a firm uses Lloyd’s or other insurer capacity.
  src: 138
  t:
    7: '2017 - 2023


      MGA laws required producer licenses and carrier contracts. Lloyd’s used approvals and audits.'
    8: '2024 - 2025


      Lloyd’s required naming the lead insurer on policies. Carrier reporting demands also grew.'
    9: '2026


      Lloyd’s refreshed rules for key staff, ownership, layered contracts and ongoing oversight.'
    10: 'TODAY


      MGAs need local licenses, clear insurer backing and timely reports on policies, premiums and claims.'
    11: '?


      Rules may grow stricter as MGAs expand, but insurers remain responsible for delegated work.'
- id: iv_fda
  type: x/were_key_phases_market_acceleration
  section: Market challenges
  title: What does it take to launch an MGA program?
  note: We mapped a US-oriented launch using state licensing and Lloyd’s delegation requirements. Durations are illustrative planning ranges, not mandated deadlines.
  src: 147
  t:
    7: 'IDEA AND PRICE


      The MGA designs coverage and prices for 1 to 3 months. An insurer decides if risks fit.'
    8: 'LICENSE AND TEAM


      The MGA seeks licenses and hires staff over 1 to 3 months. State officials approve licenses.'
    9: 'CAPACITY DEAL


      Over 3 to 6 months, a carrier and reinsurers assess the plan and decide whether to back it.'
    10: 'AUDIT AND RENEW


      After launch, the carrier reviews claims and controls over 6 to 12 months before renewal.'
    11: 'BIND AND SELL


      In 1 to 2 months, the insurer signs the binding contract and checks systems before sales.'
- id: ed140
  type: x/where_schools_learners_vendors_clash
  section: Market challenges
  title: Where do MGAs, insurers and brokers clash?
  src: 140
  t:
    0: MGAs want freedom to price new niches and bind policies fast
    7: Insurers want tight underwriting rules and steady loss ratios
    9: MGAs must keep rates high enough to cover losses and costs
    10: Brokers seek winning quotes and worthwhile commissions
    12: MGAs want fewer repeated audits across many carrier deals
    13: Regulators want timely reports and fair buyer value
