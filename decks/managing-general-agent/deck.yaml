    22: Reinsurers want a clear picture of risk and secure collateral
    24: MGAs want simple systems that speed sales, not extra admin
    25: Insurers want clean files and checks on delegated work
- id: iv_safety
  type: x/pain_points_yesterday_vs_today
  section: Market challenges
  title: What could go wrong for MGAs?
  note: We selected reported cases and quantified market events. Some losses hit insurers directly, but can still threaten MGA renewals and commissions.
  src: 54
  t:
    6: 'LOST BACKING



      AM Best says insurers now seek steadier loss ratios. A weak renewal can leave an MGA unable to write new policies.'
    7: 'FRAUD RISK



      Vesttoo-linked letters of credit left Buckle and Gateway claiming almost $10M in missing reinsurance security.'
    8: 'DISASTER YEAR



      Los Angeles wildfires alone caused about $40B of insured losses in 2025, a shock for exposed property programs.'
    9: 'RATES FALL



      Amwins says greater competition and softer property prices are squeezing margins for programs that must still pay claims.'
    10: 'DATA BREACH



      AssuranceAmerica MGA said attackers got policyholder files in March 2026, showing the cost of weak data security.'
