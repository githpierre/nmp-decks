- id: ed210
  left: A TYPICAL FLOOD MGA
  logo: Neptune Insurance
  note:
  - We used the company and carrier disclosures to show eight documented differences in its model and results.
  - We used a fictional typical MGA only to clarify the contrast. It is not a measured market average.
  right: NEPTUNE INSURANCE
  rows:
  - - They rely on long phone calls to rate a flood policy
    - Neptune built AI models to price each property in real time
  - - They choose flood risks mainly from broad postal zones
    - Neptune assesses individual properties and portfolio mix
  - - They put insured storm losses on their own balance sheet
    - Neptune says its carrier partners take the insurance risk
  - - They work with only one carrier to support the whole book
    - Neptune had 45 capacity providers across its programs
  - - They struggle to adapt one product to different buyers
    - Neptune had eight programs and eleven products in 2026
  - - They tout sales but never state insurer loss results
    - Neptune reported a 19.5% lifetime written loss ratio
  - - They grow volumes without showing profits to owners
    - Neptune reported $37M in net income during 2025
  - - They stay private without a public price for the shares
    - Neptune listed on the NYSE at a $20 offering price
  section: Startup strategies
  src: 210
  title: How Neptune made flood underwriting scalable
  type: contrast
  logo_src: ../../assets/logos/fav/neptune-insurance.png
- id: ed211
  left: A TYPICAL CYBER MGA
  logo: Coalition
  note:
  - We used the company and carrier disclosures to show eight documented differences in its model and results.
  - We used a fictional typical MGA only to clarify the contrast. It is not a measured market average.
  right: COALITION
  rows:
  - - They assess cyber risk only when the policy renews
    - Coalition scans digital risks all through the policy term
  - - They wait for a breach before contacting the customer
    - Coalition sends alerts when it detects exposed systems
  - - They price firms from static forms with dated answers
    - Coalition uses live web signals and its own claims data
  - - They pass every cyber issue to outside IT providers
    - Coalition offers direct access to its security experts
  - - They only pay claims after attackers take the money
    - Coalition recovered $22M in stolen funds during 2025
  - - They quote gross premium while losses may worsen
    - Coalition said average claim size fell 19% in 2025
  - - They leave clients to cover most losses from a claim
    - Coalition said 64% of closed claims cost clients nothing
  - - They struggle to find a partner to enter larger deals
    - Allianz chose Coalition for its global cyber business
  section: Startup strategies
  src: 211
  title: How Coalition made cyber insurance more active
  type: contrast
  logo_src: media/ini/coalition.png
