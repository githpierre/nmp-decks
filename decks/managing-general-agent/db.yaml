ed160:
  6: Specialty commercial took about 31% of the capital raised since 2024, ahead of home and property with about 21%
  7: 50 of the 55 rounds since 2024 disclosed an amount, and the median disclosed round was $27M
  8: US startups closed 43 of the 55 rounds and took $1.5B, about 86% of all the money raised since 2024
  9: 3 rounds of $100M or more made up about 24% of all the capital raised in the market since 2024
  10: The $200M round of Ledgebrook in 2026 is the biggest since 2024, ahead of Openly with $123M in 2025
  11: Series B was the most common round, with 12 of the 55 rounds, while seed rounds were only 6 of them
  note: We drew these insights from our tracker of 55 MGA equity rounds announced since January 2024, worth about $1.8B
ed162:
  6: 'BEFORE



    Before 2024, most insurtech MGAs raised money on fast premium growth, and many lost their capacity when losses came in above plan.'
  7: 'AFTER



    Since 2024, 55 rounds raised $1.8B. Specialty commercial takes the biggest share, led by Ledgebrook, and investors now ask for loss results.'
  note: We used our tracker of MGA equity rounds, complete from January 2024, and company releases and the press
