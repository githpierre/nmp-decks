ed007p:
  type: pp_radar
  title: 'Which companies really belong

    in managing general agent (MGA)?'
  TL:
    name: Policygenius
    src: ../../assets/logos/pp_live/managing-general-agent/s01-00.png
    text: distributes insurance to consumers, but it is a broker marketplace without delegated underwriting authority
  TR:
    name: State Farm
    src: ../../assets/logos/pp_live/managing-general-agent/s01-02.png
    text: is a carrier taking insurance risk on its own balance sheet, not a delegated-authority MGA
  BL:
    name: Tint
    src: ../../assets/logos/pp_live/managing-general-agent/s01-09.png
    text: structures embedded insurance programs, while its platform also acts as infrastructure for distribution partners
  BR:
    name: Boost
    src: ../../assets/logos/pp_live/managing-general-agent/s01-10.png
    text: supplies embedded insurance infrastructure and programs, with MGA functions alongside broader insurance technology
  caption:
  - Distance to the center reflects how central each company is to managing general agent (MGA)
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
