ed142p:
  title: 'What are the biggest

    threats to the MGA market?'
  events:
  - odds: 60
    impact: 2
    text: Capacity becomes selective on loss-ratio stability, starving newer MGAs that lack credible multi-year underwriting data
  - odds: 55
    impact: 2
    text: Softening specialty prices continue, squeezing underwriting margins and making carriers less willing to fund rapid MGA growth
  - odds: 45
    impact: 3
    text: A severe US catastrophe year drives MGA loss ratios above carrier targets, causing capacity providers to cut delegated limits
  - odds: 45
    impact: 2
    text: Regulators tighten delegated-authority oversight after rapid MGA growth, increasing audits, reporting and compliance costs
  - odds: 40
    impact: 2
    text: Broker-owned facilities concentrate distribution, leaving independent MGAs with less access to premium and carrier capacity
  - odds: 35
    impact: 2
    text: Carriers rebuild specialty teams and reclaim profitable niches, reducing the underwriting authority delegated to MGAs
  - odds: 35
    impact: 2
    text: Cyber claims rise faster than pricing, causing reinsurers to reduce support for technology-led cyber MGAs and programs
  - odds: 30
    impact: 3
    text: Another Vesttoo-style collateral fraud hits fronting carriers, prompting stricter reinsurance checks and slower launches
  note:
  - We listed the events that could slow MGA down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all our sources are listed at the end of the report
