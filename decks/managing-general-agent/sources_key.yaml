rows:
- name: "Conning, US MGA\nmarket 2026 study"
  why: Conning's yearly study of the US MGA market, built on the premium insurers file with regulators
  how: We used it for the $128B total and the 12% growth of 2025. It also anchored our market size.
  url: https://www.conning.com/about-us/news/ir-pr---mga-2026
- name: "AM Best, MGA\nmarket segment report"
  why: The rating agency's yearly report on MGAs and other firms with delegated authority
  how: We used it for the $109B of 2025 premium and the tighter capacity. It also backed the risk slides.
  url: https://news.ambest.com/pr/PressContent.aspx?altsrc=2&refnum=37486
- name: "Conning, US MGA\nmarket 2025 study"
  why: Conning's earlier study, with the US MGA premium of 2024 and its growth over ten years
  how: We used it for the $114B of 2024 and the past trend. It also dated when the market became hot.
  url: https://www.conning.com/about-us/news/ir-pr---mga-2025
- name: "TFP Group,\nIPO filing (F-1/A)"
  why: The IPO filing of TFP Group, owner of the Pine Walk MGA platform, filed with the SEC
  how: We used it for the $1.1B of bound premium and the 47% from one insurer. It also gave the 850 teams reviewed.
  url: https://www.sec.gov/Archives/edgar/data/2128185/000162828026075089/tfpgrouplimited-fx1a1.htm
- name: "Neptune, third\nquarter 2026 results"
  why: The results of Neptune, a listed flood MGA, for the quarter to September 30, 2026
  how: We used it for the $133M of premium and the $17M profit. It also showed that an MGA can be profitable.
  url: https://investors.neptuneflood.com/news/news-details/2026/Neptune-Insurance-Holdings-Inc--Reports-Third-Quarter-2026-Results/default.aspx
- name: "Neptune, 2025\nearnings presentation"
  why: Neptune's SEC-filed presentation with its programs, capacity partners and quotes for 2025
  how: We used it for the 40 capacity partners and 6 million quotes. It also backed the growth loops.
  url: https://www.sec.gov/Archives/edgar/data/2067129/000206712926000003/earningspresentation.htm
- name: "Lloyd's, delegated\nauthority page"
  why: Lloyd's own page on delegated authority, with figures dated November 9, 2026
  how: We used it for the 45% of Lloyd's premium written under delegation. It also backed a signal slide.
  url: https://www.lloyds.com/market-resources/delegated-authorities
- name: "Lloyd's, delegated\nunderwriting guidance"
  why: Lloyd's guidance to its syndicates on how to oversee the MGAs they back
  how: We used it for the tech layers and the bottlenecks. It also framed the audit and data duties.
  url: https://www.lloyds.com/market-resources/delegated-authorities/market-knowledge/delegated-underwriting-guidance
- name: "Howden Re, European\nMGA market report"
  why: The reinsurance broker's study of the European MGA market, with 2025 premium by country
  how: We used it for the $23B of European premium and its growth. It also fed our market size.
  url: https://www.howdenre.com/news-insights/howden-re-publishes-filtered-for-quality-a-refined-view-of-europes-mga-market
- name: "Amwins, MGA\nmarketplace update"
  why: The specialty broker's 2026 note on the MGA market, from its own placements
  how: We used it for tighter underwriting and softer prices. It also backed the risk and failure slides.
  url: https://www.amwins.com/resources-and-insights/market-insights/article/mga-marketplace-update
- name: "Munich Re,\nAt-Bay agreement"
  why: Munich Re's release on its agreement to buy the cyber MGA At-Bay
  how: We used it for the $575M price and the 2027 closing. It also backed the deals and the warning signs.
  url: https://www.munichre.com/hsb/en/press-and-publications/press-releases/2026/media-release-2026-08-19.html
- name: "Coalition and\nAllianz partnership"
  why: Coalition's release on its ten-year global cyber partnership with Allianz
  how: We used it for the leaders and the capacity slides. It also backed Coalition's lead in cyber.
  url: https://www.coalitioninc.com/announcements/coalition-and-allianz-commercial-expand-strategic-global-cyber-insurance-partnership
- name: "Ledgebrook,\n$200M financing"
  why: Ledgebrook's release on its $200M round and its new reinsurance deal with Allianz Re
  how: We used it for the largest round of 2026 and quotes in hours. It also backed the growth slides.
  url: https://www.prnewswire.com/news-releases/ledgebrook-raises-usd-200-million-in-primary-equity-financing-co-led-by-allianz-x-to-scale-ai-native-specialty-insurance-platform-302899921.html
- name: "Ominimo, $1.6B\nSeries B"
  why: The Insurer's report on Ominimo's round led by the EBRD, at a $1.6B value
  how: We used it for Ominimo's value and launch date. It also placed it among the unicorns.
  url: https://www.theinsurer.com/ti/news/hungarian-insurtech-ominimo-valued-at-16-billion-in-ebrd-led-round-2026-07-28
- name: "Stand, Colorado\nlaunch"
  why: Stand's release on its Colorado home cover, which names the insurer behind its policies
  how: We used it for Stand's delegated model and latest launch. It also backed the news slides.
  url: https://www.prnewswire.com/news-releases/stand-launches-in-colorado-with-home-insurance-that-lowers-premiums-for-homeowners-who-protect-against-wildfire-302942802.html
- name: "Cover Whale,\nMorgan Stanley round"
  why: Morgan Stanley's release on its $40M investment in the trucking MGA Cover Whale
  how: We used it for the 5,000 agents and the live driving data. It also built the Cover Whale contrast slide.
  url: https://www.morganstanley.com/press-releases/cover-whale-announces-growth-equity-ms-expansion-capital
- name: "Shepherd,\n$42M Series B"
  why: Shepherd's own post on its Series B, led by the investment arm of the insurer Intact
  how: We used it for quotes in minutes on building risks. It also backed the leaders and moonshots.
  url: https://www.shepherdinsurance.com/blog/behind-our-42m-series-b
- name: "North Carolina,\nMGA law"
  why: A state law based on the US model act for MGAs, with the license and contract duties
  how: We used it for the written contract and license rules. It also backed the regulation slides.
  url: https://www.ncleg.gov/EnactedLegislation/Statutes/HTML/ByArticle/Chapter_58/Article_34.html
- name: "Accelerant,\nQ2 2026 filing"
  why: The SEC filing of Accelerant, an MGA platform, with revenue and profit by segment
  how: We used it for the 43% margin of its MGA arm against 1.4% for its insurer arm.
  url: https://www.sec.gov/Archives/edgar/data/1997350/000199735026000015/arx-20260630.htm
- name: "Gallagher Re, MGA\ngrowth report"
  why: The reinsurance broker's 2026 view of the US MGA market and the reinsurance behind it
  how: We used it for the 10% growth of 2025 and the $125B estimate. It also backed the growth drivers.
  url: https://www.ajg.com/gallagherre/news-and-insights/mgas-remain-at-the-growth-epicenter-of-insurance/
