    impact: 3
  - text: New studies invalidate widely used forestry baselines, forcing Verra projects to cancel or sharply reduce expected issuance
    odds: 35
    impact: 3
  - text: Governments restrict use of voluntary credits in climate claims, reducing demand from brands seeking net zero labels
    odds: 45
    impact: 2
  - text: Article 6 authorization remains slow across host countries, delaying cross border supply for CORSIA and national buyers
    odds: 45
    impact: 2
  - text: Carbon removal costs stay high while buyers resist premium prices, limiting scale for durable engineered credit supply
    odds: 50
    impact: 2
  - text: A large carbon marketplace or registry suffers fraud or a cyber breach, weakening trust in credit ownership and retirement
    odds: 25
    impact: 3
  - text: Economic weakness pushes companies to prioritize cost cuts over optional offset budgets, reducing spot credit purchases
    odds: 40
    impact: 1
  - text: Different integrity labels split eligible supply into small pools, making procurement slower and price discovery less liquid
    odds: 55
    impact: 2
