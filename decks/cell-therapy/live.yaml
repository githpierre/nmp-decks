ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people ask if stem

    cell therapy works, and where to get It'
  date: C Over the past year.
  expl: Stem cells became the new longevity trend. Celebrities and athletes talked about trips to clinics abroad, influencers posted their treatments, and
    new rules in the US and Japan made headlines. People wanted to know if it works and where to get it.
  term: cell therapy
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/cell-therapy/cell-therapy.csv
ed052p:
  type: pp_cagr
  title: 'How much room is left

    for cell therapy to grow?'
  lead: 'To fill that room, '
  condition: CAR-T must keep moving to earlier lines of treatment and new countries, while autoimmune CAR-T wins its first approvals. In vivo CAR-T, donor
    cells, and iPSC therapies must also reach patients, and costs must fall enough for payers to cover many more people.
  note:
  - We compared forecasts from Fortune Business Insights, Towards Healthcare, Mordor and IMARC
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: 9.5
  cagr: 20
  y0: 2026
