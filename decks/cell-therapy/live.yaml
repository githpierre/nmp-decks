ed142p:
  title: 'What are the biggest

    threats to cell therapy?'
  events:
  - odds: 40
    impact: 3
    text: CAR-T list prices stay above $400,000 per patient and hospitals limit use for budget reasons
  - odds: 40
    impact: 2
    text: Biotech funding stays tight and many cell therapy startups close before reaching Phase 2 results
  - odds: 35
    impact: 2
    text: Big pharma exits cell therapy like Takeda and Novo Nordisk did, leaving startups without partners
  - odds: 35
    impact: 1
    text: Chinese companies like Legend Biotech win global licenses with cheaper CAR-T and take market share
  - odds: 30
    impact: 2
    text: The FDA adds safety warnings or holds after T cell cancers appear in more CAR-T patients
  - odds: 30
    impact: 2
    text: Medicare and payers refuse to pay for CAR-T in lupus and autoimmune diseases without long-term data
  - odds: 15
    impact: 3
    text: A patient death in an allogeneic trial leads the FDA to halt several off-the-shelf programs
  - odds: 12
    impact: 3
    text: In vivo CAR-T from AstraZeneca and Gilead replaces ex vivo therapies, making startup factories obsolete
  note:
  - We listed the events that could slow cell therapy down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
