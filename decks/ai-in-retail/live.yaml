ed007p:
  type: pp_radar
  title: 'What is actually included

    in the AI in retail market?'
  TL:
    name: Shopify
    src: ../../assets/logos/pp_live/ai-in-retail/s01-00.png
    text: commerce platform with AI features, but it is not primarily software for retail planning and operational decisions
  TR:
    name: NVIDIA
    src: ../../assets/logos/pp_live/ai-in-retail/s01-02.png
    text: supplies AI chips and platforms used by retailers but does not sell a retail decision application as its core offer
  BL:
    name: Salesforce
    src: ../../assets/logos/pp_live/ai-in-retail/s01-09.png
    text: broad CRM platform with retail AI products, but most revenue comes from general enterprise applications
  BR:
    name: SAP
    src: ../../assets/logos/pp_live/ai-in-retail/s01-10.png
    text: large enterprise suite with retail AI modules, while retail decision software is only one part of its business
  caption:
  - Distance to the center reflects how central each company is to AT in retail
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
