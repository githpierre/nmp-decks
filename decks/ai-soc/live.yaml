ed007p:
  type: pp_radar
  title: 'What is in the AI SOC

    market, and what is out?'
  TL:
    name: ReliaQuest
    src: ../../assets/logos/pp_live/ai-soc/s01-00.png
    text: runs security for 1,300 clients with its GreyMatter AI platform, but it also relies on 1,200 staff in six centers
  TR:
    name: Okta
    src: ../../assets/logos/pp_live/ai-soc/s01-02.png
    text: secures logins for big firms and governments, but it controls who gets access rather than investigating security alerts
  BL:
    name: Tines
    src: ../../assets/logos/pp_live/ai-soc/s01-10.png
    text: began as an automation tool for security teams and now runs AI workflows for IT teams too, which puts it on the edge
  BR:
    name: Palo Alto Networks
    src: ../../assets/logos/pp_live/ai-soc/s01-11.png
    text: grew XSIAM to over $700 million in recurring revenue, but Cortex is under a fifth of its $11.5 billion sales
  caption:
  - Distance to the center reflects how much of the analyst's work, from triage to response, the AI actually does on its own
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
