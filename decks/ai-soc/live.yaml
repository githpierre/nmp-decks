ed142p:
  title: 'What are the biggest

    threats to AI SOC?'
  events:
  - odds: 30
    impact: 3
    text: Microsoft, now giving Security Copilot to all E5 customers, wins most SOC agent deals from startups
  - odds: 25
    impact: 2
    text: CrowdStrike, Palo Alto Networks and Zscaler buy the AI SOC leaders, leaving few independent startups
  - odds: 20
    impact: 2
    text: Most AI SOC pilots fail to prove results, and security teams cancel contracts after a year
  - odds: 15
    impact: 3
    text: An AI SOC tool misses a major ransomware attack, and the breach becomes a public scandal
  - odds: 12
    impact: 2
    text: Model costs per investigation stay high, so AI SOC startups cannot reach healthy margins
  - odds: 10
    impact: 3
    text: Attackers hijack an AI SOC agent with planted text and make it shut down defenses
  - odds: 8
    impact: 2
    text: OpenAI and Anthropic sell security agents directly to enterprises and bypass AI SOC startups
  - odds: 5
    impact: 1
    text: EU AI Act duties or new US rules force strict human review on autonomous SOC agents
  note:
  - We listed the events that could slow ai soc down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
