ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more security teams

    look up AI SOC to handle their alerts'
  date: Recently.
  expl: Security teams drown in alerts every day. When AI started triaging them automatically, ‘AI SOC’ went from jargon to something security leaders look
    up by name.
  term: ai soc
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/ai-soc/ai-soc.csv
ed052p:
  type: pp_cagr
  title: 'How fast can the AI SOC

    market really grow?'
  lead: ''
  condition: To grow this fast, AI agents must move from pilots to production in most large SOCs, and buyers must trust them to act alone on more than low-risk
    alerts. It must also keep AI-led MDR growing in the mid-market and avoid a price war as Microsoft and Google bundle agents into their licenses.
  note:
  - We compared forecasts from MarketsandMarkets, Fortune Business Insights, Mordor and Gartner to build a realistic range
  - We checked them against the growth of the AI SIEM leaders, and all the sources we used are listed at the end of the report
  size: 6.5
  cagr: 22
  y0: 2026
