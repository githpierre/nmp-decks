ed148p:
  title: 'What pushed the digital pathology

    market forward, year after year?'
  events:
  - year: '1994'
    text: First commercial slide scanner appears
    impact: 1.0
  - year: '1999'
    text: Whole-slide imaging patents mature
    impact: 1.0
  - year: '2001'
    text: Commercial WSI systems reach labs
    impact: 1.0
  - year: '2005'
    text: Storage costs fall for huge slides
    impact: 1.0
  - year: '2009'
    text: FDA engages WSI stakeholders
    impact: 1.0
  - year: '2011'
    text: FDA classifies WSI as high risk
    impact: 1.0
  - year: '2014'
    text: FDA and industry align trial design
    impact: 1.0
  - year: '2016'
    text: Large validation studies prove concordance
    impact: 2.0
  - year: '2017'
    text: FDA clears Philips for primary diagnosis
    impact: 3.0
  - year: '2018'
    text: Digital pathology validation guidance spreads
    impact: 1.5
  - year: '2019'
    text: Leica gains US primary-diagnosis clearance
    impact: 2.0
  - year: '2020'
    text: Covid makes remote pathology urgent
    impact: 2.0
  - year: '2020'
    text: FDA eases remote pathology enforcement
    impact: 2.0
  - year: '2021'
    text: FDA authorizes Paige Prostate AI
    impact: 3.0
  - year: '2021'
    text: Philips updates IntelliSite clearance
    impact: 1.0
  - year: '2022'
    text: Hamamatsu wins US scanner clearance
    impact: 1.5
  - year: '2022'
    text: EU IVDR raises evidence standards
    impact: 1.0
  - year: '2023'
    text: Labs scale cloud pathology platforms
    impact: 1.5
  - year: '2024'
    text: Roche gains US digital pathology clearance
    impact: 2.0
  - year: '2024'
    text: Sectra and Leica win DICOM clearance
    impact: 2.0
  - year: '2024'
    text: Proscia clears Concentriq Dx
    impact: 1.5
  - year: '2024'
    text: FDA LDT rule raises digitization pressure
    impact: 1.0
  - year: '2025'
    text: PathAI AISight Dx gets FDA clearance
    impact: 2.0
  - year: '2025'
    text: PathAI launches global lab network
    impact: 1.5
  - year: '2025'
    text: More mix-and-match systems clear
    impact: 1.5
  - year: '2026'
    text: Labcorp deploys PathAI nationwide
    impact: 2.5
  - year: '2026'
    text: Leica clears new DX scanners
    impact: 2.0
  - year: '2026'
    text: Leica clears slide quality AI
    impact: 2.0
  - year: '2026'
    text: PathAI dermatology AI gets breakthrough
    impact: 1.5
  - year: '2026'
    text: DICOM adoption keeps expanding
    impact: 1.5
  note:
  - We kept the events we believe pushed digital pathology forward the most
  - Ratings are our estimates, with all the sources at the end of the report
