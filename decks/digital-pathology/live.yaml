ed007p:
  type: pp_radar
  title: 'Who Is in digital pathology,

    and who stays outside?'
  TL:
    name: Tempus AI
    src: ../../assets/logos/pp_live/digital-pathology/s01-00.png
    text: it uses multimodal cancer data and AT, including pathology assets, but its business spans many diagnostics and data
  TR:
    name: Illumina
    src: ../../assets/logos/pp_live/digital-pathology/s01-02.png
    text: it sells sequencing systems and genomics workflows, not slide scanning or pathology image management for routine
  BL:
    name: Nucleai
    src: ../../assets/logos/pp_live/digital-pathology/s01-09.png
    text: its pathology AI serves drug development and biomarker work more than routine clinical slide reading and diagnosis
  BR:
    name: Lumea
    src: ../../assets/logos/pp_live/digital-pathology/s01-10.png
    text: it combines digital pathology workflow software with tissue handling services, so only part of the offer is software
  caption:
  - Distance to the center reflects how central each company is to digital pathology
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
  - ../../assets/logos/pp_live/digital-pathology/s01-01.png
