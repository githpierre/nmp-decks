ed142p:
  title: 'What are the biggest threats

    to AI revenue cycle management?'
  events:
  - odds: 45
    impact: 3
    text: Epic adds AI coding and denial tools to its platform, so hospitals stop buying separate startup products
  - odds: 40
    impact: 2
    text: Payers like UnitedHealth use their own AI to deny claims faster than providers can appeal
  - odds: 40
    impact: 2
    text: Medicaid cuts under new federal law shrink hospital budgets and delay new RCM software purchases
  - odds: 35
    impact: 2
    text: CMS and states pass rules limiting AI in prior authorization and billing, adding compliance costs
  - odds: 35
    impact: 2
    text: Waystar, R1 and Ensemble buy or copy AI startups and win deals with bundled pricing
  - odds: 30
    impact: 1
    text: Physicians and coders resist automated tools and hospitals see slow adoption and weak ROI
  - odds: 20
    impact: 3
    text: An AI coding tool is found upcoding claims and the DOJ pursues False Claims Act cases
  - odds: 15
    impact: 3
    text: A cyberattack like Change Healthcare hits an AI RCM vendor and halts claims for weeks
  note:
  - We listed the events that could slow ai revenue cycle management down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
