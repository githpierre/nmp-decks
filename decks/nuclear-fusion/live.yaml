ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people ask if fusion

    power is real, now Google signed a deal'
  date: Recently.
  expl: Fusion started to feel real. Google signed a deal to buy power from Commonwealth Fusion Systems, which then raised over $800 million to finish its
    reactor, and AI data centers made everyone ask where tomorrow’s electricity will come from. Searches moved to a new, much higher level.
  term: nuclear fusion
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/nuclear-fusion/nuclear-fusion.csv
