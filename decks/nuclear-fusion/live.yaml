ed142p:
  title: 'What are the biggest

    threats to fusion?'
  events:
  - odds: 45
    impact: 3
    text: Commonwealth Fusion's SPARC and Helion miss their net energy goals again, and investors lose confidence in fusion
  - odds: 30
    impact: 3
    text: Fusion startups fail to raise the billions they each need, and several leaders run out of cash
  - odds: 20
    impact: 3
    text: Reactor wall and magnet materials fail under neutron damage, forcing redesigns that delay fusion plants by years
  - odds: 20
    impact: 2
    text: China runs its BEST fusion machine first and pulls ahead of US and UK fusion startups
  - odds: 15
    impact: 2
    text: Cheaper solar, wind and batteries win utility contracts, leaving little demand for expensive fusion power
  - odds: 15
    impact: 2
    text: Tritium supply studies show too little fuel for first fusion plants, and investors question D-T designs
  - odds: 8
    impact: 2
    text: The NRC or UK regulators reverse course and apply strict fission-style rules to fusion power plants
  - odds: 5
    impact: 2
    text: A serious accident at a fusion test facility leads regulators to tighten rules for the whole sector
  note:
  - We listed the events that could slow nuclear fusion down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
