ed007p:
  type: pp_radar
  title: 'What makes a company

    part of military robotics?'
  TL:
    name: DJI
    src: ../../assets/logos/pp_live/military-robotics/s01-00.png
    text: drones fly scouting and strike missions in Ukraine, but DJI designs them for civilians and halted sales there in 2022
  TR:
    name: Dassault Aviation
    src: ../../assets/logos/pp_live/military-robotics/s01-02.png
    text: builds the Rafale, a fighter flown by a pilot, and funding drone maker Harmattan AI doesn't change that
  BL:
    name: Rheinmetall
    src: ../../assets/logos/pp_live/military-robotics/s01-09.png
    text: builds Mission Master robot vehicles, but most of its business is crewed armored vehicles, guns and ammunition
  BR:
