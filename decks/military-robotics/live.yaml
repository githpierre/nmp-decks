ed142p:
  title: 'What could go wrong

    for military robotics?'
  events:
  - odds: 35
    impact: 3
    text: The defense tech bubble bursts and Anduril and peers see down rounds without enough production contracts
  - odds: 30
    impact: 3
    text: Congress cuts the $54.6 billion DAWG drone request sharply, leaving military robotics startups without expected orders
  - odds: 30
    impact: 2
    text: Rheinmetall, Lockheed and other primes win most large drone and robot contracts in Europe and the US
  - odds: 30
    impact: 2
    text: A Ukraine peace deal ends the main battlefield demand for drones and ground robots
  - odds: 30
    impact: 3
    text: China cuts off motors, magnets and batteries for Western military robot makers and Ukrainian suppliers
  - odds: 10
    impact: 2
    text: New interceptors and jammers make cheap attack drones far less effective, cutting demand for robotic systems
  - odds: 10
    impact: 2
    text: Robot boats or ground robots fail badly in Navy or Army tests and kill or injure sailors
  - odds: 5
    impact: 2
    text: A UN treaty bans fully autonomous weapons and restricts military robot sales to many allied armies
  note:
  - We listed the events that could slow military robotics down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
