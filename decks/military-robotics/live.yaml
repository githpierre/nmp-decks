ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people look up military

    robots, as ground robots join the war'
  date: Over the past year.
  expl: Ukraine started sending ground robots to carry supplies, evacuate soldiers and even hold positions, and China showed armed robot dogs in military
    drills. Startups promised humanoid soldiers. Videos of robots at war went viral, and people searched what military robots can really do.
  term: military robotics
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/military-robotics/military-robotics.csv
ed052p:
  type: pp_cagr
  title: 'How much bigger can

    military robotics get?'
  lead: ''
  condition: To get that big, the market must turn today’s first orders into large programs, and keep robot budgets strong after the war in Ukraine. It
    must also build China-free supply chains, and prove that robots can work together with little human control.
  note:
  - We compared forecasts from Mordor, Grand View, GM Insights and MarketsandMarkets to build a realistic range
  - We kept only ground, sea and underwater robots, and all the sources we used are listed at the end of the report
  size: 11.5
  cagr: 10
  y0: 2026
