ed142p:
  title: 'What could go wrong

    for industrial robots?'
  events:
  - odds: 30
    impact: 3
    text: Chinese robot brands like Estun and Inovance undercut FANUC and ABB on price worldwide
  - odds: 25
    impact: 3
    text: A carmaker slump cuts robot orders sharply in North America and Europe for years
  - odds: 20
    impact: 2
    text: Funding freezes for industrial robot startups that raised $500 million rounds with few paying customers
  - odds: 20
    impact: 3
    text: FANUC, ABB and Universal Robots add NVIDIA AI to their robots and keep most factory customers
  - odds: 15
    impact: 2
    text: AI robot models stop improving and still fail fine factory tasks, delaying flexible automation
  - odds: 10
    impact: 2
    text: US-China trade fights cut supply of motors, chips and magnets for industrial robot makers
  - odds: 8
    impact: 2
    text: A humanoid or cobot seriously injures a factory worker, and regulators slow robot deployments
  - odds: 5
    impact: 1
    text: Unions win new laws in Europe or the US that slow factory robot deployments
  note:
  - We listed the events that could slow industrial robotics down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
