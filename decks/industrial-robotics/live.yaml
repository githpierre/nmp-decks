ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More people look up industrial robots,

    as factories struggle to hire workers'
  date: Lately.
  expl: Factories keep struggling to hire, and new robots are cheaper and easier to program than before. More companies started looking at industrial robots
    to take over repetitive work.
  term: industrial robotics
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/industrial-robotics/industrial-robotics.csv
ed052p:
  type: pp_cagr
  title: 'Is the industrial robotics

    market still growing fast?'
  lead: ''
  condition: Yes, but the market must make AI robots reliable enough for full shifts, and cut the cost of setting up each robot cell. It must also train
    enough workers to run robots, and pass new safety rules for humanoids and mobile robots.
  note:
  - We compared forecasts from MarketsandMarkets, Stratview, Grand View and Fortune
  - We aligned their timelines, and all the sources we used are listed at the end of the report
  size: 28
  cagr: 10
  y0: 2029
