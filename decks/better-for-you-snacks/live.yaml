ed007p:
  type: pp_radar
  title: 'Which companies really belong

    in better-for-you snacks?'
  TL:
    name: Huel
    src: ../../assets/logos/pp_live/better-for-you-snacks/s01-00.png
    text: targets nutrition and convenience, but most products replace meals rather than serve as packaged snack alternatives
  TR:
    name: Coca-Cola
    src: ../../assets/logos/pp_live/better-for-you-snacks/s01-02.png
    text: is a beverage company, so its products do not belong in the packaged better-for-you snack category
  BL:
    name: Chobani
    src: ../../assets/logos/pp_live/better-for-you-snacks/s01-09.png
    text: sells snackable yogurt and protein items, but its core business remains refrigerated dairy rather than packaged
  BR:
    name: KIND
    src: ../../assets/logos/pp_live/better-for-you-snacks/s01-10.png
    text: is strongly associated with healthier snack bars, but its parent Mars also spans mainstream confectionery and foods
  caption:
  - Distance to the center reflects how central each company is to better-for-you snacks
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
