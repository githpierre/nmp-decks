ed148p:
  title: 'What pushed the construction costing

    market forward, year after year?'
  events:
  - year: '1940'
    text: RSMeans books standardize cost benchmarks
    impact: 2.0
  - year: '1980'
    text: Timberline designs digital cost estimator
    impact: 2.5
  - year: '1987'
    text: Precision Estimating digitizes bids
    impact: 2.5
  - year: '1988'
    text: On Screen Takeoff digitizes plan measurements
    impact: 2.0
  - year: '1991'
    text: QuoteSoft automates mechanical estimates
    impact: 1.5
  - year: '1993'
    text: iSqFt digitizes subcontractor bid invitations
    impact: 1.5
  - year: '2002'
    text: BidClerk lowers project lead search costs
    impact: 1.5
  - year: '2005'
    text: Bluebeam Revu improves plan markup workflows
    impact: 1.5
  - year: '2006'
    text: SmartBid digitizes subcontractor bids
    impact: 2.0
  - year: '2007'
    text: PlanSwift reduces digital takeoff barriers
    impact: 2.0
  - year: '2012'
    text: Cloud BIM makes quantities easier to share
    impact: 1.5
  - year: '2013'
    text: IFC4 improves model based cost estimates
    impact: 1.5
  - year: '2015'
    text: RSMeans Online adds life cycle costs
    impact: 1.5
  - year: '2016'
    text: ConstructConnect unites bid data networks
    impact: 1.5
  - year: '2017'
    text: ConstructConnect adds On Center takeoff
    impact: 2.0
  - year: '2018'
    text: ConstructConnect adds PlanSwift takeoff
    impact: 2.0
  - year: '2018'
    text: Autodesk invests in digital bid management
    impact: 1.5
  - year: '2019'
    text: Autodesk joins digital bidding systems
    impact: 1.5
  - year: '2020'
    text: Procore acquires cloud estimating specialist
    impact: 2.0
  - year: '2021'
    text: Autodesk launches combined 2D 3D takeoff
    impact: 2.5
  - year: '2021'
    text: Procore connects estimates and budgets
    impact: 2.0
  - year: '2021'
    text: Steel and lumber spikes force repricing
    impact: 2.0
  - year: '2022'
    text: Trimble connects civil bids to operations
    impact: 2.0
  - year: '2023'
    text: Legacy Vico retirement pushes replacements
    impact: 1.0
  - year: '2024'
    text: Trimble links estimates to field operations
    impact: 1.5
  - year: '2024'
    text: Gordian adds dynamic cost trend analytics
    impact: 1.5
  - year: '2024'
    text: Sage takes bid leveling to cloud
    impact: 1.5
  - year: '2025'
    text: Sage adds AI subcontractor bid insights
    impact: 1.5
  - year: '2026'
    text: ConstructConnect automates plan takeoff
    impact: 2.5
  - year: '2026'
    text: Trimble automates MEP drawing measurements
    impact: 2.0
  note:
  - We kept the events we believe pushed construction estimating software forward the most
  - Ratings are our estimates, with all the sources at the end of the report
