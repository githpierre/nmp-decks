ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More contractors look up estimating

    software to price their jobs faster'
  date: Lately.
  expl: Material prices kept moving and contractors had to bid on more jobs with fewer estimators. AI tools that read drawings and count materials automatically
    appeared, and contractors went looking for estimating software.
  term: construction estimating software
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/construction-estimating-software/construction-estimating-software.csv
