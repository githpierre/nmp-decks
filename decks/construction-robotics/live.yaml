ed052p:
  type: pp_cagr
  title: 'How much bigger

    can this market get?'
  lead: ''
  condition: To get that big, operator-free earthmoving must become normal on large civil, solar, and data center sites, and equipment makers must sell
    or rent startup kits. Trade robots must also move from fleets of a hundred to fleets of thousands without a serious accident.
  note:
  - We compared forecasts from Grand View, Lucintel, Research and Markets and MRFR to build a realistic range
  - We adjusted them to our scope and allowed for slow fleet growth, with all the sources at the end of the report
  size: 1.77
  cagr: 24
  y0: 2026
