ed142p:
  title: 'What are the biggest threats

    to construction robots?'
  events:
  - odds: 30
    impact: 3
    text: Caterpillar and Komatsu close their machines to third-party autonomy kits and ship their own systems
  - odds: 25
    impact: 2
    text: A US building downturn deepens as housing starts keep falling, cutting construction robot orders for years
  - odds: 20
    impact: 2
    text: Bedrock Robotics and Gravis fail to scale fleets before their cash runs out
  - odds: 15
    impact: 2
    text: A pause in data center and solar construction cuts demand for construction robots on large sites
  - odds: 15
    impact: 3
    text: An autonomous excavator or construction robot kills a worker, and regulators halt autonomous machines
  - odds: 12
    impact: 1
    text: New tariffs raise costs for construction robot makers that rely on imported parts and machines
  - odds: 10
    impact: 2
    text: Cheap Chinese finishing and layout robots undercut Western construction robot startups on price
  - odds: 5
    impact: 1
    text: Construction unions block robots on job sites through contracts or new state laws
  note:
  - We listed the events that could slow construction robotics down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
