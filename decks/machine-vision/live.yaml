ed148p:
  title: 'What pushed the machine vision

    market forward, year after year?'
  events:
  - year: '1959'
    text: Industrial image processing begins
    impact: 1.0
  - year: '1963'
    text: 3D vision research gains traction
    impact: 1.0
  - year: '1976'
    text: Bayer color filter improves imaging
    impact: 1.0
  - year: '1979'
    text: Marr formalizes visual scene analysis
    impact: 1.0
  - year: '1981'
    text: Cognex makes machine vision commercial
    impact: 2.5
  - year: '1984'
    text: AIA organizes machine vision industry
    impact: 1.0
  - year: '1985'
    text: Ethernet enables connected cameras
    impact: 1.0
  - year: '1988'
    text: PC frame grabbers lower system cost
    impact: 1.5
  - year: '1990'
    text: Vision systems spread through factories
    impact: 2.5
  - year: '1993'
    text: Image APIs simplify development
    impact: 1.0
  - year: '1996'
    text: LED lighting improves inspection stability
    impact: 1.0
  - year: '1997'
    text: Vision-guided robots become easier
    impact: 1.5
  - year: '1999'
    text: Cognex and Sony integrate camera design
    impact: 1.0
  - year: '2001'
    text: Smart cameras move processing onboard
    impact: 1.5
  - year: '2003'
    text: Gigabit Ethernet boosts image transfer
    impact: 1.0
  - year: '2007'
    text: Laser profiling expands 3D metrology
    impact: 1.0
  - year: '2009'
    text: Digital comparators simplify measurement
    impact: 1.0
  - year: '2012'
    text: CMOS sensors cut camera costs
    impact: 1.0
  - year: '2014'
    text: Deep learning changes defect detection
    impact: 3.0
  - year: '2016'
    text: 3D cameras expand robot guidance
    impact: 1.5
  - year: '2018'
    text: Edge AI reduces inspection latency
    impact: 1.5
  - year: '2020'
    text: Covid accelerates factory automation
    impact: 1.5
  - year: '2021'
    text: Cognex marks forty years at scale
    impact: 1.0
  - year: '2022'
    text: AI vision needs fewer defect samples
    impact: 1.5
  - year: '2023'
    text: Warehouse automation expands vision demand
    impact: 1.0
  - year: '2024'
    text: Physical AI boosts 3D perception
    impact: 1.5
  - year: '2025'
    text: Industrial vision shifts toward AI platforms
    impact: 1.5
  - year: '2026'
    text: Cognex agrees to buy RealSense
    impact: 2.0
  - year: '2026'
    text: OMNIVISION launches HDR sensor
    impact: 1.5
  - year: '2026'
    text: Machine vision industry marks thirty years
    impact: 1.0
  note:
  - We kept the events we believe pushed machine vision forward the most
  - Ratings are our estimates, with all the sources at the end of the report
ed168p:
  handle: machine-vision
  title: 'Where did machine vision investors

    put their money this past year?'
  note:
  - We added up every equity round of machine vision startups in our tracker over the last twelve months
  - by category of our market definition, and rounds with no public amount count as zero here
