    text: Trimble buys B2W for civil workflows
    impact: 1.5
  - year: '2023'
    text: Robotic pile drivers tackle solar sites
    impact: 1.5
  - year: '2024'
    text: Bentley adds geospatial digital twins
    impact: 1.5
  - year: '2025'
    text: Labor shortages drive site automation
    impact: 2.0
  - year: '2026'
    text: ICON commercializes robotic building systems
    impact: 2.5
  - year: '2026'
    text: Army opens robotic printed barracks
    impact: 2.0
  - year: '2026'
    text: Procore launches voice AI for crews
    impact: 2.0
  note:
  - We kept the events we believe pushed contech forward the most
  - Ratings are our estimates, with all the sources at the end of the report
