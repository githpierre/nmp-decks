ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More builders search construction

    technology as job sites go digital'
  date: Lately.
  expl: Construction is short of workers and margins are thin. Builders started trying software, drones and robots to plan and track their jobs, data center
    projects boomed, and more people searched for construction technology.
  term: contech
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/contech/contech.csv
