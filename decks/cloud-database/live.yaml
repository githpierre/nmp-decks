ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'Vector database searches jumped

    as companies built their own chatbots'
  date: Lately.
  expl: To make chatbots answer from their own documents, companies needed a new kind of database that finds text by meaning. Developers rushed to learn
    about vector databases, and startups like Pinecone raised large rounds.
  term: cloud database
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/cloud-database/cloud-database.csv
ed052p:
  type: pp_cagr
  title: 'What will the cloud databases

    market be worth by 2036?'
  lead: ''
  condition: To be worth that much, the market must keep moving core company data off servers that firms run themselves, and become the default store for
    AI apps and agents. It must also keep cloud bills predictable as data volumes explode.
  note:
  - We compared forecasts from Gartner, Grand View, 360iResearch and IMARC and adjusted each one to our market definition
  - We then built a realistic range from these forecasts, and you will find all the sources we used at the end of the report
  size: 55
  cagr: 15
  y0: 2026
