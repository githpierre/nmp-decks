ed148p:
  title: 'What pushed cloud databases

    forward, year after year?'
  events:
  - year: '2009'
    text: AWS RDS automates relational operations
    impact: 2.5
  - year: '2012'
    text: DynamoDB makes NoSQL capacity managed
    impact: 2.5
  - year: '2012'
    text: Redshift preview lowers warehouse barriers
    impact: 2.0
  - year: '2013'
    text: Redshift makes cloud warehousing available
    impact: 2.0
  - year: '2014'
    text: Aurora targets costly enterprise databases
    impact: 1.5
  - year: '2015'
    text: Aurora cuts managed relational database costs
    impact: 2.5
  - year: '2016'
    text: MongoDB Atlas simplifies document databases
    impact: 2.0
  - year: '2016'
    text: Aurora replicas support global reads
    impact: 1.5
  - year: '2017'
    text: Google previews global SQL database
    impact: 2.0
  - year: '2017'
    text: Azure Cosmos brings global NoSQL
    impact: 2.0
  - year: '2017'
    text: Cloud Spanner becomes broadly available
    impact: 2.0
  - year: '2017'
    text: Neptune preview makes graphs cloud managed
    impact: 1.0
  - year: '2017'
    text: Aurora adds PostgreSQL compatibility
    impact: 1.5
  - year: '2018'
    text: Aurora Serverless lowers idle database costs
    impact: 2.0
  - year: '2018'
    text: Aurora Global improves disaster recovery
    impact: 1.5
  - year: '2019'
    text: Amazon DocumentDB eases migrations
    impact: 1.5
  - year: '2020'
    text: Timestream brings time series into cloud
    impact: 1.0
  - year: '2022'
    text: Aurora Serverless v2 enables finer scaling
    impact: 2.0
  - year: '2022'
    text: AlloyDB preview improves SQL economics
    impact: 1.5
  - year: '2022'
    text: AlloyDB expands managed SQL choices
    impact: 1.5
  - year: '2023'
    text: Aurora adds vector search for AI
    impact: 2.0
  - year: '2023'
    text: Aurora pricing reduces database IO overhead
    impact: 1.5
  - year: '2023'
    text: Atlas Vector Search makes embeddings managed
    impact: 2.0
  - year: '2024'
    text: Pinecone serverless cuts vector costs
    impact: 1.5
  - year: '2024'
    text: Aurora DSQL previews global transactions
    impact: 1.5
  - year: '2025'
    text: Aurora DSQL expands globally consistent SQL
    impact: 2.5
  - year: '2025'
    text: AWS backs open document database standard
    impact: 1.0
  - year: '2026'
    text: Aurora DSQL streams changes into applications
    impact: 1.5
  - year: '2026'
    text: Atlas automates retrieval embeddings
    impact: 1.5
  - year: '2026'
    text: Atlas Infinite scales bursty AI demand
    impact: 2.0
  note:
  - We kept the events we believe pushed cloud database forward the most
  - Ratings are our estimates, with all the sources at the end of the report
