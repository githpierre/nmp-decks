ed142p:
  title: 'What could go wrong

    for AI sales agents?'
  events:
  - odds: 35
    impact: 3
    text: Salesforce, HubSpot and Microsoft bundle sales agents in their plans, squeezing AI sales agent startups
  - odds: 25
    impact: 1
    text: The best AI sales agent startups get bought early like Qualified, leaving few independent leaders
  - odds: 15
    impact: 2
    text: OpenAI's ChatGPT agent researches accounts and writes outreach for free, replacing paid AI sales agents
  - odds: 15
    impact: 3
    text: Buyers see no added pipeline from AI sales agents and cancel contracts after the first year
  - odds: 12
    impact: 2
    text: AI email costs fall to almost nothing and buyers compare prices, so sales agent margins vanish
  - odds: 10
    impact: 2
    text: Gmail and Microsoft tighten bulk sender rules, sending AI sales agent emails straight to spam
  - odds: 8
    impact: 3
    text: Buyers use AI filters that block AI sales agent emails and calls before they reach a person
  - odds: 5
    impact: 2
    text: Another AI sales startup like 11x is caught inflating revenue, and buyers distrust the whole category
  note:
  - We listed the events that could slow ai sales agents down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
