ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'Sales teams are looking up AI SDRs

    that book meetings on their own'
  date: Lately.
  expl: Sales teams discovered AI that finds leads, writes emails and books meetings on its own. Startups selling AI sales reps raised money fast, and every
    sales leader wanted to see one.
  term: ai sales agents
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/ai-sales-agents/ai-sales-agents.csv
ed052p:
  type: pp_cagr
  title: 'Is the AI sales agents

    market still growing fast?'
  lead: ''
  condition: Yes, but agents must move from pilots to whole sales teams, and buyers must trust them to contact prospects in their name. They must also keep
    proving pipeline and revenue, and keep their share as CRM suites bundle agents into their plans.
  note:
  - We compared forecasts from MarketsandMarkets, Grand View and Salesforce with the leaders’ growth
  - We allowed for bundling and inbox limits, and all the sources we used are listed at the end of the report
  size: 2.3
  cagr: 32
  y0: 2026
