ed007p:
  type: pp_radar
  title: 'Who is in electric two-wheeler,

    and who stays outside?'
  TL:
    name: VanMoof
    src: ../../assets/logos/pp_live/electric-two-wheeler/s01-00.png
    text: makes pedal-assist electric bicycles, which are electrified two-wheelers but excluded from powered scooter and motorcycl
  TR:
    name: Bird
    src: ../../assets/logos/pp_live/electric-two-wheeler/s01-02.png
    text: operates stand-up shared kick ~~ scooters, which are micromobility devices excluded from the powered two-wheeler definition
  BL:
    name: Yamaha Motor
    src: ../../assets/logos/pp_live/electric-two-wheeler/s01-09.png
    text: develops electric scooters and motorcycles alongside a much larger combustion motorcycle and powersports portfolio
  BR:
    name: Honda
    src: ../../assets/logos/pp_live/electric-two-wheeler/s01-10.png
    text: sells electric scooters and motorcycles, but most two-wheeler revenue still comes from combustion- engine vehicles
