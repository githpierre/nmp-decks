    text: Battery costs keep falling globally
    impact: 1.5
  - year: '2022'
    text: India tightens EV battery safety
    impact: 1.0
  - year: '2022'
    text: Fuel prices sharpen running-cost savings
    impact: 1.0
  - year: '2023'
    text: Incumbents widen electric scooter portfolios
    impact: 1.5
  - year: '2023'
    text: Financing expands for electric motorcycles
    impact: 1.0
  - year: '2024'
    text: EMPS bridges India subsidy transition
    impact: 1.5
  - year: '2024'
    text: PM E-DRIVE renews national incentives
    impact: 3.0
  - year: '2024'
    text: Vietnam electric scooter sales accelerate
    impact: 1.5
  - year: '2025'
    text: Vietnam passes twenty percent electric
    impact: 2.0
  - year: '2025'
    text: Africa fleet financing unlocks adoption
    impact: 1.5
  - year: '2025'
    text: Bolt fleet electrification validates savings
    impact: 1.0
  - year: '2025'
    text: Incumbent competition improves affordability
    impact: 1.0
  - year: '2026'
    text: India extends PM E-DRIVE to 2028
    impact: 2.0
  - year: '2026'
    text: India registrations surge in first half
    impact: 2.0
  - year: '2026'
    text: Hanoi low-emission zone starts pressure
    impact: 1.5
  - year: '2026'
    text: Legacy brands capture most growth
    impact: 2.0
  note:
  - We kept the events we believe pushed electric two wheeler forward the most
  - Ratings are our estimates, with all the sources at the end of the report
