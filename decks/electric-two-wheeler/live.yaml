    impact: 1.0
  - year: '2017'
    text: Connected scooters improve fleet economics
    impact: 1.0
  - year: '2018'
    text: India localizes electric scooter startups
    impact: 1.5
  - year: '2019'
    text: FAME II expands buyer incentives
    impact: 3.0
  - year: '2019'
    text: Battery swapping gains policy attention
    impact: 1.0
  - year: '2020'
