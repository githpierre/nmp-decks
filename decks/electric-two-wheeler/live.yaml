ed148p:
  title: 'What pushed the electric two-wheeler

    market forward, year after year?'
  events:
  - year: '2006'
    text: Lithium scooters prove daily commuting
    impact: 1.0
  - year: '2009'
    text: China scale cuts electric scooter costs
    impact: 1.5
  - year: '2011'
    text: Urban smog drives cleaner mobility policy
    impact: 1.0
