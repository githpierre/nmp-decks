ed148p:
  title: 'What pushed the AI in oncology

    market forward, year after year?'
  events:
  - year: '2012'
    text: Deep learning transforms medical imaging
    impact: 1.0
  - year: '2014'
    text: Flatiron standardizes oncology RWD
    impact: 1.5
  - year: '2015'
    text: Precision oncology expands genomic testing
    impact: 1.5
  - year: '2016'
    text: Cloud compute lowers model training costs
    impact: 1.0
