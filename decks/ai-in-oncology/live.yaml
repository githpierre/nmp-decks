  - year: '2023'
    text: FDA starts Oncology AI Program
    impact: 2.5
  - year: '2023'
    text: Foundation models reach pathology research
    impact: 2.0
  - year: '2023'
    text: Trial matching becomes more automated
    impact: 1.5
  - year: '2024'
    text: Multimodal models link cancer data
    impact: 2.0
  - year: '2024'
    text: More digital pathology systems clear
    impact: 1.5
  - year: '2024'
    text: AI-guided radiotherapy planning improves
    impact: 1.5
  - year: '2025'
    text: Oncology AI governance becomes explicit
    impact: 1.0
  - year: '2025'
    text: AI reimbursement debate reaches Medicare
    impact: 1.0
  - year: '2025'
    text: Payers automate oncology prior authorization
    impact: 1.0
  - year: '2026'
    text: FDA clears RadOncAI planning software
    impact: 2.0
  - year: '2026'
    text: Tempus expands tumor-only companion testing
    impact: 2.0
  - year: '2026'
    text: Tempus trains multimodal cancer models
    impact: 2.0
  - year: '2026'
    text: Flatiron launches Telescope AI platform
    impact: 2.0
  - year: '2026'
    text: Flatiron expands AI data globally
    impact: 1.5
  - year: '2026'
    text: FDA clears more oncology AI devices
    impact: 2.5
  - year: '2026'
    text: Cancer AI enters policy mainstream
    impact: 1.5
  note:
  - We kept the events we believe pushed ai in oncology forward the most
  - Ratings are our estimates, with all the sources at the end of the report
