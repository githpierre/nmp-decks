ed007p:
  type: pp_radar
  title: 'Which companies really

    belong in AI in oncology?'
  TL:
    name: Freenome
    src: ../../assets/logos/pp_live/ai-in-oncology/s01-00.png
    text: it applies machine learning to blood based cancer detection, but it is primarily a diagnostics company rather than AI
  TR:
    name: Moderna
    src: ../../assets/logos/pp_live/ai-in-oncology/s01-02.png
    text: it develops medicines including cancer vaccines and uses AI internally, but it does not sell an oncology AI product
  BL:
    name: Waiv
    src: ../../assets/logos/pp_live/ai-in-oncology/s01-09.png
    text: it sells pathology derived precision oncology tests, placing it between computational pathology and oncology decision
  BR:
    name: Ibex Medical Analytics
    src: ../../assets/logos/pp_live/ai-in-oncology/s01-10.png
    text: its pathology Al is heavily oncology focused, yet the product category is digital pathology rather than oncology
  caption:
  - Distance to the center reflects how central each company is to AI in oncology
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
