    text: FDA approves first tumor-agnostic therapy
    impact: 2.0
  - year: '2018'
    text: Roche buys Flatiron for oncology data
    impact: 2.0
  - year: '2018'
    text: AI imaging clearances accelerate
    impact: 1.5
  - year: '2019'
    text: Digital pathology expands cancer AI inputs
    impact: 1.5
  - year: '2020'
    text: Covid disrupts oncology trial operations
    impact: 1.0
  - year: '2020'
    text: Multimodal oncology datasets grow rapidly
    impact: 1.5
  - year: '2021'
    text: FDA authorizes Paige Prostate AI
