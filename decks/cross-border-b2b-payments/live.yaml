ed148p:
  title: 'What pushed the cross-border payments

    market forward, year after year?'
  events:
  - year: '2017'
    text: Swift gpi starts tracked global transfers
    impact: 2.5
  - year: '2017'
    text: Standard Chartered tracks global transfers
    impact: 1.0
  - year: '2018'
    text: Swift gpi reaches quarter of traffic
    impact: 2.0
  - year: '2018'
    text: Swift tests fee transparency and error checks
    impact: 1.0
  - year: '2019'
    text: Swift extends live gpi corporate tracking
    impact: 1.5
  - year: '2019'
    text: Swift gpi surpasses $40 trillion transferred
    impact: 1.5
