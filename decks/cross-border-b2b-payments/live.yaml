ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'Cross-border payment searches climb

    as stablecoins promise faster transfers'
  date: 0 Lately.
  expl: Sending money between countries is still slow and costly for many businesses. Stablecoins and new payment networks promised near instant transfers,
    the US passed its first stablecoin law, and companies went looking for cheaper ways to pay abroad.
  term: cross border b2b payments
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/cross-border-b2b-payments/cross-border-b2b-payments.csv
ed052p:
  type: pp_cagr
  title: 'Is the cross-border payments

    market still growing fast?'
  lead: ''
  condition: Yes, but the market must move business payments from slow correspondent banking to instant rails and stablecoin settlement, and still earn
    a margin as FX spreads keep shrinking for every corporate client.
  note:
  - We compared forecasts from Fortune Business Insights, Polaris Market Research, Allied Market and Market Research (HHeuristics)
  - We adjusted each one to our market definition and built a realistic range, and all the sources are included at the end of the report
  size: 160
  cagr: 7
  y0: 2026
