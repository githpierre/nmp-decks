  - year: '2025'
    text: Wise enables Zempler international payments
    impact: 1.5
  - year: '2025'
    text: Swift completes ISO 20022 payment migration
    impact: 2.5
  - year: '2025'
    text: G20 report highlights unmet speed targets
    impact: 1.5
  - year: '2025'
    text: Regulators push global rail interoperability
    impact: 1.0
  - year: '2026'
    text: FSB launches national improvement plans
    impact: 1.5
  - year: '2026'
    text: BIS tests atomic multicurrency transfers
    impact: 2.5
  - year: '2026'
    text: Thailand licenses Wise multicurrency accounts
    impact: 1.5
  - year: '2026'
    text: Nuvei deal targets global B2B reach
    impact: 1.0
  - year: '2026'
    text: Visa shows stablecoin business payment rise
    impact: 1.5
  - year: '2026'
    text: Visa deploys cross-border stablecoin funding
    impact: 2.0
  note:
  - We kept the events we believe pushed cross border b2b payments forward the most
  - Ratings are our estimates, with all the sources at the end of the report
