ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more shoppers search

    for eco-friendly brands to check claims'
  date: Recently.
  expl: Shoppers want products that are good for the planet, but they no longer trust vague claims. New rules against greenwashing, viral exposés and TikTok
    reviews pushed people to check brands themselves. So “eco-friendly brand” became a search people type before they buy.
  term: circular economy
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/circular-economy/circular-economy.csv
ed052p:
  type: pp_cagr
  title: 'How much bigger can

    the circular economy get?'
  lead: ''
  condition: To get that big, the market must make reuse cheaper than buying new, as resale, rental, and repair win buyers from new products every year.
    It must also make recycled materials match the price and quality of new ones, so that factories sign long contracts and new plants can stay open.
  note:
  - We compared forecasts from Zion Market Research, The Business Research Company, Dimension Market Research and DataM
  - We adjusted each one to our market definition and built a realistic range, and all our sources are listed at the end of the report
  size: 560
  cagr: 11
  y0: 2026
