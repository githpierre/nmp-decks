ed142p:
  title: 'What are the biggest threats

    to the circular economy?'
  events:
  - odds: 45
    impact: 3
    text: Virgin plastic stays cheaper than recycled plastic, so brands drop recycled content goals
  - odds: 40
    impact: 2
    text: Big brands like Coca-Cola and Unilever cut circular packaging pledges to save money
  - odds: 35
    impact: 3
    text: The EU delays or weakens its packaging and ecodesign rules after industry pushback
  - odds: 35
    impact: 2
    text: Chemical recycling plants like those of Brightmark fail or close after missing output targets
  - odds: 35
    impact: 2
    text: Reuse and refill startups like Loop fail to cut costs and investors stop funding them
  - odds: 30
    impact: 1
    text: A greenwashing lawsuit over recycling claims hurts trust in recycled and repair labels
  - odds: 25
    impact: 2
    text: A Ninth Circuit appeal or NAW's Colorado suit blocks packaging EPR laws, delaying producer fees for recyclers
  - odds: 20
    impact: 1
    text: China and Southeast Asia tighten waste import rules and recyclers lose export markets for scrap
  note:
  - We listed the events that could slow circular economy down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
