ed142p:
  title: 'What are the biggest

    threats to legal AI?'
  events:
  - odds: 30
    impact: 3
    text: Google, OpenAI and Anthropic sell legal AI directly to law firms, squeezing Harvey and Legora
  - odds: 20
    impact: 2
    text: Dozens of legal AI tools sell the same features, and prices collapse across the market
  - odds: 20
    impact: 3
    text: Legal AI funding dries up after Harvey's huge rounds, leaving smaller startups unable to raise
  - odds: 15
    impact: 2
    text: Law firms keep billing by the hour, so AI tools that cut hours see slow adoption
  - odds: 12
    impact: 2
    text: An AI tool causes a court disaster with fake citations that costs a client its case
  - odds: 10
    impact: 1
    text: Bar associations and courts pass strict rules that limit how lawyers can use AI tools
  - odds: 8
    impact: 2
    text: A large leak of confidential client files at a legal AI vendor makes law firms pull back
  - odds: 5
    impact: 2
    text: Thomson Reuters and LexisNexis cut off content licenses to Harvey and other legal AI startups
  note:
  - We listed the events that could slow legal ai down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
