ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more lawyers look up

    legal AI tools, and few people noticed'
  date: Lately.
  expl: Law firms and in-house teams found out AI can read contracts and draft memos in minutes. After a few legal AI startups raised big rounds, lawyers
    and clients went looking for tools they could try.
  term: legal ai
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/legal-ai/legal-ai.csv
ed052p:
  type: pp_cagr
  title: 'How much bigger

    can legal AI get?'
  lead: ''
  condition: To get that big, the market must turn AI into paid legal work, as firms and legal teams move budgets from hours to software every year. It
    must also keep AI errors out of courts, win the trust of clients and regulators, and resist cheap general AI tools that do part of the job.
  note:
  - We compared forecasts from Technavio, Fortune Business Insights, The Business Research Company and Mordor
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: 3.2
  cagr: 20
  y0: 2026
