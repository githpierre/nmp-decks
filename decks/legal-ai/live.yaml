    text: iManage stores the files of many large law firms and is adding AI, but it remains conventional document management software
  TR:
    name: OpenAT
    src: ../../assets/logos/pp_live/legal-ai/s01-01.png
    text: is used by many lawyers to draft and summarize documents, but ChatGPT remains a general assistant with no legal focus
