ed052p:
  type: pp_cagr
  title: 'What growth can the insurtech

    market realistically expect?'
  lead: ''
  condition: To hit this growth, insurers must move their core systems to the cloud and let AI do real work in underwriting and claims, not just pilots.
    Insurtechs must also keep their losses under control and prove that AI cuts costs without breaking rules on fairness.
  note:
  - We compared forecasts from Precedence, The Business Research Company, Fortune Business Insights and IMARC
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: 50
  cagr: 12
  y0: 2026
