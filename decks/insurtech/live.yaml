ed007p:
  type: pp_radar
  title: 'What is actually included

    in the insurtech market?'
  TL:
    name: AXA
    src: ../../assets/logos/pp_live/insurtech/s01-00.png
    text: launched Kamet in 2016 to build insurtech startups, but it remains a large traditional insurer where tech plays a support role
  TR:
    name: Revolut
    src: ../../assets/logos/pp_live/insurtech/s01-02.png
    text: lists insurance among the products in its app, but it is a neobank where cover is a small extra next to cards and trading
  BL:
    name: Progressive
    src: ../../assets/logos/pp_live/insurtech/s01-09.png
    text: sells auto cover through over 30,000 independent agents, yet its Snapshot program prices cover using real driving data
  BR:
    name: Oscar Health
    src: ../../assets/logos/pp_live/insurtech/s01-10.png
    text: was founded as a tech- first health insurer, but with $11 billion in revenue it now runs much like any large ACA plan
  caption:
  - Distance to the center reflects how much technology changes the way insurance is priced, sold or managed, not just marketed
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
