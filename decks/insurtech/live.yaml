ed142p:
  title: 'What could slow

    insurtech down?'
  events:
  - odds: 45
    impact: 3
    text: Progressive and GEICO cut car insurance prices hard, squeezing Root, Lemonade and other insurtech carriers
  - odds: 35
    impact: 3
    text: A mega disaster bigger than the Los Angeles fires wipes out capital at insurtech carriers and MGAs
  - odds: 30
    impact: 2
    text: Allianz, State Farm and other large insurers build their own AI agents and stop buying from startups
  - odds: 25
    impact: 2
    text: A wave of AI-made fake photos and documents drives up claims fraud losses for digital insurers
  - odds: 20
    impact: 3
    text: Reinsurers pull capacity from MGAs after weak results, forcing more insurtech MGAs to close or sell
  - odds: 15
    impact: 2
    text: Insurtech funding crashes as investors back only AI startups, leaving full-stack carriers unable to raise
  - odds: 10
    impact: 2
    text: State regulators or the EU ban AI in insurance pricing and claims, forcing insurtechs to rebuild
  - odds: 10
    impact: 2
    text: Google, Amazon or OpenAI start selling insurance directly and take customers from Lemonade and Root
  note:
  - We listed the events that could slow insurtech down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
