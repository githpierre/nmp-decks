ed160:
  6: Drug makers took about 48% of the capital raised since 2024, ahead of preventive health platforms with about 34%
  7: 140 of the 156 rounds since 2024 disclosed an amount, and the median disclosed round was $10M
  8: US startups closed 90 of the 156 rounds and took $3.2B, about 65% of the money, far ahead of Sweden
  9: 12 rounds of $100M or more made up about 54% of all the capital raised in the market since 2024
  10: The $700M Series C of Neko Health is the biggest round since 2024, ahead of the $435M raised by NewLimit in 2026
  11: Seed was the most common round, with 64 of the 156 rounds, ahead of Series A with 32 and Series B with 19
  note: We drew these insights from our tracker of 156 longevity equity rounds announced since January 2024, worth about $4.9B
ed162:
  6: 'BEFORE



    Before 2024, the largest checks went to a few aging-biology labs such as Altos Labs, Retro Biosciences and NewLimit, often backed by tech billionaires.'
  7: 'AFTER



    Since 2024, 156 rounds raised $4.9B. Scan clinics and test memberships such as Neko Health and Function take the biggest checks, while aging-drug startups multiply in the US.'
  note: We used our tracker of longevity equity rounds, complete from January 2024, and company releases and the press
