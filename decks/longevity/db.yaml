ed160:
  6: Drug makers took about 34% of the capital raised since 2024, just ahead of consumer longevity brands with about 31%
  7: 148 of the 164 rounds since 2024 disclosed an amount, and the median disclosed round was $10M
  8: US startups closed 97 of the 164 rounds and took $5.1B, about 74% of the money, far ahead of Sweden
  9: 17 rounds of $100M or more made up about 65% of all the capital raised in the market since 2024
  10: The $900M late-stage of Oura is the biggest round since 2024, ahead of the $700M raised by Neko Health in 2026
  11: Seed was the most common round, with 64 of the 164 rounds, ahead of Series A with 32 and Series B with 19
  note: We drew these insights from our tracker of 164 longevity equity rounds announced since January 2024, worth about $6.9B
ed162:
  6: 'BEFORE



    Before 2024, the largest checks went to a few aging-biology labs such as Altos Labs, Retro Biosciences and NewLimit, often backed by tech billionaires.'
  7: 'AFTER



    Since 2024, 164 rounds raised $6.9B. Wearables and scan clinics such as Oura and Neko Health take the biggest checks, while aging-drug startups multiply in the US.'
  note: We used our tracker of longevity equity rounds, complete from January 2024, and company releases and the press
