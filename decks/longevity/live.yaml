ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  csv: assets/trends/longevity/longevity.csv
  term: longevity
  title: 'Now, more and more people

    are googling longevity'
  date: Recently.
  expl: Longevity left the lab and entered the gym. Bryan Johnson and Peter Attia turned it into a daily routine, Netflix shows and podcasts made “healthspan” a household word, and clinics started selling it. People now google longevity the way they used to google diets.
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
ed052p:
  type: pp_cagr
  title: 'Where could the longevity

    market be in ten years?'
  size: 29
  cagr: 8
  y0: 2026
  lead: 'To get there, '
  condition: the market must win FDA recognition of aging as treatable, prove senolytics in late-stage trials, and secure broad insurer reimbursement. It also needs faster adoption in Asia and a major tech firm to turn cell-reprogramming advances, like the Retro Biosciences and OpenAI work, into products.
  note:
  - We compared forecasts from Grand View, Fortune Business Insights, Straits, Technavio and IMARC
  - We adjusted each one to our definition of the market, and all our sources are at the end of the report
