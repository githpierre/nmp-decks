ed007p:
  type: pp_radar
  title: 'Who is in the longevity

    market, and who is not?'
  caption:
  - Distance to the center reflects how directly a company targets the biology of aging, rather than general health or wellness
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  TL:
    name: Function Health
    src: ../../assets/logos/pp_live/longevity/s01-00.png
    text: runs over 100 lab tests to catch disease early, which is valuable prevention but does not target the biology of aging
  TR:
    name: AG1
    src: ../../assets/logos/pp_live/longevity/s01-02.png
    text: sells a daily greens supplement with a strong wellness positioning, but none of its products are designed or tested to slow aging
  BL:
    name: Loyal
    src: ../../assets/logos/pp_live/longevity/s01-10.png
    text: is developing drugs to extend lifespan and has made real progress with the FDA, but for now its patients are dogs, not people
  BR:
