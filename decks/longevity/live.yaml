ed142p:
  title: 'What could slow

    longevity down?'
  events:
  - odds: 50
    impact: 3
    text: The FDA refuses to call aging a disease, so rapamycin and similar drugs lack an approval path
  - odds: 40
    impact: 2
    text: Doctors prescribe GLP-1 drugs from Lilly and Novo Nordisk as longevity care, absorbing demand from smaller startups
  - odds: 35
    impact: 2
    text: Altos Labs and Retro Biosciences spend billions without a drug in Phase 2, cooling investor interest
  - odds: 30
    impact: 2
    text: The FTC fines supplement brands like those selling NAD+ boosters for health claims without clinical proof
  - odds: 25
    impact: 1
    text: Consumers drop $500 longevity memberships during a downturn, so clinics like Fountain Life struggle to keep members
  - odds: 20
    impact: 3
    text: A large metformin or senolytic trial shows no lifespan benefit and investors pull back from the field
  - odds: 20
    impact: 2
    text: Function Health and Superpower face state lab rules that limit direct-to-consumer blood testing without a doctor
  - odds: 10
    impact: 3
    text: A death tied to an unapproved gene therapy at an offshore clinic triggers public backlash against longevity
  note:
  - We listed the events that could slow longevity down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
