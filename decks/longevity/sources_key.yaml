rows:
- name: "NewLimit, $435M\nSeries C"
  why: NewLimit's own release on its Founders Fund-led round and the move of its liver program toward people
  how: We used it for the round, the $3.1B value and the 2027 trial plan. It also framed what drug startups promise.
  url: https://blog.newlimit.com/p/newlimit-raises-435m-led-by-founders
- name: "Neko Health,\n$700M Series C"
  why: Neko Health's release on its US launch round, its members and its repeat bookings
  how: We used it for the 350,000 sign-ups and 75% prepaid repeat scans. It also anchored the preventive scan story.
  url: https://www.nekohealth.com/gb/en/press/neko-health-raises-usd700m-series-c-ahead-of-us-launch
- name: "Neko Health,\nyear three data"
  why: Neko Health's report on 92,002 scans and the share of healthy members with a hidden severe finding
  how: We used it for the ninefold rise in scans and the 1 in 100 rate. It also backed the pain points of healthy adults.
  url: https://www.nekohealth.com/us/en/press/neko-data-story-year-three
- name: "Life Biosciences,\nfirst human data"
  why: The company's report on the first patients treated with its partial reprogramming therapy ER-100
  how: We used it for the first cell-reset trial in people. It also set how early the drug side still is.
  url: https://www.lifebiosciences.com/life-biosciences-announces-first-in-human-data-from-ongoing-phase-1-trial-evaluating-er-100-in-optic-neuropathies/
- name: "XPRIZE, 20 Healthspan\nfinalists"
  why: XPRIZE's announcement of the 20 finalist teams and 10 milestone awards of its $101M healthspan prize
  how: We used it for the funnel from 600 teams to 10. It also showed how hard proof of healthy years is.
  url: https://www.xprize.org/news/20-healthspan-finalist-teams-advance-in-the-race-to-extend-healthy-aging
- name: "Loyal, $100M\nfor LOY-002"
  why: Loyal's release on its Series C to bring the first lifespan drug for dogs to market
  how: We used it for the round and the STAY trial. It also showed how a lifespan claim can reach a regulator.
  url: https://loyal.com/posts/100m-for-first-longevity-drug
- name: "Stanford, biological\nage tests"
  why: Stanford Medicine's review of what consumer biological-age tests can and cannot tell you
  how: We used it for the lack of FDA-approved aging clocks. It also framed the risks of test brands.
  url: https://news.stanford.edu/stories/2026/09/biological-age-tests-tips-advice
- name: "Retro Biosciences,\n2026 fundraise"
  why: Retro's own update on its raise and its first human study of a cell-renewal drug
  how: We used it for its move into the clinic. It also placed Retro among the best-funded aging-biology labs.
  url: https://www.retro.bio/blog/fundraise-2026
- name: "Function, $450M\ngrowth financing"
  why: The release on Function's General Catalyst financing and its scale in members and lab tests
  how: We used it for the 500,000 members and 100 million tests. It also backed our view of the testing leaders.
  url: https://www.prnewswire.com/news-releases/function-secures-450-million-growth-financing-from-general-catalysts-customer-value-fund-cvf-302838766.html
- name: "Function, $2.5B\nvaluation"
  why: Function's own announcement of its $298M round and its medical intelligence lab
  how: We used it for the $2.5B value. It also dated when testing memberships reached unicorn scale.
  url: https://www.functionhealth.com/article/function-announcement
- name: "Prenuvo, 200,000\nscans and biobank"
  why: Prenuvo's release on its research network built on more than 200,000 whole-body MRI scans
  how: We used it for the doubling of scans since 2024. It also backed the rise of scan clinics.
  url: https://www.prnewswire.com/news-releases/prenuvo-launches-research-network-to-track-disease-patterns-with-whole-body-mri-302892100.html
- name: "Altos Labs\nlaunch"
  why: The release on Altos Labs' launch with $3B to work on cellular rejuvenation
  how: We used it for the 2022 start of big money in aging biology. It also framed the before and after of funding.
  url: https://www.prnewswire.com/news-releases/altos-labs-launches-with-the-goal-to-transform-medicine-through-cellular-rejuvenation-programming-301463541.html
- name: "UNITY, ASPIRE\ntrial results"
  why: Unity Biotechnology's filing on the Phase 2b eye trial that missed its main goal
  how: We used it for the trial setback. It also anchored the startup killers chapter.
  url: https://www.sec.gov/Archives/edgar/data/1463361/000095017025043483/ubx-ex99_1.htm
- name: "BioAge, Q3 2026\nresults"
  why: BioAge Labs' third-quarter 2026 results, with its collaboration revenue and operating loss
  how: We used it for the cost of a public aging-biology platform. It also backed the value creation gap.
  url: https://bioagelabs.gcs-web.com/news-releases/news-release-details/bioage-labs-reports-third-quarter-2026-financial-results-and
- name: "FDA, regenerative\nmedicine warning"
  why: The FDA's information for patients on unapproved stem cell and regenerative products
  how: We used it for the harm tied to unapproved cell products. It also framed the risks of longevity clinics.
  url: https://www.fda.gov/vaccines-blood-biologics/consumers-biologics/important-patient-and-consumer-information-about-regenerative-medicine-therapies
- name: "ARPA-H, more\nhealthy years"
  why: The US health research agency's program to add healthy years to Americans' lives as they age
  how: We used it for public money flowing into healthspan trials. It also backed the growth drivers.
  url: https://arpa-h.gov/news-and-events/research-teams-add-more-healthy-years-americans-lives-they-age
- name: "Chugai and Gero,\nAI target deal"
  why: Chugai's release on its research deal with Singapore-based Gero, worth up to $250M
  how: We used it for the Asian leader on our world map. It also showed how pharma buys aging biology.
  url: https://www.chugai-pharm.co.jp/english/news/detail/20250707160000_1156.html
- name: "Everlab, AU$65M\nSeries A"
  why: Everlab's release on its round to bring preventive testing and doctors to more Australians
  how: We used it for the Australian leader on our world map. It also backed the rise of clinics outside the US.
  url: https://www.everlab.com.au/press/everlab-raises-au-65m-series-a-to-make-world-class-preventative-healthcare-something-everyone-can-access
- name: "Maximize, global\nlongevity market"
  why: Maximize Market Research's report on the global longevity market and its segments
  how: We used it for the upper growth case. It also set the scope of diagnostics, drugs and clinics.
  url: https://www.maximizemarketresearch.com/market-report/global-longevity-market/330520/
- name: "Fitt Insider,\nEternal closes clinics"
  why: Fitt Insider's report on Eternal closing its New York and San Francisco longevity clinics
  how: We used it for a recent clinic failure. It also showed how hard the clinic model is to scale.
  url: https://insider.fitt.co/eternal-closes-its-clinics/
