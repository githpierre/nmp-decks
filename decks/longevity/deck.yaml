- id: ed210
  left: A REGULAR LONGEVITY STARTUP
  logo: newlimit
  note:
  - We used NewLimit’s Series C release and its updates on aging-cell research and manufacturing.
  - We use a fictional baseline for the left column, not a measured average for this market.
  right: NEWLIMIT
  rows:
  - - They seek a single age-related disease without an aging thesis
    - They design medicines to restore youthful function in old cells
  - - They rely on mouse results before studying old human cells
    - They found a prototype that resets age in human liver cells
  - - They choose drug targets without tools to map cell changes
    - They built AI and gene tools to discover age-reset drugs
  - - They confine their work to one type of aging body tissue
    - They expanded aging work from liver to blood vessel cells
  - - Their early prototypes stay hard to produce at large scale
    - They scaled up manufacturing of their lead asset 100X
  - - They use small rounds to fund one early laboratory program
    - They closed a $435M Series C led by Founders Fund
  - - They imply human benefit from only laboratory test results
    - They still plan their first human clinical study in 2027
  - - They build a narrow pipeline tied to one laboratory target
    - They also work on metabolic, blood vessel and immune health
  section: Startup strategies
  src: 210
  title: How NewLimit brought aging reprogramming toward trials
  type: contrast
  logo_src: ../../assets/logos/newlimit.png
- id: ed211
  left: A REGULAR LONGEVITY STARTUP
  logo: neko-health
  note:
  - We used Neko Health’s funding release and its report on members coming back for new scans.
  - We use a fictional baseline for the left column, not a measured average for this market.
  right: NEKO HEALTH
  rows:
  - - They buy basic screening tools from outside device suppliers
    - They build their own scanners, software and member journey
  - - They offer separate tests with no joined-up health picture
    - They combine body scans, blood work and wearable insights
  - - They send results online with little personal explanation
    - They review results on site with a trained medical expert
  - - They sell first-time health checks without a return plan
    - They say 75% of members book and prepay the next scan
  - - They measure uptake but never study changes after a visit
    - They tracked seven markers in 9,138 returning members
  - - They claim every improved score proves years of extra life
    - They label their findings as observational, not a trial
  - - They stay focused on one city to keep daily costs lower
    - They expanded across Sweden and the UK, then to the US
  - - They fund each new site before proving demand at scale
    - They raised $700M after serving over 100,000 members
  section: Startup strategies
  src: 211
  title: How Neko Health made preventive scans a repeat business
  type: contrast
  logo_src: ../../assets/logos/neko-health--symbol.png
- id: ed212
  left: A REGULAR LONGEVITY STARTUP
  logo: function-health
  note:
  - We used Function’s membership page, its Ezra deal and its July growth financing release.
  - We use a fictional baseline for the left column, not a measured average for this market.
  right: FUNCTION HEALTH
  rows:
  - - They offer a narrow lab panel only when people feel ill
    - They sell a membership covering over 160 annual lab tests
  - - They collect one set of results without follow-up testing
    - They include midyear retests to track changes over time
  - - They leave patients to decode raw lab numbers alone
    - They have clinicians review each result and flag issues
  - - They stop after a report without any next-step plan
    - They give members clear, tailored plans based on results
  - - They depend on a small set of labs in major cities
    - They offer testing at over 2,000 Quest locations in the US
  - - They treat blood panels as separate from body scans
    - They added MRI and CT access after buying Ezra in 2025
  - - They rely on complex insurance bills for every blood draw
    - They offer direct access for $365 a year with no insurance
  - - They need a new small raise for each added service
    - They secured $450M in growth funding in July 2026
  section: Startup strategies
  src: 212
  title: How Function Health built a repeat testing platform
  type: contrast
  logo_src: ../../assets/logos/function-health--symbol.png
- id: ed213
  left: A REGULAR LONGEVITY STARTUP
  logo: loyal
  note:
  - We used Loyal’s veterinary program and STAY trial design, plus its Series C announcement.
  - We use a fictional baseline for the left column, not a measured average for this market.
  right: LOYAL
  rows:
  - - They build pills meant to treat a single illness in dogs
    - They target aging and aim to extend healthy years in dogs
  - - They pick younger animals with easier short-term signals
    - They test LOY-002 in senior dogs aged ten years or older
  - - They test a new product in only a few animals on site
    - They enrolled 1,300 dogs across 70 veterinary sites
  - - They make claims without a fair untreated comparison
    - They run a double-blind study with a placebo group
  - - They count only lab markers to suggest a longer lifespan
    - They track lifespan, health and quality of life in STAY
  - - They start trials without a clear path for drug review
    - They pursue an FDA path with staged safety and drug data
  - - They design medicine with one dog breed as the only user
    - They built LOY-002 for senior dogs that weigh over 14 lb
  - - They raise limited cash while waiting on long trial results
    - They closed a $100M Series C to advance LOY-002
  section: Startup strategies
  src: 213
  title: How Loyal made pet lifespan drugs an FDA program
  type: contrast
  logo_src: ../../assets/logos/loyal.png
- id: ed214
  left: A REGULAR LONGEVITY STARTUP
  logo: life-biosciences
  note:
  - We used Life Biosciences’ Phase 1 reports and trial registry for treatment and follow-up.
  - We use a fictional baseline for the left column, not a measured average for this market.
  right: LIFE BIOSCIENCES
  rows:
  - - They pursue symptoms of eye disease without an aging thesis
    - They target age-linked loss of cell function in the eye
  - - They develop a standard drug without a cell-reset concept
    - They use three factors to reset patterns of gene activity
  - - They base the whole pitch on results in laboratory animals
    - They first dosed a human in their Phase 1 trial in 2026
  - - They start large efficacy studies before testing basic safety
    - They began by testing safety in glaucoma and optic damage
  - - They follow up briefly and miss any late safety problems
    - They plan 15 clinic visits and monitoring out to year five
  - - They call early age scores proof that people live longer
    - They reported tolerability in three people through day 56
  - - They skip clinical function tests in favor of age scores
    - They saw early visual-field signals in two of three people
  - - They build one drug with no use in other aging tissues
    - They plan to apply the same platform in other organs
  section: Startup strategies
  src: 214
  title: How Life Biosciences took cell rejuvenation into people
  type: contrast
  logo_src: ../../assets/logos/life-biosciences.png
