  note: We grouped the market into phases, from the first aging biotechs to today's clinics and memberships. We used trial records, funding history and consumer product launches.
  src: 54
  t:
    6: '2013 - 2017


      Google launched Calico and the first aging biotechs appeared, but science stayed in mice and buyers did not exist yet'
    7: '2018 - 2021


      Senolytic and NAD trials started in people, but early results were weak and some companies like Unity stumbled'
    8: '2022 - 2024


      Altos and Retro raised billions, and blood test memberships took off, but few results showed real health gains'
    9: 'TODAY


      Consumers pay for tests, scans and clinics, but most products still lack proof that they add healthy years of life'
    10: '?


      A first approved aging drug, even for dogs, could open the way, but only if trials show health gains and payers follow'
- id: ed055
  type: x/old_problems_now_behind_us
  section: Pain points
  title: Which old problems are now behind us?
  note: We treat these as problems that recent funding, products and regulator decisions have removed. They do not prove that any product adds years of healthy life.
  src: 55
  t:
    5: Aging research lived on small academic grants and few investors would fund it
    7: Altos, Retro and NewLimit now raise hundreds of millions to billions of dollars from top funds and tech founders
    8: Full lab checkups were ordered only by a doctor and cost a lot per test
    10: Memberships like Function now bundle over 100 lab tests a year for a few hundred dollars, with no doctor visit
    11: No regulator had ever looked at a drug meant to extend lifespan
    13: The FDA agreed Loyal’s dog lifespan drug has a reasonable expectation of working, a first for any lifespan drug
    14: Biological age could only be measured in a few research labs
    16: Home kits now estimate biological age from a few drops of blood or saliva, mailed back to a lab for results
    17: Whole-body scans were only done in hospitals for sick patients
    19: Clinics like Prenuvo and Neko now sell full-body scans to healthy adults, and Prenuvo alone is past 200,000 scans
    20: Aging was seen as a fate nobody could change, a sci-fi topic
    22: Netflix series, podcasts and big funds have made longevity a mainstream consumer topic that people now google daily
