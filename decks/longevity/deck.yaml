- id: ed132
  type: x/newcomers_often_miss_here
  section: Market challenges
  title: What do newcomers often miss here?
  note: We compared FDA drug and supplement rules with clinical reports and independent research on screening and age tests. Early signals do not establish longer healthy lives.
  src: 132
  t:
    17: An aging drug must still treat a named disease to win any FDA approval
    21: Promising animal results do not settle human safety, clinical benefit or durability
    23: Supplements reach buyers before the FDA reviews their safety claims
    25: A lower biological-age score does not prove that anyone gains more healthy years
    28: Whole-body scans can surface findings that lead to more tests with unclear benefit
- id: ed133
  type: x/has_held_back_market_growth
  section: Market challenges
  title: What has held back market growth so far?
  note: We grouped the field using public trial, regulatory and company milestones. These broad phases capture the shift from lab concepts toward testing in people, not proof of lifespan extension.
  src: 133
  t:
    6: '2010 - 2017


      Aging studies moved beyond labs, but drugs had no aging indication and no agreed way to measure added healthy years.'
    7: '2018 - 2021


      Age clocks and drug ideas spread, but regulators still lacked aging markers that could stand in for real health outcomes.'
    8: '2022 - 2024


      Well-funded cell-reset programs and consumer testing expanded, yet most treatments stayed preclinical and preventive scans lacked proof of long-term benefit.'
    9: 'TODAY


      Startups can sell wellness tests now, while medicines must still show patient benefit and a clear safety case in trials.'
    10: '2025 - 2026


      Funding and first human trials grew, but short studies cannot prove added years of health.'
