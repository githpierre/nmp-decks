- id: ed023
  type: x/learning_truths_have_flipped
  section: Market definition
  title: Which longevity truths have flipped?
  note: These are market shifts we see in funding, products and regulation in recent years. They are not formal industry rules, but they recur across the evidence.
  src: 23
  t:
    6: Longevity used to be a fringe topic for a few biohackers
    8: Now it draws record funding and runs its own clinics in big cities
    10: Aging biology used to be studied only in university labs
    12: Now startups backed by billions run their own aging research
    14: Lab tests used to be ordered only by a doctor
    16: Now people buy 100 lab tests at once and see results in an app
    18: Anti-aging used to mean creams and cosmetics for the skin
    20: Now it means drugs, scans and tests that look inside the body
    22: Lifespan drugs used to stop at mouse studies with no buyer
    24: Now a drug for dog lifespan has passed two key FDA review steps
    26: Prevention used to be free advice from a family doctor
    28: Now people pay thousands for a full body checkup and a plan
- id: ed024
  type: dated
  section: Market definition
  title: What has changed (very) recently?
  page: 1/2
  items:
  - d: SINCE 2022
    t: Altos Labs launched with about $3B to study how to rejuvenate cells, the largest start of any company in the history of aging research.
  - d: SINCE 2022
    t: Saudi Arabia's Hevolution Foundation pledged up to $1B a year for aging research, becoming one of the largest funders of the whole field.
  - d: SINCE 2023
    t: The FDA agreed that Loyal's data on its dog drug LOY-001 showed a reasonable expectation of effectiveness, a first for a lifespan drug.
  - d: SINCE 2023
    t: XPRIZE launched a $101M prize for a therapy that restores muscle, brain and immune function in older people, to be judged in 2030.
  - d: SINCE 2023
    t: Netflix's series Live to 100 about the Blue Zones made searches on how to live longer jump worldwide, a sign of mass consumer interest.
  - d: SINCE 2024
    t: Blood testing memberships with over 100 lab tests a year, led by Function Health, spread fast in the US and pushed down the price of a full checkup.
  note:
  - We kept the milestones that most changed funding, regulation or the way consumers buy longevity products
  - There is no official timeline, and another analyst could reasonably pick a few different milestones here
  src: 24
- id: ed025
  type: dated
  section: Market definition
  title: What has changed (very) recently?
  page: 2/2
  items:
  - d: SINCE 2025
    t: Bryan Johnson's Netflix film Don't Die brought his costly longevity routine to a mass audience, and drove interest in tests and supplements.
  - d: SINCE 2025
    t: Montana passed a law letting clinics offer experimental treatments not yet approved by the FDA, the first US state to go that far.
  - d: SINCE 2025
    t: Neko Health raised a large Series B to open more body scan clinics, showing that investors back clinics and not only aging drugs.
  - d: SINCE 2025
    t: The FDA accepted the efficacy part of Loyal's file for its senior dog pill LOY-002, a key step before a conditional approval in the US.
  - d: SINCE 2025
    t: Insilico published a phase 2a result of its AI-found drug in lung fibrosis in Nature Medicine, a first for a drug found by an AI.
  - d: SINCE 2025
    t: Retro Biosciences, backed by Sam Altman, set out to raise about $1B to take its first cell reprogramming drugs into human trials.
  note:
  - We kept the milestones that most changed funding, regulation or the way consumers buy longevity products
  - There is no official timeline, and another analyst could reasonably pick a few different milestones here
  src: 25
