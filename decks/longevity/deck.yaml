- id: ed138
  type: x/regulation_evolving
  section: Market challenges
  title: How is regulation evolving?
  note: We followed FDA guidance, court-driven test-rule changes and FTC advertising standards. Different rules apply to drugs, laboratory tests, devices and supplements.
  src: 138
  t:
    7: '2010 - 2023


      FDA drug rules required disease claims, while supplements needed no prior efficacy approval.'
    8: '2024 - 2025


      A court vacated the FDA lab-test rule. The agency reverted to its earlier definition.'
    9: '2026


      FDA updated its low-risk wellness policy. Aging drugs still need clinical trials.'
    10: 'TODAY


      A drug needs proven patient benefit. No consumer age clock has FDA diagnostic approval.'
    11: '?


      Rules may change, but aging claims still need solid outcomes, truthful ads and safety data.'
- id: iv_fda
  type: x/were_key_phases_market_acceleration
  section: Market challenges
  title: What does it take to bring an aging drug to market?
  note: We used the FDA drug pathway and published approximate stage durations. Timing is illustrative, varies by medicine and may be longer for follow-up or multiple trials.
  src: 147
  t:
    7: 'DISCOVERY AND TESTS


      Labs spend roughly 1 to 3 years testing aging targets, animal health and basic drug safety.'
    8: 'PICK A DISEASE


      Sponsors choose a treatable condition, prepare an IND and allow 30 days for FDA review.'
    9: 'PHASE 1 SAFETY


      Doctors test first doses and side effects in a small study over months, sometimes longer.'
    10: 'APPROVAL AND SALE


      FDA aims to decide in 6 to 10 months. Insurers then decide what they will cover.'
    11: 'PHASE 2 AND 3


      Researchers test benefit in patients over roughly 1 to 6 years. The FDA reviews the evidence.'
- id: ed140
  type: x/where_schools_learners_vendors_clash
  section: Market challenges
  title: Where do developers, doctors and regulators clash?
  src: 140
  t:
    0: Developers hope a biomarker shift can shorten very long trials
    7: Regulators need patient outcomes, not just younger age scores
    9: Patients want reassurance without false alarms or extra bills
    10: Clinics want to sell broad preventive testing now
    12: Clinics promise healthy years, but evidence is often thin
    13: Safety teams fear harm from unapproved cell products
    18: Investors want early results before long trials end
    19: Doctors want proof before treating healthy people
    21: Platform founders want one aging approach to fit many diseases
    22: Regulators examine each drug, device, lab test and health claim
    24: Brands want broad healthspan claims without long trials
    25: The FTC demands strong proof for health benefit claims
- id: iv_safety
  type: x/pain_points_yesterday_vs_today
  section: Market challenges
  title: What could go wrong with longevity products?
  note: We chose documented study results and regulator warnings, not hypothetical worst cases. Harm reports do not establish the frequency of events for every longevity product.
  src: 54
  t:
    6: 'TRIAL SETBACK



      Unity Biotechnology missed the main target in its 2025 Phase 2b eye-drug trial, despite early vision gains.'
    7: 'AGE SCORE ERROR



      Stanford said in 2026 that no consumer biological-age clock has FDA approval for diagnosis, despite growing sales.'
    8: 'CLINIC HARM



      FDA reported blindness, infection and tumors tied to unapproved cell products, and warned of a patient death in 2026.'
    9: 'SCAN CASCADE



      A review of 18,043 whole-body MRIs found 14.8% had actionable noncancer findings. The benefits of follow-up are unclear.'
    10: 'PILL CLAIMS



      FDA does not approve supplements before sale. FTC still requires strong human evidence for health claims.'
