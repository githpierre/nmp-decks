- id: ed006
  type: definition
  section: Market definition
  title: What is the longevity market, in simple terms?
  text: Longevity is the market for drugs, tests, clinics and products built to add healthy years to life, by slowing aging or catching decline early
  note: We use a conversational definition here because it makes the boundary with general healthcare and with the wellness industry easier to understand.
  src: 6
  icon_tl: ⏳
