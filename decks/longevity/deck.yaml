- id: ed095
  type: x/solvable_bottlenecks
  section: Tech and infra
  title: Why can’t we solve them yet?
  note: We link each obstacle to limits seen in human studies, biological measures, or preventive care rather than assuming one technical fix will resolve all of them.
  src: 95
  t:
    5: Long studies cost a lot, and early trials often test safety rather than years of healthy life.
    7: 'HUMAN

      PROOF'
    9: Lab method, cell mix, and short-term stress can shift a score without changing health.
    11: 'AGE

      CLOCKS'
    13: Old and healthy cells share markers, making precise drug targeting hard.
    15: 'CELL

      TARGETS'
    17: The gene switches that make cells younger can also disrupt normal cell control.
    19: 'RESET

      SAFETY'
    22: There is no single accepted aging disease, so sponsors test separate conditions.
    24: 'TRIAL

      DESIGN'
    26: Most datasets miss some groups and measure health unevenly over many years.
    28: 'DATA

      BIAS'
    30: Tissues differ in blood flow and barriers, so a useful dose may miss its target.
    32: 'DRUG

      DELIVERY'
    34: Early scans find uncertain changes, while follow-up care varies by site and doctor.
    36: 'SCAN

      TRUST'
