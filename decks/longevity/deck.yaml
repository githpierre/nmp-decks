  note: We drew these insights from our tracker of 159 longevity equity rounds announced since January 2024, worth about $5.1B
  src: 160
  t:
    6: Drug makers took about 45% of the capital raised since 2024, ahead of preventive health platforms with about 32%
    7: 143 of the 159 rounds since 2024 disclosed an amount, and the median disclosed round was $10M
    8: US startups closed 92 of the 159 rounds and took $3.3B, about 65% of the money, far ahead of Sweden
    9: 14 rounds of $100M or more made up about 56% of all the capital raised in the market since 2024
    10: The $700M Series C of Neko Health is the biggest round since 2024, ahead of the $435M raised by NewLimit in 2026
    11: Seed was the most common round, with 64 of the 159 rounds, ahead of Series A with 32 and Series B with 19
