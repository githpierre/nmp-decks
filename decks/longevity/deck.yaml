- id: ed017
  type: maturity
  section: Market definition
  title: How mature is longevity as a market?
  score: 30
  text: The market is real because consumers pay for tests and memberships, clinics are opening in big cities and investors fund aging drugs at record levels. The score stays low because no drug is approved to slow aging in people, many tests are not validated and most claims still rest on animal studies.
  note:
  - We rate market maturity with an internal score of approved products, human trial results, paying customers and validated tests.
  - We set 30/100 because consumer sales have started, but aging drugs are still in early human trials and evidence is thin.
  src: 17
