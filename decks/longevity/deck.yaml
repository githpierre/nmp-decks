    5: We used it for public money flowing into healthspan trials. It also backed the growth drivers.
    7: 'Chugai and Gero,

      AI target deal'
    8: Chugai's release on its research deal with Singapore-based Gero, worth up to $250M
    9: We used it for the Asian leader on our world map. It also showed how pharma buys aging biology.
    10: 'Everlab, AU$65M

      Series A'
    11: Everlab's release on its round to bring preventive testing and doctors to more Australians
    12: We used it for the Australian leader on our world map. It also backed the rise of clinics outside the US.
    13: 'Maximize, global

      longevity market'
    14: Maximize Market Research's report on the global longevity market and its segments
    15: We used it for the upper growth case. It also set the scope of diagnostics, drugs and clinics.
    16: 'Fitt Insider,

      Eternal closes clinics'
    17: Fitt Insider's report on Eternal closing its New York and San Francisco longevity clinics
    18: We used it for a recent clinic failure. It also showed how hard the clinic model is to scale.
