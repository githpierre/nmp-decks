- id: ed090
  type: x/where_80_value_sit
  section: Tech and infra
  title: Where does 80% of longevity value sit?
  note: We emphasize clinical benefit over changes in aging biomarkers because the latter are not validated substitutes for health outcomes. The value split is a judgment, not a market estimate.
  src: 90
  t:
    8: 'Value may sit in treatments that preserve function, not tests that change an age score. A drug that works safely in people is more useful than a dashboard.


      Human trials bridge promise and proof. They need clear muscle, brain, or immune outcomes, safe delivery, and ways to detect harm. Early cell reset studies do not show longer life.


      Age clocks, AI, data, and clinics can speed discovery and improve care. The 80% framing is a thesis, not a measured market share.'
