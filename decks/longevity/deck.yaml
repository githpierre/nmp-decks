- id: ed091
  type: x/has_tech_infra_evolved_over
  section: Tech and infra
  title: How has tech and infra evolved over the years?
  note: We selected milestones that move from measuring aging to testing treatments in people. Early clinical entry is not evidence that aging has been reversed.
  src: 91
  t:
    6: '2013 - 2018


      Early DNA clocks turned age patterns in blood into risk scores, while scientists linked worn-out cells with aging and loss of function'
    7: '2019 - 2022


      Small senolytic trials began testing drugs in humans, as new biotech teams built tools for cell reset and aging discovery'
    8: '2023 - 2024


      XPRIZE launched its Healthspan challenge, while teams advanced muscle-loss drugs and explored ways to reset old cells'
    9: '2025 - 2026


      Oral cell-recycling drugs entered trials and controlled cell reset reached patients with age-linked vision loss'
    10: '?


      Next, larger trials may link changes in biological age to gains in vision, strength, memory, and more years of independent living'
- id: ed092
  type: x/were_latest_tech_infra_developments
  section: Tech and infra
  title: What were the latest tech and infra developments?
  page: 1/2
  note: We picked dated milestones that built the measurement, treatment, and testing infrastructure for longevity. Early studies do not prove longer healthspan.
  src: 92
  t:
    13: '2023'
    14: XPRIZE launched its $101M Healthspan prize for therapies meant to restore muscle, brain, and immune function in older adults
    15: '2024'
    16: Epirium gained FDA clearance to test MF-300 for age-related muscle loss, enabling the first human study of the drug
    17: '2025'
    18: Loyal enrolled its first 1,000 senior dogs in the STAY study of LOY-002 and expanded the target to 1,300 for lifespan testing
    19: '2025'
    20: Function acquired Ezra and paired blood testing with a 22-minute AI-assisted full-body MRI priced at $499 for preventive screening
    21: '2025'
    22: NewLimit chose a first preclinical cell-reset drug that restored youthful functions in old liver cells, ahead of human trials
    23: '2025'
    24: Retro registered a Phase 1 trial of RTR242, an oral drug targeting weak cell recycling, to assess safety in healthy adults
- id: ed093
  type: x/were_latest_tech_infra_developments_2
  section: Tech and infra
  title: What were the latest tech and infra developments?
  page: 2/2
  note: We selected verified 2026 milestones and distinguish company-reported pilot data from confirmed health benefits. No result here proves added years of life.
  src: 93
  t:
    13: '2026'
    14: Loyal said FDA accepted safety data for LOY-002, completing two of three key reviews, but its dog lifespan drug remains unapproved
    15: '2026'
    16: Life Biosciences dosed the first ER-100 patient in Phase 1, testing controlled cell-reset gene therapy for age-related loss of vision
    17: '2026'
    18: XPRIZE picked 20 Healthspan finalists for clinical testing, with teams targeting older adults' muscle, memory, and immune function
    19: '2026'
    20: A Nature Medicine study compared 16 DNA-based age clocks across 51 human intervention studies to assess their response to care
    21: '2026'
    22: Rubedo announced a study of RLS-1496 in age-linked hair loss, extending tests of a new drug that targets damage-linked cell signals
    23: '2026'
    24: Life Biosciences reported ER-100 was tolerated through day 56 in three glaucoma patients, with early visual-field signals in two
