- after: ed063-s1
  link: ed063-s1 « They need early tests for the heart disease, cancer or dementia that runs in their family history »
  slide:
    id: xl_hidden
    type: sx_stat_strip
    section: Pain points
    title: 'About 1 in 100 Neko members who felt

      well had a hidden severe condition'
    headline: Swedish members aged 28 to 72 with a severe hidden finding
    stats:
    - v: 1.0%
      l: Members scanned in 2023, the first full year
    - v: 1.2%
      l: Members scanned in 2024, as volumes grew
    - v: 1.0%
      l: Members scanned in 2025, as scan volumes tripled
    story: People who feel healthy can still carry a serious disease, which is why they pay to be checked. The rate held at about 1% as more people came in.
    note:
    - We used Neko Health’s data report of September 14, 2026 on members with no symptoms
    - These members chose to be scanned, so the rate is not one for the whole population
- after: ed136
  link: ed136 « Aging outcomes take years to measure with confidence »
  slide:
    id: xl_xprize
    type: sx_faceoff
    section: Market challenges
    title: 'Only 10 of more than 600 XPRIZE teams

      won the second healthspan award'
    cards:
    - name: ENTRANTS, 2025
      stats:
      - v: 600+
        l: teams from 58 countries entered the $101M prize
      - v: '40'
        l: teams still in the race by May 2025
    - name: SECOND AWARD, 2026
      hl: true
      stats:
      - v: '10'
        l: finalists that won the second milestone award
      - v: '20'
        l: finalists picked to test treatments in people
    story: Proving that a treatment adds healthy years is slow and hard, even with a large prize behind it. Being picked for more testing is not proof that it works.
    note:
    - We used XPRIZE releases of May 12, 2025 and August 11, 2026
    - Teams include universities and labs, so not only startups
- after: ed200
  link: ed200 « They fail when lab gains do not hold up in human trials »
  slide:
    id: xl_bioage
    type: sx_faceoff
    section: Startup killers
    title: 'BioAge stock fell 80% from its peak

      after its lead trial was halted'
    cards:
    - name: PEAK, OCT 2024
      stats:
      - v: $25.83
        l: highest closing share price, weeks after its IPO
      - v: Phase 2
        l: azelaprag trial running at the time
    - name: NOV 2026
      hl: true
      stats:
      - v: $5.10
        l: closing share price on November 17, 2026
      - v: 100%
        l: of revenue from one partner, no product sales
    story: When a lead drug fails in people, a public aging-biology company loses most of its value fast. BioAge still lives on one research partner.
    note:
    - We compared the peak close of October 21, 2024 with the close of November 17, 2026
    - Revenue share from BioAge’s 10-Q for the nine months to September 30, 2026
