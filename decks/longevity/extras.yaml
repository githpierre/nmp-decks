    pill: SIGNAL
    title: '350,000 people signed up for a Neko

      scan, and 3 in 4 members book again'
    items:
    - value: 350,000+
      label: People who registered for a Neko Health scan by July 2026, mostly in Sweden and the UK
    - value: 100,000+
      label: Members who had already been through a scan at one of its clinics by July 2026
    - value: 75%
      label: Members who book and prepay next year’s scan at the end of their visit, on average
