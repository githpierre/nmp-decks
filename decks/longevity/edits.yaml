ed213:
  rows:
  - - They build pills meant to treat a single illness in dogs
    - They target aging and aim to extend healthy years in dogs
  - - They pick younger animals with easier short-term signals
    - They test LOY-002 in senior dogs aged ten years or older
  - - They test a new product in only a few animals on site
    - They enrolled 1,300 dogs across 70 veterinary sites
  - - They make claims without a fair untreated comparison
    - They run a double-blind study with a placebo group
  - - They count only lab markers to suggest a longer lifespan
    - They track lifespan, health and quality of life in STAY
  - - They start trials without a clear path for drug review
    - They pursue an FDA path with staged safety and drug data
  - - They design medicine with one dog breed as the only user
    - They built LOY-002 for senior dogs that weigh over 14 lb
  - - They raise limited cash while waiting on long trial results
    - They closed a $100M Series C to advance LOY-002
