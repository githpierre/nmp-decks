ed142p:
  title: 'What could go wrong

    for generative AI?'
  events:
  - odds: 55
    impact: 3
    text: OpenAI, Google and Microsoft bundle features that copy startup products, wiping out thin wrapper apps
  - odds: 45
    impact: 2
    text: Open models from DeepSeek, Qwen and Meta push API prices down 90%, crushing model startup margins
  - odds: 35
    impact: 2
    text: Power shortages and grid delays in Virginia and Texas cap new data center capacity for AI
  - odds: 30
    impact: 2
    text: Enterprise pilots fail to show ROI, as MIT style studies find most generative AI projects deliver nothing
  - odds: 25
    impact: 1
    text: Nvidia GPU shortages and export controls raise compute costs for startups outside big cloud deals
  - odds: 20
    impact: 3
    text: Big tech cuts AI capex after weak returns, and generative AI valuations fall 40% or more
  - odds: 15
    impact: 3
    text: A US court rules training on copyrighted books is not fair use, forcing costly licensing deals
  - odds: 10
    impact: 2
    text: A deepfake moves an election or stock price, and Congress passes strict liability rules for AI content
  note:
  - We listed the events that could slow generative ai down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
