ed007p:
  type: pp_radar
  title: 'What counts as generative AI,

    and what only looks like it?'
  TL:
    name: Adobe
    src: ../../assets/logos/pp_live/generative-ai/s01-00.png
    text: says AI influences over a third of its business, but most of its revenue still comes from Creative Cloud and Acrobat plans
  TR:
    name: Netflix
    src: ../../assets/logos/pp_live/generative-ai/s01-02.png
    text: uses generative AI in some of its shows and in search, but it makes its money from streaming subscriptions and ads
  BL:
    name: Hugging Face
    src: ../../assets/logos/pp_live/generative-ai/s01-10.png
    text: hosts over 3 million open models and sells the hosting, but it is a home for other people's models more than a maker
  BR:
    name: Databricks
    src: ../../assets/logos/pp_live/generative-ai/s01-11.png
    text: sells Agent Bricks to build AI agents, but it is a data platform at heart, with a data warehouse past a $1.5B run rate
  caption:
  - Distance to the center reflects how much of a company's revenue comes from products that generate text, code, images or video
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
