ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'The term LLM Is more and more popular

    on Google, as chatbots reach every office'
  date: Over the past year.
  expl: Not long ago, almost nobody knew what an LLM was. Then ChatGPT, Claude, Gemini and DeepSeek became daily tools, every company talked about “its
    LLM”, and the term reached schools and offices. People kept searching it to understand the tech behind the chatbots.
  term: generative ai
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/generative-ai/generative-ai.csv
