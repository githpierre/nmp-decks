    impact: 1.5
  - year: '2023'
    text: Petrobras orders offshore inspection robots
    impact: 2.0
  - year: '2023'
    text: BASF tests robots in explosive zones
    impact: 1.5
  - year: '2024'
    text: ADNOC adopts robotic asset inspections
    impact: 2.0
  - year: '2025'
    text: Navy supplier backs robotic ship scans
    impact: 2.0
  - year: '2025'
    text: Carbon storage site adopts robotic rounds
    impact: 1.5
  - year: '2025'
    text: Japan highlights turbine maintenance robots
    impact: 1.5
  - year: '2026'
    text: Drones inspect spinning offshore turbines
    impact: 2.5
  - year: '2026'
    text: Navy backs robotic inspections across ships
    impact: 2.0
  - year: '2026'
    text: Cement plant proves inspection labor savings
    impact: 2.0
  - year: '2026'
    text: Navy expands robotic inspection ceiling
    impact: 2.5
  - year: '2026'
    text: Explosion-safe walkers ship to industry
    impact: 2.0
  note:
  - We kept the events we believe pushed inspection robotics forward the most
  - Ratings are our estimates, with all the sources at the end of the report
