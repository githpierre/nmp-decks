ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More people google inspection drones

    to check what is hard to reach'
  date: 0 Lately.
  expl: Drones got cheaper, smarter and easier to fly, and some countries eased the rules for longer flights. Energy, rail and building owners started using
    them to inspect power lines, roofs and bridges, and searches kept growing.
  term: inspection robotics
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/inspection-robotics/inspection-robotics.csv
ed052p:
  type: pp_cagr
  title: 'How much bigger can

    inspection robotics get?'
  lead: ''
  condition: To get that big, the market must let robots inspect without a pilot or operator on site, and get regulators and insurers to accept robot data
    in place of human inspections for pipes, tanks, bridges and plants.
  note:
  - We compared forecasts from Global Market Insights, SkyQuest, The Business Research Company and MRFR
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: 4
  cagr: 15
  y0: 2026
