- label: ADVANCED GEOTHERMAL
  type: pp_risks
  section: Market challenges
  title: What are the biggest threats to the advanced geothermal market?
  events:
  - text: Fervo or another flagship EGS project misses cost targets, making utilities delay follow-on geothermal contracts
    odds: 35
    impact: 3
  - text: US geothermal tax credits are reduced, weakening project economics for advanced drilling and stimulation projects
    odds: 30
    impact: 3
  - text: Induced seismicity triggers new restrictions in a major state, slowing permitting for enhanced geothermal systems
    odds: 25
    impact: 2
  - text: Oilfield drilling costs rise sharply, increasing well costs for Fervo, Sage, Quaise and other geothermal developers
    odds: 45
    impact: 2
  - text: High-temperature tools fail faster than expected, delaying superhot rock projects and raising replacement costs
    odds: 40
    impact: 2
  - text: Transmission delays strand remote geothermal projects, pushing commercial operation dates beyond contracted windows
    odds: 35
    impact: 2
  - text: Utilities prefer cheaper gas and storage, reducing willingness to sign long-duration geothermal power contracts
    odds: 30
    impact: 1
  - text: Water constraints limit stimulation or cooling options in western US projects, increasing permitting and design costs
    odds: 25
    impact: 1
  note:
  - We listed the events that could slow advanced geothermal down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and you will find all the sources we used at the end of the report
