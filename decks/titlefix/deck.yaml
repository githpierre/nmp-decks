  events:
  - text: EU pesticide policy softens further, reducing pressure on growers to replace synthetic products with biological tools
    odds: 36
    impact: 3
  - text: Large field trials show inconsistent biological performance in drought or heat, slowing repeat purchases by growers
    odds: 48
    impact: 3
  - text: EPA data demands expand for microbial products, lengthening registrations and raising costs for small biological firms
    odds: 30
    impact: 2
  - text: Crop prices fall for several seasons, pushing farmers to cut premium biostimulants and other discretionary inputs
    odds: 44
    impact: 2
  - text: Bayer, Syngenta or Corteva rationalizes overlapping biological portfolios after acquisitions, reducing launch activity
    odds: 34
    impact: 2
  - text: Contamination or shelf-life failures in microbial products trigger recalls and tighter quality standards across markets
    odds: 24
    impact: 2
  - text: Fertilizer prices normalize, weakening the economic case for nitrogen-efficiency inoculants and biostimulant products
    odds: 46
    impact: 1
  - text: Patent disputes over engineered microbes delay launches from startups working on next-generation biological crop inputs
    odds: 22
    impact: 1
