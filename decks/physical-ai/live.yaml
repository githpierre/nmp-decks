ed007p:
  type: pp_radar
  title: 'What is actually included

    in the physical AI market?'
  TL:
    name: Siemens
    src: ../../assets/logos/pp_live/physical-ai/s01-00.png
    text: runs factory machines worldwide with SIMATIC controllers, but they follow programs set by engineers, not AI that decides
  TR:
    name: Samsara
    src: ../../assets/logos/pp_live/physical-ai/s01-01.png
    text: gathers trillions of data points from cameras and sensors in trucks, but it only analyzes them and never acts
  BL:
    name: Hugging Face
    src: ../../assets/logos/pp_live/physical-ai/s01-10.png
    text: is mostly a hub for AI models, but beRobot and its $299 Reachy Mini robot pull it onto the physical AI boundary
  BR:
    name: World Labs
    src: ../../assets/logos/pp_live/physical-ai/s01-11.png
    text: raised $1 billion to mode! physical space, but its first product, Marble, builds 3D worlds for creative work
  caption:
  - Distance to the center reflects how directly the AI perceives and acts in the physical world, rather than analyzing data
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
