ed142p:
  title: 'What could slow

    physical AI down?'
  events:
  - odds: 25
    impact: 3
    text: Humanoid valuations collapse and investors stop funding physical AI startups trading at 140 times revenue
  - odds: 25
    impact: 2
    text: Unitree and other Chinese makers flood the market with cheap humanoids, crushing Western startup prices
  - odds: 18
    impact: 2
    text: A humanoid robot seriously injures a worker before safety standards exist, and buyers pause their pilots
  - odds: 15
    impact: 2
    text: NVIDIA and Google give away strong robot models and tools for free, erasing the edge of startups
  - odds: 15
    impact: 3
    text: Robot foundation models stop improving and still fail most fine manipulation tasks, delaying real deployments
  - odds: 12
    impact: 3
    text: A robot or robotaxi kills someone in public, triggering recalls and strict new rules for physical AI
  - odds: 10
    impact: 2
    text: US-China trade tensions cut supply of motors, chips and rare earth magnets for robot makers
  - odds: 5
    impact: 1
    text: Unions win EU or US labor laws that limit robots replacing workers in warehouses and factories
  note:
  - We listed the events that could slow physical ai down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
