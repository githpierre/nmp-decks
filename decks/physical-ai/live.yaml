ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More people look up humanoid robots,

    as factories and homes get them'
  date: Lately.
  expl: Humanoid robots stopped being just videos. Tesla, Figure, Unitree and others started taking orders and showing robots at work in factories and homes,
    and people started looking up what they can do and when they will arrive.
  term: physical ai
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/physical-ai/physical-ai.csv
ed052p:
  type: pp_cagr
  title: 'How much room is left

    for this market to grow?'
  lead: 'To fill that room, '
  condition: the market must make robots reliable enough to work full shifts, and win safety approval for humanoids, drones, and robotaxis. It must also
    cut the cost of each robot, and gather enough real data to train AI models that work in any home or factory.
  note:
  - We compared forecasts from MarketsandMarkets, Grand View, Mordor and Fortune, and aligned their timelines
  - We removed robot hardware to build a realistic range, and all the sources are included at the end of the report
  size: 16
  cagr: 22
  y0: 2026
