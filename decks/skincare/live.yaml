ed148p:
  title: 'What pushed the skincare market

    forward, year after year?'
  events:
  - year: '1946'
    text: Modern sunscreen creates new routine
    impact: 2.0
  - year: '1962'
    text: SPF makes protection measurable
    impact: 2.0
  - year: '1969'
    text: Tretinoin proves active skincare works
    impact: 2.5
  - year: '1978'
    text: FDA begins sunscreen regulation
    impact: 1.5
  - year: '1980'
    text: Anti-aging becomes major skincare need
    impact: 2.0
  - year: '1990'
    text: AHAs bring exfoliation mainstream
    impact: 2.0
  - year: '1992'
    text: UVA ratings improve protection claims
    impact: 1.5
  - year: '1996'
    text: Vitamins enter active skincare
    impact: 1.5
  - year: '2000'
    text: Dermatologist brands enter mass retail
    impact: 1.5
  - year: '2005'
    text: Online reviews reduce trial uncertainty
    impact: 1.0
  - year: '2008'
    text: K-beauty routines spread globally
    impact: 2.0
  - year: '2010'
    text: Social media accelerates skin education
    impact: 1.5
  - year: '2011'
    text: FDA standardizes broad-spectrum labels
    impact: 2.0
  - year: '2012'
    text: BB creams merge care and makeup
    impact: 1.0
  - year: '2014'
    text: Ingredient transparency gains momentum
    impact: 1.5
  - year: '2016'
    text: The Ordinary popularizes ingredient pricing
    impact: 3.0
  - year: '2017'
    text: CeraVe acquisition scales derm skincare
    impact: 1.5
  - year: '2018'
    text: Skinfluencers make actives mainstream
    impact: 1.5
  - year: '2019'
    text: Barrier repair becomes mainstream
    impact: 1.5
  - year: '2020'
    text: Pandemic moves skincare routines home
    impact: 2.0
  - year: '2021'
    text: Benzene recalls raise safety awareness
    impact: 1.0
  - year: '2022'
    text: Skin cycling simplifies active routines
    impact: 1.0
  - year: '2023'
    text: EU restricts intentional microplastics
    impact: 1.0
  - year: '2024'
    text: EU caps cosmetic vitamin A
    impact: 1.5
  - year: '2025'
    text: Retinol compliance starts in Europe
    impact: 1.0
  - year: '2026'
    text: FDA approves bemotrizinol sunscreen
    impact: 2.5
  - year: '2026'
    text: New filter boosts sunscreen competition
    impact: 2.0
  - year: '2026'
    text: FDA removes unsafe sunscreen actives
    impact: 1.0
  - year: '2026'
    text: EU retinol rules reshape formulations
    impact: 1.5
  - year: '2026'
    text: Clinical actives dominate skincare language
    impact: 2.0
  note:
  - We kept the events we believe pushed skincare forward the most
  - Ratings are our estimates, with all the sources at the end of the report
ed168p:
  handle: skincare
  title: 'Where did skincare investors

    put their money this past year?'
  note:
  - We added up every equity round of skincare startups in our tracker over the last twelve months
  - by category of our market definition, and rounds with no public amount count as zero here
