ed007p:
  type: pp_radar
  title: 'What Is actually included

    in the skincare ma'
  TL:
    name: Sephora
    src: ../../assets/logos/pp_live/skincare/s01-00.png
    text: distributes skincare from many brands, but its main business is beauty retail rather than manufacturing skincare
  TR:
    name: Maybelline
    src: ../../assets/logos/pp_live/skincare/s01-02.png
    text: is primarily a makeup brand, so its core products sit outside cleansers, moisturizers and topical skincare
  BL:
    name: Honest
    src: ../../assets/logos/pp_live/skincare/s01-09.png
    text: the Honest Company sells skincare, but much of its catalog is baby, household and personal care outside skincare
  BR:
    name: Glossier
    src: ../../assets/logos/pp_live/skincare/s01-10.png
    text: sells meaningful skincare, but makeup remains a major part of its assortment and brand identity
  caption:
  - Distance to the center reflects how central each company is to skincare
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
