ed148p:
  title: 'What pushed the AI inference

    market forward, year after year?'
  events:
  - year: '2015'
    text: Google deploys inference-first TPUs
    impact: 3.0
  - year: '2016'
    text: Google publicly reveals TPU acceleration
    impact: 2.0
  - year: '2017'
    text: Cloud TPUs open accelerator access
    impact: 2.0
  - year: '2018'
    text: NVIDIA Triton standardizes model serving
    impact: 2.5
  - year: '2019'
    text: Cloud inference becomes managed service
    impact: 1.5
  - year: '2020'
    text: GPU serving stacks improve utilization
    impact: 1.5
  - year: '2021'
    text: Serverless inference enters public preview
    impact: 1.5
  - year: '2022'
    text: SageMaker serverless inference reaches GA
    impact: 2.0
  - year: '2022'
    text: Generative AI multiplies token demand
    impact: 3.0
  - year: '2023'
    text: TensorRT-LLM opens optimized LLM serving
    impact: 2.0
  - year: '2023'
    text: Paged attention boosts serving efficiency
    impact: 2.0
  - year: '2023'
    text: Cloudflare pushes inference to the edge
    impact: 1.5
  - year: '2023'
    text: Bedrock normalizes model API consumption
    impact: 2.0
  - year: '2023'
    text: Open models widen hosting competition
    impact: 2.0
  - year: '2024'
    text: Groq proves extreme low-latency demand
    impact: 2.0
  - year: '2024'
    text: Groq serves Llama within hours
    impact: 1.5
  - year: '2024'
    text: Cerebras launches wafer-scale inference
    impact: 2.0
  - year: '2024'
    text: Cerebras triples Llama serving speed
    impact: 1.5
  - year: '2024'
    text: Azure expands serverless model APIs
    impact: 1.5
  - year: '2025'
    text: Reasoning models raise inference intensity
    impact: 2.0
  - year: '2025'
    text: Cerebras accelerates DeepSeek reasoning
    impact: 1.5
  - year: '2025'
    text: Llama 4 gets instant inference
    impact: 1.5
  - year: '2025'
    text: Inference becomes agent infrastructure
    impact: 2.0
  - year: '2025'
    text: TPUs add open serving stacks
    impact: 1.5
  - year: '2025'
    text: Model routing becomes cost optimization
    impact: 1.5
  - year: '2025'
    text: Quantization moves into mainstream serving
    impact: 1.5
  - year: '2026'
    text: TensorRT 11 spans multiple GPUs
    impact: 2.0
  - year: '2026'
    text: Lovable buys dedicated fast inference
    impact: 2.0
  - year: '2026'
    text: Triton keeps monthly production cadence
    impact: 1.0
  - year: '2026'
    text: Specialized clouds pressure GPU economics
    impact: 1.5
  note:
  - We kept the events we believe pushed ai inference forward the most
  - Ratings are our estimates, with all the sources at the end of the report
