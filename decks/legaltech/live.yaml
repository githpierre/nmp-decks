ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More lawyers look for legal tech,

    now that AI can draft contracts'
  date: In recent months.
  expl: Law firms used to be slow with tech. Then AI tools like Harvey started drafting contracts and reviewing documents in minutes, and big firms rolled
    them out to every lawyer. Legal tech became the talk of the profession, and searches hit a five-year high.
  term: legaltech
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/legaltech/legaltech.csv
ed052p:
  type: pp_cagr
  title: 'How much room is left

    for legal tech to grow?'
  lead: 'To fill that room, '
  condition: the market must turn AI into paid legal work, as firms and legal teams move budgets from hours to software every year. It must also keep AI
    errors out of courts, win the trust of clients and regulators, and resist cheap general AI tools that do part of the job.
  note:
  - We compared forecasts from Grand View, Fortune Business Insights, Precedence and The Business Research Company
  - We adjusted each one to our market definition to build a realistic range, and all our sources are at the end of the report
  size: 35
  cagr: 11
  y0: 2026
