ed142p:
  title: 'What are the biggest

    threats to legal tech?'
  events:
  - odds: 45
    impact: 3
    text: Thomson Reuters and LexisNexis bundle AI into Westlaw and Lexis plans, so startups lose law firm deals
  - odds: 40
    impact: 1
    text: Clio and other practice management players add AI features that crowd out niche small firm tools
  - odds: 35
    impact: 2
    text: Billable hour models resist change and large firms refuse to pay premium AI seat prices
  - odds: 30
    impact: 2
    text: Courts sanction more lawyers for fake AI citations and firms cut back on generative AI tools
  - odds: 30
    impact: 3
    text: OpenAI and Anthropic sell legal agents directly to firms and undercut Harvey and Legora on price
  - odds: 30
    impact: 2
    text: Bar rules in California and New York limit AI use without client consent and human review
  - odds: 25
    impact: 2
    text: Funding pulls back after legal AI valuations above 5 billion dollars fail to match revenue
  - odds: 12
    impact: 3
    text: A client data leak through a legal AI vendor triggers malpractice claims and vendor bans
  note:
  - We listed the events that could slow legaltech down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
