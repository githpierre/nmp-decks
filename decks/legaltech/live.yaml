ed007p:
  type: pp_radar
  title: 'What counts as legaltech,

    and what falls outside?'
  TL:
    name: Docusign
    src: ../../assets/logos/pp_live/legaltech/s01-00.png
    text: signs and manages contracts for every department, from sales to HR, so it serves legal teams without being built for them
  TR:
    name: OneTrust
    src: ../../assets/logos/pp_live/legaltech/s01-02.png
    text: handles privacy and GRC programs that often involve lawyers, but these are compliance platforms our definition excludes
  BL:
    name: LegalZoom
    src: ../../assets/logos/pp_live/legaltech/s01-10.png
    text: sells business filings and legal documents to consumers and small firms, not tools for lawyers, so it is on the line
  BR:
    name: Thomson Reuters
    src: ../../assets/logos/pp_live/legaltech/s01-11.png
    text: owns Westlaw and CoCounsel, yet its legal unit brings in under 40% of group revenue, which puts it on the edge
  caption:
  - Distance to the center reflects how specifically a product is built for the daily work of lawyers and in-house legal teams
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
