ed142p:
  title: 'What could go wrong

    for warehouse robots?'
  events:
  - odds: 25
    impact: 3
    text: A recession cuts retail volumes and warehouse automation orders fall sharply for Symbotic and peers
  - odds: 25
    impact: 3
    text: Hai Robotics, Geek+ and other Chinese makers start a price war that crushes warehouse robot margins
  - odds: 20
    impact: 2
    text: AI picking robots like Amazon Vulcan stall at 75% success, so warehouses keep human pickers
  - odds: 20
    impact: 2
    text: Another warehouse robot vendor fails like Attabotics, leaving customers stranded and buyers wary of startups
  - odds: 15
    impact: 1
    text: US tariffs on imported robots raise costs for warehouses buying from China and Europe
  - odds: 10
    impact: 2
    text: Interest rates rise again in the US and Europe, and retailers delay warehouse automation projects for years
  - odds: 8
    impact: 2
    text: A warehouse robot kills a worker, and OSHA imposes strict new rules on mobile robots
  - odds: 5
    impact: 3
    text: Amazon starts selling its warehouse robots to other retailers and undercuts Symbotic and Locus Robotics
  note:
  - We listed the events that could slow warehouse robotics down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
