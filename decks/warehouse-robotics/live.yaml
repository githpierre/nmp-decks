ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'People look up warehouse robots

    more and more, as online orders grow'
  date: 0 Lately.
  expl: Online orders keep growing and warehouses struggle to hire. Robots that pick, carry and sort parcels moved from pilots to daily work, and operators
    started searching for them.
  term: warehouse robotics
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/warehouse-robotics/warehouse-robotics.csv
ed052p:
  type: pp_cagr
  title: 'Is the warehouse robotics

    market still growing fast?'
  lead: ''
  condition: Yes, but retailers and parcel carriers must keep converting manual buildings at today’s pace, while AI arms make picking and unloading cheap
    enough for mid- size warehouses. It must also avoid a long tariff war on robots and parts, and keep vendors solvent so that customers trust ten-year
    fleets.
  note:
  - We compared forecasts from Mordor, Interact Analysis, Grand View and IMARC fo build a realistic range
  - We added our funding tracker and allowed for falling robot prices, with all the sources at the end of the report
  size: null
  cagr: 15
  y0: 2026
