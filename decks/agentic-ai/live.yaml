ed007p:
  type: pp_radar
  title: 'What counts as agentic AI,

    and what falls outside?'
  TL:
    name: Salesforce
    src: ../../assets/logos/pp_live/agentic-ai/s01-00.png
    text: is investing heavily in Agentforce, but it remains a CRM company selling agents as an add-on to its existing seat licenses
  TR:
    name: Jasper
    src: ../../assets/logos/pp_live/agentic-ai/s01-01.png
    text: generates marketing content with AI, but a person still prompts, edits and publishes each piece, so it is not agentic
  BL:
    name: Glean
    src: ../../assets/logos/pp_live/agentic-ai/s01-10.png
    text: started as an enterprise search engine and now ships agents on top of it, which places it halfway between search and agents
  BR:
    name: UiPath
    src: ../../assets/logos/pp_live/agentic-ai/s01-11.png
    text: has repositioned around agentic automation, but most of its revenue still comes from rule-based RPA bots that follow fixed scripts
  caption:
  - Distance to the center reflects how autonomously a product plans and acts, rather than simply answering questions
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
