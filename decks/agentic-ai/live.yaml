ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people want to know

    what an AI agent is, and what it can do'
  date: Lately.
  expl: Chatbots learned to act, not just talk. OpenAI, Google and Anthropic shipped agents that browse the web, fill in forms and write code on their own,
    and every software company started selling its own “AI agent”. People heard the word everywhere and googled it to find out what it meant.
  term: agentic ai
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/agentic-ai/agentic-ai.csv
ed052p:
  type: pp_cagr
  title: 'How much room is left

    for agentic AI to grow?'
  lead: 'To fill that room, '
  condition: agents must move from pilots to daily work in most large companies, and be paid for the tasks they really finish. They must also earn trust,
    with safe permissions, clear audits, and costs that stay lower than the work they replace.
  note:
  - We compared forecasts from Grand View, MarketsandMarkets, Mordor and Fortune Business Insights
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: 10
  cagr: 35
  y0: 2026
