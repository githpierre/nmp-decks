ed142p:
  title: 'What could slow

    agentic AI down?'
  events:
  - odds: 55
    impact: 3
    text: Salesforce, Microsoft and ServiceNow ship agents inside their suites, leaving standalone agent startups few buyers
  - odds: 45
    impact: 3
    text: Gartner's forecast holds and over 40% of agentic AI projects are cancelled for cost and unclear value
  - odds: 40
    impact: 2
    text: Agents still fail multi step tasks often, so customers limit them to narrow, supervised workflows
  - odds: 40
    impact: 1
    text: Websites like Amazon and LinkedIn block AI agents, cutting off the data and actions agents need
  - odds: 35
    impact: 3
    text: A prompt injection attack makes a company's agent leak customer data or send money to criminals
  - odds: 30
    impact: 2
    text: Courts hold companies liable for contracts and refunds their agents promise, as in the Air Canada case
  - odds: 30
    impact: 2
    text: Model token costs for long agent runs stay high, making per task pricing unprofitable for startups
  - odds: 10
    impact: 1
    text: The EU classifies autonomous agents as high risk under the AI Act, adding audit costs
  note:
  - We listed the events that could slow agentic ai down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
