ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people look up AI network

    cables, the new bottleneck of AI chips'
  date: Lately.
  expl: An AI supercomputer is only as fast as the links between its chips. Nvidia’s networking business grew to billions of dollars a quarter, Broadcom
    and Arista rode the same wave, and engineers started saying the network, not the chip, was the real limit. People went looking for what AI networking
    is.
  term: ai data center networking
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/ai-data-center-networking/ai-data-center-networking.csv
