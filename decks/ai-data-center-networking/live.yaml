ed142p:
  title: 'What are the biggest threats

    to AI data center networking?'
  events:
  - odds: 45
    impact: 3
    text: Nvidia bundles Spectrum X Ethernet and NVLink with its GPUs, squeezing Arista and networking startups
  - odds: 40
    impact: 2
    text: Broadcom Tomahawk and Jericho chips dominate switching and leave little room for new silicon startups
  - odds: 35
    impact: 2
    text: Co packaged optics delays push back the shift that startups like Ayar Labs and Celestial AI need
  - odds: 35
    impact: 2
    text: Chinese optics makers like Innolight face US tariffs and bans that disrupt transceiver supply
  - odds: 30
    impact: 2
    text: Hyperscalers like Google and Meta design their own network chips and stop buying from startups
  - odds: 25
    impact: 3
    text: Hyperscalers cut AI capex after weak returns, shrinking orders for switches and optical transceivers
  - odds: 20
    impact: 1
    text: Ultra Ethernet Consortium standards split vendors and slow adoption of new AI fabrics in data centers
  - odds: 12
    impact: 1
    text: A large AI cluster suffers long outages from network failures, damaging trust in a new vendor
  note:
  - We listed the events that could slow ai data center networking down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
