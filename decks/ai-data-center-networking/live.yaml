ed007p:
  type: pp_radar
  title: 'What is actually included

    in AI data center networking?'
  TL:
    name: HPE
    src: ../../assets/logos/pp_live/ai-data-center-networking/s01-00.png
    text: grew data center networking almost fivefold with Juniper, but campus and branch gear still sells nearly three times more
  TR:
    name: Ubiquiti
    src: ../../assets/logos/pp_live/ai-data-center-networking/s01-02.png
    text: sold over $3 billion of switches and Wi-Fi gear last year, but to offices and homes, not to link GPUs in AI clusters
  BL:
    name: Astera Labs
    src: ../../assets/logos/pp_live/ai-data-center-networking/s01-09.png
    text: sells Scorpio switches that link GPUs inside a rack over PCIe, which blurs the line between server and network
  BR:
    name: Marvell
    src: ../../assets/logos/pp_live/ai-data-center-networking/s01-10.png
    text: makes about 76% of its revenue in data centers, but a big part comes from custom AI processors rather than networking
  caption:
  - Distance to the center reflects how much of a product exists to move data between GPUs and servers inside AI clusters
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
