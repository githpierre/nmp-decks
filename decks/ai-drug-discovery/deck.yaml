- id: iv_fda
  type: x/were_key_phases_market_acceleration
  section: Market challenges
  title: What does it take to turn an AI design into a drug?
  note: We combined FDA trial requirements with public development timelines. Durations are rough stage ranges, may overlap and vary by drug, and AI does not bypass human safety or efficacy trials.
  src: 147
  t:
    7: 'TARGET


      1-3 YEARS Biologists choose a disease cause. AI narrows options, but human studies must support it.'
    8: 'DESIGN


      1-3 YEARS Chemists build and retest AI-ranked molecules. Lab results decide which lead survives.'
    9: 'LAB TESTS


      1-2 YEARS Scientists test safety in labs and animals. FDA reviews the IND before human tests.'
    10: 'PHASE 2-3


      3-8 YEARS Doctors test benefit, then FDA or EMA weighs the trial data, not the AI design.'
    11: 'PHASE 1


      UP TO 2 YEARS Trial doctors check dose and safety in people. AI cannot replace direct evidence.'
