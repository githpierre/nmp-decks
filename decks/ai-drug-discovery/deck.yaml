- id: iv_safety
  type: x/pain_points_yesterday_vs_today
  section: Market challenges
  title: What could go wrong for AI drug discovery?
  note: We used clinical papers, corporate filings and the developers of open models to separate observed setbacks from strategic risks. Each example is company-specific, not proof that all AI drugs fail.
  src: 54
  t:
    6: 'PHASE 2 FAILURE



      A 2026 study found 19.5% phase 2 success among its AI-enabled drugs. Even a strong model cannot prove benefit in people.'
    7: 'LIVER TOXICITY



      Rentosertib showed a lung-function trend, but seven of its 71 phase 2a patients stopped treatment due to liver problems.'
    8: 'PARTNER EXIT



      Exscientia’s Bristol Myers Squibb partnership ended in 2024, showing that discovery deals may close before major milestones pay.'
    9: 'OPEN MODELS



      Boltz-2 came out under an MIT license in 2025, letting competitors use free binding models in their own drug-discovery work.'
    10: 'CASH BURN



      Recursion reported a $119M net loss in third-quarter 2026, showing how a major AI platform still needs funds while trials run.'
