- id: ed027
  type: x/when_did_market_become_real
  section: Market opportunity
  title: When did the AI in drug discovery market become real?
  note: We chose the first DSP-1181 human study as the clearest early move from computer-guided design into clinical testing. The result was not a drug approval.
  src: 27
  t:
    8: Before this, a 2019 AI study had tested new molecules in cells and mice. It showed lab activity, not results in patients.
    12: In January 2020, Sumitomo began Phase 1 testing of DSP-1181 in Japan, an OCD drug designed with Exscientia's AI.
    13: '2020'
- id: ed028
  type: x/when_did_become_hot
  section: Market opportunity
  title: When did it become hot?
  note: We chose 2024 because a $1B-plus startup launch coincided with large pharmaceutical companies signing research contracts for AI-led drug design.
  src: 28
  t:
    6: In 2024, Xaira launched with over $1B and Isomorphic Labs signed discovery deals with Lilly and Novartis.
    7: '2024'
    12: Earlier, Insilico had a Phase 2 trial and Recursion had gone public, but pharma deals and a $1B-plus startup made 2024 hot.
- id: ed029
  type: x/happened_between
  section: Market opportunity
  title: What happened in-between?
  src: 29
  t:
    5: '2019'
    6: In 2019, an Insilico team used AI to design inhibitors of a protein tied to fibrosis in 21 days. The molecules showed activity in lab tests and mice.
    7: '2020'
    8: Sumitomo and Exscientia began a Phase 1 study of DSP-1181 in Japan for OCD. It was an early human test, not proof of benefit.
    9: 2021 - 2022
    10: Recursion raised $502M in its 2021 Nasdaq IPO. In 2022, Insilico began Phase 1 dosing for its own AI-discovered lung drug ISM001-055.
    11: '2023'
    12: Insilico then dosed lung disease patients in a Phase 2 study of INS018_055. This moved the drug beyond tests in healthy volunteers.
    13: 🧪
    14: 💊
    15: 💰
    16: 💉
- id: ed030
  type: x/happened_since_then
  section: Market opportunity
  title: And what happened since then?
  src: 30
  t:
    5: '2024'
    6: Xaira launched with over $1B for AI drug research, and Recursion combined with Exscientia in November to join two AI discovery platforms.
    7: '2025'
    8: Isomorphic raised $600M. A 71-patient Phase 2a study of rentosertib showed a possible lung-function signal.
    9: '2026'
    10: Isomorphic raised $2.1B in May, and rentosertib began Phase 3 dosing in September. That trial must still prove patient benefit.
    11: TODAY
