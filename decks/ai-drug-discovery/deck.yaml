- id: ed185
  type: x/ones_disrupting_value_chain
  section: Top players
  title: Which ones are disrupting the value chain?
  src: 185
  t:
    11: TARGETS
    12: HIT SEARCH
    13: DRUG DESIGN
    14: LAB TESTING
    15: SCALE-UP
    16: insitro starts with human disease data rather than just a favored protein. AI looks for causes that may lead to better drug targets.
    17: Boltz and XtalPi screen molecules in software before making them. Fewer weak candidates need costly tests in a physical lab.
    18: Chai Discovery and Generate design antibody and protein drugs using learned models, then test if the new shapes bind as hoped.
    19: Iambic and XtalPi link AI design with lab results in a loop. Each test guides the next molecule to try.
    20: Merck and AstraZeneca buy access to AI discovery rather than build every tool in-house. Partners still own much of later drug development.
