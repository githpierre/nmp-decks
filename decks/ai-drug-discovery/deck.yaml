- id: xd_novel
  type: share_waffle
  section: Market challenges
  title: 'Only 37% of the AI-made drugs tested

    in people aim at a new disease cause'
  'on': New disease cause
  'off': Known target
  unit: drugs
  years:
  - x: MARCH 2026
    k: 48
    n: 129
    p: 37
  big: 48 of 129
  kicker: WHAT IS GOING ON
  story: 'AI is often sold as a way to find new causes of disease. Yet most AI-made drugs in human trials hit targets that biologists already knew.

    New targets are harder to judge, because there is little data on them to train the models.'
  note:
  - We used a peer-reviewed count of 129 AI-made drugs from 69 companies tested in people
  - up to March 1, 2026, which sorted each drug by whether its target was new or already known
- id: ed133
  type: x/has_held_back_market_growth
  section: Market challenges
  title: What has held back market growth so far?
  note: We grouped the field into broad phases using trial research, regulatory milestones and industry disclosures. These phases describe changing bottlenecks, not a measured growth curve.
  src: 133
  t:
    6: '2017 - 2020


      AI tools screened compounds and ranked targets, but few drug candidates reached people. Poor data and costly tests limited trust.'
    7: '2021 - 2023


      Protein models improved design, and AI-first drugs entered human trials, but clinical proof was scarce.'
    8: '2024 - 2025


      The EMA outlined AI safeguards and the FDA drafted model checks. Rentosertib reported phase 2a results, but one small study could not prove broad success.'
    9: 'TODAY


      AI-discovered drugs have reached phase 3, but clinical benefit and repeatable discovery economics remain unproven.'
    10: '2025 - 2026


      Open models widened access and pharma signed more deals, but most AI-linked therapies were still in early trials.'
