  rows:
  - - They rely on a protein shape to guide most drug ideas
    - They use IsoDDE to predict and generate new drug molecules
  - - They work on one type of drug and ignore other designs
    - They can design small drugs, antibodies and peptides
  - - They build an AI model without a pipeline of their own
    - They are building an internal pipeline toward the clinic
  - - They offer one narrow discovery project to drugmakers
    - They signed a multi-target deal with Johnson & Johnson
  - - They use only open data to train their drug design AI
    - They also work with MSD and its private discovery data
  - - They stop after predicting how a molecule may bind
    - Their models both predict and generate new candidates
  - - They fund expansion by raising modest new venture rounds
    - They raised $2.1B in May and another $5B in November
  - - They win one partner and treat it as proof of efficacy
    - They added MSD, but still lack public human efficacy data
  section: Startup strategies
  src: 210
  title: How did Isomorphic Labs raise $5B for drug design?
  type: contrast
  logo_src: ../../assets/logos/isomorphic-labs.png
- id: ed211
  left: A TYPICAL AI DRUG STARTUP
  logo: insilico
  note:
  - We used Insilico clinical records, its platform disclosures and the published randomized Phase 2a study.
  - We used a fictional startup as the contrast and do not treat early lung-function signals as proven benefit.
  right: INSILICO MEDICINE
  rows:
  - - They select disease targets with literature review alone
    - They used PandaOmics AI to find a lung-scarring target
  - - They draw each new small molecule by hand before tests
    - They used Chemistry42 to design new TNIK drug molecules
  - - They need years of research to choose a viable drug
    - They report taking 12 to 18 months to nominate a drug
  - - They synthesize a vast chemical library before choosing
    - They report testing just 60 to 200 molecules per program
  - - They treat a model score as proof of medical benefit
    - They ran a randomized Phase 2a study in 71 patients
  - - They lack any published study of their new drug in people
    - Their Phase 2a rentosertib data appeared in Nature Medicine
  - - They halt once a compound completes its first trial
    - They dosed the first patient in Phase III in September
  - - They sell a tool but never build an internal drug pipeline
    - They built Pharma.AI, advanced rentosertib and went public
  section: Startup strategies
  src: 211
  title: How did Insilico Medicine get an AI drug to Phase III?
  type: contrast
  logo_src: ../../assets/logos/insilico-medicine.png
- id: ed212
  left: A TYPICAL AI DRUG STARTUP
  logo: recursion
  note:
  - We used Recursion trial and partner updates, plus its completed Exscientia combination announcement.
  - We compared these facts with a fictional baseline and did not present planned Phase 3 as approval.
  right: RECURSION
  rows:
  - - They look for new targets in only a few known pathways
    - They mapped neuron biology to find a new disease target
  - - They trust model output before testing disease biology
    - They jointly validated the new target with Genentech
  - - They keep biology and chemistry teams in separate silos
    - They merged with Exscientia to link biology and design
  - - They must test huge compound sets for a viable lead
    - They identified REC-1245 after screening 204 compounds
  - - They train models on small libraries of cell experiments
    - Their Genentech work used over a trillion neuron cells
  - - They offer only a model rather than a drug in human tests
    - Their REC-1245 showed early Phase 1 partial responses
  - - They quote future deals without cash from pharma yet
    - They earned $216M in Roche and Genentech cash payments
  - - They call Phase 2 results proof that approval is near
    - They have FDA agreement on a future Phase 3 trial design
  section: Startup strategies
  src: 212
  title: How did Recursion turn cell images into drug programs?
  type: contrast
  logo_src: ../../assets/logos/recursion-pharmaceuticals.png
- id: ed213
  left: A TYPICAL AI DRUG STARTUP
  logo: enveda
  note:
  - We used Enveda platform, financing and Phase 1 reports to distinguish lab claims from patient outcomes.
  - We used a fictional startup for contrast and kept the tiny open-label study clearly preliminary.
  right: ENVEDA
  rows:
  - - They invent synthetic compounds before looking in nature
    - They search plant, microbe and human chemistry for leads
  - - They identify natural molecules through slow manual work
    - Their PRISM model predicts structures from chemical spectra
  - - They separate computer models from wet laboratory tests
    - Their automated laboratory feeds fresh data into PRISM
  - - They pick drug ideas only after conventional broad screens
    - They use AI to rank natural compounds by drug potential
  - - They stay with mouse data and never test people directly
    - Their ENV-294 reached a nine-person Phase 1b skin trial
  - - They present small patient studies as final clinical proof
    - They reported a 68% mean skin score drop in an open trial
  - - They depend on a single experimental molecule for years
    - They had three drugs in human studies, including ENV-308
  - - They raise on early animal data without human readouts
    - Their $311M Series E followed two early clinical updates
  section: Startup strategies
  src: 213
  title: How did Enveda turn nature's chemistry into medicines?
  type: contrast
  logo_src: ../../assets/logos/enveda-biosciences--symbol.png
- id: ed214
  left: A TYPICAL AI DRUG STARTUP
  logo: chai-discovery
  note:
  - We used Chai research notes, pharma collaboration releases and its disclosed financing to verify progress.
  - We used a fictional baseline for contrast and did not confuse lab binders with approved medicines.
  right: CHAI DISCOVERY
  rows:
  - - They sift through random antibodies until one binds
    - They use Chai-2 to design new antibodies from scratch
  - - They need target-specific training examples before design
    - Their GSK test generated binders without such training
  - - They design short binding pieces that may fail as drugs
    - Their Chai-2 also designed full-length drug-like antibodies
  - - They trust a computer score without checking binding
    - GSK tested Chai designs and found binders for all targets
  - - They offer predictions without checking molecular shapes
    - They used 3D images to check how five antibody designs bind
  - - They avoid hard disease proteins that resist antibodies
    - Chai-2 produced binders for six hard-to-target receptors
  - - They build for one customer and cannot repeat sales
    - They signed drug design collaborations with GSK and Roche
  - - They need sales from approved drugs to raise big capital
    - They raised $400M in Series C before any approved drug
  section: Startup strategies
  src: 214
  title: How did Chai Discovery win over major drugmakers?
  type: contrast
  logo_src: ../../assets/logos/chai-discovery.png
