ed160:
  6: Molecule design took about 53% of the capital raised since 2024, ahead of protein design with about 17%
  7: 215 of the 230 rounds since 2024 disclosed an amount, and the median disclosed round was $25M
  8: US startups closed 113 of the 230 rounds, but UK startups took the most money, $8.4B, mostly Isomorphic Labs
  9: 33 rounds of $100M or more made up about 77% of all the capital raised in the market since 2024
  10: The $5B Series C round of Isomorphic Labs is the biggest since 2024, ahead of its own $2.1B round of 2026
  11: Seed was the most common round, with 71 of the 230 rounds, ahead of Series A with 62 and Series B with 35
  note: We drew these insights from our tracker of 230 AI drug discovery equity rounds announced since January 2024, worth about $18.5B
ed162:
  6: 'BEFORE



    Before 2024, AI drug discovery firms such as Exscientia and BenevolentAI raised money on promises, and few of their drugs had reached people.'
  7: 'AFTER



    Since 2024, 230 rounds raised $18.5B. Molecule design takes the biggest share, led by Isomorphic Labs, and AI-made drugs now reach Phase 3.'
  note: We used our tracker of AI drug discovery equity rounds, complete from January 2024, and company releases and the press
