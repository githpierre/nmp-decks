rows:
- name: "Isomorphic Labs,\n$5B Series C"
  why: Isomorphic Labs' release on its $5B round of November 2026, the largest in AI drug discovery
  how: We used it for the $5B round and its design engine. It also set the scale of investor money in the market.
  url: https://www.isomorphiclabs.com/articles/isomorphic-labs-announces-series-c-investment-round
- name: "Isomorphic Labs\nand MSD deal"
  why: Isomorphic Labs' release on its research deal with MSD, which brings MSD's private discovery data
  how: We used it for the latest developments and the value of private data. It also backed the data-sharing bets.
  url: https://www.isomorphiclabs.com/articles/isomorphic-labs-enters-into-a-research-collaboration-with-msd
- name: "Insilico, Phase 3\nfirst patient dosed"
  why: Insilico's release on the first patient dosed in the Phase 3 trial of rentosertib for lung fibrosis
  how: We used it for the Phase 3 milestone and its 52-week design. It also dated Insilico in the race to Phase 3.
  url: https://insilico.com/news/isn1009261-insilico-medicine-doses-first-patient-genesis-ipf-3
- name: "Insilico, Phase 2a\nin Nature Medicine"
  why: The peer-reviewed results of the randomized Phase 2a trial of rentosertib in 71 patients
  how: We used it for the first lung-function signal of an AI-made drug. It also framed the safety questions.
  url: https://www.nature.com/articles/s41591-025-03743-2
- name: "Insilico, October\n2026 investor deck"
  why: Insilico's investor presentation with its half-year revenue for 2025 and 2026
  how: We used it for the $106M first half of 2026. It also showed how pharma deals turn into sales.
  url: https://ir.insilico.com/media/lsogxltb/ism_2026-corporate-deck_en_2026-oct-wo-appendix.pdf
- name: "Insilico and Lilly,\n$115M upfront"
  why: Insilico's release on its research deal with Lilly, with $115M paid up front
  how: We used it for the largest upfront payment of 2026. It also showed the gap between cash and milestones.
  url: https://insilico.com/news/uiy12zcjg1-insilico-medicine-announces-global-rampd?amp=true
- name: "Recursion, third\nquarter 2026 results"
  why: Recursion's release on its third quarter of 2026, with sales, losses, cash and pipeline news
  how: We used it for the $123M operating loss and the Sanofi option. It also backed the cash-burn risks.
  url: https://ir.recursion.com/news-releases/news-release-details/recursion-reports-third-quarter-2026-financial-results-and
- name: "Recursion, REC-4881\nPhase 3 plan"
  why: Recursion's release on its agreement with the FDA on a Phase 3 trial of REC-4881
  how: We used it for the 47% polyp reduction and the 2027 start. It also placed Recursion among the leaders.
  url: https://ir.recursion.com/news-releases/news-release-details/recursion-announces-alignment-fda-registrational-phase-3-trial
- name: "Generate, IPO\nprospectus"
  why: Generate Biomedicines' prospectus for its 2026 Nasdaq listing, with its history and Phase 3 trial
  how: We used it for the founding date and the first Phase 3 patient. It also backed the race to Phase 3.
  url: https://www.sec.gov/Archives/edgar/data/2100782/000119312526083190/generate_bio_424b4.htm
- name: "Generate, third\nquarter 2026 results"
  why: Generate Biomedicines' release on its third quarter of 2026 and its two Phase 3 asthma trials
  how: We used it for GB-0895 in Phase 3. It also showed an AI-made antibody close to approval tests.
  url: https://generatebiomedicines.com/news-releases/Generate-Biomedicines-Earnings-Release-Q3-2026
- name: "Iambic, third\nquarter 2026 results"
  why: Iambic's release on its third quarter of 2026, with billings, partnerships, its IPO and cash
  how: We used it for the $100M billed and the eight partnerships. It also gave the $47M AbbVie payment.
  url: https://ir.iambic.ai/news-releases/news-release-details/iambic-provides-business-updates-and-third-quarter-2026
- name: "Iambic, IAM1363\ndata at ESMO"
  why: Iambic's release on early trial results of IAM1363 in HER2 cancers, shown at ESMO 2026
  how: We used it for the 19 responses in 53 patients. It also showed how fast its platform reached the clinic.
  url: https://ir.iambic.ai/news-releases/news-release-details/iambic-presents-updated-iam1363-clinical-data-esmo-2026-showing
- name: "Chai Discovery,\n$400M Series C"
  why: Chai Discovery's announcement of its $400M round at a $3.8B value in July 2026
  how: We used it for the round and the valuation. It also placed Chai among the fastest-growing startups.
  url: https://www.businesswire.com/news/home/20260713849009/en/Chai-Discovery-Announces-$400M-Series-C-to-Advance-AI-Driven-Molecular-Design
- name: "Chai Discovery,\nChai-2 antibodies"
  why: Chai Discovery's report on Chai-2 designing full-length antibodies, checked with 3D images
  how: We used it for the antibody design milestone. It also backed the bet on antibodies designed from scratch.
  url: https://www.chaidiscovery.com/news/chai-2-mab
- name: "Clinical census of\nAI-made drugs"
  why: A peer-reviewed count of 129 AI-made drugs from 69 companies tested in people up to March 2026
  how: We used it for the 5 drugs that reached Phase 3 and the 37% aimed at new biology. It framed the challenges.
  url: https://pubmed.ncbi.nlm.nih.gov/42874241/
- name: "Nature Reviews\nDrug Discovery"
  why: A 2026 review in Nature Reviews Drug Discovery on what AI has really changed in drug discovery so far
  how: We used it for the limited clinical evidence and the data problems. It also shaped the bottlenecks.
  url: https://www.nature.com/articles/s41573-026-01496-2
- name: "FDA, rule on\nanimal testing"
  why: The FDA's announcement of a rule that lets validated nonanimal methods produce safety data
  how: We used it for the rule change of September 2026. It also backed the bet on fewer animal tests.
  url: https://www.fda.gov/news-events/press-announcements/fda-updates-regulations-advance-innovative-alternatives-animal-testing
- name: "FDA, draft guidance\non AI in drug files"
  why: The FDA's first draft guidance on how AI used in drug and biologic submissions must prove credible
  how: We used it for the 2025 regulation milestone. It also framed how regulators look at AI models.
  url: https://www.fda.gov/news-events/press-announcements/fda-proposes-framework-advance-credibility-ai-models-used-drug-and-biological-product-submissions
- name: "AlphaFold 3\nin Nature"
  why: The Nature paper on AlphaFold 3, which predicts how proteins bind drugs, DNA and RNA
  how: We used it for the 2024 model milestone. It also explained the models layer of the technology.
  url: https://www.nature.com/articles/s41586-024-07487-w
- name: "Schrödinger, third\nquarter 2026 results"
  why: Schrödinger's release on its third quarter of 2026, with software and drug discovery sales
  how: We used it for the $0.41 operating loss per dollar of sales. It also gave a software-led comparison.
  url: https://ir.schrodinger.com/press-releases/news-details/2026/Schrdinger-Reports-Third-Quarter-2026-Financial-Results/default.aspx
