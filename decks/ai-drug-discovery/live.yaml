ed142p:
  title: 'What could go wrong

    for AI drug discovery?'
  events:
  - odds: 45
    impact: 3
    text: A high profile AI designed drug from Recursion or Insilico fails in Phase 2 and spooks investors
  - odds: 40
    impact: 3
    text: Biotech funding stays tight and many AI drug startups run out of cash before clinical data
  - odds: 35
    impact: 3
    text: Big pharma like Lilly and Novartis build AI teams in house and stop paying startups for platforms
  - odds: 35
    impact: 2
    text: New data shows AI designed drugs fail Phase 2 as often as traditional drugs, eroding the pitch
  - odds: 30
    impact: 2
    text: Free open models like Boltz-2 and OpenFold3 erase the edge of smaller AI biotech startups
  - odds: 30
    impact: 2
    text: FDA budget cuts and staff losses slow reviews and trial approvals for new AI discovered molecules
  - odds: 30
    impact: 1
    text: Drug pricing rules under the Inflation Reduction Act cut expected returns on small molecule programs
  - odds: 8
    impact: 2
    text: A data scandal over patient genomic records used for training leads to lawsuits and tighter consent rules
  note:
  - We listed the events that could slow AI drug discovery down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
