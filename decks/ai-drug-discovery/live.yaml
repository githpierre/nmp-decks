ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people look up how AI

    designs drugs, now they reach trials'
  date: Over the past year.
  expl: AI drug discovery started to deliver. The Nobel Prize went to AlphaFold’s creators, drugs designed by AI entered late-stage trials, and Isomorphic Labs and others raised huge rounds. The idea that AI could find cures faster moved from labs to headlines.
  term: ai drug discovery
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/ai-drug-discovery/ai-drug-discovery.csv
ed052p:
  type: pp_cagr
  title: 'Is the AI drug discovery

    market still growing fast?'
  lead: ''
  condition: Yes, but AI-discovered drugs must win approval, and pharma must move most of its early research onto AI platforms. Deal payments must turn into steady revenue, and AI must prove that it raises success rates in Phase 2 trials, not only speed.
  note:
  - We compared forecasts from Ken Research, Coherent and Market Research Future, close to our definition
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: 3.4          # live page: 4 and 20 %. Research 03 ($3.4B, 26 %, better sourced) chosen by Pierre on 20 Nov 2026 -> new S03 in the retour
  cagr: 26
  y0: 2026
