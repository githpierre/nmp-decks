  3: 'Isomorphic Labs,

    $5B Series C'
  4: Isomorphic Labs' release on its $5B round of November 2026, the largest in AI drug discovery
  5: We used it for the $5B round and its design engine. It also set the scale of investor money in the market.
  7: 'Isomorphic Labs

    and MSD deal'
  8: Isomorphic Labs' release on its research deal with MSD, which brings MSD's private discovery data
  9: We used it for the latest developments and the value of private data. It also backed the data-sharing bets.
  10: 'Insilico, Phase 3

    first patient dosed'
  11: Insilico's release on the first patient dosed in the Phase 3 trial of rentosertib for lung fibrosis
  12: We used it for the Phase 3 milestone and its 52-week design. It also dated Insilico in the race to Phase 3.
  13: 'Insilico, Phase 2a

    in Nature Medicine'
  14: The peer-reviewed results of the randomized Phase 2a trial of rentosertib in 71 patients
  15: We used it for the first lung-function signal of an AI-made drug. It also framed the safety questions.
  16: 'Insilico, October

    2026 investor deck'
  17: Insilico's investor presentation with its half-year revenue for 2025 and 2026
  18: We used it for the $106M first half of 2026. It also showed how pharma deals turn into sales.
