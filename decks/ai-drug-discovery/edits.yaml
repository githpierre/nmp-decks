    data at ESMO'
  8: Iambic's release on early trial results of IAM1363 in HER2 cancers, shown at ESMO 2026
  9: We used it for the 19 responses in 53 patients. It also showed how fast its platform reached the clinic.
  10: 'Chai Discovery,

    $400M Series C'
  11: Chai Discovery's announcement of its $400M round at a $3.8B value in July 2026
  12: We used it for the round and the valuation. It also placed Chai among the fastest-growing startups.
