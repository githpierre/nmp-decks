ed160:
  6: Synthetic respondents took about 46% of the capital raised since 2024, ahead of AI interviews with about 40%
  7: 48 of the 51 rounds since 2024 disclosed an amount, and the median disclosed round was $6.4M
  8: US startups closed 29 of the 51 rounds and took $635M, about 76% of all the money raised since 2024
  9: 2 rounds of $100M or more made up about 36% of all the capital raised in the market since 2024
  10: The $200M Series B round of Simile is the biggest since 2024, ahead of its own $100M Series A
  11: Seed was the most common round, with 18 of the 51 rounds, ahead of Series A with 16 and Series B with 4
  note: We drew these insights from our tracker of 51 AI market research equity rounds announced since January 2024, worth about $836M
ed162:
  6: 'BEFORE



    Before 2024, money went to survey software and panel firms, and Momentive sold for $1.5B.'
  7: 'AFTER



    Since 2024, 51 rounds raised $836M. Synthetic respondents take the biggest share, and AI interviews come close behind.'
  note: We used our tracker of AI market research equity rounds, complete from January 2024, and company releases and the press
