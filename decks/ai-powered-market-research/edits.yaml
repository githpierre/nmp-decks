ed159:
  note:
  - We add up the disclosed equity rounds of AI market research startups in our database, complete from January 2024
  - IPOs, debt and grants are left out, 2026 runs to early November, and rounds with no public amount count as zero
ed164:
  note:
  - We divide, for each year, the largest round by all the disclosed capital in our tracker
  - IPOs, debt and grants are left out, and 2026 only runs to early November for now
ed166p:
  title: 'Who did investors back the most in


    AI market research in earlier years?'
  note:
  - We listed the biggest equity rounds raised by AI market research startups before the last year
  - We used our tracker of rounds, company announcements and the press, with sources at the end
ed172:
  note: We grouped startups into eight types by their main product, from AI interviews with real buyers to full research platforms that link surveys, interviews and reports.
