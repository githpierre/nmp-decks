ed091:
  6: '2023



    Outset entered Y Combinator with AI interviews, while 56% of research firms already used AI somewhere in their work at that point.'
iv_safety:
  6: 'FAKE ANSWERS




    NORC''s 2026 review estimated 15% to 30% fraud across market research, with some survey platforms reaching 45%.'
  7: 'SYNTHETIC GAPS




    Pew''s 2026 test found 12.4 percentage points of average error across nearly 300 questions answered by AI profiles.'
  8: 'PRIVACY RULES




    MRS rules require clear permission and disclosure about recording, access and retention when identifiable people join research.'
  9: 'BAD AI OUTPUT




    GWI found 80% of senior professionals frequently saw misleading AI findings, and 58% made a major decision on one.'
  10: 'GENERIC AI




    GWI found 88% use AI daily, making generic answers easy to access while paid tools must prove their evidence advantage.'
