- id: ed210
  left: A REGULAR AI RESEARCH STARTUP
  logo: listen-labs
  note:
  - We used company product documentation, customer examples and published financing or validation reports
  - We treated the regular startup as a fictional baseline for contrast, not a survey of actual companies
  right: LISTEN LABS
  rows:
  - - They ask researchers to write every guide from scratch
    - They use AI to draft a study guide from a business question
  - - They ask clients to source every respondent separately
    - They can recruit from a built-in global participant network
  - - They wait for human interviewers to become available
    - Their AI interviewer conducts conversations around the clock
  - - They produce static survey answers with little context
    - They use AI to conduct in-depth research conversations
  - - They leave teams to analyze every interview manually
    - They combine study design, fieldwork and synthesis
  - - They take weeks to answer an urgent business question
    - Sweetgreen reported getting research results in four days
  - - They rely on small trials without showing research scale
    - They interviewed over one million people by January
  - - They stay focused on a standalone research workflow
    - Salesforce bought Listen Labs in early November 2026
  section: Startup strategies
  src: 210
  title: How Listen Labs made customer interviews a strategic asset
  type: contrast
  logo_src: ../../assets/logos/listen-labs.png
- id: ed211
  left: A REGULAR AI RESEARCH STARTUP
  logo: outset
  note:
  - We used company product documentation, customer examples and published financing or validation reports
  - We treated the regular startup as a fictional baseline for contrast, not a survey of actual companies
  right: OUTSET
  rows:
  - - They use fixed questions that cannot adapt to answers
    - Their AI interviewer asks contextual follow-up questions live
  - - They limit research to one way of talking to people
    - They run research interviews in video, voice and text formats
  - - They depend on manual translation for global research
    - They run interviews natively in over 40 languages
  - - They only analyze what a participant says out loud
    - They can use visual cues to inform probing and synthesis
  - - They wait until fieldwork ends to spot weak answers
    - They detect low-effort responses while the interview runs
  - - They make every customer use a standard question guide
    - They support custom and AI-generated interview guides
  - - They report usage rather than showing commercial growth
    - They reported eightfold revenue growth during the year 2025
  - - They take years to secure a follow-on financing round
    - They raised a $30M Series B six months after their Series A
  section: Startup strategies
  src: 211
  title: How Outset scaled the depth of customer interviews
  type: contrast
  logo_src: ../../assets/logos/outset.png
- id: ed212
  left: A REGULAR AI RESEARCH STARTUP
  logo: strella
  note:
  - We used company product documentation, customer examples and published financing or validation reports
  - We treated the regular startup as a fictional baseline for contrast, not a survey of actual companies
  right: STRELLA
  rows:
  - - They launch before getting feedback from real buyers
    - They converted all 12 original design partners into paid users
  - - They offer the same fixed script to each interviewee
    - They use an AI voice moderator that asks live follow-ups
  - - They recruit every respondent through a single panel
    - They let teams use integrated panels or their own share link
  - - They make participants book a slot for every session
    - They let AI interviews run in parallel whenever people join
  - - They keep human and AI interviews in separate tools
    - They combine both kinds of interviews in the same synthesis
  - - They send a raw transcript back to every research team
    - They let researchers create reports and video highlight reels
  - - They add customers slowly without proving repeat demand
    - They reported growing their customer base fourfold in a year
  - - They raise new money without showing revenue growth
    - They grew revenue tenfold and raised a $14M round
  section: Startup strategies
  src: 212
  title: How Strella turned early design partners into paying clients
  type: contrast
  logo_src: ../../assets/logos/strella.png
- id: ed213
  left: A REGULAR AI RESEARCH STARTUP
  logo: conveo
  note:
  - We used company product documentation, customer examples and published financing or validation reports
  - We treated the regular startup as a fictional baseline for contrast, not a survey of actual companies
  right: CONVEO
  rows:
  - - They run a single project and then close the study
    - They run continuous consumer research through StoryLines
  - - They ask only fixed questions and collect text answers
    - They use AI-led video, voice and text interviews with people
  - - They only capture what consumers say they do at home
    - They also observe people showing their routines on camera
  - - They make clients find suitable participants themselves
    - They recruit participants through eight integrated panels
  - - They repeat research without connecting the findings
    - They compare each wave with earlier ones to spot shifts
  - - They present AI findings without review by researchers
    - They let researchers validate and interpret the findings
  - - They deliver snapshots that are hard to compare over time
    - They show tracked measures in live charts with video
  - - They focus on pilots without funding their expansion
    - They raised a $50M Series A to expand their US business
  section: Startup strategies
  src: 213
  title: How Conveo turned interviews into continuous consumer research
  type: contrast
  logo_src: ../../assets/logos/conveo.png
- id: ed214
  left: A REGULAR AI RESEARCH STARTUP
  logo: electric-twin
  note:
  - We used company product documentation, customer examples and published financing or validation reports
  - We treated the regular startup as a fictional baseline for contrast, not a survey of actual companies
  right: ELECTRIC TWIN
  rows:
  - - They generate personas from a generic language model
    - They combine language models with real survey data
  - - They create audience profiles with little client context
    - They can build simulations from the client’s own research data
  - - They evaluate predictions using the same source answers
    - They hold back test questions when building the audience
  - - They judge the results by how convincing the text sounds
    - They compare predicted answers with real survey answers
  - - They rely on a single flattering accuracy measure
    - They report 92% on a stricter distribution accuracy measure
  - - They publish a single benchmark for every customer
    - They run separate holdout validation on each client project
  - - They claim speed without showing how a team uses it
    - The Times case study reports roughly ten times more research
  - - They try to scale the platform on early seed money
    - They raised $10M in a round led by Atomico in February 2026
  section: Startup strategies
  src: 214
  title: How Electric Twin tests its simulated audiences against real data
  type: contrast
  logo_src: ../../assets/logos/electric-twin.png
