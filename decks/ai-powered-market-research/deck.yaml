- id: ed221
  type: x/divider_12
  src: 221
  t:
    0: '



      Thank you for taking the time to go through this report.


      Our intention was to make this work useful. Rigorous, yes, but also clear, structured, and easy to navigate, so that knowledge can actually be absorbed and reused. We truly hope the information was digestible, that you learned something meaningful along the way, and that it will prove useful in your own thinking or decision making.


      Behind these documents is a team that works hard to produce them and keep them up to date. This is not a one-off effort, and we take the craft seriously.


      If you are interested in other markets, we invite you to visit our homepage and explore our other reports. You can use {1|NEWMARKET} for 20% off, or {1|NEWMARKETMAX} for 30% off when purchasing five or more. If a market you care about is not currently in the list, email us and maybe we can cover it.'
    3: THANK YOU FOR YOUR TIME
