- id: ed023
  type: x/learning_truths_have_flipped
  section: Market definition
  title: Which AI market research truths have flipped?
  note: These are market shifts we see in recent deals, failures and company releases. They are not formal industry rules, but they come back across the evidence.
  src: 23
  t:
    6: Interviews used to need a human moderator for each person
    8: Now one AI moderator can run hundreds of interviews at the same time
    10: A qualitative study used to take six to eight weeks
    12: Now AI interview tools deliver the first findings in a few days
    14: Research answers used to come only from people
    16: Now synthetic respondents answer early questions before real fieldwork
    18: Online panels used to be the safest asset of the industry
    20: Now Dynata went through Chapter 11 and Cint wrote down its Lucid assets
    22: Open answers used to be read and coded by hand
    24: Now AI codes them into themes and links each theme back to the source
    26: Big software groups used to stay out of research tools
    28: Now Salesforce owns Listen Labs and Accenture invested in WEVO
- id: ed024
  type: dated
  section: Market definition
  title: What has changed (very) recently?
  page: 1/2
  items:
  - d: SINCE 2023
    t: Outset joined Y Combinator in 2023 with AI-moderated user interviews, one of the first tools where an AI asks follow-up questions to real people at scale.
  - d: SINCE 2024
    t: Toluna launched HarmonAIze in September 2024, a synthetic data suite for quantitative and qualitative research, bringing synthetic answers into a large panel firm.
  - d: SINCE 2024
    t: The EU AI Act entered into force in August 2024, with transparency duties that apply from August 2026 to AI systems that talk to people or create content.
  - d: SINCE 2025
    t: Listen Labs launched its AI interviewer in April 2025 and passed one million interviews in nine months, with 15x annualized revenue growth before a $69M round.
  - d: SINCE 2025
    t: Strella raised $14M in October 2025 after 10x revenue growth, and Outset raised $30M in December 2025 after growing more than 8x, as AI interview demand rose.
  - d: SINCE 2025
    t: Aaru raised more than $50M in December 2025 at a reported $1B headline valuation, to build AI agents that simulate how groups of people will behave.
  note:
  - We kept the milestones that most changed the products, the money and the big players of the market
  - There is no official timeline, and another analyst could reasonably pick a few different milestones here
  src: 24
- id: ed025
  type: dated
  section: Market definition
  title: What has changed (very) recently?
  page: 2/2
  items:
  - d: SINCE 2026
    t: Pew Research Center published a 2026 test where synthetic answers missed human survey results by 12.4 points on average, a key warning for synthetic research.
  - d: SINCE 2026
    t: Greenbook's 2026 GRIT report found that synthetic data use among the largest research suppliers rose from 26% to 44% in one year, a fast change in daily practice.
  - d: SINCE 2026
    t: Simile raised $200M in July 2026 at a $2B valuation to build synthetic users that test product, price and campaign choices, the largest round of the market so far.
  - d: SINCE 2026
    t: Conveo raised a $50M Series A in September 2026 and reported more than 400 enterprise customers, including over 50 Fortune 500 brands using its AI interviews.
  - d: SINCE 2026
    t: ESOMAR found that 93% of research firms used AI in 2026, up from 56% in 2023, but only 15% of research leaders said it was scaled across several workflows.
  - d: SINCE 2026
    t: Salesforce completed its acquisition of Listen Labs on November 2, 2026, bringing AI interviews and customer research into a large enterprise software platform.
  note:
  - We kept the milestones that most changed the products, the money and the big players of the market
  - There is no official timeline, and another analyst could reasonably pick a few different milestones here
  src: 25
