- id: ed174
  type: x/have_been_different_waves_hot
  section: Top players
  title: What have been the different waves of 'hot' startups over time?
  note: We grouped companies by when their approach became visible through launches, funding, enterprise adoption or major acquisitions. This is a directional history rather than a formal taxonomy.
  src: 174
  t:
    6: '2019 - 2022


      Research software firms used AI for open-text coding and consumer signals. Most studies still depended on human panels and manual analysis.'
    7: '2023 - 2024


      Generative AI made it easier to build AI moderators and synthetic users. New platforms like Conveo and Aaru emerged beside older specialists.'
    8: '2025


      AI research moved into enterprise sales. Listen Labs and Strella raised funding, while Outset reported more than 8x revenue growth.'
    9: 'TODAY


      Salesforce acquired Listen Labs, Conveo reached 400+ enterprise customers and Simile reached a $2B valuation.'
    10: '?


      Future winners pair verified human samples, calibrated synthetic users, continuous data and strong security. Trust will decide which platforms scale.'
