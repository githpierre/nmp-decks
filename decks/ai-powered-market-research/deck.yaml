- id: ed132
  type: x/newcomers_often_miss_here
  section: Market challenges
  title: What do newcomers often miss here?
  note: We combined evidence on synthetic samples, online survey fraud, privacy duties and enterprise buying. Faster research does not remove the need to prove that the evidence is sound.
  src: 132
  t:
    17: AI can produce a polished answer faster than it can prove the sample is sound
    21: Recorded interviews carry consent, access and retention duties for each client
    23: Enterprise buyers still demand validation, security reviews and workflow links
    25: Synthetic respondents can match broad trends yet miss real buyers by 12.4 points
    28: Online survey fraud is estimated at 15% to 30%, and some panels report even more
- id: ed133
  type: x/has_held_back_market_growth
  section: Market challenges
  title: What has held back market growth so far?
  note: We grouped the market into broad phases using research-industry surveys, company milestones and published validation studies. The phases are judgment-based and show how the main adoption barriers have shifted.
  src: 133
  t:
    6: '2018 - 2021


      AI first helped with text coding and survey quality checks, while human panels and manual interviews still set the pace for most studies.'
    7: '2022 - 2023


      Generative AI cut costs for interview guides, text analysis and synthetic profiles, but researchers still had to verify results.'
    8: '2024 - 2025


      New AI interview and synthetic-audience startups appeared, while most buyers still treated the tools as pilots rather than trusted evidence systems.'
    9: 'TODAY


      AI use is rising, but validation, data quality, privacy and security still decide whether tools win repeat budgets.'
    10: '2025 - 2026


      AI moved from side tools into core workflows, while synthetic data became a leading research method.'
