  t:
    0: SOURCE
    1: WHY WE TRUST IT
    2: HOW WE USED IT
    3: 'Pew Research Center,

      synthetic survey test'
    4: Pew's 2026 test comparing synthetic survey answers with the answers of real people on nearly 300 questions
    5: We used it for the 12.4-point average error of synthetic answers. It framed the main risk of the market.
    7: 'NORC, review of

      survey fraud'
    8: NORC's 2026 review of studies on fraud and bots in online survey panels across market research
    9: We used it for the 15% to 30% fraud rate in online panels. It showed why verified people are scarce.
    10: 'GWI, artificial

      confidence report'
    11: GWI's survey of 1,883 professionals on how often AI tools gave them misleading findings at work
    12: We used it for the 80% who often met misleading AI findings. It showed why buyers ask for proof.
    13: 'ICC and ESOMAR,

      research code'
    14: The international code of conduct for market and social research, updated for AI and synthetic data
    15: We used it for the duty to tell clients when AI or synthetic data is used. It framed the rules of the market.
    16: 'Salesforce, Listen

      Labs acquisition'
    17: Salesforce's announcement of its deal to buy Listen Labs, an AI interview startup, completed in November 2026
    18: We used it for the largest exit of the market so far. It showed that big software groups want AI research.
