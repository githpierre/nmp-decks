    5: We used it as the upper reference of our $4.5B market size. It also gave the highest growth rate we compared.
    7: 'Future Market Insights,

      market report'
    8: The market report on AI-based research services, with its 2025 size and a forecast to 2035
    9: We used it as a broad service reference for market size. It also gave one of the growth rates we compared.
    10: 'ESOMAR, research

      software in 2024'
    11: ESOMAR's review of the research software sector, with its growth in 2024 and the size of the industry
    12: We used it for the 11.5% growth of research software. It also set the ceiling of the global insights industry.
    13: 'ESOMAR, AI adoption

      in research firms'
    14: ESOMAR's survey of research firms on how widely they use AI and how far they have scaled it
    15: We used it for the jump from 56% to 93% of firms using AI. It also showed only 15% have scaled it.
    16: 'Greenbook, GRIT

      report 2026'
    17: The 2026 GRIT report on research practice, with the use of synthetic data and AI-moderated interviews
    18: We used it for synthetic data use rising from 26% to 44% at large suppliers. It framed the speed of change.
