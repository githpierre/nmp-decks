ed142p:
  title: 'What are the biggest threats


    to the AI market research market?'
  events:
  - impact: 3
    odds: 45
    text: Qualtrics, Medallia and SurveyMonkey add AI interviews and synthetic panels at no extra cost to customers
  - impact: 2
    odds: 40
    text: Bots and AI agents flood online survey panels, making real respondent data too dirty to trust
  - impact: 2
    odds: 25
    text: Funding falls for AI research startups after too many lookalike tools launch and prices collapse
  - impact: 2
    odds: 25
    text: A recession cuts marketing budgets, and research is among the first spending lines brands remove
  - impact: 3
    odds: 20
    text: A product launch based on synthetic respondents flops publicly, and brands stop trusting AI research results
  - impact: 2
    odds: 20
    text: OpenAI and Google offer customer research features inside ChatGPT and Gemini for free to business users
  - impact: 2
    odds: 20
    text: Ipsos, Kantar and Nielsen build their own AI tools and stop partnering with research startups
  - impact: 2
    odds: 12
    text: The EU AI Act and GDPR regulators restrict recording and analyzing consumer interviews with AI
  note:
  - We listed the events that could slow AI market research, from company news and regulators
  - Odds and impact are our own estimates, and all our sources are at the end of the report
