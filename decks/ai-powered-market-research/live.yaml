ed148p:
  title: 'What pushed the AI market research

    market forward, year after year?'
  events:
  - year: '1999'
    text: SurveyMonkey makes online surveys affordable
    impact: 1.0
  - year: '2002'
    text: Qualtrics digitizes research workflows
    impact: 1.0
  - year: '2003'
    text: NPS standardizes customer feedback
    impact: 0.5
