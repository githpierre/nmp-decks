ed052p:
  type: pp_cagr
  title: 'How much bigger can

    AI market research get?'
  lead: ''
  condition: To get that big, the market must prove that AI interviews and synthetic respondents predict real buyer behavior as well as human panels, so
    brands shift budget from agencies and not only from pilot projects.
  note:
  - We compared forecasts from Stratistics MRC, Future Market Insights, a16z and ET BrandEquity
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: 4.5
  cagr: 22
  y0: 2026
