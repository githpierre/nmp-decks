    text: Survey declines spur research innovation
    impact: 1.0
  - year: '2019'
    text: SurveyMonkey automates text sentiment coding
    impact: 2.0
  - year: '2022'
    text: ChatGPT makes research AI accessible
    impact: 2.5
  - year: '2023'
    text: Ipsos Facto brings LLMs into research
    impact: 2.0
  - year: '2023'
    text: Qualtrics automates video feedback summaries
    impact: 2.0
  - year: '2023'
    text: Qualtrics scales research interviewing
    impact: 1.5
  - year: '2024'
    text: Qualtrics adds AI research synthesis tools
    impact: 2.0
  - year: '2024'
    text: Qualtrics connects large panels to insights
    impact: 1.0
  - year: '2024'
    text: Dovetail automates conversation analysis
    impact: 2.0
  - year: '2024'
    text: Dovetail Channels groups feedback with AI
    impact: 1.5
  - year: '2024'
    text: Outset tests acceptance of AI interviewing
    impact: 1.0
  - year: '2024'
    text: Ipsos cautions against synthetic research
    impact: 1.5
  - year: '2024'
    text: Researchers foresee synthetic respondent use
    impact: 1.0
  - year: '2025'
    text: Qualtrics Edge speeds synthetic research
    impact: 2.0
  - year: '2025'
    text: Ipsos Stanford tests synthetic consumers
    impact: 1.5
  - year: '2025'
    text: Qualtrics adds PureSpectrum panel data
    impact: 1.5
  - year: '2025'
    text: SurveyMonkey lets AI analyze responses
    impact: 2.0
  - year: '2025'
    text: Dovetail agents automate insight reporting
    impact: 1.5
  - year: '2025'
    text: Outset explains scalable AI interviews
    impact: 0.5
  - year: '2026'
    text: YouGov links AI interviews to brand metrics
    impact: 2.5
  - year: '2026'
    text: SurveyMonkey removes AI survey barriers
    impact: 1.5
  - year: '2026'
    text: SurveyMonkey adds Claude research connector
    impact: 1.5
  - year: '2026'
    text: Dovetail launches evidence-based twins
    impact: 1.5
  - year: '2026'
    text: YouGov scales moderated AI interviews
    impact: 2.0
  - year: '2026'
    text: SurveyMonkey brings surveys into ChatGPT
    impact: 1.5
  - year: '2026'
    text: Researchers test synthetic respondent quality
    impact: 1.0
  - year: '2026'
    text: Pew exposes synthetic survey accuracy gaps
    impact: 2.5
  note:
  - We kept the events we believe pushed ai powered market research forward the most
  - Ratings are our estimates, with all the sources at the end of the report
