ed052p:
  type: pp_cagr
  title: 'Is the solid-state battery

    market still growing fast?'
  lead: ''
  condition: Yes, but semi-solid cells must keep winning cars and grid storage in China while their price falls toward that of liquid LFP cells. Fully solid
    cells must also leave pilot lines on time, with BYD, CATL, Samsung SDI, and Toyota shipping in volume before 2030.
  note:
  - We compared forecasts from Fortune, MarketsandMarkets, Roots, Grand View and EVTank to build a realistic range
  - We added our funding tracker and aligned their timelines, and all the sources are included at the end of the report
  size: 1.2
  cagr: 40
  y0: 2026
