ed007p:
  type: pp_radar
  title: 'Which companies really belong

    in solid-state batteries today?'
  TL:
    name: Toyota
    src: ../../assets/logos/pp_live/solid-state-battery/s01-00.png
    text: is working with Idemitsu to put solid-state cells in its cars from 2027 or 2028, but it is a carmaker, not a battery seller
  TR:
    name: Albemarle
    src: ../../assets/logos/pp_live/solid-state-battery/s01-02.png
    text: refines the lithium that \ solid-state cells need, but it sells the same material to every conventional battery maker
  BL:
    name: SES AI
    src: ../../assets/logos/pp_live/solid-state-battery/s01-10.png
    text: began as SolidEnergy Systems, but its lithium-metal cells use a liquid electrolyte and it now sells AI materials discovery
  BR:
    name: 24M
    src: ../../assets/logos/pp_live/solid-state-battery/s01-11.png
    text: calls its cells semi-solid, but the name refers to thick clay-like electrodes soaked in a liquid electrolyte, not a solid one
  caption:
  - Distance to the center reflects how fully a cell relies on a solid electrolyte, rather than a liquid or gel one
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
