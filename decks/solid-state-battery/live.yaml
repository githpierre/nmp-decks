ed142p:
  title: 'What could go wrong for

    solid-state batteries?'
  events:
  - odds: 35
    impact: 3
    text: Fully solid-state cells slip to 2030 or later, and QuantumScape and Solid Power run short of cash
  - odds: 30
    impact: 3
    text: BYD, CATL and Samsung SDI build solid-state cells in their own plants, leaving startups few buyers
  - odds: 25
    impact: 3
    text: Cheaper LFP liquid batteries keep improving, so carmakers see no need to pay for solid-state cells
  - odds: 20
    impact: 2
    text: QingTao's Hong Kong IPO and WeLion's ChiNext listing stall or flop, cutting off funding for the sector
  - odds: 10
    impact: 2
    text: A car with a semi-solid battery pack catches fire, and buyers lose trust in solid-state claims
  - odds: 10
    impact: 2
    text: China cuts subsidies and tax breaks for solid-state batteries, slowing QingTao, WeLion and peers
  - odds: 5
    impact: 1
    text: Lithium sulfide supply stalls, so solid-state battery makers cannot get enough material for new plants
  - odds: 5
    impact: 2
    text: A fire or toxic gas leak at a sulfide electrolyte plant halts solid-state battery production
  note:
  - We listed the events that could slow solid state battery down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
