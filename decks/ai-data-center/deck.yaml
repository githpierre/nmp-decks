  type: x/have_been_different_waves_hot
  section: Top players
  title: What have been the different waves of ‘hot’ startups over time?
  note: We traced the shift from small and converted sites to multibillion-dollar campuses. We separate delivered space from projects still on paper.
  src: 174
  t:
    6: '2018 - 2022


      Crusoe started around energy-linked computing. Firmus built cooled AI rooms, and DayOne set up a cross-border data center group.'
    7: '2023 - 2024


      Mining sites shifted toward AI hosting. Crusoe raised $600M in 2024 while Nscale planned dense, liquid-cooled sites.'
    8: '2025


      Crusoe opened its first Abilene phase and crossed $10B in valuation. Nscale raised $1.1B while miners signed long AI leases.'
    9: 'TODAY


      DayOne bills over 1 GW, Crusoe reports 1 GW running, and Core Scientific bills on 485 MW of leased AI space.'
    10: '?


      The next winners must turn signed leases into working halls, not just planned power. Faster modules help, but grid access and funding are key.'
