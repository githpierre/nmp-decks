- id: iv_safety
  type: x/pain_points_yesterday_vs_today
  section: Market challenges
  title: What risks have already hit AI data center builders?
  note: We used documented leases, utility timelines, local policy examples and construction benchmarks. Each risk can delay rent or erase the case for a project.
  src: 54
  t:
    6: 'TENANT LOSS



      Fermi signed a TensorWave lease in August 2026, then ended it in November. Even a signed deal may never produce rent.'
    7: 'GRID DEADLINE



      JLL says grid connections in major markets take over four years on average. Empty land may sit idle as debt costs grow.'
    8: 'PERMIT FREEZE



      Berkeley Lab tracked 2026 city moratoriums in Seattle and Minneapolis. A town can halt a project even when demand and financing exist.'
    9: 'CAPITAL BURN



      JLL puts 2026 base shell costs at $11M per MW before land or AI chips. Delays can trap huge sums of cash.'
    10: 'DESIGN MISMATCH



      CBRE says retrofitting a hall for liquid cooling can take over six months. AI racks may outgrow the original design.'
