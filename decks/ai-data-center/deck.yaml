- id: iv_fda
  type: x/were_key_phases_market_acceleration
  section: Market challenges
  title: What does it take to turn land into a live AI data center?
  note: We combined illustrative development schedules with live project examples. Stages overlap, and power or local approval may extend the entire schedule.
  src: 147
  t:
    7: 'SITE & POWER


      The developer checks land and utility power. Site search takes 6 to 12 months, grid access years.'
    8: 'LOCAL PERMITS


      Local and state officials review zoning and permits. Allow about 6 to 18 months.'
    9: 'LEASE & DEBT


      A tenant signs a long lease. Banks arrange debt during planning, which can take 9 to 18 months.'
    10: 'TEST & OPEN


      Engineers test backup power and cooling for 2 to 4 months. Tenants then accept halls in phases.'
    11: 'BUILD THE HALL


      Crews install power gear and liquid cooling. JLL puts the average 50 MW building at 18 months.'
