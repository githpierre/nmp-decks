  src: 154
  t:
    6: More AI use raises demand for space, which supports new long-term facility leases
    7: More signed leases unlock funds, letting builders deliver usable AI halls sooner
    8: Better liquid cooling packs more chips into each hall, raising site demand
    9: More large leases justify grid work and site upgrades that unlock additional space
    10: More power-rich sites make larger campuses viable and draw more tenant interest
    11: More delivered halls bring rent to help pay for later phases on the same campus
    12: Each on-time opening builds tenant trust and helps win the next large lease
    13: New AI campuses in less crowded regions ease grid bottlenecks and attract projects
    14: 📈
    15: 📈
    16: 📈
    17: 📈
    18: 📈
    19: 📈
