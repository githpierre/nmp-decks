- id: ed091
  type: x/has_tech_infra_evolved_over
  section: Tech and infra
  title: How has tech and infra evolved over the years?
  note: We trace the shift from general powered sites to verified AI-first campuses, using early hosting contracts and later delivery milestones.
  src: 91
  t:
    6: '2017 - 2020


      Operators built power-first sites for cloud and mining. Some hosted GPUs before high-density AI became a separate facility business.'
    7: '2021 - 2023


      Bigger AI jobs needed connected GPU rooms. Rising server power began to strain older air-cooled sites.'
    8: '2024 - 2025


      Core Scientific signed a big AI hosting deal. Crusoe built the Abilene Stargate site, with its first buildings live in 2025.'
    9: 'TODAY


      Operators sell firm power and liquid cooling. Galaxy and Applied Digital have delivered leased AI halls, not just plans.'
    10: '?


      Operators may pair on-site power, factory-built halls and water-saving cooling loops to shorten the time from lease to use.'
- id: ed092
  type: x/were_latest_tech_infra_developments
  section: Tech and infra
  title: What were the latest tech and infra developments?
  page: 1/2
  note: We selected signed capacity contracts and sites put into service rather than treating unleased land or announced power targets as delivery.
  src: 92
  t:
    13: '2024'
    14: Core Scientific signed 12-year deals with CoreWeave for 200 MW of AI hosting, so mining sites could become AI facilities.
    15: '2025'
    16: Crusoe energized two Abilene buildings, bringing Stargate GPU systems online for Oracle Cloud Infrastructure.
    17: '2025'
    18: Applied Digital signed about 15-year leases for 250 MW at Ellendale with CoreWeave, giving its first AI campus a firm customer.
    19: '2025'
    20: Galaxy agreed to deliver an extra 260 MW to CoreWeave at Helios, raising the AI conversion beyond the first signed phase.
    21: '2025'
    22: Nscale and Microsoft committed to the Loughton AI campus near London, linking a purpose-built UK facility to a named user.
    23: '2025'
    24: IREN signed a Microsoft deal covering four Horizon halls at Childress, with about 200 MW of IT load planned for GPUs.
- id: ed093
  type: x/were_latest_tech_infra_developments
  section: Tech and infra
  title: What were the latest tech and infra developments?
  page: 2/2
  note: We prioritize site delivery, documented tenant leases and deployed cooling, rather than confusing proposed gigawatts with live capacity.
  src: 93
  t:
    13: '2026'
    14: Galaxy delivered 133 MW of critical IT power at Helios to CoreWeave, turning the former mining campus into a rent-paying AI facility.
    15: '2026'
    16: Core Scientific signed leases for about 530 MW with AMD and a neocloud across five sites, adding a second anchor to CoreWeave.
    17: '2026'
    18: IREN delivered Horizon 1 to Microsoft in August, showing that the new liquid-cooled AI halls at Childress were more than a power plan.
    19: '2026'
    20: Crusoe confirmed that it is building Google’s Armstrong County AI campus, using a closed-loop cooling design.
    21: '2026'
    22: Applied Digital lifted live critical IT load at Polaris Forge 1 to 250 MW, with a further 150 MW contracted to CoreWeave.
    23: '2026'
    24: Polar said its 12 MW Tørdal hall was live for Crusoe Cloud and announced a further 40 MW liquid-cooled phase for 2027.
