- id: ed214
  left: A FICTIONAL MINING OPERATOR
  logo: cipherdigital
  note:
  - We used Cipher filings and earnings updates for tenant names, contract duration and live rent.
  - We set the left side as a fictional miner rather than a claim about every mining-to-AI conversion.
  right: CIPHER DIGITAL
  rows:
  - - They keep mining with no signed AI tenants at their sites
    - Cipher signed major hosting leases with AWS and Fluidstack
  - - They sell short capacity deals with little future certainty
    - Its AWS lease runs 15 years with about $5.5B at stake
  - - They pitch a former mine without changing it for AI use
    - Cipher planned to reuse most of Black Pearl for AI halls
  - - They count unsigned site options as contracted AI demand
    - Cipher had 700 MW gross across three signed AI site leases
  - - They lack strong backing if an AI tenant stops paying
    - Google backs part of Fluidstack’s lease obligations
  - - They build out halls without a set customer move-in date
    - Rent began at Black Pearl in the third quarter of 2026
  - - They rely on one buyer to fill their entire power pool
    - Cipher leased Black Pearl, Barber Lake and Stingray
  - - They focus only on future sales without any current rent
    - Cipher began recording its first AI hosting lease rent
  section: Startup strategies
  src: 214
  title: How Cipher Digital won AI leases beyond mining
  type: contrast
  logo_src: ../../assets/logos/cipher-digital--symbol.png
