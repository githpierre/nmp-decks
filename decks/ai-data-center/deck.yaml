- id: ed054
  type: x/pain_points_yesterday_vs_today
  section: Pain points
  title: What are the pain points of yesterday vs. today?
  note: We grouped the market into phases, from cloud data centers sized by floor space to today's gigawatt AI campuses. We used company filings, lease news and utility reports.
  src: 54
  t:
    6: '2015 - 2021


      Cloud data centers grew fast near big cities, but each rack drew little power and air cooling was enough for every hall'
    7: '2022 - 2023


      ChatGPT set off a rush for AI chips, but most halls could not power or cool the new racks, and good sites ran out fast'
    8: '2024 - 2025


      AI labs and big clouds signed huge leases for new campuses, but grid hookups, gas turbines and transformers became scarce'
    9: 'TODAY


      Gigawatt AI campuses are going live, but power, local opposition and a few huge tenants limit how fast the market can grow'
    10: '?


      Own power plants and factory-built halls could speed things up, but only if AI demand holds for the 15 years of each lease'
