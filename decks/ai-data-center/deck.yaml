- id: ed210
  left: A FICTIONAL AI SITE BUILDER
  logo: crusoe
  note:
  - We used Crusoe and Lancium announcements for the live Abilene halls, financing and modular design.
  - We made the left-hand developer a fictional baseline, not a factual claim about all other companies.
  right: CRUSOE
  rows:
  - - They buy land first and hope large buyers sign on later
    - Crusoe and Lancium linked site power to the Abilene build
  - - They wait years for the first halls to start earning rent
    - Crusoe had the first two Abilene halls live within a year
  - - They design halls that only cool ordinary server racks
    - Crusoe built direct chip cooling with water in a loop
  - - They rely on one funding check to finish a vast campus
    - Crusoe used a $15B venture with Blue Owl and Primary
  - - They show land plans but no proven live site delivery
    - Crusoe reports over 1 GW delivered across its portfolio
  - - They spend years assembling every new site in the field
    - Crusoe says Spark modules can be installed in weeks
  - - They pitch future clients without a named buyer at site
    - Crusoe added a 900 MW Abilene AI campus for Microsoft
  - - They seek more funding with little proof of repeat builds
    - Crusoe raised a $3.9B Series F at roughly $31B value
  section: Startup strategies
  src: 210
  title: How Crusoe turned fast delivery into major AI campus wins
  type: contrast
  logo_src: ../../assets/logos/crusoe.png
- id: ed211
  left: A FICTIONAL AI SITE BUILDER
  logo: applieddigital
  note:
  - We checked Applied Digital leases, October operating capacity and its reported revenue contract base.
  - We used a fictional developer as the left-hand comparison, not the average operator in this sector.
  right: APPLIED DIGITAL
  rows:
  - - They announce sites without a firm tenant in place
    - Applied Digital has 1.41 GW leased across five campuses
  - - They count every option as money already guaranteed
    - Its base leases represent about $36B before extensions
  - - They leave capacity on paper for years after signing
    - Its first 100 MW at Polaris Forge 1 opened in 2025
  - - They keep the same building inactive once it is ready
    - It had 250 MW live at Polaris Forge 1 by October 2026
  - - They depend on one small buyer for all future growth
    - Its leases cover CoreWeave and big cloud tenants too
  - - They let customers walk away without paying future rent
    - Its leases require full value if the tenant walks away
  - - They build a new campus before getting a signed order
    - Its 300 MW Polaris Forge 3 lease came with $7.5B
  - - They confuse raw site power with actual AI server load
    - It reports IT load and total site power separately
  section: Startup strategies
  src: 211
  title: How Applied Digital made AI campuses bankable
  type: contrast
  logo_src: ../../assets/logos/applied-digital.png
- id: ed212
  left: A FICTIONAL MINING OPERATOR
  logo: terawulf
  note:
  - We used the company lease releases, September 2026 filing and November data center status update.
  - We treated the miner on the left as fictional and separate from the company’s documented AI pivot.
  right: TERAWULF
  rows:
  - - They keep a mine running without any AI customer lease
    - TeraWulf signed long AI leases with Core42 and Fluidstack
  - - They promise AI capacity without upgrading older halls
    - Its Fluidstack site is built for liquid-cooled AI racks
  - - They build halls with no strong rent-payment guarantee
    - Google agreed to backstop Fluidstack lease obligations
  - - They talk of future power while existing halls stay dark
    - Its full 60 MW for Core42 was in service by late 2026
  - - They call every contracted megawatt fully operational
    - It had 102 MW live and another 737 MW still being built
  - - They rely on short deals that may end before debt is paid
    - Its Fluidstack leases start with ten-year initial terms
  - - They fund the upgrade before buyers promise to pay rent
    - TeraWulf raised capital around long AI hosting leases
  - - They stay on one campus without planning another buyer
    - Its Justified site has a 20-year Google-backed lease
