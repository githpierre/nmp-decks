ed160:
  6: AI cloud operators took about 54% of the capital raised since 2024, ahead of AI campuses with about 39%
  7: 46 of the 47 rounds since 2024 disclosed an amount, and the median disclosed round was $195M
  8: US startups closed 32 of the 47 rounds and raised $16.3B, ahead of startups based in Singapore with $6.4B
  9: 31 rounds of $100M or more made up about 99% of all the capital raised in the market since 2024
  10: The $4.5B Series C round of DayOne Data Centers is the biggest since 2024, ahead of the $3.9B round of Crusoe
  11: Startups raised $18.8B in 22 rounds so far in 2026, against $5.5B in 11 rounds in all of 2025
  note: We drew these insights from our tracker of 47 AI data center equity rounds announced since January 2024, worth about $29.1B
ed162:
  6: 'BEFORE



    Before 2024, data centers were funded by big infrastructure funds, and few startups built sites made for the heat of AI chips.'
  7: 'AFTER



    Since 2024, 47 rounds raised $29.1B. AI cloud operators take the biggest share, led by Crusoe and Nscale, and gigawatt campuses now go live.'
  note: We used our tracker of AI data center equity rounds, complete from January 2024, and company releases and the press
