- after: ed136
  link: ed136 card « A site can wait four years for power even when a tenant wants space now »
  slide:
    id: xa_ercot
    type: sx_stat_strip
    section: Market challenges
    title: 'Texas has 446 GW of big users waiting

      for power, and 5.9 GW connected'
    headline: Large power users asking to join the Texas grid, April 2026
    stats:
    - v: 446 GW
      l: Requested by large users like data centers, for dates up to 2033
    - v: 9.1 GW
      l: Approved to switch on, or already switched on
    - v: 5.9 GW
      l: Actually switched on and drawing power from the grid
    story: Many requests will never be built, but the queue shows why power, not demand, sets the pace of new AI campuses. Only one megawatt in 75 asked for is switched on today.
    note:
    - We used ERCOT’s monthly report for April 2026, published on May 13, 2026. The requests
    - include large users other than AI sites, and many projects that may never be built at all
    fresh:
      period: month
      end: 2026-04
  sources:
  - claim: ERCOT large-load applications total 445.8 GW by 2033; 5.9 GW energized; 3.2 GW approved but not operational
    url: https://www.ercot.com/files/docs/2026/05/13/ERCOT-Monthly-April-2026-FINAL.pdf
    date: '2026-05-13'
    quote: ERCOT has 5.9 GW of Observed Energized Large Loads
