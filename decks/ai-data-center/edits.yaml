  3: 'CBRE, North America

    data centers H1 2026'
  4: CBRE's half-year report on North American data centers, with leasing, vacancy and building figures
  5: We used it for the 80.4% preleased and the 1.4% vacancy. It also backed the power and site risks.
  7: 'Crusoe, Series F

    funding release'
  8: Crusoe's release on its $3.9B round of September 2026, with its value and live capacity
  9: We used it for the $31B value and the 1 GW live. It also framed Crusoe as the market leader.
  10: 'JLL, global data

    center outlook 2026'
  11: JLL's yearly outlook for data centers worldwide, with grid waits, building costs and debt needs
  12: We used it for the four-year grid wait and the $11.3M per MW. It also backed the debt risks.
  13: 'Core Scientific,

    10-Q third quarter 2026'
  14: Core Scientific's quarterly filing with the SEC, with its AI leases, billed power and clients
  15: We used it for the 485 MW billed and the 530 MW of new leases. It also showed how miners pivot.
  16: 'Fortune Business

    Insights, AI data centers'
  17: Fortune Business Insights' report on the AI data center market, with sizes by year and region
  18: We used it for the $21B estimate, the 25.8% growth and the regions. We kept its wider scope apart.
