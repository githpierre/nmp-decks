    phase I release'
  8: Galaxy's release on finishing the first phase of its Helios campus, leased to CoreWeave
  9: We used it for the 133 MW delivered and the rent that began. It also showed a mine turned AI site.
  10: 'Fermi America,

    10-Q third quarter 2026'
  11: Fermi America's quarterly filing with the SEC, with its leases, letters of intent and funding needs
  12: We used it for the end of the TensorWave lease. It also backed the risks of powered land alone.
  13: 'Firmus, 900 MW

    and OpenAI release'
  14: Firmus's release on passing 900 MW under contract, with OpenAI as an anchor client in Malaysia
  15: We used it for the 900 MW and the OpenAI deal. It also framed the leaders of Asia-Pacific.
  16: 'Crusoe, Spark

    Liquid release'
  17: Crusoe's release on its factory-built, liquid-cooled module that powers up to 3.5 MW of chips
  18: We used it for the 3.5 MW unit. It also backed the rise of modular and liquid-cooled AI sites.
