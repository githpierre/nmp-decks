ed162:
  6: 'BEFORE



    Before 2024, data centers were funded by big infrastructure funds, and few startups built sites made for the heat of AI chips.'
  7: 'AFTER



    Since 2024, {db.n} rounds raised {db.total}. AI cloud operators take the biggest share, led by Crusoe and Nscale, and gigawatt campuses now go live.'
