ed007p:
  type: pp_radar
  title: 'What is actually included

    in the AI data center market?'
  TL:
    name: Meta
    src: ../../assets/logos/pp_live/ai-data-center/s01-00.png
    text: is scaling its Hyperion campus in Louisiana to 5 GW, but it leases the site for its own AI and does not sell that capacity
  TR:
    name: GE Vernova
    src: ../../assets/logos/pp_live/ai-data-center/s01-02.png
    text: has booked over $5 billion of data center orders this year, but it sells gas turbines and grid gear, not AI capacity
  BL:
    name: Equinix
    src: ../../assets/logos/pp_live/ai-data-center/s01-10.png
    text: runs key networking for eight of the top 10 neoclouds, but most of its sites remain general colocation for enterprises
  BR:
    name: Galaxy
    src: ../../assets/logos/pp_live/ai-data-center/s01-11.png
    text: delivered 133 MW of AI capacity to CoreWeave at its Helios campus, but its founder calls it half a digital assets company
  caption:
  - Distance to the center reflects how much of a business is building and running high-density sites for AI, not general hosting
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
