ed039p:
  signal: google-trends
  window: 5y
  title: 'Searches for data center doubled
  
    in the three years to mid-2025'
  date: From late 2021 to mid-2025.
  expl: Data centers left the trade press as AI labs and big clouds raced to build. Microsoft, Meta and xAI planned campuses as big as cities, and OpenAI announced Stargate in January 2025.
  term: data center
  stat: ×2
  stat_text:
  - more searches in mid-2025
  - than in 2022
  note:
  - We tracked how often people worldwide googled this term from late 2021 to July 2025
  - Google changed how it counts small terms in mid-2025, so the curve stops in July 2025
  csv: assets/trends/ai-data-center/data-center.csv
  cut: '2025-07-27'
  caption_period: November 2021 to July 2025
ed052p:
  type: pp_cagr
  title: 'How much room is left

    for this market to grow?'
  lead: 'To fill that room, '
  condition: the market must connect hundreds of new gigawatts to the grid, and keep AI demand strong enough to fill every new campus. It must also keep lenders willing to fund new campuses, and win local support for gigawatt sites in every region.
  note:
  - We compared the forecasts of Fortune Business Insights, Ameco, OG Analysis and Grand View with JLL’s AI outlook
  - We count only the rent paid for AI sites, not the chips inside, and all our sources are listed at the end of the report
  size: 25
  cagr: 26
  y0: 2026
