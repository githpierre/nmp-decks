ed142p:
  title: 'What could go wrong

    for AI data centers?'
  events:
  - odds: 30
    impact: 3
    text: More US states freeze new grid connections, so AI data centers wait years for power
  - odds: 25
    impact: 3
    text: AI demand slows and OpenAI or another lab cuts its compute deals, leaving AI campuses without tenants
  - odds: 20
    impact: 3
    text: Lenders pull back from CoreWeave and AI data center developers, leaving half-built campuses without funding
  - odds: 20
    impact: 2
    text: GPU rental prices crash again as supply floods in, making AI data center loans hard to repay
  - odds: 15
    impact: 2
    text: Microsoft, Google and Meta build all AI capacity themselves and stop leasing from developers and neoclouds
  - odds: 12
    impact: 3
    text: AI models need far less compute after an efficiency leap, so new campuses sit half empty
  - odds: 10
    impact: 2
    text: Tighter US export rules block Nvidia GPUs for planned AI data centers in the Gulf and Asia
  - odds: 5
    impact: 1
    text: A major outage at a large AI training campus wipes out weeks of a lab's training
  note:
  - We listed the events that could slow ai data center down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
