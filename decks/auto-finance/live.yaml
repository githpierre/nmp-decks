ed148p:
  title: 'What pushed the auto finance

    market forward, year after year?'
  events:
  - year: '1919'
    text: GMAC makes car credit scalable
    impact: 3.0
  - year: '1956'
    text: Highways expand financed car demand
    impact: 1.0
  - year: '1968'
    text: Truth in Lending standardizes disclosures
    impact: 1.5
  - year: '1974'
    text: ECOA broadens access to auto credit
    impact: 1.5
  - year: '1980'
    text: Captive finance supports dealer sales
    impact: 1.0
  - year: '1990'
    text: Credit scoring speeds loan decisions
    impact: 1.5
  - year: '1996'
    text: Dealer software digitizes loan submission
    impact: 1.0
  - year: '2000'
    text: E-SIGN enables digital auto contracts
    impact: 1.5
  - year: '2003'
    text: Online shopping moves finance upstream
    impact: 1.0
  - year: '2008'
    text: TALF revives auto ABS funding
    impact: 3.0
  - year: '2009'
    text: Cash for Clunkers lifts purchases
    impact: 1.0
  - year: '2010'
    text: Dodd-Frank creates federal consumer watchdog
    impact: 1.5
  - year: '2011'
    text: Auto ABS markets recover strongly
    impact: 1.5
  - year: '2013'
    text: CFPB targets indirect lending practices
    impact: 1.0
  - year: '2014'
    text: Subprime lenders expand dealer approvals
    impact: 1.5
  - year: '2015'
    text: CFPB supervises large nonbank auto lenders
    impact: 1.0
  - year: '2016'
    text: Digital retailing links cars and credit
    impact: 1.5
  - year: '2017'
    text: Online dealers embed vehicle financing
    impact: 1.5
  - year: '2018'
    text: Congress voids CFPB auto bulletin
    impact: 1.0
  - year: '2019'
    text: Instant prequalification becomes mainstream
    impact: 1.5
  - year: '2020'
    text: Low rates amplify auto borrowing
    impact: 2.0
  - year: '2021'
    text: Chip shortage inflates financed balances
    impact: 2.0
  - year: '2022'
    text: Rate hikes increase payment pressure
    impact: 1.0
  - year: '2023'
    text: EV depreciation raises collateral analytics
    impact: 1.5
  - year: '2024'
    text: FTC pricing rule targets dealer friction
    impact: 1.0
  - year: '2025'
    text: CFPB exposes repossession data gaps
    impact: 1.5
  - year: '2025'
    text: CFPB proposes narrower nonbank supervision
    impact: 1.0
  - year: '2026'
    text: Reg B change lowers liability uncertainty
    impact: 1.5
  - year: '2026'
    text: CarMax expands Tier 2 financing
    impact: 2.0
  - year: '2026'
    text: AI automation targets funding bottlenecks
    impact: 2.5
  note:
  - We kept the events we believe pushed auto finance forward the most
  - Ratings are our estimates, with all the sources at the end of the report
ed168p:
  handle: auto-finance
  title: 'Where did auto finance investors

    put their money this past year?'
  note:
  - We added up every equity round of auto finance startups in our tracker over the last twelve months
  - by category of our market definition, and rounds with no public amount count as zero here
