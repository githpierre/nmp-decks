ed052p:
  type: pp_cagr
  title: 'How much room is left

    for auto finance to grow?'
  lead: 'To fill that room, '
  condition: vehicle affordability must remain manageable and lenders must keep funding new, used and EV purchases through efficient digital channels.
  note:
  - We compared forecasts from Grand View Research, Mordor Intelligence and Fortune Business Insights
  - We adjusted each one to our market definition, and all the sources are included at the end of the report
  size: 341
  cagr: 8
  y0: null
