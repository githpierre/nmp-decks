ed007p:
  type: pp_radar
  title: 'Which companies really belong

    in decentralized exchange (DEX)?'
  TL:
    name: Aave
    src: ../../assets/logos/pp_live/decentralized-exchange/s01-00.png
    text: is a decentralized lending protocol, not a venue whose core function is trading one cryptoasset for another
  TR:
    name: Binance
    src: ../../assets/logos/pp_live/decentralized-exchange/s01-02.png
    text: is primarily a centralized exchange with custodial order books rather than a blockchain based DEX protocol
  BL:
    name: Crypto.com
    src: ../../assets/logos/pp_live/decentralized-exchange/s01-09.png
    text: is mainly centralized trading and payments, although its ecosystem also touches decentralized exchange use
  BR:
    name: OKX
    src: ../../assets/logos/pp_live/decentralized-exchange/s01-10.png
    text: operates a centralized exchange and wallet plus an onchain DEX aggregator, so only one product line fits
  caption:
  - Distance to the center reflects how central each company is to decentralized exchange (DEX)
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
