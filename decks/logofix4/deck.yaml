    explanation: Aurora integrates with Volvo and PACCAR
    failed_company: Locomation
    website: https://locomation.ai
    why_it_failed: Convoy model lacked OEM scale
    slug: locomation
    src: ../../assets/logos/pp/locomation.png
    ini: L
