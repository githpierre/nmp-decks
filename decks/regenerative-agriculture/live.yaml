ed007p:
  type: pp_radar
  title: 'What is actually included

    in regenerative agriculture?'
  TL:
    name: Pivot Bio
    src: ../../assets/logos/pp_live/regenerative-agriculture/s01-00.png
    text: replaces synthetic nitrogen with soil microbes, but it is sold as a fertilizer swap with no regenerative criteria
  TR:
    name: General Mills
    src: ../../assets/logos/pp_live/regenerative-agriculture/s01-02.png
    text: has pledged regenerative practices on 1 million acres by 2030, but it sells cereal and snacks, not farming solutions
  BL:
    name: Rabobank
    src: ../../assets/logos/pp_live/regenerative-agriculture/s01-10.png
    text: pays smallholders for carbon stored in new trees through its Acorn program, but it remains a general agricultural bank
  BR:
    name: Ecorobotix
    src: ../../assets/logos/pp_live/regenerative-agriculture/s01-11.png
    text: sprays crops plant by plant and cuts herbicide use by up to 95%, but it serves conventional farms just as well
  caption:
  - Dist to th t flects how direct i | health and it, rather tt t claiming it
