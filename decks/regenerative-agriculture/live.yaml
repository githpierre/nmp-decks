ed142p:
  title: 'What are the biggest threats

    to regenerative agriculture?'
  events:
  - odds: 45
    impact: 2
    text: Low crop prices and tariff retaliation from China squeeze farm incomes, so growers skip new practices
  - odds: 40
    impact: 3
    text: Unilever, PepsiCo and Nestle scale back regenerative sourcing pledges as ESG pressure on food giants fades
  - odds: 35
    impact: 3
    text: Voluntary soil carbon credit prices collapse after Verra and scientists question soil sampling and permanence
  - odds: 35
    impact: 1
    text: Agtech venture funding stays near decade lows, leaving soil testing and MRV startups without Series B money
  - odds: 30
    impact: 2
    text: The USDA shifts conservation money away from EQIP and CSP, cutting payments to farmers switching practices
  - odds: 20
    impact: 2
    text: A drought in the Corn Belt cuts yields on newly transitioned farms, and growers return to tillage
  - odds: 12
    impact: 2
    text: The FTC or a court rules regenerative labels misleading, forcing brands like General Mills to drop claims
  - odds: 10
    impact: 1
    text: Indigo Ag or another carbon farming platform runs out of cash and leaves farmers unpaid
  note:
  - We listed the events that could slow regenerative agriculture down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
