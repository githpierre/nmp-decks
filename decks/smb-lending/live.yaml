ed148p:
  title: 'What pushed the SMB lending

    market forward, year after year?'
  events:
  - year: '1953'
    text: SBA creates durable lending channel
    impact: 2.5
  - year: '1968'
    text: Truth in Lending improves credit clarity
    impact: 0.5
  - year: '1974'
    text: ECOA expands business credit access
    impact: 1.0
  - year: '1977'
    text: CRA pushes banks toward local businesses
    impact: 1.0
  - year: '1980'
    text: Credit scoring enters small business lending
    impact: 1.0
  - year: '1990'
    text: PC accounting creates usable cash data
    impact: 0.5
  - year: '1998'
    text: Online banking improves cash visibility
    impact: 1.0
  - year: '2006'
    text: OnDeck applies data to SMB credit
    impact: 1.5
  - year: '2008'
    text: Bank pullback opens alternative lending gap
    impact: 2.0
  - year: '2009'
    text: Kabbage automates small business approvals
    impact: 1.5
  - year: '2010'
    text: Dodd-Frank mandates lending data transparency
    impact: 1.0
  - year: '2010'
    text: Treasury funds community business lenders
    impact: 1.5
  - year: '2012'
    text: Online lenders shorten approval times
    impact: 1.5
  - year: '2014'
    text: Square embeds credit into payments
    impact: 2.0
  - year: '2015'
    text: Institutional capital backs online lenders
    impact: 1.0
  - year: '2016'
    text: Shopify embeds merchant growth capital
    impact: 1.5
  - year: '2017'
    text: Bank fintech partnerships accelerate
    impact: 1.0
  - year: '2018'
    text: APIs improve cash flow underwriting
    impact: 1.5
  - year: '2019'
    text: Embedded finance reaches software platforms
    impact: 1.5
  - year: '2020'
    text: PPP creates massive digital loan demand
    impact: 3.0
  - year: '2021'
    text: Second PPP round deepens digital adoption
    impact: 2.0
  - year: '2022'
    text: Inflation raises working capital needs
    impact: 1.0
  - year: '2023'
    text: CFPB finalizes Section 1071 rule
    impact: 1.5
  - year: '2023'
    text: Banks tighten after regional bank stress
    impact: 1.5
  - year: '2024'
    text: Fintech share of applicants keeps rising
    impact: 1.5
  - year: '2025'
    text: 1071 deadlines shift but buildout continues
    impact: 1.0
  - year: '2025'
    text: High rates favor cash flow decisioning
    impact: 1.0
  - year: '2026'
    text: CFPB narrows 1071 compliance scope
    impact: 2.0
  - year: '2026'
    text: Siemens wins SBA lending license
    impact: 2.5
  - year: '2026'
    text: PPP relationships still lift SMB lending
    impact: 2.0
  note:
  - We kept the events we believe pushed smb lending forward the most
  - Ratings are our estimates, with all the sources at the end of the report
ed168p:
  handle: smb-lending
  title: 'Where did SMB lending investors

    put their money this past year?'
  note:
  - We added up every equity round of smb lending startups in our tracker over the last twelve months
  - by category of our market definition, and rounds with no public amount count as zero here
