ed007p:
  type: pp_radar
  title: 'What is actually included

    in the SMB lending market?'
  TL:
    name: Brex
    src: ../../assets/logos/pp_live/smb-lending/s01-00.png
    text: offers business cards and spend tools, with lending features but not a primary SMB lending business
  TR:
    name: Shopify
    src: ../../assets/logos/pp_live/smb-lending/s01-02.png
    text: offers merchant financing, but ecommerce software and payments remain the core business
  BL:
    name: Block
    src: ../../assets/logos/pp_live/smb-lending/s01-09.png
    text: square Loans finances sellers inside Square, while Block also operates payments, Cash App and other businesses
  BR:
    name: PayPal
    src: ../../assets/logos/pp_live/smb-lending/s01-10.png
    text: provides merchant working-capital loans, while payments and wallets make up the broader company
  caption:
  - Distance to the center reflects how central each company is to SMB lending
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
