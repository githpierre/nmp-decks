ed052p:
  type: pp_cagr
  title: 'How much room is left

    for SMB lending to grow?'
  lead: 'To fill that room, '
  condition: SMB credit demand must remain healthy while lenders improve underwriting, funding costs and loss control for smaller borrowers.
  note:
  - We compared forecasts from Mordor Intelligence, The Business Research Company and Allied Market Research
  - We adjusted each one to our own definition of the market, and all our sources are listed at the end of the report
