ed148p:
  title: 'What pushed the patient engagement

    market forward, year after year?'
  events:
  - year: '1998'
    text: Patient portals expose records online
    impact: 2.0
  - year: '1999'
    text: Epic begins developing MyChart portal
    impact: 1.5
  - year: '2000'
    text: Palo Alto launches Epic MyChart
    impact: 2.0
  - year: '2003'
    text: Kaiser adds interactive online records
    impact: 2.0
  - year: '2004'
    text: US creates national health IT office
    impact: 1.0
  - year: '2006'
    text: Consumer portals gain wider industry backing
    impact: 1.0
  - year: '2007'
    text: iPhone resets mobile service expectations
    impact: 1.0
  - year: '2009'
    text: HITECH pays providers to digitize
    impact: 3.0
  - year: '2010'
    text: OpenNotes tests transparent clinical notes
    impact: 1.5
  - year: '2011'
    text: Meaningful Use mandates patient access
    impact: 2.5
  - year: '2012'
    text: Stage 2 adds secure messaging rules
    impact: 2.0
  - year: '2014'
    text: View-download-transmit becomes required
    impact: 2.0
  - year: '2014'
    text: Secure messaging becomes payment-linked
    impact: 1.5
  - year: '2015'
    text: Kaiser portal reaches mass adoption
    impact: 1.5
  - year: '2016'
    text: Cures Act targets information blocking
    impact: 2.5
  - year: '2017'
    text: FHIR adoption accelerates app connectivity
    impact: 1.5
  - year: '2018'
    text: Promoting Interoperability replaces MU
    impact: 1.5
  - year: '2019'
    text: Smartphone portals become default access
    impact: 1.0
  - year: '2020'
    text: CMS mandates payer Patient Access APIs
    impact: 2.0
  - year: '2020'
    text: Covid moves access and intake online
    impact: 2.0
  - year: '2021'
    text: Information blocking rules take effect
    impact: 2.0
  - year: '2022'
    text: US expands information blocking scope
    impact: 1.5
  - year: '2023'
    text: Generative AI enters patient communications
    impact: 1.0
  - year: '2024'
    text: CMS sets new API deadlines
    impact: 2.0
  - year: '2024'
    text: HTI-1 raises interoperability baseline
    impact: 1.5
  - year: '2025'
    text: Health systems automate more portal messaging
    impact: 1.0
  - year: '2025'
    text: Patient access becomes routine expectation
    impact: 1.0
  - year: '2026'
    text: CMS starts Patient API usage reporting
    impact: 2.0
  - year: '2026'
    text: Athena launches agentic communications
    impact: 2.0
  - year: '2026'
    text: Epic brings Emmie into MyChart
    impact: 2.0
  note:
  - We kept the events we believe pushed patient engagement software forward the most
  - Ratings are our estimates, with all the sources at the end of the report
