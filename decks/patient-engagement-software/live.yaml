ed007p:
  type: pp_radar
  title: 'Which companies really belong

    in patient engagement software?'
  TL:
    name: Twilio
    src: ../../assets/logos/pp_live/patient-engagement-software/s01-00.png
    text: it powers messaging that healthcare apps can use, but it is generic communications infrastructure rather than healthcare
  TR:
    name: Epic
    src: ../../assets/logos/pp_live/patient-engagement-software/s01-02.png
    text: its EHR includes a patient portal and ~~ messaging, but patient engagement is one module inside a much broader clinical
  BL:
    name: Notable
    src: ../../assets/logos/pp_live/patient-engagement-software/s01-09.png
    text: it automates patient intake and outreach, but also sells wider administrative automation across provider operations
  BR:
    name: Kyruus Health
    src: ../../assets/logos/pp_live/patient-engagement-software/s01-10.png
    text: it centers on provider search and access while also supporting scheduling and patient engagement across the care journey
  caption:
  - Distance to the center reflects how central each company is to patient engagement software
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
