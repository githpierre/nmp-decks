- label: DENTAL AI
  type: pp_risks
  section: Market challenges
  title: What are the biggest threats to the dental AI market?
  events:
  - text: New UK liability rules make dentists wary of clinical AI tools from Pearl, Overjet and VideaHealth
    odds: 45
    impact: 3
  - text: The FDA asks for new prospective trials for dental imaging AI, slowing clearances for Overjet, Pearl and Videa
    odds: 35
    impact: 3
  - text: Large dental groups delay AI rollouts after pilots show small gains in treatment acceptance for the added cost
    odds: 40
    impact: 2
  - text: Insurers turn down more AI-supported dental claims, weakening the revenue case for automated charting tools
    odds: 30
    impact: 2
  - text: A major dental AI misdiagnosis lawsuit raises malpractice premiums and makes independent practices postpone adoption
    odds: 25
    impact: 3
  - text: Dental staffing gets easier, which cuts demand for AI notes, automated front desks and insurance workflow tools
    odds: 20
    impact: 1
  - text: Dentrix and Eaglesoft bundle cheap AI features, squeezing standalone vendors and slowing independent product sales
    odds: 45
    impact: 2
  - text: Regulators restrict reuse of dental images for model training, raising data costs for Pearl, Overjet and smaller competitors
    odds: 35
    impact: 2
  note:
  - We listed the events that could slow dental AI down, from company news, regulators and analysts
  - Odds and impact are our estimates, and all the sources we used are listed at the end of the report
