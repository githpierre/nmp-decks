    name: Constellation
    text: runs the largest US nuclear fleet and is reviving Three Mile Island for Microsoft, but these are conventional plants
  TR:
    src: ../../assets/logos/pp_live/advanced-nuclear/s01-01.png
    name: Cameco
    text: is one of the largest uranium fuel suppliers and owns 49% of Westinghouse, but mining uranium is not new reactor technology
  BL:
    src: ../../assets/logos/pp_live/advanced-nuclear/s01-10.png
    name: Westinghouse
    text: markets its AP300 small reactor, but its AP1000 is a large Gen III+ unit and its core business serves running plants
  BR:
    name: Southern Company
    src: ../../assets/logos/southern-company.png
    text: finished Vogtle 3 and 4 in Georgia, the newest US reactors, but they are large AP1000 units, not advanced designs
