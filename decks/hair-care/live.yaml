ed007p:
  type: pp_radar
  title: 'What Is actually included

    in the hair care market?'
  TL:
    name: Dyson
    src: ../../assets/logos/pp_live/hair-care/s01-00.png
    text: sells hair dryers and styling tools, but its core business is hardware rather than haircare formulations
  TR:
    name: Maybelline
    src: ../../assets/logos/pp_live/hair-care/s01-02.png
    text: is a color cosmetics brand, so it does not compete in shampoos, conditioners or scalp care products
  BL:
    name: P&G
    src: ../../assets/logos/pp_live/hair-care/s01-09.png
    text: owns large shampoo brands, but haircare is one segment inside a diversified consumer-products company
  BR:
    name: L Oreal
    src: ../../assets/logos/pp_live/hair-care/s01-10.png
    text: owns major haircare brands, but hair is only one part of a much larger beauty portfolio spanning many categories
  caption:
  - Distance to the center reflects how central each company is to hair care
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
