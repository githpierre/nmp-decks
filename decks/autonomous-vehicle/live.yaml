ed052p:
  type: pp_cagr
  title: 'How much room is left

    for this market to grow?'
  lead: 'To fill that room, '
  condition: robotaxis must spread to dozens of cities in the US, China, the Gulf, and Europe, with fleets in the hundreds of thousands. Driverless trucks
    and robovans must scale too, and vehicles must get cheap enough for each ride and each mile to make a profit.
  note:
  - We compared forecasts from Grand View, Precedence, MarketsandMarkets and Goldman Sachs
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: 1
  cagr: 40
  y0: 2026
