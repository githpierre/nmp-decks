ed142p:
  title: 'What are the biggest threats

    to autonomous vehicles?'
  events:
  - odds: 35
    impact: 2
    text: Pony.ai, WeRide and other robotaxi operators keep losing money for years and investors lose patience
  - odds: 35
    impact: 2
    text: Another blackout or software bug freezes hundreds of robotaxis and blocks city traffic, as in San Francisco
  - odds: 30
    impact: 2
    text: Mid-size autonomous driving startups fail to raise new rounds as capital flows only to Waymo and Tesla
  - odds: 25
    impact: 2
    text: Federal and state rules keep human safety drivers in Aurora and Kodiak trucks, killing the driverless savings
  - odds: 20
    impact: 1
    text: Public protests and vandalism against Waymo cars spread to new cities and slow robotaxi launches across America
  - odds: 15
    impact: 3
    text: Tesla scales its Cybercab fleet at a far lower cost per mile than Waymo and rival operators
  - odds: 15
    impact: 2
    text: The US bans Chinese autonomous driving software and China blocks Western players, splitting the market in two
  - odds: 10
    impact: 3
    text: After a fatal robotaxi crash, US regulators suspend driverless permits for Waymo, Zoox and every other operator
  note:
  - We listed the events that could slow autonomous vehicle down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
