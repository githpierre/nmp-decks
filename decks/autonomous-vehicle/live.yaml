ed007p:
  type: pp_radar
  title: 'Which companies really belong

    in autonomous driving today?'
  TL:
    name: Mercedes-Benz
    src: ../../assets/logos/pp_live/autonomous-vehicle/s01-00.png
    text: was the first carmaker to sell certified Level 3 driving, but it has dropped Drive Pilot from its newest US models
  TR:
    name: Uber
    src: ../../assets/logos/pp_live/autonomous-vehicle/s01-02.png
    text: offers robotaxi rides from Waymo, WeRide and others in its app, but it builds none of the self-driving technology itself
  BL:
    name: Mobileye
    src: ../../assets/logos/pp_live/autonomous-vehicle/s01-09.png
    text: supplies the self-driving system for Volkswagen's robotaxis, but most of its sales come from driver assistance chips
  BR:
    name: Tesla
    src: ../../assets/logos/pp_live/autonomous-vehicle/s01-10.png
    text: runs driverless robotaxis in three Texas cities, but the FSD it sells to 1.3 million owners is still a supervised system
  caption:
  - Distance to the center reflects how fully a vehicle takes over the driving task on public roads, not just assists the driver
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
