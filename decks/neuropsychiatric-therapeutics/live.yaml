ed007p:
  type: pp_radar
  title: 'Which companies really belong

    in neuropsychiatric therapeutics?'
  TL:
    name: Biogen
    src: ../../assets/logos/pp_live/neuropsychiatric-therapeutics/s01-00.png
    text: focuses mainly on neurological and neurodegenerative diseases, not psychiatric and behavioral indications
  TR:
    name: Headspace
    src: ../../assets/logos/pp_live/neuropsychiatric-therapeutics/s01-02.png
    text: provides meditation and mental health services but does not develop regulated neuropsychiatric drug therapies
  BL:
    name: Bristol Myers Squibb
    src: ../../assets/logos/pp_live/neuropsychiatric-therapeutics/s01-09.png
    text: markets a novel schizophrenia medicine, but neuroscience —~ remains one part of a broad global drug portfolio
  BR:
    name: Otsuka
    src: ../../assets/logos/pp_live/neuropsychiatric-therapeutics/s01-10.png
    text: has major psychiatric drug franchises, while its broader pharmaceutical portfolio covers many other diseases
  caption:
  - Distance to the center reflects how central each company is to neuropsychiatric therapeutics
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
