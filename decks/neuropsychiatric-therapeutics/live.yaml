    text: Clozapine validates refractory schizophrenia
    impact: 1.5
  - year: '1997'
    text: Atypical antipsychotics expand prescribing
    impact: 1.5
  - year: '2002'
    text: Atomoxetine adds nonstimulant ADHD therapy
    impact: 1.0
  - year: '2006'
    text: Serotonin targeting gains validation
    impact: 1.0
  - year: '2009'
    text: Ketamine data revive rapid antidepressants
    impact: 2.0
  - year: '2013'
    text: Vortioxetine broadens antidepressant options
    impact: 1.0
  - year: '2015'
    text: Brexpiprazole expands adjunctive care
    impact: 1.0
  - year: '2015'
    text: Cariprazine expands bipolar treatment choice
    impact: 1.0
  - year: '2016'
    text: Pimavanserin validates nondopamine psychosis
    impact: 1.5
  - year: '2019'
    text: Spravato validates rapid acting therapy
    impact: 3.0
  - year: '2019'
    text: Brexanolone creates postpartum market
    impact: 1.5
  - year: '2019'
    text: Lumateperone adds schizophrenia option
    impact: 1.0
  - year: '2021'
    text: Viloxazine revives nonstimulant ADHD
    impact: 1.0
  - year: '2021'
    text: Lybalvi targets antipsychotic weight gain
    impact: 1.0
  - year: '2022'
    text: Sublingual drug treats acute agitation
    impact: 1.0
  - year: '2023'
    text: Zurzuvae validates oral postpartum therapy
    impact: 2.0
  - year: '2023'
    text: Exxua adds serotonin selective therapy
    impact: 1.0
  - year: '2023'
    text: Psychedelic guidance clarifies trial design
    impact: 1.5
  - year: '2024'
    text: Cobenfy validates muscarinic treatment
    impact: 2.5
  - year: '2024'
    text: Psychedelic setback raises evidence bar
    impact: 1.0
  - year: '2025'
    text: New neuropsychiatry pipelines regain capital
    impact: 1.0
  - year: '2025'
    text: Long acting drugs deepen adherence focus
    impact: 1.0
  - year: '2026'
    text: Bysanti adds schizophrenia treatment choice
    impact: 1.5
  - year: '2026'
    text: FDA accelerates serious mental illness drugs
    impact: 2.0
  - year: '2026'
    text: Caplyta relapse data strengthens chronic use
    impact: 1.5
  - year: '2026'
    text: FDA advances ibogaine trial framework
    impact: 1.0
  note:
  - We kept the events we believe pushed neuropsychiatric therapeutics forward the most
  - Ratings are our estimates, with all the sources at the end of the report
