ed148p:
  title: 'What pushed the neuropsychiatric

    drug market forward, year after year?'
  events:
  - year: '1952'
    text: Chlorpromazine transforms schizophrenia care
    impact: 2.0
  - year: '1957'
    text: Imipramine validates antidepressant therapy
    impact: 1.5
  - year: '1960'
    text: Benzodiazepines expand anxiety treatment
    impact: 1.0
  - year: '1987'
    text: Prozac mainstreams SSRI antidepressants
    impact: 2.5
