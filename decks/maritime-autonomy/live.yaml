ed007p:
  type: pp_radar
  title: 'Who Is in maritime autonomy,

    and who stays outside?'
  TL:
    name: Anduril
    src: ../../assets/logos/pp_live/maritime-autonomy/s01-00.png
    text: builds autonomous maritime systems, but its business also spans air, land and other defense domains
  TR:
    name: Maersk
    src: ../../assets/logos/pp_live/maritime-autonomy/s01-02.png
    text: operates global shipping and logistics services, but it is not primarily a developer of autonomous vessel systems
  BL:
    name: Exail
    src: ../../assets/logos/pp_live/maritime-autonomy/s01-09.png
    text: builds autonomous maritime robots, but it also sells navigation, aerospace and photonics systems outside maritime
  BR:
    name: Avikus
    src: ../../assets/logos/pp_live/maritime-autonomy/s01-10.png
    text: develops vessel autonomy and . . tat “ navigation, but it is a technology unit inside the broader HD Hyundai group
  caption:
  - Distance to the center reflects how central each company is to maritime autonomy
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
