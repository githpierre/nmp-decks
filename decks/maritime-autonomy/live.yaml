ed148p:
  title: 'What pushed the maritime autonomy

    market forward, year after year?'
  events:
  - year: '2014'
    text: Commercial marine autonomy startups emerge
    impact: 1.0
  - year: '2015'
    text: Cheap sensors improve marine perception
    impact: 1.0
  - year: '2016'
    text: Remote operations gain industry trials
    impact: 1.0
  - year: '2017'
    text: Sea Machines launches SM300
    impact: 2.0
  - year: '2017'
    text: Yara funds autonomous container ship
    impact: 2.0
  - year: '2018'
    text: SM300 becomes commercially available
    impact: 2.0
  - year: '2018'
    text: Remote demos span 1,500 miles
    impact: 1.5
  - year: '2019'
    text: IMO begins MASS regulatory scoping
    impact: 1.5
  - year: '2020'
    text: Mayflower autonomous ship launches
    impact: 1.5
  - year: '2020'
    text: Pandemic spotlights crew constraints
    impact: 1.0
  - year: '2021'
    text: Yara Birkeland makes maiden voyage
    impact: 2.5
  - year: '2021'
    text: Saildrone enters Category 4 hurricane
    impact: 2.0
  - year: '2021'
    text: Defense demand accelerates USVs
    impact: 1.5
  - year: '2022'
    text: Mayflower crosses Atlantic crewless
    impact: 2.5
  - year: '2022'
    text: Suzaku completes autonomous cargo trial
    impact: 2.0
  - year: '2022'
    text: US Navy fields unmanned minesweeper
    impact: 2.0
  - year: '2023'
    text: Remote operation centers mature
    impact: 1.5
  - year: '2023'
    text: Collision avoidance gets real voyages
    impact: 1.5
  - year: '2024'
    text: Yara advances autonomous operations
    impact: 1.5
  - year: '2024'
    text: Navies normalize hybrid fleets
    impact: 2.0
  - year: '2024'
    text: Insurance focuses on remote risk
    impact: 1.0
  - year: '2025'
    text: Defense budgets favor unmanned vessels
    impact: 2.0
  - year: '2025'
    text: Commercial autonomy moves toward rules
    impact: 2.0
  - year: '2025'
    text: Fleet autonomy becomes software platform
    impact: 1.5
  - year: '2026'
    text: IMO adopts global MASS Code
    impact: 3.0
  - year: '2026'
    text: MASS Code takes effect
    impact: 2.0
  - year: '2026'
    text: IMO defines remote master responsibility
    impact: 1.5
  - year: '2026'
    text: IMO sets mandatory-code roadmap
    impact: 2.0
  - year: '2026'
    text: VDES strengthens maritime connectivity
    impact: 1.5
  - year: '2026'
    text: Autonomy gains regulatory legitimacy
    impact: 2.0
  note:
  - We kept the events we believe pushed maritime autonomy forward the most
  - Ratings are our estimates, with all the sources at the end of the report
ed168p:
  handle: maritime-autonomy
  title: 'Where did maritime autonomy investors

    put their money this past year?'
  note:
  - We added up every equity round of maritime autonomy startups in our tracker over the last twelve months
  - by category of our market definition, and rounds with no public amount count as zero here
