ed142p:
  title: 'What could go wrong

    for AI education?'
  events:
  - odds: 55
    impact: 3
    text: OpenAI, Google and Anthropic give free tutoring modes to students, wiping out paid AI homework apps
  - odds: 45
    impact: 3
    text: School districts face budget shortfalls after Education Department cuts and freeze new AI software contracts
  - odds: 45
    impact: 2
    text: Khan Academy, Duolingo and Pearson ship AI features to millions of users, leaving startups little distribution
  - odds: 35
    impact: 2
    text: States pass laws restricting student data in AI chatbots, adding costly COPPA and FERPA compliance work
  - odds: 30
    impact: 1
    text: Edtech venture funding stays near decade lows, so AI tutoring startups struggle to raise Series A rounds
  - odds: 25
    impact: 3
    text: A chatbot gives harmful advice to a minor, prompting FTC action and lawsuits against AI learning apps
  - odds: 20
    impact: 2
    text: A study links AI tutors to lower test scores, and teachers unions push districts to ban them
  - odds: 20
    impact: 1
    text: Chegg style cheating concerns lead universities to block AI tools during exams and coursework
  note:
  - We listed the events that could slow ai education down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
