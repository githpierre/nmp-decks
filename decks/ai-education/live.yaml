ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more students look for an AI

    tutor with every new school year'
  date: In recent months.
  expl: AI tutors went from a gimmick to a homework habit. ChatGPT, Khanmigo and Google added study modes that explain step by step instead of just giving
    answers, and students shared them on TikTok. Every back-to-school season now brings a bigger wave of searches.
  term: ai education
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/ai-education/ai-education.csv
ed052p:
  type: pp_cagr
  title: 'Is AI in education

    still growing fast?'
  lead: ''
  condition: Yes, but schools and universities must move from pilots to yearly contracts, and parents must keep paying for AI tutors and language apps.
    AI tools must also prove that students learn more with them, and they must stay safe for children as new laws arrive.
  note:
  - We compared forecasts from Grand View, IMARC, Precedence and MarketsandMarkets and adjusted each one to our market
  - We then built a realistic range from these forecasts, and you will find all the sources we used at the end of the report
  size: 9
  cagr: 25
  y0: 2026
