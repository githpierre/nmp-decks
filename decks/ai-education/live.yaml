ed007p:
  type: pp_radar
  title: 'What Is really included

    in AI in education?'
  TL:
    name: Khan Academy
    src: ../../assets/logos/pp_live/ai-education/s01-00.png
    text: built Khanmigo, a well- known AI tutor, but only about 15% of students with access use it, and videos remain its core
  TR:
    name: Canva
    src: ../../assets/logos/pp_live/ai-education/s01-02.png
    text: is free for K-12 teachers and full of AI tools for making lessons, but it remains a general design app, not a way to teach
  BL:
    name: Turnitin
    src: ../../assets/logos/pp_live/ai-education/s01-10.png
    text: is best known for catching plagiarism and Al-written essays, and policing integrity is not quite the same as teaching
  BR:
    name: Quizlet
    src: ../../assets/logos/pp_live/ai-education/s01-11.png
    text: turns notes into AI flashcards and adaptive practice tests, but at heart it is still a study app built on user-made sets
  caption:
  - Distance to the center reflects how much AT itself does the teaching, tutoring or grading, rather than adding a feature
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
