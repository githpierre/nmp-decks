ed148p:
  title: 'What pushed the private markets software

    market forward, year after year?'
  events:
  - year: '1999'
    text: eFront brings alternatives workflows online
    impact: 2.0
  - year: '2002'
    text: eFront launches venture-capital software
    impact: 1.5
  - year: '2003'
    text: eFront specializes in alternatives
    impact: 1.0
  - year: '2010'
    text: Dodd-Frank expands private-fund oversight
    impact: 2.5
  - year: '2011'
    text: SEC finalizes adviser registration rules
    impact: 2.0
  - year: '2012'
    text: Private advisers migrate to registered status
    impact: 1.5
  - year: '2015'
    text: eFront adds data intelligence tools
    impact: 1.5
  - year: '2017'
    text: eFront launches portfolio risk analytics
    impact: 1.0
  - year: '2017'
    text: iCapital broadens accredited-investor access
    impact: 1.5
  - year: '2018'
    text: eFront digitizes GP-LP data exchange
    impact: 1.5
  - year: '2018'
    text: Blackstone backs iCapital platform
    impact: 2.0
  - year: '2019'
    text: BlackRock buys eFront for $1.3B
    impact: 3.0
  - year: '2019'
    text: iCapital absorbs bank feeder operations
    impact: 1.5
  - year: '2020'
    text: Nasdaq buys Solovis analytics
    impact: 2.0
  - year: '2020'
    text: BlackRock increases iCapital stake
    impact: 1.5
  - year: '2020'
    text: iCapital acquires Artivest platform
    impact: 1.0
  - year: '2020'
    text: iCapital adds factorE risk analytics
    impact: 1.0
  - year: '2021'
    text: Private markets fundraising surges
    impact: 2.0
  - year: '2022'
    text: Private credit expands rapidly
    impact: 2.0
  - year: '2023'
    text: SEC adopts private-fund adviser rules
    impact: 2.0
  - year: '2023'
    text: AI reaches fund operations workflows
    impact: 1.0
  - year: '2024'
    text: Court vacates SEC private-fund rules
    impact: 1.0
  - year: '2024'
    text: Form PF reporting expands
    impact: 2.0
  - year: '2024'
    text: Private credit demands better monitoring
    impact: 1.5
  - year: '2025'
    text: Form PF deadlines keep moving
    impact: 1.0
  - year: '2025'
    text: Carta embeds AI in fund admin
    impact: 2.0
  - year: '2025'
    text: Alternative platforms consolidate services
    impact: 1.5
  - year: '2026'
    text: SEC extends Form PF to 2027
    impact: 1.5
  - year: '2026'
    text: Carta deploys autonomous fund agents
    impact: 2.5
  - year: '2026'
    text: Private software becomes whole-portfolio tech
    impact: 2.0
  note:
  - We kept the events we believe pushed private markets software forward the most
  - Ratings are our estimates, with all the sources at the end of the report
