ed007p:
  type: pp_radar
  title: 'Who Is In private markets

    software, and who stays outside?'
  TL:
    name: PitchBook
    src: ../../assets/logos/pp_live/private-markets-software/s01-00.png
    text: private-market data supports investors, but it is market intelligence rather than fund operations software
  TR:
    name: BlackRock
    src: ../../assets/logos/pp_live/private-markets-software/s01-02.png
    text: invests in private markets, but the asset manager itself is not a private- markets software vendor
  BL:
    name: ''
    src: ../../assets/logos/pp_live/private-markets-software/s01-09.png
    text: eFront serves private capital workflows, but it sits inside BlackRock and a broader institutional technology stack
  BR:
    name: DealCloud
    src: ../../assets/logos/pp_live/private-markets-software/s01-10.png
    text: is core deal CRM for private capital, while Intapp also sells software to legal and advisory firms
  caption:
  - Distance to the center reflects how central each company is to private markets software
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
