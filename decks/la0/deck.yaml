  events:
  - text: Lithium and nickel prices stay low, shrinking recovered-material margins and forcing smaller battery recyclers to idle plants
    odds: 55
    impact: 3
  - text: EV makers extend battery life faster than expected, delaying end-of-life feedstock and leaving new recycling plants underused
    odds: 45
    impact: 3
  - text: China expands cheap recycled-material exports, pressuring European and US recyclers with higher labor and compliance costs
    odds: 35
    impact: 2
  - text: EU regulators postpone recycled-content rules, weakening demand for recovered lithium, nickel and cobalt in batteries
    odds: 25
    impact: 2
  - text: A battery-recycling plant fire triggers tougher storage, transport and insurance rules for damaged lithium-ion batteries
    odds: 35
    impact: 3
  - text: Automakers shift faster to low-value LFP cells, reducing nickel and cobalt recovery revenue per tonne of recycled batteries
    odds: 55
    impact: 2
  - text: Collection rates miss policy targets, starving hydrometallurgical plants of consistent feedstock despite installed capacity
    odds: 45
    impact: 2
  - text: Government grants and loans are cut after elections, delaying US and European recycling plants before utilization improves
    odds: 35
    impact: 2
