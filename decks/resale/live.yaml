  signal: google-trends
  window: 5y
  title: 'More and more people ask how to buy

    and sell secondhand as prices rise'
  date: In recent months.
  expl: Prices kept rising and tariffs made new goods even pricier. At the same time, apps like Vinted, Depop and eBay made reselling as easy as posting a photo. Before the holidays, millions of people searched how to buy and sell secondhand.
  term: resale
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/resale/resale.csv
