ed007p:
  type: pp_radar
  title: 'What is actually included

    in the resale market?'
  TL:
    name: Rent
    src: ../../assets/logos/pp_live/resale/s01-00.png
    text: the Runway keeps designer dresses moving between many wearers, but renting is not reselling, even if it sells used pieces
  TR:
    name: TJ Maxx
    src: ../../assets/logos/pp_live/resale/s01-01.png
    text: sells brand names at a discount that feels like thrifting, but its stock is excess inventory no consumer ever owned
  BL:
    name: Leboncoin
    src: ../../assets/logos/pp_live/resale/s01-10.png
    text: is where France sells used furniture and clothes, but the same site also lists homes, job offers and holiday rentals
  BR:
    name: Zalando
    src: ../../assets/logos/pp_live/resale/s01-11.png
    text: sells mostly new fashion, but its Pre-owned shop now offers luxury from Vestiaire Collective, which puts it on the edge
  caption:
  - Distance to the center reflects how much of what a company sells was already owned by a consumer, rather than new or rented
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
