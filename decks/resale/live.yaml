ed142p:
  title: 'What are the biggest

    threats to resale?'
  events:
  - odds: 45
    impact: 2
    text: Customs duties without de minimis keep shrinking cross-border secondhand orders from Vinted and eBay sellers
  - odds: 40
    impact: 2
    text: Rising return and processing costs keep ThredUp and similar platforms from turning a sustained profit
  - odds: 35
    impact: 3
    text: Shein and Temu cut prices on new clothes until used items stop looking cheap to shoppers
  - odds: 30
    impact: 2
    text: Counterfeit scandals hit The RealReal or Vestiaire Collective again and buyers lose trust in luxury authentication
  - odds: 30
    impact: 3
    text: Amazon and Walmart scale their own secondhand stores and undercut ThredUp on price and delivery speed
  - odds: 25
    impact: 1
    text: EU textile EPR rules push brands to run their own resale, cutting out platforms like Vinted
  - odds: 25
    impact: 2
    text: A recession lowers demand for luxury handbags and watches, dropping resale prices on Rebag and Fashionphile
  - odds: 8
    impact: 2
    text: Congress lowers the IRS 1099-K threshold back toward $600 and casual sellers leave Poshmark and Mercari
  note:
  - We listed the events that could slow resale down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
