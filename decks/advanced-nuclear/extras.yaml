- after: xa_centrus
  link: signal 3
  slide:
    id: xa_crit
    type: kpis
    section: Market opportunity
    pill: SIGNAL
    title: "Five advanced test reactors went critical\nin 2026, three of them by June 30"
    items:
    - value: '3'
      label: Test reactors critical by June 30, 2026, starting with the Antares Mark-0 in Idaho
    - value: '4'
      label: Test reactors critical by July 4, 2026, after Aalo Atomics took its Aalo-X critical
    - value: '5'
      label: Test reactors critical by August 5, 2026, with the Oklo isotope test reactor in Texas
    why: This is a sign of a hot market because private reactor teams now turn designs into working cores in months. These were zero-power tests, so none of them sells electricity yet.
    note: We used DOE releases on its reactor pilot program up to July 4, 2026, and Oklo’s filing for the quarter to September 30, 2026
    fresh:
      period: total
      end: 2026-08
