- after: ed032
  link: signal 1
  slide:
    id: xa_haleu
    type: sx_faceoff
    section: Market opportunity
    pill: SIGNAL
    title: "A 2024 startup won a $900M HALEU award,\nas much as the incumbent Centrus"
    cards:
    - name: GENERAL MATTER
      hl: true
      stats:
      - v: $900M
        l: DOE task order to build HALEU enrichment, January 2026
      - v: '2024'
        l: the year the startup was founded
    - name: CENTRUS
      stats:
      - v: $900M
        l: the same award, for its centrifuge plant in Ohio
      - v: '1'
        l: the only US plant making HALEU today
    story: 'Washington now trusts a new fuel startup with as much money as the incumbent, a sign of a hot market. Both task orders are paid only as each company reaches its milestones.'
    note:
    - We used the DOE release of January 5, 2026 on its $2.7B of awards, with two $900M HALEU orders
    - The awards are paid against milestones, so they are neither venture funding nor cash in hand
    fresh:
      period: total
      end: 2026-01
