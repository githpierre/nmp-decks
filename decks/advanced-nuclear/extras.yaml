- after: xa_listed
  link: signal 6
  slide:
    id: xa_xenergy
    type: kpis
    section: Market opportunity
    pill: SIGNAL
    title: "X-energy’s quarterly revenue and grants\nmore than doubled, to $66.3M"
    items:
    - value: $66.3M
      label: Revenue and grant income in the quarter to September 30, 2026, up from $30.4M a year earlier
    - value: $1.8B
      label: Cash and other liquidity at the end of September 2026, after its April listing
    - value: 11 GW+
      label: Possible reactor projects in the US and the UK, if customers use all their rights
    why: This is a sign of a hot market because a pure reactor developer now earns and raises money at scale. Most of its revenue still comes from engineering work and grants, not from reactors.
