    fresh:
      period: quarter
      end: 2026-09
- after: ed132
  link: ed132 « A power contract does not mean delivery. Reactors still need testing and approval »
  slide:
    id: xa_meta
    type: sx_faceoff
    section: Market challenges
    title: "Meta backs up to 4 GW of new reactors,\nand none of it is online yet"
    cards:
    - name: ANNOUNCED
      stats:
      - v: 4 GW
        l: planned with TerraPower and Oklo in January 2026
      - v: '2030'
        l: earliest Oklo power, and 2032 for TerraPower
    - name: ONLINE TODAY
      hl: true
      stats:
      - v: 0 MW
        l: generated by these new reactors in November 2026
      - v: '0'
        l: units finished so far
    story: "Big buyers sign first and wait years for power. Permits, fuel and money still stand between a deal and a working plant, and the developer carries that risk."
    note:
    - We added Meta’s January 9, 2026 figures of up to 2.8 GW with TerraPower and 1.2 GW with Oklo
    - We left out TerraPower’s storage output and all of Meta’s deals with existing reactors
- after: ed136
  link: ed136 « A construction permit does not allow fuel loading or power sales »
  slide:
    id: xa_funnel
    type: sx_stat_strip
    section: Market challenges
    title: "X-energy counts 144 possible reactors,\nbut has not finished one yet"
    headline: How far X-energy’s Xe-100 reactors had gone by November 2026
    stats:
    - {v: '144', l: "Reactors in its US and UK pipeline if customers use all their rights"}
    - {v: '4', l: "Units at the Dow site in Texas, the only ones with an NRC build permit"}
    - {v: '0', l: "Units built or running so far, 17 years after X-energy was founded"}
    story: "A pipeline is not an order book: each reactor still needs a site, a permit, fuel and money. Leaders are judged on their first units, not on the options they sign."
    note:
    - We used X-energy’s report for the quarter to September 30, 2026 and the NRC permit of November 9
    - The 144 reactors assume that every customer uses all of its rights, so this is not an order book
- after: ed200
  link: ed200 « They fail when backers stop financing long development »
  slide:
    id: xa_doe
    type: x/sig_key_trend
    section: Startup killers
    title: "The US government still paid 78.5%\nof X-energy’s service revenue"
    t:
      9: 80.6%
      10: Q3 2025
      12: 78.5%
      13: Q3 2026
      15: '-2 pts'
      16: WHY IT MATTERS
      17: "One public buyer still pays for most of the work: DOE made up 78.5% of X-energy’s service revenue in its latest quarter.\nIf federal programs slow down, a developer like this loses most of its sales at once."
    vbars: [80.6, 78.5]
    note: We divided DOE service revenue by total service revenue in X-energy’s reports for the quarters to September 30, 2025 and 2026
