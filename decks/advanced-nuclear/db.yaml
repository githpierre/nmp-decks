ed160:
  6: Gas-cooled reactors took about 43% of the capital raised since 2024, far ahead of microreactors with about 18%
  7: 79 of the 87 rounds since 2024 disclosed an amount, and the median disclosed round was $19M
  8: US startups closed 58 of the 87 rounds and took $6.2B, about 92% of the money, far ahead of France
  9: 15 rounds of $100M or more made up about 79% of all the capital raised in the market since 2024
  10: The $1B Series B of Valar Atomics is the biggest round since 2024, ahead of the $700M raised by X-energy in 2025
  11: Seed was the most common round, with 22 of the 87 rounds, ahead of Series A with 20 and Series B with 8
  note: We drew these insights from our tracker of 87 advanced nuclear equity rounds announced since January 2024, worth about $6.8B
ed162:
  6: 'BEFORE



    Before 2024, the largest checks went to a few long-funded developers such as TerraPower, X-energy and newcleo, often backed by billionaires, utilities or the US government.'
  7: 'AFTER



    Since 2024, 87 rounds raised $6.8B. Gas-cooled reactor makers take the biggest checks, while microreactor startups multiply, mostly in the United States.'
  note: We used our tracker of advanced nuclear equity rounds, complete from January 2024, and company releases and the press
