rows:
- name: "IEA, a new era\nfor nuclear energy"
  why: The International Energy Agency's report on reactor costs, financing and the case for repeat builds
  how: We used it for what lowers the cost of new reactors. It also framed the financing pain points.
  url: https://www.iea.org/reports/the-path-to-a-new-era-for-nuclear-energy/executive-summary
- name: "DOE, Natrium\nconstruction permit"
  why: The US Department of Energy's account of the NRC permit for TerraPower's Natrium plant
  how: We used it for the March 2026 permit. It also anchored our view of who leads sodium reactors.
  url: https://www.energy.gov/ne/articles/nrc-issues-construction-permit-terrapowers-natrium-advanced-reactor
- name: "DOE, Dow and\nX-energy permit"
  why: The Department of Energy's release on the first permit for an industrial advanced reactor site
  how: We used it for the four Xe-100 units at Seadrift. It also backed our view of heat buyers.
  url: https://www.energy.gov/ne/articles/dow-x-energy-receive-construction-permit-advanced-nuclear-project-texas
- name: "NRC, first SMR\ndesign certified"
  why: The Department of Energy's summary of the first small reactor design certified by the NRC
  how: We used it for the 2023 NuScale certification. It also dated when the market became real.
  url: https://www.energy.gov/ne/articles/nrc-certifies-first-us-small-modular-reactor-design
- name: "CNSC, Darlington\nconstruction licence"
  why: The Canadian regulator's own decision to let OPG build the first BWRX-300
  how: We used it for the April 2025 licence. It also showed that the race is not US-only.
  url: https://www.canada.ca/en/nuclear-safety-commission/news/2025/04/commission-authorizes-ontario-power-generation-inc-to-construct-1-bwrx-300-reactor-at-the-darlington-new-nuclear-project-site.html
- name: "DOE, first advanced\nreactor criticality"
  why: The Department of Energy's release on the first test reactor to go critical under its pilot program
  how: We used it for Antares and the four pilot reactors. It also dated our momentum signals.
  url: https://www.energy.gov/articles/department-energy-celebrates-first-advanced-reactor-criticality
- name: "DOE, $2.7B for\nuranium enrichment"
  why: The Department of Energy's award to rebuild American enrichment of richer uranium fuel
  how: We used it for the $900M Centrus award. It also backed our fuel supply bottleneck.
  url: https://www.energy.gov/articles/us-department-energy-awards-27-billion-restore-american-uranium-enrichment
- name: "GAO, HALEU\nsupply review"
  why: The US Government Accountability Office's audit of the domestic supply of richer uranium fuel
  how: We used it for the risk of a HALEU shortage. It also weighted our fuel risk scores.
  url: https://files.gao.gov/reports/GAO-26-107385/index.html
- name: "Google, Kairos and\nTVA power deal"
  why: Google's own announcement of the first US power purchase deal for an advanced reactor
  how: We used it for the 50 MW Hermes 2 deal. It also dated when the market became hot.
  url: https://blog.google/company-news/outreach-and-initiatives/sustainability/google-first-advanced-nuclear-reactor-project-with-kairos-power-and-tennessee-valley-authority/
- name: "Meta, nuclear\nenergy projects"
  why: Meta's own release on its agreements with TerraPower, Oklo and Vistra
  how: We used it for the 6.6 GW of deals. It also backed our view of data center buyers.
  url: https://about.fb.com/news/2026/01/meta-nuclear-energy-projects-power-american-ai-leadership/
- name: "X-energy,\nquarterly filing"
  why: X-energy's filing with the US securities regulator after its April 2026 listing
  how: We used it for the IPO proceeds and the TX-1 progress. It also checked our funding figures.
  url: https://www.sec.gov/Archives/edgar/data/2088896/000119312526456659/xe-20260930.htm
- name: "newcleo, business\ncombination"
  why: newcleo's own release on closing its Nasdaq merger and the cash it raised
  how: We used it for the $247M proceeds and the $2.4B value. It also placed newcleo among the leaders.
  url: https://investors.newcleo.com/news-releases/news-release-details/newcleo-completes-business-combination-raises-247-million-and
- name: "Valar Atomics,\nSeries B release"
  why: Valar Atomics' own announcement of its $1B round led by Sequoia
  how: We used it for the biggest round since 2024. It also backed our microreactor momentum.
  url: https://www.valaratomics.com/docs/Announcing-our-1B-Series-B-Led-By-Sequoia
- name: "Standard Nuclear,\nQ3 results"
  why: Standard Nuclear's own report on its fuel deliveries and supply contracts
  how: We used it for the Radiant core and the Antares fuel deal. It also shaped our fuel strategy slide.
  url: https://ir.standardnuclear.com/news-events/press-releases/detail/106/standard-nuclear-reports-third-quarter-and-year-to-date-2026-results
- name: "NuScale and UAMPS,\nproject ended"
  why: NuScale's own release on ending the Carbon Free Power Project in Idaho
  how: We used it for the 2023 setback. It also backed our customer demand risk.
  url: https://www.nuscalepower.com/press-releases/2023/utah-associated-municipal-power-systems-and-nuscale-power-agree-to-terminate-the-carbon-free-power-project
- name: "Construction Dive,\nBechtel exit"
  why: A trade outlet that covers large construction projects and their contractors
  how: We used it for Bechtel leaving Natrium. It also backed our contractor risk.
  url: https://www.constructiondive.com/news/bechtel-splits-terrapower-nuclear-project-layoffs/830793/
- name: "NEA, SMR\ndashboard"
  why: The OECD Nuclear Energy Agency's tracker of small reactor projects and their readiness
  how: We used it for the readiness criteria. It also checked our list of bottlenecks.
  url: https://cms.oecd-nea.org/jcms/pl_122015/release-of-the-nea-small-modular-reactor-digital-dashboard-fourth-edition
- name: "Global Market\nInsights report"
  why: Market research firm with a yearly report on small modular reactors
  how: We used it as the closest published benchmark to our $5B estimate. It also set a growth range.
  url: https://www.gminsights.com/industry-analysis/small-modular-reactor-market
- name: "Precedence Research\nmarket report"
  why: Market research firm with a yearly report on small modular reactors
  how: We used it as the high end of the market size. It also gave us a growth rate estimate.
  url: https://www.precedenceresearch.com/small-modular-reactor-market
- name: "Our advanced nuclear\nfunding tracker"
  why: Our own database of every equity round since January 2024, each with its source link
  how: We used it for all the funding slides. It also counted rounds by stage and country.
  url: ''
