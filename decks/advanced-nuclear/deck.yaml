  type: x/newcomers_often_miss_here
  section: Market challenges
  title: What do newcomers often miss here?
  note: We compared licensing milestones, fuel assessments and signed power agreements. Early demonstrations are real, but cost, fuel and operating approval remain open.
  src: 132
  t:
    17: Smaller reactors do not guarantee lower costs. Factories need repeat orders first.
    21: A power contract does not mean delivery. Reactors still need testing and approval.
    23: A zero-power test shows a chain reaction, not a plant producing electricity.
    25: A construction permit allows building, not fuel loading or electricity sales.
    28: Many designs need richer uranium fuel, but U.S. commercial supply is limited.
