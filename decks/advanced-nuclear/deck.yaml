  type: x/have_been_different_waves_hot
  section: Top players
  title: What have been the different waves of ‘hot’ startups over time?
  note: We traced major developers and regulatory turning points across successive funding waves. The sequence is a directional market history.
  src: 174
  t:
    6: '2005 - 2013


      NuScale, TerraPower, X-energy and Oklo formed around reactor designs. They spent years developing technology and navigating regulators.'
    7: '2014 - 2020


      Kairos Power pursued salt cooling and Radiant began portable microreactors. Investors funded prototypes long before commercial power.'
    8: '2021 - 2024


      newcleo entered lead-cooled reactors and recycled fuel. Valar and Antares launched compact designs as AI raised interest.'
    9: '2025 - 2026


      Tech backed nuclear plans. TerraPower and X-energy won build permits. Four designs reached zero-power tests.'
    10: '?


      Future winners need fuel supplies, construction and operating licenses. Build permits and zero-power tests do not yet prove commercial electricity.'
