- id: iv_safety
  type: x/pain_points_yesterday_vs_today
  section: Market challenges
  title: What could go wrong with new reactors?
  note: We selected documented cancellations, licensing decisions, revised deadlines and regulator staffing data. These cases illustrate potential failure points, not forecast accident rates.
  src: 54
  t:
    6: 'CUSTOMER COLLAPSE



      NuScale and UAMPS ended their Utah reactor project in 2023 because not enough buyers committed to the planned power.'
    7: 'FUEL SHORTFALL



      A 2026 GAO review warned that planned U.S. supplies of richer uranium fuel may not meet near-term advanced reactor demand.'
    8: 'BUILD SLIPPAGE



      Kairos moved its Hermes construction deadline from December 2026 to April 2029 after extra prototype work and site delays.'
    9: 'REVIEW FAILURE



      The NRC denied Oklo''s Aurora permit in January 2022 because the company left key safety questions unanswered.'
    10: 'STAFF SHORTAGE



      GAO found the NRC lost about 500 staff net from July 2024 to June 2026, raising concerns about future review capacity.'
