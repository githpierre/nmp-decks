    7: 2022 - 2023
    8: NuScale gained the first U.S. small modular reactor design certification in 2023. Kairos Power then received its Hermes test reactor permit.
    9: Early 2024
    10: TerraPower filed its Natrium reactor permit request for Wyoming in March. NRC staff also reviewed Kairos Power's proposed Hermes 2 test units.
    11: Late 2024
    12: Google signed with Kairos Power for up to 500 MW of future reactors. Amazon led X-energy's $500M financing and backed its Washington project.
    13: 🏗️
    14: 💰
    15: ⚙️
    16: ⚛️
