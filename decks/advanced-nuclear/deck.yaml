- id: ed023
  type: x/learning_truths_have_flipped
  section: Market definition
  title: Which advanced nuclear truths have flipped?
  note: These are market shifts we see in buyer contracts, regulator decisions and policy since 2023. They are not formal industry rules, but they recur across the evidence.
  src: 23
  t:
    6: Nuclear used to be seen as too slow and too costly to matter
    8: Now tech giants sign nuclear power deals to feed their AI data centers
    10: US licensing used to take a decade with no fixed deadline
    12: Now a 2025 executive order gives the NRC 18 months to decide
    14: New reactors used to mean giant power plants
    16: Now reactors from a few megawatts up are sold for many uses too
    18: Small reactor startups used to live on government grants
    20: Now several of them trade on the stock market at billion-dollar values
    22: The World Bank used to refuse to finance nuclear power
    24: Now it lifted that ban in 2025 and can fund new nuclear projects
    26: Western reactor fuel used to depend heavily on Russia
    28: Now a 2024 US law bans Russian uranium and funds US enrichment
- id: ed024
  type: dated
  section: Market definition
  title: What has changed (very) recently?
  page: 1/2
  items:
  - d: SINCE 2023
    t: The NRC certified NuScale's 50 MW module, the first small reactor design approved in the US, and later approved its larger 77 MW version in 2025.
  - d: SINCE 2023
    t: China put the HTR-PM gas-cooled plant at Shidaowan into commercial operation, the first plant of its kind to sell power to a grid at scale.
  - d: SINCE 2023
    t: The NRC gave Kairos a permit to build Hermes in Tennessee, the first US approval to build a reactor not cooled by water in more than fifty years.
  - d: SINCE 2024
    t: Congress passed the ADVANCE Act to speed up and lower the cost of licensing new reactors, and banned imports of Russian uranium the same year.
  - d: SINCE 2024
    t: Google signed with Kairos for up to 500 MW of new reactors by 2035, and Amazon invested in X-energy to support 5 GW of reactors by 2039.
  - d: SINCE 2024
    t: TerraPower started non-nuclear construction of its Natrium sodium reactor plant at Kemmerer, Wyoming, next to a retiring coal plant.
  note:
  - We kept the milestones that most changed licensing, buyer demand or the first construction projects of the market
  - There is no official timeline, and another analyst could reasonably pick a few different milestones here
  src: 24
- id: ed025
  type: dated
  section: Market definition
  title: What has changed (very) recently?
  page: 2/2
  items:
  - d: SINCE 2025
    t: Ontario's regulator licensed OPG to build the first BWRX-300 at Darlington, and the province approved a plan for four of these small reactors.
  - d: SINCE 2025
    t: US executive orders set a goal of 400 GW of nuclear power by 2050, told the NRC to decide on new reactors within 18 months and launched a DOE pilot program.
  - d: SINCE 2025
    t: The World Bank lifted its long ban on financing nuclear power, opening a new source of money for reactors in developing countries.
  - d: SINCE 2025
    t: The US Army launched its Janus program to put privately owned microreactors on military bases, with the first units planned before 2030.
  - d: SINCE 2026
    t: Meta signed agreements with TerraPower, Oklo and Vistra for up to 6.6 GW of nuclear power, one of the largest nuclear buying moves by a tech company.
  - d: SINCE 2026
    t: Several companies in the DOE reactor pilot program raced to reach first criticality by July 2026, the first new US test reactors in decades.
  note:
  - We kept the milestones that most changed licensing, buyer demand or the first construction projects of the market
  - There is no official timeline, and another analyst could reasonably pick a few different milestones here
  src: 25
