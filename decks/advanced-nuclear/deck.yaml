- id: ed041
  type: x/counts_as_doesn_t
  section: Market size
  title: What counts as advanced nuclear, and what doesn't?
  note: We count new fission-reactor platforms and nuclear-specific fuel and enabling technology, while excluding fusion, legacy plants and generic contractors.
  src: 41
  t:
    7: We define advanced nuclear as new fission reactor designs and dedicated nuclear systems that improve safety, output, fuel use or deployment options.
    8: We include light-water SMRs, gas, sodium, lead and molten-salt designs, microreactors, plus dedicated fuel production and recycling.
    9: We exclude fusion, routine legacy-plant operations, uranium mining, generic building work and site-power firms with no reactor technology.
    12: ✅
    13: ❌
    14: ⚖️
