    7: '2025'
    8: AbbVie bought Capstan for $2.1 billion, Gilead bought Interius for $350 million, and BMS agreed to buy Orbital for $1.5 billion.
    9: '2026'
    10: Lilly agreed to buy Kelonia for $3.25 billion upfront. KLN-1010 later showed MRD negativity in all 18 evaluable myeloma patients.
    11: TODAY
