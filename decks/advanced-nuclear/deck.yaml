  type: x/where_80_value_sit
  section: Tech and infra
  title: Where does advanced nuclear value sit?
  note: We use DOE fuel-supply warnings, regulator milestones, and IEA financing analysis. There is no verified industry split that assigns a measured 80% of value to these layers.
  src: 90
  t:
    8: 'The value sits in licensed designs, proven safety, and nuclear fuel. A good concept cannot sell electricity without approval or fuel.


      Factory production follows. It lowers costs only when several projects use the same design, qualified suppliers, and repeatable construction.


      The largest advantage will go to teams that pair those capabilities with real sites and contracted buyers, not announcements. Fuel supply and permission to build matter before volume sales.'
