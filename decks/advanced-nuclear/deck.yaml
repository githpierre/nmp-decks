- id: ed014
  type: cards
  section: Market definition
  title: When and where is value created in the market?
  items:
  - e: 🏭
    t: When reactor modules are built in a factory instead of poured on site for years
  - e: ⚡
    t: When a plant delivers steady power around the clock, whatever the weather
  - e: 🖥️
    t: When a tech company signs a long contract for clean power next to its data centers
  - e: 🔥
    t: When a reactor sells very hot heat to chemical plants and steel makers
  - e: 📜
    t: When a design wins its licence, a step that can take a regulator many years
  - e: ⛽
    t: When a company secures a fuel supply that does not depend on Russia
  - e: 🔁
    t: When the second and third units cost far less than the first one
  - e: 🪖
    t: When a small reactor powers a military base or a remote mine off the grid
  src: 14
