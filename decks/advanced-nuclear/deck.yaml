- id: ed039p
  type: pp_trends
  section: Market opportunity
  pill: SIGNAL
  signal: google-trends
  window: 5y
  csv: assets/trends/advanced-nuclear/advanced-nuclear.csv
  term: advanced nuclear
  title: 'Lately, searches for advanced nuclear

    climbed as AI needs more power'
  date: Recently.
  expl: Nuclear came back into the news. Tech giants signed deals to power their AI data centers with new reactors, the US ordered its regulator to approve designs faster, and small reactor startups listed on the stock market. So people went looking for what advanced nuclear really is.
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
