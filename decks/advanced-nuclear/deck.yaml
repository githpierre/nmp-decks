- id: ed029
  type: x/happened_between
  section: Market opportunity
  title: What happened in-between?
  src: 29
  t:
    5: 2019 - 2021
    6: Umoja and Interius formed around targeted in vivo immune-cell engineering. Capstan followed in 2021 with targeted lipid nanoparticles for RNA delivery.
    7: 2022 - 2023
    8: Orbital launched in 2022 and raised $270 million in 2023. Umoja showed durable advanced nuclear generation and B-cell depletion in primates.
    9: Early 2024
    10: Umoja published primate data showing CAR-positive T cells and durable B-cell depletion. Multiple platforms prepared to move into human studies.
    11: Late 2024
    12: Interius dosed the first patient with INT2104 in October. EsoBiotec then launched a clinical trial of its in vivo BCMA CAR-T candidate ESO-T01.
    13: 🧬
    14: 💰
    15: 🐒
    16: 💉
