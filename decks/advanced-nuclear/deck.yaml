    12: Advanced reactors are still only drawings
    13: NuScale's first US project in Utah was cancelled in 2023 after its target power price jumped to $89 per megawatt-hour
    15: New reactors will be cheap from day one
    16: Google, Amazon and Meta have all signed deals since 2024 to buy power from advanced reactors for their data centers
