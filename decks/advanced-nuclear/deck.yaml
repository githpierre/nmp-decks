- id: iv_fda
  type: x/were_key_phases_market_acceleration
  section: Market challenges
  title: What does it take to build a new reactor?
  note: We combined NRC and CNSC licensing sequences with recent project schedules. Durations are illustrative, and reviews, site work, financing and fuel procurement can overlap.
  src: 147
  t:
    7: 'DESIGN REVIEW


      The developer tests its design and consults the NRC before filing. This groundwork may take years.'
    8: 'SITE APPROVAL


      The owner submits land and environmental studies. NRC or CNSC review can take 1 to 2 years.'
    9: 'BUILD PERMIT


      The regulator checks safety plans and can permit construction. Recent reviews ran 18 to 30 months.'
    10: 'OPERATE AND SELL


      The regulator grants an operating license after checks. Grid tests and sales take months.'
    11: 'FUEL AND BUILD


      The owner secures approved fuel and builds the reactor. First builds can need 3 to 5 years.'
