    9: '2026'
    10: TerraPower won a Natrium build permit in Wyoming. DOE also reported four zero-power reactor tests reaching criticality.
    11: TODAY
    12: In November, NRC permitted four X-energy reactors at Dow's Texas site. It allows construction, but an operating license is still needed.
