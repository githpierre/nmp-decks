- id: ed133
  type: x/has_held_back_market_growth
  section: Market challenges
  title: What has held back market growth so far?
  note: We used regulator decisions, DOE milestones and company project announcements to map major bottlenecks. These phases describe progress, not a standard project timetable.
  src: 133
  t:
    6: '2017 - 2020


      NuScale moved through U.S. review while DOE backed TerraPower and X-energy. Commercial cost and safety proof was missing.'
    7: '2021 - 2023


      The NRC certified an SMR design and cleared Kairos testing. NuScale then lost its Utah project when too few buyers committed.'
    8: '2024 - 2025


      New law pushed licensing reform. Canada licensed the Darlington small reactor, and TVA signed a Kairos power deal, but fuel and factory readiness still lagged.'
    9: 'TODAY


