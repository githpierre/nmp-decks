- id: ed006
  type: definition
  section: Market definition
  title: What is the advanced nuclear market, in simple terms?
  text: Advanced nuclear is the market for new kinds of fission reactors, smaller or built differently from today's big plants, plus the special fuels they need to run
  note: We use a conversational definition here because it makes the boundary with today's large nuclear plants and with fusion easier to understand.
  src: 6
  icon_tl: ⚛️
