- id: ed091
  type: x/has_tech_infra_evolved_over
  section: Tech and infra
  title: How has tech and infra evolved over the years?
  note: We used clinical milestones rather than discovery dates because they show when the enabling technology became usable in people.
  src: 91
  t:
    6: '2017 - 2020


      Academic teams showed that targeted viral particles could program CAR T cells directly in animals, establishing the core in vivo concept'
    7: '2021 - 2023


      Startups refined lentiviral, LNP, and fusosome delivery, while MT-302 reached patients as an RNA CAR for myeloid cells'
    8: '2024 - 2025


      Interius dosed INT2104, Umoja entered Phase 1, Capstan started CPTX2309, and large pharma began acquiring leading platforms'
    9: 'TODAY


      Multiple Phase 1 programs span cancer and autoimmunity, with early human responses reported for ESO-T01, KLN-1010, and HN2301'
    10: '?


      Next platforms may combine precise targeting, redosable RNA, durable gene placement, dual-target CARs and outpatient dosing'
- id: ed092
  type: x/were_latest_tech_infra_developments
  section: Tech and infra
  title: What were the latest tech and infra developments?
  page: 1/2
  note: We prioritized milestones with direct clinical or platform consequences, using company releases and trial records where available.
  src: 92
  t:
    13: '2023'
    14: MT-302 dosed its first patient, taking an mRNA-LNP CAR that programs myeloid cells into a Phase 1 solid-tumor study
    15: '2024'
    16: Interius dosed INT2104, a targeted lentiviral therapy that generates CD20 CAR-T and CAR-NK cells inside patients
    17: '2024'
    18: Umoja received FDA clearance for UB-VV111, moving its CD19 VivoVec in situ CAR-T platform into a Phase 1 trial
    19: '2025'
    20: Capstan started Phase 1 testing of CPTX2309, a CD8-targeted LNP carrying mRNA for a CD19 CAR, in autoimmune disease
    21: '2025'
    22: AstraZeneca acquired EsoBiotec for up to $1 billion, adding its targeted ENaBL lentiviral in vivo cell platform
    23: '2025'
    24: Kite agreed to buy Interius for $350 million, adding its integrating single-infusion in vivo CAR platform and INT2104
