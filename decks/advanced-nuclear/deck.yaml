- id: ed017
  type: maturity
  section: Market definition
  title: How mature is advanced nuclear as a market?
  score: 30
  text: The market is real because buyers sign power contracts, regulators approve designs and the first units are under construction in Canada, China and the US. The score stays low because almost no advanced reactor sells power yet, costs of first units are unproven and fuel supply is thin.
  note:
  - We rate market maturity with an internal score of licensed designs, units being built, signed buyers and supply chain.
  - We set 30/100 because licences and construction have started, but very few advanced reactors run and none at fleet scale.
  src: 17
