- id: ed091
  type: x/has_tech_infra_evolved_over
  section: Tech and infra
  title: How has tech and infra evolved over the years?
  note: We track regulatory, construction, and zero-power test milestones rather than treating announced capacity as operating power.
  src: 91
  t:
    6: '2017 - 2020


      NuScale won a US design safety approval in 2020, while the Energy Department picked TerraPower and X-energy for reactor demonstrations.'
    7: '2021 - 2023


      NuScale gained design certification, Kairos won a Hermes permit, and China began operation of its gas-cooled HTR-PM.'
    8: '2024 - 2025


      Kairos secured Hermes 2 permits and poured nuclear-grade concrete at Hermes 1. Canada licensed a BWRX-300 at Darlington.'
    9: 'TODAY


      TerraPower is building Natrium, test reactors have reached zero-power criticality, and Dow holds a permit for Xe-100 units in Texas.'
    10: '?


      Next comes proving continuous power, securing fuel for repeat builds, and moving beyond a few first plants to factories and fleets.'
- id: ed092
  type: x/were_latest_tech_infra_developments
  section: Tech and infra
  title: What were the latest tech and infra developments?
  page: 1/2
  note: We use dated NRC, Canadian regulator, DOE, and developer records. Design certification, construction permission, and operation are separate steps.
  src: 92
  t:
    13: '2023'
    14: The US regulator certified NuScale’s 50 MW small-reactor module design, an approval that does not itself permit construction.
    15: '2023'
    16: Kairos Power received a construction permit for Hermes, an Oak Ridge test reactor using molten fluoride salt for cooling.
    17: '2023'
    18: China’s Shidaowan HTR-PM entered commercial operation, using two helium-cooled reactor modules to drive one electricity turbine.
    19: '2024'
    20: The US regulator granted Kairos Power permits for two Hermes 2 test units at Oak Ridge, moving a salt-cooled project forward.
    21: '2025'
    22: Kairos Power poured nuclear safety-related concrete at Hermes 1, shifting the Oak Ridge demonstration into nuclear construction.
    23: '2025'
    24: Canada issued a construction license for one BWRX-300 at Darlington, giving a utility permission to start an SMR build.
- id: ed093
  type: x/were_latest_tech_infra_developments_2
  section: Tech and infra
  title: What were the latest tech and infra developments?
  page: 2/2
  note: We selected dated regulator, DOE, and company milestones. Test criticality is not grid delivery, and no construction permit is an operating license.
  src: 93
  t:
    13: '2026'
    14: The NRC issued TerraPower a construction permit for Kemmerer Unit 1, allowing its sodium-cooled Natrium plant to be built in Wyoming.
    15: '2026'
    16: Antares Nuclear demonstrated a zero-power chain reaction with its Mark-0 reactor at Idaho National Laboratory, not commercial power.
    17: '2026'
    18: Aalo Atomics completed zero-power criticality with Aalo-X in Idaho, testing a core before its planned electricity-producing reactor.
    19: '2026'
    20: TVA received a US construction permit for a BWRX-300 at Clinch River, but a permit is not approval to operate the plant.
    21: '2026'
    22: Dow and X-energy secured a construction permit for four Xe-100 modules at Seadrift, where reactors would provide industrial heat.
    23: '2026'
    24: Blykalla signed an enrichment supply agreement with Urenco for its US SEALER, but fuel deliveries and construction remain ahead.
