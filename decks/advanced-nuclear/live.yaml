ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  csv: assets/trends/advanced-nuclear/advanced-nuclear.csv
  term: advanced nuclear
  title: 'Searches for advanced nuclear climbed
  
    from 2021 to mid-2025'
  date: From late 2021 to mid-2025.
  expl: Nuclear came back into the news. Microsoft, Google and Amazon signed deals in 2024 to power their AI data centers with nuclear, the US ordered its regulator to approve designs faster in May 2025, and Oklo listed on the stock market.
  note:
  - We tracked how often people worldwide googled this term from late 2021 to July 2025
  - Google changed how it counts small terms in mid-2025, so the curve stops in July 2025
  cut: '2025-07-27'
  caption_period: November 2021 to July 2025
  stat_text: more searches in mid-2025<br>than in a typical week before
ed052p:
  type: pp_cagr
  title: 'How much room is left

    for this market to grow?'
  size: 5
  cagr: 18
  y0: 2026
  lead: 'To fill that room, '
  condition: first plants like Darlington, Natrium and Hermes 2 must start on time, and buyers must keep signing long contracts for their power. The market must also secure enough HALEU fuel, build reactors in factories at scale, and keep regulators fast as the number of applications grows.
  note:
  - We compared forecasts from IEA, GMI, Precedence and Grand View and adjusted each one to our market definition
  - We then built a realistic range from these forecasts, and you will find all the sources we used at the end of the report
