ed142p:
  title: 'What could go wrong

    for advanced nuclear?'
  events:
  - odds: 30
    impact: 3
    text: First advanced reactors run far over budget like Vogtle, and utilities cancel their follow-on orders
  - odds: 25
    impact: 3
    text: A HALEU fuel shortage delays first advanced reactors, since only Centrus makes the fuel in America
  - odds: 20
    impact: 2
    text: Over 120 reactor designs split the few orders, so no small modular reactor reaches factory volume
  - odds: 20
    impact: 2
    text: Oklo and NuScale stocks crash and funding for advanced nuclear startups dries up for years
  - odds: 15
    impact: 2
    text: Cheaper solar and batteries win utility and data center contracts that advanced nuclear startups were counting on
  - odds: 15
    impact: 2
    text: NRC staff cuts slow reviews, delaying licenses for TerraPower, X-energy, Kairos and other reactor developers
  - odds: 8
    impact: 2
    text: A new US administration or Congress cuts nuclear support, ending loans and tax credits for new reactors
  - odds: 3
    impact: 3
    text: A serious accident at a nuclear plant anywhere revives public fear and halts new reactor approvals worldwide
  note:
  - We listed the events that could slow advanced nuclear down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
