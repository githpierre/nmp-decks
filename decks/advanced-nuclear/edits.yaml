ed210:
  note:
  - We used TerraPower and DOE records for Natrium construction, funding and its buyer deal.
  - We use a fictional baseline for contrast and do not claim other startups all follow it.
  rows:
  - - They stick with standard water cooling and its pressure needs
    - TerraPower uses sodium coolant at near-normal pressure
  - - They design a plant that sends all reactor heat to power
    - Natrium adds molten salt storage to shift power into peaks
  - - They cannot raise output without changing reactor power
    - Natrium can lift grid output from 345 MW to 500 MW
  - - They look for sites far from established power facilities
    - TerraPower chose a site beside a Wyoming coal power plant
  - - They remain in pre-application talks with regulators
    - NRC issued Natrium a construction permit in March 2026
  - - They prepare land but cannot build the nuclear reactor
    - TerraPower started Natrium reactor construction in April
  - - They rely on one investor to fund a long build process
    - TerraPower closed a $650M funding round in June 2025
  - - They plan the reactor without a named customer pipeline
    - Meta agreed to support plans for eight Natrium units
ed211:
  note:
  - We used X-energy filings and DOE records, and kept permits apart from investment calls.
  - We use a fictional baseline for contrast and do not claim other startups all follow it.
  rows:
  - - They pitch only generic power for the national grid
    - X-energy designed Xe-100 for both electricity and steam
  - - They wait to prove fuel safety until reactor startup
    - Xe-100 uses TRISO-coated fuel to retain radioactive material
  - - They leave fuel supply to an uncertain third party
    - TRISO-X won a 40-year NRC fuel license in February 2026
  - - They stop at drawings of the plant and fuel facilities
    - X-energy finished TX-1 main structure in September 2026
  - - They must seek a fresh permit on an untested site
    - Dow’s four-unit Xe-100 site received a 2026 permit
  - - They report a permit as if the plant is ready to run power
    - Dow still needs a final investment decision to build
  - - They raise funding only through repeated private rounds
    - X-energy raised about $1.1B net in its April 2026 IPO
  - - They have no specific follow-on customer in view yet
    - X-energy tapped Fluor to design its second U.S. project
ed212:
  note:
  - We drew on Kairos Power construction releases and its signed TVA power purchase deal.
  - We use a fictional baseline for contrast and do not claim other startups all follow it.
ed213:
  note:
  - We used DOE reactor test records, Antares production and contract releases and its financing.
  - We use a fictional baseline for contrast and do not claim other startups all follow it.
  rows:
  - - They target broad city grids before defining actual users
    - Antares built microreactors for defense and space uses
  - - They keep their first reactor core in paper safety studies
    - Antares took Mark-0 critical at Idaho in June 2026
  - - They test only small physics samples instead of a core
    - Mark-0 tested a full-size core using advanced TRISO fuel
  - - They develop fuel without an experienced fabricator
    - Antares used BWXT’s existing TRISO fuel production
  - - They avoid a factory until customers sign up for power
    - Antares opened a reactor factory in February 2025
  - - They depend on informal expressions of fuel supply interest
    - Antares signed a binding fuel contract in August 2026
  - - They keep a test program separate from actual users
    - Antares won an Army Janus agreement for Fort Bragg
  - - They finance each test without a major follow-on raise
    - Antares raised $470M in equity and debt in July 2026
ed214:
  note:
  - We used Standard Nuclear filings, contracts, DOE selections and its financing release.
  - We use a fictional baseline for contrast and do not claim other startups all follow it.
