- label: MACHINE VISION
  type: pp_risks
  section: Market challenges
  title: What are the biggest threats to the machine vision market?
  events:
  - text: Automotive and electronics capex falls, reducing orders for Cognex, Keyence and camera suppliers tied to new production lines
    odds: 45
    impact: 3
  - text: Low-cost AI cameras from China compress prices, forcing established machine vision vendors to cut margins and R&D budgets
    odds: 40
    impact: 3
  - text: Manufacturers delay AI vision projects after false rejects and missed defects show weak performance on changing products
    odds: 45
    impact: 2
  - text: Export controls restrict advanced image sensors or AI accelerators, raising costs for machine vision cameras and controllers
    odds: 30
    impact: 2
  - text: Privacy rules expand into workplace imaging, limiting how factories can store faces, worker video or training datasets
    odds: 35
    impact: 2
  - text: Robot demand cools after a weak automation cycle, reducing the 3D perception market targeted by Cognex and RealSense
    odds: 35
    impact: 2
  - text: A major camera cybersecurity flaw forces recalls or network isolation, slowing connected inspection upgrades in factories
    odds: 25
    impact: 1
  - text: Standards fragmentation in 3D vision keeps integration costly, slowing projects that mix cameras, robots and metrology tools
    odds: 30
    impact: 1
  note:
  - We listed the events that could slow machine vision down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
