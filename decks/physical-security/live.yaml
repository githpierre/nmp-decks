ed007p:
  type: pp_radar
  title: 'Which companies really

    belong in physical security?'
  TL:
    name: Okta
    src: ../../assets/logos/pp_live/physical-security/s01-00.png
    text: manages digital identity and application access, not doors, cameras, intrusion sensors or physical sites
  TR:
    name: Palo Alto Networks
    src: ../../assets/logos/pp_live/physical-security/s01-02.png
    text: protects digital networks and cloud systems, not buildings, doors, cameras or physical assets
  BL:
    name: Johnson Controls
    src: ../../assets/logos/pp_live/physical-security/s01-09.png
    text: sells building security systems, but security is only one part of its much larger building portfolio
  BR:
    name: Flock Safety
    src: ../../assets/logos/pp_live/physical-security/s01-10.png
    text: sells cameras and license plate recognition, but much of its business targets public safety and law enforcement
  caption:
  - Distance to the center reflects how central each company is to physical security
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
