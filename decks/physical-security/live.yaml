ed148p:
  title: 'What pushed the physical security

    market forward, year after year?'
  events:
  - year: '1980'
    text: Electronic access control replaces keys
    impact: 1.0
  - year: '1984'
    text: Axis builds network device expertise
    impact: 1.0
  - year: '1990'
    text: Digital video starts replacing tape
    impact: 1.0
  - year: '1996'
    text: Axis launches first network camera
    impact: 3.0
  - year: '1997'
    text: Genetec builds IP video platform
    impact: 2.5
  - year: '1998'
    text: Video encoders protect analog investments
    impact: 1.5
  - year: '2001'
    text: Megapixel cameras improve evidence quality
    impact: 1.0
  - year: '2003'
    text: PoE simplifies camera installation
    impact: 1.0
  - year: '2005'
    text: Genetec federation connects remote sites
    impact: 1.5
  - year: '2008'
    text: ONVIF pushes video interoperability
    impact: 1.5
  - year: '2010'
    text: Video analytics moves beyond recording
    impact: 1.0
  - year: '2012'
    text: Mobile access expands remote security
    impact: 1.0
  - year: '2014'
    text: Cloud video reduces server burden
    impact: 1.0
  - year: '2015'
    text: Cybersecurity becomes camera requirement
    impact: 1.5
  - year: '2016'
    text: Deep learning improves video analytics
    impact: 1.5
  - year: '2017'
    text: Visitor management becomes digital
    impact: 1.0
  - year: '2018'
    text: NDAA targets Chinese surveillance vendors
    impact: 2.0
  - year: '2019'
    text: Unified security platforms gain ground
    impact: 1.5
  - year: '2020'
    text: Pandemic boosts touchless access demand
    impact: 2.5
  - year: '2021'
    text: Hybrid cloud becomes mainstream option
    impact: 1.0
  - year: '2022'
    text: FCC blocks covered surveillance equipment
    impact: 2.0
  - year: '2023'
    text: AI search speeds video investigations
    impact: 1.0
  - year: '2024'
    text: Court narrows FCC infrastructure definition
    impact: 0.5
  - year: '2024'
    text: Edge analytics reduce cloud bandwidth
    impact: 1.0
  - year: '2025'
    text: Vendor stability becomes buying criterion
    impact: 1.0
  - year: '2025'
    text: AI joins core security priorities
    impact: 1.5
  - year: '2026'
    text: Hybrid cloud defines deployment strategy
    impact: 2.0
  - year: '2026'
    text: Healthcare raises access control spending
    impact: 1.0
  - year: '2026'
    text: Credential governance becomes priority
    impact: 1.0
  - year: '2026'
    text: AI concern drives governance tools
    impact: 1.0
  note:
  - We kept the events we believe pushed physical security forward the most
  - Ratings are our estimates, with all the sources at the end of the report
