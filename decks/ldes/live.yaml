ed142p:
  title: 'What could go wrong for

    long duration storage?'
  events:
  - odds: 50
    impact: 3
    text: Lithium iron phosphate prices keep falling, so eight hour lithium batteries win bids meant for iron air
  - odds: 40
    impact: 2
    text: Congress and the Treasury tighten FEOC rules, cutting storage tax credits for projects with Chinese components
  - odds: 40
    impact: 1
    text: Cheap natural gas peakers remain the default choice for reliability as data center power demand surges
  - odds: 35
    impact: 3
    text: Utilities and ISOs fail to create markets that pay for 100 hour storage, leaving projects unfinanced
  - odds: 30
    impact: 2
    text: Higher interest rates make first of a kind LDES plants too costly to finance without DOE loans
  - odds: 30
    impact: 2
    text: The DOE cancels or freezes grants and loans for flow battery and compressed air demonstration projects
  - odds: 25
    impact: 3
    text: Form Energy or ESS Inc. hits a manufacturing or performance setback that scares off utility buyers
  - odds: 10
    impact: 2
    text: A thermal or flow battery site fails and the project developer writes off hundreds of millions
  note:
  - We listed the events that could slow ldes down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
