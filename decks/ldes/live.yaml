ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people ask how fo store

    power for days after the big blackout'
  date: In recent months.
  expl: Solar and wind keep growing, but the sun sets and the wind drops. After the huge blackout in Spain and Portugal, grid stability became a real worry, and AI data centers need power around the clock. Long-duration storage became the missing piece people searched for.
  term: ldes
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/ldes/ldes.csv
ed052p:
  type: pp_cagr
  title: 'What is the projected growth for the Long

    Duration Energy Storage (LDES) market?'
  lead: ''
  condition: To reach this value, the market must turn pumped storage plans into built projects by speeding permits, financing, and delivery across the global pipeline. It also needs deep cost cuts for non-pumped systems, markets that pay multi-day reliability, scaled manufacturing, and bankable risk tools.
  note:
  - We adjusted each one to our definition of the market, and all our sources are at the end of the report
  size: 28
  cagr: 10
  y0: null
