ed007p:
  type: pp_radar
  title: 'Which companies really belong

    in long-duration storage?'
  TL:
    name: Fluence
    src: ../../assets/logos/pp_live/ldes/s01-00.png
    text: works in nearly 50 markets, but its Smartstack lithium-ion systems top out at 8 hours, short of the 10 hours required
  TR:
    name: Rondo Energy
    src: ../../assets/logos/pp_live/ldes/s01-02.png
    text: runs one of the largest heat batteries in the world, but it delivers steam to factories, not electricity to the grid
  BL:
    name: Antora
    src: ../../assets/logos/pp_live/ldes/s01-09.png
    text: stores power as heat in carbon blocks and returns it as heat or electricity, so it sits between LDES and industrial heat
  BR:
    name: Energy Vault
    src: ../../assets/logos/pp_live/ldes/s01-10.png
    text: started out with gravity storage, but its recent projects are battery systems, like a two-hour site in Texas
  caption:
  - Distance to the center reflects how long a system can deliver electricity back to the grid, with 10 hours as the minimum
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
