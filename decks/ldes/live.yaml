  - Grid operators
  - Project developers
  - Data centers
  - Island grids
  pains:
  - - They cannot get paid for storing power for ten hours or more
    - - 3
      - 3
      - 3
      - 1
      - 2
  - - They wait years in grid queues before a project can connect
    - - 2
      - 2
      - 3
      - 3
      - 1
  - - They compete with lithium batteries that keep getting cheaper
    - - 2
      - 1
      - 3
      - 2
      - 2
  - - They struggle to finance new technologies with few sites running
    - - 2
      - 1
      - 3
      - 1
      - 3
  - - They need firm clean power around the clock, not just at noon
    - - 1
      - 1
      - 1
      - 3
      - 3
  - - They lack long contracts that make big storage projects bankable
    - - 3
      - 1
      - 2
      - 1
      - 1
