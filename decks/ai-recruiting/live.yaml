ed142p:
  title: 'What are the biggest

    threats to AI recruiting?'
  events:
  - odds: 35
    impact: 3
    text: Workday, LinkedIn, Indeed and Greenhouse bundle AI recruiting agents for free in their suites
  - odds: 30
    impact: 3
    text: A long US hiring freeze keeps hiring rates near record lows, shrinking AI recruiting budgets
  - odds: 25
    impact: 1
    text: The best AI recruiting startups get bought early like Paradox and HiredScore, leaving few independents
  - odds: 20
    impact: 2
    text: AI notes and job posts become free features, collapsing prices for AI recruiting startups
  - odds: 18
    impact: 3
    text: LinkedIn and Indeed close their data to outside AI recruiting tools and sell their own agents
  - odds: 12
    impact: 2
    text: Fake AI candidates flood remote interviews, so employers stop trusting automated screening tools
  - odds: 10
    impact: 3
    text: A court holds Workday or another vendor liable for biased AI hiring decisions in the Mobley case
  - odds: 6
    impact: 2
    text: A viral case shows an AI hiring tool rejecting candidates by race or age, and employers quit
  note:
  - We listed the events that could slow ai recruiting down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
