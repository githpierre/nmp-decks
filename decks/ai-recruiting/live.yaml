ed007p:
  type: pp_radar
  title: 'What counts as AI recruiting,

    and what only looks like it?'
  TL:
    name: Workday
    src: ../../assets/logos/pp_live/ai-recruiting/s01-00.png
    text: now owns Paradox and HiredScore for ATI hiring, but it sells them as modules of a much larger HR and finance suite
  TR:
    name: Randstad
    src: ../../assets/logos/pp_live/ai-recruiting/s01-02.png
    text: supported over 1.7 million workers in 2025, but its revenue comes from staffing run by about 38,000 employees
  BL:
    name: LinkedIn
    src: ../../assets/logos/pp_live/ai-recruiting/s01-10.png
    text: offers a Hiring Assistant agent that sources candidates for recruiters, but it is a social network and job board first
  BR:
    name: Mercor
    src: ../../assets/logos/pp_live/ai-recruiting/s01-11.png
    text: started as an AT hiring platform, but its $2 billion run rate comes from AI labs paying experts for training data
  caption:
  - Distance to the center reflects how much AI does the work of finding and assessing candidates, rather than staff or HR software
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
