ed007p:
  type: pp_radar
  title: 'Who Is in low-carbon cement,

    and who stays outside?'
  TL:
    name: Carbon Clean
    src: ../../assets/logos/pp_live/low-carbon-cement/s01-00.png
    text: captures kiln CO2 for cement plants, but sells carbon-capture ~ equipment rather than a lower-carbon binder
  TR:
    name: Autodesk
    src: ../../assets/logos/pp_live/low-carbon-cement/s01-02.png
    text: provides construction design software and can track embodied carbon, but it does not manufacture cement or binders
  BL:
    name: Holcim
    src: ../../assets/logos/pp_live/low-carbon-cement/s01-09.png
    text: global cement incumbent with low- carbon ranges and startup bets, but most sales still span conventional materials
  BR:
    name: Heidelberg Materials
    src: ../../assets/logos/pp_live/low-carbon-cement/s01-10.png
    text: major cement producer with low-carbon products and capture projects, while conventional cement remains core revenue
  caption:
  - Distance to the center reflects how central each company is to low-carbon cement
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
