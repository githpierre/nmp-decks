ed148p:
  title: 'What pushed the low-carbon cement

    market forward, year after year?'
  events:
  - year: '2004'
    text: LC3 idea targets clinker emissions
    impact: 1.0
  - year: '2005'
    text: LC3 research proves clay potential
    impact: 1.0
  - year: '2009'
    text: Ternary LC3 blend unlocks substitution
    impact: 1.5
  - year: '2013'
    text: LC3 becomes a global project
    impact: 1.0
  - year: '2014'
    text: LC3 technical validation scales globally
    impact: 1.5
  - year: '2017'
    text: LC3 shifts from lab to market
    impact: 1.5
  - year: '2018'
    text: IEA roadmap prioritizes lower clinker
    impact: 2.0
  - year: '2019'
    text: Cemex develops Vertua low-carbon range
    impact: 1.5
  - year: '2020'
    text: Cemex launches Vertua in Europe
    impact: 2.0
  - year: '2020'
    text: Holcim launches ECOPact globally
    impact: 2.0
  - year: '2020'
    text: LC3 enters global scaling phase
    impact: 1.5
  - year: '2021'
    text: Holcim gets net-zero pathway approval
    impact: 1.0
  - year: '2021'
    text: Composite cement standard broadens options
    impact: 1.5
  - year: '2022'
    text: Canada maps net-zero concrete pathway
    impact: 1.5
  - year: '2023'
    text: EU CBAM starts cement reporting
    impact: 2.0
  - year: '2023'
    text: Holcim launches ECOCycle globally
    impact: 1.0
  - year: '2023'
    text: Holcim opens Lyon innovation hub
    impact: 1.0
  - year: '2024'
    text: IEA calls demand the missing link
    impact: 1.5
  - year: '2024'
    text: Brimstone wins scale-up support
    impact: 1.5
  - year: '2024'
    text: EU rewrites construction product rules
    impact: 2.0
  - year: '2025'
    text: Brevik CCS proves industrial capture
    impact: 3.0
  - year: '2025'
    text: UK backs full-scale cement CCS
    impact: 2.5
  - year: '2025'
    text: Microsoft validates electrolytic cement
    impact: 2.0
  - year: '2025'
    text: Ecocem commits low-clinker capacity
    impact: 2.0
  - year: '2025'
    text: Near-zero capacity pipeline grows
    impact: 1.5
  - year: '2026'
    text: EU CBAM starts carbon payments
    impact: 3.0
  - year: '2026'
    text: EU product rules become applicable
    impact: 2.0
  - year: '2026'
    text: LC3 best-practice guide lowers friction
    impact: 1.5
  - year: '2026'
    text: Holcim opens Czech calcined-clay line
    impact: 2.0
  - year: '2026'
    text: LC3 evidence base keeps expanding
    impact: 1.0
  note:
  - We kept the events we believe pushed low carbon cement forward the most
  - Ratings are our estimates, with all the sources at the end of the report
