ed142p:
  title: 'What could go wrong

    for the XR market?'
  events:
  - odds: 45
    impact: 2
    text: Buyers prefer AI glasses like Ray-Ban Meta over headsets, shrinking the market for full XR apps
  - odds: 40
    impact: 2
    text: Venture funding for XR startups stays far below 2021 levels and many VR game studios close
  - odds: 35
    impact: 3
    text: Apple stops updating Vision Pro after shifting to glasses, and developers abandon visionOS apps
  - odds: 35
    impact: 2
    text: Headsets stay heavy and cause motion sickness, so users stop wearing them after a few weeks
  - odds: 30
    impact: 3
    text: Meta cuts Reality Labs further after its 2026 layoffs and stops launching new Quest headsets
  - odds: 30
    impact: 1
    text: Tariffs on Chinese parts raise headset prices and slow sales for Pico, Meta and startups
  - odds: 30
    impact: 2
    text: Enterprise buyers end XR training pilots without results, cutting spending at companies like Strivr
  - odds: 20
    impact: 2
    text: A privacy scandal over eye-tracking or camera data from headsets leads to EU and state privacy rules
  note:
  - We listed the events that could slow xr down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
