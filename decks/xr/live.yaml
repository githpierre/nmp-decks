ed052p:
  type: pp_cagr
  title: 'What growth can the XR

    market realistically expect?'
  lead: ''
  condition: To hit this growth, the market must turn AI glasses into a daily habit and bring display glasses with prescription lenses to mainstream prices.
    It must also make XR a standard work tool for training and remote support, and keep content spending growing on headsets.
  note:
  - We compared forecasts from Mordor, IDC, MarketsandMarkets and Fortune Business Insights
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: 25
  cagr: 24
  y0: 2026
