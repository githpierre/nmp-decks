- id: ed210
  left: A REGULAR MEDTECH STARTUP
  logo: histosonics
  note:
  - We used HistoSonics device and investor releases to confirm its clinical and commercial record.
  - We use a fictional startup to show the contrast, not to describe every competing MedTech firm.
  right: HISTOSONICS
  rows:
  - - They plan a tumor procedure around cuts or needles
    - They break liver tumor tissue with sound, without cuts
  - - They rely on heat or freezing to destroy target tissue
    - They use focused sound pulses to break up target tissue
  - - They need a tool inserted into the patient to treat
    - Their Edison system can treat from outside the body
  - - They inspect scans after the treatment is finished
    - They let doctors watch the treatment effect as it happens
  - - They seek a first FDA clearance before clinical rollout
    - They gained FDA De Novo clearance for liver tumors in 2023
  - - They focus on one organ while later uses stay untested
    - They are studying kidney and pancreas uses in trials
  - - They raise interest while hospitals wait to buy a unit
    - Over 50 US medical centers were using Edison by 2025
  - - They raise a new round without an established outcome
    - A 2025 majority stake deal valued HistoSonics at $2.3B
  section: Startup strategies
  src: 210
  title: How HistoSonics made sound a treatment for liver tumors
  type: contrast
  logo_src: ../../assets/logos/histosonics--symbol.png
- id: ed211
  left: A REGULAR MEDTECH STARTUP
  logo: cmrsurgical
  note:
  - We used CMR product, FDA clearance and Stryker alliance releases to verify each company milestone.
  - We contrast a fictional startup. Stryker announced an equity plan, not a completed buyout of CMR.
  right: CMR SURGICAL
  rows:
  - - They design one large fixed robot for each surgery room
    - They use modular robot arms that fit different rooms
  - - They put surgeons in a console away from the care team
    - Their open console helps surgeons talk with staff
  - - They plan around a hospital adding a new robot suite
    - They designed Versius to fit existing room routines
  - - They show early results from just one trial setting
    - Over 45,000 patients had Versius procedures by 2026
  - - They enter the US before building global clinical use
    - They brought broad overseas use to their US launch
  - - They stop with the first approval for just one surgery
    - The FDA cleared gallbladder then benign gynecology uses
  - - They build a large new US sales force on their own
    - Stryker agreed to act as the US sales agent for Versius
  - - They raise more money without a strategic partner
    - Stryker agreed to invest about $400M with a buy option
  section: Startup strategies
  src: 211
  title: How CMR Surgical made robot surgery easier to fit
  type: contrast
  logo_src: ../../assets/logos/fav/cmr-surgical.png
- id: ed212
  left: A REGULAR MEDTECH STARTUP
  logo: heartflow
  note:
  - We used Heartflow filings and device guidance to check its clinical pathway and adoption.
  - We contrast a fictional startup. The software assists doctors, rather than making the final call.
  right: HEARTFLOW
  rows:
  - - They send patients for an invasive artery pressure test
    - They model blood flow from an existing coronary CT scan
  - - They use scans to estimate artery narrowing by eye
    - They calculate blood pressure changes with 3D models
  - - They see narrowed vessels but lack data on plaque type
    - They report plaque volume and makeup from CT scans
  - - They require a special new scanner for each new test
    - They use heart CT imaging that hospitals already have
  - - They build one tool that serves just one clinical decision
    - They offer blood flow, plaque and procedure planning
  - - They rely on small early studies to prove their tool helps
    - Their analyses feature in over 625 research papers
  - - They struggle to get national payment for a new test
    - All seven Medicare regions covered plaque tests in 2026
  - - They collect a few cases before they build a market
    - They assessed coronary disease in over 800K patients
  section: Startup strategies
  src: 212
  title: How Heartflow turned a heart scan into a care platform
  type: contrast
  logo_src: ../../assets/logos/heartflow.png
- id: ed213
  left: A REGULAR MEDTECH STARTUP
  logo: butterflynetwork
  note:
  - We used Butterfly Network FDA, technology and SEC materials to verify the device and sales facts.
  - We compare Butterfly to a fictional ultrasound startup. The baseline is not an industry average.
  right: BUTTERFLY NETWORK
  rows:
  - - They buy a large ultrasound cart for each care room
    - They use one small handheld probe linked to a screen
  - - They swap probes to scan different parts of the body
    - One chip-based probe can cover whole-body imaging
  - - They depend on traditional crystal-based sound probes
    - They built a chip with thousands of tiny sound parts
  - - They add manual steps to view images in three dimensions
    - Their iQ3 provides automated 3D image capture modes
  - - They must wait for device software changes to ship
    - They can upgrade software on their chip-based platform
  - - They sell devices without links to hospital networks
    - Their Compass AI links ultrasound into health systems
  - - They focus only on the first market they can serve
    - Their products are sold in more than 30 countries
  - - They have a prototype but little reported sales data
    - They reported $98M in revenue for full-year 2025
  section: Startup strategies
  src: 213
  title: How Butterfly Network put ultrasound on a chip
  type: contrast
  logo_src: ../../assets/logos/butterfly-network.png
- id: ed214
  left: A REGULAR MEDTECH STARTUP
  logo: kardium
  note:
  - We used Kardium product materials, FDA records and launch news to verify its heart tools.
  - We compare a fictional startup. AF means atrial fibrillation, an irregular heartbeat.
  right: KARDIUM
  rows:
  - - They use different tools to map and treat heart rhythm
    - Their Globe catheter maps and treats with one device
  - - They need to move between separate mapping and ablation
    - Their system puts both tasks into one catheter tool
  - - They offer the same fixed pulse pattern to each patient
    - Its 122 electrodes can be selected for custom lesions
  - - They may need repeat pulses to treat each heart vein
    - They aim to isolate each heart vein with one pulse set
  - - They show only early lab data before applying to FDA
    - The FDA approved Globe for certain AF patients in 2025
  - - They advertise launch plans without paid patient use
    - The first commercial US procedures took place in 2025
  - - They rely on complex setups that limit wide hospital use
    - They designed a single-shot system to simplify treatment
  - - They focus on one tool without a tested patient series
    - A pivotal study covered 163 patients using the system
  section: Startup strategies
  src: 214
  title: How Kardium made one catheter do a whole heart job
  type: contrast
  logo_src: ../../assets/logos/kardium.png
