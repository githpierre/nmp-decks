- id: ed091
  type: x/has_tech_infra_evolved_over
  section: Tech and infra
  title: How has tech and infra evolved over the years?
  note: We mark practical steps in the clinic rather than first laboratory discoveries. Forecast language is directional.
  src: 91
  t:
    6: '2000 - 2010


      Imaging and heart devices spread across hospitals, while early surgical robots proved that doctors could operate through small incisions.'
    7: '2011 - 2020


      Wearable sensors, advanced implants, and AI reading of medical scans moved from promising tools into clinical use.'
    8: '2021 - 2025


      Photon-counting CT, pulsed-field heart treatment, brain interfaces, and new surgery robots received US clearance.'
    9: 'TODAY


      AI diagnostic devices number over 1,600 on the FDA list, while new scan systems and surgical robots expand clinical use.'
    10: '?


      Next platforms may pair cheaper sensors, live imaging, safer implants, and AI that works reliably in more care settings.'
- id: ed092
  type: x/were_latest_tech_infra_developments
  section: Tech and infra
  title: What were the latest tech and infra developments?
  page: 1/2
  note: We selected clearances that changed real clinical capabilities. A cleared device is not proof of broad hospital adoption.
  src: 92
  t:
    13: '2025'
    14: Siemens Healthineers gained FDA clearance for photon-counting CT scanners, bringing sharper clinical imaging to more systems.
    15: '2025'
    16: Dexcom won US clearance for G7 15 Day, extending continuous glucose sensing for adults with diabetes to 15 days.
    17: '2025'
    18: Precision Neuroscience gained FDA clearance for Layer 7 brain electrodes to record and stimulate signals for up to 30 days.
    19: '2025'
    20: Kardium won FDA approval for Globe, one catheter that maps heart signals and treats abnormal rhythm with electric pulses.
    21: '2025'
    22: Heartflow gained FDA clearance for a new plaque analysis algorithm, letting doctors assess artery buildup from CT scans in 3D.
    23: '2025'
    24: Medtronic received US clearance for Hugo, a robotic system for urologic operations, including prostate and kidney surgery.
- id: ed093
  type: x/were_latest_tech_infra_developments
  section: Tech and infra
  title: What were the latest tech and infra developments?
  page: 2/2
  note: We used company releases and FDA decisions for market access milestones. Clearance scope is not the same as the number sold.
  src: 93
  t:
    13: '2026'
    14: Perimeter won FDA approval for Claire, a breast surgery imaging device that uses AI to flag suspicious tissue during an operation.
    15: '2026'
    16: GE HealthCare received FDA clearance for Photonova Spectra, bringing its new photon-counting CT scanner into US clinical imaging.
    17: '2026'
    18: TytoCare received FDA De Novo clearance for an AI tool that reviews ear images and flags eardrum bulging during home checks.
    19: '2026'
    20: Johnson & Johnson gained FDA authorization for OTTAVA, a table-mounted surgery robot cleared for ten general surgery procedures.
    21: '2026'
    22: CMR Surgical gained US clearance to use Versius Plus for more benign gynecology operations, after its first US clearance in 2025.
    23: '2026'
    24: Medtronic gained broader FDA clearance for Hugo in general surgery, adding upper abdominal operations and some lower abdominal care.
