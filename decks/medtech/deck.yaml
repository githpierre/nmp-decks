- id: iv_fda
  type: x/were_key_phases_market_acceleration
  section: Market challenges
  title: What does it take to bring a new device to patients?
  note: We use a 2022 model of complex US therapeutic devices for illustrative stage costs and times, not typical figures for every device. FDA pathways, EU certification and coverage vary.
  src: 147
  t:
    7: 'BENCH TESTS


      Engineers test in labs and animals. A high-risk device model uses 60 months and $20M for this stage.'
    8: 'FEASIBILITY


      FDA and an ethics board allow an early trial. The model puts it at 28 months and about $1.4M.'
    9: 'PIVOTAL TRIAL


      Doctors test safety and benefit in more patients. The model uses 57 months and about $31M.'
    10: 'PAYMENT


      CMS targets 6 months for select coverage. Hospitals decide on buying. Studies may add $6M.'
    11: 'APPROVAL


      FDA weighs 510(k), De Novo or PMA. EU bodies assess CE marks. A PMA model uses 17 months and $1.9M.'
