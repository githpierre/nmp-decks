- id: iv_safety
  type: x/pain_points_yesterday_vs_today
  section: Market challenges
  title: What could go wrong with new medical devices?
  note: We selected documented FDA recalls and a peer-reviewed external validation review. The cases illustrate risks, not a common failure rate.
  src: 54
  t:
    6: 'LARGE RECALL



      Philips recalled sleep and breathing machines because foam could break down. The FDA said 15 million devices were affected.'
    7: 'IMPLANT FAILURE



      Exactech hip and knee implant packaging lacked an oxygen barrier. The FDA warned that wear could lead to a second surgery.'
    8: 'CYBER WEAKNESS



      The FDA classified a recall of Abiomed heart pump controllers over security flaws. No cyberattacks or harm had been reported.'
    9: 'AI ERRORS



      A 2025 imaging AI review found specificity fell up to 24 points when tested outside the original hospital.'
    10: 'PUMP DOSE ERRORS



      BD warned in 2026 that some Alaris sets could give wrong doses at low rates. The FDA reported no injuries or deaths.'
