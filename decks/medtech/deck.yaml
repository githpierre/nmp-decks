- id: ed027
  type: x/when_did_market_become_real
  section: Market opportunity
  title: When did the MedTech market become real?
  note: We use 1896 as a clear start of commercial medical imaging, when X-ray equipment moved from a lab discovery into hospital purchasing. It was not the first medical device.
  src: 27
  t:
    8: Before X-rays, doctors used exams and basic tools, but hidden breaks or metal objects could be hard to locate without surgery.
    12: In 1896, Siemens began shipping X-ray gear to hospitals. Its factory built 720 X-ray tubes in the first year.
    13: '1896'
- id: ed028
  type: x/when_did_become_hot
  section: Market opportunity
  title: When did it become hot?
  note: We call 2026 a renewed boom in this mature market because EY reported a decade-high deal wave and record financing. Much of that financing came from debt and stock offerings.
  src: 28
  t:
    6: MedTech deals surged to about $130B, while financing reached $63B in the year ending June 2026.
    7: '2026'
    12: Before this surge, device sales were growing, but deal spending stayed well below the level later reached in 2026.
- id: ed029
  type: x/happened_between
  section: Market opportunity
  title: What happened in-between?
  src: 29
  t:
    5: '1896'
    6: Siemens built X-ray gear for hospitals in 1896, turning a lab discovery into equipment doctors could buy. It made 720 tubes in the first year.
    7: 1958 - 1960
    8: The first heart pacemaker was implanted in 1958. By 1960, doctors had placed a pacemaker that worked long term in a human patient.
    9: 1971 - 1977
    10: Hospitals began using CT scans in 1971 to see cross-sections of the brain. By 1977, 1,130 CT machines were installed around the world.
    11: '2000'
    12: Intuitive launched da Vinci in 2000, making robot-assisted surgery a commercial product. Its systems went on to serve more types of surgery.
    13: 🩻
    14: 💰
    15: 🩺
    16: 🤖
- id: ed030
  type: x/happened_since_then
  section: Market opportunity
  title: And what happened since then?
  src: 30
  t:
    5: 2016 - 2019
    6: The FDA approved Medtronic's tiny Micra heart pacemaker in 2016. In 2019, it cleared Intuitive's Ion robot to collect tissue from lung nodules.
    7: '2024'
    8: The FDA cleared Intuitive's da Vinci 5 surgery robot and Dexcom's first over-the-counter glucose sensor in March 2024.
    9: '2025'
    10: Surgeons did over 3.1 million da Vinci operations in 2025. EY says the MedTech industry generated about $650B in sales that year.
    11: TODAY
    12: EY reported $130B in deals and $63B in financing through mid-2026. The FDA also reports over 1,600 AI medical devices authorized for US sale.
    13: 📈
    14: 🤝
    15: 🏦
    16: 📊
