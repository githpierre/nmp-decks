  type: x/have_been_different_waves_hot
  section: Top players
  title: What have been the different waves of ‘hot’ startups over time?
  note: We group the waves by company formation, financings, clinical milestones and commercial expansion. These are illustrative shifts, not fixed eras.
  src: 174
  t:
    6: '2000 - 2010


      Heartflow and HistoSonics formed around new ways to read heart scans and treat tumors with sound, before wide clinical use.'
    7: '2011 - 2017


      CMR Surgical pushed modular surgery robots. Neuralink explored brain implants, while Aidoc developed image-reading AI for hospitals.'
    8: '2018 - 2022


      Capital moved to robots, brain devices and digital diagnosis. CMR raised $600M in 2021 to expand global surgery robot sales.'
    9: '2023 - 2026


      CMR passed 45,000 patients. HistoSonics sold a major stake. Science launched its retinal chip in Europe.'
    10: 'NEXT


      The next leaders need more than novel hardware. They must show patient benefit, pass reviews, win hospital budgets and scale care safely.'
