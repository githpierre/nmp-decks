    title: 'Dexcom earned $0.24 on each $1 of sales,

      Beta Bionics lost $0.75'
    cards:
    - name: DEXCOM
      stats:
      - v: +$0.24
        l: operating profit for each $1 of sales, Q3 2026
      - v: $327M
        l: of operating profit in the quarter, from glucose sensors
    - name: BETA BIONICS
      hl: true
      stats:
      - v: −$0.75
        l: operating loss for each $1 of sales, Q3 2026
      - v: $26.6M
