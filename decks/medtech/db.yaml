ed160:
  6: Implantable devices took about 34% of the capital raised since 2024, ahead of therapeutic devices with about 27%
  7: 603 of the 637 rounds since 2024 disclosed an amount, and the median disclosed round was $13M
  8: US startups closed 310 of the 637 rounds and took $11B, about 58% of all the money raised since 2024
  9: 49 rounds of $100M or more made up about 43% of all the capital raised in the market since 2024
  10: The $700M Series C round of Neko Health is the biggest since 2024, ahead of the $650M round of Neuralink
  11: Series A was the most common round, with 150 of the 637 rounds, ahead of seed with 135 and Series B with 97
  note: We drew these insights from our tracker of 637 MedTech equity rounds announced since January 2024, worth about $19.1B
ed162:
  6: 'BEFORE



    Before 2024, most MedTech startups built one device for one hospital department, and few investors backed brain implants or medical AI.'
  7: 'AFTER



    Since 2024, 637 rounds raised $19.1B. Implantable devices take the biggest share, ahead of therapeutic devices and diagnostic devices.'
  note: We used our tracker of MedTech equity rounds, complete from January 2024, and company releases and the press
