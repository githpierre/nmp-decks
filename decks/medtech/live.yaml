ed142p:
  title: 'What are the biggest

    threats to MedTech?'
  events:
  - odds: 45
    impact: 3
    text: Medicare keeps new devices waiting years for coverage, so hospitals refuse to buy them after FDA approval
  - odds: 35
    impact: 3
    text: FDA staff cuts and EU MDR delays slow device approvals by years, draining startup cash before launch
  - odds: 30
    impact: 3
    text: MedTech venture funding stays near half its 2021 level, leaving many startups unable to finish trials
  - odds: 30
    impact: 2
    text: A key device trial misses its main goal and sinks the startup, scaring investors away from peers
  - odds: 25
    impact: 2
    text: Medtronic and Boston Scientific use their scale to win most hospital deals against MedTech startups like Kardium
  - odds: 15
    impact: 2
    text: A major safety recall like Abbott's sensor defect harms patients and triggers stricter FDA device oversight
  - odds: 15
    impact: 2
    text: US buyers copy China's volume pricing and cut device prices by half, crushing MedTech startup margins
  - odds: 10
    impact: 2
    text: The FTC blocks more device acquisitions like Edwards and JenaValve, closing the main exit for startups
  note:
  - We listed the events that could slow MedTech down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
