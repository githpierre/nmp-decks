ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'MedTech searches climbed

    steadily from 2021 to 2025'
  date: From late 2021 to mid-2025.
  expl: MedTech makes the devices that diagnose, monitor or treat patients. As surgical robots, new heart treatments and glucose sensors drew money and news, more people looked it up. We stop in July 2025, when Google changed how it counts small search terms.
  term: MedTech
  note:
  - We tracked how often people worldwide googled this term from late 2021 to July 2025
  - Since mid-2025, small unrelated search terms rise and fall together, so we stop there
  csv: assets/trends/medtech/medtech-to-jul-2025.csv
  period: late 2021 to July 2025
ed052p:
  type: pp_cagr
  title: 'How much room is left

    for MedTech to grow?'
  lead: 'To fill that room, '
  condition: the market must keep turning new science into paid products, as pulsed-field ablation, robots and glucose sensors did. It must also win faster payment for new devices from insurers and hold its prices in China and Europe.
  note:
  - We compared forecasts from Frost & Sullivan, Fortune Business Insights, Precedence and Diligence Insights
  - We built our own estimate from device sales by sector, with all the sources at the end of the report
  size: 680
  cagr: 6.5
  y0: 2026
