ed007p:
  type: pp_radar
  title: 'What is in the MedTech

    market, and what is out?'
  TL:
    name: Therabody
    src: ../../assets/logos/pp_live/medtech/s01-00.png
    text: makes the Theragun massage gun and other recovery devices, sold for wellness and sport rather than to treat disease
  TR:
    name: Pfizer
    src: ../../assets/logos/pp_live/medtech/s01-01.png
    text: is one of the biggest names in healthcare, but it sells drugs and vaccines, regulated as medicines, not devices
  BL:
    name: Apple
    src: ../../assets/logos/pp_live/medtech/s01-09.png
    text: won FDA clearance for Apple Watch alerts on sleep apnea and high blood pressure, but it sells the watch as a gadget
  BR:
    name: Johnson & Johnson
    src: ../../assets/logos/pp_live/medtech/s01-10.png
    text: runs one of the largest MedTech businesses in the world, yet nearly two thirds of its 2025 sales came from drugs
  caption:
  - Distance to the center reflects how much a product exists to diagnose, monitor or treat patients, rather than wellness
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
