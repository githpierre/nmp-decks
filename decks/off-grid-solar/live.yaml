ed007p:
  type: pp_radar
  title: 'What is actually included

    in the off-grid solar market?'
  TL:
    name: Enphase Energy
    src: ../../assets/logos/pp_live/off-grid-solar/s01-00.png
    text: sells solar microinverters and batteries mainly for grid-connected systems, not dedicated off-grid energy access
  TR:
    name: First Solar
    src: ../../assets/logos/pp_live/off-grid-solar/s01-02.png
    text: manufactures utility-scale solar modules for grid projects and does not operate an off-grid solar service business
  BL:
    name: Schneider Electric
    src: ../../assets/logos/pp_live/off-grid-solar/s01-09.png
    text: provides off-grid and microgrid hardware, while most revenue comes from broader electrification and automation
  BR:
    name: ENGIE Energy Access
    src: ../../assets/logos/pp_live/off-grid-solar/s01-10.png
    text: runs off-grid solar and mini-grids, but sits inside a much larger global utility and energy-services group
  caption:
  - Distance to the center reflects how central each company is to off-grid solar
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
