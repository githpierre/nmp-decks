  5: We used it for the risks of privacy, lock-in and weak evidence. It framed the constraints that are structural.
  7: 'Digital Promise,

    procurement framework'
  8: The guide that US school districts use to pilot, select and buy learning tools
  9: We used it for the steps from free pilot to renewal. It framed how a startup wins a school district.
  10: 'Preply, Series D

    announcement'
  11: Preply's release on its $150M Series D led by WestCap in January 2026
  12: We used it for the $1.2B valuation and its positive EBITDA. It is our main example of human tutoring with AI.
  13: 'Speak, Series C

    announcement'
  14: Speak's release on its $78M Series C at a $1B valuation in December 2024
  15: We used it for the valuation and the age of the company. It framed the unicorn and AI tutor slides.
  16: 'MagicSchool, Series

    B announcement'
  17: MagicSchool's release on its $45M Series B for AI tools built for teachers
  18: We used it for the round and the product focus. It framed the slides on teacher AI.
