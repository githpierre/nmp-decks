  3: 'Duolingo, Q3 2026

    quarterly filing'
  4: Duolingo's quarterly report to the SEC for the period ending in September 2026
  5: We used it for 13.1M paid subscribers and 64.9M daily learners. It is our main proof of paid consumer demand.
  7: 'Coursera, Udemy

    merger releases'
  8: Coursera's releases and filings on its merger with Udemy, completed in May 2026
  9: We used them for the 18,000 enterprise clients and the $674M value at closing. They framed the consolidation slides.
  10: 'PNAS, AI and

    math learning study'
  11: A peer-reviewed high school experiment on how students learn math with and without AI help
  12: We used it for the 17% drop in later exam scores with unguided AI. It framed the risks of AI tutors.
  13: 'NBER, Khanmigo

    school experiment'
  14: A two-year randomized trial of Khanmigo in 18 Tennessee middle schools, published in 2026
  15: We used it for gains similar to practice without AI and for 17% use after mistakes. It framed the proof gap.
  16: 'OECD, Digital

    Education Outlook'
  17: The OECD review of digital education ecosystems, data links and school platforms
  18: We used it for the layers of school technology and the weak links between tools. It framed the tech chapter.
