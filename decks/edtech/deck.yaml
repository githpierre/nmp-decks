- id: ed006
  type: definition
  section: Market definition
  title: What is EdTech, in simple terms?
  text: It is the market for apps, courses, tutors and school software built to teach, test or certify, from a child's first reading app to a worker's new skills
  note: We use a plain definition here because it makes the boundary with generic AI, video and office tools, which schools also use, easier to see.
  src: 6
  icon_tl: 🎓
