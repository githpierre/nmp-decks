  note: We split the total using the end-user shares of Grand View and Fortune Business Insights, then rounded each category so that the total stays at $192 billion

- type: worldmap
  section: Market size
  title: "Where in the world is\nEdTech money spent?"
  regions:
    na: {pct: 36, text: "North America leads because US schools and employers buy the most learning software. Duolingo, Coursera, and PowerSchool are all based there."}
    eu: {pct: 27, text: "Europe grows with Preply, Multiverse, and Knowunity, and its learning startups raised $1.85 billion in 2025. Schools buy country by country, which slows scale for most startups."}
    apac: {pct: 22, text: "Asia-Pacific grows fastest, led by India, where PhysicsWallah went public in 2025. China shrank after its 2021 ban on for-profit tutoring."}
    latam: {pct: 6, text: "Latin America is led by Brazil and Mexico, where startups like Teachy and Luca sell AI tools to teachers. Budgets are tight, so growth is slower."}
    mea: {pct: 9, text: "The Middle East invests heavily, and Saudi Arabia started teaching AI to 6 million students in 2025. Africa has many young learners but small budgets."}
  note: We combined the regional shares of Grand View for 2024 and 2025 with Fortune Business Insights and IMARC, then adjusted everything to our market definition

- type: projection
  section: Market size
  title: "What is the projected growth for\nthe EdTech market?"
  intro: "To reach this value, the market must turn AI tutors and teacher tools into paid products, while schools and companies keep budgets for learning every year.\nIt must also prove real learning gains, protect student data, and compete with free AI chatbots that already help millions of learners."
  bars: [{x: 2026, v: 213}, {x: 2027, v: 237}, {x: 2028, v: 263}, {x: 2029, v: 291}, {x: 2030, v: 324}, {x: 2031, v: 359}, {x: 2032, v: 399}, {x: 2033, v: 442}, {x: 2034, v: 491}, {x: 2035, v: 545}, {x: 2036, v: 605}]
  cagr: 11% CAGR
  note: We compared forecasts from Grand View, Fortune Business Insights, MarketsandMarkets, and IMARC, adjusted each one to our market definition, and aligned their timelines to build a realistic range of scenarios

- type: priority
  section: Pain points
  title: "Which pains deserve\nattention first?"
  subtitle: School platforms
  icons: [🏫, 📋, 🎒, 🏛️, 🏠]
  rows:
    - {pain: They wait months for districts to approve a purchase, s: [3,1,1,2,1], p: HIGH}
    - {pain: They see teachers use only a few features they paid for, s: [3,2,1,2,1], p: HIGH}
    - {pain: They must connect to dozens of other school systems, s: [3,2,1,3,2], p: MAJOR}
    - {pain: They face strict privacy laws that differ by state, s: [3,1,2,2,3], p: MAJOR}
    - {pain: They lose renewals as COVID relief money runs out, s: [3,2,1,1,1], p: HIGH}
    - {pain: They struggle to prove that students learn more, s: [3,2,2,3,3], p: CRITICAL}
    - {pain: They compete with free tools from Google and Microsoft, s: [2,3,1,2,1], p: HIGH}
  note: Every customer is different and this table is intentionally high-level and simplified. It’s based on patterns seen across forums, reports, and feedback, and is meant to give you a starting point, not a checklist. If you’re building something, the real priorities should come from talking to actual customers and validating things in the real world before committing to a solution.

