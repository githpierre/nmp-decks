- id: ed017
  type: maturity
  section: Market definition
  title: How mature is EdTech as a market?
  score: 60
  text: The market is real because schools, employers and millions of people pay for learning software every day, with Duolingo alone at 13.1M paid subscribers. The score is not higher because funding fell to a decade low in 2024, school budgets are tight, and proof that the tools improve learning is still mixed.
  note:
  - We rate market maturity with an internal score of products on sale, paying clients, big buyers and funding.
  - We set 60/100 because demand is large and paid, but funding and proof of learning gains remain weak.
  src: 17
