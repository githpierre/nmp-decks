- id: ed024
  type: dated
  section: Market definition
  title: What has changed (very) recently?
  page: 1/2
  items:
  - d: SINCE 2023
    t: Khan Academy introduced Khanmigo in March 2023, an AI tutor meant to guide students with hints instead of answers, and Duolingo launched its paid Max plan with AI conversation practice.
  - d: SINCE 2024
    t: Global EdTech venture funding fell to $2.4B in 2024, its lowest level in a decade, as the pandemic boom ended and investors began to ask for profits instead of growth.
  - d: SINCE 2024
    t: 2U, the online degree company, emerged from Chapter 11 as a private firm in September 2024, after cutting more than half of its debt in a deal with its lenders.
  - d: SINCE 2025
    t: MagicSchool raised a $45M Series B in February 2025 for its AI tools built for teachers and students, in a round led by Valor Equity Partners.
  - d: SINCE 2025
    t: A high school math study of June 2025 found that students who used unguided AI scored 17% lower on a later exam taken without AI, a warning for AI tutors.
  - d: SINCE 2025
    t: Chegg announced in October 2025 that it would cut 388 roles, about 45% of its staff, as students moved from paid homework help to free AI tools.
  note:
  - We kept the milestones that most changed the products, the money and the big players of the market
  - There is no official timeline, and another analyst could reasonably pick a few different milestones here
  src: 24
- id: ed025
  type: dated
  section: Market definition
  title: What has changed (very) recently?
  page: 2/2
  items:
  - d: SINCE 2026
    t: Preply raised a $150M Series D led by WestCap in January 2026 at a $1.2B value, after becoming EBITDA positive, for its tutoring marketplace with AI tools.
  - d: SINCE 2026
    t: Coursera completed its merger with Udemy in May 2026, uniting 290 million learners, 18,000 enterprise customers and 95,000 instructors in one company.
  - d: SINCE 2026
    t: Unacademy sold to its rival upGrad for $206M in September 2026, about 94% below the value it reached at its funding peak during the pandemic years.
  - d: SINCE 2026
    t: McGraw Hill bought TeachFX and Teachally in September 2026, and IXL Learning bought NoRedInk in October, in a wave of deals for AI teaching tools.
  - d: SINCE 2026
    t: Speak launched AI Tutor Call in October 2026, a live voice tutor that responds in real time and gives feedback during and after each call.
  - d: SINCE 2026
    t: Duolingo reported 13.1M paid subscribers at the end of September 2026, up 14% in a year, with 64.9M daily learners using its app.
  note:
  - We kept the milestones that most changed the products, the money and the big players of the market
  - There is no official timeline, and another analyst could reasonably pick a few different milestones here
  src: 25
