    10: https://nssa.stanford.edu/news/major-virtual-tutoring-provider-shuts-down-experts-cite-lack-evidence
    13: https://blog.coursera.org/global-skills-report-2026/
    16: https://www.ftc.gov/news-events/news/press-releases/2023/01/ftc-finalizes-order-ed-tech-provider-chegg-lax-security-exposed-student-data
