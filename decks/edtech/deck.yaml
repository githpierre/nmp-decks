    1: WHY WE TRUST IT
    2: HOW WE USED IT
    3: 'UNESCO, GEM

      report on technology'
    4: UNESCO's Global Education Monitoring report on technology in education
    5: We used it for the risks of privacy, lock-in and weak evidence. It framed the constraints that are structural.
    7: 'Digital Promise,

      procurement framework'
    8: The guide that US school districts use to pilot, select and buy learning tools
    9: We used it for the steps from free pilot to renewal. It framed how a startup wins a school district.
    10: 'Preply, Series D

      announcement'
    11: Preply's release on its $150M Series D led by WestCap in January 2026
    12: We used it for the $1.2B valuation and its positive EBITDA. It is our main example of human tutoring with AI.
    13: 'Speak, Series C

      announcement'
    14: Speak's release on its $78M Series C at a $1B valuation in December 2024
    15: We used it for the valuation and the age of the company. It framed the unicorn and AI tutor slides.
    16: 'MagicSchool, Series

      B announcement'
    17: MagicSchool's release on its $45M Series B for AI tools built for teachers
    18: We used it for the round and the product focus. It framed the slides on teacher AI.
  links:
    3: https://gem-report-2023.unesco.org/technology-in-education/
    7: https://digitalpromise.org/programs/edtech-procurement-framework/
    10: https://preply.com/en/blog/preply-raises-150-million-to-shape-the-future-of-education-through-human-led-ai-enhanced-learning/
    13: https://www.speak.com/blog/series-c
    16: https://www.magicschool.ai/blog-posts/series-b-fundraise-for-teacher-ai
  section: Sources
- id: ed219
  type: x/divider_10
  src: 219
  t:
    0: SOURCE
    1: WHY WE TRUST IT
    2: HOW WE USED IT
    3: 'Chegg, restructuring

      release'
    4: Chegg's October 2025 release on its plan to stay a standalone public company
    5: We used it for the 388 roles cut, about 45% of staff. It framed the slides on startups that stumbled.
    7: 'TechCrunch, Unacademy

      sale'
    8: TechCrunch's report on the sale of Unacademy to its rival upGrad in September 2026
    9: We used it for the $206M price, about 94% below the peak. It framed the slides on fallen stars.
    10: 'Stanford NSSA,

      tutoring studies'
    11: Stanford's National Student Support Accelerator studies on tutoring and AI tools in schools
    12: We used them for the end of Varsity Tutors for Schools and a reading trial with no gain. They framed school demand.
    13: 'Coursera, Global

      Skills Report'
    14: Coursera's 2026 Global Skills Report, based on more than 310 million learners
    15: We used it for the 45 GenAI enrollments per minute. It is our main signal of demand for AI skills.
    16: 'FTC, Chegg order

      and child privacy'
    17: The FTC's final order on Chegg's data security and its 2025 changes to child privacy rules
    18: We used them for the data security and privacy risks of EdTech. They framed the regulation slides.
  links:
    3: https://investor.chegg.com/Press-Releases/press-release-details/2025/Chegg-to-Remain-a-Standalone-Public-Company-to-Maximize-Shareholder-Value/default.aspx
