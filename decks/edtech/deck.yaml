- type: definition
  section: Market definition
  title: 'What is the EdTech market,

    in simple terms?'
  text: The EdTech market is the software, apps, and online services that schools, companies, and learners pay for to teach, learn, test, and certify new skills
  note: ['We often use a conversational tone, which may sometimes sound a bit informal', 'We do it on purpose, because it reduces cognitive load and makes slides easier']
- type: cards
  section: Market definition
  title: 'When and where is value

    created in the market?'
  items:
  - {e: 🎯, t: When a worker learns a new skill and gets promoted for it}
  - {e: ⏱️, t: When a teacher plans a full week of lessons in about one hour}
  - {e: 📚, t: When a student gets a clear explanation late at night before a test}
  - {e: 🗣️, t: When a learner speaks a new language without fear}
  - {e: 🌍, t: When a student far from any city learns from top teachers}
  - {e: 📝, t: 'When essays get graded in minutes, with useful feedback'}
  - {e: 📊, t: 'When a school sees which students fall behind, and why'}
  - {e: 💸, t: When an online degree costs a fraction of a campus program}
- {type: maturity, section: Market definition, title: 'How mature is EdTech

    as a market?', score: 62, text: 'The market is real because schools, companies, and learners spend about $192 billion a year, and leaders like Duolingo earn over $1 billion. The score is not higher because AI changes products
    every year, school budgets are tight, and many startups still struggle to sell.', note: 'We use a simple internal scoring tool to compare the maturity of markets we analyze regularly. It’s based on observed tech progress,
    disruptions, and year-over-year changes. The score is mainly directional, not 100% exact (but still clearer than vague labels).'}
- type: dated
  section: Market definition
  title: 'What has changed

    (very) recently?'
  page: 1/2
  items:
  - {d: SINCE 2020, t: 'COVID closed schools for 1.6 billion students around the world, and teaching moved online almost overnight. Online classes quickly became normal, and EdTech funding hit a record the next year.'}
  - {d: SINCE 2021, t: 'China banned for-profit tutoring in core school subjects, which was the heart of its EdTech boom. Its large online tutoring industry lost most of its business within a few months.'}
  - {d: SINCE 2022, t: ChatGPT launched in November and spread through schools and universities faster than any tool before it. Students began to ask AI for help with homework instead of searching for answers.}
  - {d: SINCE 2023, t: Chegg lost about half its value in a single day after blaming ChatGPT for weaker sign-ups from students. Homework help became the first clear victim of AI in the education market.}
  - {d: SINCE 2024, t: '2U filed for bankruptcy in the US, and Byju’s, once India’s most valuable startup, entered insolvency. Online degrees and big tutoring bets lost the trust of most investors.'}
  - {d: SINCE 2024, t: 'PowerSchool went private in a $5.6 billion deal, and Instructure, the maker of Canvas, soon followed. Private equity firms started to buy up the software that schools run on.'}
  note: Obviously, there is no official timeline. Some may argue that other changes were more significant or happened at slightly different moments. We selected the periods that felt most relevant, especially from the perspective
    of investors or entrepreneurs entering the market
- type: dated
  section: Market definition
  title: 'What has changed

    (very) recently?'
  page: 2/2
  items:
  - {d: SINCE 2025, t: 'The US Department of Education cut about half of its staff in a few weeks, under a plan to shrink the agency. Schools now get less federal help to choose and fund their tools.'}
  - {d: SINCE 2025, t: 'OpenAI and Google launched study modes inside their chatbots, which millions of students already use daily. Free AI tutors suddenly became direct rivals for paid learning apps.'}
  - {d: SINCE 2025, t: 'PhysicsWallah, which started as a free YouTube channel, went public in India and rose 33% on its first day. Investors began to trust profitable EdTech companies again.'}
  - {d: SINCE 2026, t: 'Coursera completed its merger with Udemy, creating a platform with about 290 million learners worldwide. Online course platforms began to merge to stay relevant against AI.'}
  - {d: SINCE 2026, t: 'The EU delayed its AI Act rules for education, which treat many school uses of AI as high risk, to December 2027. Schools in Europe gained more time to test and adopt AI tools.'}
  - {d: SINCE 2026, t: 'Coursera invested $100 million in LearnVector, the new AI tutoring startup of Andrew Ng, who cofounded Coursera. AI-native tutors became a serious bet for established players.'}
  note: Obviously, there is no official timeline. Some may argue that other changes were more significant or happened at slightly different moments. We selected the periods that felt most relevant, especially from the perspective
    of investors or entrepreneurs entering the market
- type: kpis
  section: Market opportunity
  title: 'Duolingo’s daily users grew

    23% in a single year'
  pill: SIGNAL
  items:
  - {label: People learned on Duolingo every day in the second quarter of 2026, value: 58.7M}
  - {label: Is how much daily users grew compared with mid-2025, value: +23%}
  - {label: 'Learners now pay for a Duolingo subscription, up 17% in a year', value: 12.7M}
  why: This is a strong signal because many feared that free AI chatbots would replace learning apps. Instead, more people use Duolingo every day.
  note: Data comes from Duolingo’s shareholder letter for the quarter ended in June 2026, published by [Duolingo](https://investors.duolingo.com)
