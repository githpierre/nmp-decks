- type: definition
  section: Market definition
  title: "What is the EdTech market,\nin simple terms?"
  text: The EdTech market is the software, apps, and online services that schools, companies, and learners pay for to teach, learn, test, and certify new skills
  note: "You may notice that we often use a conversational tone, which may sometimes sound a bit informal. This is actually intentional: we believe it helps reduce cognitive load and makes the content easier to follow"

- type: cards
  section: Market definition
  title: "When and where is value\ncreated in the market?"
  items:
    - {e: 🎯, t: "When a worker learns a new skill and gets promoted for it"}
    - {e: ⏱️, t: "When a teacher plans a full week of lessons in about one hour"}
    - {e: 📚, t: "When a student gets a clear explanation late at night before a test"}
    - {e: 🗣️, t: "When a learner speaks a new language without fear"}
    - {e: 🌍, t: "When a student far from any city learns from top teachers"}
    - {e: 📝, t: "When essays get graded in minutes, with useful feedback"}
    - {e: 📊, t: "When a school sees which students fall behind, and why"}
    - {e: 💸, t: "When an online degree costs a fraction of a campus program"}

- type: maturity
  section: Market definition
  title: "How mature is EdTech\nas a market?"
  score: 62
  text: The market is real because schools, companies, and learners spend about $192 billion a year, and leaders like Duolingo earn over $1 billion. The score is not higher because AI changes products every year, school budgets are tight, and many startups still struggle to sell.
  note: We use a simple internal scoring tool to compare the maturity of markets we analyze regularly. It’s based on observed tech progress, disruptions, and year-over-year changes. The score is mainly directional, not 100% exact (but still clearer than vague labels).

- type: dated
  section: Market definition
  title: "What has changed\n(very) recently?"
  page: 1/2
  items:
    - {d: SINCE 2020, t: "COVID closed schools for 1.6 billion students. Online classes became normal, and EdTech funding hit a record the next year."}
    - {d: SINCE 2021, t: "China banned for-profit tutoring in school subjects. Its large online tutoring industry lost most of its business."}
    - {d: SINCE 2022, t: "ChatGPT launched in November. Students began to ask AI for help with homework instead of searching for answers."}
    - {d: SINCE 2023, t: "Chegg lost about half its value in one day after blaming ChatGPT. Homework help became the first victim of AI."}
    - {d: SINCE 2024, t: "2U filed for bankruptcy, and Byju’s entered insolvency. Online degrees and big tutoring bets lost the trust of investors."}
    - {d: SINCE 2024, t: "PowerSchool went private in a $5.6 billion deal, and Instructure followed. Private equity bought school software."}
  note: Obviously, there is no official timeline. Some may argue that other changes were more significant or happened at slightly different moments. We selected the periods that felt most relevant, especially from the perspective of investors or entrepreneurs entering the market

- type: kpis
  section: Market opportunity
  title: "Duolingo’s daily users grew\n23% in a single year"
  pill: SIGNAL
  items:
    - {label: "People learned on Duolingo every day in the second quarter of 2026", value: 58.7M}
    - {label: "Is how much daily users grew compared with mid-2025", value: +23%}
    - {label: "Learners now pay for a Duolingo subscription, up 17% in a year", value: 12.7M}
  why: This is a strong signal because many feared that free AI chatbots would replace learning apps. Instead, more people use Duolingo every day.
  note: Data comes from Duolingo’s shareholder letter for the quarter ended in June 2026, published by [Duolingo](https://investors.duolingo.com)

- type: estimates
  section: Market size
  title: "What are the market size estimates\nfrom different sources online?"
  rows:
    - {firm: "Grand View\nResearch", value: $ 187 B, comment: "Their figure covers software, content, and some hardware for schools and companies. We use it as the base of our estimate."}
    - {firm: "Fortune Business\nInsights", value: $ 189 B, comment: "Their scope is close to ours, across schools, colleges, and companies. We use it to confirm the base of our range."}
    - {firm: "Markets and\nMarkets", value: $ 197 B, comment: "Their figure adds smart classroom hardware like displays and projectors. We treat it as the upper end of our core range."}
    - {firm: "IMARC\nGroup", value: $ 280 B, comment: "Their definition is much wider, and devices and other hardware make up almost half of it. We treat it as an upper bound only."}
  note: Market size estimates are taken directly from firms’ websites. Because their market definitions sometimes differ from ours, we document those differences and adjust our calculations accordingly. If an estimate is more than six months old, we account for that when updating our figures.

