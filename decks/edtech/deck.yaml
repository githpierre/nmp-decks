- id: ed210
  left: A REGULAR EDTECH STARTUP
  logo: duolingo
  note:
  - We used published product descriptions, filings and company announcements for Duolingo.
  - We use a fictional EdTech startup as the baseline to illustrate the chosen company’s strategy.
  right: DUOLINGO
  rows:
  - - They ask users to pay before trying a whole course
    - They let learners complete entire courses for free
  - - They teach with long lessons that require a free hour
    - They deliver short lessons made for use on a phone
  - - They focus on content without making practice a habit
    - They use game features to make learners want to return
  - - They depend on a large paid advertising budget to grow
    - They gain much of their reach through word of mouth
  - - They release features without testing them on learners
    - They run many tests to improve engagement and learning
  - - They limit their course library to one learning subject
    - They also teach math, music and chess in the same app
  - - They offer only written practice and fixed audio clips
    - They use AI video calls to provide conversation practice
  - - They count free learners as the main commercial metric
    - They reported 13.1M paid subscribers in September 2026
  section: Startup strategies
  src: 210
  title: How Duolingo made a daily habit into a subscription business
  type: contrast
  logo_src: ../../assets/logos/duolingo.png
- id: ed211
  left: A REGULAR EDTECH STARTUP
  logo: preply
  note:
  - We used published product descriptions, filings and company announcements for Preply.
  - We use a fictional EdTech startup as the baseline to illustrate the chosen company’s strategy.
  right: PREPLY
  rows:
  - - They replace the teacher with a fully automated course
    - They use AI to support rather than replace human tutors
  - - They make learners choose from a small fixed teaching team
    - They match learners with a global network of tutors
  - - They sell the same recorded class to every new learner
    - They offer individual lessons tailored to learner needs
  - - They focus on a small number of popular world languages
    - They teach learners in more than 90 different languages
  - - They leave teachers to prepare all follow-up tasks alone
    - They use AI to suggest practice after individual lessons
  - - They give tutors little insight into their own performance
    - They give tutors data on earnings, lessons and students
  - - They raise funds before showing positive core earnings
    - They reported positive EBITDA before the latest funding
  - - They expand the service without a major new capital round
    - They raised $150M at a $1.2B valuation in January 2026
  section: Startup strategies
  src: 211
  title: How Preply built a $1.2B human-led tutoring business
  type: contrast
  logo_src: ../../assets/logos/preply.png
- id: ed212
  left: A REGULAR EDTECH STARTUP
  logo: briskteaching
  note:
  - We used product descriptions, filings and company announcements for Brisk Teaching.
  - We use a fictional EdTech startup as the baseline to illustrate the chosen company’s strategy.
  right: BRISK TEACHING
  rows:
  - - They ask teachers to switch to a new stand-alone website
    - They put the teaching assistant inside the Chrome browser
  - - They require staff to copy work into a separate platform
    - They work inside Google Docs and other familiar tools
  - - They ask teachers to write every new classroom quiz
    - They let teachers draft quizzes with AI in their browser
  - - They give every student the same text regardless of level
    - They let teachers adapt the reading level of classroom texts
  - - They make teachers compose every comment from scratch
    - They suggest feedback on student work in existing tools
  - - They send AI-generated material straight to the students
    - They let teachers review and edit it before sharing it
  - - They require each educator to install the tool separately
    - They let districts roll it out to teachers through Chrome
  - - They try to grow without early outside investor backing
    - They raised a $15M Series A led by Bessemer in 2025
  section: Startup strategies
  src: 212
  title: How Brisk Teaching put AI inside teachers’ existing tools
  type: contrast
  logo_src: ../../assets/logos/brisk-teaching.png
- id: ed213
  left: A REGULAR EDTECH STARTUP
  logo: magicschool
  note:
  - We used product descriptions, filings and company announcements for MagicSchool.
  - We use a fictional EdTech startup as the baseline to illustrate the chosen company’s strategy.
  right: MAGICSCHOOL
  rows:
  - - They build a general chatbot and then sell it to schools
    - They build AI with K-12 education as the main priority
  - - They start without firsthand knowledge of school routines
    - Their founder worked as a teacher and school principal
  - - They leave teachers to design prompts for different pupils
    - They offer tools to adapt teaching to different learners
  - - They focus on teachers and ignore student-facing tools
    - They give students AI tools designed for school use
  - - They offer language tools only through outside vendors
    - They include support for language learning within the AI
  - - They treat school data as an administrative afterthought
    - They created a tool for educators to explore school data
  - - They build new features without a focus on school safety
    - They invest in product testing and a dedicated safety team
  - - They fund expansion without a large specialist investment
    - They raised $45M in Series B funding in February 2025
  section: Startup strategies
  src: 213
  title: How MagicSchool built AI around the daily needs of teachers
  type: contrast
  logo_src: ../../assets/logos/magicschool-ai--symbol.png
- id: ed214
  left: A REGULAR EDTECH STARTUP
  logo: yoodli
  note:
  - We used published product descriptions, filings and company announcements for Yoodli.
  - We use a fictional EdTech startup as the baseline to illustrate the chosen company’s strategy.
  right: YOODLI
  rows:
  - - They teach workplace skills mostly through static videos
    - They let staff practice realistic conversations with AI
  - - They limit speaking exercises to public presentations
    - They cover sales calls, interviews and manager feedback
  - - They require employees to rehearse with a human coach
    - They let learners practice privately as often as needed
  - - They offer the same fixed training scenario to every team
    - They let companies tailor simulated people and scenarios
  - - They deliver content without immediate feedback on practice
    - They provide personalized feedback during skill practice
  - - They make employees open a separate app for all training
    - They can embed the tool into existing company software
  - - They rely primarily on individuals paying for coaching
    - They earn most of their revenue from enterprise customers
  - - They build a training tool without major investor backing
    - They raised $40M in Series B funding in December 2025
  section: Startup strategies
  src: 214
  title: How Yoodli turned AI role-play into enterprise training
  type: contrast
  logo_src: ../../assets/logos/yoodli.png
