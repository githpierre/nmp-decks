- type: contrast
  section: Startup strategies
  title: "How Preply turned tutoring\ninto a profitable unicorn"
  left: A REGULAR TUTORING SITE
  right: PREPLY
  logo: preply
  rows:
    - [They raise big rounds before any profit, They reached positive EBITDA before raising]
    - [They charge tutors one flat commission, They cut their commission from 33% to 18%]
    - [They keep a few thousand tutors, "They offer 100,000+ tutors in 180 countries"]
    - [They teach a handful of languages, They teach in more than 90 languages]
    - [They replace tutors with AI to cut costs, They added AI tools around human tutors]
    - [They promise results without any data, They show one learner in three gains a level]
    - [They grow mostly by buying ads, They tripled bookable tutors in a few years]
    - [They refund unhappy learners in cash, They offer a free replacement trial lesson]
    - [They stay in their home market, They grew from Ukraine to a global platform]
    - [They raise at modest valuations, They reached a $1.2B valuation in 2026]
  note: We used Preply announcements and its help center on commissions. We treated “a regular tutoring site” as a fictional baseline, not a real company, for contrast only
