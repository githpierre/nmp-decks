- type: contrast
  section: Startup strategies
  title: 'How Preply turned tutoring

    into a profitable unicorn'
  left: A REGULAR TUTORING SITE
  right: PREPLY
  logo: preply
  rows:
  - [They raise large rounds long before reaching any profit, They reached positive EBITDA before raising their big round]
  - [They charge every tutor the same flat commission forever, They cut their commission on tutors from 33% down to 18%]
  - [They keep a small pool of a few thousand vetted tutors, 'They offer more than 100,000 tutors across 180 countries']
  - [They teach a handful of popular languages and little else, They teach more than 90 languages and many school subjects]
  - [They replace their human tutors with AI to cut their costs, They added AI tools around tutors instead of replacing them]
  - [They promise fast results without showing any learning data, They show that one learner in three gains a full level]
  - [They grow mostly by buying more and more online ads, They tripled the number of bookable tutors in a few years]
  - [They refund unhappy learners in cash and lose them for good, They offer a free replacement trial lesson to unhappy learners]
  - [They stay in their home market and grow one city at a time, They grew from a Ukrainian startup into a global platform]
  - [They raise money at modest valuations and stay rather small, They reached a $1.2B valuation in 2026 and became a unicorn]
  note: [We used Preply announcements and its help center on commissions, 'We treated “a regular tutoring site” as a fictional baseline, for contrast only']
- type: contrast
  section: Startup strategies
  title: 'How Gizmo made studying

    feel like a game'
  left: A REGULAR STUDY APP
  right: GIZMO
  logo: gizmo
  rows:
  - [They start with a large product team and a big budget, They reached 13M users with a team of only seven people]
  - ['They write their own question banks by hand, one at a time', They turn each student’s own notes into quizzes in seconds]
  - ['They feel like extra homework, so students open them rarely', 'They play like a game, with lives, streaks, and rewards']
  - [They show the same flashcards to every student in class, They use spaced repetition tuned to each single learner]
  - [They sell to schools through slow district procurement, 'They grow directly with students, without waiting for schools']
  - [They launch in one country at a time with local teams, They reached learners in more than 120 countries already]
  - [They grow only a few times over across many long years, They grew from 300K users in 2023 to 13M users since then]
  - [They count on push reminders to bring users back each day, They use leaderboards and friends to bring students back]
  - ['They raise large rounds very early, before any real traction', 'They raised their first big round, a $22M Series A, in 2026']
  - [They raise only from specialized education funds and angels, 'They raised their Series A from Shine, a generalist fund']
  note: [We used Gizmo announcements and press coverage of its Series A, 'We treated “a regular study app” as a fictional baseline, for contrast only']
- type: contrast
  section: Startup strategies
  title: 'How MagicSchool won over

    millions of teachers'
  left: A REGULAR SCHOOL VENDOR
  right: MAGICSCHOOL
  logo: magicschool
  rows:
  - [They are founded by software sellers far from classrooms, They were founded by a former principal who knew teachers]
  - [They sell to whole districts from day one through tenders, 'They let teachers start on a free plan, then win districts']
  - ['They charge high prices per student, even for small schools', They charge teachers only $8.33 a month for the Plus plan]
  - [They take years to reach a meaningful number of schools, They reached 6M educators in just 18 months after launch]
  - [They treat student privacy as an add-on after the sale, 'They hold FERPA, COPPA, and SOC 2 privacy seals already']
  - [They ship one big update a year before the school year, They ship new features for teachers every single month]
  - [They offer the same tools to every district they serve, They let more than 600 districts build their own custom tools]
  - [They work as a separate island next to other school tools, 'They connect to Canvas, Clever, and ClassLink out of the box']
  - [They track logins and clicks to prove their value to schools, They say 77% of teachers now feel their work life is better]
  - [They raise only from education funds with no strategic partner, 'They raised $45M, with Adobe Ventures joining the round']
  note: ['We used MagicSchool announcements, its Series B release, and its privacy pages', 'We treated “a regular school vendor” as a fictional baseline, for contrast only']
- type: contrast
  section: Startup strategies
  title: 'How Multiverse turned training

    into a unicorn'
  left: A REGULAR TRAINING FIRM
  right: MULTIVERSE
  logo: multiverse
  rows:
  - [They sell generic courses from a large online catalog, They run apprenticeships inside real jobs at real companies]
  - [They depend on yearly training budgets that get cut first, They use the UK apprenticeship levy that firms already pay]
  - [They train only a few thousand learners in a good year, 'They started 12,030 apprentices in one year across roles']
  - [They teach generic office skills that fit any company, They teach AI and data skills tailored to each job role]
  - [They work alone with each client without tech partners, They partner with Microsoft and Databricks on their programs]
  - [They stay in their home country and never cross a border, They bought StackFuel to enter the German market quickly]
  - [They add more staff every time revenue grows a little, 'They raised their revenue per employee by 37%, staying lean']
  - [They burn cash for many years without a clear end in sight, They had a cash-positive quarter in 2026 as they grew]
  - [They raise money only from local investors in one country, They raised from General Catalyst and Lightspeed]
  - [They lose most of their value when the funding market turns, They grew their valuation from $1.7B to $2.1B since 2022]
  note: ['We used Multiverse announcements, its UK filings, and press coverage of its rounds', 'We treated “a regular training firm” as a fictional baseline, for contrast only']
- type: contrast
  section: Startup strategies
  title: 'How PhysicsWallah went from

    YouTube to the stock market'
  left: A REGULAR TEST PREP FIRM
  right: PHYSICSWALLAH
  logo: physicswallah
  rows:
  - [They start with a paid app and spend heavily on online ads, They started with free lessons on YouTube for every student]
  - [They charge high fees that most Indian families cannot pay, They sell full exam courses starting from only about $4]
  - [They teach only in English in a country of many languages, They teach in nine Indian languages to reach more students]
  - ['They burn cash to grow fast, then hope for profits later', They were already profitable when they became a unicorn]
  - [They reach a few million followers on their social channels, They have 98.8M subscribers across their YouTube channels]
  - [They stay online only and never open physical centers, They opened 353 offline learning centers across India by 2026]
  - [They focus on one single exam and one type of student, 'They cover 13 exam categories, from engineering to medicine']
  - [They serve a few thousand paying users in a good year, 'They had 4.46M paying users in 2025, across all their courses']
  - [They crash hard after the COVID online learning boom, They listed 33% above their IPO price on their first day]
  - [They slow down after going public and lose momentum, They grew their revenue by 24% in a single recent quarter]
  note: ['We used PhysicsWallah’s IPO documents, results, and press coverage', 'We treated “a regular test prep firm” as a fictional baseline, for contrast only']
