rows:
- name: 'Fortune Business

    Insights, market report'
  why: The EdTech market report with its 2026 estimate, its forecast to 2034 and spending by buyer
  how: We used it as a central anchor of our $190B market size. It also gave the split between schools, colleges and employers.
  url: https://www.fortunebusinessinsights.com/edtech-market-111377
- name: 'Emergen Research,

    market report'
  why: The EdTech market report with its 2026 estimate and its forecast to 2035
  how: We used it as the low anchor of our market size. It also gave one of the growth rates we compared.
  url: https://www.emergenresearch.com/industry-report/edtech-market
- name: 'Grand View

    Research, report'
  why: The education technology report with a 2026 estimate that counts laptops and tablets
  how: We used it as a broad check on our market size. It also gave the slowest growth rate we compared.
  url: https://www.grandviewresearch.com/industry-analysis/education-technology-market
- name: 'Business Research

    Company, report'
  why: The EdTech market report with a 2026 estimate and a forecast to 2030 that counts generic devices
  how: We used it as the upper check of our market size. It also gave the fastest growth rate we compared.
  url: https://www.thebusinessresearchcompany.com/report/education-technology-edtech-global-market-report
- name: 'HolonIQ, EdTech

    venture report'
  why: HolonIQ's yearly count of EdTech venture capital, with the funding peak and the slump after it
  how: We used it for the $21B of 2021 and the $2.4B of 2024. It framed the funding cycle of the market.
  url: https://www.holoniq.com/notes/edtech-vc-reached-2-4b-for-2024-representing-the-lowest-level-of-investment-in-a-decade
- name: 'Duolingo, Q3 2026

    quarterly filing'
  why: Duolingo's quarterly report to the SEC for the period ending in September 2026
  how: We used it for 13.1M paid subscribers and 64.9M daily learners. It is our main proof of paid consumer demand.
  url: https://www.sec.gov/Archives/edgar/data/1562088/000162828026069692/duol-20260930.htm
- name: 'Coursera, Udemy

    merger releases'
  why: Coursera's releases and filings on its merger with Udemy, completed in May 2026
  how: We used them for the 18,000 enterprise clients and the $674M value at closing. They framed the consolidation slides.
  url: https://investor.coursera.com/news/news-details/2026/Coursera-Completes-Combination-with-Udemy-to-Build-the-Worlds-Most-Comprehensive-Skills-Platform/default.aspx
- name: 'PNAS, AI and

    math learning study'
  why: A peer-reviewed high school experiment on how students learn math with and without AI help
  how: We used it for the 17% drop in later exam scores with unguided AI. It framed the risks of AI tutors.
  url: https://doi.org/10.1073/pnas.2422633122
- name: 'NBER, Khanmigo

    school experiment'
  why: A two-year randomized trial of Khanmigo in 18 Tennessee middle schools, published in 2026
  how: We used it for gains similar to practice without AI and for 17% use after mistakes. It framed the proof gap.
  url: https://www.nber.org/papers/w35620
- name: 'OECD, Digital

    Education Outlook'
  why: The OECD review of digital education ecosystems, data links and school platforms
  how: We used it for the layers of school technology and the weak links between tools. It framed the tech chapter.
  url: https://www.oecd.org/en/publications/oecd-digital-education-outlook-2023_c74f03de-en.html
- name: 'UNESCO, GEM

    report on technology'
  why: UNESCO's Global Education Monitoring report on technology in education
  how: We used it for the risks of privacy, lock-in and weak evidence. It framed the constraints that are structural.
  url: https://gem-report-2023.unesco.org/technology-in-education/
- name: 'Digital Promise,

    procurement framework'
  why: The guide that US school districts use to pilot, select and buy learning tools
  how: We used it for the steps from free pilot to renewal. It framed how a startup wins a school district.
  url: https://digitalpromise.org/programs/edtech-procurement-framework/
- name: 'Preply, Series D

    announcement'
  why: Preply's release on its $150M Series D led by WestCap in January 2026
  how: We used it for the $1.2B valuation and its positive EBITDA. It is our main example of human tutoring with AI.
  url: https://preply.com/en/blog/preply-raises-150-million-to-shape-the-future-of-education-through-human-led-ai-enhanced-learning/
- name: 'Speak, Series C

    announcement'
  why: Speak's release on its $78M Series C at a $1B valuation in December 2024
  how: We used it for the valuation and the age of the company. It framed the unicorn and AI tutor slides.
  url: https://www.speak.com/blog/series-c
- name: 'MagicSchool, Series

    B announcement'
  why: MagicSchool's release on its $45M Series B for AI tools built for teachers
  how: We used it for the round and the product focus. It framed the slides on teacher AI.
  url: https://www.magicschool.ai/blog-posts/series-b-fundraise-for-teacher-ai
- name: 'Chegg, restructuring

    release'
  why: Chegg's October 2025 release on its plan to stay a standalone public company
  how: We used it for the 388 roles cut, about 45% of staff. It framed the slides on startups that stumbled.
  url: https://investor.chegg.com/Press-Releases/press-release-details/2025/Chegg-to-Remain-a-Standalone-Public-Company-to-Maximize-Shareholder-Value/default.aspx
- name: 'TechCrunch, Unacademy

    sale'
  why: TechCrunch's report on the sale of Unacademy to its rival upGrad in September 2026
  how: We used it for the $206M price, about 94% below the peak. It framed the slides on fallen stars.
  url: https://techcrunch.com/2026/09/01/indias-unacademy-sells-to-rival-upgrad-for-206m-about-94-less-than-its-peak-valuation/
- name: 'Stanford NSSA,

    tutoring studies'
  why: Stanford's National Student Support Accelerator studies on tutoring and AI tools in schools
  how: We used them for the end of Varsity Tutors for Schools and a reading trial with no gain. They framed school demand.
  url: https://nssa.stanford.edu/news/major-virtual-tutoring-provider-shuts-down-experts-cite-lack-evidence
- name: 'Coursera, Global

    Skills Report'
  why: Coursera's 2026 Global Skills Report, based on more than 310 million learners
  how: We used it for the 45 GenAI enrollments per minute. It is our main signal of demand for AI skills.
  url: https://blog.coursera.org/global-skills-report-2026/
- name: 'FTC, Chegg order

    and child privacy'
  why: The FTC's final order on Chegg's data security and its 2025 changes to child privacy rules
  how: We used them for the data security and privacy risks of EdTech. They framed the regulation slides.
  url: https://www.ftc.gov/news-events/news/press-releases/2023/01/ftc-finalizes-order-ed-tech-provider-chegg-lax-security-exposed-student-data
