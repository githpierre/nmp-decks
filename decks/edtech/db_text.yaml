ed162:
  6: 'BEFORE



    Before 2024, EdTech rode the pandemic boom, with $21B of venture money in 2021 alone, then fell to a decade low as schools reopened.'
  7: 'AFTER



    Since 2024, {db.n} rounds raised {db.total}. {db.cat1} takes the biggest share, just ahead of {db.cat2}, as investors back AI tutors.'
