ed158:
  note:
  - We add up the disclosed equity rounds of the EdTech startups we track, by half-year
  - 2026 H2 runs to mid-November only, and rounds with no public amount count as zero
ed159:
  note:
  - We add up the disclosed equity rounds of the EdTech startups in our database, which is complete since 2024
  - IPOs, debt and grants are left out, 2026 runs to mid-November, and rounds with no public amount count as zero
ed164:
  note:
  - We divide, for each year, the largest round by all the disclosed capital in our tracker
  - IPOs, debt and grants are left out, and 2026 only runs to mid-November for now
