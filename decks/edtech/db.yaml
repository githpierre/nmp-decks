ed160:
  6: Tutoring and test prep took about 31% of the capital raised since 2024, ahead of Workforce training with about 30%
  7: 295 of the 305 rounds since 2024 disclosed an amount, and the median disclosed round was $3.4M
  8: US startups closed 95 of the 305 rounds and took $1.2B, about 40% of all the money raised since 2024
  9: 5 rounds of $100M or more took 27% of the money, so most of this market is funded by small rounds
  10: The $260M round of AMBOSS is the biggest since 2024, ahead of the $175M round of PhysicsWallah
  11: Seed was the most common round, with 148 of the 305 rounds, ahead of Series A with 61 and Series B with 20
  note: We drew these insights from our tracker of 305 EdTech equity rounds announced since January 2024, worth about $3B
ed162:
  6: 'BEFORE



    Before 2024, EdTech rode the pandemic boom, with $21B of venture money in 2021 alone, then fell to a decade low as schools reopened.'
  7: 'AFTER



    Since 2024, 305 rounds raised $3B. Tutoring and test prep takes the biggest share, just ahead of Workforce training, as investors back AI tutors.'
  note: We used our tracker of EdTech equity rounds, complete from January 2024, and company releases and the press
