ed142p:
  title: 'What are the biggest

    threats to EdTech?'
  events:
  - odds: 45
    impact: 3
    text: OpenAI, Google and Anthropic give free tutoring modes to every student, so paid study apps lose users
  - odds: 40
    impact: 3
    text: With ESSER money gone, federal Title cuts force US districts to drop K-12 software contracts
  - odds: 35
    impact: 2
    text: EdTech venture funding stays under $3 billion a year and most Series A startups cannot raise again
  - odds: 30
    impact: 2
    text: AI cheating spreads so fast that universities return to paper exams and cut online course tools
  - odds: 30
    impact: 2
    text: States pass new student data laws after a PowerSchool-style breach, raising compliance costs for every vendor
  - odds: 30
    impact: 1
    text: More states extend classroom phone bans to screens, slowing adoption of app-based learning tools in schools
  - odds: 25
    impact: 2
    text: The Department of Education cuts federal student aid rules, so online program managers lose university partners
  - odds: 12
    impact: 3
    text: A major study links AI tutors to lower test scores and districts drop AI products
  note:
  - We listed the events that could slow EdTech down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
