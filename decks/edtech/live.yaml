ed007p:
  type: pp_radar
  title: 'What is in the EdTech

    market, and what is out?'
  TL:
    name: MasterClass
    src: ../../assets/logos/pp_live/edtech/s01-00.png
    text: sells celebrity video lessons by subscription, which feels like learning but works more like a streaming service
  TR:
    name: Zoom
    src: ../../assets/logos/pp_live/edtech/s01-02.png
    text: hosted millions of classes during the pandemic, but it remains generic video software built for business meetings
  BL:
    name: Pearson
    src: ../../assets/logos/pp_live/edtech/s01-10.png
    text: is seen as a textbook publisher, yet testing and online schools bring in about 60% of its sales, so it sits on the line
  BR:
    name: OpenATI
    src: ../../assets/logos/pp_live/edtech/s01-11.png
    text: added a study mode for students and sells ChatGPT Edu to universities, yet ChatGPT remains a general assistant
  caption:
  - Distance to the center reflects how directly a product is built to teach, assess or certify, not just used by learners
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
  - ../../assets/logos/pp_live/edtech/s01-01.png
