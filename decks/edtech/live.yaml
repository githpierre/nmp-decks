ed039p:
  caption_period: November 2021 to July 2025
  csv: assets/trends/edtech/ai-tutor.csv
  cut: '2025-07-27'
  date: From late 2021 to mid-2025.
  expl: Searches started with ChatGPT in early 2023 and kept rising as AI tutors from Khan Academy, Duolingo and many startups reached students and parents.
  note:
  - We tracked how often people worldwide googled this term from late 2021 to July 2025
  - Google changed how it counts small terms in mid-2025, so the curve stops in July 2025
  pill: SIGNAL
  signal: google-trends
  term: ai tutor
  title: 'Searches for AI tutors more than



    tripled from 2023 to mid-2025'
  window: 5y
