- label: EV CHARGING NETWORKS
  type: pp_risks
  section: Market challenges
  title: What are the biggest threats to the EV charging infrastructure market?
  events:
  - text: US states slow NEVI contracting again, delaying highway fast-charger sites and weakening private matching investment
    odds: 40
    impact: 3
  - text: Grid-connection queues lengthen in Europe and the US, leaving high-power charging sites built but unable to energize
    odds: 55
    impact: 3
  - text: EV sales stall after subsidy cuts, reducing charger utilization and making new public charging sites harder to finance
    odds: 40
    impact: 3
  - text: Mixed connector standards during the NACS switch raise retrofit costs for charging networks serving older fleets
    odds: 30
    impact: 2
  - text: Utilities raise demand charges on fast chargers, hurting the economics of quiet highway and rural charging sites
    odds: 45
    impact: 2
  - text: A major charging-network operator exits markets, making landlords more cautious about long-term site contracts
    odds: 35
    impact: 2
  - text: New cybersecurity rules force costly charger and payment upgrades, slowing small charge point operators
    odds: 35
    impact: 2
  - text: Local permits and transformer shortages delay fleet depots, so truck operators keep their diesel assets for longer
    odds: 50
    impact: 2
  note:
  - We listed the events that could slow EV charging infrastructure down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and you will find all the sources we used at the end of the report
