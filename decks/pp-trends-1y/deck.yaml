- label: FRAUD PREVENTION
  type: pp_trends
  section: Market opportunity
  pill: SIGNAL
  title: 'Deepfake scam searches exploded as

    fake voices and videos fool people'
  csv: /root/w/m101/s02/csv/125-fraud-prevention.csv
  term: deepfake scam
  expl: Cheap AI tools made it easy to clone a voice or a face. Scammers used fake videos of celebrities and fake calls from bosses, one of them cost engineering firm Arup $25M, and people went searching
    how to spot a deepfake scam.
  date: Lately.
  note: With the help of Google Trends, we tracked how often people around the world googled this term over the last five years
