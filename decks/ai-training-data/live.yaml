ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people ask how

    to get paid to train AI models'
  date: Recently.
  expl: AI labs need humans to teach their models, and they pay for it. Platforms like Outlier, DataAnnotation and Mercor flooded social media with ads
    for writers, coders, doctors and lawyers, some paying over $100 an hour. Millions of people searched how to get one of these jobs.
  term: ai training data
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/ai-training-data/ai-training-data.csv
ed052p:
  type: pp_cagr
  title: 'How much bigger can

    AI training data get?'
  lead: ''
  condition: To get that big, the market must keep frontier labs spending on human experts, and win new buyers in companies, robotics, and governments.
    It must also prove that human data still beats synthetic data, keep its experts fairly paid, and keep client data safe.
  note:
  - We compared forecasts from Mordor, Grand View, Fortune Business Insights and Precedence
  - We allowed for synthetic data and falling prices, with all the sources at the end of the report
  size: 10
  cagr: 20
  y0: 2026
