ed142p:
  title: 'What could go wrong

    for AI training data?'
  events:
  - odds: 25
    impact: 3
    text: Synthetic data and reinforcement learning replace most human-made data, shrinking the market for data vendors
  - odds: 20
    impact: 2
    text: OpenAI, Google and xAI hire experts directly and bring data work in-house, bypassing data vendors
  - odds: 15
    impact: 3
    text: AI labs cut training data budgets after a funding slowdown, hitting Scale AI, Surge and Turing
  - odds: 15
    impact: 2
    text: California and other states classify data workers as employees, raising costs for Scale AI and Surge
  - odds: 10
    impact: 3
    text: AI models surpass senior experts, so labs no longer need human experts to label or write data
  - odds: 10
    impact: 1
    text: Copyright settlements like Anthropic's $1.5 billion deal drain lab budgets that would pay data vendors
  - odds: 8
    impact: 1
    text: The US and China split AI data markets, cutting training data vendors off from half their buyers
  - odds: 5
    impact: 2
    text: A major data leak at Scale AI, Surge or Mercor makes AI labs stop using outside vendors
  note:
  - We listed the events that could slow ai training data down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
