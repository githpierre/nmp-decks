ed007p:
  type: pp_radar
  title: 'What makes a company

    part of AI training data?'
  TL:
    name: Hugging Face
    src: ../../assets/logos/pp_live/ai-training-data/s01-00.png
    text: hosts many of the open datasets AI labs train on, but it is a hosting hub, not paid to create or supply that data
  TR:
    name: ZoomInfo
    src: ../../assets/logos/pp_live/ai-training-data/s01-02.png
    text: sells huge databases of company and contact records, but that data is built to help sales teams, not to train AI models
  BL:
    name: Arena
    src: ../../assets/logos/pp_live/ai-training-data/s01-10.png
    text: collects millions of human votes comparing AI models, but labs mostly pay it to evaluate models, not to train them
  BR:
    name: Reddit
    src: ../../assets/logos/pp_live/ai-training-data/s01-11.png
    text: licenses its posts to AI labs for training, but that brought in about $43 million last quarter, next to $762 million of ads
  caption:
  - Distance to the center reflects how much of a company’s revenue comes from supplying the data that AI models are trained on
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
