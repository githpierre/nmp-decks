ed007p:
  type: pp_radar
  title: 'Which companies really belong

    in employee benefits platform?'
  TL:
    name: Gusto
    src: ../../assets/logos/pp_live/employee-benefits-platform/s01-00.png
    text: payroll and HR suite includes benefits, but benefits administration is ~~ only one module in a broader SMB platform
  TR:
    name: Stripe
    src: ../../assets/logos/pp_live/employee-benefits-platform/s01-02.png
    text: payments infrastructure may fund benefit cards, but it does not administer employee benefit programs
  BL:
    name: Deel
    src: ../../assets/logos/pp_live/employee-benefits-platform/s01-09.png
    text: offers global benefits with payroll and EOR, but benefits is one component of a much larger employment platform
  BR:
    name: Rippling
    src: ../../assets/logos/pp_live/employee-benefits-platform/s01-10.png
    text: benefits administration is integrated into a broad HR IT and payroll suite rather than a benefits only platform
  caption:
  - Distance to the center reflects how central each company is to employee benefits platform
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
