ed148p:
  title: 'What pushed the employee benefits

    market forward, year after year?'
  events:
  - year: '1974'
    text: ERISA standardizes employer benefit plans
    impact: 2.5
  - year: '1986'
    text: COBRA adds continuation administration
    impact: 2.0
  - year: '1996'
    text: HIPAA expands benefits compliance burden
    impact: 2.0
  - year: '2001'
    text: Web enrollment replaces paper packets
    impact: 2.0
  - year: '2003'
    text: HSAs create new benefit accounts
    impact: 2.0
  - year: '2006'
    text: Consumer-directed plans increase choices
    impact: 1.5
  - year: '2008'
    text: Cloud benefits software reduces IT burden
    impact: 1.5
  - year: '2010'
    text: ACA reshapes employer health benefits
    impact: 3.0
  - year: '2012'
    text: Mobile enrollment reaches employees anywhere
    impact: 1.5
  - year: '2014'
    text: ACA marketplaces normalize digital choice
    impact: 1.5
  - year: '2015'
    text: Benefits platforms add decision support
    impact: 1.5
  - year: '2016'
    text: Wellbeing apps join benefit ecosystems
    impact: 1.0
  - year: '2017'
    text: Point solutions multiply employer complexity
    impact: 2.0
  - year: '2018'
    text: Financial wellness enters benefit menus
    impact: 1.5
  - year: '2019'
    text: APIs connect fragmented benefit vendors
    impact: 1.5
  - year: '2020'
    text: Covid forces remote benefits enrollment
    impact: 2.5
  - year: '2020'
    text: Mental health demand expands benefits scope
    impact: 2.0
  - year: '2021'
    text: Virtual care joins employer benefits
    impact: 1.5
  - year: '2022'
    text: Inflation raises benefits decision pressure
    impact: 1.5
  - year: '2022'
    text: Voya agrees to buy Benefitfocus
    impact: 2.0
  - year: '2023'
    text: Voya completes Benefitfocus acquisition
    impact: 2.0
  - year: '2023'
    text: AI assistants enter benefits support
    impact: 1.5
  - year: '2024'
    text: Health navigation becomes platform feature
    impact: 1.5
  - year: '2024'
    text: Analytics links benefits to outcomes
    impact: 1.5
  - year: '2025'
    text: Businessolver shifts Sofia toward agents
    impact: 2.0
  - year: '2025'
    text: 24-hour benefits operations expand
    impact: 1.0
  - year: '2026'
    text: Businessolver launches anticipatory benefits
    impact: 2.0
  - year: '2026'
    text: Alight ships twenty-plus enhancements
    impact: 2.0
  - year: '2026'
    text: Alight acquires benefits data infrastructure
    impact: 2.0
  - year: '2026'
    text: AI personalizes benefits journeys
    impact: 1.5
  note:
  - We kept the events we believe pushed employee benefits platform forward the most
  - Ratings are our estimates, with all the sources at the end of the report
