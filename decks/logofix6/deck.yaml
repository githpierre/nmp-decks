- label: EV CHARGING NETWORKS
  type: pp_survivors
  section: Startup killers
  title: What do EV charging infrastructure survivors do differently?
  rows:
  - lesson: Own a dense driver network
    explanation: Tesla has the largest fast-charge network
    failed_company: Volta
    website: https://voltacharging.com/
    why_it_failed: Ad-led destination charging lacked cash
    slug: volta
    src: ../../assets/logos/pp/volta.png
    ini: V
  - lesson: Standardize hardware and plug
    explanation: NACS adoption widens Tesla utilization
    failed_company: Tritium
    website: https://tritiumcharging.com/
    why_it_failed: Hardware scale could not cover stress
    slug: tritium
    src: ../../assets/logos/pp/tritium.png
    ini: T
  - lesson: Monetize charging directly
    explanation: EVgo charges users for energy and service
    failed_company: Enel X Way NA
    website: https://www.enelxway.com/us/en/
    why_it_failed: Software exit stranded smart features
    slug: enel-x-way-na
    src: ../../assets/logos/pp/enel-x-way-na.png
    ini: EX
  - lesson: Keep capex per site controlled
    explanation: IONNA uses standardized fast-charge hubs
    failed_company: FreeWire
    website: https://freewiretech.com/
    why_it_failed: Capital-heavy hardware burned cash
    slug: freewire
    src: ../../assets/logos/pp/freewire.png
    ini: F
  - lesson: Pair scale with a strong parent
    explanation: Electrify America has VW backing
    failed_company: Charge Ent.
    website: https://charge.enterprises/
    why_it_failed: Debt-heavy roll-up hit bankruptcy
    slug: charge-ent
    src: ../../assets/logos/pp/charge-ent.png
    ini: CE
  note:
  - We compared EV charging infrastructure companies that failed or hit a major setback with the ones that survived
  - We used company statements and the press, and you will find all the sources we used at the end of the report
