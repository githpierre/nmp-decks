ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people search

    defense tech online, as Europe rearms'
  date: Over the past year.
  expl: Defense startups were all over the news. Europe promised to spend far more on its armies, cheap drones were reshaping the war in Ukraine, and companies
    like Anduril and Helsing raised record rounds. Defense stopped being taboo for tech, and people wanted to understand why.
  term: defense tech
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/defense-tech/defense-tech.csv
ed052p:
  type: pp_cagr
  title: 'How much room is left

    for defense tech to grow?'
  lead: 'To fill that room, '
  condition: NATO allies must keep their 5% pledge, and the US must turn its drone and missile requests into funded programs. Suppliers must also rebuild
    factories and supply chains fast enough to deliver what budgets now promise.
  note:
  - We compared spending trends from SIPRI, Global X and the European Defence Agency
  - We adjusted each one to our definition, and all our sources are at the end of the report
  size: 800
  cagr: 5
  y0: 2026
