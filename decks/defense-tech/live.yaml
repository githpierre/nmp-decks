ed142p:
  title: 'What could slow

    defense tech down?'
  events:
  - odds: 40
    impact: 2
    text: Software Acquisition Pathway reforms stall, so startups wait years to move from pilots to programs of record
  - odds: 35
    impact: 3
    text: Congress passes another full year continuing resolution, freezing new Pentagon programs for drones and autonomy
  - odds: 35
    impact: 2
    text: Lockheed, RTX and Northrop copy startup pricing and win most drone and counter-drone contracts
  - odds: 30
    impact: 2
    text: China restricts rare earth and gallium exports further, halting motor and sensor supply for drone makers
  - odds: 25
    impact: 2
    text: A peace deal in Ukraine cools European demand for drones and munitions from startups like Helsing
  - odds: 20
    impact: 1
    text: Engineers at Google, Microsoft and startups protest military AI work, making hiring harder for defense startups
  - odds: 15
    impact: 3
    text: Defense tech valuations crash after Anduril or a peer misses delivery targets, freezing late stage rounds
  - odds: 8
    impact: 3
    text: An autonomous weapon misfires and kills civilians, prompting UN pressure and new US autonomy limits
  note:
  - We listed the events that could slow defense tech down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
