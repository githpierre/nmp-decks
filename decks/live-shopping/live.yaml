ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More people ask how live shopping

    works as TikTok Shop reaches the West'
  date: C In recent months.
  expl: Live shopping was huge in China but never took off in the West. Then TikTok Shop scaled fast in the US and Europe, creators started selling live every day, and brands saw real sales. People went looking for how live shopping works.
  term: live shopping
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/live-shopping/live-shopping.csv
