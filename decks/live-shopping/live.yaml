ed142p:
  title: 'What could go wrong

    for live shopping?'
  events:
  - odds: 45
    impact: 2
    text: Higher tariffs after the end of de minimis push Chinese sellers to cut TikTok Shop listings
  - odds: 40
    impact: 2
    text: US shoppers stay unwilling to buy through long livestreams, and live shopping holds under 5% of ecommerce
  - odds: 35
    impact: 2
    text: Amazon Live and YouTube Shopping scale fast and take sellers and viewers from live shopping startups
  - odds: 30
    impact: 3
    text: The TikTok US joint venture changes TikTok Shop fees and creators move sales off the platform
  - odds: 30
    impact: 2
    text: Counterfeit goods scandals on TikTok Shop hurt buyer trust in buying from livestreams
  - odds: 30
    impact: 2
    text: Venture money for live shopping startups dries up after Popshop Live-style shutdowns, leaving only Whatnot funded
  - odds: 25
    impact: 3
    text: Whatnot faces a gambling probe as states call mystery packs and card breaks illegal lotteries
  - odds: 25
    impact: 1
    text: The FTC fines sellers over fake urgency claims and hidden fees during livestreams under new consumer rules
  note:
  - We listed the events that could slow live shopping down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
