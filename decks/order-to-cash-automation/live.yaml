ed148p:
  title: 'What pushed the order-to-cash automation

    market forward, year after year?'
  events:
  - year: '2001'
    text: Billtrust starts digitizing receivables
    impact: 1.5
  - year: '2006'
    text: HighRadius automates receivables
    impact: 1.5
  - year: '2010'
    text: HighRadius moves receivables to cloud
    impact: 2.0
  - year: '2014'
    text: HighRadius adds AI to receivables
    impact: 2.0
  - year: '2016'
    text: Cloud ERP adoption accelerates O2C
    impact: 1.5
  - year: '2017'
    text: HighRadius raises scale-up capital
    impact: 1.0
  - year: '2018'
    text: E-invoicing mandates spread globally
    impact: 2.0
  - year: '2019'
    text: HighRadius launches autonomous finance
    impact: 2.0
  - year: '2020'
    text: Pandemic pushes finance teams remote
    impact: 2.5
  - year: '2020'
    text: HighRadius raises $125M Series B
    impact: 1.0
  - year: '2021'
    text: HighRadius raises $300M Series C
    impact: 1.0
  - year: '2021'
    text: Digital payments reduce manual cash posting
    impact: 1.5
  - year: '2022'
    text: EQT takes Billtrust private
    impact: 1.5
  - year: '2022'
    text: Rising rates sharpen cash focus
    impact: 2.0
  - year: '2023'
    text: FedNow enables instant business payments
    impact: 2.0
  - year: '2023'
    text: HighRadius launches LiveCube analytics
    impact: 1.0
  - year: '2024'
    text: GenAI enters collections workflows
    impact: 1.5
  - year: '2024'
    text: Finance teams demand vendor consolidation
    impact: 1.5
  - year: '2025'
    text: EU adopts ViDA package
    impact: 2.5
  - year: '2025'
    text: HighRadius launches 180+ AI agents
    impact: 2.0
  - year: '2025'
    text: Cash visibility becomes CFO priority
    impact: 1.5
  - year: '2025'
    text: B2B networks connect buyers suppliers
    impact: 1.5
  - year: '2026'
    text: Billtrust launches agentic calling
    impact: 2.0
  - year: '2026'
    text: Visa pilots agentic invoice payments
    impact: 3.0
  - year: '2026'
    text: ViDA implementation work begins
    impact: 2.0
  - year: '2026'
    text: Agent authentication unlocks supplier portals
    impact: 2.0
  - year: '2026'
    text: Tokenized credentials reduce payment friction
    impact: 1.5
  - year: '2026'
    text: AI links approval to cash execution
    impact: 2.0
  - year: '2026'
    text: Autonomous finance becomes real
    impact: 2.0
  - year: '2026'
    text: Real-time rails improve cash application
    impact: 1.5
  note:
  - We kept the events we believe pushed order to cash automation forward the most
  - Ratings are our estimates, with all the sources at the end of the report
