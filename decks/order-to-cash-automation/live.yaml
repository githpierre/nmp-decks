ed007p:
  type: pp_radar
  title: 'Which companies really belong

    in order-to-cash automation?'
  TL:
    name: Tipalti
    src: ../../assets/logos/pp_live/order-to-cash-automation/s01-00.png
    text: automates payables and supplier workflows, adjacent to O2C but focused on money going out
  TR:
    name: ADP
    src: ../../assets/logos/pp_live/order-to-cash-automation/s01-02.png
    text: runs payroll and HCM workflows, touching finance operations but not the customer order-to-cash process
  BL:
    name: BlackLine
    src: ../../assets/logos/pp_live/order-to-cash-automation/s01-09.png
    text: includes AR automation, while much of its platform is record-to-report and financial close software
  BR:
    name: Esker
    src: ../../assets/logos/pp_live/order-to-cash-automation/s01-10.png
    text: has a full receivables suite, but also sells source-to-pay automation outside the O2C boundary
  caption:
  - Distance to the center reflects how central each company is to order-to-cash automation
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
