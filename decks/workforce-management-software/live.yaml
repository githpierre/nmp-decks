ed148p:
  title: 'What pushed the workforce management

    market forward, year after year?'
  events:
  - year: '1979'
    text: Kronos digitizes the time clock
    impact: 2.5
  - year: '1985'
    text: PC timekeeping reaches workforce teams
    impact: 2.0
  - year: '1992'
    text: Kronos scale validates WFM software
    impact: 1.5
  - year: '2000'
    text: Web software centralizes employee scheduling
    impact: 1.5
  - year: '2004'
    text: SaaS lowers workforce deployment costs
    impact: 2.0
  - year: '2007'
    text: Kronos buyout funds product expansion
    impact: 1.0
  - year: '2010'
    text: Mobile apps reach frontline workers
    impact: 2.0
  - year: '2011'
    text: Cloud WFM replaces on-premise upgrades
    impact: 2.0
  - year: '2014'
    text: San Francisco passes scheduling protections
    impact: 2.0
  - year: '2015'
    text: Seattle expands fair-workweek pressure
    impact: 1.5
  - year: '2016'
    text: Analytics improves labor demand forecasting
    impact: 1.5
  - year: '2017'
    text: Oregon passes statewide scheduling law
    impact: 2.5
  - year: '2018'
    text: AI enters labor forecasting tools
    impact: 1.5
  - year: '2019'
    text: Employee self-service becomes standard
    impact: 1.5
  - year: '2020'
    text: Covid breaks static workforce planning
    impact: 3.0
  - year: '2020'
    text: Kronos and Ultimate form UKG
    impact: 2.0
  - year: '2021'
    text: Labor shortages raise scheduling stakes
    impact: 2.0
  - year: '2022'
    text: Frontline apps add task management
    impact: 1.5
  - year: '2022'
    text: Inflation sharpens labor cost control
    impact: 1.5
  - year: '2023'
    text: Generative AI reaches HCM platforms
    impact: 1.5
  - year: '2023'
    text: Compliance patchwork keeps expanding
    impact: 2.0
  - year: '2024'
    text: AI scheduling gains enterprise attention
    impact: 2.0
  - year: '2024'
    text: Frontline experience becomes buying criterion
    impact: 1.5
  - year: '2025'
    text: Fair-workweek evidence supports enforcement
    impact: 1.5
  - year: '2025'
    text: Hourly labor volatility stays elevated
    impact: 1.5
  - year: '2025'
    text: Suite vendors deepen WFM competition
    impact: 1.0
  - year: '2026'
    text: Gartner formalizes modern WFM leaders
    impact: 2.0
  - year: '2026'
    text: AI innovation becomes WFM capability
    impact: 2.0
  - year: '2026'
    text: Global compliance becomes core requirement
    impact: 1.5
  - year: '2026'
    text: Frontline analytics broaden WFM value
    impact: 1.5
  note:
  - We kept the events we believe pushed workforce management software forward the most
  - Ratings are our estimates, with all the sources at the end of the report
