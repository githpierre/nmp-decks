ed007p:
  type: pp_radar
  title: 'Which companies really belong

    in workforce management software?'
  TL:
    name: Personio HRIS
    src: ../../assets/logos/pp_live/workforce-management-software/s01-00.png
    text: manages employee records and HR workflows, but workforce scheduling is not its primary product category
  TR:
    name: Slack
    src: ../../assets/logos/pp_live/workforce-management-software/s01-02.png
    text: frontline teams may communicate in ~~ Slack, but it does not plan labor demand, shifts or attendance
  BL:
    name: ADP
    src: ../../assets/logos/pp_live/workforce-management-software/s01-09.png
    text: offers time and workforce modules, but payroll and employer services remain the larger core of the business
  BR:
    name: UKG
    src: ../../assets/logos/pp_live/workforce-management-software/s01-10.png
    text: has deep workforce management, while payroll and broader HCM make up a large share of its overall platform
  caption:
  - Distance to the center reflects how central each company is to workforce management software
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
