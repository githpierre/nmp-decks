ed052p:
  type: pp_cagr
  title: 'How fast can workforce management

    software really grow?'
  lead: ''
  condition: To grow this fast, software must forecast labor accurately, handle complex rules and remain easy for frontline workers and to use.
  note:
  - We compared forecasts from Mordor Intelligence, Grand View Research and The Business Research Company
  - We adjusted each one to our definition of the market, and all the sources are included at the end of the report
