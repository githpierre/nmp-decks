ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'Searches for carbon removal climb

    as big tech buys it by the ton'
  date: 0 Lately.
  expl: Cutting emissions is no longer enough to hit climate goals, so companies started paying to pull CO2 back out of the air. Microsoft signed record
    carbon removal deals, and searches for carbon removal kept growing.
  term: carbon removal
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/carbon-removal/carbon-removal.csv
ed052p:
  type: pp_cagr
  title: 'What will the carbon removal

    market be worth by 2036?'
  lead: ''
  condition: To be worth that much, the market must cut the cost of durable removal toward 100 dollars a ton and win buyers beyond Microsoft, through compliance
    markets and government purchases, not just voluntary pledges.
  note:
  - We compared forecasts from BCC Research, IDTechEx, DataM and CDR.fyi and adjusted each one to our market definition
  - We then built a realistic range from these forecasts, and you will find all the sources we used at the end of the report
  size: 2
  cagr: 25
  y0: 2026
