ed148p:
  title: 'What pushed carbon removal

    forward, year after year?'
  events:
  - year: '1999'
    text: Early DAC research maps atmospheric capture
    impact: 1.0
  - year: '2009'
    text: Direct air capture reaches laboratory testing
    impact: 1.0
  - year: '2011'
    text: High DAC cost estimates spur innovation
    impact: 1.0
  - year: '2012'
    text: Modular DAC reaches small pilot scale
    impact: 1.0
  - year: '2014'
    text: DAC modules reach ton-scale trials
    impact: 1.5
  - year: '2015'
    text: Paris goals create carbon removal demand
    impact: 2.0
  - year: '2017'
    text: Commercial DAC tests operating costs
    impact: 2.0
  - year: '2017'
    text: Iceland pilot mineralizes captured CO2
    impact: 2.5
  - year: '2018'
    text: IPCC highlights need for negative emissions
    impact: 2.0
  - year: '2019'
    text: Biochar certificates enable removal trading
    impact: 2.0
  - year: '2020'
    text: Stripe purchases early permanent removal
    impact: 2.5
  - year: '2020'
    text: Microsoft pledges carbon negative operations
    impact: 2.0
  - year: '2021'
    text: Orca commercializes air capture with storage
    impact: 3.0
  - year: '2022'
    text: Frontier guarantees future removal demand
    impact: 3.0
  - year: '2022'
    text: US tax credits improve DAC economics
    impact: 2.0
  - year: '2023'
    text: Frontier signs major biomass storage offtake
    impact: 2.0
  - year: '2023'
    text: Microsoft backs mineral-sorbent DAC growth
    impact: 2.0
  - year: '2023'
    text: US funds direct air capture hubs
    impact: 2.0
  - year: '2024'
    text: Mammoth expands operating DAC design scale
    impact: 2.0
  - year: '2024'
    text: Stockholm secures large biomass removal buyer
    impact: 2.0
  - year: '2024'
    text: EU adopts carbon removal standards
    impact: 2.0
  - year: '2024'
    text: New registry strengthens removal verification
    impact: 1.5
  - year: '2025'
    text: Microsoft signs giant BECCS purchase
    impact: 2.0
  - year: '2025'
    text: Stockholm expands biomass removal sales
    impact: 2.0
  - year: '2025'
    text: Texas DAC receives geological storage permits
    impact: 2.0
  - year: '2026'
    text: EU standardizes durable removal methods
    impact: 2.5
  - year: '2026'
    text: Norway issues verified biogas removal credits
    impact: 2.0
  - year: '2026'
    text: Microsoft funds wastewater carbon removal
    impact: 1.5
  - year: '2026'
    text: Google backs megaton rock weathering
    impact: 2.0
  - year: '2026'
    text: Airline tests removal credits for compliance
    impact: 1.5
  note:
  - We kept the events we believe pushed carbon removal forward the most
  - Ratings are our estimates, with all the sources at the end of the report
