ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'Antibody drug conjugate searches rise

    as pharma keeps pouring in money'
  date: 0 Lately.
  expl: Antibody drug conjugates carry a strong drug straight to cancer cells. After Enhertu’s success, Pfizer bought Seagen for $43B and many licensing
    deals followed, so doctors, patients and investors kept searching what ADCs are.
  term: antibody drug conjugate
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/antibody-drug-conjugate/antibody-drug-conjugate.csv
ed052p:
  type: pp_cagr
  title: 'How much room is left

    for ADC therapies to grow?'
  lead: 'To fill that room, '
  condition: the market must move ADCs from late-stage cancer into earlier treatment lines, where far more patients are treated. It must also cut side effects
    with new payloads and linkers so doses can stay high.
  note:
  - We compared forecasts from Nova One Advisor, DataM, BCC Research and ResearchAndMarkets
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: 20
  cagr: 13
  y0: 2026
