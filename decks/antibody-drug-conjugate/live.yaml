ed148p:
  title: 'What pushed ADC therapies

    forward, year after year?'
  events:
  - year: '1975'
    text: Hybridomas standardize antibody targeting
    impact: 2.0
  - year: '1983'
    text: First antibody toxin trials expose challenges
    impact: 1.0
  - year: '1988'
    text: Humanized antibodies reduce immune reactions
    impact: 1.5
  - year: '1993'
    text: Potent calicheamicin opens new payload route
    impact: 1.5
  - year: '2000'
    text: Mylotarg validates first ADC approval
    impact: 3.0
  - year: '2010'
    text: Mylotarg withdrawal tightens ADC design
    impact: 1.5
  - year: '2011'
    text: Adcetris validates cleavable linkers
    impact: 3.0
  - year: '2013'
    text: Kadcyla extends ADCs to solid tumors
    impact: 2.5
  - year: '2017'
    text: Besponsa proves new leukemia target
    impact: 1.5
  - year: '2017'
    text: Mylotarg returns with refined dosing
    impact: 1.5
  - year: '2019'
    text: Polivy takes ADCs into lymphoma regimens
    impact: 1.5
  - year: '2019'
    text: Padcev validates Nectin-4 targeting
    impact: 2.0
  - year: '2019'
    text: Enhertu unlocks topoisomerase ADC payloads
    impact: 3.0
  - year: '2020'
    text: Trodelvy validates Trop-2 delivery
    impact: 2.0
  - year: '2020'
    text: Blenrep tests BCMA-directed ADC treatment
    impact: 1.5
  - year: '2021'
    text: Zynlonta expands CD19 conjugate options
    impact: 1.5
  - year: '2021'
    text: Tivdak expands into cervical cancer
    impact: 1.5
  - year: '2022'
    text: Elahere reaches resistant ovarian cancer
    impact: 2.0
  - year: '2023'
    text: Pfizer buys Seagen, validating ADC scale
    impact: 2.0
  - year: '2023'
    text: Merck funds next-generation payload pipeline
    impact: 2.0
  - year: '2024'
    text: Enhertu opens cross-cancer demand
    impact: 2.5
  - year: '2025'
    text: Datroway adds breast cancer payload choice
    impact: 1.5
  - year: '2025'
    text: Emrelis opens MET-high lung cancer niche
    impact: 1.5
  - year: '2025'
    text: Datroway expands into EGFR-mutant lung cancer
    impact: 1.5
  - year: '2026'
    text: Enhertu enters preoperative breast treatment
    impact: 2.0
  - year: '2026'
    text: Enhertu enters postoperative residual disease
    impact: 2.0
  - year: '2026'
    text: Datroway expands into untreated TNBC
    impact: 2.0
  - year: '2026'
    text: Decnupaz brings ADCs to rare neoplasms
    impact: 1.5
  - year: '2026'
    text: Trodelvy expands first-line TNBC access
    impact: 1.5
  - year: '2026'
    text: Padcev expands perioperative bladder therapy
    impact: 1.5
  note:
  - We kept the events we believe pushed antibody drug conjugate forward the most
  - Ratings are our estimates, with all the sources at the end of the report
