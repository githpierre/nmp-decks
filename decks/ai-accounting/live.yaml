ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more accountants

    look for AI accounting software'
  date: Lately.
  expl: Bookkeeping, invoices and tax prep are the kind of work AI handles well. Accountants and small business owners started searching for software that
    does the boring part for them.
  term: ai accounting
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/ai-accounting/ai-accounting.csv
ed052p:
  type: pp_cagr
  title: 'Is AI accounting

    still growing fast?'
  lead: ''
  condition: Yes, but agents must move from drafting work to finishing it, and accuracy must rise enough that firms let them post entries and file returns.
    Startups must also keep winning mid-market ledgers from NetSuite, while regulators keep a human responsible without banning the machine.
  note:
  - We compared three analyst forecasts with the growth of the listed incumbents to build a realistic range
  - We weighted them by today's revenue mix, and all the sources we used are listed at the end of the report
  size: 11
  cagr: 20
  y0: 2028
