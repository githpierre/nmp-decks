ed142p:
  title: 'What could go wrong

    for AI accounting?'
  events:
  - odds: 45
    impact: 3
    text: Intuit, Xero, Sage and BILL bundle AI agents into base plans, removing the edge of startups
  - odds: 25
    impact: 2
    text: The CFPB open banking rule dies and banks restrict data access for AI bookkeeping startups
  - odds: 20
    impact: 3
    text: Anthropic and OpenAI ship ready accounting agents that firms can use without buying startup software
  - odds: 12
    impact: 2
    text: A public audit or report built with AI contains major errors and makes clients distrust AI accounting
  - odds: 12
    impact: 2
    text: Funding for AI accounting startups dries up as investors doubt they can beat Intuit and Xero
  - odds: 8
    impact: 1
    text: Accounting firm roll-ups backed by private equity build their own AI tools instead of buying software
  - odds: 5
    impact: 2
    text: The IRS or a court holds an AI accounting vendor liable for errors in a tax return
  - odds: 5
    impact: 2
    text: Deloitte, EY, PwC and KPMG build their own AI accounting tools and stop buying from startups
  note:
  - We listed the events that could slow ai accounting down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
