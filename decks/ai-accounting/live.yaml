  title: 'What makes a company

    part of AI accounting?'
  TL:
    name: Intuit
    src: ../../assets/logos/pp_live/ai-accounting/s01-00.png
    text: is adding AI agents to QuickBooks for millions of businesses, but it remains classic accounting software with AI on top
  TR:
    name: YNAB
    src: ../../assets/logos/pp_live/ai-accounting/s01-01.png
    text: helps people plan what each dollar is for first, but personal budgeting is not accounting and has no books to close
