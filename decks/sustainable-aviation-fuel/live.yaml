ed052p:
  type: pp_cagr
  title: 'How much bigger can

    sustainable aviation fuel get?'
  lead: ''
  condition: To get that big, mandates, long-term offtake and new production capacity must scale while the cost premium versus fossil jet fuel declines.
  note:
  - We compared forecasts from Grand View Research, Mordor Intelligence and Meticulous Research and Markets
  - We adjusted each one to our definition of the market, and all the sources are included at the end of the report
