ed007p:
  type: pp_radar
  title: 'Which companies really belong

    in sustainable aviation fuel?'
  TL:
    name: ZeroAvia
    src: ../../assets/logos/pp_live/sustainable-aviation-fuel/s01-00.png
    text: develops hydrogen-electric aircraft propulsion, cutting aviation emissions without producing sustainable aviation fuel
  TR:
    name: Boeing
    src: ../../assets/logos/pp_live/sustainable-aviation-fuel/s01-02.png
    text: builds aircraft and supports SAF adoption, but does not primarily manufacture or license sustainable aviation fuel
  BL:
    name: Gevo
    src: ../../assets/logos/pp_live/sustainable-aviation-fuel/s01-09.png
    text: develops alcohol-to-jet SAF while also pursuing renewable fuels and carbon projects outside aviation fuel
  BR:
    name: Neste
    src: ../../assets/logos/pp_live/sustainable-aviation-fuel/s01-10.png
    text: produces large volumes of SAF, but F also sells renewable diesel and other refinery products across multiple markets
  caption:
  - Distance to the center reflects how central each company is to sustainable aviation fuel
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
