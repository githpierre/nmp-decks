ed148p:
  title: 'What pushed the sustainable aviation

    fuel market forward, year after year?'
  events:
  - year: '2008'
    text: Airlines test biofuel in flight
    impact: 1.0
  - year: '2009'
    text: ASTM pathway unlocks commercial SAF
    impact: 2.0
  - year: '2011'
    text: Commercial SAF flights begin
    impact: 1.5
  - year: '2012'
    text: Airlines sign first long-term offtakes
    impact: 1.0
  - year: '2014'
    text: HEFA becomes leading scalable pathway
    impact: 1.5
  - year: '2015'
    text: Paris climate deal raises aviation pressure
    impact: 1.0
  - year: '2016'
    text: ICAO creates global CORSIA framework
    impact: 2.0
  - year: '2016'
    text: United starts regular SAF supply
    impact: 1.5
  - year: '2017'
    text: California credits strengthen SAF economics
    impact: 1.0
  - year: '2018'
    text: Airline corporate deals fund SAF
    impact: 1.0
  - year: '2019'
    text: Neste expands renewable jet capacity
    impact: 1.5
  - year: '2020'
    text: Net-zero airline pledges boost demand
    impact: 1.5
  - year: '2021'
    text: US launches SAF Grand Challenge
    impact: 3.0
  - year: '2021'
    text: Airlines form larger SAF buying coalitions
    impact: 1.0
  - year: '2022'
    text: Inflation Reduction Act adds SAF credit
    impact: 3.0
  - year: '2022'
    text: Europe agrees ReFuelEU direction
    impact: 2.0
  - year: '2023'
    text: ReFuelEU becomes binding EU law
    impact: 2.5
  - year: '2023'
    text: US SAF tax credit starts
    impact: 1.5
  - year: '2023'
    text: More airlines sign multi-year offtakes
    impact: 1.0
  - year: '2024'
    text: UK finalizes national SAF mandate
    impact: 2.0
  - year: '2024'
    text: US SAF output rises sharply
    impact: 1.5
  - year: '2024'
    text: Roadmap identifies billion-gallon pipeline
    impact: 1.0
  - year: '2025'
    text: EU SAF mandate starts at two percent
    impact: 2.0
  - year: '2025'
    text: UK SAF mandate starts at two percent
    impact: 2.0
  - year: '2025'
    text: US 45Z clean fuel credit begins
    impact: 1.5
  - year: '2025'
    text: EU airports spread SAF supply widely
    impact: 1.5
  - year: '2026'
    text: EU confirms mandate was exceeded
    impact: 2.0
  - year: '2026'
    text: UK passes SAF revenue certainty law
    impact: 2.0
  - year: '2026'
    text: EASA publishes transparent SAF prices
    impact: 1.5
  - year: '2026'
    text: EU SAF supply reaches 1.1 million tonnes
    impact: 2.0
  note:
  - We kept the events we believe pushed sustainable aviation fuel forward the most
  - Ratings are our estimates, with all the sources at the end of the report
ed168p:
  handle: sustainable-aviation-fuel
  title: 'Where did sustainable aviation fuel

    investors put their money this past year?'
  note:
  - We added up every equity round of sustainable aviation fuel startups in our tracker over the last twelve months
  - by category of our market definition, and rounds with no public amount count as zero here
