ed148p:
  title: 'What pushed liquid biopsy

    forward, year after year?'
  events:
  - year: '1869'
    text: Circulating tumor cells expose blood clues
    impact: 1.0
  - year: '1948'
    text: Blood DNA discovery enables molecular tests
    impact: 2.0
  - year: '1977'
    text: Cancer patients show elevated circulating DNA
    impact: 1.0
  - year: '1989'
    text: Tumor-specific blood changes suggest tracking
    impact: 1.0
  - year: '1994'
    text: Mutant RAS proves blood carries tumor DNA
    impact: 2.0
  - year: '1996'
    text: Microsatellite changes extend plasma tests
    impact: 1.0
  - year: '1997'
    text: Fetal DNA accelerates circulating DNA science
    impact: 1.0
  - year: '2004'
    text: CellSearch standardizes tumor cell counts
    impact: 2.0
  - year: '2005'
    text: Blood tumor counts predict treatment outcomes
    impact: 1.5
  - year: '2008'
    text: Digital PCR improves rare mutation detection
    impact: 1.5
  - year: '2011'
    text: Sequencing enables repeat tumor profiling
    impact: 1.0
  - year: '2012'
    text: Sequencing improves recurrence tracking
    impact: 1.5
  - year: '2013'
    text: Plasma sequencing maps evolving tumor genomes
    impact: 1.5
  - year: '2014'
    text: Sensitive panels widen tumor profiling
    impact: 1.5
  - year: '2015'
    text: Blood mutation tests guide targeted treatment
    impact: 1.5
  - year: '2016'
    text: Epi proColon opens blood colon screening
    impact: 2.0
  - year: '2016'
    text: Cobas approval ties plasma to lung therapy
    impact: 3.0
  - year: '2018'
    text: CancerSEEK advances multicancer detection
    impact: 2.0
  - year: '2019'
    text: Methylation expands blood cancer signals
    impact: 1.0
  - year: '2020'
    text: Guardant360 clears broad blood profiling path
    impact: 2.5
  - year: '2020'
    text: FoundationOne expands plasma test choices
    impact: 2.0
  - year: '2021'
    text: Galleri launch tests screening demand
    impact: 1.5
  - year: '2022'
    text: DYNAMIC validates ctDNA-guided therapy
    impact: 2.5
  - year: '2022'
    text: NHS trial recruits 140000 volunteers
    impact: 1.5
  - year: '2023'
    text: Methylation studies validate screening
    impact: 1.0
  - year: '2024'
    text: Shield wins US colorectal screening approval
    impact: 3.0
  - year: '2025'
    text: Bladder trial proves MRD-guided survival gain
    impact: 2.0
  - year: '2026'
    text: Signatera links residual DNA to prescribing
    impact: 2.5
  - year: '2026'
    text: Freenome adds competing colon blood screen
    impact: 1.5
  - year: '2026'
    text: Galleri failure raises evidence standards
    impact: 1.5
  note:
  - We kept the events we believe pushed liquid biopsy forward the most
  - Ratings are our estimates, with all the sources at the end of the report
