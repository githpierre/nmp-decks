ed052p:
  type: pp_cagr
  title: 'At what pace will

    liquid biopsy grow?'
  lead: ''
  condition: To keep that pace, the market must prove that blood tests catch cancer early enough to save lives, so that insurers and screening programs
    pay for them. It must also make residual disease tests routine after surgery.
  note:
  - We compared forecasts from Towards Healthcare, Precedence, 360iResearch and BCC Research
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: 8
  cagr: 13
  y0: 2027
