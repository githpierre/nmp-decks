ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'Deepfake scam searches exploded as

    fake voices and videos fool people'
  date: Lately.
  expl: Cheap AI tools made it easy to clone a voice or a face. Scammers used fake videos of celebrities and fake calls from bosses, one of them cost engineering
    firm Arup $25M, and people went searching how to spot a deepfake scam.
  term: fraud prevention
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/fraud-prevention/fraud-prevention.csv
ed052p:
  type: pp_cagr
  title: 'What will the fraud prevention

    market be worth by 2036?'
  lead: ''
  condition: To be worth that much, the market must keep pace with AI deepfakes and scams that hit real-time payments, and share fraud signals across banks,
    merchants and telcos so losses fall instead of just moving elsewhere.
  note:
  - We compared forecasts from MarketsandMarkets, Fortune Business Insights and Straits and adjusted each one to our market
  - We then built a realistic range from these forecasts, and you will find all the sources we used at the end of the report
  size: null
  cagr: 15
  y0: 2026
