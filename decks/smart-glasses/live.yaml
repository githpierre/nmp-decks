ed007p:
  type: pp_radar
  title: 'What counts as smart glasses,

    and what only looks like it?'
  TL:
    name: Warby Parker
    src: ../../assets/logos/pp_live/smart-glasses/s01-00.png
    text: is launching AI glasses with Google, but almost all of its sales still come from ordinary prescription frames
  TR:
    name: Pico
    src: ../../assets/logos/pp_live/smart-glasses/s01-02.png
    text: makes VR headsets for ByteDance, but they close off the eyes completely, which makes them headsets rather than glasses
  BL:
    name: Xiaomi
    src: ../../assets/logos/pp_live/smart-glasses/s01-10.png
    text: sold 50,000 AI glasses in three days at launch, but they remain a small accessory next to its phones and electric cars
  BR:
    name: Google
    src: ../../assets/logos/pp_live/smart-glasses/s01-11.png
    text: builds the Android XR software and Gemini assistant for new glasses, but leaves the hardware to partners like Samsung
  caption:
  - Distance to the center reflects how much a company’s business rests on eyewear people can wear all day with digital features
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
