ed142p:
  title: 'What could go wrong

    for smart glasses?'
  events:
  - odds: 40
    impact: 3
    text: Apple, Google and Samsung launch premium glasses and take the high end from smaller brands
  - odds: 25
    impact: 3
    text: Meta cuts Ray-Ban glasses prices further and absorbs losses, leaving rivals unable to compete on price
  - odds: 20
    impact: 2
    text: Waveguide displays stay scarce and costly, so Meta and others delay full display glasses launches
  - odds: 15
    impact: 2
    text: Buyers return AI glasses in large numbers as novelty fades, as already seen in China
  - odds: 15
    impact: 1
    text: XREAL or another glasses maker has a failed IPO, scaring investors away from smart glasses
  - odds: 10
    impact: 2
    text: US tariffs on Chinese-made electronics spike again and make AI glasses too costly for Americans
  - odds: 5
    impact: 2
    text: The EU bans or restricts cameras in smart glasses, blocking sales of AI glasses across Europe
  - odds: 3
    impact: 2
    text: A battery fire in Ray-Ban Meta or similar glasses triggers a large recall and scares buyers
  note:
  - We listed the events that could slow smart glasses down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
