ed148p:
  title: 'What pushed the agricultural biologicals

    market forward, year after year?'
  events:
  - year: '1996'
    text: US law favors lower-risk pesticides
    impact: 1.0
  - year: '1998'
    text: EPA expands dedicated biopesticide pathway
    impact: 1.5
  - year: '2000'
    text: Organic acreage expands biological demand
    impact: 1.0
  - year: '2003'
    text: Microbial seed treatments enter mainstream
    impact: 1.0
  - year: '2006'
    text: Residue pressure boosts biocontrol interest
    impact: 1.0
  - year: '2008'
    text: Fertilizer spike revives inoculant economics
    impact: 1.0
  - year: '2010'
    text: Biostimulants spread beyond specialty crops
    impact: 1.5
  - year: '2012'
    text: Pheromones scale integrated pest management
    impact: 1.0
  - year: '2013'
    text: Major crop firms invest in biologicals
    impact: 1.5
  - year: '2015'
    text: Microbiome research expands product pipeline
    impact: 1.5
  - year: '2016'
    text: EU plant health law raises prevention
    impact: 1.0
  - year: '2017'
    text: Precision agriculture improves biological use
    impact: 1.0
  - year: '2018'
    text: Retailers widen biological product shelves
    impact: 1.0
  - year: '2019'
    text: EU fertilizer rules recognize biostimulants
    impact: 2.5
  - year: '2020'
    text: Farm to Fork cuts pesticide targets
    impact: 3.0
  - year: '2020'
    text: Syngenta buys Valagro biologicals
    impact: 2.0
  - year: '2021'
    text: Nitrogen prices lift efficiency products
    impact: 1.5
  - year: '2021'
    text: Climate stress raises resilience demand
    impact: 1.0
  - year: '2022'
    text: Pesticide restrictions keep tightening
    impact: 1.5
  - year: '2022'
    text: Biological nitrogen fixation gains attention
    impact: 1.5
  - year: '2023'
    text: Corteva buys Stoller and Symborg
    impact: 2.5
  - year: '2023'
    text: Syngenta creates dedicated biologicals unit
    impact: 2.0
  - year: '2023'
    text: Input inflation favors efficiency tools
    impact: 1.0
  - year: '2024'
    text: Corteva unifies biologicals portfolio
    impact: 1.5
  - year: '2024'
    text: More microbial actives reach EPA review
    impact: 1.0
  - year: '2025'
    text: Engineered microbes improve product precision
    impact: 1.5
  - year: '2025'
    text: Retailers demand measurable returns
    impact: 1.0
  - year: '2026'
    text: EPA reviews new microbial crop tools
    impact: 2.0
  - year: '2026'
    text: Robigo targets chemistry-level performance
    impact: 2.0
  - year: '2026'
    text: Bayer backs engineered biological pipeline
    impact: 1.5
  note:
  - We kept the events we believe pushed agricultural biologicals forward the most
  - Ratings are our estimates, with all the sources at the end of the report
