ed007p:
  type: pp_radar
  title: 'Which companies really belong

    in agricultural biologicals?'
  TL:
    name: Ginkgo Bioworks
    src: ../../assets/logos/pp_live/agricultural-biologicals/s01-00.png
    text: engineers microbes for many industries, including agriculture, but is a horizontal biotech platform rather than an ag-in
  TR:
    name: Deere & Company
    src: ../../assets/logos/pp_live/agricultural-biologicals/s01-02.png
    text: provides farm ~~ machinery and precision-ag tools, but does not primarily sell biological crop-protection or growth inputs
  BL:
    name: Syngenta
    src: ../../assets/logos/pp_live/agricultural-biologicals/s01-09.png
    text: sells biologicals through a broad crop-protection and seeds portfolio that includes substantial synthetic products
  BR:
    name: Bayer
    src: ../../assets/logos/pp_live/agricultural-biologicals/s01-10.png
    text: owns biological crop-input products, 5 . while most agricultural revenue still spans seeds, traits and synthetic chemistry ¥ ~ -
  caption:
  - Distance to the center reflects how central each company is to agricultural biologicals
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
