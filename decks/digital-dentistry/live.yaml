ed148p:
  title: 'What pushed the digital dentistry

    market forward, year after year?'
  events:
  - year: '1973'
    text: Dental CAD CAM starts digital shift
    impact: 2.5
  - year: '1985'
    text: CEREC brings chairside digital restorations
    impact: 3.0
  - year: '1986'
    text: SLA creates additive manufacturing foundation
    impact: 1.5
  - year: '1988'
    text: Commercial SLA printer expands prototyping
    impact: 1.0
  - year: '1990'
    text: Digital denture experiments begin
    impact: 1.0
  - year: '1997'
    text: Aligners digitize orthodontic planning
    impact: 2.0
  - year: '1999'
    text: Invisalign scales digital orthodontics
    impact: 2.5
  - year: '2000'
    text: Dental labs adopt wider CAD workflows
    impact: 1.5
  - year: '2003'
    text: Cone beam CT improves implant planning
    impact: 2.0
  - year: '2005'
    text: Digital impressions gain clinical traction
    impact: 1.5
  - year: '2008'
    text: iTero enables full-arch digital impressions
    impact: 2.0
  - year: '2009'
    text: Guided implant workflows broaden access
    impact: 1.5
  - year: '2011'
    text: TRIOS expands color intraoral scanning
    impact: 2.0
  - year: '2012'
    text: Desktop 3D printing lowers entry costs
    impact: 1.5
  - year: '2013'
    text: Printable dental models reduce turnaround
    impact: 1.0
  - year: '2014'
    text: Cloud case transfer speeds lab collaboration
    impact: 1.0
  - year: '2015'
    text: Open CAD ecosystems increase lab choice
    impact: 1.0
  - year: '2016'
    text: Chairside milling broadens same-day dentistry
    impact: 1.5
  - year: '2017'
    text: Dental resins widen printable applications
    impact: 1.5
  - year: '2018'
    text: Digital orthodontics reaches more practices
    impact: 1.5
  - year: '2019'
    text: AI enters dental imaging workflows
    impact: 1.0
  - year: '2020'
    text: Covid favors contact-light digital workflows
    impact: 2.0
  - year: '2021'
    text: Remote orthodontic monitoring expands
    impact: 1.5
  - year: '2022'
    text: Digital dentistry research network launches
    impact: 1.0
  - year: '2023'
    text: Faster scanners reduce chairside friction
    impact: 1.5
  - year: '2024'
    text: iTero Lumina improves scanning workflow
    impact: 1.5
  - year: '2025'
    text: AI CAD tools shorten design time
    impact: 1.5
  - year: '2025'
    text: Direct printing moves toward final appliances
    impact: 1.5
  - year: '2026'
    text: 3Shape Dx wins US clearance
    impact: 2.0
  - year: '2026'
    text: Align previews direct-printed attachments
    impact: 2.0
  note:
  - We kept the events we believe pushed digital dentistry forward the most
  - Ratings are our estimates, with all the sources at the end of the report
ed168p:
  handle: digital-dentistry
  title: 'Where did digital dentistry investors

    put their money this past year?'
  note:
  - We added up every equity round of digital dentistry startups in our tracker over the last twelve months
  - by category of our market definition, and rounds with no public amount count as zero here
