ed007p:
  type: pp_radar
  title: 'Who Is in digital dentistry,

    and who stays outside?'
  TL:
    name: Overjet
    src: ../../assets/logos/pp_live/digital-dentistry/s01-00.png
    text: it analyzes dental images and claims with ATI, but it does not provide the ~ scanning, CAD, milling or printing workflow
  TR:
    name: Colgate-Palmolive
    src: ../../assets/logos/pp_live/digital-dentistry/s01-02.png
    text: it makes oral care ~~ consumer products and dental materials, not digital systems for scanning, CAD, printing or treatment
  BL:
    name: Pearl
    src: ../../assets/logos/pp_live/digital-dentistry/s01-09.png
    text: its AI augments digital dental images and workflows, but it is primarily an intelligence layer rather than core CAD or
  BR:
    name: DentalMonitoring
    src: ../../assets/logos/pp_live/digital-dentistry/s01-10.png
    text: its smartphone scans digitize orthodontic follow up, but the company focuses on monitoring rather than producing dental
  caption:
  - Distance to the center reflects how central each company is to digital dentistry
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
