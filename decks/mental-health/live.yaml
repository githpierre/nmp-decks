ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more men are looking

    for help with their mental health'
  date: 0 Over the past year.
  expl: Men’s mental health moved from a whisper to a public topic. Athletes, podcasters and creators started talking openly about anxiety and burnout,
    and Netflix’s Adolescence sparked a global debate about boys and young men. More men now search for help made for them.
  term: mental health
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/mental-health/mental-health.csv
ed052p:
  type: pp_cagr
  title: 'Can the mental health

    market still grow?'
  lead: ''
  condition: Yes, but the market must treat more of the people who now get no care, with insurers paying for therapy, psychiatry, and digital treatment.
    It must also turn new drugs, psychedelics, and AI into approved and paid care, while Medicaid cuts and clinician shortages hold it back.
  note:
  - We compared forecasts from SkyQuest, IMARC, Stellar Market Research and The Business Research Company
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  - a uana dean amatamn nanan wi waren viet cuen ns aaa ieee
  size: 450
  cagr: 3.8
  y0: 2026
