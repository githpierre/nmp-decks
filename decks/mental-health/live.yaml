ed007p:
  type: pp_radar
  title: 'What counts as mental health,

    and what only looks like it?'
  TL:
    name: Doctolib
    src: ../../assets/logos/pp_live/mental-health/s01-00.png
    text: books visits with psychologists and psychiatrists, but it schedules the care rather than providing any of it itself
  TR:
    name: Petit BamBou
    src: ../../assets/logos/pp_live/mental-health/s01-02.png
    text: has 12 million users for its meditation sessions, but it is a self- help app, not a treatment for any diagnosis
  BL:
    name: Teladoc
    src: ../../assets/logos/pp_live/mental-health/s01-10.png
    text: earns nearly 40% of its revenue from BetterHelp therapy, but the rest is general virtual care, so it sits on the line
  BR:
    name: Headspace
    src: ../../assets/logos/pp_live/mental-health/s01-11.png
    text: began as a meditation app and now offers licensed therapists, which puts it right between wellness and clinical care
  caption:
  - Distance to the center reflects how directly a company diagnoses or treats mental health conditions, not general wellbeing
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
