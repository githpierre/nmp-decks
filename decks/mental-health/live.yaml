ed142p:
  title: 'What could go wrong

    for mental health?'
  events:
  - odds: 50
    impact: 3
    text: More states copy Illinois and Nevada and ban AI chatbots from giving therapy without a licensed clinician
  - odds: 45
    impact: 2
    text: OpenAI and Google add free mental health support to ChatGPT and Gemini, taking users from paid apps
  - odds: 40
    impact: 1
    text: Licensed therapists refuse low per-session rates, and the shortage limits growth at BetterHelp and Grow Therapy
  - odds: 35
    impact: 2
    text: Medicaid cuts in the One Big Beautiful Bill Act shrink payments to virtual therapy companies like Talkspace
  - odds: 30
    impact: 2
    text: Employers cut benefits spending and drop Lyra, Spring Health and Headspace contracts during a slowdown
  - odds: 25
    impact: 3
    text: Teen suicide lawsuits against Character.AI and OpenAI lead to strict federal rules on mental health chatbots
  - odds: 25
    impact: 2
    text: The FTC fines another app after BetterHelp-style sharing of user mental health data with advertisers
  - odds: 20
    impact: 2
    text: The DEA ends telehealth flexibilities and stimulant prescriptions over video calls need in-person visits again
  note:
  - We listed the events that could slow mental health down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
