ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more patients are

    looking up surgical robots'
  date: Recently.
  expl: Robot-assisted surgery is now routine in many hospitals, and new systems from several companies are entering the market. Patients and surgeons both
    started looking up what it means to be operated on by a robot.
  term: surgical robotics
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/surgical-robotics/surgical-robotics.csv
ed052p:
  type: pp_cagr
  title: 'How much bigger can

    surgical robotics get?'
  lead: ''
  condition: To get that big, robots must move from big hospitals to outpatient centers and smaller countries, and win new fields like the eye, vessels,
    and tumors treated with no incision. Makers must also cut the cost per case, as hospitals compare robots with cheaper keyhole surgery and Chinese robots
    push prices down.
  note:
  - We compared forecasts from Global Market Insights, Precedence, MarketsandMarkets and Polaris
  - We allowed for price cuts from new rivals, and all the sources are included at the end of the report
  size: 14
  cagr: 13
  y0: 2026
