ed142p:
  title: 'What could go wrong

    for surgical robots?'
  events:
  - odds: 25
    impact: 3
    text: Intuitive cuts da Vinci prices and offers leases, leaving new surgical robot rivals unable to compete
  - odds: 25
    impact: 2
    text: A Chinese price war spreads abroad as MicroPort and others sell surgical robots far below Western prices
  - odds: 15
    impact: 2
    text: Stryker and Medtronic buy surgical robot startups like CMR and Cornerstone at low prices
  - odds: 12
    impact: 2
    text: Hospitals in the US, Europe and Japan freeze capital budgets and delay surgical robot purchases
  - odds: 12
    impact: 1
    text: New US tariffs raise costs for surgical robot makers that build parts or systems abroad
  - odds: 10
    impact: 2
    text: Payers cut rates for robotic surgery, so hospitals stop buying new surgical robots
  - odds: 8
    impact: 3
    text: A da Vinci or rival robot fault seriously harms patients and triggers a broad FDA recall
  - odds: 5
    impact: 2
    text: Hackers attack surgical robots through remote updates, forcing hospitals to take systems offline
  note:
  - We listed the events that could slow surgical robotics down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
