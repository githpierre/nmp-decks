    text: US senators demand AI toy safeguards
    impact: 1.5
  - year: '2026'
    text: AI toy sales surge during shopping festival
    impact: 2.0
  - year: '2026'
    text: Toy expo gives AI dedicated hall
    impact: 2.0
  note:
  - We kept the events we believe pushed ai toys forward the most
  - Ratings are our estimates, with all the sources at the end of the report
