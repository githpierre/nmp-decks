    text: Anki collapse exposes cloud toy fragility
    impact: 1.5
  - year: '2020'
    text: Moxie adapts to social learning needs
    impact: 2.5
  - year: '2021'
    text: Miko updates expand personalized learning
    impact: 1.5
  - year: '2022'
    text: Loona crowdfunding validates robot pets
    impact: 2.0
  - year: '2023'
    text: Generative AI gives plush toys open dialogue
    impact: 2.5
  - year: '2024'
    text: Moflin teaches emotional robotic pet behavior
    impact: 2.0
  - year: '2024'
    text: Moxie shutdown reveals cloud dependency risks
    impact: 2.0
