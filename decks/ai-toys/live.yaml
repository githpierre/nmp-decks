ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'AI toy searches exploded as

    toys learn to talk back to kids'
  date: Lately.
  expl: Toy makers started putting chatbots inside plush toys and robots that hold real conversations. Mattel announced a partnership with OpenAI, and parents
    went searching for what AI toys are and whether they are safe.
  term: ai toys
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/ai-toys/ai-toys.csv
ed052p:
  type: pp_cagr
  title: 'What growth can the AI toys

    market realistically expect?'
  lead: ''
  condition: To hit this growth, the market must prove its talking toys are safe and private for children and earn parents’ trust, and keep kids playing
    after the first weeks so the toys do not end up forgotten in a drawer.
  note:
  - We compared forecasts from Market.us, Credence Research, Technavio and SNS Insider and adjusted each one to our market
  - We then built a realistic range from these forecasts, and you will find all the sources we used at the end of the report
  size: 2.8
  cagr: 18
  y0: 2026
