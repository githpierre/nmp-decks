- id: 1C
  type: x/student_use_ai_homework_jumped
  section: Market opportunity
  title: 'The biggest in vivo CAR-T deal

    jumped from $1.44B to $7B'
  vbars:
  - 1.44
  - 7
  t:
    8: SIGNAL
    12: $7B
    13: $1.44B
    11: In January 2024, AbbVie’s deal with Umoja was worth up to $1.44 billion, the most anyone had put on an in vivo CAR-T platform. In April 2026, Lilly agreed to pay up to $7 billion for Kelonia, almost five times more. In between, AbbVie paid up to $2.1 billion for Capstan. Pharma now pays platform prices before late-stage data, so a startup with early human results can sell for billions.
  note: Values are the maximum announced in each deal, milestones included. Data comes from AbbVie and Lilly press releases
- id: 2A
  type: kpis
  section: Market opportunity
  title: 'Kelonia’s one-time infusion worked

    in all 18 myeloma patients treated'
  items:
  - label: Myeloma patients treated with KLN-1010, one infusion each, with no cell harvest
    value: '18'
  - label: Of them responded, with no cancer found in their bone marrow a month later
    value: 100%
  - label: Of the 6 patients followed 4 months or more reached a stringent complete response
    value: 67%
  why: This is a strong signal because it is the cleanest first readout of any in vivo CAR-T so far, and it came weeks before Lilly agreed to buy Kelonia for up to $7 billion.
  note:
  - Data comes from Kelonia’s ASCO 2026 interim results (cutoff April 21, 2026), reported by Fierce Biotech and pharmaphorum
  pill: SIGNAL
- id: 2B
  type: x/student_use_ai_homework_jumped
  section: Growth drivers
  title: 'Kelonia’s trial grew from 4

    to 18 treated patients in 5 months'
  vbars:
  - 4
  - 18
  t:
    8: ''
    12: '18'
    13: '4'
    11: Kelonia first showed KLN-1010 data on 4 myeloma patients at ASH in December 2025. By the ASCO 2026 data cutoff in April, 18 patients had been treated, and all of them had responded. A larger cohort with the same result makes it much less likely that the first signal was luck, and it gives buyers and doctors a dataset they can start to trust.
  note: Data comes from Kelonia’s ASH 2025 and ASCO 2026 presentations, reported by Fierce Biotech
- id: 3A
  type: kpis
  section: Growth drivers
  title: 'In vivo CAR-T cleared harmful B cells

    in all 16 patients with nerve diseases'
  items:
  - label: Patients with refractory neurologic autoimmune diseases, such as myasthenia gravis
    value: '16'
  - label: Of them reached complete B-cell depletion, the effect behind the immune reset
    value: 100%
  why: 'It matters because it is the first neurologic cohort: in vivo CAR-T now reaches beyond blood cancers to chronic autoimmune diseases with far more patients.'
  note:
  - Data comes from a report of 16 patients published in the New England Journal of Medicine in September 2026
- id: 4A
  type: x/student_use_ai_homework_jumped
  section: Market challenges
  title: 'Only 1 of 4 ESO-T01 patients was

    still in remission after 15 months'
  vbars:
  - 4
  - 1
  t:
    8: ''
    12: 1 of 4
    13: 4 of 4
    11: All four myeloma patients treated with ESO-T01 first responded to a single infusion. In the follow-up published in Nature Medicine in October 2026, only one was still in stringent complete response 15 months later. The CAR-T cells made in the body did not last long enough in most patients, which makes durability the main question for the whole field, beyond this one program.
  note: Data comes from the extended follow-up of the four ESO-T01 patients, published in Nature Medicine in October 2026
- id: 4B
  type: kpis
  section: Market challenges
  title: 'ESO-T01 worked fast, but its effect

    faded in 3 of 4 patients'
  items:
  - label: Myeloma patients treated with one infusion of ESO-T01 in the first study
    value: '4'
  - label: Of them responded at first, with no cell harvest and no chemotherapy
    value: 100%
  - label: Patient was still in stringent complete response after 15 months
    value: 1 of 4
    down: true
  why: 'It matters because quick responses are not enough: CAR-T cells made in the body must last, and persistence is now the main technical risk of the field.'
  note:
  - Data comes from the extended follow-up published in Nature Medicine in October 2026
- id: 5A
  type: kpis
  section: Tech and infra
  title: 'ESO-T01 kept CAR genes out of other

    cells: under 1% went off target'
  items:
  - label: Of non-T immune cells carried the CAR at most, and most samples showed none
    value: <1%
  - label: Myeloma patients in the study, followed for up to 15 months
    value: '4'
  why: It matters because delivery to the right cells is the core technical bottleneck of in vivo CAR-T, and this is early human proof that it can be engineered.
  note:
  - Data comes from the ESO-T01 Phase 1 data published in Nature Medicine in 2026
