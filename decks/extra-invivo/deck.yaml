slides:
- id: 5A
  type: kpis
  section: Tech and infra
  title: 'ESO-T01 hit its target: under 1%

    of the CAR went to the wrong cells'
  items:
  - label: Of non-T immune cells carried the CAR at most, and most samples showed none
    value: <1%
  - label: Myeloma patients in the study, followed for up to 15 months
    value: '4'
  why: It matters because delivery to the right cells is the core technical bottleneck of in vivo CAR-T, and this is early human proof that it can be engineered.
  note:
  - Data comes from the ESO-T01 Phase 1 data published in Nature Medicine in 2026
- id: 1D
  type: x/sig_dominance
  section: Investor bets
  vbars:
  - 7.0
  - 7.35
  title: 'Lilly paid almost as much for Kelonia

    as for the five other buyouts combined'
  t:
    8: $7B
    9: 'Lilly for Kelonia

      April 2026'
    11: $7.35B
    12: 'Five other buyouts

      combined, 2025-2026'
    15: 95%
    16: WHY IT IS STRIKING
    17: 'Lilly agreed to pay up to $7 billion for Kelonia, a lentiviral in vivo CAR-T maker with data on 18 patients.


      The five other buyouts of in vivo CAR-T startups, from EsoBiotec to Orna, add up to $7.35 billion together.


      One deal now sets the price of the whole field, and every startup with human data is measured against it.'
  note: 'Maximum announced values, milestones included: Kelonia $7B (Lilly), Orna $2.4B (Lilly), Capstan $2.1B (AbbVie), Orbital $1.5B (BMS), EsoBiotec $1B (AstraZeneca), Interius $350M (Kite). Sources: buyers’ press releases'
- id: 4C
  type: x/sig_announced_vs_built
  section: Market challenges
  vbars:
  - 4
  - 1
  title: 'All 4 ESO-T01 patients responded, but

    15 months later only 1 was still in remission'
  t:
    8: '4'
    9: 'Responded

      after one infusion'
    11: '1'
    12: 'Still in remission

      after 15 months'
    15: 1 of 4
    16: WHAT IS GOING ON
    17: 'ESO-T01 makes BCMA CAR-T cells inside the body with one infusion, with no cell harvest and no chemotherapy first.


      All four myeloma patients of the first study responded. In the follow-up published in Nature Medicine, only one was still in stringent complete response after 15 months.'
  note: Data comes from the extended follow-up of the four ESO-T01 patients, published in Nature Medicine in October 2026
