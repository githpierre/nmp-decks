ed007p:
  type: pp_radar
  title: 'Who Is in the space economy,

    and who is not part of it?'
  TL:
    name: Airbus
    src: ../../assets/logos/pp_live/space-economy/s01-00.png
    text: builds satellites and co-owns the maker of Ariane rockets, but commercial jets bring in over 70% of its revenue
  TR:
    name: Uber
    src: ../../assets/logos/pp_live/space-economy/s01-02.png
    text: could not route a single ride without GPS satellites, but it only uses that signal to sell rides and food deliveries
  BL:
    name: Starcloud
    src: ../../assets/logos/pp_live/space-economy/s01-10.png
    text: put an Nvidia H100 in orbit to build data centers in space, which makes it half satellite operator, half AI cloud
  BR:
    name: Tomorrow.io
    src: ../../assets/logos/pp_live/space-economy/s01-11.png
    text: now runs its own constellation of weather satellites, but it makes its money selling forecasts through software
  caption:
  - Distance to the center reflects how much revenue comes from building, launching or operating space assets and their data
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
