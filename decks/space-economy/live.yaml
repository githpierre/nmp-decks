ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people want to know

    what the space economy is worth'
  date: Lately.
  expl: Space stopped being only about astronauts. SpaceX launched almost every other day, Starlink reached millions of homes, and countries poured money
    into space defense. People started to see space as a real economy, and searched what it is worth.
  term: space economy
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/space-economy/space-economy.csv
ed052p:
  type: pp_cagr
  title: 'Is the space economy

    still growing fast?'
  lead: ''
  condition: Yes, but the market must scale satellite broadband, direct-to-device phones, and commercial stations while launch costs keep falling. It also
    needs steady government budgets and wider use of Earth-imagery analytics, without major failures, strict regulation, or debris events that stall deployments.
  note:
  - We applied the realistic 8% CAGR of the previous slide to our estimate of $575B for the market today
  - Rates of 10% and 5% would give about $1.49T and $0.94T in 2036, with all the sources at the end of the report
  size: 575
  cagr: 8
  y0: 2026
