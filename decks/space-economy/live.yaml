ed142p:
  title: 'What are the biggest

    threats to space economy?'
  events:
  - odds: 50
    impact: 3
    text: SpaceX Starlink and Starship pricing undercut rivals, so smaller launch and satellite startups cannot compete
  - odds: 40
    impact: 2
    text: Golden Dome and Space Force contracts flow mostly to SpaceX, Lockheed and Northrop, leaving startups out
  - odds: 35
    impact: 3
    text: NASA budget cuts proposed by the White House cancel science missions and commercial station contracts
  - odds: 25
    impact: 2
    text: The FCC and ITU slow spectrum approvals, delaying Amazon Leo and other broadband constellations
  - odds: 25
    impact: 2
    text: SpaceX shares fall back below the $135 IPO price, so investors shun space startups trying to raise
  - odds: 20
    impact: 2
    text: A Starship or Falcon 9 failure grounds launches for months and delays hundreds of customer payloads
  - odds: 12
    impact: 1
    text: Space insurers exit the market after big satellite losses, making coverage for new missions unaffordable
  - odds: 6
    impact: 3
    text: A large debris collision in low Earth orbit forces operators to pause launches and raise insurance costs
  note:
  - We listed the events that could slow space economy down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
