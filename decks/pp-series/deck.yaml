- type: pp_radar
  pill: MARKET MAP
  label: ''
  title: 'What is actually included

    in the AI marketing market?'
  caption:
  - Distance to the center reflects how much AI does the marketing work itself, rather than help with general tasks
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
  - ../../assets/logos/pp/ai-marketing__jasper.png
  - ../../assets/logos/pp/ai-marketing__typeface.png
  - ../../assets/logos/pp/ai-marketing__persado.png
  - ../../assets/logos/pp/ai-marketing__adcreativeai.png
  - ../../assets/logos/pp/ai-marketing__omneky.png
  - ../../assets/logos/pp/ai-marketing__anyword.png
  - ../../assets/logos/pp/ai-marketing__optimove.png
  - ../../assets/logos/pp/ai-marketing__writesonic.png
  TL:
    src: ../../assets/logos/pp/ai-marketing__gong.png
    name: Gong
    text: analyzes sales calls and coaches revenue teams, but does not plan or execute marketing campaigns for customers
  TR:
    src: ../../assets/logos/pp/ai-marketing__havas.png
    name: Havas
    text: sells advertising and communications agency services to brands, not a standalone AI marketing software platform
  BL:
    src: ../../assets/logos/pp/ai-marketing__hubspot.png
    name: HubSpot
    text: offers AI marketing campaigns inside a CRM suite that also covers sales, service, and customer operations
  BR:
    src: ../../assets/logos/pp/ai-marketing__canva.png
    name: Canva
    text: offers AI ad creative tools to marketers, but its broader design platform serves students and general users
- type: pp_radar
  pill: MARKET MAP
  label: ''
  title: 'Which companies really belong

    in radiopharmaceuticals?'
