- label: AI MARKETING
  type: pp_cagr
  section: Market size
  title: 'What will the AI marketing

    market be worth by 2036?'
  size: 38
  cagr: 20
  lead: 'To be worth that much, '
  condition: the market must move from writing copy to running whole campaigns that marketers trust with budgets. It must also prove lower cost per sale than human teams, not just more content.
  note: We compared forecasts from Grand View Research, The Business Research Company, Ken Research, and MarketsandMarkets, adjusted each one to our definition, and built a realistic range
- label: RADIOPHARMACEUTICALS
  type: pp_cagr
  section: Market size
  title: 'How much bigger can

    radiopharmaceuticals get?'
  size: 11
  cagr: 12
  lead: 'To get that big, '
  condition: the market must secure enough isotopes like lutetium and actinium to treat patients at scale. It must also build the hospital teams and delivery networks to give these short-lived drugs on
    time.
  note: We compared forecasts from MarketsandMarkets, Polaris Market Research, IMARC Group, and Market.us, adjusted each one to our definition, and built a realistic range
- label: CROSS-BORDER PAYMENTS
  type: pp_cagr
  section: Market size
  title: 'Is the cross-border payments

    market still growing fast?'
  size: 160
  cagr: 7
  lead: 'Yes, but '
  condition: the market must move business payments from slow correspondent banking to instant rails and stablecoin settlement, and still earn a margin as FX spreads keep shrinking for every corporate client.
  note: We compared forecasts from Fortune Business Insights, Polaris Market Research, Allied Market Research, and Market Research (HHeuristics), adjusted each one to our definition, and built a realistic
    range
- label: LOW-CARBON CEMENT
  type: pp_cagr
  section: Market size
  title: 'How much room is left for

    low-carbon cement to grow?'
  size: 40
  cagr: 9
  lead: 'To fill that room, '
  condition: building codes must accept new cements, and builders must pay a small premium for them. Producers must also secure enough clay, slag and clean power to make them at scale.
  note: We compared forecasts from The Business Research Company, IMARC, Fortune Business Insights and DataM Intelligence, adjusted each one to our definition, and built a realistic range
- label: METAL 3D PRINTING
  type: pp_cagr
  section: Market size
  title: 'How much bigger can

    metal 3D printing get?'
  size: 7
  cagr: 15
  lead: 'To get that big, '
  condition: printed parts must move from prototypes and small batches to qualified series production. Printers must also get faster and cheaper, so a printed part beats a cast or machined one on cost.
  note: We compared forecasts from The Business Research Company, AM Research, Lucintel and Wohlers Associates, adjusted each one to our definition, and built a realistic range
