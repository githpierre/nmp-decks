    odds: 20
    impact: 2
  - text: A viral AI ad campaign with false claims leads the FTC to fine both brand and vendor
    odds: 10
    impact: 2
  - text: AI answers in ChatGPT and Gemini cut website traffic, so SEO and content tools lose buyers
    odds: 35
    impact: 2
  - text: Marketing budgets shrink in a US recession and CMOs cut new AI tools before core platforms
    odds: 15
    impact: 1
  - text: Courts rule against AI firms in copyright cases, so generated images and copy carry new legal risk
    odds: 12
    impact: 2
