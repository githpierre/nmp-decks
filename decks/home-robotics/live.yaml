ed142p:
  title: 'What are the biggest

    threats to home robots?'
  events:
  - odds: 35
    impact: 2
    text: A price war in robot mowers and pool cleaners hits Maytronics and forces many makers to close
  - odds: 30
    impact: 3
    text: Chore humanoids like NEO and Figure 03 fail to work at home, and investors abandon the category
  - odds: 25
    impact: 3
    text: Ecovacs, Roborock and Dreame dominate mowers and pool robots and squeeze smaller home robot startups
  - odds: 20
    impact: 2
    text: The US blocks Chinese home robots through tariffs or a ban after its robotics probe
  - odds: 15
    impact: 1
    text: Two wet springs in a row cut robot mower sales at Husqvarna and smaller makers
  - odds: 10
    impact: 2
    text: A large battery fire recall of robot mowers or pool cleaners hits Aiper, Wybotics or peers
  - odds: 8
    impact: 2
    text: Hackers take over thousands of home robots through a shared cloud flaw, exposing cameras inside homes
  - odds: 5
    impact: 2
    text: Reports reveal home robots like NEO secretly run by remote workers, and buyers fear for privacy
  note:
  - We listed the events that could slow home robotics down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
