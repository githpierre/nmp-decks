ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people ask when

    a home robot will fold their laundry'
  date: Lately.
  expl: Humanoid robot demos for the home were everywhere, and some companies opened pre-orders. People started wondering when a robot will fold their laundry,
    and what it will cost.
  term: home robotics
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/home-robotics/home-robotics.csv
ed052p:
  type: pp_cagr
  title: 'How much bigger

    can this market get?'
  lead: ''
  condition: To get that big, robot mowers must keep replacing petrol mowers in Europe and win over US lawns, while pool robots spread from 28% of pools
    to most of them. It must also see the first chore robots reach paying homes in volume, at a price far below today’s $20,000.
  note:
  - We compared forecasts from CIC, Global Industry Analysts, Technavio and GMI with IDC unit forecasts
  - We allowed for falling prices to build a realistic range, and all our sources are at the end of the report
  size: 5.8
  cagr: 15
  y0: 2026
