ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'The query direct to cell satellite is

    more and more popular on Google'
  date: Recently.
  expl: Phones started connecting straight to satellites, with no dish and no special device. Starlink and its partners began offering text and data from
    space, and people searched how direct-to-cell works.
  term: satellite communication
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/satellite-communication/satellite-communication.csv
ed052p:
  type: pp_cagr
  title: 'Where could the SATCOM

    market be in ten years?'
  lead: 'To get there, '
  condition: broadband and phone links must keep growing about 20% a year as Starlink, Amazon Leo, and AST add users, while TV revenue falls no faster a
    than today. It must also keep launch costs falling and spectrum flowing, with Starship flying often and WRC-27 opening bands for phone links.
  note:
  - We compared forecasts from Grand View, Precedence, GMI, Mordor and Novaspace, and aligned their timelines
  - We allowed for the decline of TV revenue to build a realistic range, and all our sources are at the end of the report
  size: 110
  cagr: 10
  y0: 2026
