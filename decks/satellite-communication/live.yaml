ed007p:
  type: pp_radar
  title: 'What is actually included

    in satellite communications?'
  TL:
    name: T-Mobile
    src: ../../assets/logos/pp_live/satellite-communication/s01-00.png
    text: lets its subscribers text through Starlink satellites with T- Satellite, but it owns no satellites and rents that capacity
  TR:
    name: Apple
    src: ../../assets/logos/pp_live/satellite-communication/s01-02.png
    text: has put more than $1 billion into | Globalstar for iPhone satellite messaging, but that feature is a perk to help sell iPhones
  BL:
    name: Aalyria
    src: ../../assets/logos/pp_live/satellite-communication/s01-10.png
    text: spun out of Google to route traffic across satellites, aircraft and ground links, but it sells software and moves no data
  BR:
    name: Garmin
    src: ../../assets/logos/pp_live/satellite-communication/s01-11.png
    text: sells inReach devices that text by satellite on a paid plan, but they are one line next to its watches and car devices
  caption:
  - Distance to the center reflects how much revenue comes from carrying voice and data through satellites rather than towers
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
