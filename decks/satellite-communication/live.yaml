ed142p:
  title: 'What are the biggest threats

    to satellite communications?'
  events:
  - odds: 50
    impact: 3
    text: Starlink cuts prices and scales direct to phone service, taking customers from Viasat, SES and Eutelsat
  - odds: 40
    impact: 2
    text: Amazon Leo launches fast and starts a price war that hits smaller satellite operators hard
  - odds: 35
    impact: 2
    text: Launch delays at Blue Origin and ULA push back constellations and burn startup cash
  - odds: 30
    impact: 2
    text: The FCC and ITU fail to settle spectrum fights, delaying direct to device services by AST SpaceMobile
  - odds: 25
    impact: 1
    text: Telecom carriers like AT&T and Verizon build more 5G towers and cut spending on satellite backhaul
  - odds: 25
    impact: 2
    text: European IRIS2 funding cuts or delays weaken Eutelsat OneWeb as the main Starlink alternative
  - odds: 10
    impact: 2
    text: A solar storm knocks out hundreds of satellites and insurers raise premiums across the industry
  - odds: 8
    impact: 3
    text: A collision or debris cascade in low Earth orbit destroys satellites and forces new operating limits
  note:
  - We listed the events that could slow satellite communication down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
