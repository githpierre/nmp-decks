ed007p:
  type: pp_radar
  title: 'Which companies really belong

    in digital identity verification?'
  TL:
    name: Okta
    src: ../../assets/logos/pp_live/digital-identity-verification/s01-00.png
    text: authenticates known users after onboarding, while identity verification proves who a new user is first
  TR:
    name: Cloudflare
    src: ../../assets/logos/pp_live/digital-identity-verification/s01-02.png
    text: protects networks and ~~ applications, but it does not verify government identity documents or biometrics
  BL:
    name: Mitek
    src: ../../assets/logos/pp_live/digital-identity-verification/s01-09.png
    text: sells identity verification and mobile deposit products, so only part of revenue belongs to digital identity
  BR:
    name: Entrust
    src: ../../assets/logos/pp_live/digital-identity-verification/s01-10.png
    text: owns Onfido identity verification, while most of the group also sells broader security and credential products
  caption:
  - Distance to the center reflects how central each company is to digital identity verification
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
