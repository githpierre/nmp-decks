ed148p:
  title: 'What pushed the identity verification

    market forward, year after year?'
  events:
  - year: '2004'
    text: Digital identity standards gain traction
    impact: 1.0
  - year: '2009'
    text: Smartphones normalize remote onboarding
    impact: 1.0
  - year: '2010'
    text: Online banking expands verification need
    impact: 1.0
  - year: '2012'
    text: Cloud APIs simplify identity checks
    impact: 1.0
  - year: '2014'
    text: EU eIDAS enables cross border eID
    impact: 2.5
  - year: '2015'
    text: Mobile document capture improves onboarding
    impact: 1.5
  - year: '2016'
    text: Biometric selfie checks enter fintech
    impact: 1.5
  - year: '2017'
    text: NIST modernizes digital identity guidance
    impact: 2.0
  - year: '2018'
    text: Fintech growth scales remote KYC
    impact: 1.5
  - year: '2019'
    text: Liveness becomes core fraud defense
    impact: 1.5
  - year: '2020'
    text: Pandemic forces remote onboarding
    impact: 3.0
  - year: '2020'
    text: Remote work expands identity proofing
    impact: 1.5
  - year: '2021'
    text: EU proposes digital identity wallets
    impact: 2.0
  - year: '2021'
    text: Fraud shifts toward synthetic identities
    impact: 1.5
  - year: '2022'
    text: Reusable identity gains enterprise interest
    impact: 1.0
  - year: '2022'
    text: Biometric verification spreads globally
    impact: 1.5
  - year: '2023'
    text: Onfido buys reusable identity platform
    impact: 1.5
  - year: '2023'
    text: Generative AI raises identity fraud risk
    impact: 2.0
  - year: '2024'
    text: EU digital identity regulation starts
    impact: 2.5
  - year: '2024'
    text: Entrust acquires Onfido
    impact: 1.5
  - year: '2024'
    text: EU wallet pilots mature standards
    impact: 1.5
  - year: '2024'
    text: Deepfakes raise liveness spending
    impact: 1.5
  - year: '2025'
    text: NIST publishes identity revision four
    impact: 2.0
  - year: '2025'
    text: EU wallet implementing rules advance
    impact: 1.5
  - year: '2025'
    text: Enterprises consolidate identity stacks
    impact: 1.0
  - year: '2025'
    text: Reusable credentials move toward production
    impact: 1.5
  - year: '2026'
    text: EU wallet deadline drives deployments
    impact: 2.0
  - year: '2026'
    text: NIST implementation hub supports adoption
    impact: 1.0
  - year: '2026'
    text: Deepfake pressure hardens proofing flows
    impact: 1.5
  - year: '2026'
    text: Cross border wallet acceptance expands
    impact: 1.5
  note:
  - We kept the events we believe pushed digital identity verification forward the most
  - Ratings are our estimates, with all the sources at the end of the report
