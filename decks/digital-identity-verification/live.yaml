ed052p:
  type: pp_cagr
  title: 'How fast can digital

    identity verification really grow?'
  lead: ''
  condition: To grow this fast, digital onboarding must keep expanding while providers reduce false rejects, stop synthetic identities and deepfakes, and
    meet privacy and inclusion requirements.
  note:
  - We compared forecasts from Grand View Research, MarketsandMarkets and Juniper Research
  - We adjusted each one to our market definition, and all our sources are at the end of the report
  size: 17
  cagr: 14
  y0: null
