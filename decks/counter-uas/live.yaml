ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people ask how to stop

    a drone, after drones shut down airports'
  date: Recently.
  expl: Mystery drones shut down airports in Copenhagen, Oslo and Munich, and Russian drones flew into Poland. Europe started talking about a “drone wall”.
    Suddenly, anti-drone systems were not just a military topic, and people searched how to stop them.
  term: counter uas
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/counter-uas/counter-uas.csv
ed052p:
  type: pp_cagr
  title: 'How much bigger

    can this market get?'
  lead: ''
  condition: To get that big, governments must turn today’s budget requests into real contracts, and buyers must protect thousands of bases, airports, and
    plants. Startups must also build interceptors and lasers at scale, and new rules must let police and civil sites stop drones safely.
  note:
  - We compared forecasts from MarketsandMarkets, Mordor, Coherent and Fortune Business Insights
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: 5
  cagr: 20
  y0: 2026
