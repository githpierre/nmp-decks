ed142p:
  title: 'What could go wrong

    for counter-drone?'
  events:
  - odds: 25
    impact: 3
    text: Congress cuts the $75 billion drone and counter-drone request, and stopgap budgets delay payments
  - odds: 20
    impact: 3
    text: RTX, Lockheed and Anduril win the biggest counter-drone programs and buy startups at low prices
  - odds: 20
    impact: 2
    text: Hundreds of interceptor makers, many in Ukraine, start a price war that wipes out margins for startups
  - odds: 15
    impact: 1
    text: Slow FAA and DOJ certification keeps US police and stadiums from buying counter-drone systems for years
  - odds: 10
    impact: 2
    text: A repeat of the El Paso laser airspace closure leads the FAA to curb domestic counter-drone use
  - odds: 10
    impact: 3
    text: Fiber-optic and fully autonomous drones defeat jammers and sensors, making many counter-drone products obsolete
  - odds: 8
    impact: 2
    text: The Ukraine and Middle East wars end and urgent counter-drone orders from armies slow down sharply
  - odds: 5
    impact: 2
    text: China cuts exports of magnets, batteries and chips, halting production lines at Western counter-drone makers
  note:
  - We listed the events that could slow counter uas down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
