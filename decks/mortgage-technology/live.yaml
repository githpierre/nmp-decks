ed148p:
  title: 'What pushed the mortgage technology

    market forward, year after year?'
  events:
  - year: '1968'
    text: TILA standardizes mortgage disclosures
    impact: 1.0
  - year: '1974'
    text: RESPA formalizes settlement processes
    impact: 1.0
  - year: '1975'
    text: HMDA creates mortgage data reporting
    impact: 1.0
  - year: '1985'
    text: Rock Financial starts tech-focused lending
    impact: 1.0
  - year: '1996'
    text: Mortgage in a Box simplifies applications
    impact: 1.0
  - year: '1999'
    text: RockLoans moves mortgage applications online
    impact: 2.0
  - year: '2000'
    text: E-SIGN legalizes electronic signatures
    impact: 1.5
  - year: '2002'
    text: Quicken enables mortgage e-signatures
    impact: 1.5
  - year: '2004'
    text: eMortgage standards improve interoperability
    impact: 1.0
  - year: '2008'
    text: Mortgage crisis forces compliance rebuild
    impact: 2.0
  - year: '2010'
    text: Dodd-Frank expands mortgage controls
    impact: 1.5
  - year: '2013'
    text: Ability-to-repay rules reshape underwriting
    impact: 1.5
  - year: '2015'
    text: Rocket Mortgage launches fully digital flow
    impact: 3.0
  - year: '2015'
    text: TRID digitizes disclosure coordination
    impact: 1.5
  - year: '2016'
    text: Digital verification cuts borrower paperwork
    impact: 1.5
  - year: '2017'
    text: Cloud POS platforms spread across lenders
    impact: 1.5
  - year: '2018'
    text: Appraisal alternatives lower upfront costs
    impact: 2.0
  - year: '2019'
    text: Remote notarization expands by state
    impact: 1.5
  - year: '2020'
    text: Pandemic forces remote mortgage operations
    impact: 3.0
  - year: '2020'
    text: ICE buys Ellie Mae platform
    impact: 2.0
  - year: '2021'
    text: Low rates overload lender operations
    impact: 2.0
  - year: '2022'
    text: Rate shock makes efficiency essential
    impact: 1.5
  - year: '2023'
    text: ICE acquires Black Knight
    impact: 2.0
  - year: '2024'
    text: Generative AI enters mortgage operations
    impact: 1.5
  - year: '2025'
    text: Rocket buys Redfin and Mr. Cooper
    impact: 2.0
  - year: '2025'
    text: Higher rates reward automation vendors
    impact: 1.5
  - year: '2026'
    text: White House pushes digital mortgages
    impact: 2.0
  - year: '2026'
    text: Blend Autopilot lifts closing conversion
    impact: 2.5
  - year: '2026'
    text: eNotes exceed fifty thousand monthly
    impact: 2.0
  - year: '2026'
    text: Mortgage originations recover year over year
    impact: 1.5
  note:
  - We kept the events we believe pushed mortgage technology forward the most
  - Ratings are our estimates, with all the sources at the end of the report
