ed007p:
  type: pp_radar
  title: 'Which companies really belong

    in mortgage technology?'
  TL:
    name: Zillow
    src: ../../assets/logos/pp_live/mortgage-technology/s01-00.png
    text: supports home shopping and mortgage leads, but property search remains outside mortgage technology infrastructure
  TR:
    name: Redfin
    src: ../../assets/logos/pp_live/mortgage-technology/s01-02.png
    text: is primarily a real estate brokerage and listings platform rather than mortgage lending technology software
  BL:
    name: ICE Mortgage
    src: ../../assets/logos/pp_live/mortgage-technology/s01-09.png
    text: has leading mortgage software, but it sits inside a large public exchange and financial-data company
  BR:
    name: Blend
    src: ../../assets/logos/pp_live/mortgage-technology/s01-10.png
    text: digitizes mortgage origination, while the platform also serves consumer banking and other lending products
  caption:
  - Distance to the center reflects how central each company is to mortgage technolo
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
