ed148p:
  title: 'What pushed the gene therapy

    market forward, year after year?'
  events:
  - year: '1972'
    text: Gene therapy concept enters medicine
    impact: 1.0
  - year: '1989'
    text: Marker gene enters human T cells
    impact: 1.0
  - year: '1990'
    text: ADA trial launches human gene therapy
    impact: 2.0
