    text: SCID leukemia exposes insertional risk
    impact: 1.0
  - year: '2003'
    text: China approves first commercial gene therapy
    impact: 1.5
  - year: '2012'
    text: Glybera wins first Western approval
    impact: 2.0
  - year: '2016'
    text: Strimvelis validates ex vivo correction
    impact: 1.5
  - year: '2017'
    text: Luxturna proves in vivo gene replacement
    impact: 3.0
  - year: '2017'
    text: CAR-T approvals validate gene-modified cells
    impact: 2.0
  - year: '2019'
    text: Zolgensma scales systemic AAV delivery
    impact: 3.0
  - year: '2020'
    text: Libmeldy validates stem-cell gene therapy
    impact: 1.5
  - year: '2022'
    text: Hemgenix validates hemophilia gene therapy
    impact: 2.0
  - year: '2022'
    text: Roctavian reaches hemophilia A patients
    impact: 1.5
  - year: '2022'
    text: Upstaza validates direct brain delivery
    impact: 1.5
  - year: '2023'
    text: Elevidys accelerates Duchenne gene therapy
    impact: 2.0
  - year: '2023'
    text: Casgevy validates CRISPR therapy
    impact: 2.5
  - year: '2023'
    text: Lyfgenia expands sickle cell gene therapy
    impact: 1.5
  - year: '2024'
    text: Elevidys gains traditional approval
    impact: 1.5
  - year: '2024'
    text: Beqvez adds hemophilia B competition
    impact: 1.0
  - year: '2024'
    text: Kebilidi expands brain gene therapy
    impact: 1.0
  - year: '2025'
    text: Elevidys deaths trigger tougher AAV scrutiny
    impact: 0.5
  - year: '2025'
    text: Itvisma extends SMA gene therapy choice
    impact: 1.0
  - year: '2025'
    text: Skysona cancer warning sharpens surveillance
    impact: 0.5
  - year: '2026'
    text: Roctavian withdrawal tests commercial models
    impact: 0.5
  - year: '2026'
    text: Otarmeni restores hearing with dual AAV
    impact: 2.0
  - year: '2026'
    text: Casgevy expands to age two
    impact: 2.0
  - year: '2026'
    text: Kresladi adds another stem-cell therapy
    impact: 1.0
  - year: '2026'
    text: Zolgensma cancer signal forces monitoring
    impact: 0.5
  - year: '2026'
    text: Priority review accelerates rare gene therapy
    impact: 1.5
  note:
  - We kept the events we believe pushed gene therapy forward the most
  - Ratings are our estimates, with all the sources at the end of the report
