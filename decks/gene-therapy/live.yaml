ed007p:
  type: pp_radar
  title: 'Which companies really

    belong in gene therapy?'
  TL:
    name: Alnylam
    src: ../../assets/logos/pp_live/gene-therapy/s01-00.png
    text: uses RNA interference to silence genes without introducing or permanently modifying therapeutic genetic material
  TR:
    name: 23andMe
    src: ../../assets/logos/pp_live/gene-therapy/s01-02.png
    text: provides consumer genetic ~~ information and research services but does not deliver therapeutic genetic material
  BL:
    name: Eli Lilly
    src: ../../assets/logos/pp_live/gene-therapy/s01-09.png
    text: has acquired gene editing and delivery platforms, but gene therapy remains a small part of its portfolio
  BR:
    name: Roche
    src: ../../assets/logos/pp_live/gene-therapy/s01-10.png
    text: owns Spark and gene therapy assets, while most pharmaceutical revenue comes from non gene therapy products
  caption:
  - Distance to the center reflects how central each company is to gene therapy
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
