ed007p:
  type: pp_radar
  title: 'Who Is in Web3 infrastructure,

    and who stays outside?'
  TL:
    name: MetaMask
    src: ../../assets/logos/pp_live/web3-infrastructure/s01-00.png
    text: is a consumer wallet and dapp gateway, not primarily infrastructure sold to teams building blockchain apps
  TR:
    name: OpenSea
    src: ../../assets/logos/pp_live/web3-infrastructure/s01-02.png
    text: is a consumer NFT marketplace, not developer infrastructure for operating nodes, APIs or blockchains
  BL:
    name: Consensys
    src: ../../assets/logos/pp_live/web3-infrastructure/s01-09.png
    text: owns infrastructure products such as Infura, while also operating wallets and broader Web3 software
  BR:
    name: Chainlink
    src: ../../assets/logos/pp_live/web3-infrastructure/s01-10.png
    text: provides oracle infrastructure to developers, but its decentralized networks also function as token protocols
  caption:
  - Distance to the center reflects how central each company is to Web3 infrastructure
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
  - ../../assets/logos/pp_live/web3-infrastructure/s01-01.png
