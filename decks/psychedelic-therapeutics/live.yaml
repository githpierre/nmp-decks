ed148p:
  title: 'What pushed the psychedelic therapeutics

    market forward, year after year?'
  events:
  - year: '1912'
    text: Merck synthesizes MDMA
    impact: 0.5
  - year: '1938'
    text: Hofmann synthesizes LSD-25
    impact: 1.0
  - year: '1943'
    text: LSD effects trigger scientific interest
    impact: 1.0
  - year: '1950'
    text: Psychiatry begins therapeutic LSD studies
    impact: 1.5
  - year: '1958'
    text: Psilocybin enters modern research
    impact: 1.0
  - year: '1960'
    text: Psychedelic psychotherapy spreads clinically
    impact: 1.0
  - year: '1970'
    text: US scheduling freezes psychedelic research
    impact: 0.5
  - year: '1985'
    text: DEA schedules MDMA
    impact: 0.5
  - year: '1986'
    text: MAPS organizes MDMA drug development
    impact: 1.0
  - year: '1994'
    text: Modern US psychedelic trials restart
    impact: 1.5
  - year: '2006'
    text: Psilocybin study revives mainstream science
    impact: 2.0
  - year: '2011'
    text: Psilocybin targets cancer distress
    impact: 1.0
  - year: '2016'
    text: Cancer trials show anxiety relief
    impact: 2.0
  - year: '2016'
    text: FDA allows MDMA Phase 3
    impact: 2.0
  - year: '2017'
    text: FDA grants MDMA breakthrough status
    impact: 2.5
  - year: '2018'
    text: Psilocybin earns breakthrough designation
    impact: 2.5
  - year: '2019'
    text: Commercial psychedelic biotech funding surges
    impact: 1.5
  - year: '2020'
    text: Oregon legalizes supervised psilocybin
    impact: 1.5
  - year: '2021'
    text: Psilocybin depression trials scale up
    impact: 1.5
  - year: '2022'
    text: Colorado broadens legal psychedelic access
    impact: 1.0
  - year: '2023'
    text: FDA issues psychedelic trial guidance
    impact: 3.0
  - year: '2023'
    text: MDMA Phase 3 reports durable benefit
    impact: 2.0
  - year: '2024'
    text: FDA advisory review exposes trial weaknesses
    impact: 1.0
  - year: '2024'
    text: MDMA rejection resets evidence standards
    impact: 1.0
  - year: '2025'
    text: Psychedelic trials adopt cleaner designs
    impact: 1.0
  - year: '2026'
    text: Executive order speeds psychedelic reviews
    impact: 2.0
  - year: '2026'
    text: FDA finalizes psychedelic trial guidance
    impact: 2.0
  - year: '2026'
    text: VA launches MDMA veteran trial
    impact: 1.5
  - year: '2026'
    text: VA launches psilocybin depression trial
    impact: 1.5
  - year: '2026'
    text: Compass files psilocybin NDA
    impact: 2.0
  note:
  - We kept the events we believe pushed psychedelic therapeutics forward the most
  - Ratings are our estimates, with all the sources at the end of the report
