ed007p:
  type: pp_radar
  title: 'Which companies really belong

    in psychedelic therapeutics?'
  TL:
    name: Axsome
    src: ../../assets/logos/pp_live/psychedelic-therapeutics/s01-00.png
    text: develops conventional psychiatric medicines without psychedelic compounds or psychedelic related mechanisms
  TR:
    name: Headspace
    src: ../../assets/logos/pp_live/psychedelic-therapeutics/s01-02.png
    text: provides meditation and ~~ mental health services but does not develop psychedelic compounds as medicines
  BL:
    name: Johnson & Johnson
    src: ../../assets/logos/pp_live/psychedelic-therapeutics/s01-09.png
    text: markets esketamine for depression, but dissociative therapy is one small part of a broad pharma business
  BR:
    name: Otsuka
    src: ../../assets/logos/pp_live/psychedelic-therapeutics/s01-10.png
    text: entered psychedelic drug development through acquisitions, while most revenue comes from conventional medicines
  caption:
  - Distance to the center reflects how central each company is to psychedelic therapeutics
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
