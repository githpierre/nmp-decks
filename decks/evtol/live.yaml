ed007p:
  type: pp_radar
  title: 'What Is actually included

    in the eVTOL market?'
  TL:
    name: Electra
    src: ../../assets/logos/pp_live/evtol/s01-00.png
    text: builds short takeoff aircraft, not vertical takeoff aircraft, despite serving similar mobility routes
  TR:
    name: Delta Air Lines
    src: ../../assets/logos/pp_live/evtol/s01-02.png
    text: may partner with air taxi developers, but it is an airline operator and does not build electric VTOL aircraft
  BL:
    name: Honeywell Aerospace
    src: ../../assets/logos/pp_live/evtol/s01-09.png
    text: supplies eVTOL avionics and propulsion components, but it does not primarily develop complete eVTOL aircraft
  BR:
    name: Wisk Aero
    src: ../../assets/logos/pp_live/evtol/s01-10.png
    text: develops autonomous passenger eVTOL aircraft, but it now Operates as a wholly owned Boeing company
  caption:
  - Distance to the center reflects how central each company is to eVTOL
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
  - ../../assets/logos/pp_live/evtol/s01-01.png
