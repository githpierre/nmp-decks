ed148p:
  title: 'What pushed the eVTOL market

    forward, year after year?'
  events:
  - year: '2010'
    text: Electric propulsion improves aircraft design
    impact: 1.0
  - year: '2013'
    text: Distributed propulsion expands VTOL concepts
    impact: 1.0
  - year: '2015'
    text: Urban mobility attracts aerospace teams
    impact: 1.0
  - year: '2016'
    text: Uber Elevate popularizes air taxis
    impact: 1.5
  - year: '2017'
    text: Full-scale eVTOL prototypes begin flying
    impact: 2.0
  - year: '2018'
    text: Vahana validates distributed electric VTOL
    impact: 1.5
  - year: '2019'
    text: EASA creates SC-VTOL framework
    impact: 2.5
  - year: '2019'
    text: Air taxi orders start accumulating
    impact: 1.0
  - year: '2020'
    text: SPAC capital floods eVTOL sector
    impact: 1.5
  - year: '2021'
    text: CAAC accepts EH216-S certification
    impact: 2.0
  - year: '2021'
    text: FAA deepens powered-lift rulemaking
    impact: 1.5
  - year: '2022'
    text: CAAC issues EH216-S special conditions
    impact: 1.5
  - year: '2022'
    text: Battery suppliers target aviation cells
    impact: 1.0
  - year: '2023'
    text: EHang wins first eVTOL type certificate
    impact: 3.0
  - year: '2023'
    text: Certified EHang aircraft reaches customer
    impact: 2.0
  - year: '2024'
    text: EHang gains production certificate
    impact: 2.0
  - year: '2024'
    text: FAA finalizes Archer airworthiness criteria
    impact: 2.0
  - year: '2024'
    text: FAA finalizes powered-lift operating rules
    impact: 2.5
  - year: '2024'
    text: Vertiport planning spreads globally
    impact: 1.0
  - year: '2025'
    text: EHang operators gain operating certificates
    impact: 2.0
  - year: '2025'
    text: Eve full-scale prototype first flies
    impact: 2.0
  - year: '2025'
    text: Certification programs enter final testing
    impact: 1.5
  - year: '2025'
    text: Defense interest broadens eVTOL demand
    impact: 1.5
  - year: '2026'
    text: Joby FAA-conforming aircraft flies
    impact: 2.0
  - year: '2026'
    text: Eve completes low-speed flight block
    impact: 2.0
  - year: '2026'
    text: EASA updates VTOL compliance means
    impact: 1.5
  - year: '2026'
    text: Vertical opens certification assembly center
    impact: 1.5
  - year: '2026'
    text: Eve expands global certification path
    impact: 1.5
  - year: '2026'
    text: US pilot program enables early operations
    impact: 2.0
  - year: '2026'
    text: Regulators converge on operating frameworks
    impact: 2.0
  note:
  - We kept the events we believe pushed evtol forward the most
  - Ratings are our estimates, with all the sources at the end of the report
