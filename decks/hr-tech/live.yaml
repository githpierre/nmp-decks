ed007p:
  type: pp_radar
  title: 'What Is actually included

    in the HR tech market?'
  TL:
    name: LinkedIn
    src: ../../assets/logos/pp_live/hr-tech/s01-00.png
    text: recruiting is important to LinkedIn, but its core business is a professional network and advertising platform
  TR:
    name: Microsoft
    src: ../../assets/logos/pp_live/hr-tech/s01-02.png
    text: office and collaboration tools support employees but do not constitute a dedicated HR management platform
  BL:
    name: SAP
    src: ../../assets/logos/pp_live/hr-tech/s01-09.png
    text: successFactors is major HR software, while SAP earns most revenue from a much broader enterprise stack
  BR:
    name: Workday HR
    src: ../../assets/logos/pp_live/hr-tech/s01-10.png
    text: is central, but the listed company also has major finance and enterprise planning product lines
  caption:
  - Distance to the center reflects how central each company is to HR tech
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
