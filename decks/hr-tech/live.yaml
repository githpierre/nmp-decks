ed148p:
  title: 'What pushed the HR tech market

    forward, year after year?'
  events:
  - year: '1978'
    text: Payroll software digitizes HR administration
    impact: 1.5
  - year: '1990'
    text: HRIS centralizes employee records
    impact: 2.0
  - year: '1998'
    text: Online job boards scale recruiting
    impact: 2.0
  - year: '2003'
    text: LinkedIn builds professional identity graph
    impact: 2.0
  - year: '2006'
    text: Cloud HR lowers deployment friction
    impact: 1.5
  - year: '2010'
    text: Mobile apps reach employees directly
    impact: 1.0
  - year: '2012'
    text: People analytics enters executive planning
    impact: 1.5
  - year: '2014'
    text: Video interviewing scales remote screening
    impact: 1.0
  - year: '2015'
    text: Continuous feedback challenges annual reviews
    impact: 1.5
  - year: '2017'
    text: Employee experience becomes software category
    impact: 1.5
  - year: '2018'
    text: Skills platforms reshape talent planning
    impact: 1.5
  - year: '2020'
    text: Covid forces remote HR operations
    impact: 3.0
  - year: '2020'
    text: Mass layoffs expose workforce planning gaps
    impact: 1.5
  - year: '2021'
    text: Labor shortages boost recruiting automation
    impact: 2.0
  - year: '2021'
    text: Remote hiring expands candidate pools
    impact: 1.5
  - year: '2022'
    text: Generative AI reaches HR workflows
    impact: 2.0
  - year: '2022'
    text: Pay transparency rules spread
    impact: 1.5
  - year: '2023'
    text: NYC enforces hiring AI audits
    impact: 2.5
  - year: '2023'
    text: Recruiting copilots enter major platforms
    impact: 2.0
  - year: '2024'
    text: EU AI Act labels hiring high risk
    impact: 2.5
  - year: '2024'
    text: EEOC highlights algorithm discrimination risk
    impact: 1.5
  - year: '2024'
    text: Skills based hiring gains momentum
    impact: 1.5
  - year: '2025'
    text: AI automates recruiter routine work
    impact: 2.0
  - year: '2025'
    text: HR suites add agentic workflows
    impact: 2.0
  - year: '2025'
    text: Talent leaders redesign AI hiring funnels
    impact: 1.5
  - year: '2026'
    text: Workday launches HR autopilot agents
    impact: 2.0
  - year: '2026'
    text: LinkedIn reframes recruiter roles around AI
    impact: 1.5
  - year: '2026'
    text: EU sets high risk employment timeline
    impact: 2.0
  - year: '2026'
    text: NYC expands scrutiny of employment algorithms
    impact: 1.0
  - year: '2026'
    text: HR AI shifts from copilots to agents
    impact: 2.0
  note:
  - We kept the events we believe pushed hr tech forward the most
  - Ratings are our estimates, with all the sources at the end of the report
