- label: ORDER-TO-CASH
  type: pp_risks
  section: Market challenges
  title: What are the biggest threats to the order-to-cash automation market?
  events:
  - text: ERP giants SAP and Oracle deepen native receivables automation, making separate order-to-cash platforms harder to justify
    odds: 55
    impact: 3
  - text: EU e-invoicing timelines slip or fragment by country, delaying enterprise projects that depend on one harmonized standard
    odds: 35
    impact: 2
  - text: AI collection agents trigger privacy or employment rules that force vendors to add costly human review and call controls
    odds: 35
    impact: 2
  - text: A recession raises customer defaults so sharply that finance teams prioritize credit losses over automation transformations
    odds: 40
    impact: 3
  - text: Visa and banks automate invoice payments directly, reducing the value of standalone portals that mainly move approved cash
    odds: 40
    impact: 2
  - text: Large buyers keep supplier portals and bespoke workflows, blocking end-to-end automation across fragmented enterprise stacks
    odds: 55
    impact: 2
  - text: A major autonomous-collections failure misroutes payments or contacts customers wrongly, slowing adoption of agentic finance
    odds: 30
    impact: 2
  - text: CFOs cut software vendors and demand suites, forcing order-to-cash specialists to compete against broader finance platforms
    odds: 50
    impact: 2
  note:
  - We listed the events that could slow order-to-cash automation down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and you will find all the sources we used at the end of the report
