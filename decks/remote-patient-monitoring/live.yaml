ed148p:
  title: 'What pushed the remote patient monitoring

    market forward, year after year?'
  events:
  - year: '2008'
    text: Connected home devices become practical
    impact: 1.0
  - year: '2010'
    text: Smartphones normalize continuous connectivity
    impact: 1.0
  - year: '2013'
    text: Bluetooth medical devices proliferate
    impact: 1.0
  - year: '2015'
    text: Value-based care rewards fewer admissions
    impact: 1.5
  - year: '2017'
    text: CMS creates remote monitoring payment path
    impact: 2.0
  - year: '2018'
    text: Medicare begins broad RPM coverage
    impact: 3.0
  - year: '2019'
    text: New CPT codes pay RPM workflows
    impact: 2.5
  - year: '2019'
    text: Medicare RPM use starts accelerating
    impact: 1.5
  - year: '2020'
    text: Covid makes home monitoring essential
    impact: 3.0
  - year: '2020'
    text: CMS relaxes RPM rules during Covid
    impact: 2.0
  - year: '2021'
    text: CMS keeps key RPM flexibilities permanent
    impact: 2.0
  - year: '2021'
    text: Virtual care investment floods digital health
    impact: 1.5
  - year: '2022'
    text: Chronic care programs add more devices
    impact: 1.5
  - year: '2022'
    text: Remote therapeutic monitoring launches
    impact: 2.0
  - year: '2023'
    text: OIG flags RPM fraud schemes
    impact: 1.0
  - year: '2023'
    text: Hospitals shift more care homeward
    impact: 1.5
  - year: '2024'
    text: Medicare RPM use rises dramatically
    impact: 2.0
  - year: '2024'
    text: OIG calls for tighter RPM oversight
    impact: 1.0
  - year: '2024'
    text: Wearables improve clinical-grade sensing
    impact: 1.5
  - year: '2025'
    text: Medicare RPM payments top $500M
    impact: 2.0
  - year: '2025'
    text: OIG formalizes RPM billing safeguards
    impact: 1.0
  - year: '2025'
    text: Care platforms integrate RPM into EHRs
    impact: 1.5
  - year: '2026'
    text: CMS lowers data minimum to two days
    impact: 2.0
  - year: '2026'
    text: CMS finalizes new RPM initiation rules
    impact: 1.5
  - year: '2026'
    text: CMS delays contractor ban to 2029
    impact: 2.0
  - year: '2026'
    text: Fraud analytics target RPM outliers
    impact: 1.0
  - year: '2026'
    text: CMS considers bundled RPM payments
    impact: 1.0
  - year: '2026'
    text: Medicare recognizes broad RPM conditions
    impact: 2.0
  - year: '2026'
    text: Device costs fall as scale rises
    impact: 1.5
  - year: '2026'
    text: RPM moves toward integrated care teams
    impact: 1.5
  note:
  - We kept the events we believe pushed remote patient monitoring forward the most
  - Ratings are our estimates, with all the sources at the end of the report
