ed052p:
  type: pp_cagr
  title: 'How much bigger can

    exposure management get?'
  lead: ''
  condition: To get that big, the market must replace long vulnerability lists with a short, trusted set of fixes that teams actually close, and merge cloud,
    identity and attack-surface tools into one platform budget.
  note:
  - We compared forecasts from MarketsandMarkets, Grand View, SNS Insider and KBV Research
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
