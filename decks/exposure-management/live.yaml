ed148p:
  title: 'What pushed the exposure management

    market forward, year after year?'
  events:
  - year: '1999'
    text: CVE standardizes vulnerability tracking
    impact: 2.0
  - year: '1999'
    text: NIST ICAT makes flaws searchable
    impact: 1.5
  - year: '2000'
    text: ICAT makes vulnerability patches searchable
    impact: 1.0
  - year: '2005'
    text: NVD unifies public vulnerability information
    impact: 2.5
  - year: '2006'
    text: NVD growth makes manual tracking harder
    impact: 1.5
  - year: '2007'
    text: CVSS 2 improves scoring across tools
    impact: 1.5
  - year: '2014'
    text: Heartbleed exposes patching blindspots
    impact: 2.0
  - year: '2015'
    text: MITRE ATTACK structures adversary behavior
    impact: 2.0
  - year: '2015'
    text: CVSS 3 adds environmental risk metrics
    impact: 1.5
  - year: '2017'
    text: WannaCry punishes delayed critical patching
    impact: 2.5
  - year: '2019'
    text: CVSS 3.1 clarifies severity prioritization
    impact: 1.0
  - year: '2020'
    text: SolarWinds exposes asset visibility gaps
    impact: 2.0
  - year: '2021'
    text: CISA mandates exploited flaw fixes
    impact: 3.0
  - year: '2021'
    text: Log4Shell crisis strains vulnerability triage
    impact: 2.0
  - year: '2021'
    text: EPSS makes exploit likelihood measurable
    impact: 1.5
  - year: '2022'
    text: Tenable One consolidates exposure management
    impact: 2.5
  - year: '2022'
    text: CISA highlights routinely exploited flaws
    impact: 1.5
  - year: '2023'
    text: EPSS sharpens exploit probability forecasts
    impact: 1.5
  - year: '2024'
    text: Microsoft previews exposure management
    impact: 2.0
  - year: '2024'
    text: Microsoft launches exposure management
    impact: 2.0
  - year: '2025'
    text: Google Wiz deal validates cloud protection
    impact: 2.0
  - year: '2025'
    text: Tenable Apex expands AI exposure coverage
    impact: 1.0
  - year: '2025'
    text: Microsoft connects security exposure data
    impact: 1.5
  - year: '2025'
    text: EPSS v4 refines exploit probability rankings
    impact: 1.5
  - year: '2026'
    text: Google completes Wiz cloud security deal
    impact: 2.5
  - year: '2026'
    text: Check Point finds most alerts unactionable
    impact: 2.0
  - year: '2026'
    text: Tenable maps attack paths through lifecycles
    impact: 2.0
  - year: '2026'
    text: EPSS v5 improves exploit prediction context
    impact: 1.5
  - year: '2026'
    text: Qualys maps exploitable attack paths
    impact: 1.5
  - year: '2026'
    text: Tenable AI automates exposure asset tagging
    impact: 1.5
  note:
  - We kept the events we believe pushed exposure management forward the most
  - Ratings are our estimates, with all the sources at the end of the report
