ed052p:
  type: pp_cagr
  title: 'How much room is left for

    property management software to grow?'
  lead: 'To fill that room, '
  condition: managers must keep digitizing rent, maintenance, leasing and accounting while cloud tools remain affordable for small and large portfolios.
  note:
  - We compared forecasts from Grand View Research, The Business Research Company and Fortune Business Insights
  - We adjusted each one to our definition of the market, and all the sources we used are listed at the end of the report
