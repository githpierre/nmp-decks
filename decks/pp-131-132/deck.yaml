- label: LOW-CARBON CEMENT
  type: pp_risks
  section: Market challenges
  title: What could go wrong for low-carbon cement?
  events:
  - text: Building codes keep asking for ordinary Portland cement, and new cements stay stuck in pilot projects
    odds: 35
    impact: 3
  - text: More US grants for cement plants are cancelled, after Sublime and Brimstone lost theirs in 2025
    odds: 40
    impact: 2
  - text: The EU carbon border tax gets delayed or weakened, so high-carbon imported cement stays cheap
    odds: 25
    impact: 3
  - text: Slag and fly ash run short as coal plants close and steel mills switch to electric furnaces
    odds: 60
    impact: 2
  - text: Microsoft, Meta and Amazon cut their green building budgets and sign fewer cement deals
    odds: 25
    impact: 2
  - text: Holcim and Heidelberg scale carbon capture cement and squeeze startups out on price
    odds: 45
    impact: 2
  - text: A new cement fails in a real structure, and builders lose trust in the whole category
    odds: 10
    impact: 3
  - text: Construction slows in Europe and China, and cement makers delay new low-carbon lines
    odds: 35
    impact: 1
  note: We listed the events that could slow low-carbon cement down, then estimated how likely each one is and how hard it would hit, from company news, regulators' decisions, funding data and analyst views.
    Odds are our own estimates. All the sources are included at the end of the report.
