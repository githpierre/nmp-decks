- type: estimates
  section: Market size
  title: 'What are the market size estimates

    from different sources online?'
  rows:
  - firm: 'Grand View

      Research'
    value: $ 187 B
    comment: Their figure covers software, content, and some hardware for schools and companies. We use it as the base of our estimate.
  - firm: 'Fortune Business

      Insights'
    value: $ 189 B
    comment: Their scope is close to ours, across schools, colleges, and companies. We use it to confirm the base of our range.
  - firm: 'Markets and

      Markets'
    value: $ 197 B
    comment: Their figure adds smart classroom hardware like displays and projectors. We treat it as the upper end of our core range.
  - firm: 'IMARC

      Group'
    value: $ 280 B
    comment: Their definition is much wider, and devices and other hardware make up almost half of it. We treat it as an upper bound only.
  note:
  - We take each estimate from the firm’s website and adjust it to our scope and to its age
