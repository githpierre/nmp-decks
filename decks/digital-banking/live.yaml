ed148p:
  title: 'What pushed digital banking

    forward, year after year?'
  events:
  - year: '2009'
    text: Simple proposes branchless consumer banking
    impact: 1.0
  - year: '2012'
    text: Simple takes app banking to market
    impact: 1.5
  - year: '2014'
    text: Chime opens fee-light mobile accounts
    impact: 1.5
  - year: '2015'
    text: Atom wins UK digital bank authorization
    impact: 2.0
  - year: '2015'
    text: Revolut makes cross-currency accounts mobile
    impact: 1.5
  - year: '2016'
    text: N26 earns full German banking license
    impact: 2.0
  - year: '2016'
    text: Starling gains UK bank authorization
    impact: 1.5
  - year: '2017'
    text: Starling launches app-only current accounts
    impact: 2.0
  - year: '2017'
    text: Monzo license unlocks checking accounts
    impact: 2.0
  - year: '2017'
    text: Monzo converts prepaid users into depositors
    impact: 1.5
  - year: '2018'
    text: Starling brings mobile accounts to businesses
    impact: 2.0
  - year: '2018'
    text: Starling adds supplier payments inside app
    impact: 1.0
  - year: '2019'
    text: Starling proves platform revenue can grow
    impact: 1.0
  - year: '2020'
    text: Varo gains first US fintech bank charter
    impact: 2.5
  - year: '2020'
    text: Starling reaches break-even without branches
    impact: 2.5
  - year: '2020'
    text: Pandemic accelerates remote banking adoption
    impact: 1.5
  - year: '2021'
    text: Simple closes highlighting banking economics
    impact: 1.0
  - year: '2021'
    text: Nubank IPO validates Latin American scale
    impact: 3.0
  - year: '2021'
    text: N26 exits US exposing expansion costs
    impact: 0.5
  - year: '2022'
    text: Starling crosses three million bank accounts
    impact: 1.5
  - year: '2022'
    text: Higher rates test neobank funding models
    impact: 1.0
  - year: '2023'
    text: Nubank reaches profitable quarterly scale
    impact: 2.0
  - year: '2024'
    text: Digital banks face profitability test
    impact: 1.0
  - year: '2025'
    text: Chime IPO broadens neobank investor access
    impact: 2.0
  - year: '2025'
    text: Nubank seeks US national bank charter
    impact: 1.0
  - year: '2026'
    text: Revolut opens fully licensed Mexico bank
    impact: 2.0
  - year: '2026'
    text: Nubank secures conditional US charter
    impact: 2.0
  - year: '2026'
    text: Revolut opens regulated UK bank
    impact: 2.5
  - year: '2026'
    text: Revolut launches licensed Australian bank
    impact: 2.0
  - year: '2026'
    text: Starling automates business banking with AI
    impact: 1.5
  note:
  - We kept the events we believe pushed digital banking forward the most
  - Ratings are our estimates, with all the sources at the end of the report
