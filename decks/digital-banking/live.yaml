ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'Revolut searches doubled as people

    moved their everyday money to apps'
  date: Lately.
  expl: App-only banks like Revolut, Nubank and Monzo won millions of customers with cheap transfers, instant cards and no branch visits. Revolut passed
    50 million customers and kept adding countries, and people went searching for it.
  term: digital banking
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/digital-banking/digital-banking.csv
