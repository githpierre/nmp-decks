ed142p:
  title: 'What are the biggest

    threats to edge AI?'
  events:
  - odds: 45
    impact: 3
    text: Apple, Qualcomm and Google ship free on-device models, leaving little room for edge AI software startups
  - odds: 35
    impact: 3
    text: Nvidia releases cheap Jetson chips that undercut startups like Hailo and SiMa.ai on price and software
  - odds: 35
    impact: 1
    text: The EU AI Act requires costly conformity checks for cameras and devices running AI on the edge
  - odds: 30
    impact: 2
    text: US export controls widen to edge AI processors and block startup chip sales to China
  - odds: 30
    impact: 2
    text: Small models stay too weak for complex tasks, so customers keep sending AI work to the cloud
  - odds: 30
    impact: 2
    text: Chip startups like Mythic run out of cash before reaching volume, and investors stop funding new tapeouts
  - odds: 25
    impact: 2
    text: TSMC capacity goes to Nvidia and Apple first, so edge chip startups wait months for wafers
  - odds: 12
    impact: 3
    text: A security flaw lets hackers pull private data from on-device models in millions of phones and cameras
  note:
  - We listed the events that could slow edge ai down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
