ed007p:
  type: pp_radar
  title: 'What counts as edge AI,

    and what does not?'
  TL:
    name: Cerebras
    src: ../../assets/logos/pp_live/edge-ai/s01-00.png
    text: builds chips made for fast AI inference, but they run in big data centers, far from where the data is created
  TR:
    name: CoreWeave
    src: ../../assets/logos/pp_live/edge-ai/s01-02.png
    text: renis out GPUs for AT training and inference, but all of that compute sits in giant data centers, far from the edge
  BL:
    name: Apple
    src: ../../assets/logos/pp_live/edge-ai/s01-10.png
    text: runs Apple Intelligence models on the iPhone itself, but sends heavier requests to its Private Cloud Compute servers
  BR:
    name: Nvidia
    src: ../../assets/logos/pp_live/edge-ai/s01-11.png
    text: powers robots and cars with Jetson and Drive chips, but about 90% of its revenue comes from data center GPUs
  caption:
  - Distance to the center reflects how much of a company’s AI runs on devices or local nodes, rather than in cloud data centers
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
  - ../../assets/logos/pp_live/edge-ai/s01-01.png
