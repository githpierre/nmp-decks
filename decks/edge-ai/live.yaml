ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people ask online

    how to run AI on their own device'
  date: Recently.
  expl: AI started running on phones, laptops and cameras instead of the cloud. Apple, Qualcomm and Google pushed “on-device AI” in every launch, and new
    AI PCs came with their own AI chips. People kept hearing “edge AI” and wanted to know what it meant.
  term: edge ai
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/edge-ai/edge-ai.csv
ed052p:
  type: pp_cagr
  title: 'How much bigger

    can edge AI get?'
  lead: ''
  condition: To get that big, the market must turn robots, robotaxis, and AI PCs into large volumes, as each new device carries more AI chips and software.
    It must also cut the cost of porting models to each chip, keep memory affordable, and prove that local AI pays back faster than cloud AI.
  note:
  - We compared forecasts from Grand View, Fortune Business Insights, Precedence and The Business Research Company
  - We adjusted each one to our market definition to build a realistic range, and all our sources are at the end of the report
  size: 40
  cagr: 20
  y0: 2026
