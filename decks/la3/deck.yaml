    impact: 3
  - text: Nvidia and Broadcom keep improving pluggable optics, which delays the switch to co-packaged optics in data centers
    odds: 45
    impact: 3
  - text: A shortage of advanced packaging capacity at TSMC and partners pushes photonic chiplet lead times sharply higher
    odds: 40
    impact: 2
  - text: Rival optical I/O standards split the market, forcing Ayar Labs, Marvell and system makers to support several links
    odds: 30
    impact: 2
  - text: Hyperscalers cut AI infrastructure spending, reducing orders for 800G, 1.6T and new optical scale-up interconnects
    odds: 25
    impact: 2
  - text: Chinese export controls or US restrictions disrupt lasers, photonics packaging and optical component supply chains
    odds: 35
    impact: 2
  - text: Copper links reach farther than expected with better cables, which weakens the near-term case for optical I/O
    odds: 40
    impact: 2
  - text: Failures in co-packaged switches push operators back to pluggable modules, which are simpler and cheaper to repair
    odds: 30
    impact: 2
