- label: LAB AUTOMATION
  type: pp_risks
  section: Market challenges
  title: What are the biggest threats to the lab automation market?
  events:
  - text: US research budgets weaken in FY2027, delaying purchases of Hamilton, Tecan, Opentrons and integrated robotic workcells
    odds: 45
    impact: 3
  - text: Tariffs raise prices for imported robots and components, making automated workcells harder for smaller labs to justify
    odds: 40
    impact: 2
  - text: Labs find AI-generated protocols unreliable, slowing autonomous workflow deployment until validation tools improve
    odds: 35
    impact: 3
  - text: Hamilton and Tecan bundle orchestration with hardware, squeezing independent automation software vendors on pricing
    odds: 35
    impact: 2
  - text: A robot handling incident prompts stricter biosafety rules for autonomous labs working with hazardous biological agents
    odds: 20
    impact: 2
  - text: Universities favor shared core facilities over lab-owned robots, slowing unit sales even as automated experiment use grows
    odds: 40
    impact: 2
  - text: Instrument interoperability stays fragmented, forcing costly custom integration that delays multi-vendor workcell projects
    odds: 50
    impact: 2
  - text: Venture funding cools for lab robotics startups, reducing competition and slowing risky product development programs
    odds: 30
    impact: 2
  note:
  - We listed the events that could slow lab automation down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
