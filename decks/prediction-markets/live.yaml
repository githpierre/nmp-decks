    text: Intrade crackdown exposes regulatory stakes
    impact: 1.0
  - year: '2014'
    text: PredictIt gets academic market relief
    impact: 1.5
  - year: '2016'
    text: Brexit highlights forecasting demand
    impact: 1.5
  - year: '2016'
    text: US election boosts political market interest
    impact: 1.5
  - year: '2018'
    text: Kalshi pursues regulated event exchange
    impact: 1.5
  - year: '2020'
    text: Kalshi wins designated market status
    impact: 2.5
  - year: '2020'
    text: Polymarket brings crypto settlement
    impact: 2.0
  - year: '2021'
    text: Kalshi opens regulated retail trading
    impact: 2.0
  - year: '2022'
    text: Polymarket settlement clarifies US boundary
    impact: 1.0
  - year: '2022'
    text: PredictIt winddown fight mobilizes users
    impact: 1.0
  - year: '2023'
    text: Court relief keeps PredictIt operating
    impact: 1.5
  - year: '2023'
    text: Election cycle revives contract demand
    impact: 1.5
  - year: '2024'
    text: Court victory unlocks election contracts
    impact: 3.0
  - year: '2024'
    text: Presidential markets reach billions
    impact: 2.0
  - year: '2024'
    text: Media embeds prediction market odds
    impact: 1.5
  - year: '2025'
    text: Sports contracts drive mainstream volume
    impact: 2.0
  - year: '2025'
    text: March Madness draws huge contract volume
    impact: 2.0
  - year: '2025'
    text: Robinhood broadens event market distribution
    impact: 2.0
  - year: '2025'
    text: Polymarket prepares regulated US return
    impact: 1.5
  - year: '2025'
    text: Media deals normalize market probabilities
    impact: 1.5
  - year: '2026'
    text: CFTC backs federal prediction jurisdiction
    impact: 2.0
  - year: '2026'
    text: State lawsuits test sports market limits
    impact: 1.5
  - year: '2026'
    text: Midterm markets generate heavy trading
    impact: 2.0
  - year: '2026'
    text: Federal courts split on preemption
    impact: 1.5
  - year: '2026'
    text: CFTC proposes new event contract rules
    impact: 2.0
  - year: '2026'
    text: Sports become core prediction market volume
    impact: 2.0
  note:
  - We kept the events we believe pushed prediction markets forward the most
  - Ratings are our estimates, with all the sources at the end of the report
