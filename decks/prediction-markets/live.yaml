ed148p:
  title: 'What pushed the prediction markets

    industry forward, year after year?'
  events:
  - year: '1988'
    text: Iowa market proves crowd forecasting
    impact: 3.0
  - year: '1992'
    text: CFTC relief legitimizes Iowa experiments
    impact: 1.5
  - year: '2004'
    text: HedgeStreet wins federal exchange approval
