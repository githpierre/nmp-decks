ed007p:
  type: pp_radar
  title: 'Who Is in prediction markets,

    and who stays outside?'
  TL:
    name: DraftKings
    src: ../../assets/logos/pp_live/prediction-markets/s01-00.png
    text: is a sportsbook with house priced bets, not a general event contract market where users trade contracts
  TR:
    name: Morning Consult
    src: ../../assets/logos/pp_live/prediction-markets/s01-02.png
    text: measures opinions through polling and surveys, not through tradable contracts tied to future outcomes
  BL:
    name: Crypto.com
    src: ../../assets/logos/pp_live/prediction-markets/s01-09.png
    text: offers event contracts in some markets, while most of its business remains crypto trading and payments
  BR:
    name: Robinhood
    src: ../../assets/logos/pp_live/prediction-markets/s01-10.png
    text: distributes event contracts inside a broad brokerage, so puEeheiem markets are only one product line
  caption:
  - Distance to the center reflects how central each company is to prediction markets
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
  - ../../assets/logos/pp_live/prediction-markets/s01-01.png
