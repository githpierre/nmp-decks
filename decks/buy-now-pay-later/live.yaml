ed007p:
  type: pp_radar
  title: 'Which companies really belong

    In buy now pay later (BNPL)?'
  TL:
    name: Visa
    src: ../../assets/logos/pp_live/buy-now-pay-later/s01-00.png
    text: enables installment products for issuers, but it is a card network rather than a consumer BNPL provider
  TR:
    name: FICO
    src: ../../assets/logos/pp_live/buy-now-pay-later/s01-02.png
    text: provides credit decisioning and scores, but it does not offer consumer BNPL financing at checkout
  BL:
    name: Block
    src: ../../assets/logos/pp_live/buy-now-pay-later/s01-09.png
    text: owns Afterpay, but the parent also runs Square merchant services, Cash App and other financial products
  BR:
    name: PayPal
    src: ../../assets/logos/pp_live/buy-now-pay-later/s01-10.png
    text: offers Pay in 4 and monthly installments, while its main business includes wallets and payment processing
  caption:
  - Distance to the center reflects how central each company is to buy now pay later (BNPL)
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
