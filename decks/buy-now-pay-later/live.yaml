ed148p:
  title: 'What pushed the buy now pay later (BNPL) market

    forward, year after year? (Buy Now Pay Later'
  events:
  - year: '2005'
    text: Klarna brings installments into ecommerce
    impact: 2.5
  - year: '2008'
    text: Financial crisis weakens card trust
    impact: 1.0
  - year: '2012'
    text: Affirm builds transparent installment model
    impact: 1.5
  - year: '2014'
    text: Afterpay popularizes pay-in-four
    impact: 2.0
  - year: '2015'
    text: Smartphones move checkout into apps
    impact: 1.0
  - year: '2016'
    text: Klarna expands aggressively in US
    impact: 1.5
  - year: '2017'
    text: Sezzle expands short installment choice
    impact: 1.0
  - year: '2018'
    text: Soft checks reduce checkout friction
    impact: 1.5
  - year: '2019'
    text: BNPL volume begins rapid US climb
    impact: 2.0
  - year: '2020'
    text: Pandemic ecommerce turbocharges BNPL
    impact: 3.0
  - year: '2020'
    text: PayPal scales pay-later distribution
    impact: 1.5
  - year: '2021'
    text: Amazon adds Affirm at checkout
    impact: 2.5
  - year: '2021'
    text: Block agrees to buy Afterpay
    impact: 2.0
  - year: '2021'
    text: Pay-in-four originations near tenfold growth
    impact: 2.0
  - year: '2022'
    text: Rising inflation boosts payment splitting
    impact: 1.5
  - year: '2022'
    text: Apple announces Apple Pay Later
    impact: 2.0
  - year: '2023'
    text: Apple launches Pay Later in US
    impact: 1.5
  - year: '2023'
    text: Merchant integrations widen physical use
    impact: 1.5
  - year: '2024'
    text: CFPB applies card-style protections
    impact: 1.0
  - year: '2024'
    text: Apple shifts BNPL to partners
    impact: 1.5
  - year: '2024'
    text: BNPL keeps growing after pandemic boom
    impact: 1.5
  - year: '2025'
    text: CFPB withdraws BNPL interpretive rule
    impact: 1.5
  - year: '2025'
    text: Major providers reach broader loan mix
    impact: 2.0
  - year: '2025'
    text: BNPL credit issuance nears $160B
    impact: 2.0
  - year: '2025'
    text: Wallet integrations expand in-store BNPL
    impact: 1.5
  - year: '2025'
    text: Card issuers validate installment demand
    impact: 1.0
  - year: '2026'
    text: Fed maps broader BNPL credit market
    impact: 2.0
  - year: '2026'
    text: BNPL grows about 20 percent yearly
    impact: 2.0
  - year: '2026'
    text: Affirm broadens geography and products
    impact: 1.5
  - year: '2026'
    text: Mobile wallets widen installment reach
    impact: 1.5
  note:
  - We kept the events we believe pushed buy now pay later forward the most
  - Ratings are our estimates, with all the sources at the end of the report
