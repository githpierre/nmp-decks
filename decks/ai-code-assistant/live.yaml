ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people with no coding

    skills look for an AI code assistant'
  date: Lately.
  expl: Coding with AI went from a developer trick to a mass habit. Cursor, Claude Code and GitHub Copilot became daily tools, “vibe coding” went viral,
    and people with no coding skills started building apps. Searches for AI code assistants took off.
  term: ai code assistant
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/ai-code-assistant/ai-code-assistant.csv
ed052p:
  type: pp_cagr
  title: 'How much bigger can

    AI code assistants get?'
  lead: ''
  condition: To get that big, the market must turn agents into trusted teammates that finish real tasks, and prove clear productivity gains to large buyers.
    It must also keep margins healthy as prices fall, and bring AI coding to millions of non-developers who build their own software.
  note:
  - We compared forecasts from Grand View, MarketsandMarkets, Market.us and Astute Analytica
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: 10
  cagr: 25
  y0: 2026
