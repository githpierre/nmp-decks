ed142p:
  title: 'What could go wrong for

    AI coding assistants?'
  events:
  - odds: 50
    impact: 3
    text: Anthropic, OpenAI and Google sell their own coding agents directly and squeeze tools like Cursor and Cognition
  - odds: 40
    impact: 2
    text: GitHub Copilot bundles agents into Microsoft enterprise deals and wins large companies on price
  - odds: 35
    impact: 3
    text: Model costs rise with heavy agent use and coding startups see gross margins fall below 20 percent
  - odds: 35
    impact: 2
    text: Open source models like DeepSeek and Qwen match paid tools and drive prices toward zero
  - odds: 30
    impact: 1
    text: Developer seat counts shrink as tech layoffs continue, reducing the number of paying users per firm
  - odds: 20
    impact: 2
    text: Studies show AI agents slow senior engineers down and CTOs cut spending on coding tools
  - odds: 15
    impact: 3
    text: An AI generated code flaw causes a major breach and companies restrict agents in production
  - odds: 8
    impact: 2
    text: Courts rule that training on open source code breaks licenses, forcing costly model retraining
  note:
  - We listed the events that could slow ai code assistant down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
