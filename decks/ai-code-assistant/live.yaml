ed007p:
  type: pp_radar
  title: 'What is actually included

    in AI code assistants?'
  TL:
    name: JetBrains
    src: ../../assets/logos/pp_live/ai-code-assistant/s01-00.png
    text: sells its own Al Assistant and Junie agent, but its core business is the IDE itself, which sits outside this market
  TR:
    name: CodeRabbit
    src: ../../assets/logos/pp_live/ai-code-assistant/s01-02.png
    text: reviews pull requests with AI once the code is written, so it works after the editor rather than inside it
  BL:
    name: Qodo
    src: ../../assets/logos/pp_live/ai-code-assistant/s01-10.png
    text: started as an IDE plugin that writes tests, then moved its focus to AI code review, so it now sits on the line
  BR:
    name: GitHub
    src: ../../assets/logos/pp_live/ai-code-assistant/s01-11.png
    text: sells Copilot, the most widely used code assistant, yet it remains first a code hosting and collaboration platform
  caption:
  - Distance to the center reflects how much a product helps developers write and change code interactively inside their editor
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
