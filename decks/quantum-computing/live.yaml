ed052p:
  type: pp_cagr
  title: 'Is the quantum computing

    market still growing fast?'
  lead: ''
  condition: Yes, but the market must deliver machines that fix their own errors, and prove clear gains on real problems in chemistry, finance, and materials.
    It must also make chips, fridges, and control systems at industrial scale, and keep public and private money flowing until profits arrive.
  note:
  - We compared forecasts from QED-C, MarketsandMarkets, Fortune Business Insights and Grand View
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: 1.8
  cagr: 30
  y0: 2026
