ed007p:
  type: pp_radar
  title: 'Which companies really belong

    in quantum computing today?'
  TL:
    name: IBM
    src: ../../assets/logos/pp_live/quantum-computing/s01-00.png
    text: has booked about $1 billion in quantum sales over the years, a small slice of a company that earns over $60 billion a year
  TR:
    name: SandboxAQ
    src: ../../assets/logos/pp_live/quantum-computing/s01-02.png
    text: spun out of Alphabet with quantum in its pitch, but it sells encryption software and quantum sensors, not computers
  BL:
    name: Multiverse Computing
    src: ../../assets/logos/pp_live/quantum-computing/s01-10.png
    text: started with quantum-inspired optimization software, but its growth now comes from compressing AI models
  BR:
    name: Bluefors
    src: ../../assets/logos/pp_live/quantum-computing/s01-11.png
    text: builds the fridges that cool many quantum computers, but sells the same cryogenics to physics labs and fusion projects
  caption:
  - Distance to the center reflects how much a company’s revenue depends on building or running quantum computers
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
