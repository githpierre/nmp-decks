ed142p:
  title: 'What could go wrong

    for quantum computing?'
  events:
  - odds: 45
    impact: 2
    text: Classical algorithms on Nvidia GPUs keep matching claimed quantum advantage results, eroding buyer trust
  - odds: 40
    impact: 2
    text: Logical qubit error rates stall, pushing useful quantum advantage beyond 2030 for most commercial customers
  - odds: 35
    impact: 3
    text: IBM, Google and Microsoft reach error corrected qubits first, leaving IonQ, Rigetti and D-Wave behind
  - odds: 35
    impact: 3
    text: Quantum stocks like IonQ and Rigetti fall 70% as investors lose patience with tiny revenues
  - odds: 30
    impact: 1
    text: US export controls on quantum hardware and dilution refrigerators cut startups off from Asian customers
  - odds: 25
    impact: 2
    text: Congress delays reauthorizing the National Quantum Initiative, freezing DOE and DARPA program money
  - odds: 15
    impact: 1
    text: A helium-3 shortage drives up dilution refrigerator prices and delays new superconducting systems
  - odds: 10
    impact: 2
    text: A quantum startup is caught overstating qubit performance, prompting SEC probes across listed quantum companies
  note:
  - We listed the events that could slow quantum computing down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
