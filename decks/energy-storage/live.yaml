ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More and more people look up battery

    storage, as solar and wind need backup'
  date: 0 Recently.
  expl: Solar and wind produce power when it is not needed, and batteries store it for later. Homes, businesses and utilities started buying storage, and
    searches for battery storage kept climbing.
  term: energy storage
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/energy-storage/energy-storage.csv
ed052p:
  type: pp_cagr
  title: 'Is energy storage

    still growing fast?'
  lead: ''
  condition: Yes, but gigawatt-hours must keep growing about 20% a year while prices fall more slowly than in 2025, and the US must find enough non-Chinese
    cells. It must also turn the 142 gigawatt-hours signed by data centers into built plants and keep trading revenue high enough to finance new batteries.
  note:
  - We compared forecasts from MarketsandMarkets, Coherent, Fortune, Grand View and BNEF to build a realistic range
  - We added our funding tracker and allowed for falling prices, and all the sources are included at the end of the report
  size: 87
  cagr: 16
  y0: 2026
