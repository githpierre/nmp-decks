ed142p:
  title: 'What could go wrong

    for energy storage?'
  events:
  - odds: 35
    impact: 3
    text: US content rules and tariffs effectively ban Chinese cells from CATL and BYD, raising storage costs
  - odds: 25
    impact: 3
    text: Merchant battery revenues collapse further in Texas and California as too many batteries chase the same peaks
  - odds: 20
    impact: 2
    text: Grid connection queues in the US and Germany stay blocked, delaying storage projects for years
  - odds: 15
    impact: 1
    text: Gas turbines win data center power deals, leaving less room for battery storage projects
  - odds: 12
    impact: 2
    text: A major battery fire like Moss Landing leads counties to ban new large storage projects
  - odds: 10
    impact: 2
    text: AI data center demand slows and many planned battery deals with hyperscalers are canceled
  - odds: 8
    impact: 2
    text: Lithium prices triple again and raise battery cell costs for storage developers worldwide
  - odds: 5
    impact: 3
    text: Congress ends the storage tax credit early, cutting returns on new battery projects in America
  note:
  - We listed the events that could slow energy storage down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
