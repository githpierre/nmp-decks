ed007p:
  type: pp_radar
  title: 'What counts as energy storage,

    and what only looks like it?'
  TL:
    name: Albemarle
    src: ../../assets/logos/pp_live/energy-storage/s01-00.png
    text: is a leading supplier of lithium for batteries, but it sells raw materials, and none of its products store energy
  TR:
    name: Vestas
    src: ../../assets/logos/pp_live/energy-storage/s01-02.png
    text: builds wind turbines for wind farms, but they only make power when the wind blows, and it sells no way to store that power
  BL:
    name: Enphase
    src: ../../assets/logos/pp_live/energy-storage/s01-10.png
    text: built its name on solar microinverters and now ships home batteries too, but it is still a solar electronics company
  BR:
    name: Nel
    src: ../../assets/logos/pp_live/energy-storage/s01-11.png
    text: builds electrolyzers that turn electricity into hydrogen, which can be stored, but most of it is used as fuel or feedstock
  caption:
  - Distance to the center reflects how much of the business is storing energy and giving it back later, in whatever form
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
  - ../../assets/logos/pp_live/energy-storage/s01-01.png
