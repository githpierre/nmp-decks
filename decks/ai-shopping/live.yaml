ed007p:
  type: pp_radar
  title: 'What is actually included

    in the AI shopping market?'
  TL:
    name: Algolia
    src: ../../assets/logos/pp_live/ai-shopping/s01-00.png
    text: powers product search for many online shops, but it sells a general search API also used for media sites and documentation
  TR:
    name: Stripe
    src: ../../assets/logos/pp_live/ai-shopping/s01-02.png
    text: co-developed the Agentic Commerce Protocol used by ChatGPT, but it is paid to process payments, not to help shoppers choose
  BL:
    name: Pinterest
    src: ../../assets/logos/pp_live/ai-shopping/s01-10.png
    text: uses AI visual search like Lens and Shop the Look to suggest products, but nearly all of its money comes from ads
  BR:
    name: Perplexity
    src: ../../assets/logos/pp_live/ai-shopping/s01-11.png
    text: now lets users buy products in a few clicks inside its answers, but shopping is one feature of a general answer engine
  caption:
  - Distance to the center reflects how much a product exists to help shoppers find and choose products, not to pay or ship
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
