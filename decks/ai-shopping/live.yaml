ed142p:
  title: 'What could go wrong

    for AI shopping?'
  events:
  - odds: 55
    impact: 3
    text: OpenAI, Google and Amazon build shopping agents into ChatGPT, Gemini and Rufus, leaving little room for startups
  - odds: 35
    impact: 2
    text: Shoppers distrust agent purchases after wrong orders and hidden sponsored picks, so adoption stays under 10%
  - odds: 30
    impact: 2
    text: Visa and Mastercard set agent payment rules and fees that favor big platforms over startups
  - odds: 30
    impact: 2
    text: Fraudsters exploit agent checkout flows, and banks raise chargeback rates for AI initiated purchases
  - odds: 30
    impact: 1
    text: Retailers like Walmart and Target refuse product data feeds to independent agents, limiting catalog coverage
  - odds: 25
    impact: 2
    text: The FTC rules paid placement in AI shopping answers must be disclosed, cutting affiliate revenue for agents
  - odds: 20
    impact: 3
    text: Amazon wins its Perplexity case at trial, so retailers can block outside AI shopping agents
  - odds: 15
    impact: 3
    text: A prompt injection hidden in a product listing makes agents buy fake goods at scale
  note:
  - We listed the events that could slow ai shopping down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
