ed148p:
  title: 'What pushed the life science research

    tools market forward, year after year?'
  events:
  - year: '1983'
    text: PCR makes DNA amplification routine
    impact: 3.0
  - year: '1986'
    text: Automated sequencing raises lab throughput
    impact: 2.5
  - year: '1992'
    text: Single-cell expression becomes measurable
    impact: 1.0
  - year: '1995'
    text: Microarrays scale gene expression studies
    impact: 2.0
  - year: '1998'
    text: Solexa forms around sequencing-by-synthesis
    impact: 1.5
  - year: '2001'
    text: Solexa funding speeds platform development
    impact: 1.0
  - year: '2004'
    text: Cluster amplification boosts signals
    impact: 1.5
  - year: '2005'
    text: Solexa sequences phiX at scale
    impact: 2.0
  - year: '2006'
    text: Genome Analyzer commercializes NGS
    impact: 3.0
  - year: '2007'
    text: Illumina buys Solexa and scales NGS
    impact: 2.0
  - year: '2008'
    text: RNA-seq replaces many microarray workflows
    impact: 2.0
  - year: '2009'
    text: Single-cell RNA-seq opens cellular resolution
    impact: 2.0
  - year: '2011'
    text: Cell barcoding scales single-cell studies
    impact: 1.5
  - year: '2012'
    text: Smart-seq improves transcript coverage
    impact: 1.5
  - year: '2012'
    text: CRISPR expands demand for research tools
    impact: 2.0
  - year: '2013'
    text: Fluidigm automates single-cell sample prep
    impact: 1.0
  - year: '2014'
    text: MARS-seq couples FACS with automation
    impact: 1.0
  - year: '2015'
    text: Drop-seq cuts single-cell sequencing costs
    impact: 2.0
  - year: '2016'
    text: Spatial transcriptomics keeps tissue context
    impact: 2.0
  - year: '2017'
    text: 10x standardizes single-cell workflows
    impact: 2.0
  - year: '2018'
    text: Indexing broadens single-cell scale
    impact: 1.0
  - year: '2019'
    text: Spatial platforms become commercial workflows
    impact: 2.0
  - year: '2020'
    text: Covid drives genomic surveillance demand
    impact: 2.0
  - year: '2020'
    text: Smart-seq3 boosts counting precision
    impact: 1.0
  - year: '2021'
    text: Multiomics links RNA with proteins
    impact: 1.5
  - year: '2022'
    text: New entrants pressure sequencing costs
    impact: 1.5
  - year: '2023'
    text: Long-read systems broaden genome analysis
    impact: 1.5
  - year: '2024'
    text: Spatial biology enters wider research budgets
    impact: 1.5
  - year: '2026'
    text: Atera scales spatial transcriptomics
    impact: 2.0
  - year: '2026'
    text: Illumina launches StrataMap spatial workflow
    impact: 2.0
  note:
  - We kept the events we believe pushed life science research tools forward the most
  - Ratings are our estimates, with all the sources at the end of the report
ed168p:
  handle: life-science-research-tools
  title: 'Where did life science tools investors

    put their money this past year?'
  note:
  - We added up every equity round of life science research tools startups in our tracker over the last twelve months
  - by category of our market definition, and rounds with no public amount count as zero here
