ed007p:
  type: pp_radar
  title: 'Which companies really belong

    in life science research tools?'
  TL:
    name: Tempus AT
    src: ../../assets/logos/pp_live/life-science-research-tools/s01-00.png
    text: it provides clinical diagnostics and data services that researchers use, but its center of gravity is patient care and
  TR:
    name: Pfizer
    src: ../../assets/logos/pp_live/life-science-research-tools/s01-02.png
    text: it buys and uses life science research tools to develop drugs, but it is a pharmaceutical producer rather than a tools
  BL:
    name: 10x Genomics
    src: ../../assets/logos/pp_live/life-science-research-tools/s01-09.png
    text: it is a major research tools company but is publicly listed, so it fits the ~ market while sitting outside private startup
  BR:
    name: Ginkgo Bioworks
    src: ../../assets/logos/pp_live/life-science-research-tools/s01-10.png
    text: it provides automated cell programming and research services, blending a research platform with contract development
  caption:
  - Distance to the center reflects how central each company is to life science research tools
