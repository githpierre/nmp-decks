ed052p:
  type: pp_cagr
  title: 'Where could sales enablement software

    be in ten years?'
  lead: 'To get there, '
  condition: platforms must connect content, training and coaching directly to measurable seller productivity and win rates.
  note:
  - We compared forecasts from Grand View Research, Mordor Intelligence and The Business Research Company
  - We adjusted each one to our definition of the market, and all the sources are included at the end of the report
