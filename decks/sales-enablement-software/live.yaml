ed148p:
  title: 'What pushed the sales enablement

    software market forward, year after year?'
  events:
  - year: '1887'
    text: NCR scripts repeatable sales conversations
    impact: 1.5
  - year: '1894'
    text: NCR opens centralized sales school
    impact: 2.0
  - year: '1911'
    text: Training films scale sales instruction
    impact: 1.5
  - year: '1968'
    text: Xerox proves structured sales training
    impact: 2.0
  - year: '1999'
    text: CRMs centralize customer information
    impact: 2.0
  - year: '2005'
    text: Sales enablement becomes named function
    impact: 2.5
  - year: '2008'
    text: Forrester convenes enablement executives
    impact: 1.5
  - year: '2009'
    text: Forrester defines sales enablement
    impact: 1.5
  - year: '2010'
    text: Seismic brings enablement into software
    impact: 2.0
  - year: '2011'
    text: Highspot targets seller content discovery
    impact: 2.0
  - year: '2013'
    text: Unused content exposes enablement waste
    impact: 1.5
  - year: '2014'
    text: CRM integrations reduce workflow friction
    impact: 1.5
  - year: '2015'
    text: Enablement Society organizes practitioners
    impact: 2.0
  - year: '2016'
    text: Video coaching expands remote practice
    impact: 1.5
  - year: '2017'
    text: Forrester quantifies content-search waste
    impact: 2.0
  - year: '2018'
    text: Digital sales rooms support buyer journeys
    impact: 1.5
  - year: '2019'
    text: Conversation intelligence informs coaching
    impact: 2.0
  - year: '2020'
    text: Remote selling makes enablement essential
    impact: 3.0
  - year: '2021'
    text: Seismic buys Lessonly
    impact: 2.5
  - year: '2021'
    text: Bigtincan buys Brainshark
    impact: 1.5
  - year: '2022'
    text: Highspot reaches $3.5 billion valuation
    impact: 1.5
  - year: '2022'
    text: Gartner frames revenue enablement market
    impact: 2.0
  - year: '2023'
    text: Generative AI enters seller workflows
    impact: 2.0
  - year: '2023'
    text: Revenue enablement broadens role coverage
    impact: 1.5
  - year: '2024'
    text: AI roleplay scales seller practice
    impact: 1.5
  - year: '2025'
    text: Agentforce brings AI sales coaching
    impact: 2.0
  - year: '2025'
    text: Gartner Magic Quadrant validates category
    impact: 1.5
  - year: '2026'
    text: Seismic and Highspot announce merger
    impact: 2.0
  - year: '2026'
    text: Seismic completes Highspot merger
    impact: 2.0
  - year: '2026'
    text: Salesforce agents build enablement programs
    impact: 2.0
  note:
  - We kept the events we believe pushed sales enablement software forward the most
  - Ratings are our estimates, with all the sources at the end of the report
