ed007p:
  type: pp_radar
  title: 'Which companies really belong

    in sales enablement software?'
  TL:
    name: ZoomInfo
    src: ../../assets/logos/pp_live/sales-enablement-software/s01-00.png
    text: supplies prospect data and intelligence, but it is not primarily a content, coaching or readiness platform
  TR:
    name: Canva
    src: ../../assets/logos/pp_live/sales-enablement-software/s01-02.png
    text: teams can make sales presentations in Canva, but it does not manage seller readiness or enablement workflows
  BL:
    name: Salesloft
    src: ../../assets/logos/pp_live/sales-enablement-software/s01-09.png
    text: sales engagement includes coaching and content features, but execution workflows remain the primary product focus
  BR:
    name: Gong
    src: ../../assets/logos/pp_live/sales-enablement-software/s01-10.png
    text: conversation intelligence and coaching overlap with enablement, while its core platform centers on revenue intelligence
  caption:
  - Distance to the center reflects how central each company is to sales enablement software
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
