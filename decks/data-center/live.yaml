ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'People ask what a data center

    is, as AI builds them everywhere'
  date: In recent months.
  expl: 'Data centers used to be invisible buildings. Then AI turned them into front-page news: Stargate promised $500 billion, Meta planned a campus the
    size of Manhattan, and towns fought over power bills and water use. People wanted to know what was being built next door.'
  term: data center
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/data-center/data-center.csv
ed052p:
  type: pp_cagr
  title: 'What growth can the data center

    market realistically expect?'
  lead: ''
  condition: To hit this growth, the market must find enough power for hundreds of new gigawatts, and keep AI demand strong enough fo fill every new campus.
    It must also build transformers, turbines, and cooling fast enough, and win local support for large sites in every region.
  note:
  - We compared forecasts from Dell'Oro, MarketsandMarkets and Grand View and adjusted each one to our market definition
  - We then built a realistic range from these forecasts, and you will find all the sources we used at the end of the report
  size: null
  cagr: 17
  y0: 2026
