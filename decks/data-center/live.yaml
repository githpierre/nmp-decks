ed007p:
  type: pp_radar
  title: 'What is actually included

    in the data center market?'
  TL:
    name: Microsoft
    src: ../../assets/logos/pp_live/data-center/s01-00.png
    text: brought 88 data centers online in fiscal 2026, but it builds them to sell Azure cloud services, not space and power
  TR:
    name: Cisco
    src: ../../assets/logos/pp_live/data-center/s01-02.png
    text: sells the switches that link servers in AI data centers, but networking gear in the building falls outside this market
  BL:
    name: Schneider Electric
    src: ../../assets/logos/pp_live/data-center/s01-10.png
    text: gets about 30% of its orders from data centers and networks, but it remains a broad energy management group
  BR:
    name: Crusoe
    src: ../../assets/logos/pp_live/data-center/s01-11.png
    text: develops the Stargate campus in Abilene for Oracle, but most of its revenue is expected to come from its own GPU cloud
  caption:
  - Distance to the center reflects how much of a business is selling data center space, power and cooling, not the IT inside
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
