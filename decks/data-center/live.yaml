ed142p:
  title: 'What are the biggest

    threats to data centers?'
  events:
  - odds: 35
    impact: 2
    text: Ireland, the Netherlands and US states impose new power and water limits that stall data center builds
  - odds: 30
    impact: 3
    text: PJM and Texas grid operators freeze new connections, so planned data centers wait years for power
  - odds: 25
    impact: 3
    text: AI demand slows as Microsoft and others cancel leases, leaving new data centers half empty for years
  - odds: 20
    impact: 3
    text: Lenders pull back from data center debt after a neocloud default, leaving projects without financing to finish
  - odds: 15
    impact: 2
    text: Microsoft, Google and Amazon build all new capacity themselves and stop leasing from data center developers
  - odds: 12
    impact: 3
    text: A DeepSeek-style efficiency leap lets AI labs need far less compute, so data center demand drops sharply
  - odds: 10
    impact: 2
    text: New US export rules and Chinese mineral bans cut chip and equipment supply to data center builders
  - odds: 5
    impact: 1
    text: A major hyperscale data center outage takes down cloud services for millions of users for days
  note:
  - We listed the events that could slow data center down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
