ed007p:
  type: pp_radar
  title: 'What is in Earth observation,

    and what stays outside?'
  TL:
    name: Esri
    src: ../../assets/logos/pp_live/earth-observation/s01-00.png
    text: makes the ArcGIS mapping software that most governments use, but satellite imagery is only one of the many layers it handles
  TR:
    name: Trimble
    src: ../../assets/logos/pp_live/earth-observation/s01-01.png
    text: sells GPS receivers to surveyors and farmers, but reading signals from space is navigation, not observing the Earth
  BL:
    name: AiDASH
    src: ../../assets/logos/pp_live/earth-observation/s01-10.png
    text: uses satellite imagery to spot trees threatening power lines, but what utilities buy is its vegetation management software
  BR:
    name: Kpler
    src: ../../assets/logos/pp_live/earth-observation/s01-11.png
    text: bought Spire’s satellite ship- tracking business in 2025, but it sells commodity trade data where space is only one input
  caption:
  - Distance to the center reflects how much a business relies on imaging or sensing the Earth from orbit rather than the ground
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
