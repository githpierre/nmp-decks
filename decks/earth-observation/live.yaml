ed052p:
  type: pp_cagr
  title: 'Is the Earth observation

    market still growing fast?'
  lead: ''
  condition: Yes, but governments must keep buying commercial data and fleets instead of building their own, and new sensors must turn into paying products.
    Analytics must also make the data easy enough for farms, utilities, and insurers to buy every week, not once a year.
  note:
  - We compared forecasts from Meticulous, Global Market Insights, Fortune and IMARC to build a realistic range
  - We weighed the leaders’ growth and defense budget risks, and all our sources are listed at the end of the report
  size: null
  cagr: 10
  y0: 2026
