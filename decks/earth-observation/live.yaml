ed142p:
  title: 'What could go wrong

    for Earth observation?'
  events:
  - odds: 25
    impact: 3
    text: Dozens of satellite fleets sell similar images and optical image prices collapse for all providers
  - odds: 20
    impact: 1
    text: The best Earth observation startups get bought early, like Capella and Orbital Insight, at modest prices
  - odds: 18
    impact: 2
    text: Airbus and Thales win sovereign satellite fleet contracts in Europe, shutting out Earth observation startups
  - odds: 15
    impact: 3
    text: The White House and Congress cut NRO and NASA commercial imagery budgets, hitting Planet and Vantor
  - odds: 15
    impact: 2
    text: Google expands free AlphaEarth embeddings in Earth Engine, crushing paid geospatial AI startups
  - odds: 10
    impact: 2
    text: Free Sentinel-2 and Landsat data improve enough that many buyers stop paying for commercial images
  - odds: 8
    impact: 2
    text: Chinese operators like Chang Guang sell images far cheaper, starting a global price war
  - odds: 3
    impact: 3
    text: A major orbital collision makes satellite fleets uninsurable and stops new Earth observation launches
  note:
  - We listed the events that could slow earth observation down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
