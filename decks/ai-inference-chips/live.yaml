ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'People look up AI inference chips

    more, as running AI gets costly'
  date: Over the past year.
  expl: Training AI models is expensive, but running them for billions of users costs even more. Nvidia bought Groq’s technology, Google pushed its TPUs,
    and startups like Cerebras raised big rounds. Inference chips became the next big fight in AI hardware.
  term: ai inference chips
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/ai-inference-chips/ai-inference-chips.csv
ed052p:
  type: pp_cagr
  title: 'How much bigger

    can this market get?'
  lead: ''
  condition: To get that big, token volumes must keep growing faster than token prices fall, and agents must keep using far more compute than chat ever
    did. It must also keep memory, packaging, and power growing fast enough to turn orders into shipped chips.
  note:
  - We compared growth paths from Broadcom, Nvidia and Dell'Oro, and aligned their timelines to build a realistic range
  - We allowed for falling token prices and maturing capex, and all the sources we used are listed at the end of the report
  size: 298
  cagr: 22
  y0: 2026
