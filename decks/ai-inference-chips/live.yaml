ed142p:
  title: 'What could go wrong

    for AI inference chips?'
  events:
  - odds: 40
    impact: 3
    text: Google, Amazon, Meta and OpenAI run inference on their own chips and buy little from startups
  - odds: 35
    impact: 3
    text: Nvidia CUDA keeps most developers locked in, so inference chip startups cannot win large volume orders
  - odds: 25
    impact: 3
    text: AI demand slows after a cheap model shock, and orders for inference chips from startups dry up
  - odds: 15
    impact: 2
    text: Token prices fall so fast that inference chip startups cannot earn back their chip design costs
  - odds: 12
    impact: 2
    text: New US export rules cover Gulf and Asian buyers, cutting inference chip startups off from key customers
  - odds: 12
    impact: 2
    text: An HBM shortage lets SK hynix, Samsung and Micron favor Nvidia, starving inference startups of memory
  - odds: 10
    impact: 1
    text: Data center power delays push back new inference chip deployments and orders by one to two years
  - odds: 5
    impact: 2
    text: Etched or Cerebras racks fail in production at a bank or cloud and buyers return to Nvidia
  note:
  - We listed the events that could slow ai inference chips down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
