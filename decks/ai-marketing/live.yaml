ed148p:
  title: 'What pushed AI marketing

    forward, year after year?'
  events:
  - year: '2000'
    text: Google opens search ads to smaller firms
    impact: 2.5
  - year: '2002'
    text: Cost per click rewards relevant ads
    impact: 2.0
  - year: '2003'
    text: AdSense scales contextual ad targeting
    impact: 1.5
  - year: '2007'
    text: Facebook makes audience data marketable
    impact: 2.5
  - year: '2007'
    text: Google announces DoubleClick adtech deal
    impact: 2.0
  - year: '2009'
    text: Real time auctions accelerate ad automation
    impact: 2.0
  - year: '2010'
    text: Retargeting makes repeat visits monetizable
    impact: 1.0
  - year: '2012'
    text: Facebook Custom Audiences improves targeting
    impact: 1.5
  - year: '2016'
    text: Google Smart Bidding automates auctions
    impact: 2.0
  - year: '2018'
    text: GDPR raises costs of behavioral targeting
    impact: 1.5
  - year: '2020'
    text: Covid shifts marketing budgets online
    impact: 2.0
  - year: '2021'
    text: Apple tracking rules reshape targeting
    impact: 2.5
  - year: '2021'
    text: Performance Max unifies ad inventory
    impact: 2.5
  - year: '2022'
    text: Meta automates shopping ad combinations
    impact: 2.0
  - year: '2022'
    text: ChatGPT sharply lowers copywriting effort
    impact: 2.5
  - year: '2023'
    text: Meta integrates AI into campaign performance
    impact: 1.5
  - year: '2023'
    text: Google generates Performance Max ad assets
    impact: 2.0
  - year: '2023'
    text: Shopify Magic reaches merchant workflows
    impact: 1.5
  - year: '2024'
    text: Gemini accelerates ad asset creation
    impact: 2.0
  - year: '2024'
    text: AI Overviews reshape search discovery
    impact: 2.0
  - year: '2024'
    text: Google inserts ads into AI Overviews
    impact: 1.5
  - year: '2024'
    text: Brand controls mature for AI creatives
    impact: 1.0
  - year: '2025'
    text: AI Max broadens search intent matching
    impact: 2.0
  - year: '2025'
    text: Google agents automate campaign tasks
    impact: 1.5
  - year: '2025'
    text: Ads follow consumers into AI discovery
    impact: 2.0
  - year: '2026'
    text: AI Max expands into shopping campaigns
    impact: 2.0
  - year: '2026'
    text: Google tests conversational ads in AI Mode
    impact: 2.0
  - year: '2026'
    text: Marketing agents unify ad workflow decisions
    impact: 1.5
  - year: '2026'
    text: HubSpot agents coordinate marketing
    impact: 1.5
  - year: '2026'
    text: AI Brief simplifies campaign instructions
    impact: 1.5
  note:
  - We kept the events we believe pushed ai marketing forward the most
  - Ratings are our estimates, with all the sources at the end of the report
