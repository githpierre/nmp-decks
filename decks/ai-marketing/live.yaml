ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'More marketers are googling AI

    to write and run their campaigns'
  date: Lately.
  expl: Generative AI went from writing a few lines of copy to producing images, videos and whole campaigns. Marketing teams started searching for tools
    that create and test ads faster, and big ad platforms built AI into their own products.
  term: ai marketing
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/ai-marketing/ai-marketing.csv
ed052p:
  type: pp_cagr
  title: 'What will the AI marketing

    market be worth by 2036?'
  lead: ''
  condition: To be worth that much, the market must move from writing copy to running whole campaigns that marketers trust with budgets. It must also prove
    lower cost per sale than human teams, not just more content.
  note:
  - We compared forecasts from Grand View, The Business Research Company, Ken Research and MarketsandMarkets
  - We adjusted each one to our market definition to build a realistic range, with all the sources at the end of the report
  size: null
  cagr: 20
  y0: 2026
