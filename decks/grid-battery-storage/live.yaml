ed039p:
  pill: SIGNAL
  signal: google-trends
  window: 5y
  title: 'The term grid battery storage appears

    more and more in Google searches'
  date: 0 Lately.
  expl: Solar and wind produce power when the grid does not need it. Huge battery parks store that energy for the evening, and more of them are being built,
    which put grid battery storage on more people’s radar.
  term: grid battery storage
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
  csv: assets/trends/grid-battery-storage/grid-battery-storage.csv
ed052p:
  type: pp_cagr
  title: 'What growth can the grid battery

    market realistically expect?'
  lead: ''
  condition: To hit this growth, batteries must win long contracts from utilities, grid operators, and data centers, so that owners stop depending on swinging
    power prices. Grids must also connect new sites faster, and supply must stay open despite tariffs and the US rules on Chinese parts.
  note:
  - We compared forecasts from Grand View, MarketsandMarkets, Global Market Insights and BloombergNEF
  - We allowed for falling prices per kwh to build a realistic range, with all the sources at the end of the report
  size: 48
  cagr: 12
  y0: 2026
