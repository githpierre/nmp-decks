ed142p:
  title: 'What are the biggest

    threats to grid batteries?'
  events:
  - odds: 45
    impact: 3
    text: Treasury FEOC rules cut tax credits for projects using Chinese cells from CATL, BYD and EVE
  - odds: 45
    impact: 2
    text: Too many batteries in ERCOT and CAISO crash price spreads and cut revenue per megawatt
  - odds: 40
    impact: 3
    text: US tariffs on Chinese lithium batteries rise above 80 percent, raising project costs and delaying builds
  - odds: 40
    impact: 2
    text: Interconnection queues stay jammed, delaying thousands of megawatts of storage projects by several years
  - odds: 35
    impact: 1
    text: Tesla Megapack and Fluence win most deals on scale and squeeze smaller integrators out of the market
  - odds: 25
    impact: 2
    text: A large battery fire like Moss Landing leads counties in California and New York to ban sites
  - odds: 15
    impact: 3
    text: Congress repeals or phases out the storage investment tax credit earlier than planned
  - odds: 8
    impact: 2
    text: A cyberattack on battery management software from a Chinese supplier triggers federal bans on installed systems
  note:
  - We listed the events that could slow grid battery storage down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
