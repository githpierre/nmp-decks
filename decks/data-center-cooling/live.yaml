ed142p:
  title: 'What could go wrong for

    data center cooling?'
  events:
  - odds: 35
    impact: 2
    text: Nvidia chips that run warm let operators drop chillers, shrinking a large part of the cooling market
  - odds: 25
    impact: 3
    text: Hyperscalers design their own cooling units through the Open Compute Project and buy fewer branded systems
  - odds: 25
    impact: 3
    text: AI demand slows and data center overcapacity hits, cutting cooling orders and halving Vertiv's stock
  - odds: 20
    impact: 2
    text: Schneider, Vertiv and other incumbents buy the remaining liquid cooling startups, leaving few independent players
  - odds: 15
    impact: 1
    text: More cities like Tucson and Amsterdam ban water-hungry data centers, cutting demand for evaporative cooling
  - odds: 12
    impact: 2
    text: The EU bans PFAS chemicals without exemptions, forcing two-phase cooling vendors to change their fluids
  - odds: 8
    impact: 2
    text: Nvidia's next racks run too hot for current cold plates, forcing costly cooling redesigns for vendors
  - odds: 5
    impact: 1
    text: A liquid cooling leak destroys a rack of GPUs and operators slow their switch to liquid cooling
  note:
  - We listed the events that could slow data center cooling down, from company news, regulators and analysts
  - Odds and impact are our own estimates, and all the sources we used are listed at the end of the report
