    more and more, as AI chips run hot'
  date: Recently.
  expl: AI chips run so hot that fans are no longer enough. Nvidia’s new servers need liquid cooling, data centers started using millions of gallons of
    water, and towns pushed back. Keeping AI cool became a headline problem, and searches kept reaching new highs.
  term: data center cooling
  note:
  - We tracked how often people around the world googled this term over the last five years
  - We used Google Trends, and you will find all the sources we used at the end of the report
