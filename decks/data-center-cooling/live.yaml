ed007p:
  type: pp_radar
  title: 'Who Is in data center cooling,

    and who is not part of it?'
  TL:
    name: Trane Technologies
    src: ../../assets/logos/pp_live/data-center-cooling/s01-00.png
    text: backs LiquidStack and sells data center chillers, but most of its sales come from heating and cooling buildings
  TR:
    name: Equinix
    src: ../../assets/logos/pp_live/data-center-cooling/s01-02.png
    text: offers liquid cooling in over 100 of its sites for AI clients, but it uses that gear to run its sites, not to sell it
  BL:
    name: Supermicro
    src: ../../assets/logos/pp_live/data-center-cooling/s01-10.png
    text: offers its own cold plates and coolant units, but it sells them inside full server racks, so cooling is a feature
  BR:
    name: Ecolab
    src: ../../assets/logos/pp_live/data-center-cooling/s01-11.png
    text: bought liquid cooling maker CoolIT Systems in July 2026, but water treatment and hygiene services remain its core business
  caption:
  - Distance to the center reflects how much of a business is built around removing heat from servers and other data center hardware
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
