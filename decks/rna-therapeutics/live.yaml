ed148p:
  title: 'What pushed the RNA therapeutics

    market forward, year after year?'
  events:
  - year: '1961'
    text: Messenger RNA reveals protein instructions
    impact: 0.5
  - year: '1978'
    text: Antisense concept enables RNA targeting
    impact: 1.0
  - year: '1990'
    text: Injected mRNA makes protein in vivo
    impact: 1.5
  - year: '1993'
    text: Antisense splicing control becomes practical
    impact: 1.0
  - year: '1998'
    text: First antisense drug wins approval
    impact: 2.5
  - year: '1998'
    text: RNA interference reveals silencing engine
    impact: 2.0
  - year: '2001'
    text: siRNA works in mammalian cells
    impact: 1.5
  - year: '2004'
    text: Macugen validates RNA aptamer drugs
    impact: 1.0
  - year: '2006'
    text: LNP delivery silences genes in primates
    impact: 1.5
  - year: '2010'
    text: RNAi mechanism confirmed in humans
    impact: 2.0
  - year: '2012'
    text: Ionizable lipids improve RNA delivery
    impact: 1.5
  - year: '2013'
    text: Clinical TTR knockdown proves potency
    impact: 1.5
  - year: '2014'
    text: GalNAc simplifies liver RNA delivery
    impact: 2.0
  - year: '2016'
    text: Spinraza validates splice switching
    impact: 2.0
  - year: '2018'
    text: Onpattro becomes first siRNA drug
    impact: 3.0
  - year: '2019'
    text: Givlaari validates GalNAc siRNA
    impact: 1.5
  - year: '2020'
    text: COVID vaccines prove mRNA at scale
    impact: 3.0
  - year: '2020'
    text: Oxlumo broadens siRNA rare disease use
    impact: 1.0
  - year: '2021'
    text: Inclisiran brings siRNA to cardiology
    impact: 2.0
  - year: '2022'
    text: Vutrisiran improves convenient TTR dosing
    impact: 1.5
  - year: '2023'
    text: Qalsody validates antisense in ALS
    impact: 1.5
  - year: '2023'
    text: Nedosiran adds another GalNAc approval
    impact: 1.0
  - year: '2023'
    text: Wainua expands TTR RNA treatment choice
    impact: 1.0
  - year: '2024'
    text: mResvia extends mRNA beyond COVID
    impact: 2.0
  - year: '2024'
    text: Extrahepatic delivery gains momentum
    impact: 1.5
  - year: '2025'
    text: Redemplo adds quarterly siRNA dosing
    impact: 1.5
  - year: '2025'
    text: Fitusiran broadens RNAi into hemophilia
    impact: 1.5
  - year: '2026'
    text: Bepirovirsen wins hepatitis B approval
    impact: 2.0
  - year: '2026'
    text: Updated mRNA vaccines keep platform current
    impact: 1.0
  - year: '2026'
    text: Extrahepatic RNAi reaches human proof
    impact: 2.0
  note:
  - We kept the events we believe pushed rna therapeutics forward the most
  - Ratings are our estimates, with all the sources at the end of the report
