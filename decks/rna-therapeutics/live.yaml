ed007p:
  type: pp_radar
  title: 'Who Is In RNA therapeutics,

    and who stays outside?'
  TL:
    name: CRISPR Therapeutics
    src: ../../assets/logos/pp_live/rna-therapeutics/s01-00.png
    text: edits DNA rather than using RNA as the therapeutic agent or directly targeting RNA to change activity
  TR:
    name: 10x Genomics
    src: ../../assets/logos/pp_live/rna-therapeutics/s01-02.png
    text: measures RNA and gene expression for research but does not develop RNA based therapeutic medicines
  BL:
    name: BioNTech
    src: ../../assets/logos/pp_live/rna-therapeutics/s01-09.png
    text: develops mRNA therapeutics and vaccines, while also operating cell therapy and antibody oncology programs
  BR:
    name: Moderna
    src: ../../assets/logos/pp_live/rna-therapeutics/s01-10.png
    text: built its business on MRNA medicines, while a large share of revenue remains concentrated in vaccines
  caption:
  - Distance to the center reflects how central each company is to RNA therapeutics
  - The companies shown are a representative sample, not an exhaustive list, chosen to show where the market's boundaries lie
  inside:
